<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1424">
<title>Tender Titan</title>
<style>
:root{--ink:#f4ead2;--dim:#b9b1a0;--gold:#f2c14e;--gold2:#ffdf8a;--teal:#4fd1c5;--rose:#ff7a6b;--navy:#0b1424;--panel:rgba(12,22,40,.86);--line:rgba(242,193,78,.35);
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);overflow:hidden;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
#ui .menu,#ui .card,#ui .menu *{pointer-events:auto}
.hidden{display:none!important}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border-radius:.9em;background:#222c3d;border:1px solid #5a6680;color:#fff;font:700 .8em/1 inherit;font-family:inherit;vertical-align:.08em}
kbd.k-A{background:#3e9b3a;border-color:#7bd477}kbd.k-B{background:#c0392b;border-color:#f08070}kbd.k-X{background:#2c6fc9;border-color:#78aaf0}kbd.k-Y{background:#c99a14;border-color:#f5d36c;color:#1b1400}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--gold);font-weight:800;letter-spacing:.3em;z-index:50;background:var(--navy)}
.err{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#5b1d1d;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
/* HUD */
.hud{position:absolute;inset:0;padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl))}
.meters{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + var(--st));display:flex;gap:16px;align-items:center;background:rgba(8,14,26,.55);padding:7px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.meter{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px;letter-spacing:.12em}
.meter .bar{width:min(150px,22vw);height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .35s}
.meter.help span,.meter.help b{color:var(--teal)}.meter.help i{background:linear-gradient(90deg,#2bb3a7,#9ff4e9)}
.meter.havoc span,.meter.havoc b{color:var(--rose)}.meter.havoc i{background:linear-gradient(90deg,#f0603f,#ffb199)}
.meter b{min-width:2.2em;font-size:14px}
.patience{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.patience em{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.patience em.lost{background:#40394a;box-shadow:none}
.lvlname{position:absolute;left:calc(14px + var(--sl));top:calc(12px + var(--st));font-weight:800;color:var(--gold);letter-spacing:.05em;text-shadow:0 2px 6px #000}
.goals{position:absolute;left:calc(14px + var(--sl));top:calc(38px + var(--st));margin:0;padding:0;list-style:none;max-width:min(330px,42vw)}
.goals li{position:relative;background:rgba(8,14,26,.6);margin:0 0 5px;padding:6px 10px 7px 30px;border-radius:9px;font-size:13px;overflow:hidden;border-left:3px solid var(--gold)}
.goals li.opt{border-left-color:#e889c4;color:#f5d9ea}
.goals li .ck{position:absolute;left:10px;top:6px;color:var(--gold)}.goals li.opt .ck{color:#e889c4}
.goals li.done{opacity:.6;text-decoration:line-through}.goals li.done .ck{color:#7be37b}.goals li.failed{opacity:.5}.goals li.failed .ck{color:var(--rose)}
.goals li em{font-style:normal;color:var(--gold2);font-weight:700}
.goals li i{position:absolute;left:0;bottom:0;height:3px;background:var(--teal)}
.timer{position:absolute;right:calc(16px + var(--sr));top:calc(14px + var(--st));font:800 18px/1 ui-monospace,Menlo,monospace;color:var(--ink);text-shadow:0 2px 6px #000}
.timer.urgent{color:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.prompt{position:absolute;left:50%;bottom:calc(22px + var(--sb));transform:translateX(-50%);background:rgba(8,14,26,.7);padding:8px 16px;border-radius:20px;font-weight:600;white-space:nowrap}
.prompt:empty{display:none}
.prompt .frag{color:var(--rose)}
.reticle{position:absolute;left:50%;top:44%;width:10px;height:10px;margin:-5px;border:2px solid rgba(255,240,200,.5);border-radius:50%}
.toasts{position:absolute;right:calc(14px + var(--sr));top:calc(46px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(360px,60vw)}
.toast{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:13px;animation:tin .25s ease-out;transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateX(20px)}
.toast.bad{border-color:var(--rose);color:#ffd2cc}.toast.warn{border-color:#ffb347}.toast.gold{border-color:var(--gold);color:var(--gold2)}.toast.help{border-color:var(--teal);color:#c9fff9}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.pops{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;top:40%;transform:translateX(-50%);font-weight:900;font-size:20px;text-shadow:0 2px 8px #000;animation:rise 1.3s ease-out forwards}
.pop.help{color:var(--teal)}.pop.havoc{color:var(--rose)}
@keyframes rise{0%{opacity:0;margin-top:20px}15%{opacity:1}100%{opacity:0;margin-top:-90px}}
.flashmsg{position:absolute;left:0;right:0;top:28%;text-align:center;font-weight:900;font-size:clamp(28px,6vw,56px);color:var(--gold2);text-shadow:0 0 22px rgba(242,193,78,.7),0 3px 10px #000;opacity:0}
.flashmsg.show{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.padstatus{position:absolute;right:calc(14px + var(--sr));bottom:calc(10px + var(--sb));font-size:11px;color:var(--dim);opacity:.8}
/* festival */
.fest{position:absolute;left:50%;bottom:calc(70px + var(--sb));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:86px;height:86px;border-radius:50%;border:4px solid var(--gold);display:grid;place-items:center;box-shadow:0 0 24px rgba(242,193,78,.5);background:rgba(8,14,26,.5)}
.ring-in{position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(255,255,255,.8);transition:transform .05s linear}
.cue{font-size:28px;font-weight:900}
.cue.c-A{color:#7bd477}.cue.c-B{color:#f08070}.cue.c-X{color:#78aaf0}.cue.c-Y{color:#f5d36c}.cue.c-RT,.cue.c-LB{color:#fff}
.judge{height:30px;margin-top:8px;font-weight:900;font-size:22px}.judge.perfect{color:var(--gold2)}.judge.good{color:var(--teal)}.judge.miss{color:var(--rose)}
.combo{font-weight:700;color:var(--dim);height:18px}
.fbar{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:6px;overflow:hidden}.fbar i{display:block;height:100%;background:var(--gold)}
/* level card */
.card{position:absolute;inset:0;display:grid;place-items:center;z-index:35;background:radial-gradient(transparent 30%,rgba(5,9,18,.55));pointer-events:auto}
.cardin{max-width:min(560px,90vw);text-align:center;animation:tin2 .5s ease-out}
.cardin h1{margin:.1em 0;font-size:clamp(30px,6vw,52px);color:var(--gold2);text-shadow:0 3px 18px #000;letter-spacing:.02em}
.cardin p{font-size:clamp(15px,2.2vw,18px);text-shadow:0 2px 8px #000;margin:.4em 0}
.cardin .tip{color:var(--gold);font-style:italic}
.cd{font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--teal);text-transform:uppercase}
.bestm{margin-top:8px;color:var(--dim)}
.go{margin-top:14px;font-weight:800}
@keyframes tin2{from{opacity:0;transform:translateY(16px)}}
/* menus */
.menu{position:absolute;inset:0;display:grid;place-items:center;z-index:40;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));overflow:auto}
.panel{width:min(460px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-height:calc(100dvh - 24px);overflow:auto}
.panel.wide{width:min(820px,96vw)}.panel.map{width:min(980px,97vw)}
.panel h2{margin:0 0 4px;color:var(--gold2);font-size:26px}.panel h3{margin:10px 0 6px;color:var(--gold);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.panel .sub{color:var(--dim);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--ink);font:600 16px/1.2 inherit;font-family:inherit;text-align:left;cursor:pointer;min-height:48px}
.mi.sel{background:linear-gradient(90deg,rgba(242,193,78,.28),rgba(242,193,78,.08));border-color:var(--gold);color:#fff;transform:translateX(3px)}
.mi.dis{opacity:.45}
.mi .val{display:flex;align-items:center;gap:10px;color:var(--gold2)}.mi .val i{font-style:normal;padding:0 6px;font-size:20px;color:var(--dim)}
.hint{margin-top:12px;color:var(--dim);font-size:12px;text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:620px){.cols{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.06)}td:first-child{white-space:nowrap;width:1%}
.note{color:var(--dim);font-size:13px}
.title{text-align:center;align-self:end;margin-bottom:9vh;pointer-events:auto}
.logo{font-weight:900;font-size:clamp(54px,13vw,128px);line-height:.86;letter-spacing:.04em;background:linear-gradient(180deg,#fff3c7 0%,#f2c14e 45%,#b8761c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 20px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(242,193,78,.3))}
.logo.small{font-size:30px;margin-bottom:6px}
.tag{margin-top:14px;font-size:clamp(14px,2.4vw,20px);color:var(--ink);text-shadow:0 2px 8px #000}
.press{display:inline-block;margin-top:26px;font-weight:800;font-size:clamp(16px,2.6vw,22px);animation:breathe 2.2s ease-in-out infinite;cursor:pointer;padding:10px 18px}
@keyframes breathe{50%{opacity:.45}}
.credits{margin-top:22px;font-size:11px;color:var(--dim);text-shadow:0 1px 4px #000}
.dist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.drow{display:flex;gap:10px;align-items:stretch}@media (max-width:700px){.drow{flex-direction:column}}
.dname{width:150px;flex:none;font-weight:800;color:var(--gold);font-size:14px}.dname small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex:1}@media (max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;min-height:64px}
.tile .num{font-weight:900;color:var(--teal);font-size:12px}.tile .nm{font-size:12px;font-weight:600;line-height:1.15}.tile .md{font-size:11px;color:var(--dim);margin-top:auto}
.tile.fest{background:rgba(242,193,78,.1)}.tile.fest .num{color:var(--gold)}
.tile.locked{opacity:.4}.tile.sel{border-color:var(--gold);background:rgba(242,193,78,.25);transform:scale(1.04)}
.tile.m3 .md{color:#9ff4e9}.tile.m2 .md{color:var(--gold2)}
.results .medal{font-size:64px;text-align:center;line-height:1;margin:8px 0}.results .medal span{display:block;font-size:20px;font-weight:900;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.results.m3 .medal span{color:#9ff4e9}
.results .why{color:#ffd2cc}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.stats div{background:rgba(255,255,255,.06);padding:6px 12px;border-radius:10px;text-align:center}.stats span{display:block;font-size:11px;color:var(--dim)}.stats b{font-size:18px}
.results ul{margin:0;padding:0;list-style:none;font-size:13px}.results li b{color:var(--gold2)}.results li.none{color:var(--dim)}
.results .tip{color:var(--gold);font-size:13px}
</style>
</head>
