<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0906">
<title>Clockwork Heist</title>
<style>
:root{color-scheme:dark;--ink:#0b0906;--brass:#c9a45c;--brass2:#f1d590;--cream:#f3e8cf;--red:#b8322a;--teal:#5fb7b0}

:root[data-theme="light"]{--ink:#0b0906}
:root[data-theme="dark"]{--ink:#0b0906}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#hud{z-index:10;pointer-events:none}
#touch{z-index:20;pointer-events:none}
#ui{z-index:30;pointer-events:none}
#cut{z-index:40;pointer-events:none}
#boot::after{content:attr(data-step);display:block;margin-top:12px;font-size:11px;opacity:.6;text-align:center}
#boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--ink);color:var(--brass);letter-spacing:.4em;font-size:14px;transition:opacity .6s}
</style>

.ctx.resume();t&&t.catch&&t.catch(()=>{})}}catch{}}),!0},unlock(){if(!H.ctx&&!et.init())return;let n=H.ctx;H.unlocked=!0;try{let e=n.createBuffer(1,1,22050),t=n.createBufferSource();t.buffer=e,t.connect(n.destination),t.start(0)}catch{}try{if(n.state!=="running"&&n.resume){let e=n.resume();e&&e.then&&e.then(()=>Ws(),()=>{})}}catch{}Ws()},setMaster(n){H.vol.master=Cn(jn(n,H.vol.master),0,1),Ws()},setMusicVol(n){H.vol.music=Cn(jn(n,H.vol.music),0,1),Ws()},setSfxVol(n){H.vol.sfx=Cn(jn(n,H.vol.sfx),0,1),Ws()},music(n){n=n&&es[n]?n:null,!(n===H.songKey&&(H.song||H.songDirty))&&(H.songKey=n,H.songDirty=!0,n&&!es[n].fixed&&(H.iTarget=0,H.iSm=0))},setIntensity(n){H.iTarget=Cn(jn(n,0),0,1)},sting(n){if(!(!Ir()||!Gu[n]))try{Gu[n](H.ctx.currentTime+.02,H.n.sfx)}catch{}},sfx(n,e){if(!(!Ir()||!Wu[n]))try{if(!Lr(60))return;let t=Rx(e);if(t.v<=.001)return;Wu[n](H.ctx.currentTime+.005,t.g)}catch{}},setListener(n,e){H.lx=jn(n,H.lx),H.lz=jn(e,H.lz)},ambience(n){n=n&&$u[n]?n:null,!(n===H.ambKey&&(H.amb||H.ambDirty))&&(H.ambKey=n,H.ambDirty=!0)},get ready(){return Ir()},tunes(){return Object.keys(es).map(n=>({key:n,name:es[n].name}))}};var xi="Narrator",Gi={intro:[{speaker:xi,line:"Port Meridian, 1926. A city that runs on bathtub gin, back-room handshakes, and clocks nobody trusts.",cam:"wide",sfx:"thunder"},{speaker:xi,line:"Midnight, the night of the harbor gala. Councilman Harlan Pryce stepped into his study for a quiet cigar. He never finished it.",cam:"push",sfx:"gunshot_distant"},{speaker:"Vane",line:"Such a tragedy. Harlan always did say he would die for this city. I merely helped him keep his word.",mood:"smirk",cam:"close"},{speaker:"Magpie",line:'The watch-key is on the carpet, Mr. Vane. Engraved "A. Fell." Shall I gift-wrap the old man for the coppers too?',mood:"smirk",cam:"pan"},{speaker:"Vane",line:"No need, Miss Sloane. The police adore a parcel that comes pre-tied.",mood:"smirk"},{speaker:"Graves",line:"Augustin Fell, watchmaker. Your key, your fingerprints, your motive. Pryce owed you money, did he not?",mood:"grim",cam:"close",sfx:"brass"},{speaker:"Fell",line:"He owed me for a mantel clock, Mr. Graves. Eleven dollars. I have forgiven worse debts over breakfast.",mood:"grim"},{speaker:"Graves",line:"Save the charm for the jury. Trial in five days. I would start winding down, old man.",mood:"smirk"},{speaker:xi,line:"County Jail, visiting hours. Four regrettable people in their Sunday best squeeze onto one bench.",cam:"wide",sfx:"tick"},{speaker:"Lou",line:"Augie. You look terrible. Say the word and I crack this whole jail like a walnut.",mood:"grim",cam:"pan"},{speaker:"Fell",line:"Louis, you would get as far as the lobby and stop to admire the vault. No. I have something better.",mood:"smirk"},{speaker:"Fell",line:"My last invention. The Repeater. Wind the crown and you will live the same five minutes again. And again. And again.",cam:"close",sfx:"tick"},{speaker:"Ozzie",line:"Good heavens. A closed temporal escapement. Augustin, I could kiss you. I will not. The guard is watching. But spiritually: kissed.",mood:"shock"},{speaker:"Fell",line:"Rules, children. Each loop, the you that came before stays behind as a ghost and does exactly what you did. Use them. Stack them like cards.",cam:"push"},{speaker:"Fell",line:"Rewinding costs time on the real clock. Three hours a loop. Get caught, and the shock of it eats eight. Five days is all I have.",mood:"grim"},{speaker:"Vivian",line:"So we rob the city blind, a few minutes at a time, and the clock is the only one allowed to take a cut. Darling, I adore it.",mood:"smirk"},{speaker:"Kit",line:"Five minutes is plenty. I once escaped a lion in four. Granted, it was an elderly lion.",mood:"smirk"},{speaker:"Fell",line:"Find the truth about Cornelius Vane. Bring it to the courtroom. And please, come home every loop. Even the ones that do not count.",cam:"close"},{speaker:xi,line:"Five days to the verdict. One stolen watch. A city full of locks. The clock is already running.",cam:"wide",sfx:"brass"}],levels:{bank:{pre:[{speaker:xi,line:"First Mercantile Bank, Harbor Street. Five minutes to midnight, and the rain is working overtime.",cam:"wide",sfx:"thunder"},{speaker:"Vivian",line:'Vane keeps safe-deposit box 1926 here. Paid in cash, under the name "Mr. Charity." Subtle as a brass band.',mood:"smirk",cam:"pan"},{speaker:"Ozzie",line:"Inside: the land-deed ledger. Every harbor lot Vane stole, with Pryce's forged signature beside it. Pryce found out. Hence, the cigar.",mood:"grim"},{speaker:"Lou",line:"Vault is a Hollister Triple-Throw. Three tumblers, real sweet action. But the second I touch the dial, the alarm sings.",cam:"close"},{speaker:"Ozzie",line:"Then somebody cuts the alarm first. Me. I am somebody. I have a pair of pliers and a deeply unreasonable confidence.",mood:"smirk"},{speaker:"Kit",line:"You cannot do both in five minutes, though. Too many coppers, too many corridors.",mood:"grim"},{speaker:"Fell",line:"Then do not do both at once. Let one loop cut the wire. Let your ghost do it again while the next of you opens the safe.",cam:"push",sfx:"tick"},{speaker:"Lou",line:"Workin' with my own ghost. My ma always said I'd end up haunting a bank.",mood:"smirk"}],post:[{speaker:"Lou",line:"One ledger, slightly damp, entirely damning. And I didn't even hum the sad song this time.",mood:"smirk",cam:"close",sfx:"brass"},{speaker:"Ozzie",line:"Every lot on the harbor, every forged signature. It is not a ledger, it is a confession with page numbers.",mood:"shock"},{speaker:"Vane",line:"Box 1926 is empty? How very rude. Miss Sloane, someone in this city is learning to tell time.",mood:"grim",cam:"push"},{speaker:"Magpie",line:"Then I will teach them to run out of it.",mood:"smirk"}],caught:["Hey! You're not the night janitor... are you? You're far too clean.","Freeze! The bank is closed. Unless you're here to open an account. In which case, still freeze.","Twenty-two years on the beat, and you walk in front of my flashlight. Thank you. Honestly.","Hands where I can see 'em! Not that high, you're scaring the chandelier.","Sarge said nothing ever happens on the graveyard shift. Sarge owes me a nickel.","Halt! In the name of the First Mercantile Bank and its many valued depositors!","I knew I heard tumblers. My mother said I had the ears of a safe and the brains of a doorstop.","Nobody moves! I've been practicing that line in the mirror for six years.","A burglar? On my watch? I don't even own a watch!"],banter:["Lou: Hear that? Click... click... that's the sound of a vault saying yes.","Ozzie: Red wire, blue wire... why is there a green wire? Who invited the green wire?","Kit: Officer Dooley's walking the same route as last loop. Bless him. A man of routine.","Vivian: Darling, if you're going to sneak, at least do it with some posture.","Lou: Hey, that ghost of me's got lousy footwork. Did I always walk like a filing cabinet?","Ozzie: My ghost cut the wire! Oh, I'm so proud of me. Well, of him. Of us. Science!","Kit: Rain's loud enough to cover a tap dance. Not that I'm going to. Probably.","Lou: Box 1926. Vane picked his own birth year? This guy's ego needs its own vault.","Vivian: Five minutes, two coppers, one fortune. I've had dates with worse odds."]},speakeasy:{pre:[{speaker:xi,line:"The Gilded Cage. Behind a florist's shop, beneath a church bake sale, three flights down from the law.",cam:"wide",sfx:"brass"},{speaker:"Vivian",line:"Vane owns this joint through six dummy companies and a parrot. Every case of rum he smuggles is written in the back-office ledger.",mood:"smirk",cam:"pan"},{speaker:"Kit",line:"And the bartender, Sal Okafor, was pouring drinks for Vane the night Pryce died. He knows who left the gala early.",cam:"close"},{speaker:"Lou",line:"Sal won't talk while Vane's goons are breathin' on him. And there's two bouncers built like pianos on that office door.",mood:"grim"},{speaker:"Vivian",line:"Bouncers are simple creatures. Flatter the hat, question the shoes, and announce a police raid in a convincing Belgian accent.",mood:"smirk"},{speaker:"Ozzie",line:"Meanwhile the office lock is a cheap Ferris Model 4. One small charge. Very small. Medium. Fine, it's going to be loud.",mood:"shock"},{speaker:"Fell",line:"Velvet talks, someone else walks. One of you keeps the bouncers busy, the other lifts the ledger and gets Sal to safety.",cam:"push",sfx:"tick"}],post:[{speaker:"Vivian",line:"One bootleg ledger and one bartender who suddenly remembers everything. It's amazing what a clean exit does for the memory.",mood:"smirk",cam:"close"},{speaker:"Kit",line:`Sal says Vane's private car on the Meridian Limited carried "something wrapped in a towel" out of town that night.`,mood:"grim"},{speaker:"Vane",line:"My little birdcage, picked clean. Miss Sloane, the glove. Put it on the train, and do not let it out of your sight.",mood:"grim",cam:"push",sfx:"train_whistle"},{speaker:"Magpie",line:"Relax, Cornelius. Nobody catches a train I'm riding.",mood:"smirk"}],caught:["Password? ...That's not the password. That's a sneeze.","Hey! Staff only! And you're not staff. Staff has a moustache. I'd know, I'm staff.","Mr. Vane said no funny business. You look like funny business in a hat.","Whoa, whoa! The office is off limits. Also, you owe two bits for that olive.","I never forget a face. I forget names, birthdays, my own address... but faces? Never.","Back to the dance floor, sweetheart. Oh wait, you're the one I'm supposed to catch.","Stop right there! I just had this suit pressed and I will not be chasing anybody in it.","Ha! Thought you could sneak past Big Theo? Nobody sneaks past Big Theo. Except twice last Tuesday.","Sal! Call the boss! ...Sal? Why is Sal looking at me like that?"],banter:["Vivian: Watch and learn. Bonsoir, monsieur. Your shoes are a crime and I am here to arrest them.","Kit: The band's playing a little hot. Good. Nobody hears a lock pop over a trombone solo.","Ozzie: If anyone asks, I am the new ice delivery. Very cold. Very... ice.","Lou: Smell that gin? You could strip paint with it. Actually, I think they did.","Vivian: My ghost is flirting with Big Theo. Honestly, she's better at me than I am.","Kit: Sal winked at me. Either he's on our side or he's got something in his eye.","Ozzie: Charge is set! Probably. Everyone cover your ears. And your eyebrows.","Lou: Ledger says Vane bought forty crates of 'cough syrup.' This whole city's got a cough.","Vivian: Darling, a con is just a lie with good tailoring."]},train:{pre:[{speaker:xi,line:"The Meridian Limited. Sixty miles an hour, two hundred tons of steel, and one very fashionable thief aboard.",cam:"wide",sfx:"train_whistle"},{speaker:"Kit",line:"The luggage car holds Magpie's trunk. Inside, a kid glove with Pryce's blood on it, and Vane's monogram on the cuff.",cam:"pan"},{speaker:"Lou",line:"Conductor locks the connecting doors at speed. Every corridor's got a porter who takes his job way too personal.",mood:"grim"},{speaker:"Kit",line:"So we don't use the corridors. Roof, vents, a little light trapeze over a ravine. You know. Tuesday.",mood:"smirk",cam:"close"},{speaker:"Ozzie",line:"For the record, as a man of science, I am vigorously opposed to anyone standing on a moving train.",mood:"shock"},{speaker:"Magpie",line:"Little acrobat. I have been watching your loops. You are not the only one who knows where the seams in time are.",mood:"smirk",cam:"push"},{speaker:"Fell",line:"She can feel the Repeater, I think. Be quicker than she expects. Be stranger than she expects. That part should come easily.",sfx:"tick"},{speaker:"Kit",line:"Strange and quick is my whole act. Somebody hold my hat.",mood:"smirk"}],post:[{speaker:"Kit",line:'One bloodied glove, monogram "C.V.", and only a tiny bit of soot in my teeth. Ta-da.',mood:"smirk",cam:"close",sfx:"brass"},{speaker:"Magpie",line:"You took it right out from under me. Do you know how long it has been since anyone did that?",mood:"shock"},{speaker:"Kit",line:"A while, I'd guess. You should get out more. Maybe change sides. The pay's worse but the company's delightful.",mood:"smirk"},{speaker:"Vane",line:"A glove is just a glove, Miss Sloane, until it is evidence. Tomorrow night I host a party. Make certain nothing else goes missing.",mood:"grim",cam:"push"}],caught:["Tickets, please! ...That's a playing card. The jack of clubs is not a ticket.","Hey! No climbing in the luggage racks! Last fella who did that is still in Albany.","You're under arrest by the full authority of the Meridian Limited Railway Company and its dining car!","I've worked this line nineteen years. Never seen a stowaway. Until now. Thank you, I'm thrilled.","Off the roof! You'll get soot on the passengers!","Caught you red-handed! Well, soot-handed. It's a train.","Is that a person in the vent? Agnes, come look, there's a person in the vent!","Halt! Or... wait, we're going sixty. Where were you even gonna go?","Next stop: the county lockup. All aboard, friend."],banter:["Kit: Wind in my hair, cinders in my eye. Livin' the dream.","Lou: Kid, if you fall off this train I'm not goin' back for you. ...I'm goin' back for you. Don't fall.","Ozzie: The vents run the length of the car! Marvelous engineering. Terrible smell.","Kit: Porter's on his third sandwich. Man's got priorities. Respect.","Vivian: Darling, I booked us first class. It's so much easier to rob people who tip.","Kit: My ghost just did a backflip I don't remember doing. Show-off.","Lou: Tunnel coming! Duck, or become a very flat acrobat.","Ozzie: Magpie's on the move! She's fast. She's very fast. Why is everyone in this city faster than me?","Kit: Hey Magpie, nice mask. Matches your conscience. Mostly missing."]},mansion:{pre:[{speaker:xi,line:"Vane Hall, on the cliffs above the harbor. Tonight: the Founders' Ball. Champagne fountains, a string quartet, and two hundred liars in pearls.",cam:"wide",sfx:"brass"},{speaker:"Vane",line:"Welcome, friends! Tonight we raise money for the widows of Port Meridian. I have personally created quite a few of them.",mood:"smirk",cam:"close"},{speaker:"Ozzie",line:"The key found by Pryce's body is a copy, cut on Vane's own lathe. The master pattern sits in his study, stamped with his crest. Swap them.",cam:"pan"},{speaker:"Lou",line:"And his wall safe holds the payment slip for the hired gun. Can't steal it without tipping him. So we photograph it.",mood:"grim"},{speaker:"Vivian",line:"I'll charm the butler, Ozzie kills the lights, Lou opens the safe, Kit takes pictures from the chandelier. Everybody gets a turn.",mood:"smirk"},{speaker:"Kit",line:"From the chandelier? I love this plan. I love it so much it worries me.",mood:"shock"},{speaker:"Fell",line:"Take his master, leave a blank in his drawer. Let the liar keep his lie, and we will keep the truth.",cam:"push",sfx:"tick"},{speaker:"Magpie",line:"He trusts me with every room in this house. I could stop you. I am... thinking about it.",mood:"grim",cam:"close"}],post:[{speaker:"Lou",line:"His crested master key in my pocket, a blank in his drawer, and six good pictures of a very guilty slip of paper.",mood:"smirk",cam:"close",sfx:"brass"},{speaker:"Vivian",line:"And the butler proposed to me. Twice. I said I'd think about it. I won't.",mood:"smirk"},{speaker:"Magpie",line:"I saw the photograph flash. I did not raise the alarm. Do not make me regret that, acrobat.",mood:"grim",cam:"pan"},{speaker:"Vane",line:"Someone was in my study. Nothing is missing, yet everything feels... rearranged. Graves! I want that trial moved up.",mood:"shock",cam:"push"},{speaker:"Graves",line:"It's already tomorrow morning, Cornelius. Relax. My exhibit seals it. The jury loves a shiny key.",mood:"smirk"}],caught:["Pardon me, sir, the party is that way. And the jail is that way. Guess which one you're going to.","You there! Guests do not crawl. Guests glide.","I've buttled for thirty years. I know a guest from a burglar. Guests don't hold their breath that long.","Is that the family silver in your pocket? ...Oh, it's a camera. That's worse, actually.","Excuse me, madam, the study is private. Also, you are standing on the dog.","Mr. Vane! Mr. Vane! There's a person where a person shouldn't be!","Caught you! I'll have you know I was nearly a detective. Then I was a butler. It's similar. Fewer guns.","Your invitation, please. ...This is a laundry ticket.","Stop! You're dripping champagne on a seventeenth-century rug!"],banter:["Vivian: The Countess of Lower Wessex, at your service. Yes, it's a real place. Very lower.","Ozzie: Lights out in three, two... oh, that was the fountain. Everyone's very wet now.","Kit: Chandelier's holding. Mostly. It's making a noise I'd describe as 'pre-falling.'","Lou: Wall safe's a Kessler Duchess. Fancy. Like opening a jewelry box with a temper.","Vivian: Vane just kissed my hand. I need to wash it in something strong. Like the harbor.","Ozzie: My ghost and I are now coordinating with the precision of a fine watch. Augustin would be proud!","Kit: Magpie saw me. She didn't call it in. Huh. Maybe she's got a heart under all that silver.","Lou: Quartet's playin' a waltz. I'll crack in three-four time. Classy.","Vivian: Darling, nobody notices a thief at a party. They're all too busy being one."]},courthouse:{pre:[{speaker:xi,line:"Port Meridian County Courthouse. The night before the verdict. Marble halls, sleeping clerks, and one very tired night watchman.",cam:"wide",sfx:"thunder"},{speaker:"Fell",line:"They moved me to the holding cell downstairs. I can hear you planning through the radiator. Please plan more quietly.",mood:"smirk",cam:"close"},{speaker:"Lou",line:"Graves is gonna wave Vane's forged key at the jury tomorrow. Exhibit Twelve. It's sittin' in the evidence room.",mood:"grim",cam:"pan"},{speaker:"Ozzie",line:"We swap his fake exhibit for Vane's crested master, and put our evidence into the official record before the doors open."},{speaker:"Vivian",line:"Legally speaking, this is a felony. Morally speaking, it's housekeeping.",mood:"smirk"},{speaker:"Kit",line:"Evidence room's triple-locked, the clerk logs every visitor, and the watchman sleeps with one eye open. Literally. It's unsettling.",mood:"shock"},{speaker:"Magpie",line:"Vane sent me to burn the evidence room before dawn. I have not decided yet whose side my matches are on.",mood:"grim",cam:"push"},{speaker:"Fell",line:"Everything you have learned, all at once now. Every ghost you have. The last five minutes we will ever need.",cam:"close",sfx:"tick"}],post:[{speaker:"Ozzie",line:"Exhibit Twelve is now the genuine article, and our evidence is filed, stamped and initialled by a clerk who was asleep. Glorious.",mood:"smirk",cam:"close",sfx:"brass"},{speaker:"Magpie",line:"I struck the match. Then I blew it out. Do not ask me why. I am still working that out myself.",mood:"grim",cam:"pan"},{speaker:"Vane",line:"Not one ash. Not one ember. Miss Sloane, where were you tonight?",mood:"shock",cam:"push"},{speaker:"Magpie",line:"Telling time, Cornelius. It turns out I am very good at it.",mood:"smirk",sfx:"gavel"}],caught:["Who goes there? The court is closed! Justice is sleeping, and so was I!","Hey! Evidence room is for evidence! You are not evidence! ...Yet.","I've guarded this courthouse since the Coolidge administration. Well, since last March.","Halt! You're in contempt of court! I think. Is that how it works? It feels like it should work.","Hands up! Also, could you sign the visitor log? The clerk gets very upset.","I wasn't asleep! I was inspecting the inside of my eyelids for intruders. Found one!","Breaking into a courthouse? That's like robbing a church. Except the church has better locks.","Freeze! Somebody fetch the judge! No, don't, she's terrifying.","Well, well. Looks like you'll be visiting the courtroom a little early, pal."],banter:["Ozzie: Exhibit Twelve. Let's give it a little... promotion.","Vivian: The clerk thinks I'm the night stenographer. I typed his name as 'Handsome.' He's thrilled.","Kit: Up the column, along the gallery, down the flagpole. Justice is very climbable.","Lou: Evidence locker's a Sterling Mark Six. Last time I cracked one of these, I was the evidence.","Fell (through the radiator): Louis, you're humming. You always hum when you're nervous.","Ozzie: Four ghosts and us, all in one building. It's practically a family reunion.","Vivian: Darling, if this works, I'm framing the forged key and hanging it over my fireplace.","Kit: Magpie's on the roof. Watching. Not stopping us. I'm choosing to find that romantic.","Lou: Last job, Augie. Then you're comin' home and fixin' my watch like you promised in 1919."]}},finale:[{speaker:xi,line:"Morning. Courtroom Three. Every seat taken, every reporter sharpening a pencil, and a city holding its breath.",cam:"wide",sfx:"gavel"},{speaker:"Calloway",line:"The People versus Augustin Fell. Mr. Graves, you may proceed. Briefly. I have read your opening. I aged.",mood:"grim",cam:"close"},{speaker:"Graves",line:"Ladies and gentlemen, I need only one exhibit. The engraved watch-key found beside the body. Exhibit Twelve!",mood:"smirk",cam:"push"},{speaker:"Graves",line:'...Your Honor, this key does not say "Fell." It says... "Property of C. Vane, Esq." That is not my exhibit.',mood:"shock",sfx:"brass"},{speaker:"Vivian",line:"Your Honor, the defense would like to present a few small items. Some of them we even acquired legally.",mood:"smirk",cam:"pan"},{speaker:"Calloway",line:"I will allow it. And I will not ask follow-up questions until much later.",mood:"smirk"},{speaker:"Calloway",choice:{prompt:"Graves claims the harbor lots were bought fair and square. Present the evidence.",options:["The land-deed ledger from box 1926","A bottle of The Gilded Cage's finest gin","Kit's circus poster (signed)"],answer:0,wrong:"Graves: Objection! That proves only that the defense has excellent taste. Sustained, and confiscated."}},{speaker:"Graves",line:"Forged signatures on every page? A coincidence! Councilman Pryce was a messy signer!",mood:"shock"},{speaker:"Calloway",choice:{prompt:"Graves says Vane had no reason to want Pryce silenced. Present the evidence.",options:["Ozzie's blueprint for a self-buttering toaster","Vane's bootleg ledger, with Sal the bartender's sworn testimony","A photograph of Vivian's good side"],answer:1,wrong:"Graves: Objection! Relevance! Also, I would like one of those toasters."}},{speaker:"Graves",line:"Rum, land and a bartender with a good memory. It still puts nobody in that study with a pistol!",mood:"grim"},{speaker:"Calloway",choice:{prompt:"Who was in the study that night? Present the final piece.",options:["Lou's lucky bowler hat","A sworn affidavit from Officer Dooley about doughnuts",'The bloodied glove from the Meridian Limited, monogrammed "C.V."'],answer:2,wrong:"Graves: Objection! Your Honor, the defense is now simply emptying its pockets."}},{speaker:"Calloway",line:"The court calls Cornelius Vane to the stand. Mr. Vane, do take off your gloves. Oh. You seem to be missing one.",mood:"smirk",cam:"close",sfx:"gavel"},{speaker:"Vane",line:"This is absurd. I am a philanthropist! I built the orphanage! I built the hospital! I built the\u2014",mood:"grim",cam:"push"},{speaker:"Magpie",line:"You built the pistol, Cornelius. Or rather, you paid me to fetch it, and I kept the receipt.",mood:"smirk",cam:"pan"},{speaker:"Vane",line:"Mirela. You were mine. I bought you. I bought everyone in this room!",mood:"shock",sfx:"thunder"},{speaker:"Calloway",line:"Not everyone, Mr. Vane. And not me.",mood:"grim",sfx:"gavel"},{speaker:"Vane",line:"Fine! Yes! Pryce was going to ruin everything. One little councilman against an empire. I did the city a favor! ...I would like to stop talking now.",mood:"shock",cam:"close"},{speaker:"Calloway",line:"Charges against Augustin Fell are dismissed. Bailiff, Mr. Vane will be needing a new address. Something with bars.",cam:"wide",sfx:"gavel"},{speaker:"Fell",line:"There is one thing nobody asked. Where did Miss Sloane learn to slip through time?",cam:"close",sfx:"tick"},{speaker:"Magpie",line:"Vane stole a prototype from your workshop two years ago. A crude little loop, thirty seconds long. I have been living in its cracks ever since.",mood:"grim"},{speaker:"Fell",line:"Then you are not his anymore, and not the watch's either. Come by the shop. I will fix it properly, and charge you eleven dollars.",mood:"smirk"},{speaker:"Lou",line:"Augie, you're free. You're actually free. I'm not cryin'. It's the courthouse. It's dusty.",mood:"shock",cam:"pan"},{speaker:"Vivian",line:"Five days, five heists, and not one of us arrested in the timeline that counts. I'd call that a career high.",mood:"smirk"},{speaker:"Kit",line:"So what do we do with a watch that can bend time? Asking for a friend. The friend is me.",mood:"smirk"},{speaker:"Ozzie",line:"We give it back to its maker, naturally. Then we steal it back tomorrow. For science.",mood:"smirk"},{speaker:"Fell",line:"You gave an old man his days back. Every one of them. Now come on, children. Supper is on me, and dessert is on time.",cam:"wide",sfx:"brass"},{speaker:xi,line:"That night, in a quiet cell, Cornelius Vane checks his pocket. Inside: a small brass watch that should not exist. It is ticking backwards.",cam:"push",sfx:"tick"},{speaker:"Vane",line:"Five minutes, you said, Augustin? I wonder what a man could do with five years.",mood:"smirk",cam:"close",sfx:"thunder"}],gameover:[{speaker:xi,line:"The clock ran dry. Courtroom Three stood silent as the foreman rose.",cam:"wide",sfx:"gavel"},{speaker:"Calloway",line:"The jury finds the defendant, Augustin Fell... guilty. I am sorry. I truly am.",mood:"grim",cam:"close",sfx:"gavel"},{speaker:"Vane",line:"Such a pity. He made lovely clocks. I may buy one, as a keepsake.",mood:"smirk",cam:"push"},{speaker:"Fell",line:"Do not look so grim, Louis. You know what I always say about a broken watch.",mood:"grim",cam:"close"},{speaker:"Lou",line:"It's right twice a day. Yeah. Yeah, I know.",mood:"grim"},{speaker:"Fell",line:"No. I say it can be wound again. The Repeater still has one more turn in it. Go back. Try it differently.",mood:"smirk",cam:"push",sfx:"tick"},{speaker:xi,line:"Time is not finished with you yet. Wind the crown and try the heist again.",cam:"wide"}],credits:["CLOCKWORK HEIST","Commissioned by Christopher T. Vonderau","","ORIGINAL CAST","Augustin Fell \u2014 the watchmaker",'Lou "Tumbler" Brannigan \u2014 safecracker','Vivian "Velvet" Ashby \u2014 con artist',"Kit Marlowe \u2014 acrobat","Professor Ozzie Pickering \u2014 tinkerer",'Mirela "Magpie" Sloane \u2014 cat burglar',"Cornelius Vane \u2014 philanthropist (allegedly)","Hon. Ruth Calloway \u2014 the judge","D.A. Mortimer Graves \u2014 the prosecutor","Officer Dooley, Big Theo, the Butler, and the night watchman \u2014 themselves","","Music, art and code: original","All characters and events are fictional.","","Thank you for playing."]};var Cx=`
