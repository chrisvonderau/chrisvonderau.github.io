ase-purdy"],"explain":"The local rule bars unapproved post-petition debt and purchases, § 1307(c) supplies dismissal for cause, and Purdy shows bad-faith violations support dismissal with a bar."},{"id":"dc-c3","topic":"dismissal-conversion","level":2,"facts":"Bubba Pruitt's servicer files a stay-relief motion; Bubba moves to dismiss and wants to refile next month.","steps":["usc-1307b","frbp-1017f","usc-109g"],"explain":"§ 1307(b) gives the dismissal, Rule 1017(f)(2) requires a motion, and § 109(g)(2) then raises the 180-day refiling bar (most courts apply it as written; some require a causal link)."},{"id":"ds-c1","topic":"discharge","level":2,"facts":"Bubba Pruitt makes his last plan payment; his file has no course certificate.","steps":["usc-1328g1","frbp-1007b7","frbp-4004c4"],"explain":"The Code requires the course, Rule 1007(b)(7) requires filing the certificate, and Rule 4004(c)(4) forbids the discharge without it."},{"id":"ds-c2","topic":"discharge","level":3,"facts":"After a full-compliance discharge, a debt buyer sues Junie Batts on a discharged card and claims good faith.","steps":["usc-1328a","usc-524a2","case-taggart"],"explain":"§ 1328(a) discharged the card, § 524(a)(2) enjoins the suit, and Taggart supplies the 'no fair ground of doubt' contempt standard."},{"id":"ds-c3","topic":"discharge","level":2,"facts":"Trish Lanier, with a 2023 Chapter 7 discharge, owes child support arrears and asks what a new Chapter 13 can do for her.","steps":["usc-1328f","usc-1328a","usc-523a"],"explain":"§ 1328(f) denies a discharge because of the recent Chapter 7, and even a § 1328(a) discharge would not reach the § 523(a)(5) support debt."},{"id":"ex-c1","topic":"exemptions-estate","level":2,"facts":"Marla Quimby claims her house under the NC list; the trustee thinks the value is understated but waits until day 45 after the § 341 meeting concluded to object.","steps":["usc-522b","ncgs-1c-1601","usc-522l","frbp-4003b1","case-taylor"],"explain":"§ 522(b) and NC's opt-out send her to G.S. 1C-1601, § 522(l) makes unobjected exemptions final, Rule 4003(b)(1) sets 30 days, and Taylor bars the late objection (subject to Schwab if she claimed only a dollar amount)."},{"id":"ex-c2","topic":"exemptions-estate","level":3,"facts":"Earlene Sneed has an ERISA-qualified 401(k) and an inherited IRA.","steps":["usc-541c2","case-patterson","case-clark","ncgs-1c-1601"],"explain":"The 401(k) is excluded under § 541(c)(2) per Patterson; the inherited IRA fails Clark's federal test, so the NC statute's inherited-IRA language is the path."},{"id":"ex-c3","topic":"exemptions-estate","level":3,"facts":"Delbert claims a $2,000 tools exemption on Schedule C-1, the trustee doesn't object, and later finds the tools worth far more.","steps":["lbr-4003-1","usc-522l","case-schwab"],"explain":"EDNC's Schedule C-1 states the claim, § 522(l) makes it final only as claimed, and Schwab lets the estate keep value above the claimed dollar amount without an objection."}],"truefalse":[{"id":"as-t1","topic":"automatic-stay","level":1,"statement":"The Chapter 13 co-debtor stay protects a cosigner on any debt of the debtor, including a loan the cosigner guaranteed in the ordinary course of her own business.","answer":false,"explain":"§ 1301(a) covers only consumer debts and excludes a co-debtor who became liable in the ordinary course of that individual's business."},{"id":"as-t2","topic":"automatic-stay","level":2,"statement":"Under § 362(c)(3)(B), it is enough to file the motion to extend the stay before day 30; the court may hold the hearing afterward.","answer":false,"explain":"§ 362(c)(3)(B) requires notice and a hearing completed before the expiration of the 30-day period (in EDNC, LBR 4001-1(d) can allow a ruling without a hearing if its conditions are met)."},{"id":"as-t3","topic":"automatic-stay","level":3,"statement":"The Fourth Circuit has squarely held that § 362(c)(3)(A) ends the stay only as to the debtor, leaving property of the estate protected.","answer":false,"explain":"No Fourth Circuit decision on this was located as of 2026-11-12; the circuits are split between In re Smith (1st Cir. 2018: entire stay ends) and Rose (5th Cir. 2019: only as to the debtor)."},{"id":"as-t4","topic":"automatic-stay","level":2,"statement":"After City of Chicago v. Fulton, a creditor that merely keeps a vehicle it repossessed before the petition does not violate § 362(a)(3).","answer":true,"explain":"Fulton held that mere retention of estate property after the petition does not violate § 362(a)(3), leaving turnover under § 542 and other subsections open."},{"id":"as-t5","topic":"automatic-stay","level":3,"statement":"Goldman Sachs Bank USA v. Brown is settled: the Supreme Court denied review, so § 362(k) claims can never be sent to arbitration in the Fourth Circuit.","answer":false,"explain":"The Supreme Court granted certiorari on Nov. 6, 2026 (No. 25-1408), so the Fourth Circuit's holding is binding for now but under review."},{"id":"as-t6","topic":"automatic-stay","level":2,"statement":"When the court imposes the stay under § 362(c)(4)(B), the stay relates back to the petition date.","answer":false,"explain":"§ 362(c)(4)(C) makes an imposed stay effective on the date the order is entered, so acts before entry are not stay violations."},{"id":"sr-t1","topic":"stay-relief","level":1,"statement":"On a motion for relief from stay, the movant bears the burden of proof on every issue.","answer":false,"explain":"§ 362(g) puts the burden on the movant only on the debtor's equity; the party opposing relief bears it on all other issues."},{"id":"sr-t2","topic":"stay-relief","level":2,"statement":"After the December 1, 2024 restyling, the 14-day stay of an order granting stay relief is found in FRBP 4001(a)(3).","answer":false,"explain":"It is now Rule 4001(a)(4); former (a)(3) was renumbered in the stylistic restyling, and (a)(3) now covers notice of relief and reinstatement."},{"id":"sr-t3","topic":"stay-relief","level":2,"statement":"Under EDNC Local Rules effective Oct. 15, 2026, both the movant and any respondent on a stay-relief motion must state whether they consent to extending the § 362(e)(1) 30-day period without a hearing.","answer":true,"explain":"LBR 4001-1(c)(3) requires that statement in the body of the motion and of any response; it was added in the 2026 revision (the Dec. 1, 2023 rules had no such paragraph)."},{"id":"sr-t4","topic":"stay-relief","level":1,"statement":"In an individual's Chapter 13, the stay terminates 60 days after a motion for relief unless a final decision is rendered within that period or the period is extended by agreement of all parties in interest or by the court for good cause.","answer":true,"explain":"That is § 362(e)(2), which runs alongside the § 362(e)(1) 30-day rule."},{"id":"sr-t5","topic":"stay-relief","level":3,"statement":"Under In re Robbins, the bankruptcy court must keep the stay in place whenever an ex-spouse's state-court claim involves marital property.","answer":false,"explain":"Robbins affirmed lifting the stay for a Florida equitable-distribution case, applying a discretionary balancing test while keeping claim allowance in the bankruptcy court."},{"id":"sr-t6","topic":"stay-relief","level":2,"statement":"A § 362(d)(4) order, if recorded under state law, binds any other bankruptcy case purporting to affect that real property filed within two years.","answer":true,"explain":"§ 362(d)(4) so provides, subject to a debtor's motion in the later case for relief based on changed circumstances or good cause."},{"id":"sr-t7","topic":"stay-relief","level":3,"statement":"Citizens Bank of Maryland v. Strumpf affirmed the Fourth Circuit's holding that a bank's administrative freeze is a setoff violating the stay.","answer":false,"explain":"The Supreme Court reversed the Fourth Circuit, holding a temporary hold kept while the bank sought § 362(d) relief is not a setoff under § 362(a)(7)."},{"id":"ap-t1","topic":"adequate-protection-and-vehicles","level":1,"statement":"Chapter 13 payments must begin within 30 days after the LATER of the plan filing or the order for relief.","answer":false,"explain":"§ 1326(a)(1) uses whichever is earlier."},{"id":"ap-t2","topic":"adequate-protection-and-vehicles","level":2,"statement":"In EDNC, the trustee need not make pre-confirmation adequate-protection payments on a claim whose secured value is less than $2,000.","answer":true,"explain":"LBR 3070-1(c) so provides."},{"id":"ap-t3","topic":"adequate-protection-and-vehicles","level":2,"statement":"In EDNC, debtor's counsel sets the collateral value used for the presumptive 1% pre-confirmation adequate-protection payment.","answer":false,"explain":"Under LBR 3070-1(c), the trustee alone values the collateral (subject to further court consideration), and the amount is at the trustee's discretion with a 1% presumptive minimum."},{"id":"ap-t4","topic":"adequate-protection-and-vehicles","level":3,"statement":"Under Timbers, an undersecured creditor is entitled to interest on the value of its collateral as adequate protection while the stay delays foreclosure.","answer":false,"explain":"Timbers held the opposite: no compensation under § 362(d)(1) for delay; only decline in collateral value is protected."},{"id":"ap-t5","topic":"adequate-protection-and-vehicles","level":1,"statement":"A debtor keeping a financed car must give the lender reasonable evidence of required insurance within 60 days after filing.","answer":true,"explain":"§ 1326(a)(4) requires it within 60 days and for as long as the debtor retains possession."},{"id":"ap-t6","topic":"adequate-protection-and-vehicles","level":2,"statement":"An administrative expense claim under § 503(b)(1) can serve as the 'indubitable equivalent' form of adequate protection under § 361(3).","answer":false,"explain":"§ 361(3) expressly excludes entitlement to compensation allowable as a § 503(b)(1) administrative expense."},{"id":"co-t1","topic":"claims-objections","level":1,"statement":"A filed proof of claim is deemed allowed unless a party in interest objects.","answer":true,"explain":"True - 11 U.S.C. § 502(a)."},{"id":"co-t2","topic":"claims-objections","level":1,"statement":"In a voluntary Chapter 13 case, a nongovernmental unit's claim is timely if filed within 70 days after the order for relief.","answer":true,"explain":"True - Fed. R. Bankr. P. 3002(c)."},{"id":"co-t3","topic":"claims-objections","level":2,"statement":"An omnibus claim objection may include up to 150 claims.","answer":false,"explain":"False - Rule 3007(e) limits each omnibus objection to no more than 100 claims."},{"id":"co-t4","topic":"claims-objections","level":3,"statement":"Midland Funding v. Johnson held that filing an obviously time-barred proof of claim in Chapter 13 violates the FDCPA.","answer":false,"explain":"False - Midland Funding, 581 U.S. 224 (2017), held it does not."},{"id":"co-t5","topic":"claims-objections","level":2,"statement":"A claim objection may include a request to determine the validity or extent of the creditor's lien.","answer":false,"explain":"False - Rule 3007(b) bars demanding Rule 7001 relief (which includes lien validity and extent) in a claim objection; that takes an adversary proceeding."},{"id":"co-t6","topic":"claims-objections","level":3,"statement":"Raleigh v. Illinois Dept. of Revenue holds that bankruptcy does not alter the burden of proof the substantive law places on a tax claim.","answer":true,"explain":"True - Raleigh, 530 U.S. 15 (2000)."},{"id":"co-t7","topic":"claims-objections","level":2,"statement":"If a creditor misses the bar date, the debtor may file a claim for it within 30 days after the creditor's time to file expired.","answer":true,"explain":"True - Fed. R. Bankr. P. 3004."},{"id":"co-t8","topic":"claims-objections","level":3,"statement":"Under the amendment effective December 1, 2026, the open-end consumer credit statement requirement moves from Rule 3001(c)(4) to Rule 3001(c)(3).","answer":true,"explain":"True - the Supreme Court-approved amendment swaps (c)(3) and (c)(4) and makes the sanctions paragraph reach all of Rule 3001(c)."},{"id":"mc-t1","topic":"mortgage-claims-3002-1","level":1,"statement":"Under current Rule 3002.1, the trustee's end-of-case notice is due within 30 days after the debtor completes plan payments.","answer":false,"explain":"False - since Dec. 1, 2025, Rule 3002.1(g)(1) allows 45 days."},{"id":"mc-t2","topic":"mortgage-claims-3002-1","level":1,"statement":"A mortgage holder must file a notice of payment change at least 21 days before the new payment is due.","answer":true,"explain":"True - Fed. R. Bankr. P. 3002.1(b)(1)."},{"id":"mc-t3","topic":"mortgage-claims-3002-1","level":2,"statement":"Payment-change and postpetition-fee notices are filed as supplements to the proof of claim and are not subject to Rule 3001(f)'s prima facie presumption.","answer":true,"explain":"True - Fed. R. Bankr. P. 3002.1(d)."},{"id":"mc-t4","topic":"mortgage-claims-3002-1","level":2,"statement":"A Chapter 13 debtor may file a motion to determine the status of the mortgage claim mid-case.","answer":true,"explain":"True - Rule 3002.1(f), effective Dec. 1, 2025, using Official Form 410C13-M1."},{"id":"mc-t5","topic":"mortgage-claims-3002-1","level":3,"statement":"Rake v. Wade still requires interest on arrears for a 2015 mortgage that is silent on that interest.","answer":false,"explain":"False - 11 U.S.C. § 1322(e) controls agreements entered into after Oct. 22, 1994, so the note governs."},{"id":"mc-t6","topic":"mortgage-claims-3002-1","level":2,"statement":"An untimely notice of a payment decrease takes effect only on the first due date at least 21 days after the notice.","answer":false,"explain":"False - under Rule 3002.1(b)(3)(B) a late decrease applies from the actual due date, even if earlier than the notice."},{"id":"mc-t7","topic":"mortgage-claims-3002-1","level":2,"statement":"Under EDNC LBR 3070-2, 'Gap Payments' are the first two full postpetition mortgage payments that come due after the petition date.","answer":true,"explain":"True - EDNC LBR 3070-2(a)(3), unless a confirmed plan specifies otherwise."},{"id":"mc-t8","topic":"mortgage-claims-3002-1","level":3,"statement":"After the Dec. 1, 2025 amendments, the sanctions provision of Rule 3002.1 is subdivision (h).","answer":true,"explain":"True - Rule 3002.1(h), 'Claim Holder's Failure to Give Notice or Respond' (formerly lettered (i))."},{"id":"dx-t1","topic":"rule-2004-discovery","level":1,"statement":"On a party in interest's motion, the court may order the Rule 2004 examination of any entity.","answer":true,"explain":"True - Fed. R. Bankr. P. 2004(a)."},{"id":"dx-t2","topic":"rule-2004-discovery","level":2,"statement":"The 'pending proceeding' rule appears in the text of Rule 2004(b).","answer":false,"explain":"False - it is a judge-made limit (see In re Washington Mutual, 408 B.R. 45); Rule 2004's text says nothing about pending proceedings."},{"id":"dx-t3","topic":"rule-2004-discovery","level":2,"statement":"In EDNC, a Rule 2004 motion must be noticed for hearing before the court can grant it.","answer":false,"explain":"False - EDNC LBR 2004-1 says the court reviews it and may allow it ex parte."},{"id":"dx-t4","topic":"rule-2004-discovery","level":1,"statement":"Federal Rule of Civil Procedure 45 governs subpoenas in bankruptcy cases.","answer":true,"explain":"True - Fed. R. Bankr. P. 9016."},{"id":"dx-t5","topic":"rule-2004-discovery","level":2,"statement":"Civil Rule 26(a)(1) initial disclosures apply automatically in contested matters.","answer":false,"explain":"False - Rule 9014(c)(2) excludes them unless the court orders otherwise."},{"id":"dx-t6","topic":"rule-2004-discovery","level":1,"statement":"The bankruptcy judge may attend the § 341 meeting of creditors if a party requests it.","answer":false,"explain":"False - 11 U.S.C. § 341(c) bars the court from presiding at or attending."},{"id":"dx-t7","topic":"rule-2004-discovery","level":3,"statement":"Determining the validity of a lien generally requires an adversary proceeding, but avoiding a lien on exempt property under Rule 4003(d) does not.","answer":true,"explain":"True - Fed. R. Bankr. P. 7001(b) carves out Rule 3012 and 4003(d) proceedings."},{"id":"sn-t1","topic":"sales-and-new-debt","level":1,"statement":"A Chapter 13 debtor holds the trustee's § 363(b) power to sell estate property.","answer":true,"explain":"True - 11 U.S.C. § 1303."},{"id":"sn-t2","topic":"sales-and-new-debt","level":1,"statement":"Rule 4001(c) governs a Chapter 13 debtor's request to obtain a car loan.","answer":false,"explain":"False - Rule 4001(c)(3) says subdivision (c) does not apply in Chapter 13."},{"id":"sn-t3","topic":"sales-and-new-debt","level":2,"statement":"Under the EDNC local rules effective Oct. 15, 2026, the court-approval requirement for new Chapter 13 debt applies at $15,000 or more.","answer":true,"explain":"True - EDNC LBR 4002-1(g)(5)."},{"id":"sn-t4","topic":"sales-and-new-debt","level":2,"statement":"An order authorizing a sale of estate property takes effect immediately unless the court stays it.","answer":false,"explain":"False - Rule 6004(h) stays it for 14 days after entry unless the court orders otherwise."},{"id":"sn-t5","topic":"sales-and-new-debt","level":3,"statement":"Carroll v. Logan held that § 541(a)(5)'s 180-day window limits which inheritances enter a Chapter 13 estate.","answer":false,"explain":"False - Carroll held § 1306(a) extends the timeline, so a later inheritance is estate property."},{"id":"sn-t6","topic":"sales-and-new-debt","level":3,"statement":"Under In re Murphy, a cash-out refinance by itself is a substantial and unanticipated change justifying plan modification.","answer":false,"explain":"False - the Fourth Circuit treated the Goralskis' refinance as a loan, not a change in financial condition."},{"id":"sn-t7","topic":"sales-and-new-debt","level":3,"statement":"MOAC Mall Holdings held that § 363(m) is a jurisdictional limit on appellate courts.","answer":false,"explain":"False - MOAC, 598 U.S. 288 (2023), held § 363(m) is not jurisdictional."},{"id":"sn-t8","topic":"sales-and-new-debt","level":1,"statement":"Earnings from services a Chapter 13 debtor performs after filing are property of the estate.","answer":true,"explain":"True - 11 U.S.C. § 1306(a)(2)."},{"id":"cf-t1","topic":"confirmation","level":1,"statement":"Absent the statutory exception, the confirmation hearing may be held no earlier than 20 and no later than 45 days after the § 341(a) meeting.","answer":true,"explain":"True: 11 U.S.C. § 1324(b)."},{"id":"cf-t2","topic":"confirmation","level":1,"statement":"The § 1325(a)(4) best-interests test measures the hypothetical Chapter 7 distribution as of the petition date.","answer":false,"explain":"False: § 1325(a)(4) measures value 'as of the effective date of the plan.'"},{"id":"cf-t3","topic":"confirmation","level":2,"statement":"In the EDNC, objections to confirmation are due at least 7 days before the confirmation hearing, and a late objector must file a separate request to extend the deadline.","answer":true,"explain":"True: E.D.N.C. LBR 3015-3(c), implementing Fed. R. Bankr. P. 3015(f)."},{"id":"cf-t4","topic":"confirmation","level":3,"statement":"Under Espinosa, a confirmation order that discharges student-loan debt without an undue-hardship finding is void and can be vacated at any time under Rule 60(b)(4).","answer":false,"explain":"False: Espinosa held the error is not a void-making defect, so the order binds a creditor that had actual notice."},{"id":"cf-t5","topic":"confirmation","level":3,"statement":"Deans v. O'Donnell requires a Chapter 13 plan to offer substantial repayment to unsecured creditors to be in good faith.","answer":false,"explain":"False: Deans rejected a per se substantial-repayment rule and adopted a totality-of-the-circumstances test."},{"id":"cf-t6","topic":"confirmation","level":2,"statement":"If no timely objection is filed, Rule 3015(f) allows the court to find the plan was proposed in good faith without receiving evidence on the point.","answer":true,"explain":"True: Fed. R. Bankr. P. 3015(f)(2) (restyled numbering)."},{"id":"di-t1","topic":"disposable-income","level":1,"statement":"Benefits received under the Social Security Act are excluded from current monthly income.","answer":true,"explain":"True: 11 U.S.C. § 101(10A)(B)(ii)(I)."},{"id":"di-t2","topic":"disposable-income","level":2,"statement":"Under Ranta, because Social Security income is excluded from projected disposable income, the court may not consider it in deciding whether the plan is feasible.","answer":false,"explain":"False: Ranta held the court must consider Social Security income for § 1325(a)(6) feasibility when the debtor proposes to fund the plan with it."},{"id":"di-t3","topic":"disposable-income","level":2,"statement":"Under Hamilton v. Lanning, the court may account for changes in income or expenses that are known or virtually certain at confirmation.","answer":true,"explain":"True: Hamilton v. Lanning, 560 U.S. 505 (2010)."},{"id":"di-t4","topic":"disposable-income","level":3,"statement":"Under Pliler v. Stearns, an above-median debtor with negative projected disposable income may confirm a 36-month plan that doesn't pay unsecured claims in full.","answer":false,"explain":"False: Pliler holds the 5-year commitment period is temporal and applies regardless of negative projected disposable income."},{"id":"di-t5","topic":"disposable-income","level":3,"statement":"After Goddard v. Burnett (4th Cir. 2026), a plan that satisfies the § 1325(b) means test is conclusively proposed in good faith.","answer":false,"explain":"False: Goddard holds that means-test compliance doesn't satisfy the separate § 1325(a)(3) good-faith requirement."},{"id":"di-t6","topic":"disposable-income","level":2,"statement":"The HAVEN Act (2019) amended § 101(10A) so that certain disability-, combat-injury- and death-related payments under titles 10, 37 and 38 are excluded from current monthly income.","answer":true,"explain":"True: Pub. L. 116-52 rewrote § 101(10A)(B), adding clause (ii)(IV)."},{"id":"cv-t1","topic":"cramdown-vehicles","level":1,"statement":"The hanging paragraph keeps § 506 from applying to a PMSI claim on a personal-use motor vehicle bought within 910 days before filing.","answer":true,"explain":"True: the unnumbered paragraph after 11 U.S.C. § 1325(a)(9)."},{"id":"cv-t2","topic":"cramdown-vehicles","level":2,"statement":"For a personal-use car in an individual Chapter 13, § 506(a)(2) values the car at what a retail merchant would charge, with no deduction for costs of sale or marketing.","answer":true,"explain":"True: 11 U.S.C. § 506(a)(2)."},{"id":"cv-t3","topic":"cramdown-vehicles","level":2,"statement":"Till v. SCS Credit Corp. adopted the presumptive contract-rate approach for cramdown interest.","answer":false,"explain":"False: Till's plurality adopted prime plus a risk adjustment and rejected the presumptive contract-rate approach."},{"id":"cv-t4","topic":"cramdown-vehicles","level":3,"statement":"Under Tidewater Finance v. Kenney, surrendering a 910 vehicle in Chapter 13 fully satisfies the debt.","answer":false,"explain":"False: Kenney holds the creditor keeps its contract and state-law deficiency as an unsecured claim. In EDNC, though, the Local Form 113A § 3.6 180-day amendment deadline still applies."},{"id":"cv-t5","topic":"cramdown-vehicles","level":2,"statement":"Under E.D.N.C. LBR 3070-1(c), the trustee need not make pre-confirmation adequate protection payments on a claim whose secured value is less than $2,000.","answer":true,"explain":"True: LBR 3070-1(c) (Local Rules effective Oct. 15, 2026)."},{"id":"cv-t6","topic":"cramdown-vehicles","level":1,"statement":"Plan payments on a crammed-down car loan may be structured with a final balloon as long as the total present value is enough.","answer":false,"explain":"False: § 1325(a)(5)(B)(iii) requires equal monthly payments."},{"id":"hm-t1","topic":"home-mortgage-and-liens","level":1,"statement":"§ 1322(b)(2) bars modifying the rights of the holder of a claim secured only by a security interest in real property that is the debtor's principal residence.","answer":true,"explain":"True: 11 U.S.C. § 1322(b)(2)."},{"id":"hm-t2","topic":"home-mortgage-and-liens","level":3,"statement":"In Hurlburt v. Black, the en banc Fourth Circuit held that § 1322(c)(2) lets a debtor only restructure payments on a short-term home loan, not bifurcate an undersecured one.","answer":false,"explain":"False: Hurlburt held § 1322(c)(2) authorizes modification including bifurcation and cramdown, and overruled Witt, which had held the opposite."},{"id":"hm-t3","topic":"home-mortgage-and-liens","level":2,"statement":"Under In re Barham, a North Carolina home is 'sold at a foreclosure sale' for § 1322(c)(1) purposes when the gavel falls at the auction.","answer":false,"explain":"False: Barham held the sale isn't complete until the 10-day upset-bid period expires (G.S. 45-21.27, 45-21.29A)."},{"id":"hm-t4","topic":"home-mortgage-and-liens","level":3,"statement":"Bank of America v. Caulkett allows a Chapter 7 debtor to void a wholly underwater junior mortgage under § 506(d).","answer":false,"explain":"False: Caulkett held it may not, following Dewsnup."},{"id":"hm-t5","topic":"home-mortgage-and-liens","level":3,"statement":"Under Branigan v. Davis, a Chapter 20 debtor who is ineligible for a discharge may still strip off a wholly unsecured lien on the principal residence.","answer":true,"explain":"True: Davis, 716 F.3d 331 (4th Cir. 2013), held the strip-off becomes permanent on plan completion, subject to good-faith scrutiny."},{"id":"hm-t6","topic":"home-mortgage-and-liens","level":2,"statement":"Under G.S. 45-21.27, an upset bid may be filed until the close of normal business hours on the 10th day after the report of sale is filed.","answer":true,"explain":"True: N.C. Gen. Stat. § 45-21.27(a) (rolling to the next open day if the 10th day falls on a Sunday, holiday or closure)."},{"id":"pm-t1","topic":"plan-modification","level":1,"statement":"Only the debtor may ask to modify a confirmed Chapter 13 plan.","answer":false,"explain":"§ 1329(a) also lets the trustee or the holder of an allowed unsecured claim request modification."},{"id":"pm-t2","topic":"plan-modification","level":1,"statement":"A modified plan may never run past five years from the date the first payment under the original plan was due.","answer":true,"explain":"§ 1329(c) lets the court extend beyond the applicable commitment period for cause, but never beyond five years from that first payment date."},{"id":"pm-t3","topic":"plan-modification","level":3,"statement":"In the Fourth Circuit, a large cash-out refinance is a substantial change in financial condition that lets the trustee raise plan payments.","answer":false,"explain":"Murphy v. O'Donnell held that a loan, regardless of size, is not income, so res judicata barred that modification."},{"id":"pm-t4","topic":"plan-modification","level":2,"statement":"Rule 3015(h) requires at least 21 days' notice by mail of the deadline to object to a proposed post-confirmation modification.","answer":true,"explain":"Rule 3015(h)(1) requires at least 21 days' notice to the debtor, trustee and creditors unless the court orders otherwise for unaffected creditors."},{"id":"pm-t5","topic":"plan-modification","level":2,"statement":"Under EDNC LBR 4002-1(g)(4), effective Oct. 15, 2026, a court order is required only when the property's non-exempt equity exceeds $15,000.","answer":true,"explain":"The current rule bars dispositions of property with non-exempt equity 'in excess of $15,000' without a court order; the older $12,000 figure is outdated."},{"id":"pm-t6","topic":"plan-modification","level":3,"statement":"Arnold v. Weast holds that confirmation is res judicata and always bars a later increase in plan payments.","answer":false,"explain":"Arnold held res judicata bars an increase only where there were no unanticipated, substantial changes, and it upheld the increase."},{"id":"dc-t1","topic":"dismissal-conversion","level":1,"statement":"A Chapter 13 debtor can convert to Chapter 7 only after the court enters an order following notice and a hearing.","answer":false,"explain":"§ 1307(a) gives the right and Rule 1017(f)(3) converts the case on the debtor's notice without a court order."},{"id":"dc-t2","topic":"dismissal-conversion","level":2,"statement":"On a good-faith conversion from 13 to 7, the Chapter 7 estate is petition-date estate property still in the debtor's possession or control at conversion.","answer":true,"explain":"That is § 348(f)(1)(A); § 348(f)(2) uses the conversion date instead when the debtor converts in bad faith."},{"id":"dc-t3","topic":"dismissal-conversion","level":3,"statement":"Under Harris v. Viegelahn, undistributed plan payments held by the Chapter 13 trustee at a good-faith conversion must be paid to creditors.","answer":false,"explain":"Harris held the debtor is entitled to the return of undistributed post-petition wages."},{"id":"dc-t4","topic":"dismissal-conversion","level":2,"statement":"A Chapter 13 case filed December 1, 2026 still faces separate secured and unsecured debt caps under § 109(e).","answer":false,"explain":"The Bankruptcy Threshold Adjustment Act, signed Nov. 10, 2026, set a single combined limit of less than $2,750,000 for cases commenced on or after enactment."},{"id":"dc-t5","topic":"dismissal-conversion","level":1,"statement":"If an individual debtor does not file the § 521(a)(1) information within 45 days, the case is automatically dismissed effective day 46, subject to the statute's exceptions.","answer":true,"explain":"§ 521(i)(1), implemented in EDNC by LBR 1007-1(c)."},{"id":"dc-t6","topic":"dismissal-conversion","level":3,"statement":"Marrama held that a debtor's right to convert from Chapter 7 to Chapter 13 is absolute.","answer":false,"explain":"Marrama held a bad-faith debtor forfeited that right because § 706(d) requires that he qualify as a Chapter 13 debtor."},{"id":"dc-t7","topic":"dismissal-conversion","level":3,"statement":"Purdy v. Burnett is binding Fourth Circuit precedent on bad-faith dismissal in EDNC.","answer":false,"explain":"Purdy is an unpublished per curiam opinion, which the Fourth Circuit says is not binding precedent."},{"id":"ds-t1","topic":"discharge","level":1,"statement":"A debtor who received a discharge in a Chapter 13 case filed within the two years before the new case cannot receive a new Chapter 13 discharge.","answer":true,"explain":"§ 1328(f)(2) sets the two-year bar for a prior Chapter 13 discharge."},{"id":"ds-t2","topic":"discharge","level":2,"statement":"A § 523(a)(15) divorce property-settlement debt owed to a former spouse survives a full-compliance Chapter 13 discharge.","answer":false,"explain":"§ 1328(a)(2) does not list § 523(a)(15), so that debt is discharged in a completed plan (support debts under (a)(5) still survive)."},{"id":"ds-t3","topic":"discharge","level":2,"statement":"Qualifying student loans are excepted from a Chapter 13 full-compliance discharge unless excepting them would impose an undue hardship.","answer":true,"explain":"§ 1328(a)(2) includes § 523(a)(8)."},{"id":"ds-t4","topic":"discharge","level":3,"statement":"Under Taggart v. Lorenzen, a creditor's sincere belief that the discharge did not cover its debt is a complete defense to contempt.","answer":false,"explain":"Taggart adopted an objective 'no fair ground of doubt' test; good faith may affect the sanction but does not bar contempt."},{"id":"ds-t5","topic":"discharge","level":2,"statement":"A § 1328(b) hardship discharge is just as broad as a full-compliance discharge, so it wipes out a § 523(a)(15) divorce property-settlement debt.","answer":false,"explain":"§ 1328(c)(2) excepts any debt of a kind specified in § 523(a) from a hardship discharge, so the (a)(15) debt survives; only the full-compliance § 1328(a) discharge reaches it."},{"id":"ds-t6","topic":"discharge","level":2,"statement":"Effective Dec. 1, 2026, Rule 1007(c)(4)'s course-certificate deadline is abrogated, but Rule 4004(c)(4) still bars a Chapter 13 discharge without the certificate.","answer":true,"explain":"The Supreme Court's April 8, 2026 order abrogates Rule 1007(c)(4) and leaves Rule 4004 unchanged."},{"id":"ds-t7","topic":"discharge","level":3,"statement":"Under § 524(i), a creditor's willful failure to credit plan payments violates the discharge injunction only if it caused material injury to the debtor.","answer":true,"explain":"§ 524(i) requires that the collection act and failure to credit caused material injury."},{"id":"ex-t1","topic":"exemptions-estate","level":1,"statement":"North Carolina debtors may choose between the federal § 522(d) exemptions and the NC exemptions.","answer":false,"explain":"G.S. 1C-1601(f) makes the § 522(d) exemptions inapplicable to NC residents."},{"id":"ex-t2","topic":"exemptions-estate","level":1,"statement":"Under current Rule 4003(b)(1), the 30-day objection period runs from the later of the conclusion of the § 341 meeting or the filing of an amendment or supplemental schedule.","answer":true,"explain":"That is the restyled Rule 4003(b)(1); the court may extend it for cause on a motion filed before it expires."},{"id":"ex-t3","topic":"exemptions-estate","level":3,"statement":"Clark v. Rameker means inherited IRAs can never be exempt in a North Carolina case.","answer":false,"explain":"Clark addressed only § 522(b)(3)(C); G.S. 1C-1601(a)(9) has its own language covering inherited IRAs received by direct transfer or rollover."},{"id":"ex-t4","topic":"exemptions-estate","level":2,"statement":"North Carolina's basic residence exemption is $35,000.","answer":true,"explain":"G.S. 1C-1601(a)(1) sets $35,000, or $60,000 for a qualifying unmarried debtor 65 or older."},{"id":"ex-t5","topic":"exemptions-estate","level":3,"statement":"Law v. Siegel allows a bankruptcy court to surcharge a homestead exemption to cover costs caused by the debtor's fraud.","answer":false,"explain":"Law v. Siegel held the court may not contravene § 522 by surcharging exempt property."},{"id":"ex-t6","topic":"exemptions-estate","level":2,"statement":"An ERISA-qualified plan with an anti-alienation clause is excluded from the bankruptcy estate rather than exempted from it.","answer":true,"explain":"Patterson v. Shumate applied § 541(c)(2) to exclude it."}],"unverified":[{"group":"g1","item":"Fourth Circuit decision on whether § 362(c)(3)(A) ends the stay as to property of the estate","reason":"None located (searched case law and Oct. 2026 commentary, which lists only In re Smith (1st Cir. 2018) and Rose (5th Cir. 2019)). Left as a status note on usc-362c3 and TF as-t3; no Fourth Circuit holding stated."},{"group":"g1","item":"Reporter citation 170 F.4th 249 for Goldman Sachs Bank USA v. Brown (4th Cir. 2026)","reason":"Seen in only one source (In re Swaim, Bankr. M.D.N.C. 2026); cited instead by docket number and date, which the Fourth Circuit opinion PDF confirms."},{"group":"g1","item":"E.D.N.C. LBR 9014-1 (14-day response period; (f) content of response)","reason":"Full text read only on courtrules.net; the official nceb.uscourts.gov PDF could not be read that far. Only the LBR 4001-1(c)(2) cross-reference to 9014-1(f) is used; no response period is stated in the content."},{"group":"g1","item":"E.D.N.C. LBR 4001-1(a)(4) Chapter 13 standing stay modifications (creditor contact about insurance, taxes, direct-pay defaults)","reason":"Appears in the Oct. 15, 2026 rules, but the older text on courtrules.net reads differently; not cross-checked against a second source showing the current version. Left out."},{"group":"g1","item":"E.D.N.C. LBR 3070-1(a), (b), (d) (return of payments, fee applications and trustee fee on pre-confirmation dismissal)","reason":"Read only in the current rules PDF; not cross-checked. Section 1326(a)(2) is used instead."},{"group":"g1","item":"Budget Service Co. v. Better Homes of /* ===================================================================
   Content normalization (tolerates build output OR raw spec files)
   =================================================================== */
const DB = buildDB(CONTENT);

function buildDB(raw) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const db = { asOf: String(raw.asOf || AS_OF_DEFAULT), topics: [], topic: {}, auth: {}, items: [], item: {}, byTopic: {}, authTopic: {}, unverified: [] };
  const addAuth = a => {
    if (!a || !a.id || db.auth[a.id]) return;
    db.auth[a.id] = Object.assign({}, a, { type: TYPE_LABEL[a.type] ? a.type : 'other', sources: Array.isArray(a.sources) ? a.sources : [] });
  };
  const authList = Array.isArray(raw.authorities) ? raw.authorities : Object.values(raw.authorities || {});
  authList.forEach(addAuth);
  const pending = { card: [].concat(raw.cards || []), chain: [].concat(raw.chains || []), tf: [].concat(raw.truefalse || []) };
  (raw.topics || []).forEach(t => {
    if (!t || !t.id || db.topic[t.id]) return;
    (t.authorities || []).forEach(addAuth);
    const authIds = (t.authIds || (t.authorities || []).map(a => a && a.id)).filter(Boolean);
    const topic = { id: t.id, title: t.title || t.id, tag: t.tag || '', pattern: t.pattern || '', chain: (t.chain || []).slice(), authIds };
    db.topics.push(topic); db.topic[t.id] = topic; db.byTopic[t.id] = [];
    (t.cards || []).forEach(c => pending.card.push(Object.assign({ topic: t.id }, c)));
    (t.chains || []).forEach(c => pending.chain.push(Object.assign({ topic: t.id }, c)));
    (t.truefalse || []).forEach(c => pending.tf.push(Object.assign({ topic: t.id }, c)));
  });
  db.topics.forEach(t => {
    t.chain = t.chain.filter(id => db.auth[id]);
    t.authIds = t.authIds.filter(id => db.auth[id]);
    t.chain.forEach(id => { if (!t.authIds.includes(id)) t.authIds.push(id); });
    t.authIds.forEach(id => { if (!db.authTopic[id]) db.authTopic[id] = t.id; });
  });
  const has = id => !!db.auth[id];
  const lvl = (v, d) => { const n = parseInt(v, 10); return n >= 1 && n <= 3 ? n : d; };
  const push = it => {
    if (!it.id || db.item[it.id] || !db.topic[it.topic]) return;
    db.items.push(it); db.item[it.id] = it; db.byTopic[it.topic].push(it);
  };
  pending.card.forEach(c => {
    const opts = Array.isArray(c.options) ? c.options : [];
    if (!c.prompt || !has(c.answer) || opts.length < 2 || !opts.every(has) || !opts.includes(c.answer)) return;
    push({ kind: 'card', id: c.id, topic: c.topic, level: lvl(c.level, 1), prompt: c.prompt, answer: c.answer, options: opts.slice(0, 4), explain: c.explain || '', quip: c.quip || '' });
  });
  pending.chain.forEach(c => {
    const steps = Array.isArray(c.steps) ? c.steps : [];
    if (!c.facts || steps.length < 2 || !steps.every(has)) return;
    push({ kind: 'chain', id: c.id, topic: c.topic, level: lvl(c.level, 2), facts: c.facts, steps: steps.slice(), explain: c.explain || '' });
  });
  pending.tf.forEach(c => {
    if (!c.statement || typeof c.answer !== 'boolean') return;
    push({ kind: 'tf', id: c.id, topic: c.topic, level: lvl(c.level, 1), statement: c.statement, answer: c.answer, explain: c.explain || '' });
  });
  db.unverified = (raw.unverified || []).filter(u => u && (u.item || u.reason));
  db.authList = Object.values(db.auth).sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || String(a.cite).localeCompare(String(b.cite), 'en', { numeric: true }));
  return db;
}

/* ===================================================================
   Utilities
   =================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
function safeUrl(u) { try { const x = new URL(String(u)); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; } catch (e) { return null; } }
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return String(u); } }
function dayNum(d) { d = d || new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function today() { return dayNum(); }
function dateStr(d) { d = d || new Date(); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + '/' + d.getFullYear(); }
function longDate(d) { d = d || new Date(); try { return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return dateStr(d); } }
function weightedSample(list, k, wfn) {
  const pool = list.slice(), out = [];
  while (out.length < k && pool.length) {
    const ws = pool.map(x => Math.max(0.0001, wfn(x)));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
    for (; i < pool.length - 1; i++) { r -= ws[i]; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function loadProgress() {

/* ===================================================================
   Spaced repetition, mastery, unlocks, ranks
   =================================================================== */
const recOf = id => P.items[id] || null;
const boxOf = id => { const r = P.items[id]; return r ? (r.box || 0) : 0; };
const isSeen = id => { const r = P.items[id]; return !!(r && r.seen); };
const isDue = id => { const r = P.items[id]; return !!(r && r.seen && r.due <= today()); };

function grade(id, correct) {
  const t = today();
  const r = P.items[id] || { box: 0, seen: 0, right: 0, wrong: 0, due: t };
  const before = r.box || 0;
  r.box = correct ? Math.min(5, Math.max(1, before) + 1) : 1;
  r.seen = (r.seen || 0) + 1;
  if (correct) r.right = (r.right || 0) + 1; else r.wrong = (r.wrong || 0) + 1;
  r.due = t + INTERVALS[r.box - 1];
  r.last = t;
  P.items[id] = r;
  return { before, after: r.box };
}
function mastery(tid) {
  const its = DB.byTopic[tid] || [];
  if (!its.length) return 0;
  let s = 0;
  its.forEach(i => { const b = boxOf(i.id); if (b) s += (b - 1) / 4; });
  return s / its.length;
}
function unlockedLevel(tid) {
  if (P.settings.showAll) return 3;
  let level = 1;
  for (const L of [1, 2]) {
    const its = (DB.byTopic[tid] || []).filter(i => i.level === L);
    const ok = !its.length || its.filter(i => boxOf(i.id) >= 2).length / its.length >= 0.7;
    if (ok) level = L + 1; else break;
  }
  return level;
}
const isAvail = item => item.level <= unlockedLevel(item.topic);
function rankInfo(xp) {
  let i = 0;
  for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k].min) i = k;
  const cur = RANKS[i], next = RANKS[i + 1] || null;
  const prog = next ? (xp - cur.min) / (next.min - cur.min) : 1;
  return { idx: i, name: cur.name, next, prog };
}
const multFor = streak => streak >= 10 ? 4 : streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
function docketCounts() {
  const av = DB.items.filter(isAvail);
  return { due: av.filter(i => isDue(i.id)).length, fresh: av.filter(i => !isSeen(i.id)).length };
}
function weakness() { const w = {}; DB.topics.forEach(t => { w[t.id] = 1 - mastery(t.id); }); return w; }

function buildDocket(n) {
  const avail = DB.items.filter(isAvail), weak = weakness();
  const due = shuffle(avail.filter(i => isDue(i.id)))
    .sort((a, b) => boxOf(a.id) - boxOf(b.id) || (weak[b.topic] - weak[a.topic]));
  let out = due.slice(0, n);
  if (out.length < n) {
    const fresh = avail.filter(i => !isSeen(i.id));
    out = out.concat(weightedSample(fresh, n - out.length, i => (0.25 + weak[i.topic]) * (i.level === 1 ? 1.5 : 1)));
  }
  if (out.length < n) {
    const rest = shuffle(avail.filter(i => !out.includes(i))).sort((a, b) => ((recOf(a.id) || {}).due || 0) - ((recOf(b.id) || {}).due || 0));
    out = out.concat(rest.slice(0, n - out.length));
  }
  return out;
}
function pickPool(pool, n) {
  const key = i => isDue(i.id) ? 0 : !isSeen(i.id) ? 1 : 2;
  return shuffle(pool).sort((a, b) => key(a) - key(b) || boxOf(a.id) - boxOf(b.id)).slice(0, n);
}

/* ===================================================================
   App state
   =================================================================== */
const S = {
  screen: 'home', sess: null, duel: null, summary: null, lastStart: null, modal: null,
  map: { ti: 0, node: null }, auth: { q: '', types: [] }, srcOpen: true, emptyMsg: '', toastT: null
};
const curItem = () => S.sess ? S.sess.items[S.sess.i] : null;

/* ---------- sessions ---------- */
function startSession(mode, opts) {
  opts = opts || {};
  let items = [], early = false;
  const inTopic = i => !opts.topic || i.topic === opts.topic;
  if (mode === 'docket') items = buildDocket(SESSION_SIZE.docket);
  else if (mode === 'quick') {
    let pool = DB.items.filter(i => i.kind === 'card' && inTopic(i) && isAvail(i));
    if (!pool.length) pool = DB.items.filter(i => i.kind === 'card' && inTopic(i));
    items = pickPool(pool, SESSION_SIZE.quick);
  } else if (mode === 'chain') {
    let pool = DB.items.filter(i => i.kind === 'chain' && inTopic(i) && isAvail(i));
    if (!pool.length) {
      const all = DB.items.filter(i => i.kind === 'chain' && inTopic(i));
      const minL = Math.min.apply(null, all.map(i => i.level).concat([9]));
      pool = all.filter(i => i.level === minL); early = pool.length > 0;
    }
    items = pickPool(pool, SESSION_SIZE.chain);
  } else if (mode === 'objection') {
    let pool = DB.items.filter(i => i.kind === 'tf' && inTopic(i) && isAvail(i));
    if (!pool.length) pool = DB.items.filter(i => i.kind === 'tf' && inTopic(i));
    items = pickPool(pool, pool.length);
  }
  S.lastStart = { mode, opts };
  if (!items.length) { showEmpty(mode); return; }
  S.sess = {
    mode, topic: opts.topic || null, early, items, pool: items.slice(), i: 0, streak: 0, best: 0, xp: 0,
    answered: 0, correct: 0, promoted: 0, byTopic: {}, requeue: {}, timeLeft: OBJECTION_SECONDS, cur: null
  };
  S.screen = 'play';
  startItem();
  render();
  ensureTick();
}
function startItem() {
  const s = S.sess, item = curItem();
  const cur = { id: item.id, phase: 'ask', hint: false, clock: null, fb: null };
  if (item.kind === 'card') {
    cur.opts = shuffle(item.options);
    if (P.settings.shotClock && (s.mode === 'quick' || s.mode === 'docket')) cur.clock = SHOT_CLOCK;
  } else if (item.kind === 'chain') {
    const topic = DB.topic[item.topic];
    let decoyPool = topic.authIds.filter(id => !item.steps.includes(id));
    if (decoyPool.length < 2) decoyPool = decoyPool.concat(shuffle(Object.keys(DB.auth).filter(id => !item.steps.includes(id) && !decoyPool.includes(id))).slice(0, 3));
    const nDecoy = Math.min(decoyPool.length, item.steps.length >= 4 ? 2 : 3);
    cur.tray = shuffle(item.steps.concat(shuffle(decoyPool).slice(0, nDecoy)));
    cur.picks = [];
  }
  s.cur = cur;
}
function answerCard(i) {
  const s = S.sess; if (!s || s.cur.phase !== 'ask') return;
  const item = curItem(); if (item.kind !== 'card') return;
  if (i != null && (i < 0 || i >= s.cur.opts.length)) return;
  const picked = i == null ? null : s.cur.opts[i];
  finish(picked === item.answer, { picked, timeout: i == null });
}
function answerTF(v) {
  const s = S.sess; if (!s || s.cur.phase !== 'ask') return;
  const item = curItem(); if (item.kind !== 'tf') return;
  finish(v === item.answer, { pickedTF: v });
}
function trayPick(k) {
  const s = S.sess; if (!s || s.cur.phase !== 'ask') return;
  const item = curItem(); if (item.kind !== 'chain') return;
  const id = s.cur.tray[k];
  if (!id || s.cur.picks.includes(id) || s.cur.picks.length >= item.steps.length) return;
  s.cur.picks.push(id); Sound.click(); render();
}
function slotRemove(k) {
  const s = S.sess; if (!s || s.cur.phase !== 'ask' || !s.cur.picks) return;
  s.cur.picks.splice(k, 1); render();
}
function chainUndo() { const s = S.sess; if (s && s.cur.picks && s.cur.phase === 'ask' && s.cur.picks.length) { s.cur.picks.pop(); render(); } }
function chainClear() { const s = S.sess; if (s && s.cur.picks && s.cur.phase === 'ask') { s.cur.picks = []; render(); } }
function submitChain() {
  const s = S.sess; if (!s || s.cur.phase !== 'ask') return;
  const item = curItem(); if (item.kind !== 'chain' || s.cur.picks.length !== item.steps.length) return;
  const nRight = item.steps.filter((id, k) => s.cur.picks[k] === id).length;
  finish(nRight === item.steps.length, { nRight, frac: nRight / item.steps.length });
}
function finish(correct, info) {
  const s = S.sess, item = curItem(), cur = s.cur;
  cur.phase = 'fb';
  const rankBefore = rankInfo(P.xp).idx;
  const g = grade(item.id, correct);
  if (g.after > g.before) s.promoted++;
  s.answered++; P.stats.answered++;
  if (correct) { s.correct++; P.stats.correct++; s.streak++; } else s.streak = 0;
  s.best = Math.max(s.best, s.streak); P.stats.bestStreak = Math.max(P.stats.bestStreak || 0, s.streak);
  const bt = s.byTopic[item.topic] || (s.byTopic[item.topic] = { a: 0, c: 0 });
  bt.a++; if (correct) bt.c++;
  const mult = multFor(s.streak);
  const base = (item.kind === 'card' ? 10 : item.kind === 'chain' ? 15 : 5) * item.level;
  let xp = correct ? base * mult : (item.kind === 'chain' ? Math.round(base * (info.frac || 0) * 0.5) : 0);
  if (cur.hint) xp = Math.round(xp / 2);
  P.xp += xp; s.xp += xp;
  touchDay();
  if (!correct && s.mode !== 'objection') {
    const n = s.requeue[item.id] || 0;
    if (n < 2) { s.requeue[item.id] = n + 1; s.items.splice(Math.min(s.items.length, s.i + 3 + (Math.random() < 0.5 ? 1 : 0)), 0, item); }
  }
  let coach;
  if (info.timeout) coach = pickOne(COACH.timeout);
  else if (correct && COACH.streak[s.streak]) coach = COACH.streak[s.streak];
  else if (!correct && item.kind === 'chain' && info.nRight > 0) coach = pickOne(COACH.partial);
  else coach = pickOne(correct ? COACH.right : COACH.wrong);
  cur.fb = { correct, info, xp, mult: correct ? mult : 1, coach, promoted: g.after > g.before, box: g.after };
  save();
  if (correct) Sound.right(); else Sound.wrong();
  const rAfter = rankInfo(P.xp);
  if (rAfter.idx > rankBefore) toast('Promoted: ' + rAfter.name);
  S.scrollTo = '#fb';
  render();
}
function nextItem() {
  const s = S.sess; if (!s || s.cur.phase !== 'fb') return;
  s.i++;
  if (s.mode === 'objection') {
    if (s.timeLeft <= 0) { endSession(); return; }
    if (s.i >= s.items.length) s.items = s.items.concat(shuffle(s.pool));
  } else if (s.i >= s.items.length) { endSession(); return; }
  startItem(); render();
}
function touchDay() {
  const t = today(), st = P.stats;
  if (st.lastDay === t) return;
  st.dayStreak = st.lastDay === t - 1 ? (st.dayStreak || 0) + 1 : 1;
  st.lastDay = t;
}
function endSession() {
  const s = S.sess; if (!s) return;
  stopTick();
  let bonus = 0;
  if (s.mode === 'docket' && s.answered >= 10) { bonus = 25; P.xp += bonus; s.xp += bonus; }
  P.stats.sessions++;
  let weakest = null;
  Object.keys(s.byTopic).forEach(tid => {
    const r = s.byTopic[tid], acc = r.c / r.a;
    if (!weakest || acc < weakest.acc || (acc === weakest.acc && r.a > weakest.a)) weakest = { tid, acc, a: r.a, c: r.c };
  });
  S.summary = { kind: 'session', mode: s.mode, topic: s.topic, answered: s.answered, correct: s.correct, xp: s.xp, bonus,
    promoted: s.promoted, best: s.best, weakest, date: new Date() };
  S.sess = null; S.screen = 'summary';
  save(); Sound.gavel(); render();
}
function adjourn() {
  const s = S.sess;
  if (!s) { goHome(); return; }
  if (!s.answered) { stopTick(); S.sess = null; goHome(); return; }
  confirmBox({ title: 'Adjourn early?', body: 'Your answers so far are already on the record. The Court will enter its order on what was heard.',
    yes: 'Adjourn', no: 'Stay in session', onYes: endSession });
}

/* ---------- duel ---------- */
function startDuel() {

  S.duel = { items: shuffle(pool).slice(0, SESSION_SIZE.duel), i: 0, score: [0, 0], phase: 'ask', locked: [false, false], picks: [null, null], winner: null, coach: '' };
  S.duel.opts = shuffle(S.duel.items[0].options);

  S.screen = 'duel'; render();
}
function buzz(p, idx) {
  const d = S.duel; if (!d || d.phase !== 'ask' || d.locked[p]) return;
  const item = d.items[d.i], pick = d.opts[idx]; if (!pick) return;
  d.picks[p] = pick;
  if (pick === item.answer) { d.score[p]++; d.winner = p; d.phase = 'fb'; d.coach = pickOne(COACH.right); Sound.right(); S.scrollTo = '#fb'; }
  else {
    d.locked[p] = true; Sound.wrong();
    if (d.locked[0] && d.locked[1]) { d.winner = null; d.phase = 'fb'; d.coach = pickOne(COACH.wrong); S.scrollTo = '#fb'; }
  }
  render();
}
function duelNext() {
  const d = S.duel; if (!d || d.phase !== 'fb') return;
  d.i++;
  if (d.i >= d.items.length) {
    P.stats.duels = (P.stats.duels || 0) + 1; save();

    S.duel = null; S.screen = 'summary'; Sound.gavel(); render(); return;

      let state = '';
      if (fb) state = id === item.answer ? 'right' : id === cur.fb.info.picked ? 'wrong' : 'dim';
      return tile(authBy(id), k, { key: String(k + 1), state, disabled: fb, extra: k === 0 && !fb ? 'data-autofocus' : '' });
    }).join('')}</div>`;
  } else if (item.kind === 'tf') {
    h += `<blockquote class="stmt">${esc(item.statement)}</blockquote>
      <div class="tfbtns">
        <button class="btn sus ${fb && cur.fb.info.pickedTF === true ? 'chosen' : ''}" data-act="tf" data-v="1" ${fb ? 'disabled' : 'data-autofocus'}><span>Sustained</span><small>true · key T</small></button>
        <button class="btn ovr ${fb && cur.fb.info.pickedTF === false ? 'chosen' : ''}" data-act="tf" data-v="0" ${fb ? 'disabled' : ''}><span>Overruled</span><small>false · key F</small></button>
      </div>`;
  } else {
    const steps = item.steps;
    h += `<p class="prompt">${esc(item.facts)}</p><p class="howto">Build the pattern in order (${steps.length} steps): Code → Rule → Local → Case. Tap a placed tile to pull it back.</p>`;
    h += `<ol class="slots">${steps.map((id, k) => {
      const pid = cur.picks[k];
      if (!pid) return `<li><div class="slot-empty">Step ${k + 1}</div></li>`;
      const state = fb ? (pid === id ? 'right' : 'wrong') : '';
      return `<li>${tile(authBy(pid), k, { act: 'slot', state, disabled: fb })}</li>`;
    }).join('')}</ol>`;
    if (!fb) {
      const full = cur.picks.length === steps.length;
      h += `<div class="tray">${cur.tray.map((id, k) => {
        const used = cur.picks.includes(id);
        return tile(authBy(id), k, { act: 'tray', key: String(k + 1), state: used ? 'used' : '', disabled: used || full, extra: k === 0 ? 'data-refocus data-autofocus' : 'data-refocus' });
      }).join('')}</div>
      <div class="row chain-act"><button class="btn ghost" data-act="undo" ${cur.picks.length ? '' : 'disabled'}>Undo <span class="k">⌫</span></button>
        <button class="btn ghost" data-act="clear" ${cur.picks.length ? '' : 'disabled'}>Clear</button>
        <button class="btn primary" data-act="submit" data-refocus ${full ? '' : 'disabled'}>Submit chain</button></div>`;
    }
  }
  if (!fb) {
    h += `<div class="assist row"><button class="btn sm ghost" data-act="hint" aria-pressed="${cur.hint}">${cur.hint ? 'Clerk’s note open (half XP)' : 'Ask the Clerk — half XP'} <span class="k">X</span></button></div>`;
    if (cur.hint) h += `<aside class="hint"><b>Clerk’s note — the pattern</b>${esc(topic.pattern)}</aside>`;
  } else h += feedbackPanel(item, cur.fb, { next: 'next' });
  return h;
}

function authCard(a, o) {
  if (!a) return '';
  o = o || {};
  const srcs = (a.sources || []).map(safeUrl).filter(Boolean);
  return `<article class="headnote ${tcls(a.type)}">
    <div class="hn-h"><span class="tbadge">${esc(TYPE_LABEL[a.type])}</span>${o.label ? `<span class="hn-label">${esc(o.label)}</span>` : ''}</div>
    <h4 class="hn-short">${esc(a.short || a.cite)}</h4>
    <p class="cite">${esc(a.cite)}</p>
    ${a.holding ? `<p class="hn-p"><span class="hn-k">Holding</span>${esc(a.holding)}</p>` : ''}
    ${a.why ? `<p class="hn-p"><span class="hn-k">Why it matters</span>${esc(a.why)}</p>` : ''}
    ${a.status ? `<span class="hn-status">Status: ${esc(a.status)}</span>` : ''}
    ${srcs.length ? `<details class="src" ${S.srcOpen ? 'open' : ''}><summary>Sources (${srcs.length}) <span class="k">Y</span></summary><ul>${srcs.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(u))}</a><span class="url">${esc(u)}</span></li>`).join('')}</ul></details>` : ''}
  </article>`;
}
function chainMap(topic, o) {
  o = o || {};
  const hit = o.hit || [], miss = o.miss || [];
  const nodes = topic.chain.map(id => {
    const a = authBy(id), cls = `node ${tcls(a.type)} ${hit.includes(id) ? 'hit' : ''} ${miss.includes(id) ? 'miss' : ''} ${o.sel === id ? 'sel' : ''}`;
    const inner = `<span class="ty">${esc(TYPE_LABEL[a.type])}</span><span class="sh">${esc(a.short || a.cite)}</span><span class="ci">${esc(a.cite)}</span>`;
    return `<li>${o.interactive ? `<button class="${cls}" data-act="node" data-id="${esc(id)}" aria-pressed="${o.sel === id}">${inner}</button>` : `<div class="${cls}">${inner}</div>`}</li>`;
  }).join('');
  return nodes ? `<ol class="cmap ${o.small ? 'sm' : ''}">${nodes}</ol>` : '<p class="cmap-note">No chain recorded for this topic.</p>';
}
function mentioned(text, topic) {
  const t = String(text || ''), lt = t.toLowerCase(), out = [];
  (topic ? topic.authIds : []).forEach(id => {
    const a = authBy(id); if (!a) return;
    const needles = [];
    const sec = String(a.cite).match(/§+\s*([0-9A-Za-z.\-]+(?:\([0-9A-Za-z]+\))*)/); if (sec) needles.push(sec[1]);
    const rule = String(a.cite).match(/P\.\s*([0-9]{4}(?:\.[0-9])?(?:\([0-9A-Za-z]+\))*)/); if (rule) needles.push(rule[1]);
    if (/^lbr-/.test(id)) needles.push(id.slice(4));
    let hitFound = needles.some(n => n.length >= 3 && t.includes(n));
    if (!hitFound && /^case-/.test(id)) { const nm = id.slice(5).replace(/-/g, ' '); hitFound = nm.length >= 3 && new RegExp('\\b' + nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(lt); }
    if (hitFound) out.push(id);
  });
  return out.slice(0, 2);
}
function feedbackPanel(item, fb, o) {
  const topic = DB.topic[item.topic], partial = item.kind === 'chain' && !fb.correct && fb.info && fb.info.nRight > 0;
  const cls = fb.correct ? 'ok' : partial ? 'part' : 'bad';
  const stampTxt = o.stamp || (fb.correct ? 'So ordered' : partial ? 'Affirmed in part' : fb.info && fb.info.timeout ? 'Time' : 'Reversed');
  let h = `<section class="fb ${cls}" id="fb" aria-live="polite">
    <div class="fb-top"><span class="stamp">${esc(stampTxt)}</span><p class="coach">${esc(fb.coach)}</p>
    ${o.duel ? '' : `<span class="xpg">${fb.xp ? '+' + fb.xp + ' XP' + (fb.mult > 1 ? ' (×' + fb.mult + ')' : '') : '+0 XP'}${fb.promoted ? ' · to box ' + fb.box : fb.box === 1 ? ' · back to box 1' : ''}</span>`}</div>`;
  let hit = [], miss = [];
  if (item.kind === 'card') {
    hit = [item.answer];
    h += `<h3>Controlling authority</h3>${authCard(authBy(item.answer))}`;
    const pk = fb.info && fb.info.picked;
    if (pk && pk !== item.answer) {
      const pa = authBy(pk); miss = [pk];
      h += `<p class="picked"><b>You chose:</b> ${esc(pa.short || '')} — <span class="mono">${esc(pa.cite)}</span>${pa.holding ? '. ' + esc(pa.holding) : ''}</p>`;
    }
    if (item.explain) h += `<p class="ex">${esc(item.explain)}</p>`;
    if (item.quip) h += `<p class="quip">${esc(item.quip)}</p>`;
  } else if (item.kind === 'chain') {
    hit = item.steps.slice();
    h += `<p class="ex"><b>${fb.info.nRight} of ${item.steps.length}</b> in the right position.</p><h3>The pattern, in order</h3>`;
    h += item.steps.map((id, k) => authCard(authBy(id), { label: 'Step ' + (k + 1) })).join('');
    if (item.explain) h += `<p class="ex">${esc(item.explain)}</p>`;
  } else {
    h += `<p class="ex"><b>The statement is ${item.answer ? 'TRUE — Sustained' : 'FALSE — Overruled'}.</b> ${esc(item.explain)}</p>`;
    const on = mentioned(item.explain + ' ' + item.statement, topic);
    hit = on;
    if (on.length) h += `<h3>Authority on point</h3>` + on.map(id => authCard(authBy(id))).join('');
  }
  const outside = hit.filter(id => !topic.chain.includes(id));
  h += `<details class="pattern-d" open><summary>Topic pattern — ${esc(topic.title)} <span class="k">X</span></summary><p>${esc(topic.pattern)}</p></details>`;
  h += chainMap(topic, { hit, miss, small: true });
  if (item.kind === 'card' && outside.length) h += `<p class="cmap-note">The answer sits outside this topic’s core chain — it is a satellite authority.</p>`;
  h += `<p class="asof">Content as of ${esc(DB.asOf)}</p>
    <div class="row fb-actions"><button class="btn primary" data-act="${o.next}" data-autofocus>Continue <span class="k">Enter</span></button>
    ${o.duel ? '' : '<button class="btn ghost" data-act="adjourn">Adjourn</button>'}</div></section>`;
  return h;
}

function viewDuel() {
  const d = S.duel, item = d.items[d.i], fb = d.phase === 'fb';
  const split = HAS_DOM && window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const padKeys = [['1', '2', '3', '4'], ['7', '8', '9', '0']], btnNames = ['A', 'B', 'X', 'Y'];
  const pad = p => {
    const tiles = d.opts.map((id, k) => {
      let state = '';
      if (fb) state = id === item.answer ? 'right' : id === d.picks[p] ? 'wrong' : 'dim';
      else if (d.picks[p] === id) state = 'wrong';
      return tile(authBy(id), k, { act: 'buzz', key: padKeys[p][k] + ' · ' + btnNames[k], state, disabled: fb || d.locked[p], extra: `data-p="${p}"` });
    }).join('');
    return `<section class="pad p${p + 1} ${d.locked[p] && !fb ? 'locked' : ''}" aria-label="Player ${p + 1}">
      <div class="pad-h"><b>Player ${p + 1}</b><span class="score">${d.score[p]}</span></div>
      <p class="padprompt">${esc(item.prompt)}</p><div class="tiles">${tiles}</div></section>`;
  };
  let h = `<div class="playbar"><span><b>Duel</b></span><span>Round ${d.i + 1} / ${d.items.length}</span><span>P1: keys 1–4 or controller 1 · P2: keys 7–0 or controller 2</span><button class="btn sm ghost sp" data-act="back">Leave</button></div>`;
  h += `<div class="duel ${split && !fb ? 'split' : ''}" tabindex="-1" ${fb ? '' : 'data-autofocus'}><p class="prompt mainprompt" style="margin-top:14px">${esc(item.prompt)}</p>`;
  if (!fb) h += `<div class="duel-arena">${pad(0)}${pad(1)}</div>`;
  h += '</div>';

  }
  return h;
}

function render() {

  const app = $('#app');
  const ae = document.activeElement, prevSig = ae && app.contains(ae) && ae.dataset ? sigOf(ae) : null;
  app.innerHTML = html;
  updateChrome();
  const key = viewKey(), changed = key !== lastViewKey, screenChanged = key.split('|')[0] !== lastViewKey.split('|')[0];
  lastViewKey = key;
  if (changed) {
    if (screenChanged) window.scrollTo(0, 0);
    const af = app.querySelector('[data-autofocus]:not([disabled])') || firstFocusable(app);
    if (af) af.focus({ preventScroll: true });
    if (S.scrollTo) { const el = app.querySelector(S.scrollTo); if (el) el.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
    else if (!screenChanged && af) af.scrollIntoView({ block: 'nearest' });
  } else if (prevSig) {
    const el = Array.from(app.querySelectorAll('[data-act]')).find(e => !e.disabled && sigOf(e) === prevSig)
      || app.querySelector('[data-refocus]:not([disabled])') || firstFocusable(app);
    if (el) el.focus({ preventScroll: true });
  }
  S.scrollTo = null;
  if (S.screen === 'auth') bindAuthSearch();
  if (S.screen === 'map') { const sel = $('#map-select'); if (sel) sel.onchange = () => { S.map.ti = +sel.value; S.map.node = null; render(); }; }
}
function updateChrome() {
  const snd = $('#nav-sound');
  snd.textContent = P.settings.sound ? 'Sound on' : 'Sound off';
  snd.setAttribute('aria-pressed', String(!!P.settings.sound));
  $('#nav-home').hidden = S.screen === 'home';
  $('#foot').innerHTML = `<span>Content as of ${esc(DB.asOf)}</span><span>${DB.topics.length} topics · ${DB.authList.length} authorities · ${DB.items.length} exercises</span><span>Study aid — read the current text before you file.</span>`;
}
function applyTheme() {
  if (!HAS_DOM) return;
  const t = P.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function bindAuthSearch() {
  const q = $('#auth-q'); if (!q) return;
  q.oninput = () => { S.auth.q = q.value; $('#auth-list').innerHTML = authListHTML(); };
}
const FOCUSABLE = 'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), summary, [tabindex="0"]';
function visible(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length); }
function focusables(scope) { return Array.from(scope.querySelectorAll(FOCUSABLE)).filter(visible); }
function firstFocusable(scope) { return focusables(scope)[0] || null; }
function navScope() { return S.modal ? $('#modal') : $('#shell'); }
function moveFocus(dir) {
  const scope = navScope(), list = focusables(scope), cur = document.activeElement;
  if (!list.length) return;
  if (!cur || !list.includes(cur)) { const af = scope.querySelector('#app [data-autofocus]:not([disabled])'); (af && visible(af) ? af : list[0]).focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  list.forEach(el => {
    if (el === cur) return;
    const q = el.getBoundingClientRect(), ex = q.left + q.width / 2, ey = q.top + q.height / 2;
    let primary, secondary;
    if (dir === 'right') { primary = q.left - r.right + (ex - cx) * 0.25; secondary = Math.abs(ey - cy); if (ex <= cx + 1) return; }
    else if (dir === 'left') { primary = r.left - q.right + (cx - ex) * 0.25; secondary = Math.abs(ey - cy); if (ex >= cx - 1) return; }
    else if (dir === 'down') { primary = q.top - r.bottom + (ey - cy) * 0.25; secondary = Math.abs(ex - cx); if (ey <= cy + 1) return; }
    else { primary = r.top - q.bottom + (cy - ey) * 0.25; secondary = Math.abs(ex - cx); if (ey >= cy - 1) return; }
    const score = Math.max(0, primary) + secondary * 2;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
}

/* ---------- modal + toast ---------- */
let modalReturn = null;
function confirmBox(o) {
  modalReturn = HAS_DOM ? document.activeElement : null;
  S.modal = o; renderModal();
}
function renderModal() {
  if (!HAS_DOM) return;
  const m = $('#modal'), shell = $('#shell');
  if (!S.modal) { m.hidden = true; m.innerHTML = ''; shell.inert = false; shell.removeAttribute('aria-hidden'); if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true }); return; }
  const o = S.modal;
  m.innerHTML = `<div class="scrim" data-act="modal-no"></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t">${esc(o.title)}</h2><p>${esc(o.body)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-no" data-autofocus>${esc(o.no || 'Cancel')}</button>
    <button class="btn ${o.danger ? 'danger' : 'primary'}" data-act="modal-yes">${esc(o.yes)}</button></div></div>`;
  m.hidden = false; shell.inert = true; shell.setAttribute('aria-hidden', 'true');
  m.querySelector('[data-autofocus]').focus();
}
function closeModal() { S.modal = null; renderModal(); }
function toast(msg) {
  if (!HAS_DOM) return;
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(S.toastT); S.toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- timers ---------- */
let tickH = null, lastTick = 0;
function ensureTick() { if (!HAS_DOM || tickH) return; lastTick = performance.now(); tickH = setInterval(tick, 200); }
function stopTick() { if (tickH) clearInterval(tickH); tickH = null; }
function tick() {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  const s = S.sess; if (!s) { stopTick(); return; }
  if (document.hidden || S.modal || s.cur.phase !== 'ask') return;
  if (s.mode === 'objection') {
    s.timeLeft -= dt;
    const el = $('#obj-time'); if (el) el.textContent = fmtTime(s.timeLeft);
    if (s.timeLeft <= 0) { s.timeLeft = 0; endSession(); return; }
  }
  if (s.cur.clock != null) {
    const before = Math.ceil(s.cur.clock); s.cur.clock -= dt; const after = Math.ceil(s.cur.clock);
    if (after < before && after <= 5 && after > 0) Sound.tick();
    const bar = $('#clock-bar'); if (bar) bar.style.width = clamp(s.cur.clock / SHOT_CLOCK * 100, 0, 100).toFixed(1) + '%';
    if (s.cur.clock <= 0) { s.cur.clock = 0; answerCard(null); }
  }
}

/* ---------- sound: soft, low, opt-out ---------- */
const Sound = {
  ctx: null,
  init() {
    if (!HAS_DOM || this.ctx) { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type, vol, when) {
    if (!this.ctx || !P.settings.sound) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = Math.min(freq, 440);
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol || 0.035, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) { }
  },
  right() { this.tone(262, 0.2, 'sine', 0.035); this.tone(330, 0.28, 'sine', 0.03, 0.11); },
  wrong() { this.tone(147, 0.32, 'triangle', 0.045); this.tone(123, 0.4, 'triangle', 0.035, 0.13); },
  click() { this.tone(196, 0.06, 'sine', 0.018); },
  tick() { this.tone(220, 0.05, 'sine', 0.015); },
  gavel() { this.tone(98, 0.22, 'triangle', 0.06); this.tone(98, 0.3, 'triangle', 0.05, 0.24); }
};

/* ---------- click delegation ---------- */
function onAct(el) {
  const d = el.dataset, a = d.act;
  switch (a) {
    case 'home': goHome(); break;
    case 'back': back(); break;
    case 'settings': openMode('settings'); break;
    case 'mode': openMode(d.mode, d.topic); break;
    case 'drill': startSession('quick', { topic: d.topic }); break;
    case 'pick': answerCard(+d.i); break;
    case 'tf': answerTF(d.v === '1'); break;
    case 'tray': trayPick(+d.i); break;
    case 'slot': slotRemove(+d.i); break;
    case 'undo': chainUndo(); break;
    case 'clear': chainClear(); break;
    case 'submit': submitChain(); break;
    case 'next': nextItem(); break;
    case 'hint': actionX(); break;
    case 'adjourn': adjourn(); break;
    case 'buzz': buzz(+d.p, +d.i); break;
    case 'duelnext': duelNext(); break;
    case 'node': S.map.node = S.map.node === d.id ? null : d.id; render();
      if (HAS_DOM && S.map.node) { const nd = $('#node-detail'); if (nd) nd.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' }); } break;
    case 'maptopic': mapStep(+d.dir); break;
    case 'authtype': { const i = S.auth.types.indexOf(d.t); if (i >= 0) S.auth.types.splice(i, 1); else S.auth.types.push(d.t); render(); break; }
    case 'sound': P.settings.sound = !P.settings.sound; save(); updateChrome(); if (S.screen === 'settings') render(); if (P.settings.sound) { Sound.init(); Sound.click(); } break;
    case 'toggle': P.settings[d.key] = !P.settings[d.key]; save(); render(); break;
    case 'theme': P.settings.theme = d.v; save(); applyTheme(); render(); break;
    case 'reset': confirmBox({ title: 'Motion to vacate all progress', body: 'This clears XP, rank, every Leitner box and your stats on this device. It cannot be undone.', yes: 'Grant motion', no: 'Deny', danger: true,
      onYes: () => { const keep = P.settings; P = freshProgress(); P.settings = keep; save(); toast('Progress vacated. Fresh docket.'); render(); } }); break;
    case 'modal-no': closeModal(); break;
    case 'modal-yes': { const f = S.modal && S.modal.onYes; S.modal = null; renderModal(); if (f) f(); break; }
    case 'again': { const ls = S.lastStart; if (!ls) goHome(); else if (ls.mode === 'duel') startDuel(); else startSession(ls.mode, ls.opts); break; }
  }
}

/* ---------- keyboard ---------- */
function onKey(e) {
  Sound.init();
  const k = e.key, tag = (e.target && e.target.tagName) || '';
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter', ' '].includes(k)) document.documentElement.classList.add('kbd-nav');
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.modal) {
    if (k === 'Escape') { e.preventDefault(); closeModal(); }
    else if (k.startsWith('Arrow')) { e.preventDefault(); moveFocus(k.slice(5).toLowerCase()); }
    else if (k === 'Tab') { const l = focusables($('#modal')); if (l.length) { e.preventDefault(); const i = l.indexOf(document.activeElement); l[(i + (e.shiftKey ? -1 : 1) + l.length) % l.length].focus(); } }
    return;
  }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    if (k === 'Escape') { e.preventDefault(); e.target.blur(); back(); }
    return;
  }
  if (k.startsWith('Arrow')) { e.preventDefault(); moveFocus(k.slice(5).toLowerCase()); return; }
  if (k === 'Escape') { e.preventDefault(); back(); return; }
  const lk = k.toLowerCase();
  if (S.screen === 'duel' && S.duel && S.duel.phase === 'ask') {
    const p1 = '1234'.indexOf(k), p2 = '7890'.indexOf(k);
    if (p1 >= 0) { e.preventDefault(); buzz(0, p1); } else if (p2 >= 0) { e.preventDefault(); buzz(1, p2); }
    return;
  }
  if (S.screen === 'play' && S.sess) {
    const item = curItem(), ask = S.sess.cur.phase === 'ask';
    if (ask && item.kind === 'card' && /^[1-4]$/.test(k)) { e.preventDefault(); answerCard(+k - 1); return; }
    if (ask && item.kind === 'chain' && /^[1-9]$/.test(k)) { e.preventDefault(); trayPick(+k - 1); return; }
    if (ask && item.kind === 'chain' && k === 'Backspace') { e.preventDefault(); chainUndo(); return; }
    if (ask && item.kind === 'tf' && (lk === 't' || lk === 's')) { e.preventDefault(); answerTF(true); return; }
    if (ask && item.kind === 'tf' && (lk === 'f' || lk === 'o')) { e.preventDefault(); answerTF(false); return; }
    if (lk === 'h') { e.preventDefault(); actionX(); return; }
  }
  if (S.screen === 'map' && (k === '[' || k === ']')) { e.preventDefault(); mapStep(k === ']' ? 1 : -1); }
}

/* ---------- gamepad (standard mapping) ---------- */
const GP = { prev: {}, held: {}, DEAD: 0.5, DELAY: 380, REPEAT: 140, names: {} };
function padState(pad) {
  const b = i => !!(pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5));
  const ax = i => pad.axes && pad.axes.length > i ? pad.axes[i] : 0;
  return {
    up: b(12) || ax(1) < -GP.DEAD, down: b(13) || ax(1) > GP.DEAD, left: b(14) || ax(0) < -GP.DEAD, right: b(15) || ax(0) > GP.DEAD,
    A: b(0), B: b(1), X: b(2), Y: b(3), LB: b(4), RB: b(5), View: b(8), Start: b(9)
  };
}
function connectedPads() {
  if (!navigator.getGamepads) return [];
  return Array.from(navigator.getGamepads()).filter(p => p && p.connected !== false).sort((a, b) => a.index - b.index);
}
function pollPads(now) {
  const pads = connectedPads();
  pads.forEach((pad, player) => {
    const st = padState(pad), prev = GP.prev[pad.index] || {}, held = GP.held[pad.index] || (GP.held[pad.index] = {});
    Object.keys(st).forEach(name => {
      if (st[name] && !prev[name]) { held[name] = now + GP.DELAY; padPress(player, name); }
      else if (st[name] && ['up', 'down', 'left', 'right'].includes(name) && now >= held[name]) { held[name] = now + GP.REPEAT; padPress(player, name); }
    });
    GP.prev[pad.index] = st;
  });
  requestAnimationFrame(pollPads);
}
function padPress(player, name) {
  document.documentElement.classList.add('kbd-nav');
  Sound.init();
  const dir = { up: 'up', down: 'down', left: 'left', right: 'right' }[name];
  if (S.modal) {
    if (dir) moveFocus(dir);
    else if (name === 'A') { const f = document.activeElement; if (f && $('#modal').contains(f)) f.click(); }
    else if (name === 'B') closeModal();
    return;
  }
  if (S.screen === 'duel' && S.duel && S.duel.phase === 'ask') {
    const idx = { A: 0, B: 1, X: 2, Y: 3 }[name];
    if (idx != null && player < 2) { buzz(player, idx); return; }
    if (name === 'Start') { back(); return; }
    return;
  }
  if (dir) { moveFocus(dir); return; }
  switch (name) {
    case 'A': { const f = document.activeElement; if (f && f !== document.body && $('#shell').contains(f)) f.click(); else { const t = firstFocusable($('#app')); if (t) t.focus(); } break; }
    case 'B': back(); break;
    case 'X': actionX(); break;
    case 'Y': toggleSources(); break;
    case 'LB': if (S.screen === 'map') mapStep(-1); break;
    case 'RB': if (S.screen === 'map') mapStep(1); break;
    case 'Start': if (S.screen === 'play') adjourn(); else if (S.screen === 'duel') back(); else goHome(); break;
    case 'View': openMode('settings'); break;
  }
}

/* ---------- boot ---------- */
function boot() {
  applyTheme();
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    Sound.init(); onAct(el);
  });
  document.addEventListener('pointerdown', () => { document.documentElement.classList.remove('kbd-nav'); Sound.init(); }, { passive: true });
  document.addEventListener('keydown', onKey);
  window.addEventListener('gamepadconnected', e => {
    const n = connectedPads().findIndex(p => p.index === e.gamepad.index) + 1;
    toast('Controller ' + (n || 1) + ' connected');
  });
  window.addEventListener('gamepaddisconnected', () => toast('Controller disconnected'));
  if (window.matchMedia) {
    const mq = window.matchMedia('(pointer: coarse)');
    const rer = () => { if (S.screen === 'duel') render(); };
    if (mq.addEventListener) mq.addEventListener('change', rer);
  }
  render();
  if (navigator.getGamepads) requestAnimationFrame(pollPads);
}

if (HAS_DOM) boot();
else if (typeof module !== 'undefined') {
  module.exports = { DB, S, TEST, get P() { return P; }, view, render, startSession, startItem, answerCard, answerTF, trayPick, slotRemove, submitChain,
    nextItem, endSession, startDuel, buzz, duelNext, openMode, goHome, mapStep, actionX, buildDocket, unlockedLevel, mastery, grade, curItem, rankInfo, onAct };
}
</script>
