ufficient (c)(7).","why":"Day 71 is the day a late unsecured claim becomes objectionable under § 502(b)(9).","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3004":{"id":"frbp-3004","type":"rule","cite":"Fed. R. Bankr. P. 3004","short":"Debtor files claim for creditor","holding":"If a creditor does not file a proof of claim within the time set by Rule 3002(c) or 3003(c), the debtor or trustee may file one for it within 30 days after the creditor's time to file expires, and the clerk must promptly notify the creditor, debtor and trustee.","why":"Use it when you need a creditor paid through the plan (a co-signed loan, a nondischargeable tax) and the creditor sat on its hands.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3004","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3004"],"status":"current text as of 2026-11-12","group":"g2"},"lbr-3004-1":{"id":"lbr-3004-1","type":"local","cite":"E.D.N.C. LBR 3004-1","short":"EDNC: creditor may amend debtor-filed claim","holding":"If the debtor or trustee files a proof of claim for a creditor under Rule 3004, the creditor may file an amended proof of claim under Rule 3002 or 3003(c).","why":"Filing a placeholder claim for a creditor in EDNC invites the creditor to come back with its own number.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (local rules effective Oct. 15, 2026; an older version tied the deadline to service of the trustee's claims list - don't rely on it). The court's PDF 'Local Rules 10-15-26' states (LBR 1001-1(d)) that the rules are effective Oct. 15, 2026, and the Administrative Guide is marked current as of 10/15/2026; when checked on Nov. 12, 2026 the court's Local Rules page still labeled the 7-22-24 rules 'most recent', so confirm the posted version.","group":"g2"},"frbp-3007":{"id":"frbp-3007","type":"rule","cite":"Fed. R. Bankr. P. 3007","short":"How to object to a claim","holding":"An objection and notice must be filed and served at least 30 days before the hearing (or response deadline), by mail on the person designated on the proof of claim (plus Rule 7004(h) service on an FDIC-insured depository institution); it may not demand Rule 7001 relief; and unless the court orders otherwise, objections to multiple claims may be joined only if the claims were filed by the same entity or on listed grounds (e.g., duplicate, untimely, satisfied or released), with no more than 100 claims per omnibus objection.","why":"It's the procedural checklist for every objection your office files - service and the 30-day notice are where objections die.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3007","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3007"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3008":{"id":"frbp-3008","type":"rule","cite":"Fed. R. Bankr. P. 3008 (with 11 U.S.C. § 502(j))","short":"Reconsidering an allowed claim","holding":"A party in interest may move to reconsider an order allowing or disallowing a claim, and after notice and a hearing the court must issue an appropriate order; § 502(j) provides that an allowed or disallowed claim may be reconsidered for cause.","why":"Once a claim has been allowed by court order, undoing it takes a motion to reconsider and cause - not a fresh objection.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3008","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3008","https://www.law.cornell.edu/uscode/text/11/502"],"status":"current text as of 2026-11-12","group":"g2"},"case-midland":{"id":"case-midland","type":"scotus","cite":"Midland Funding, LLC v. Johnson, 581 U.S. 224 (2017)","short":"Stale-debt claim isn't FDCPA violation","holding":"Filing a proof of claim that is obviously time-barred in a Chapter 13 case is not a false, deceptive, misleading, unfair or unconscionable debt-collection practice under the FDCPA (5-3, Breyer, J.).","why":"No FDCPA counterclaim for a stale claim - the remedy is a § 502(b)(1) objection, which is why the trustee and debtor's counsel must actually object.","sources":["https://www.law.cornell.edu/supremecourt/text/16-348","https://leagle.com/decision/insco20170515h95","https://app.midpage.ai/case/midland-funding-llc-v-johnson-4168362"],"status":"good law as of 2026-11-12","group":"g2"},"case-raleigh":{"id":"case-raleigh","type":"scotus","cite":"Raleigh v. Illinois Dept. of Revenue, 530 U.S. 15 (2000)","short":"Burden of proof follows substantive law","holding":"The burden of proof on a tax claim in bankruptcy remains where the substantive (nonbankruptcy) law puts it, because the burden is an essential element of the claim itself.","why":"On an objection, don't assume the creditor always bears the ultimate burden - look at who bears it under state or federal law outside bankruptcy.","sources":["https://supreme.justia.com/cases/federal/us/530/15","https://www.govinfo.gov/content/pkg/USREPORTS-530/pdf/USREPORTS-530-15.pdf"],"status":"good law as of 2026-11-12","group":"g2"},"case-dubois":{"id":"case-dubois","type":"4th","cite":"Dubois v. Atlas Acquisitions LLC, 834 F.3d 522 (4th Cir. 2016)","short":"4th Cir.: POC is collection, stale OK","holding":"Filing a proof of claim is debt-collection activity regulated by the FDCPA, but filing one on a time-barred debt does not violate the FDCPA when the statute of limitations (there, Maryland's) does not extinguish the debt.","why":"The Fourth Circuit got to Midland's result a year early; its point that a proof of claim is collection activity matters if a creditor's claim is false in other ways.","sources":["https://cases.justia.com/federal/appellate-courts/ca4/15-1945/416170794/0.pdf","https://app.midpage.ai/case/chaille-dubois-v-atlas-acquisitions-4028562","https://www.scotusblog.com/case-files/cases/dubois-v-atlas-acquisitions-llc"],"status":"good law as of 2026-11-12 (cert. denied May 22, 2017; consistent with Midland)","group":"g2"},"usc-1322b5":{"id":"usc-1322b5","type":"code","cite":"11 U.S.C. § 1322(b)(5)","short":"Cure and maintain long-term debt","holding":"Notwithstanding § 1322(b)(2), a plan may provide for curing any default within a reasonable time and maintaining payments while the case is pending on any secured or unsecured claim whose last payment is due after the final plan payment.","why":"It's how a behind-on-the-house client keeps the house: arrears through the plan, regular payments continue.","sources":["https://www.law.cornell.edu/uscode/text/11/1322","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1322.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-1322e":{"id":"usc-1322e","type":"code","cite":"11 U.S.C. § 1322(e)","short":"Cure amount set by the loan documents","holding":"Notwithstanding § 1322(b)(2), § 506(b) and § 1325(a)(5), if a plan proposes to cure a default, the amount necessary to cure is determined in accordance with the underlying agreement and applicable nonbankruptcy law.","why":"If the note doesn't provide for interest on arrears, the servicer doesn't get it in the cure.","sources":["https://www.law.cornell.edu/uscode/text/11/1322","https://www.mdb.uscourts.gov/files/harding.pdf"],"status":"current text as of 2026-11-12; added by the Bankruptcy Reform Act of 1994 and applies to agreements entered into after Oct. 22, 1994","group":"g2"},"usc-506b":{"id":"usc-506b","type":"code","cite":"11 U.S.C. § 506(b)","short":"Oversecured: interest, fees, costs","holding":"To the extent an allowed secured claim is secured by property worth more than the claim, the holder is allowed interest on the claim and any reasonable fees, costs, or charges provided for under the agreement or State statute under which the claim arose.","why":"It's the source of the mortgagee's (or HOA's) right to tack on reasonable fees - and the 'reasonable' and 'oversecured' limits you object with.","sources":["https://www.law.cornell.edu/uscode/text/11/506","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapI-sec506.htm"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3001c2":{"id":"frbp-3001c2","type":"rule","cite":"Fed. R. Bankr. P. 3001(c)(2)","short":"Individual-case claim attachments (Form 410A)","holding":"In an individual debtor's case the claim must include an itemized statement of prepetition interest, fees, expenses and charges (A), the amount needed to cure any default as of the petition date for a secured claim (B), and for a security interest in the principal residence the Mortgage Proof of Claim Attachment (Official Form 410A) and, if there is an escrow account, an escrow statement prepared as of the petition date (C).","why":"Form 410A is where you check the servicer's arrearage math against your client's payment history.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3001","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3001"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3002c6":{"id":"frbp-3002c6","type":"rule","cite":"Fed. R. Bankr. P. 3002(c)(6)","short":"Mortgage claim: 70 days, then 120","holding":"A claim secured by a security interest in the debtor's principal residence is timely if the proof of claim and Rule 3001(c)(2)(C) attachments are filed within 70 days after the order for relief and the Rule 3001(c)(1) and (d) attachments (the note and security-interest evidence) are filed as a supplement within 120 days after the order for relief.","why":"The servicer gets extra time only for the note and deed of trust - Form 410A is still due on day 70.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3002-1b":{"id":"frbp-3002-1b","type":"rule","cite":"Fed. R. Bankr. P. 3002.1(b)","short":"Notice of payment change: 21 days","holding":"The holder must file and serve a notice of any change in the payment amount (Form 410S-1) at least 21 days before the new payment is due; a HELOC holder may instead give an annual notice with a reconciliation amount; an untimely increase takes effect only on the first due date at least 21 days after the late notice, an untimely decrease takes effect on the actual due date; and any party in interest may move to determine whether the change is required - if no motion is filed before the new payment is due, the change takes effect.","why":"Escrow jumps arrive as payment change notices - review them and object before the effective date, not after.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002.1","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002-1","https://www.deb.uscourts.gov/sites/deb/files/news/Rule%203002.1%202025%20Amendments.pdf"],"status":"current text as of 2026-11-12 (amended eff. Dec. 1, 2025: HELOC and untimely-notice provisions)","group":"g2"},"frbp-3002-1c":{"id":"frbp-3002-1c","type":"rule","cite":"Fed. R. Bankr. P. 3002.1(c), (d), (e)","short":"Postpetition fee notice: 180 days","holding":"The holder must file and serve an itemized notice of postpetition fees, expenses, or charges (Form 410S-2) within 180 days after they are incurred, filed as a supplement to the proof of claim and not subject to Rule 3001(f); a party in interest may move to determine whether they are owed within one year after the notice was served.","why":"Those $350 'inspection' and attorney-fee notices are challengeable for a year - calendar it.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002.1","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002-1"],"status":"current text as of 2026-11-12 (Rule 3002.1 as amended eff. Dec. 1, 2025)","group":"g2"},"frbp-3002-1f":{"id":"frbp-3002-1f","type":"rule","cite":"Fed. R. Bankr. P. 3002.1(f)","short":"Mid-case motion to determine status","holding":"From the order for relief until the trustee files the end-of-case notice, the trustee or debtor may move (Official Form 410C13-M1) to determine the status of the mortgage claim; the holder responds within 28 days after service (Form 410C13-M1R) if it disputes the facts, and the court then decides after notice and a hearing or may grant an undisputed motion on its stated facts.","why":"New since Dec. 1, 2025: a mid-case checkpoint before a refinance, sale or loan modification, instead of finding out at discharge.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002.1","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002-1","https://www.deb.uscourts.gov/sites/deb/files/news/Rule%203002.1%202025%20Amendments.pdf","https://www.ncwb.uscourts.gov/news/bankruptcy-rules-and-forms-amendments-take-effect-december-1-2025"],"status":"current text as of 2026-11-12 (new subdivision eff. Dec. 1, 2025)","group":"g2"},"frbp-3002-1g":{"id":"frbp-3002-1g","type":"rule","cite":"Fed. R. Bankr. P. 3002.1(g)","short":"End-of-case notice, response, final cure","holding":"Within 45 days after the debtor completes all payments due to the trustee, the trustee files a notice of disbursements made (Form 410C13-N); the holder responds within 28 days after service (Form 410C13-NR); within 45 days after the response (or the notice, if none) the debtor or trustee may move to determine final cure and payment (Form 410C13-M2), with a holder response due within 28 days after service (Form 410C13-M2R).","why":"This is how your client leaves Chapter 13 with a court order saying the mortgage is current.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002.1","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002-1","https://www.deb.uscourts.gov/sites/deb/files/news/Rule%203002.1%202025%20Amendments.pdf","https://www.ncwb.uscourts.gov/news/bankruptcy-rules-and-forms-amendments-take-effect-december-1-2025"],"status":"current text as of 2026-11-12 (restructured eff. Dec. 1, 2025; the old 30-day trustee notice and 21-day response periods are gone)","group":"g2"},"frbp-3002-1h":{"id":"frbp-3002-1h","type":"rule","cite":"Fed. R. Bankr. P. 3002.1(h)","short":"Servicer sanctions for silence","holding":"If the holder fails to provide information required by the rule, the court may, after notice and a hearing, preclude it from presenting the omitted information as evidence (unless the failure was substantially justified or harmless), award other appropriate relief including reasonable expenses and attorney's fees, or take any other action the rule authorizes.","why":"Your leverage when a servicer surfaces with 'unpaid escrow' after it ignored the end-of-case notice.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3002.1","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3002-1","https://www.deb.uscourts.gov/sites/deb/files/news/Rule%203002.1%202025%20Amendments.pdf"],"status":"current text as of 2026-11-12 (sanctions are subdivision (h) after the Dec. 1, 2025 amendment; some older materials call it (i))","group":"g2"},"lbr-3070-2":{"id":"lbr-3070-2","type":"local","cite":"E.D.N.C. LBR 3070-2","short":"EDNC residential mortgage payments","holding":"EDNC's rule defines Conduit Payments (postpetition mortgage payments paid through the trustee, other than Gap Payments) and Gap Payments (the first two full postpetition payments coming due after the petition, unless a confirmed plan specifies otherwise), requires at least 21 days' notice of a change in the name or identity of the creditor or servicer, and at plan completion requires the trustee to file the Rule 3002.1(g)(1) notice and - where all postpetition payments went through the trustee as Conduit Payments and allowed arrears and Gap Payments were paid - a motion under Rule 3002.1(g)(4)(A) stating the unpaid principal balance.","why":"It layers EDNC's conduit system on top of Rule 3002.1 - know whether your client's mortgage is conduit or direct.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (local rules effective Oct. 15, 2026). The court's PDF 'Local Rules 10-15-26' states (LBR 1001-1(d)) that the rules are effective Oct. 15, 2026, and the Administrative Guide is marked current as of 10/15/2026; when checked on Nov. 12, 2026 the court's Local Rules page still labeled the 7-22-24 rules 'most recent', so confirm the posted version.","group":"g2"},"case-rake":{"id":"case-rake","type":"scotus","cite":"Rake v. Wade, 508 U.S. 464 (1993)","short":"Arrears interest - superseded by 1322(e)","holding":"An oversecured home mortgagee was entitled under §§ 506(b) and 1325(a)(5) to preconfirmation and postconfirmation interest on arrearages cured through a Chapter 13 plan, even though the mortgage did not provide for it.","why":"A classic trap: Congress displaced Rake with § 1322(e) for agreements entered into after Oct. 22, 1994, so the note controls interest on arrears today.","sources":["https://www.mdb.uscourts.gov/files/harding.pdf","https://www.casemine.com/commentary/us/supreme-court-upholds-creditor's-right-to-interest-on-oversecured-claims-in-chapter-13-bankruptcies/view"],"status":"note: superseded by statute (11 U.S.C. § 1322(e)) for agreements entered into after Oct. 22, 1994","group":"g2"},"usc-341":{"id":"usc-341","type":"code","cite":"11 U.S.C. § 341(a), (c)","short":"Meeting of creditors","holding":"Within a reasonable time after the order for relief, the United States trustee must convene and preside at a meeting of creditors, and the court may not preside at or attend any meeting under § 341; in North Carolina, a Bankruptcy Administrator district with no U.S. Trustee, the Bankruptcy Administrator program fills the U.S. trustee's role.","why":"The 341 meeting is the first (and cheapest) place creditors and the trustee get the debtor under oath - no judge in the room.","sources":["https://www.law.cornell.edu/uscode/text/11/341","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIII-sec341.htm","https://www.law.cornell.edu/rules/frbp/rule_9035","https://www.nceba.uscourts.gov/"],"status":"note: current statutory text as of 2026-11-12 says 'United States trustee'; North Carolina uses Bankruptcy Administrators instead of a U.S. Trustee (see Fed. R. Bankr. P. 9035), so read that reference accordingly in EDNC.","group":"g2"},"usc-343":{"id":"usc-343","type":"code","cite":"11 U.S.C. § 343","short":"Debtor examined under oath at 341","holding":"The debtor must appear and submit to examination under oath at the § 341(a) meeting, where creditors, any indenture trustee, any trustee or examiner, or the United States trustee (in North Carolina, the Bankruptcy Administrator) may examine the debtor.","why":"Prep your client: every creditor gets to ask questions at the 341, not just the Chapter 13 trustee.","sources":["https://www.law.cornell.edu/uscode/text/11/343","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIII-sec343.htm","https://www.law.cornell.edu/rules/frbp/rule_9035"],"status":"note: current text as of 2026-11-12; North Carolina is a Bankruptcy Administrator district (no U.S. Trustee; see Fed. R. Bankr. P. 9035).","group":"g2"},"frbp-2004b":{"id":"frbp-2004b","type":"rule","cite":"Fed. R. Bankr. P. 2004(a), (b)","short":"Rule 2004: who and what","holding":"On a party in interest's motion the court may order the examination of any entity, limited to the debtor's acts, conduct or property, liabilities and financial condition, matters affecting estate administration, or the right to a discharge, and in a Chapter 13 case also the source of money or property for the plan and any other matter relevant to the case or to formulating a plan.","why":"Broad enough to reach a relative who 'contributes' plan payments - but it's about the debtor and the estate, not your separate lawsuit.","sources":["https://www.law.cornell.edu/rules/frbp/rule_2004","https://www.courtrules.net/federal/bankruptcy-procedure/rule-2004"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-2004c":{"id":"frbp-2004c","type":"rule","cite":"Fed. R. Bankr. P. 2004(c), (e)","short":"Compelling 2004 attendance","holding":"An entity may be compelled under Rule 9016 to attend and produce documents or ESI regardless of the district where the examination is held, an attorney admitted in the court where the case is pending may issue and sign the subpoena, and a nondebtor witness must first be tendered mileage and one day's witness fee.","why":"The 2004 order authorizes the exam; the Rule 45 subpoena is what makes a reluctant bank or servicer show up.","sources":["https://www.law.cornell.edu/rules/frbp/rule_2004","https://www.courtrules.net/federal/bankruptcy-procedure/rule-2004"],"status":"current text as of 2026-11-12","group":"g2"},"lbr-2004-1":{"id":"lbr-2004-1","type":"local","cite":"E.D.N.C. LBR 2004-1","short":"EDNC: 2004 motions ex parte","holding":"A motion for an examination under Rule 2004 will be reviewed by the court and may be allowed ex parte, and filing a motion to reconsider stays the obligation to appear or produce documents pending a ruling.","why":"No hearing needed to get the order - but the target can freeze it by moving to reconsider.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Red-Lined.pdf"],"status":"current text as of 2026-11-12 (local rules effective Oct. 15, 2026). The court's PDF 'Local Rules 10-15-26' states (LBR 1001-1(d)) that the rules are effective Oct. 15, 2026, and the Administrative Guide is marked current as of 10/15/2026; when checked on Nov. 12, 2026 the court's Local Rules page still labeled the 7-22-24 rules 'most recent', so confirm the posted version.","group":"g2"},"ednc-adminguide":{"id":"ednc-adminguide","type":"local","cite":"E.D.N.C. Administrative Guide to Practice and Procedure, Service Chart (current as of 10/15/2026)","short":"EDNC service chart notice periods","holding":"The court's service chart lists 30 days' notice for an objection to claim (pointing to Rule 3007(a)(2) for service requirements), 21 days' notice for an application to sell property (see Rule 2002(a)(2)), no notice period for a Chapter 13 motion to incur debt or purchase property (served on the trustee), and says a Rule 2004 motion should be filed at least 14 days before the examination unless all parties consent.","why":"It's the EDNC cheat sheet your staff uses for who gets served and how much notice each pleading needs.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/NCEB%20Admin%20Guide%20-%20Newest.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/Admin%20Guide%20-%20Most%20Recent.pdf"],"status":"note: administrative guidance, not a local rule; guide is marked current as of 10/15/2026 and the listed entries also appear in the prior (6/1/2022) guide","group":"g2"},"frbp-9014c":{"id":"frbp-9014c","type":"rule","cite":"Fed. R. Bankr. P. 9014(c)","short":"Discovery rules in contested matters","holding":"Unless the court orders otherwise, listed Part VII rules - including 7026 and 7028-7037 (discovery) - apply in a contested matter, but Civil Rule 26(a)(1), (a)(2), (a)(3) disclosures and the 26(f) conference do not; the court may apply other Part VII rules at any stage.","why":"A stay-relief motion or claim objection is a contested matter: you get interrogatories, document requests and depositions without an adversary proceeding.","sources":["https://www.law.cornell.edu/rules/frbp/rule_9014","https://www.courtrules.net/federal/bankruptcy-procedure/rule-9014","https://cdn.considerchapter13.org/content/uploads/2026/07/17200441/Rule-amendment-article.pdf","https://www.supremecourt.gov/orders/courtorders/frbk26_o7jp.pdf"],"status":"current text as of 2026-11-12; the Supreme Court-approved amendment effective Dec. 1, 2026 amends Rule 9014's testimony provision (open court, remote testimony for cause) and adds interpreters, but no change to (c) was identified.","group":"g2"},"frbp-7001":{"id":"frbp-7001","type":"rule","cite":"Fed. R. Bankr. P. 7001","short":"What needs an adversary proceeding","holding":"Adversary proceedings include proceedings to recover money or property (with exceptions), to determine the validity, priority or extent of a lien (except Rule 3012 and 4003(d) proceedings), to sell a co-owner's interest under § 363(h), to object to or revoke a discharge, to revoke plan confirmation, to determine dischargeability, to obtain an injunction or subordinate a claim (except as provided in a plan), declaratory judgments related to these, and removed claims.","why":"If your 'motion' asks for any of these, it has to be a complaint - and Rule 3007(b) says you can't sneak it into a claim objection.","sources":["https://www.law.cornell.edu/rules/frbp/rule_7001","https://www.courtrules.net/federal/bankruptcy-procedure/rule-7001"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-9016":{"id":"frbp-9016","type":"rule","cite":"Fed. R. Bankr. P. 9016","short":"Rule 45 subpoenas apply","holding":"Fed. R. Civ. P. 45 applies in a bankruptcy case.","why":"Every bankruptcy subpoena - 2004 exam, contested matter or adversary - follows Civil Rule 45's service, place-of-compliance and objection rules.","sources":["https://www.law.cornell.edu/rules/frbp/rule_9016","https://www.courtrules.net/federal/bankruptcy-procedure/rule-9016"],"status":"current text as of 2026-11-12","group":"g2"},"case-washingtonmutual":{"id":"case-washingtonmutual","type":"other","cite":"In re Washington Mutual, Inc., 408 B.R. 45 (Bankr. D. Del. 2009)","short":"Pending proceeding rule limits 2004","holding":"Applying the judge-made 'pending proceeding' rule, once an adversary proceeding or contested matter is pending, discovery related to it must proceed under the Rule 7026 et seq. discovery rules rather than Rule 2004, though a 2004 exam on matters unrelated to the pending proceeding may go forward.","why":"Courts won't let Rule 2004 be used to dodge the discovery-rule protections once a stay motion, claim objection or adversary is underway.","sources":["https://hallapproved.com/de/cases/federal/bankruptcy/2009/1966778/","https://www.nelsonmullins.com/insights/blogs/red-zone/bankruptcy-rules/bankruptcy-litigation-practice-tip-the-pending-proceeding-rule","https://insolvency.foxrothschild.com/2017/11/no-2004-discovery-under-pending-proceeding-rule/","https://www.ganb.uscourts.gov/sites/default/files/opinions/13-1024.pdf","https://www.ncmb.uscourts.gov/sites/default/files/opinions/southeast.pdf"],"status":"good law as of 2026-11-12 (persuasive, not binding in EDNC; the rule is judge-made and appears nowhere in Rule 2004's text)","group":"g2"},"usc-363b":{"id":"usc-363b","type":"code","cite":"11 U.S.C. § 363(b)(1)","short":"Sale outside ordinary course","holding":"The trustee, after notice and a hearing, may use, sell, or lease property of the estate other than in the ordinary course of business.","why":"Selling a house or inherited land is never 'ordinary course' for a consumer debtor - it needs notice and a chance for a hearing (§ 102(1) allows no actual hearing if none is timely requested).","sources":["https://www.law.cornell.edu/uscode/text/11/363","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIV-sec363.htm","https://www.law.cornell.edu/uscode/text/11/102"],"status":"current text as of 2026-11-12","group":"g2"},"usc-363f":{"id":"usc-363f","type":"code","cite":"11 U.S.C. § 363(f)","short":"Free and clear: five gateways","holding":"Property may be sold free and clear of another entity's interest only if nonbankruptcy law permits it, the entity consents, the interest is a lien and the price exceeds the aggregate value of all liens, the interest is in bona fide dispute, or the entity could be compelled to accept a money satisfaction.","why":"Closing attorneys want liens off the title - you need one of these five to get a judgment or disputed lien stripped at closing.","sources":["https://www.law.cornell.edu/uscode/text/11/363","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIV-sec363.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-363m":{"id":"usc-363m","type":"code","cite":"11 U.S.C. § 363(m)","short":"Good-faith buyer survives appeal","holding":"Reversal or modification on appeal of an authorization of a sale or lease does not affect its validity as to an entity that purchased in good faith, whether or not it knew of the appeal, unless the authorization and sale were stayed pending appeal.","why":"An objector who wants to undo your client's sale must get a stay pending appeal; otherwise the good-faith buyer keeps the house.","sources":["https://www.law.cornell.edu/uscode/text/11/363","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIV-sec363.htm","https://www.supremecourt.gov/opinions/22pdf/598us1r14_3e04.pdf","https://www.jonesday.com/en/insights/2024/05/fifth-circuit-recent-us-supreme-court-ruling-did-not-alter-mootness-requirements-for-unstayed-bankruptcy-sale-orders"],"status":"current text as of 2026-11-12; MOAC Mall Holdings LLC v. Transform Holdco LLC, 598 U.S. 288 (2023) (unanimous), holds § 363(m) is not jurisdictional - it is a defense that can be waived or forfeited","group":"g2"},"usc-1303":{"id":"usc-1303","type":"code","cite":"11 U.S.C. § 1303","short":"Ch. 13 debtor holds 363 sale powers","holding":"Subject to any limitations on a trustee under Chapter 13, the debtor has, exclusive of the trustee, the rights and powers of a trustee under §§ 363(b), (d), (e), (f), and (l).","why":"This is why your client - not the Chapter 13 trustee - is the movant on a Chapter 13 motion to sell.","sources":["https://www.law.cornell.edu/uscode/text/11/1303","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1303.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-1306":{"id":"usc-1306","type":"code","cite":"11 U.S.C. § 1306","short":"Ch. 13 estate grows: earnings, inheritances","holding":"Property of a Chapter 13 estate includes § 541 property plus all such property the debtor acquires, and earnings from services performed, after commencement and before the case is closed, dismissed or converted; except as a confirmed plan or confirmation order provides, the debtor remains in possession of estate property.","why":"Mid-plan windfalls - an inheritance, a lawsuit, a bonus - can belong to the estate even years after filing.","sources":["https://www.law.cornell.edu/uscode/text/11/1306","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1306.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-1327b":{"id":"usc-1327b","type":"code","cite":"11 U.S.C. § 1327(b), (c)","short":"Confirmation vests property in debtor","holding":"Except as otherwise provided in the plan or the order confirming the plan, confirmation vests all property of the estate in the debtor, and (c) that vested property is free and clear of claims of creditors provided for by the plan.","why":"Vesting is a default rule - read your plan and confirmation order before telling a client a post-confirmation sale is 'their business'.","sources":["https://www.law.cornell.edu/uscode/text/11/1327","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1327.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-1305":{"id":"usc-1305","type":"code","cite":"11 U.S.C. § 1305(a)(2), (c)","short":"Postpetition consumer-debt claims","holding":"A creditor may file a claim for a postpetition consumer debt for property or services necessary for the debtor's performance under the plan, but the claim shall be disallowed if the holder knew or should have known that prior trustee approval of the debt was practicable and was not obtained.","why":"Tell the car dealer to get the trustee's blessing first - otherwise its claim in the plan can be disallowed.","sources":["https://www.law.cornell.edu/uscode/text/11/1305","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13-subchapI-sec1305.htm"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-6004":{"id":"frbp-6004","type":"rule","cite":"Fed. R. Bankr. P. 6004(a), (b), (c), (h) (with 2002(a)(2))","short":"Sale notice, objection, 14-day stay","holding":"Notice of a proposed use, sale or lease outside the ordinary course goes under Rule 2002(a)(2) (at least 21 days' notice by mail unless the court shortens it); objections are due at least 7 days before the date set for the proposed action; a free-and-clear sale requires a Rule 9014 motion served on the lienholders; and an order authorizing a sale is stayed for 14 days after entry unless the court orders otherwise.","why":"The 14-day stay is what blows up closing dates - ask for a waiver in the motion if the buyer needs to close fast.","sources":["https://www.law.cornell.edu/rules/frbp/rule_6004","https://www.courtrules.net/federal/bankruptcy-procedure/rule-6004","https://www.law.cornell.edu/rules/frbp/rule_2002","https://www.courtrules.net/federal/bankruptcy-procedure/rule-2002"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-4001c3":{"id":"frbp-4001c3","type":"rule","cite":"Fed. R. Bankr. P. 4001(c)(3)","short":"Rule 4001(c) skips Chapter 13","holding":"Rule 4001(c), governing motions to obtain credit, does not apply in a Chapter 13 case.","why":"A Chapter 13 car-loan request is governed by § 1305 and the local rule, not the Chapter 11-style 4001(c) summary and 14-day hearing requirements.","sources":["https://www.law.cornell.edu/rules/frbp/rule_4001","https://www.courtrules.net/federal/bankruptcy-procedure/rule-4001"],"status":"current text as of 2026-11-12 (added 2019; the 2019 committee note leaves open whether the Code requires a non-business Ch. 13 debtor to get approval for credit)","group":"g2"},"lbr-4002-1g":{"id":"lbr-4002-1g","type":"local","cite":"E.D.N.C. LBR 4002-1(g)(4)-(6)","short":"EDNC: $15,000 sell/borrow/buy limits","holding":"After the petition and until the plan is completed, a Chapter 13 debtor may not, without a court order, dispose of property (whether vested or not) with non-exempt equity over $15,000, incur debt of $15,000 or more in a single or related transactions, or buy an item of property of $15,000 or more with non-exempt assets; debt and purchase applications go out with notice per the service chart and may be approved without a hearing if no one objects.","why":"This is the EDNC trip-wire for every inheritance sale, refinance and car purchase in your Chapter 13 caseload.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (local rules effective Oct. 15, 2026 set all three thresholds at $15,000; an undated earlier version on the court's site used lower figures - retire old forms). The court's PDF 'Local Rules 10-15-26' states (LBR 1001-1(d)) that the rules are effective Oct. 15, 2026, and the Administrative Guide is marked current as of 10/15/2026; when checked on Nov. 12, 2026 the court's Local Rules page still labeled the 7-22-24 rules 'most recent', so confirm the posted version.","group":"g2"},"case-murphy":{"id":"case-murphy","type":"4th","cite":"Murphy v. O'Donnell (In re Murphy), 474 F.3d 143 (4th Cir. 2007)","short":"Modify only on unanticipated change","holding":"Res judicata bars modifying a confirmed plan under § 1329 unless the debtor experienced a substantial and unanticipated post-confirmation change in financial condition; Murphy's sale of his condo for $235,000 (a 51.6% increase over its $155,000 petition-date value in eleven months) qualified, but the Goralskis' cash-out refinance (a loan, not income) did not.","why":"When your client sells for a windfall, the trustee can come for the proceeds; a refinance alone doesn't open that door.","sources":["https://hallapproved.com/us/cases/ca4/2007/796538","https://www.casemine.com/commentary/us/fourth-circuit-establishes-criteria-for-modifying-confirmed-chapter-13-plans/view","https://www.wvnb.uscourts.gov/sites/wvnb/files/opinions/13-260%20Jones%20-%20MemOp.pdf"],"status":"good law as of 2026-11-12","group":"g2"},"case-carroll":{"id":"case-carroll","type":"4th","cite":"Carroll v. Logan, 735 F.3d 147 (4th Cir. 2013)","short":"Late inheritance is Ch. 13 estate property","holding":"Section 1306(a) extends the § 541 timeline for Chapter 13 estates, so an inheritance received about three years after filing (well beyond § 541(a)(5)'s 180 days) was property of the estate that could be brought into the plan for unsecured creditors.","why":"The client who inherits Grandma's house in year three doesn't get to keep it out of the case just because 180 days have passed.","sources":["https://law.justia.com/cases/federal/appellate-courts/ca4/13-1024/13-1024-2013-10-28.html","https://app.midpage.ai/case/rickey-carroll-v-john-logan-1087283","https://www.wvnb.uscourts.gov/sites/wvnb/files/opinions/13-260%20Jones%20-%20MemOp.pdf"],"status":"good law as of 2026-11-12","group":"g2"},"usc-1322a":{"id":"usc-1322a","type":"code","cite":"11 U.S.C. § 1322(a)","short":"Mandatory plan terms","holding":"A plan must submit as much of the debtor's future income to the trustee as the plan needs, must pay § 507 priority claims in full in deferred cash payments unless the holder agrees otherwise, must treat every claim in a class the same, and may pay less than in full on § 507(a)(1)(B) assigned support claims only if all projected disposable income for 5 years goes into the plan.","why":"These are the trustee's first checks: a plan that shorts a priority tax claim without the taxing authority's consent cannot be confirmed.","sources":["https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm","https://uscode.house.gov/us/usc/119-118/t11/s1322/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1324b":{"id":"usc-1324b","type":"code","cite":"11 U.S.C. § 1324(b)","short":"Confirmation hearing: 20-45 days after 341","holding":"The confirmation hearing may be held no earlier than 20 days and no later than 45 days after the § 341(a) meeting, unless the court finds an earlier hearing is in the best interests of creditors and the estate and no one objects to the earlier date.","why":"This is the window the clerk uses when setting the hearing in the Notice of Chapter 13 Case; § 1324(a) also lets any party in interest object.","sources":["https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm","https://uscode.house.gov/us/usc/119-118/t11/s1324/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a3":{"id":"usc-1325a3","type":"code","cite":"11 U.S.C. § 1325(a)(3)","short":"Plan proposed in good faith","holding":"The court shall confirm only if the plan has been proposed in good faith and not by any means forbidden by law.","why":"This is the trustee's catch-all objection, and in the Fourth Circuit it survives full compliance with the means test (Goddard v. Burnett, 2026).","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://www.ca4.uscourts.gov/opinions/251303.P.pdf"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a4":{"id":"usc-1325a4","type":"code","cite":"11 U.S.C. § 1325(a)(4)","short":"Best-interests (liquidation) floor","holding":"The value, as of the plan's effective date, of property to be distributed on each allowed unsecured claim must be at least what that claim would receive if the estate were liquidated under Chapter 7 on that date.","why":"Nonexempt equity sets the minimum unsecured dividend; E.D.N.C. Local Form 113A § 2.6 calls it the 'Liquidation Value.'","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://www.nceb.uscourts.gov/sites/nceb/files/Chapter%2013%20Plan-Revised%2812-1-2025%29_0.pdf"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a7":{"id":"usc-1325a7","type":"code","cite":"11 U.S.C. § 1325(a)(7)","short":"Petition filed in good faith","holding":"The debtor's action in filing the petition must have been in good faith.","why":"Separate from (a)(3): (a)(3) tests the plan, while (a)(7) tests why the case was filed at all (for example, a filing made only to stall someone).","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://uscode.house.gov/us/usc/119-118/t11/s1325/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a8":{"id":"usc-1325a8","type":"code","cite":"11 U.S.C. § 1325(a)(8)-(9)","short":"Post-petition support paid; returns filed","holding":"The debtor must have paid all domestic support obligations that first became payable after the petition date (where required by order or statute) under (a)(8), and must have filed all applicable federal, state and local tax returns as required by § 1308 under (a)(9).","why":"These are pass/fail confirmation conditions: unpaid post-petition child support or a missing return blocks confirmation no matter how good the plan math is.","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://uscode.house.gov/us/usc/119-118/t11/s1325/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1327":{"id":"usc-1327","type":"code","cite":"11 U.S.C. § 1327(a)-(c)","short":"Effect of confirmation: binding, vesting","holding":"A confirmed plan binds the debtor and each creditor whether or not the creditor's claim is provided for and whether or not it objected, accepted or rejected; unless the plan or order says otherwise, confirmation vests estate property in the debtor, free and clear of claims of creditors provided for by the plan.","why":"It works like res judicata in Ch. 13, and it is why Local Form 113A § 7.1 makes you pick when property vests (at confirmation, at discharge or another stated event).","sources":["https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm","https://www.law.cornell.edu/uscode/text/11/1327"],"status":"current text as of 2026-11-12","group":"g3"},"frbp-3015":{"id":"frbp-3015","type":"rule","cite":"Fed. R. Bankr. P. 3015(b), (c), (f), (g)","short":"Plan filing, form, objections, binding amounts","holding":"The plan is due with the petition or within 14 days (b); the debtor must use Official Form 113 unless the court adopted a local form under Rule 3015.1, and a nonstandard provision works only if placed in the form's designated section (c); objections are due at least 7 days before the confirmation hearing, and if none is timely filed the court may find good faith without receiving evidence (f); on confirmation, a secured-claim amount determined in the plan under Rule 3012 binds the holder even against a contrary proof of claim, and a plan request to terminate the stay is granted (g).","why":"Rule 3015(g) is why valuation by plan, and stay relief on surrender by plan, actually stick after confirmation.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3015","https://federal-rules.pages.dev/bankruptcy/3015","https://www.supremecourt.gov/orders/courtorders/frbk26_o7jp.pdf"],"status":"current restyled text (effective Dec. 1, 2024; stylistic only). Rule 3015 is not among the rules amended by the Supreme Court's order for Dec. 1, 2026 (Rules 1007, 2007.1, 3001, 3018, 5009, 9006, 9014, 9017 and new 7043). The 2017 committee note says a governmental unit's secured claim cannot be fixed through the plan under Rule 3012.","group":"g3"},"lbr-3015-3":{"id":"lbr-3015-3","type":"local","cite":"E.D.N.C. LBR 3015-3 (Local Rules effective Oct. 15, 2026)","short":"EDNC confirmation procedure","holding":"Unless extended for cause, the plan is due within 14 days of the petition and must be served on the trustee and all creditors; the clerk sets the hearing and the objection deadline, and the court may confirm if no timely objection is filed. Rule 3015(f) objections are due at least 7 days before the hearing, and a late objector must file a separate request to extend. An amended plan filed within 21 days of the hearing needs a rescheduled date from the clerk. A sustained objection gives the debtor 30 days to amend unless otherwise ordered. If all objecting parties settle, the settlement hurts no one else and no other objection remains, the court may conditionally confirm, with the amended plan filed and served within 14 days after the hearing.","why":"This is the local layer on top of Rule 3015 that governs every Wilmington confirmation calendar.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/NCEB%20Local%20Rules%20-%20Most%20Recent.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf","https://www.nceb.uscourts.gov/node/12523"],"status":"note: text from the court's 'Local Rules - Most Recent' PDF, effective Oct. 15, 2026 (LBR 1001-1(d)). Under LBR 1001-1(e) the rules govern cases and proceedings filed after that date and also apply to proceedings then pending, except where the court finds that would not be feasible or would work injustice. The draft was posted for comment Aug. 27, 2026.","group":"g3"},"case-espinosa":{"id":"case-espinosa","type":"scotus","cite":"United Student Aid Funds, Inc. v. Espinosa, 559 U.S. 260 (2010)","short":"Confirmed-plan error isn't void","holding":"A confirmed Chapter 13 plan that discharged student-loan interest without the required undue-hardship determination was legal error, not a void judgment under Civil Rule 60(b)(4), so it bound the creditor, which had actual notice and neither objected nor appealed; the Court added that bankruptcy courts must independently refuse to confirm such a provision even when no one objects.","why":"Pair it with § 1327(a): confirmation binds creditors who had notice and stayed silent, but slipping a § 523(a)(8) discharge into a plan invites the court's independent duty to refuse confirmation, and sanctions.","sources":["https://supreme.justia.com/cases/federal/us/559/260/","https://www.law.cornell.edu/supct/html/08-1134.ZS.html"],"status":"good law as of 2026-11-12","group":"g3"},"case-deans":{"id":"case-deans","type":"4th","cite":"Deans v. O'Donnell, 692 F.2d 968 (4th Cir. 1982)","short":"Good faith = totality, no % rule","holding":"Section 1325(a)(3) does not contain a per se 'substantial repayment' requirement. Good faith is decided case by case on the totality of the circumstances, asking whether the debtor has abused the provisions, purpose or spirit of Chapter 13. The court listed factors including the percentage repaid, the debtor's finances, plan length, employment history and prospects, the nature and amount of unsecured claims, past filings, honesty, and unusual problems.","why":"This is the Fourth Circuit's good-faith test, and EDNC trustees still argue from it.","sources":["https://m.openjurist.org/692/f2d/968","https://case-law.vlex.com/vid/deans-v-donnell-no-891191465","https://www.ca4.uscourts.gov/opinions/251303.P.pdf"],"status":"good law as of 2026-11-12. The Fourth Circuit applied the Deans standard post-BAPCPA in Goddard v. Burnett, No. 25-1303 (4th Cir. Apr. 28, 2026).","group":"g3"},"case-neufeld":{"id":"case-neufeld","type":"4th","cite":"Neufeld v. Freeman, 794 F.2d 149 (4th Cir. 1986)","short":"Pre-petition misconduct counts in good faith","holding":"Under the Deans totality test, the court must weigh the debtor's pre-petition conduct, whether the debts would be nondischargeable in Chapter 7 (such as claims from fraud or other wrongful conduct), and recent prior bankruptcy filings. The Fourth Circuit vacated a confirmation order because the lower courts had not weighed them.","why":"When the big unsecured claim is a fraud judgment and the plan offers pennies, this is the case the objecting creditor cites.","sources":["https://law.justia.com/cases/federal/appellate-courts/F2/794/149/230866/","https://www.ncmb.uscourts.gov/sites/default/files/opinions/Good%20faith_ch13%20plan%20confirmation_chapter%2020%20DR.pdf"],"status":"good law as of 2026-11-12 (still applied post-BAPCPA, e.g., In re Hubbard, Bankr. M.D.N.C. 2015)","group":"g3"},"usc-101-10a":{"id":"usc-101-10a","type":"code","cite":"11 U.S.C. § 101(10A)","short":"Current monthly income (CMI)","holding":"CMI is the average monthly income from all sources, taxable or not, over the 6 months before filing, plus regular contributions to household expenses by others. It excludes Social Security Act benefits, payments to victims of war crimes or terrorism, and monthly compensation, pension, pay, annuity or allowance paid under title 10, 37 or 38 in connection with a disability, combat-related injury or disability, or death of a member of the uniformed services (chapter 61 retired pay is excluded only above the amount the debtor would otherwise receive).","why":"It is the starting point for Forms 122C-1/122C-2, the median comparison and the commitment period, and the reason a retiree on Social Security often shows little or no CMI.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s101/","https://www.govinfo.gov/content/pkg/PLAW-116publ52/html/PLAW-116publ52.htm","https://www.nclc.org/images/pdf/bankruptcy/haven-act-guide-nov2019.pdf"],"status":"current text as of 2026-11-12. Subparagraph (B) was rewritten by the HAVEN Act, Pub. L. 116-52 (Aug. 23, 2019), with a near-identical enactment in Pub. L. 116-92 (Dec. 20, 2019). A temporary COVID-era exclusion was added and later struck.","group":"g3"},"usc-1325b1":{"id":"usc-1325b1","type":"code","cite":"11 U.S.C. § 1325(b)(1)","short":"Trustee objection: all PDI to unsecureds","holding":"If the trustee or an unsecured creditor objects, the plan can be confirmed only if, as of the effective date, it pays that claim in full or commits all of the debtor's projected disposable income for the applicable commitment period to unsecured creditors.","why":"This is the provision that triggers the means-test fight. Without an objection, (b) isn't in play.","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://uscode.house.gov/us/usc/119-118/t11/s1325/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325b2":{"id":"usc-1325b2","type":"code","cite":"11 U.S.C. § 1325(b)(2)-(3)","short":"Disposable income defined","holding":"Disposable income is current monthly income (other than child support, foster care or disability payments for a dependent child, to the extent reasonably necessary to be spent for that child) minus amounts reasonably necessary for the support of the debtor and dependents (including post-petition domestic support obligations and charitable contributions up to 15% of gross income) and, for a debtor in business, business expenses. Under (b)(3), if annualized CMI is above the state median, reasonably necessary expenses must be determined under § 707(b)(2)(A) and (B).","why":"This is the bridge from CMI to the number the trustee demands. Being above or below median decides whether you use Schedule J or the IRS standards.","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://uscode.house.gov/us/usc/119-118/t11/s1325/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325b4":{"id":"usc-1325b4","type":"code","cite":"11 U.S.C. § 1325(b)(4)","short":"Applicable commitment period 3 or 5","holding":"The applicable commitment period is 3 years, or not less than 5 years if the annualized CMI of the debtor and spouse is not less than the state median for the household size, and it may be shorter only if the plan pays all allowed unsecured claims in full over the shorter period.","why":"It sets the minimum plan length when (b)(1) is invoked. Local Form 113A § 2.5 says the plan isn't complete before the commitment period runs.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1325/","https://www.law.cornell.edu/uscode/text/11/1325"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1322d":{"id":"usc-1322d","type":"code","cite":"11 U.S.C. § 1322(d)","short":"Maximum plan length","holding":"If the combined annualized CMI of the debtor and spouse is not less than the state median, the plan may not exceed 5 years; if below median, it may not exceed 3 years unless the court approves a longer period for cause, never more than 5 years.","why":"This sets the ceiling, not the floor. A below-median debtor curing big mortgage arrears needs 'cause' to go to 60 months.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1322/","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm"],"status":"current text as of 2026-11-12. The household-size dollar add-on in the printed text is adjusted under § 104 (latest adjustment effective Apr. 1, 2025).","group":"g3"},"usc-707b2":{"id":"usc-707b2","type":"code","cite":"11 U.S.C. § 707(b)(2)(A)-(B) (applied by § 1325(b)(3))","short":"Means-test expense deductions","holding":"Allowed monthly expenses are the debtor's 'applicable' IRS National and Local Standards amounts plus actual Other Necessary Expenses, along with listed items such as health and disability expenses. Secured debts count at the payments contractually due over the 60 months after filing (plus amounts needed to cure on a home, vehicle or other necessary collateral) divided by 60, and priority debts at the total divided by 60. The expense allowances may not include payments for debts.","why":"This is the expense half of Form 122C-2 for above-median debtors, and every Ransom-type fight happens here.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s707/","https://www.law.cornell.edu/supremecourt/text/09-907"],"status":"current text as of 2026-11-12. Dollar figures in (b)(2) are adjusted under § 104 (latest Apr. 1, 2025).","group":"g3"},"usc-1325a6":{"id":"usc-1325a6","type":"code","cite":"11 U.S.C. § 1325(a)(6)","short":"Feasibility","holding":"The court shall confirm only if the debtor will be able to make all payments under the plan and comply with the plan.","why":"Feasibility asks whether the debtor can pay, not where the money comes from, which is why Social Security counts here (Ranta).","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://www.ca4.uscourts.gov/Opinions/Published/122017.P.pdf"],"status":"current text as of 2026-11-12","group":"g3"},"case-lanning":{"id":"case-lanning","type":"scotus","cite":"Hamilton v. Lanning, 560 U.S. 505 (2010)","short":"Projected DI is forward-looking","holding":"In calculating projected disposable income, a bankruptcy court may account for changes in the debtor's income or expenses that are known or virtually certain at the time of confirmation, rather than mechanically multiplying the 6-month CMI figure.","why":"Use it when the 6-month look-back is distorted by a one-time bonus or a job that just ended, and expect the trustee to use it when income is about to rise.","sources":["https://supreme.justia.com/cases/federal/us/560/505/","https://www.law.cornell.edu/supremecourt/text/08-998"],"status":"good law as of 2026-11-12","group":"g3"},"case-ransom":{"id":"case-ransom","type":"scotus","cite":"Ransom v. FIA Card Services, N.A., 562 U.S. 61 (2011)","short":"No car payment, no ownership deduction","holding":"A debtor who owns a car outright and makes no loan or lease payments may not take the IRS Local Standards vehicle 'Ownership Costs' deduction under § 707(b)(2)(A)(ii)(I). An expense amount is 'applicable' only if the debtor will actually incur that kind of expense, though the Operating Costs allowance remains available.","why":"It is the standard trustee objection to Form 122C-2 for paid-off vehicles.","sources":["https://supreme.justia.com/cases/federal/us/562/61/","https://www.law.cornell.edu/supremecourt/text/09-907"],"status":"good law as of 2026-11-12","group":"g3"},"case-ranta":{"id":"case-ranta","type":"4th","cite":"Mort Ranta v. Gorman, 721 F.3d 241 (4th Cir. 2013)","short":"SS out of PDI, in for feasibility","holding":"Social Security income is excluded from projected disposable income under § 1325(b), but when the debtor proposes to fund the plan with it, the court must consider it in judging feasibility under § 1325(a)(6). A debtor with zero or negative projected disposable income owes unsecured creditors nothing under (b)(1)(B) but must still meet the other confirmation tests, and excluding Social Security income alone is not bad faith (n.15). The court also held that a denial of confirmation is a final, appealable order.","why":"This is the Fourth Circuit's controlling case for every retiree or SSDI client, and it lines up with the office's standing rule that Social Security is excluded from the unsecured distribution.","sources":["https://www.ca4.uscourts.gov/Opinions/Published/122017.P.pdf","https://openjurist.org/721/f3d","https://case-law.vlex.com/vid/ranta-v-gorman-no-887199443"],"status":"good law as of 2026-11-12. Goddard v. Burnett (4th Cir. 2026) cites it for the point that a (b)-compliant plan must still meet every other confirmation requirement.","group":"g3"},"case-pliler":{"id":"case-pliler","type":"4th","cite":"Pliler v. Stearns, 747 F.3d 260 (4th Cir. 2014)","short":"ACP is a time requirement","holding":"The applicable commitment period is a temporal requirement, so an above-median debtor must propose a 5-year plan even with negative projected disposable income unless allowed unsecured claims are paid in full sooner.","why":"Above-median, negative disposable income and a 36-month plan with early-payoff language: the trustee will extend it to 60 months, and Pliler backs the trustee.","sources":["https://caselaw.findlaw.com/court/us-4th-circuit/1661642.html","https://case-law.vlex.com/vid/pliler-v-stearns-no-893746259"],"status":"good law as of 2026-11-12","group":"g3"},"case-goddard":{"id":"case-goddard","type":"4th","cite":"Goddard v. Burnett, No. 25-1303 (4th Cir. Apr. 28, 2026) (published)","short":"Passing means test ≠ good faith","holding":"A plan that technically complies with the § 1325(b) means test can still be denied confirmation for lack of good faith under § 1325(a)(3) under the Deans totality test. The court affirmed denial of an E.D.N.C. above-median debtor's plan that kept three recently purchased luxury vehicles while paying unsecured creditors about 7.7%.","why":"This is the newest Fourth Circuit word on means test versus good faith, and it came out of an EDNC case: luxury secured debt deducted on Form 122C-2 can sink a plan under (a)(3).","sources":["https://www.ca4.uscourts.gov/opinions/251303.P.pdf","https://law.counselstack.com/opinion/bobby-goddard-v-michael-burnett-ca4-2026","https://volo.abi.org/node/5720"],"status":"note: published opinion (Niemeyer, J., for a unanimous panel), decided Apr. 28, 2026, affirming E.D.N.C. No. 5:24-cv-00368-D. Good law as of 2026-11-12: no F.4th reporter cite, rehearing or cert activity was found in searches, so cite it by docket number and date and check for a reporter cite before filing.","group":"g3"},"usc-506a1":{"id":"usc-506a1","type":"code","cite":"11 U.S.C. § 506(a)(1)","short":"Bifurcation: secured to collateral value","holding":"An allowed claim secured by a lien is a secured claim to the extent of the value of the creditor's interest in the estate's interest in the collateral and an unsecured claim for the rest, with value determined in light of the purpose of the valuation and the proposed use or disposition of the property.","why":"This is the engine of every cramdown (car, furniture, rental property) and of every Chapter 13 strip-off of a valueless lien.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s506/","https://www.law.cornell.edu/uscode/text/11/506"],"status":"current text as of 2026-11-12","group":"g3"},"usc-506a2":{"id":"usc-506a2","type":"code","cite":"11 U.S.C. § 506(a)(2)","short":"Replacement value for personal property","holding":"For an individual Chapter 7 or 13 debtor, personal property securing an allowed claim is valued at replacement value as of the petition date without deduction for costs of sale or marketing, and for property acquired for personal, family or household purposes, replacement value means the price a retail merchant would charge for property of that kind considering its age and condition.","why":"This is why trade-in value doesn't win the car-valuation fight: the statute points to retail.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s506/","https://www.law.cornell.edu/uscode/text/11/506"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a5":{"id":"usc-1325a5","type":"code","cite":"11 U.S.C. § 1325(a)(5)(A)-(C)","short":"Three doors for secured claims","holding":"For each allowed secured claim provided for by the plan: (A) the holder accepts the plan; or (B) the holder retains its lien until the earlier of payment of the underlying debt under nonbankruptcy law or a § 1328 discharge, and receives property whose present value is not less than the allowed secured claim; or (C) the debtor surrenders the collateral to the holder.","why":"This is the cramdown statute. Present value under (B)(ii) is where the Till interest rate comes in.","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://uscode.house.gov/us/usc/119-118/t11/s1325/"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1325a-hanging":{"id":"usc-1325a-hanging","type":"code","cite":"11 U.S.C. § 1325(a) (unnumbered paragraph after (a)(9), the 'hanging paragraph')","short":"910-day car / 1-year rule","holding":"For purposes of § 1325(a)(5), § 506 does not apply to a claim secured by a purchase-money security interest in a motor vehicle acquired for the debtor's personal use if the debt was incurred within 910 days before filing, or in any other thing of value if the debt was incurred within 1 year before filing.","why":"Count the days from the purchase to the petition. Inside 910, the client keeps the car only by paying the full claim. E.D.N.C. Local Form 113A § 3.4 pays these '910 Claims' in full with interest at the stated rate.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1325/","https://www.law.cornell.edu/uscode/text/11/1325"],"status":"current text as of 2026-11-12","group":"g3"},"frbp-30151":{"id":"frbp-30151","type":"rule","cite":"Fed. R. Bankr. P. 3015.1","short":"Local form plan requirements","holding":"A district may require a single local form plan instead of Official Form 113 only if it is adopted after public notice and comment, has numbered and labeled paragraphs, opens with a paragraph where the debtor indicates whether the plan has nonstandard provisions, limits a secured claim based on valuation, or avoids a lien, and has separate paragraphs for curing home-mortgage defaults, domestic support obligations, claims described in § 1325(a)'s final paragraph, and surrender with stay termination. It must also end with a nonstandard-provisions paragraph and an attorney certification.","why":"It is the national authority behind EDNC's Local Form 113A and its Part 1 check boxes.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3015.1","https://www.nceb.uscourts.gov/news/new-local-form-chapter-13-plans?page=4"],"status":"current restyled text (effective Dec. 1, 2024; stylistic only); not amended by the Dec. 1, 2026 package","group":"g3"},"lbr-form-113a":{"id":"lbr-form-113a","type":"local","cite":"E.D.N.C. Local Form 113A, Chapter 13 Plan (rev. 12-1-2025); see E.D.N.C. LBR 3015-1","short":"EDNC local form plan","holding":"The Part 1 boxes for limiting secured claims, lien avoidance and nonstandard provisions must be checked 'Included' or the provision is not effective, even if set out later in the plan. § 3.3 values and modifies undersecured claims, but real-estate valuation requires a separate motion. § 3.4 pays 910 and 1-year claims in full with interest at the stated rate. § 3.5 lien avoidance requires a separate motion. Under § 3.6, confirmation ends the § 362(a) stay as to surrendered collateral and the § 1301 stay in all respects, and no deficiency is allowed unless the creditor timely files a claim and amends it within 180 days after confirmation (or as extended by order); otherwise surrender is deemed full satisfaction.","why":"This is the form you file in every EDNC case. Most cramdown and surrender mistakes turn out to be mistakes in Part 1 or § 3.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Chapter%2013%20Plan-Revised%2812-1-2025%29_0.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/NCEB%20Local%20Rules%20-%20Most%20Recent.pdf"],"status":"note: current form revised 12-1-2025 as posted on nceb.uscourts.gov. Interest rates in §§ 3.2-3.4 are left blank for the stated rate; only § 3.5 refers to 'the Till rate', and the form sets no default rate.","group":"g3"},"lbr-3070-1":{"id":"lbr-3070-1","type":"local","cite":"E.D.N.C. LBR 3070-1(c) (Local Rules effective Oct. 15, 2026)","short":"Pre-confirmation adequate protection","holding":"Unless the plan has the debtor pay the entire secured claim directly, pre-confirmation adequate protection payments to a creditor whose allowed claim is secured by personal property, to the extent attributable to the debtor's purchase of it, go through the trustee (the court may order another method). The presumptive § 1326(a)(1) payment is at least 1% of collateral value as of the petition date, valued solely by the trustee subject to further court consideration; the trustee need not pay where the secured value is under $2,000; and the trustee's statutory commission applies.","why":"It answers the car lender who calls before confirmation asking where its money is.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/NCEB%20Local%20Rules%20-%20Most%20Recent.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"note: text from the court's 'Local Rules - Most Recent' PDF, effective Oct. 15, 2026 (LBR 1001-1(d)). Under LBR 1001-1(e) the rules govern cases and proceedings filed after that date and also apply to proceedings then pending, except where the court finds that would not be feasible or would work injustice. The draft was posted for comment Aug. 27, 2026.","group":"g3"},"usc-522f":{"id":"usc-522f","type":"code","cite":"11 U.S.C. § 522(f)(1)-(2)","short":"Avoiding judicial liens and NPMSIs","holding":"The debtor may avoid, to the extent it impairs an exemption, (A) a judicial lien other than one securing a domestic support obligation, or (B) a nonpossessory, nonpurchase-money security interest in household goods, tools of the trade or prescribed health aids. A lien impairs an exemption to the extent the lien, plus all other liens, plus the exemption exceeds the value of the debtor's interest absent liens, and the formula doesn't apply to a judgment arising out of a mortgage foreclosure.","why":"Use it on card-judgment liens on the homestead and finance-company liens on furniture. In EDNC it requires a separate motion (Local Form 113A § 3.5).","sources":["https://uscode.house.gov/us/usc/119-118/t11/s522/","https://www.law.cornell.edu/uscode/text/11/522"],"status":"current text as of 2026-11-12","group":"g3"},"case-rash":{"id":"case-rash","type":"scotus","cite":"Associates Commercial Corp. v. Rash, 520 U.S. 953 (1997)","short":"Replacement value, not foreclosure value","holding":"When a Chapter 13 debtor keeps collateral over the creditor's objection under § 1325(a)(5)(B), § 506(a) values it at replacement value, meaning the cost the debtor would incur to obtain a like asset for the same proposed use, not foreclosure value (here, a tractor truck used in the debtors' freight business).","why":"This is the origin of the replacement-value rule that Congress codified for individual 7/13 debtors in § 506(a)(2). Footnote 6 left retail versus wholesale to the courts, a question the statute now answers for household property.","sources":["https://supreme.justia.com/cases/federal/us/520/953/","https://law.resource.org/pub/us/case/reporter/US/520/520.US.953.96-454.html"],"status":"good law as of 2026-11-12, now largely codified for personal property of individual Ch. 7 and 13 debtors by § 506(a)(2)","group":"g3"},"case-till":{"id":"case-till","type":"scotus","cite":"Till v. SCS Credit Corp., 541 U.S. 465 (2004)","short":"Prime-plus cramdown interest","holding":"In a plurality opinion, the Court held that the present-value interest rate under § 1325(a)(5)(B)(ii) is set by the prime-plus 'formula' approach: start with the national prime rate and add a risk adjustment after a hearing, noting that courts generally approve 1% to 3%. The Court rejected the coerced-loan, presumptive-contract-rate and cost-of-funds approaches.","why":"A 24% contract rate on a crammed car loan is out, and prime plus a risk premium is in.","sources":["https://supreme.justia.com/cases/federal/us/541/465/","https://www.law.cornell.edu/supct/html/02-1016.ZS.html"],"status":"good law as of 2026-11-12 (plurality opinion of 4 Justices; Thomas, J., concurred in the judgment)","group":"g3"},"case-kenney":{"id":"case-kenney","type":"4th","cite":"Tidewater Finance Co. v. Kenney, 531 F.3d 312 (4th Cir. 2008)","short":"Surrendered 910 car: deficiency survives","holding":"When a Chapter 13 debtor surrenders a 910 vehicle under § 1325(a)(5)(C), the hanging paragraph doesn't extinguish the creditor's contract and state-law right to an unsecured deficiency, which must be treated as an unsecured claim in the plan.","why":"Surrender doesn't wipe out a 910 deficiency in the Fourth Circuit. In EDNC, the Local Form 113A § 3.6 180-day amendment deadline is how that deficiency gets claimed or lost.","sources":["https://hallapproved.com/us/cases/ca4/2008/1026000","https://law.counselstack.com/opinion/tidewater-finance-co-v-kenney-ca4-2008"],"status":"good law as of 2026-11-12","group":"g3"},"usc-1322b2":{"id":"usc-1322b2","type":"code","cite":"11 U.S.C. § 1322(b)(2)","short":"Home-mortgage anti-modification","holding":"A plan may modify the rights of holders of secured and unsecured claims, other than a claim secured only by a security interest in real property that is the debtor's principal residence.","why":"A home-only first mortgage can't be crammed or have its rate cut. Look for 'only': extra collateral or a non-residence can take the loan outside the protection.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1322/","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1322c1":{"id":"usc-1322c1","type":"code","cite":"11 U.S.C. § 1322(c)(1)","short":"Cure until foreclosure sale","holding":"Notwithstanding (b)(2) and applicable nonbankruptcy law, a default on, or that gave rise to, a lien on the debtor's principal residence may be cured under (b)(3) or (b)(5) until the residence is sold at a foreclosure sale conducted in accordance with applicable nonbankruptcy law.","why":"It sets the deadline for saving the house. What counts as 'sold' depends on state law, which in NC means after the upset-bid period (Barham).","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1322/","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm"],"status":"current text as of 2026-11-12","group":"g3"},"usc-1322c2":{"id":"usc-1322c2","type":"code","cite":"11 U.S.C. § 1322(c)(2)","short":"Short-term home loans: pay as modified","holding":"If the last payment on the original schedule for a claim secured only by the principal residence is due before the plan's final payment, the plan may provide for payment of the claim as modified under § 1325(a)(5).","why":"Matured or balloon home loans can be paid through the plan, and in the Fourth Circuit they can be crammed down to value (Hurlburt).","sources":["https://uscode.house.gov/us/usc/119-118/t11/s1322/","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-chap13.htm"],"status":"current text as of 2026-11-12","group":"g3"},"usc-506d":{"id":"usc-506d","type":"code","cite":"11 U.S.C. § 506(d)","short":"Lien void if no allowed secured claim","holding":"To the extent a lien secures a claim against the debtor that is not an allowed secured claim, the lien is void, unless the claim was disallowed only under § 502(b)(5) or § 502(e), or isn't an allowed secured claim only because no proof of claim was filed under § 501.","why":"This is the provision Chapter 7 debtors used to try to strip liens, and the Supreme Court said no twice (Dewsnup, Caulkett). Chapter 13 strip-off rests on § 506(a) and § 1322(b)(2) instead.","sources":["https://uscode.house.gov/us/usc/119-118/t11/s506/","https://www.law.cornell.edu/uscode/text/11/506"],"status":"current text as of 2026-11-12","group":"g3"},"case-nobelman":{"id":"case-nobelman","type":"scotus","cite":"Nobelman v. American Savings Bank, 508 U.S. 324 (1993)","short":"No strip-down of home first mortgage","holding":"Section 1322(b)(2) bars a Chapter 13 debtor from using § 506(a) to reduce an undersecured mortgage on the principal residence to the home's value, because the provision protects the 'rights of holders' (payment terms, interest, the lien until paid) and the lender remains the holder of a secured claim.","why":"An underwater first mortgage is cure-and-maintain only. Nobelman applies only where some value secures the claim, which is the opening Davis uses.","sources":["https://supreme.justia.com/cases/federal/us/508/324/","https://www.law.cornell.edu/supct/html/92-641.ZS.html"],"status":"good law as of 2026-11-12","group":"g3"},"case-dewsnup":{"id":"case-dewsnup","type":"scotus","cite":"Dewsnup v. Timm, 502 U.S. 410 (1992)","short":"No Ch. 7 strip-down under § 506(d)","holding":"A Chapter 7 debtor cannot use § 506(d) to 'strip down' a partially secured lien on real property to the collateral's judicially determined value, because a claim secured by a lien and fully allowed under § 502 is not 'not an allowed secured claim.'","why":"This is the reason Chapter 7 is useless for lien stripping and a big reason underwater junior liens drive Chapter 13 filings.","sources":["https://supreme.justia.com/cases/federal/us/502/410/","https://www.govinfo.gov/content/pkg/USREPORTS-502/pdf/USREPORTS-502-410.pdf"],"status":"good law as of 2026-11-12 (reaffirmed in Caulkett, 2015, which noted criticism but was not asked to overrule it)","group":"g3"},"case-caulkett":{"id":"case-caulkett","type":"scotus","cite":"Bank of America, N.A. v. Caulkett, 575 U.S. 790 (2015)","short":"No Ch. 7 strip-off either","holding":"A Chapter 7 debtor may not void a junior mortgage under § 506(d) even when the senior mortgage exceeds the property's value, if the junior claim is both secured by a lien and allowed under § 502. The Court followed Dewsnup and refused to limit it to partially underwater liens.","why":"A wholly underwater second mortgage can't be stripped in Chapter 7, so a client who wants it gone needs Chapter 13.","sources":["https://supreme.justia.com/cases/federal/us/575/790/","https://www.law.cornell.edu/supremecourt/text/13-1421"],"status":"good law as of 2026-11-12. Limited to Chapter 7 and § 506(d); commentary (NCLC) reads it as not undermining Chapter 13 strip-offs.","group":"g3"},"case-hurlburt":{"id":"case-hurlburt","type":"4th","cite":"Hurlburt v. Black, 925 F.3d 154 (4th Cir. 2019) (en banc)","short":"§ 1322(c)(2) allows cramdown","holding":"The en banc court (Wynn, J.; Wilkinson, Keenan and Thacker, JJ., dissenting) held that § 1322(c)(2) authorizes modification of covered principal-residence claims (those whose last original payment is due before the plan's final payment), including bifurcation into secured and unsecured parts and cramdown, not merely a new payment schedule. It overruled Witt v. United Cos. Lending Corp. (In re Witt), 113 F.3d 508 (4th Cir. 1997).","why":"For a balloon or matured home loan that is undersecured, the client can pay the value of the house rather than the balance through the plan. Older outlines citing Witt are wrong.","sources":["https://hallapproved.com/us/cases/ca4/2019/4623279","https://www.ncbarblog.com/4th-circuit-overrules-own-precedent-holds-certain-primary-residence-claims-can-be-crammed-down-in-chapter-13-bankruptcies/","https://law.justia.com/cases/federal/appellate-courts/ca4/17-2449/17-2449-2019-05-24.html"],"status":"good law as of 2026-11-12. Note: it PERMITS bifurcation; Witt (which barred it) is overruled.","group":"g3"},"case-davis":{"id":"case-davis","type":"4th","cite":"Branigan v. Davis (In re Davis), 716 F.3d 331 (4th Cir. 2013)","short":"Strip off valueless lien, even Ch. 20","holding":"A wholly valueless lien on the principal residence is an unsecured claim under § 506(a) and is not protected by § 1322(b)(2), so it can be stripped off in Chapter 13. Debtors ineligible for a discharge under § 1328(f) ('Chapter 20') may do the same, with the strip-off becoming permanent on plan completion. Courts must still police good faith.","why":"The wholly underwater second mortgage or HELOC is the classic Chapter 13 win. The court warned that a Chapter 20 filed solely to strip a lien may be dismissed as bad faith.","sources":["https://law.justia.com/cases/federal/appellate-courts/ca4/12-1184/12-1184-2013-05-10.html","https://openjurist.org/716/f3d","https://library.nclc.org/article/supreme-court-rejects-lien-strip-chapter-7-cases"],"status":"good law as of 2026-11-12 (Keenan, J., dissented on the Chapter 20 point; Caulkett is a Chapter 7 § 506(d) case and did not address Chapter 13 strip-off)","group":"g3"},"ncgs-45-21-27":{"id":"ncgs-45-21-27","type":"nc","cite":"N.C. Gen. Stat. §§ 45-21.27(a), 45-21.29A","short":"NC 10-day upset bid; rights fix","holding":"After a power-of-sale foreclosure, an upset bid (at least 5% over the reported bid, minimum $750, with a deposit) may be filed by the close of normal business hours on the 10th day after the report of sale or the last upset bid notice is filed, rolling to the next open day if needed. Under § 45-21.29A, the rights of the parties to the sale become fixed only when no upset bid is filed within that period.","why":"In NC the gavel isn't the end. The sale isn't final until the upset period runs, and that is the window § 1322(c)(1) leaves open for a cure.","sources":["https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_45/GS_45-21.27.html","https://ftp.ncleg.gov/EnactedLegislation/Statutes/PDF/BySection/Chapter_45/GS_45-21.29A.pdf","https://law.counselstack.com/opinion/in-re-barham-nceb-1996"],"status":"current text as of 2026-11-12 (last amendment to § 45-21.27 listed: S.L. 2003-337)","group":"g3"},"case-barham":{"id":"case-barham","type":"ednc","cite":"In re Barham, 193 B.R. 229 (Bankr. E.D.N.C. 1996)","short":"NC sale not final until upset period ends","holding":"For § 1322(c)(1), a North Carolina residence is not 'sold at a foreclosure sale' until the 10-day upset bid period expires and the purchaser's rights become fixed under G.S. 45-21.29A. Debtors who filed five days after the auction could still cure, and stay relief was denied.","why":"A client who walks in after the auction but inside the upset-bid window can still save the house.","sources":["https://law.counselstack.com/opinion/in-re-barham-nceb-1996","https://case-
