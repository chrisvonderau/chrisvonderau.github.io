 a § 341 meeting; § 343 governs who may question the debtor.","quip":"No robes at the 341. Only the trustee, the creditors and the coffee."},{"id":"dx-3","topic":"rule-2004-discovery","level":2,"prompt":"The trustee wants to examine Bertie's brother-in-law, who supposedly 'chips in' half of each plan payment. Is that within Rule 2004's scope?","answer":"frbp-2004b","options":["frbp-2004b","frbp-2004c","usc-343","frbp-9014c"],"explain":"Rule 2004(b)(2) expressly reaches, in Chapter 13, the source of money or property for the plan; 2004(c) is about compelling attendance, not scope."},{"id":"dx-4","topic":"rule-2004-discovery","level":2,"prompt":"You have a 2004 order to examine Carolina Beach Motors' records about a car Bertie 'sold' pre-petition, but the dealer ignores your letter. How do you compel it?","answer":"frbp-2004c","options":["frbp-2004c","frbp-9016","frbp-2004b","lbr-2004-1"],"explain":"Rule 2004(c) provides that an entity may be compelled under Rule 9016 and that an attorney admitted in the case's court may issue and sign the subpoena; 9016 alone just imports Civil Rule 45."},{"id":"dx-5","topic":"rule-2004-discovery","level":2,"prompt":"In EDNC, you file a Rule 2004 motion to examine a debtor's former business partner. Do you need to set it for hearing?","answer":"lbr-2004-1","options":["lbr-2004-1","ednc-adminguide","frbp-2004c","usc-341"],"explain":"EDNC LBR 2004-1 says the court reviews the motion and may allow it ex parte; the service chart addresses timing and service, not whether a hearing is required."},{"id":"dx-6","topic":"rule-2004-discovery","level":2,"prompt":"The day before her 2004 exam, the target files a motion to reconsider the EDNC order. Does she still have to show up?","answer":"lbr-2004-1","options":["lbr-2004-1","frbp-2004c","frbp-9016","ednc-adminguide"],"explain":"Under EDNC LBR 2004-1, filing a motion to reconsider stays the obligation to appear or produce documents until the court rules.","quip":"Nothing ruins a court reporter's morning like a motion to reconsider."},{"id":"dx-7","topic":"rule-2004-discovery","level":2,"prompt":"Your paralegal asks how far ahead of the examination date your EDNC Rule 2004 motion should be filed.","answer":"ednc-adminguide","options":["ednc-adminguide","lbr-2004-1","frbp-2004c","frbp-9014c"],"explain":"The EDNC service chart says a 2004 motion should be filed at least 14 days before the exam unless all parties consent; LBR 2004-1 covers ex parte review and reconsideration."},{"id":"dx-8","topic":"rule-2004-discovery","level":3,"prompt":"While its motion for relief from stay against Bertie is pending, Lighthouse files a 2004 motion to examine Bertie about his payment history - the very issue in the stay motion. Your best objection?","answer":"case-washingtonmutual","options":["case-washingtonmutual","frbp-9014c","frbp-2004b","frbp-7001"],"explain":"Under the judge-made pending proceeding rule (In re Washington Mutual), discovery related to a pending contested matter must go through the Rule 7026 et seq. rules, not Rule 2004; Rule 9014(c) is where those rules come from, not the bar itself."},{"id":"dx-9","topic":"rule-2004-discovery","level":2,"prompt":"In that pending stay-relief fight, you want Lighthouse's payment history and a deposition of its records custodian. Which rule makes the discovery rules available?","answer":"frbp-9014c","options":["frbp-9014c","frbp-2004c","frbp-7001","frbp-9016"],"explain":"A stay-relief motion is a contested matter, and Rule 9014(c) applies Rules 7026 and 7028-7037 unless the court orders otherwise; Rule 9016 just governs the subpoena form."},{"id":"dx-10","topic":"rule-2004-discovery","level":2,"prompt":"Opposing counsel in a contested claim objection insists you owe mandatory Rule 26(a)(1) initial disclosures. Do you?","answer":"frbp-9014c","options":["frbp-9014c","frbp-7001","case-washingtonmutual","frbp-2004b"],"explain":"Rule 9014(c)(2) says Civil Rule 26(a)(1)-(3) disclosures and the 26(f) conference don't apply in contested matters unless the court orders otherwise."},{"id":"dx-11","topic":"rule-2004-discovery","level":1,"prompt":"Seagrass Landing HOA claims a lien on Delia Oak Island's condo; Delia says the lien was never validly created and wants that decided. Motion or complaint?","answer":"frbp-7001","options":["frbp-7001","frbp-9014c","frbp-2004b","frbp-9016"],"explain":"Rule 7001(b) requires an adversary proceeding to determine the validity, priority or extent of a lien (except Rule 3012 valuation and 4003(d) lien avoidance); it can't ride in a motion or a claim objection."},{"id":"dx-12","topic":"rule-2004-discovery","level":1,"prompt":"What rule governs the form, service and objections to every subpoena you issue in a bankruptcy case?","answer":"frbp-9016","options":["frbp-9016","frbp-2004c","frbp-9014c","frbp-7001"],"explain":"Rule 9016 makes Civil Rule 45 applicable in bankruptcy cases; Rule 2004(c) points to 9016 for compelling a 2004 examinee."},{"id":"sn-1","topic":"sales-and-new-debt","level":1,"prompt":"Ronnie Leland, a Chapter 13 debtor, wants to sell a rental lot. Who has the power to bring the motion to sell - Ronnie or the trustee?","answer":"usc-1303","options":["usc-1303","usc-363b","usc-1306","usc-1327b"],"explain":"Section 1303 gives the Chapter 13 debtor, exclusive of the trustee, the trustee's powers under § 363(b) and (f); § 363(b) alone speaks of 'the trustee'."},{"id":"sn-2","topic":"sales-and-new-debt","level":1,"prompt":"What standard does the Code impose before Ronnie can sell the lot outside the ordinary course?","answer":"usc-363b","options":["usc-363b","usc-363f","frbp-6004","usc-1327b"],"explain":"Section 363(b)(1) permits a sale outside the ordinary course only after notice and a hearing (which § 102(1) satisfies without an actual hearing if none is timely requested); Rule 6004 implements the notice."},{"id":"sn-3","topic":"sales-and-new-debt","level":2,"prompt":"A judgment creditor claims a lien on the lot, but the judgment was docketed in the wrong county and Ronnie disputes it. What lets the sale close free and clear of that lien?","answer":"usc-363f","options":["usc-363f","usc-363m","frbp-6004","usc-363b"],"explain":"Section 363(f)(4) permits a sale free and clear of an interest in bona fide dispute; Rule 6004(c) supplies the procedure (a 9014 motion served on the lienholder)."},{"id":"sn-4","topic":"sales-and-new-debt","level":2,"prompt":"The buyer's closing attorney wants to record the deed the morning after the sale order is entered. What stands in the way unless your motion asked for relief?","answer":"frbp-6004","options":["frbp-6004","usc-363m","frbp-4001c3","lbr-4002-1g"],"explain":"Rule 6004(h) stays an order authorizing a sale for 14 days after entry unless the court orders otherwise; § 363(m) protects a buyer on appeal but doesn't lift the stay.","quip":"Fourteen days: just long enough for the buyer's lender to lose the rate lock."},{"id":"sn-5","topic":"sales-and-new-debt","level":3,"prompt":"A disgruntled co-heir appeals the sale order but never gets a stay, and the good-faith buyer closes. Can the appellate court undo the sale?","answer":"usc-363m","options":["usc-363m","usc-363f","frbp-6004","usc-1303"],"explain":"Section 363(m) protects a good-faith purchaser's sale from reversal on appeal unless the sale was stayed; after MOAC (2023) that protection is a non-jurisdictional defense that can be waived or forfeited."},{"id":"sn-6","topic":"sales-and-new-debt","level":2,"prompt":"Two years after confirmation, Ronnie inherits his grandmother's house in Leland. Which Fourth Circuit decision says it's property of his Chapter 13 estate even though more than 180 days have passed?","answer":"case-carroll","options":["case-carroll","usc-1306","usc-1327b","case-murphy"],"explain":"Carroll v. Logan held § 1306(a) extends § 541's timeline in Chapter 13, so a post-180-day inheritance is estate property; § 1306 is the statute, Carroll is the Fourth Circuit holding applying it."},{"id":"sn-7","topic":"sales-and-new-debt","level":2,"prompt":"Ronnie's confirmed plan vested property in him, and the inherited house has about $60,000 of non-exempt equity. In EDNC, can he list and sell it without a court order?","answer":"lbr-4002-1g","options":["lbr-4002-1g","usc-1327b","usc-363b","frbp-6004"],"explain":"EDNC LBR 4002-1(g)(4) bars disposing of property with non-exempt equity over $15,000 'whether vested or not' without a court order until the plan is completed; vesting under § 1327(b) doesn't avoid it."},{"id":"sn-8","topic":"sales-and-new-debt","level":1,"prompt":"Wanda Carolina Beach's car died and she needs a $24,000 car loan mid-plan. What EDNC rule requires prior court approval?","answer":"lbr-4002-1g","options":["lbr-4002-1g","frbp-4001c3","usc-1305","usc-363b"],"explain":"EDNC LBR 4002-1(g)(5) requires prior court approval to incur debt of $15,000 or more; Rule 4001(c) does not apply in Chapter 13."},{"id":"sn-9","topic":"sales-and-new-debt","level":2,"prompt":"The car lender's counsel insists Wanda's motion must include the Rule 4001(c) five-page summary of material terms and a 14-day final-hearing wait. Correct?","answer":"frbp-4001c3","options":["frbp-4001c3","lbr-4002-1g","usc-1305","frbp-6004"],"explain":"Rule 4001(c)(3) says subdivision (c) does not apply in a Chapter 13 case; EDNC's application to incur debt under LBR 4002-1(g)(5) is the vehicle."},{"id":"sn-10","topic":"sales-and-new-debt","level":3,"prompt":"Without asking anyone, Wanda finances a $9,000 used truck she needs to get to work; the dealer files a claim in her case and the trustee objects. What's the dealer's problem?","answer":"usc-1305","options":["usc-1305","lbr-4002-1g","usc-502b","frbp-4001c3"],"explain":"Section 1305(c) disallows a postpetition consumer-debt claim if the holder knew or should have known prior trustee approval was practicable and wasn't obtained; the local $15,000 threshold isn't triggered at $9,000.","quip":"The dealer financed the truck; the trustee financed the objection."},{"id":"sn-11","topic":"sales-and-new-debt","level":3,"prompt":"Ronnie sells a beach condo for 50% more than his schedules listed, and the trustee moves to modify the plan to pay unsecureds in full. What's the Fourth Circuit test?","answer":"case-murphy","options":["case-murphy","case-carroll","usc-1327b","usc-1306"],"explain":"Murphy requires a substantial and unanticipated post-confirmation change in financial condition before modification; Carroll addresses what is estate property, not the modification standard."},{"id":"sn-12","topic":"sales-and-new-debt","level":3,"prompt":"The Goralski-style move: Wanda does a cash-out refinance and the trustee wants the cash. Under the Fourth Circuit's test, does the refinance alone justify modification?","answer":"case-murphy","options":["case-murphy","usc-1305","case-carroll","lbr-4002-1g"],"explain":"In Murphy (the consolidated Goralski appeal), a cash-out refinance was a loan, not a change in financial condition, so res judicata barred the trustee's modification; Carroll is about what enters the estate, not when a plan can be modified."},{"id":"sn-13","topic":"sales-and-new-debt","level":1,"prompt":"Wanda's plan is silent on vesting. After confirmation, who holds title to her estate property under the Code's default rule?","answer":"usc-1327b","options":["usc-1327b","usc-1306","usc-1303","usc-363b"],"explain":"Section 1327(b) vests estate property in the debtor at confirmation unless the plan or confirmation order provides otherwise; § 1306(b) only keeps the debtor in possession."},{"id":"sn-14","topic":"sales-and-new-debt","level":1,"prompt":"Ronnie's overtime pay earned after filing: whose is it?","answer":"usc-1306","options":["usc-1306","usc-1327b","case-carroll","usc-1305"],"explain":"Section 1306(a)(2) makes postpetition earnings from services property of the Chapter 13 estate until the case is closed, dismissed or converted."},{"id":"cf-1","topic":"confirmation","level":1,"prompt":"Captain Ahab Pendergrass owns a Carolina Beach bungalow with plenty of nonexempt equity, yet his plan pays unsecured creditors 0%. Trustee Staley objects. Which confirmation requirement is the plan flunking?","answer":"usc-1325a4","options":["usc-1325a4","usc-1325b1","usc-1325a3","usc-1322a"],"explain":"§ 1325(a)(4) requires each unsecured creditor to get at least what a Chapter 7 liquidation would pay as of the effective date. § 1325(b)(1) is the separate disposable-income test.","quip":"The whale got away; the equity didn't."},{"id":"cf-2","topic":"confirmation","level":1,"prompt":"The plan of Ms. Lucinda Gristmill proposes to pay her priority income-tax claim at 50% because 'the IRS has plenty.' The IRS has not agreed. What controls?","answer":"usc-1322a","options":["usc-1322a","usc-1325a4","usc-1327","usc-1325b1"],"explain":"§ 1322(a)(2) requires full payment of § 507 priority claims in deferred cash payments unless the holder agrees otherwise. The liquidation test in (a)(4) protects general unsecured creditors, not priority claims.","quip":"The IRS has plenty, including patience."},{"id":"cf-3","topic":"confirmation","level":1,"prompt":"Since filing, Mr. Dwayne Okra has stopped paying his court-ordered child support, and his 2025 return is still 'in progress.' Which confirmation requirement is the trustee going to cite?","answer":"usc-1325a8","options":["usc-1325a8","usc-1325a6","usc-1322a","usc-1325a7"],"explain":"§ 1325(a)(8)-(9) makes payment of post-petition domestic support obligations and the filing of required tax returns (§ 1308) conditions of confirmation. Feasibility under (a)(6) is a different question."},{"id":"cf-4","topic":"confirmation","level":2,"prompt":"A Wilmington credit union files its objection to confirmation 3 days before Judge Warren's confirmation hearing. To be heard on it as of right, what must it do, and which authority says so?","answer":"lbr-3015-3","options":["lbr-3015-3","frbp-3015","usc-1324b","usc-1327"],"explain":"E.D.N.C. LBR 3015-3(c) applies Rule 3015(f)'s 7-day deadline locally and requires a separate request to extend the deadline for a late objection. Rule 3015(f) alone just sets the 7-day default 'unless the court orders otherwise.'"},{"id":"cf-5","topic":"confirmation","level":1,"prompt":"The 341 meeting is set for early January. By statute, within what window after that meeting may the confirmation hearing normally be held?","answer":"usc-1324b","options":["usc-1324b","lbr-3015-3","frbp-3015","usc-1322d"],"explain":"§ 1324(b) sets a hearing no earlier than 20 and no later than 45 days after the § 341(a) meeting, with a narrow exception for an earlier date. The local rule leaves the setting to the clerk but does not change the statutory window."},{"id":"cf-6","topic":"confirmation","level":2,"prompt":"Mr. Bartholomew Finch's confirmed plan surrenders his bass boat and asks that the stay be terminated as to it. The lender asks whether it still needs a stay-relief motion. Which authority answers?","answer":"frbp-3015","options":["frbp-3015","usc-1327","lbr-3015-3","usc-1325a5"],"explain":"Rule 3015(g)(2) grants a plan request to terminate the § 362(a) or § 1301(a) stay on confirmation. § 1327 makes the plan binding but is not the rule that terminates the stay.","quip":"The boat is free. So, finally, is Bartholomew."},{"id":"cf-7","topic":"confirmation","level":3,"prompt":"Four years after confirmation, a student-loan guarantor moves to vacate the confirmation order of Ms. Imogen Tate, whose plan discharged accrued loan interest with no undue-hardship adversary proceeding. The guarantor received the plan and never objected. Which case decides the motion?","answer":"case-espinosa","options":["case-espinosa","usc-1327","case-deans","frbp-3015"],"explain":"Espinosa held that such an order is legal error, not void under Rule 60(b)(4), so it binds a creditor that had actual notice. § 1327 supplies the binding effect, but Espinosa is the Supreme Court answer to the voidness attack."},{"id":"cf-8","topic":"confirmation","level":3,"prompt":"A creditor argues that any plan paying unsecured creditors less than 70% is per se in bad faith. The debtor, Mr. Cletus Brinkley, is honest, disabled and has no prior filings. Which Fourth Circuit case rejects the creditor's rule?","answer":"case-deans","options":["case-deans","case-neufeld","case-goddard","usc-1325a4"],"explain":"Deans rejected a per se substantial-repayment requirement and adopted a case-by-case totality test. Neufeld built on Deans by adding pre-petition conduct, but Deans is the case that rejected the percentage rule."},{"id":"cf-9","topic":"confirmation","level":3,"prompt":"Ms. Vera Sculley got a Chapter 7 discharge five years ago. Her new Chapter 13 debt is mostly a fraud judgment from 'borrowing' a Wrightsville Beach surf shop's till, and her plan pays 1%. The shop objects. Which Fourth Circuit case does it lead with?","answer":"case-neufeld","options":["case-neufeld","case-deans","case-espinosa","usc-1325a7"],"explain":"Neufeld holds that pre-petition misconduct, Chapter 7 nondischargeability of the debt and recent prior filings must be weighed in § 1325(a)(3) good faith. Deans set the general totality test; Neufeld is the case that makes these specific factors mandatory considerations.","quip":"Hang ten; repay one."},{"id":"cf-10","topic":"confirmation","level":2,"prompt":"Mr. Rufus Teague admits he filed Chapter 13 the morning of a hearing for one reason: to stall his ex-wife's motion. The plan itself looks fine. Which provision targets the filing rather than the plan?","answer":"usc-1325a7","options":["usc-1325a7","usc-1325a3","usc-1325a8","case-neufeld"],"explain":"§ 1325(a)(7) requires that the petition itself was filed in good faith. § 1325(a)(3) asks whether the plan was proposed in good faith."},{"id":"cf-11","topic":"confirmation","level":2,"prompt":"After confirmation, a payday lender that never objected says it isn't bound because the plan 'didn't mention it by name.' Which provision answers?","answer":"usc-1327","options":["usc-1327","case-espinosa","frbp-3015","usc-1324b"],"explain":"§ 1327(a) binds each creditor whether or not its claim is provided for by the plan and whether or not it objected. Espinosa applies that binding effect but is not the source of the rule."},{"id":"di-1","topic":"disposable-income","level":1,"prompt":"Ms. Dolores Featherstone, 71, of Leland, lives on Social Security plus a small pension and has $48,000 in card debt. The trustee's analyst wants her Social Security in the CMI figure on Form 122C-1. Which provision keeps it out?","answer":"usc-101-10a","options":["usc-101-10a","usc-1325b2","case-ranta","usc-707b2"],"explain":"§ 101(10A)(B)(ii)(I) expressly excludes Social Security Act benefits from CMI. Ranta carries that exclusion into projected disposable income, but the CMI exclusion itself is statutory.","quip":"Dolores 1, Form 122C-1 0."},{"id":"di-2","topic":"disposable-income","level":1,"prompt":"The Halyards are above median, can't pay unsecured creditors in full and propose a 36-month plan. The trustee objects. Which provision sets the minimum plan length?","answer":"usc-1325b4","options":["usc-1325b4","usc-1322d","case-pliler","usc-1325b1"],"explain":"§ 1325(b)(4) makes the applicable commitment period not less than 5 years for above-median debtors unless unsecured claims are paid in full. § 1322(d) is the 5-year maximum, not the minimum."},{"id":"di-3","topic":"disposable-income","level":1,"prompt":"Mr. Otis Brindle is below median but needs 60 months to cure his mortgage arrears. Which provision allows a plan longer than 3 years, and on what showing?","answer":"usc-1322d","options":["usc-1322d","usc-1325b4","case-pliler","usc-1325a6"],"explain":"§ 1322(d)(2) caps a below-median plan at 3 years unless the court, for cause, approves a longer period of up to 5 years. § 1325(b)(4) sets the floor, not the ceiling."},{"id":"di-4","topic":"disposable-income","level":2,"prompt":"Above-median Mr. Hollis Quarry claims the IRS vehicle 'Ownership Costs' deduction on Form 122C-2 for his paid-off 2011 Silverado. The trustee objects. What controls?","answer":"case-ransom","options":["case-ransom","case-lanning","usc-707b2","case-till"],"explain":"Ransom holds that a debtor with no loan or lease payment can't take the ownership deduction, though operating costs remain. § 707(b)(2) is the provision Ransom interpreted, but the case decides the question.","quip":"The truck is paid for. The deduction is not."},{"id":"di-5","topic":"disposable-income","level":2,"prompt":"Mr. Garland Pettibone's 6-month look-back includes a large one-time bonus, and the Wilmington plant that employed him closed last month. His CMI badly overstates what he will actually earn. Which authority lets the court use real numbers?","answer":"case-lanning","options":["case-lanning","case-ranta","usc-101-10a","case-pliler"],"explain":"Lanning lets the court account for changes in income or expenses known or virtually certain at confirmation. Ranta concerns Social Security and does not address this kind of change."},{"id":"di-6","topic":"disposable-income","level":3,"prompt":"Ms. Featherstone (Social Security only, $0 projected disposable income) proposes to fund a plan from her Social Security to save her house. The trustee argues that because Social Security is excluded from disposable income, it can't count toward feasibility either. Which Fourth Circuit case answers?","answer":"case-ranta","options":["case-ranta","usc-1325a6","case-lanning","usc-101-10a"],"explain":"Ranta holds that Social Security is excluded from projected disposable income but must be considered for feasibility under § 1325(a)(6) when it funds the plan. § 1325(a)(6) is the statute; Ranta is the Fourth Circuit holding on this exact argument."},{"id":"di-7","topic":"disposable-income","level":3,"prompt":"The Mallorys are above median, show negative projected disposable income and propose a 36-month plan with 'early termination' language paying unsecured creditors nothing extra. The trustee wants 60 months. Who wins?","answer":"case-pliler","options":["case-pliler","usc-1325b4","case-lanning","case-ranta"],"explain":"Pliler holds that the commitment period is temporal, so above-median debtors need a 5-year plan even with negative disposable income unless unsecured claims are paid in full. § 1325(b)(4) is the text; Pliler resolves the negative-income argument."},{"id":"di-8","topic":"disposable-income","level":3,"prompt":"Above-median Mr. Thaddeus Vane passes the means test with negative disposable income, thanks to deductions for three luxury SUVs he bought in the past year (two partly on unsecured personal loans). Unsecured creditors get 6%. The trustee objects. What is the Fourth Circuit's answer?","answer":"case-goddard","options":["case-goddard","case-deans","case-ransom","usc-1325b1"],"explain":"Goddard v. Burnett (2026) holds that technical § 1325(b) compliance doesn't satisfy § 1325(a)(3) good faith and affirmed denial on similar facts. Deans supplies the test, but Goddard applies it to means-test compliance.","quip":"Three SUVs, one problem."},{"id":"di-9","topic":"disposable-income","level":2,"prompt":"Mr. Rodney Pruitt, a Camp Lejeune retiree, receives VA service-connected disability compensation along with civilian wages. Does the VA compensation go into CMI?","answer":"usc-101-10a","options":["usc-101-10a","case-ranta","usc-1325b4","usc-707b2"],"explain":"Since the 2019 HAVEN Act, § 101(10A)(B)(ii)(IV) excludes compensation, pension, pay, annuity or allowance paid under title 10, 37 or 38 in connection with a disability (among others). Ranta concerns Social Security only."},{"id":"di-10","topic":"disposable-income","level":1,"prompt":"The trustee objects that the plan doesn't pay unsecured creditors everything the debtor can afford. Which provision makes 'all projected disposable income' the test once the objection is made?","answer":"usc-1325b1","options":["usc-1325b1","usc-1325a4","usc-1322a","usc-1325b2"],"explain":"§ 1325(b)(1)(B) applies on the objection of the trustee or an unsecured creditor. § 1325(b)(2) defines disposable income but is not the operative confirmation bar."},{"id":"di-11","topic":"disposable-income","level":2,"prompt":"The Scuppernongs are above median and want to use their actual Schedule J grocery bill, which is higher than the IRS figure, to compute disposable income. Which provision requires IRS standards instead?","answer":"usc-707b2","options":["usc-707b2","usc-1325b2","case-ransom","usc-101-10a"],"explain":"For above-median debtors, § 1325(b)(3) points to § 707(b)(2)(A)-(B), which uses the IRS National and Local Standards (with a limited extra food and clothing allowance). Ransom interprets one Local Standard but doesn't impose the standards generally."},{"id":"cv-1","topic":"cramdown-vehicles","level":1,"prompt":"Mr. Buck Tarheel bought a used F-150 for personal use 600 days before filing, with purchase-money financing. He owes $22,000 and the truck is worth $15,000. Can the plan pay only $15,000 as secured and keep the truck?","answer":"usc-1325a-hanging","options":["usc-1325a-hanging","usc-506a1","case-rash","case-till"],"explain":"The hanging paragraph turns off § 506 for a PMSI on a personal-use vehicle incurred within 910 days, so no bifurcation is allowed. § 506(a)(1) would split the claim only outside the window.","quip":"600 \u003c 910. Math is undefeated."},{"id":"cv-2","topic":"cramdown-vehicles","level":1,"prompt":"Same truck, but Buck bought it 1,100 days before filing. Which provision splits the lender's claim into a secured part (the truck's value) and an unsecured part?","answer":"usc-506a1","options":["usc-506a1","usc-1325a-hanging","usc-506a2","case-kenney"],"explain":"Outside the 910-day window, § 506(a)(1) bifurcates the claim at collateral value. § 506(a)(2) tells you how to measure that value but doesn't do the splitting."},{"id":"cv-3","topic":"cramdown-vehicles","level":2,"prompt":"Back to the 1,100-day version of Buck's truck. The car lender says the 4-year-old truck is worth retail; Buck's paralegal pulls the trade-in figure. Which authority sets the valuation standard for this personal-use vehicle?","answer":"usc-506a2","options":["usc-506a2","case-rash","usc-506a1","case-till"],"explain":"§ 506(a)(2) values personal-use property at what a retail merchant would charge, considering age and condition, with no deduction for sale costs. Rash announced replacement value earlier but left retail versus wholesale open, and the statute now settles it."},{"id":"cv-4","topic":"cramdown-vehicles","level":2,"prompt":"On Buck's crammed-down claim, the subprime lender insists on its 24% contract rate as the present-value rate. Which case sets the method?","answer":"case-till","options":["case-till","case-rash","usc-1325a5biii","case-kenney"],"explain":"Till's plurality adopted prime plus a risk adjustment and rejected the presumptive contract-rate approach. Rash concerns value, not interest."},{"id":"cv-5","topic":"cramdown-vehicles","level":1,"prompt":"To keep plan payments low, a draft plan pays the car lender interest only until month 60, then a balloon. What blocks it?","answer":"usc-1325a5biii","options":["usc-1325a5biii","usc-1325a5","case-till","lbr-3070-1"],"explain":"§ 1325(a)(5)(B)(iii) requires periodic payments in equal monthly amounts that adequately protect a personal-property lender. Till governs the rate, not the payment shape.","quip":"Balloons are for birthday parties."},{"id":"cv-6","topic":"cramdown-vehicles","level":2,"prompt":"Ms. Penelope Driggers surrenders her 700-day-old minivan, a 910 vehicle. After the auction, the lender wants an unsecured deficiency. Ms. Driggers says the hanging paragraph means surrender satisfies the debt. Which Fourth Circuit case decides it?","answer":"case-kenney","options":["case-kenney","usc-1325a-hanging","usc-1325a5","lbr-form-113a"],"explain":"Kenney holds the hanging paragraph doesn't eliminate the contract and state-law deficiency, which is treated as unsecured. The local form governs the claims procedure, not whether the right exists."},{"id":"cv-7","topic":"cramdown-vehicles","level":2,"prompt":"In EDNC, the lender in Ms. Driggers's case files its proof of claim but never amends it after the auction, and 200 days have passed since confirmation with no extension order. What controls the deficiency's fate?","answer":"lbr-form-113a","options":["lbr-form-113a","case-kenney","frbp-3015","lbr-3070-1"],"explain":"Local Form 113A § 3.6 allows a deficiency only if the claim is amended within 180 days after confirmation (absent an extension order); otherwise surrender is deemed full satisfaction. Kenney recognizes the deficiency right, and the confirmed plan's procedure governs how it is claimed."},{"id":"cv-8","topic":"cramdown-vehicles","level":2,"prompt":"Two weeks after filing, and before confirmation, a Jacksonville car lender calls asking why it hasn't been paid on its purchase-money claim. In EDNC, what is the presumptive pre-confirmation payment, and who pays it?","answer":"lbr-3070-1","options":["lbr-3070-1","usc-1325a5biii","lbr-form-113a","usc-1324b"],"explain":"E.D.N.C. LBR 3070-1(c) routes pre-confirmation adequate protection through the trustee at a presumptive minimum of 1% of collateral value (none if the secured value is under $2,000). § 1325(a)(5)(B)(iii) governs payments under the confirmed plan."},{"id":"cv-9","topic":"cramdown-vehicles","level":2,"prompt":"A credit-card judgment docketed in New Hanover County attached to the Hollowells' fully exempt homestead. Which provision lets them avoid it?","answer":"usc-522f","options":["usc-522f","usc-506d","usc-1322b2","case-caulkett"],"explain":"§ 522(f)(1)(A) avoids a non-DSO judicial lien to the extent it impairs an exemption. Caulkett concerned a consensual mortgage and § 506(d), which doesn't avoid an allowed secured claim's lien just because of an exemption."},{"id":"cv-10","topic":"cramdown-vehicles","level":3,"prompt":"A trustee's analyst asks where the 'cost to obtain a like asset for the same proposed use' standard came from, as applied to a long-haul trucker's tractor in a Chapter 13 cramdown. Which Supreme Court decision?","answer":"case-rash","options":["case-rash","usc-506a2","case-till","usc-506a1"],"explain":"Rash adopted replacement value, defined that way, for collateral retained under § 1325(a)(5)(B). § 506(a)(2) later codified replacement value for individual debtors' personal property."},{"id":"cv-11","topic":"cramdown-vehicles","level":1,"prompt":"Mr. Lyle Furnow wants to hand the keys of his underwater jet ski back to the lender through the plan. Which § 1325 option is he using?","answer":"usc-1325a5","options":["usc-1325a5","usc-1325a-hanging","case-kenney","usc-1327"],"explain":"§ 1325(a)(5)(C) allows confirmation when the debtor surrenders the collateral. The hanging paragraph only limits § 506 for cramdown purposes."},{"id":"cv-12","topic":"cramdown-vehicles","level":2,"prompt":"A plan values a 3-year-old car under § 3.3, but Part 1's 'limits on secured claims' box was left blank. Which national rule required EDNC's form to put that check box up front?","answer":"frbp-30151","options":["frbp-30151","frbp-3015","lbr-form-113a","lbr-3015-3"],"explain":"Rule 3015.1 requires a local form to open with a paragraph where the debtor indicates valuation limits, lien avoidance and nonstandard provisions. The local form itself supplies the consequence: an unchecked box makes the provision ineffective."},{"id":"hm-1","topic":"home-mortgage-and-liens","level":1,"prompt":"The Bellamys' Ogden home is worth $210,000; their only mortgage is a $260,000 first. Their plan cuts the first to $210,000. Which Supreme Court case says no?","answer":"case-nobelman","options":["case-nobelman","case-hurlburt","case-dewsnup","case-davis"],"explain":"Nobelman holds § 1322(b)(2) bars stripping down an undersecured mortgage secured only by the principal residence. Dewsnup is the Chapter 7 § 506(d) case."},{"id":"hm-2","topic":"home-mortgage-and-liens","level":1,"prompt":"Ms. Hattie Loblolly is six payments behind on her 30-year mortgage and wants to keep the house by catching up over the plan while paying the regular installment. Which provision?","answer":"usc-1322b5","options":["usc-1322b5","usc-1322c1","usc-1322c2","usc-1322b2"],"explain":"§ 1322(b)(5) allows cure within a reasonable time plus maintenance of payments on long-term debt. § 1322(c)(1) sets how late the cure right lasts, and § 1322(e) sets the cure amount by the contract and nonbankruptcy law."},{"id":"hm-3","topic":"home-mortgage-and-liens","level":2,"prompt":"The clerk's foreclosure sale of Mr. Jasper Wexley's home was held Monday at the New Hanover County courthouse. He files Chapter 13 Thursday, with the upset-bid period still open. Which EDNC decision says he can still cure?","answer":"case-barham","options":["case-barham","usc-1322c1","ncgs-45-21-27","case-hurlburt"],"explain":"Barham holds that a NC home isn't 'sold at a foreclosure sale' under § 1322(c)(1) until the upset period ends. § 1322(c)(1) supplies the rule and the NC statute the timing, but Barham is the decision that puts them together.","quip":"The gavel fell; the fat lady is still warming up."},{"id":"hm-4","topic":"home-mortgage-and-liens","level":2,"prompt":"Mr. Wexley's paralegal asks exactly how long the upset-bid window runs after the report of sale is filed. Which authority says?","answer":"ncgs-45-21-27","options":["ncgs-45-21-27","usc-1322c1","case-barham","usc-1324b"],"explain":"G.S. 45-21.27(a) runs the period to the close of normal business hours on the 10th day after the report of sale (or last upset bid notice) is filed. Barham relies on it but doesn't set the period."},{"id":"hm-5","topic":"home-mortgage-and-liens","level":2,"prompt":"The Pembrokes' Castle Hayne home is worth $180,000, the first mortgage is $195,000, and a $40,000 HELOC sits behind it. In their Chapter 13, can the HELOC be treated as wholly unsecured and its lien removed on completion? Which Fourth Circuit case?","answer":"case-davis","options":["case-davis","case-nobelman","case-caulkett","case-dewsnup"],"explain":"Davis confirms the Chapter 13 rule: a lien with no collateral value behind it is unsecured under § 506(a) and outside § 1322(b)(2), so it can be stripped. Nobelman protects only a claim with some secured value.","quip":"Zero dollars of collateral, zero dollars of protection."},{"id":"hm-6","topic":"home-mortgage-and-liens","level":3,"prompt":"Same underwater HELOC, but the Pembrokes' cousin files Chapter 7 instead and moves to void the HELOC lien under § 506(d). Result?","answer":"case-caulkett","options":["case-caulkett","case-dewsnup","case-davis","usc-506d"],"explain":"Caulkett holds a Chapter 7 debtor can't void even a wholly underwater junior mortgage under § 506(d). Dewsnup decided the partially underwater version."},{"id":"hm-7","topic":"home-mortgage-and-liens","level":3,"prompt":"In a Chapter 7, Mr. Ignatius Fenwick wants to reduce a partially underwater deed of trust on his Topsail lot down to the lot's value under § 506(d). Which case forecloses it?","answer":"case-dewsnup","options":["case-dewsnup","case-caulkett","usc-506d","case-nobelman"],"explain":"Dewsnup holds § 506(d) doesn't allow a Chapter 7 strip-down of a partially secured lien. Caulkett extended that to wholly underwater junior liens."},{"id":"hm-8","topic":"home-mortgage-and-liens","level":3,"prompt":"Ms. Opal Strickland's home loan was a 7-year balloon that matured in 2025, before her plan's last payment. She owes $90,000 and the house is worth $60,000. In the Fourth Circuit, can the plan pay $60,000 secured, with interest, and treat the rest as unsecured?","answer":"case-hurlburt","options":["case-hurlburt","usc-1322c2","case-nobelman","case-davis"],"explain":"Hurlburt (en banc) reads § 1322(c)(2) to allow full modification, including bifurcation and cramdown, of such short-term home loans, overruling Witt. § 1322(c)(2) is the text, but Hurlburt decides the cramdown question."},{"id":"hm-9","topic":"home-mortgage-and-liens","level":1,"prompt":"A draft plan cuts the interest rate on Mr. Ezra Toomer's 30-year mortgage, which is secured only by his house, from 7% to 4%. What blocks it?","answer":"usc-1322b2","options":["usc-1322b2","usc-1322b5","usc-506a1","usc-1322c2"],"explain":"§ 1322(b)(2) bars modifying the rights of a holder of a claim secured only by the principal residence, including its interest rate. (b)(5) allows only cure and maintain."},{"id":"hm-10","topic":"home-mortgage-and-liens","level":2,"prompt":"Which Code subsection did both Dewsnup and Caulkett construe in rejecting Chapter 7 lien stripping?","answer":"usc-506d","options":["usc-506d","usc-506a1","usc-1322b2","usc-522f"],"explain":"Both cases interpreted § 506(d), which voids a lien only to the extent it secures a claim that is not an allowed secured claim. § 506(a) bifurcation is what Chapter 13 strip-off relies on instead."},{"id":"hm-11","topic":"home-mortgage-and-liens","level":2,"prompt":"The upset-bid period on Mr. Wexley's neighbor's foreclosure expired with no upset bid, and the trustee's deed was recorded last week. The neighbor now wants to file Chapter 13 and cure. Which provision ends the cure right?","answer":"usc-1322c1","options":["usc-1322c1","usc-1322b5","case-barham","usc-1322c2"],"explain":"§ 1322(c)(1) allows a cure only 'until such residence is sold at a foreclosure sale.' Here the sale is final under NC law, so Barham's upset-period window has already closed."},{"id":"pm-1","topic":"plan-modification","level":1,"prompt":"Eight months after confirmation, surf instructor Dale 'Rip' Tidewell of Wrightsville Beach is promoted to regional manager of a paddleboard chain and doubles his pay. Trustee Staley wants a bigger dividend for unsecureds. What authorizes the trustee's request?","answer":"usc-1329a","options":["usc-1329a","usc-1323","usc-1306a","frbp-2002a5"],"explain":"§ 1329(a) lets the trustee (as well as the debtor or an allowed unsecured claimholder) seek to increase payments after confirmation; § 1323 is the debtor-only, pre-confirmation route.","quip":"Rip caught a wave. The trustee would like a ride."},{"id":"pm-2","topic":"plan-modification","level":1,"prompt":"Marla Quimby's plan is not yet confirmed, and she has decided the bass boat is not worth paying for. She wants to change her plan to surrender it. What governs?","answer":"usc-1323","options":["usc-1323","usc-1329a","usc-1329c","frbp-3015h"],"explain":"Before confirmation the debtor modifies under § 1323 and the modified plan becomes the plan on filing; § 1329 and Rule 3015(h) apply only after confirmation."},{"id":"pm-3","topic":"plan-modification","level":1,"prompt":"Hollis Bramblett's 60-month plan's first payment was due in January 2023. After losing his job in 2026 he wants to stretch payments to month 72. What stops him?","answer":"usc-1329c","options":["usc-1329c","usc-1329a","usc-1323","usc-1307c"],"explain":"§ 1329(c) caps a modified plan at five years from when the first payment under the original plan was due; § 1329(a) allows extending time, but only within that cap."},{"id":"pm-4","topic":"plan-modification","level":2,"prompt":"You file a motion to modify Earlene Sneed's confirmed plan to drop her payment after a hospital stay. What rule sets the 21-day notice and makes any objection a contested matter?","answer":"frbp-3015h","options":["frbp-3015h","frbp-2002a5","frbp-1017f","lbr-4002-1"],"explain":"Rule 3015(h) is the specific procedure for modifying a confirmed Chapter 13 plan (21 days' notice; Rule 9014 governs objections); Rule 2002(a)(5) is the general notice list about accepting or rejecting a modification."},{"id":"pm-5","topic":"plan-modification","level":3,"prompt":"Two years into the plan, the Fenwicks do a cash-out refinance on their Ogden ranch house and net $40,000. The trustee moves to increase plan payments to capture it. Most on-point Fourth Circuit authority?","answer":"case-murphy","options":["case-murphy","case-arnold","case-trantham","case-harris"],"explain":"Murphy (the Goralski half) held a refinancing loan is not a substantial change in financial condition because 'a loan, regardless of the size, is not income,' so res judicata barred the trustee's modification; Arnold involved an income increase.","quip":"Borrowing money is many things. Getting rich is not one of them."},{"id":"pm-6","topic":"plan-modification","level":3,"prompt":"Delbert Fenwick's income jumps from about $80,000 at confirmation to nearly $200,000. An unsecured creditor, not the trustee, moves to raise his payments. Delbert says confirmation is res judicata. Which case answers him?","answer":"case-arnold","options":["case-arnold","case-murphy","case-taylor","case-marrama"],"explain":"Arnold held res judicata bars an increase only absent unanticipated, substantial changes and upheld an unsecured creditor's § 1329 motion on nearly these facts; Murphy later reaffirmed Arnold but its facts were a refinance and a condo sale."},{"id":"pm-7","topic":"plan-modification","level":2,"prompt":"Clovis Merriweather wants to sell his Carolina Beach rental cottage mid-plan; after his exemption and the mortgage, non-exempt equity is about $40,000. Property vested at confirmation. Under EDNC local practice, what does he need first?","answer":"lbr-4002-1","options":["lbr-4002-1","usc-1329a","usc-1306a","lbr-1007-1"],"explain":"LBR 4002-1(g)(4) bars disposing of property (vested or not) with non-exempt equity over $15,000 without a court order; § 1329(a) is what the trustee may use afterward to reach the proceeds."},{"id":"pm-8","topic":"plan-modification","level":3,"prompt":"Your plan proposes vesting at confirmation instead of the local form's default. The trustee's only objection is 'that's not what the form says.' Best Fourth Circuit authority for you?","answer":"case-trantham","options":["case-trantham","case-murphy","case-schwab","case-law"],"explain":"Trantham held a court may reject a vesting provision only for Code-based reasons, not merely because it departs from a local form; Murphy concerns modification after a sale, not plan-form objections."},{"id":"pm-9","topic":"plan-modification","level":3,"prompt":"Junie Batts sells a condo that vested in her at confirmation, eleven months later, for a 50% gain and pockets debt-free cash. She argues § 1327(b) vesting makes the proceeds hers and bars any modification. Which case rejects that?","answer":"case-murphy","options":["case-murphy","case-trantham","case-arnold","usc-1306a"],"explain":"Murphy found the debt-free sale proceeds a substantial and unanticipated change and held vesting did not prevent the trustee from seeking modification; Trantham later cited Murphy for that point but decided a plan-form vesting dispute."},{"id":"pm-10","topic":"plan-modification","level":2,"prompt":"Two years into Rip Tidewell's plan, his great-aunt in Burgaw leaves him $25,000. Is the inheritance property of the Chapter 13 estate?","answer":"usc-1306a","options":["usc-1306a","usc-541a1","usc-541c2","usc-348f"],"explain":"§ 1306(a)(1) sweeps in § 541-type property the debtor acquires after filing until the case is closed, dismissed or converted; § 541(a)(1) alone looks only at the petition date."},{"id":"pm-11","topic":"plan-modification","level":2,"prompt":"The trustee objects to Earlene's modified plan, arguing it now pays unsecureds less than they would get in a Chapter 7 liquidation. Which provision makes that a valid ground?","answer":"usc-1329b","options":["usc-1329b","usc-1329c","usc-1323","frbp-3015h"],"explain":"§ 1329(b)(1) applies § 1325(a) (including the best-interests test) to every modification; Rule 3015(h) is only the procedure."},{"id":"dc-1","topic":"dismissal-conversion","level":1,"prompt":"Two years in, Bubba Pruitt of Leland announces he is done: no Chapter 7, no discharge, just out. Which provision gives him that exit?","answer":"usc-1307b","options":["usc-1307b","usc-1307a","usc-1307c","usc-521i"],"explain":"§ 1307(b) requires the court to dismiss on the debtor's request (if the case wasn't converted under § 706, 1112 or 1208); § 1307(a) is conversion, not dismissal.","quip":"Bubba would like his Tuesdays back."},{"id":"dc-2","topic":"dismissal-conversion","level":1,"prompt":"Earlene Sneed lost her job at the hospital and wants to switch to Chapter 7. Which Code section gives her the right to do so?","answer":"usc-1307a","options":["usc-1307a","frbp-1017f","usc-1307b","usc-348f"],"explain":"§ 1307(a) gives the debtor the right to convert at any time and makes a waiver unenforceable; Rule 1017(f)(3) supplies the procedure, not the right."},{"id":"dc-3","topic":"dismissal-conversion","level":2,"prompt":"You file Earlene's notice of conversion on Monday. Does the court have to enter an order before she is in Chapter 7?","answer":"frbp-1017f","options":["frbp-1017f","usc-1307a","lbr-1007-1","frbp-3015h"],"explain":"Rule 1017(f)(3) says a § 1307(a) conversion notice converts the case without a court order, and the notice date becomes the conversion order date for § 348(c) and Rule 1019."},{"id":"dc-4","topic":"dismissal-conversion","level":1,"prompt":"Hollis Bramblett has missed three payments under his confirmed plan. Trustee Staley moves to dismiss. Which provision supplies the ground?","answer":"usc-1307c","options":["usc-1307c","usc-1307b","usc-521i","usc-109g"],"explain":"§ 1307(c) lets a party in interest seek dismissal or conversion for cause, including material default under a confirmed plan; § 1307(b) is the debtor's own request."},{"id":"dc-5","topic":"dismissal-conversion","level":2,"prompt":"Rip Tidewell bought a used truck with post-petition wages in year two, then converts to Chapter 7 in good faith. Does the Chapter 7 trustee get the truck?","answer":"usc-348f","options":["usc-348f","usc-1306a","usc-541a1","case-harris"],"explain":"Under § 348(f)(1)(A) the converted estate is petition-date estate property still held at conversion, so a post-petition purchase stays out; § 1306(a) defined the Chapter 13 estate only while the case was in 13."},{"id":"dc-6","topic":"dismissal-conversion","level":3,"prompt":"When Marla Quimby converts in good faith, the Chapter 13 trustee is holding $3,200 of her plan payments not yet disbursed. Creditors want it. Who wins?","answer":"case-harris","options":["case-harris","case-marrama","usc-348f","case-law"],"explain":"Harris v. Viegelahn held the debtor gets back undistributed post-petition wages on a good-faith conversion; § 348(f)(2) shows bad faith changes the result, but that is not these facts.","quip":"Marla 1, creditors 0, trustee holding the ball."},{"id":"dc-7","topic":"dismissal-conversion","level":3,"prompt":"A Chapter 7 debtor who quietly moved a beach lot to a relative tries to convert to Chapter 13 once the trustee notices. The debtor says § 706(a) conversion is absolute. Controlling authority?","answer":"case-marrama","options":["case-marrama","case-harris","usc-1307a","case-law"],"explain":"Marrama held a bad-faith debtor can forfeit the right to convert because § 706(d) requires that he qualify as a Chapter 13 debtor; § 1307(a) runs the other direction, 13 to 7."},{"id":"dc-8","topic":"dismissal-conversion","level":2,"prompt":"Delbert filed a Chapter 13 in June 2026, then voluntarily dismissed in August right after his servicer filed a stay-relief motion. He wants to refile in October. Problem?","answer":"usc-109g","options":["usc-109g","usc-1307b","usc-521i","usc-1328f"],"explain":"§ 109(g)(2) bars filing within 180 days after a voluntary dismissal obtained following a stay-relief request; § 1307(b) is what gave him the dismissal, not the bar."},{"id":"dc-9","topic":"dismissal-conversion","level":2,"prompt":"You filed a bare-bones petition for Junie Batts to stop a Pender County foreclosure sale, and the schedules are still not in on day 44. Which EDNC local rule spells out the day-46 consequence?","answer":"lbr-1007-1","options":["lbr-1007-1","usc-521i","lbr-4002-1","lbr-4003-1"],"explain":"LBR 1007-1(c) provides automatic dismissal effective day 46 under § 521(i)(1); § 521(i) is the Code source, not the local rule."},{"id":"dc-10","topic":"dismissal-conversion","level":1,"prompt":"On day 40, Junie's documents are delayed by a hurricane evacuation. What lets you ask for up to 45 more days?","answer":"usc-521i","options":["usc-521i","usc-1307c","usc-109g","frbp-1017f"],"explain":"§ 521(i)(3) allows the court, on the debtor's request made within 45 days of filing, to extend the deadline by up to 45 days if justified."},{"id":"dc-11","topic":"dismissal-conversion","level":2,"prompt":"A Wilmington landlord with $2.1 million of noncontingent, liquidated debt, mostly mortgages on rentals, wants to file Chapter 13 in December 2026. Which provision decides whether he qualifies?","answer":"usc-109e","options":["usc-109e","usc-109g","usc-1307a","usc-348f"],"explain":"§ 109(e), as amended effective for cases commenced on or after Nov. 10, 2026, uses a combined limit of less than $2,750,000, so he is under it; under the old separate secured limit ($1,580,125) he likely would not have been."},{"id":"dc-12","topic":"dismissal-conversion","level":3,"prompt":"After confirmation, an EDNC couple's Chapter 13 was dismissed for bad faith (fraud and knowing violations of court orders and local rules) with multi-year refiling bars. On appeal they argued that LBR 4002-1(g)(5)-(6), the post-petition debt and purchase limits, was invalid. Which decision addressed this?","answer":"case-purdy","options":["case-purdy","case-marrama","case-trantham","case-murphy"],"explain":"Purdy v. Burnett (4th Cir. 2025, unpublished) affirmed the bad-faith dismissal and held the confirmed plan bound the debtors to LBR 4002-1(g)(5)-(6); Trantham concerned plan-form vesting, not misconduct."},{"id":"ds-1","topic":"discharge","level":1,"prompt":"Hollis Bramblett makes his 60th and final payment to Trustee Staley and has done every chore on the checklist. What grants his discharge?","answer":"usc-1328a","options":["usc-1328a","usc-1328b","usc-524a2","usc-1307b"],"explain":"§ 1328(a) grants the full-compliance discharge after all plan payments; § 1328(b) is the hardship discharge for debtors who could not finish.","quip":"Sixty payments. One discharge. Zero further calls from 'Card Services.'"},{"id":"ds-2","topic":"discharge","level":2,"prompt":"Trish Lanier received a Chapter 7 discharge in a case she filed in March 2023. In November 2026 she wants Chapter 13 to save her house in Castle Hayne. Can she get a Chapter 13 discharge?","answer":"usc-1328f","options":["usc-1328f","usc-109g","usc-1328h","usc-1307c"],"explain":"§ 1328(f)(1) bars a Chapter 13 discharge if she got a discharge in a Chapter 7 case filed within 4 years before the new order for relief; she can still file and pay, but no discharge. § 109(g) is about the 180-day refiling bar."},{"id":"ds-3","topic":"discharge","level":1,"prompt":"Bubba Pruitt finishes his plan but never took the personal financial management course because 'I already know I'm broke.' Which Code provision blocks his discharge?","answer":"usc-1328g1","options":["usc-1328g1","frbp-4004c4","usc-1328h","usc-1328b"],"explain":"§ 1328(g)(1) requires the post-petition financial management course for a discharge; Rule 4004(c)(4) is the rule-level enforcement, not the Code requirement."},{"id":"ds-4","topic":"discharge","level":2,"prompt":"Bubba later takes the course, but nobody files the certificate and the provider never notified the court. Which rule tells the court it must not enter the Chapter 13 discharge?","answer":"frbp-4004c4","options":["frbp-4004c4","frbp-1007b7","frbp-1017f","frbp-3015h"],"explain":"Rule 4004(c)(4) bars a Chapter 13 discharge without the Rule 1007(b)(7) certificate; Rule 1007(b)(7) is the filing duty itself."},{"id":"ds-5","topic":"discharge","level":2,"prompt":"Before signing the discharge order, the court must find no reasonable cause to believe § 522(q)(1) may apply and no pending felony proceeding of the kind it describes. Which provision requires that?","answer":"usc-1328h","options":["usc-1328h","usc-1328f","usc-1328g1","usc-523a"],"explain":"§ 1328(h) requires that finding after notice and a hearing held within 10 days before the discharge; § 1328(f) concerns prior discharges."},{"id":"ds-6","topic":"discharge","level":3,"prompt":"In a fit of temper, Delbert Fenwick rammed his neighbor's boat dock on Masonboro Sound (no one hurt) and the neighbor has a judgment for willful and malicious property damage. Delbert completes his plan. Does a Chapter 13 discharge reach it?","answer":"usc-1328a","options":["usc-1328a","usc-523a","usc-1328b","usc-524a2"],"explain":"§ 1328(a)(2) does not include § 523(a)(6), and § 1328(a)(4) excepts only willful or malicious injury causing personal injury or death, so the property-damage debt is discharged; in Chapter 7 or a § 1328(b) hardship discharge the creditor could instead seek a § 523(a)(6) determination.","quip":"The dock is still crooked. The debt is not still owed."},{"id":"ds-7","topic":"discharge","level":1,"prompt":"Marla Quimby completes her plan owing $6,000 in child support arrears not fully paid through the plan. Which section categorizes that debt as nondischargeable?","answer":"usc-523a","options":["usc-523a","usc-1328b","usc-524i","usc-1307c"],"explain":"§ 523(a)(5) covers domestic support obligations, and § 1328(a)(2) carries (a)(5) into the Chapter 13 discharge exceptions."},{"id":"ds-8","topic":"discharge","level":2,"prompt":"In month 50, Earlene Sneed suffers a disabling stroke and can only receive disability income; unsecureds have already received more than Chapter 7 value and modification would not work. Which provision?","answer":"usc-1328b","options":["usc-1328b","usc-1329a","usc-1307b","usc-1328a"],"explain":"§ 1328(b) permits a hardship discharge when the debtor is not justly accountable, the liquidation test is met, and § 1329 modification is not practicable; § 1328(a) requires completing all payments."},{"id":"ds-9","topic":"discharge","level":3,"prompt":"After Rip Tidewell's discharge, his mortgage servicer claims he is 'behind' by the very payments Trustee Staley sent it, adds late fees and threatens foreclosure, costing him a refinance. Best statutory hook?","answer":"usc-524i","options":["usc-524i","usc-524a2","case-taggart","usc-1328a"],"explain":"§ 524(i) makes a creditor's willful failure to credit plan payments, causing material injury, a violation of the § 524(a)(2) injunction; Taggart sets the contempt standard but is not the statutory hook for crediting."},{"id":"ds-10","topic":"discharge","level":3,"prompt":"A debt buyer sues Junie Batts on a credit card discharged in her Chapter 13, then says it honestly believed the card survived. Under what standard can it be held in contempt?","answer":"case-taggart","options":["case-taggart","usc-524a2","case-marrama","case-schwab"],"explain":"Taggart allows civil contempt when there is no fair ground of doubt that the discharge order barred the conduct, and subjective good faith is not a defense; § 524(a)(2) is the injunction itself."},{"id":"ds-11","topic":"discharge","level":1,"prompt":"A month after discharge, a collector calls Clovis Merriweather about a discharged medical bill. What did the collector violate?","answer":"usc-524a2","options":["usc-524a2","usc-524i","usc-1328h","usc-523a"],"explain":"§ 524(a)(2) enjoins any act to collect a discharged debt as a personal liability; § 524(i) is specific to failing to credit plan payments."},{"id":"ds-12","topic":"discharge","level":2,"prompt":"Hollis Bramblett dies just after his final plan payment is sent. His executor needs to handle the EDNC end-of-case certification on DSOs, prior discharges and § 522(q). Which local rule?","answer":"lbr-1016-1","options":["lbr-1016-1","lbr-1007-1","lbr-4003-1","lbr-4002-1"],"explain":"LBR 1016-1(b) requires the certification for a deceased Chapter 13 debtor to come with the executor's or administrator's verification (or a motion for exemption) and a death certificate."},{"id":"ex-1","topic":"exemptions-estate","level":1,"prompt":"At the § 341 meeting, Rip Tidewell mentions a pending lawsuit against the surf shop that sold him a defective board before he filed. Is the claim property of the estate?","answer":"usc-541a1","options":["usc-541a1","usc-541c2","usc-1306a","usc-522b"],"explain":"§ 541(a)(1) captures all legal or equitable interests as of filing, including prepetition causes of action; § 1306(a) adds after-acquired property.","quip":"Rip forgot to list it. The trustee did not forget to ask."},{"id":"ex-2","topic":"exemptions-estate","level":1,"prompt":"Earlene Sneed has $180,000 in her ERISA-qualified hospital 401(k). Does it come into her estate?","answer":"usc-541c2","options":["usc-541c2","usc-522b","usc-541a1","ncgs-1c-1601"],"explain":"§ 541(c)(2) honors transfer restrictions enforceable under nonbankruptcy law, so the ERISA plan is excluded and never needs an exemption; § 522(b) only matters for property that is in the estate."},{"id":"ex-3","topic":"exemptions-estate","level":3,"prompt":"Same 401(k). A creditor argues 'applicable nonbankruptcy law' in § 541(c)(2) means only state spendthrift-trust law. Which case says federal ERISA counts?","answer":"case-patterson","options":["case-patterson","case-clark","case-schwab","case-law"],"explain":"Patterson v. Shumate held 'applicable nonbankruptcy law' includes ERISA, so the plan interest is excluded; Clark concerns inherited IRAs under § 522(b)(3)(C)."},{"id":"ex-4","topic":"exemptions-estate","level":1,"prompt":"Marla Quimby moved to Wilmington from Ohio six years ago. Can she pick the federal § 522(d) exemptions?","answer":"ncgs-1c-1601","options":["ncgs-1c-1601","usc-522b","lbr-4003-1","usc-522l"],"explain":"Her domicile is North Carolina under the 730-day rule, and G.S. 1C-1601(f) makes the § 522(d) exemptions inapplicable to NC residents; § 522(b) is what allows a state to do that."},{"id":"ex-5","topic":"exemptions-estate","level":2,"prompt":"Clovis Merriweather, 67 and unmarried, owns the Myrtle Grove house he and his late wife held as tenants by the entirety, with $58,000 of equity. What exemption amount can he claim?","answer":"ncgs-1c-1601","options":["ncgs-1c-1601","usc-522b","usc-522l","case-schwab"],"explain":"G.S. 1C-1601(a)(1) raises the residence exemption to $60,000 for an unmarried debtor 65 or older when the property was held with a now-deceased co-owner by entireties or survivorship, so all $58,000 is covered."},{"id":"ex-6","topic":"exemptions-estate","level":2,"prompt":"The § 341 meeting for Junie Batts concluded March 3. Trustee Staley files an objection to her vehicle exemption on April 20 with no extension. What rule controls the deadline?","answer":"frbp-4003b1","options":["frbp-4003b1","lbr-4003-1","usc-522l","frbp-3015h"],"explain":"Rule 4003(b)(1) gives 30 days after the § 341 meeting concludes (or after an amended list), so April 20 is late; LBR 4003-1(b) only governs how to seek an extension."},{"id":"ex-7","topic":"exemptions-estate","level":3,"prompt":"Same facts: the objection was late, but the trustee says Junie's exemption claim was frivolous anyway. Which case says that does not matter?","answer":"case-taylor","options":["case-taylor","case-schwab","case-law","case-marrama"],"explain":"Taylor held a trustee who misses the Rule 4003(b) deadline cannot contest the exemption even if it lacked a colorable basis; Schwab limits Taylor where the claim was a dollar amount within the statutory limit."},{"id":"ex-8","topic":"exemptions-estate","level":3,"prompt":"In his Chapter 7 case, Delbert lists his tools at $2,000 and claims a $2,000 tools-of-trade exemption (the G.S. 1C-1601(a)(5) cap). Nobody objects. A year later the trustee proves they are worth $9,000 and wants the excess. Which case lets the trustee reach it?","answer":"case-schwab","options":["case-schwab","case-taylor","case-law","usc-522l"],"explain":"Schwab held no objection was needed because the claimed dollar amount was within the statutory limit, so the estate keeps value above it; Taylor involved a claim listed at '$ unknown,' not a dollar amount within the statutory limit."},{"id":"ex-9","topic":"exemptions-estate","level":3,"prompt":"Rip Tidewell inherited his father's IRA and tries to exempt it as 'retirement funds' under § 522(b)(3)(C). Which case rejects that route?","answer":"case-clark","options":["case-clark","case-patterson","case-schwab","case-law"],"explain":"Clark v. Rameker held inherited IRA funds are not 'retirement funds' under § 522(b)(3)(C); Patterson concerns ERISA plan exclusion under § 541(c)(2)."},{"id":"ex-10","topic":"exemptions-estate","level":2,"prompt":"Same inherited IRA, received by direct trustee-to-trustee transfer. Is there another exemption to look at for this NC client?","answer":"ncgs-1c-1601","options":["ncgs-1c-1601","usc-522b","case-clark","usc-541c2"],"explain":"G.S. 1C-1601(a)(9) by its text keeps IRA assets exempt when held by a subsequent beneficiary through a direct transfer or eligible rollover to an inherited IRA; Clark addressed only the federal § 522(b)(3)(C) category."},{"id":"ex-11","topic":"exemptions-estate","level":3,"prompt":"A judge, angry at a debtor's concealment, orders the debtor's unobjected homestead exemption used to pay the trustee's attorney fees. Which case says no?","answer":"case-law","options":["case-law","case-marrama","case-taylor","case-schwab"],"explain":"Law v. Siegel held a court cannot surcharge exempt property under § 105(a) or inherent power contrary to § 522; Marrama's bad-faith reasoning concerned conversion eligibility, not exemptions."},{"id":"ex-12","topic":"exemptions-estate","level":2,"prompt":"A creditor's lawyer realizes on day 28 after the § 341 meeting concluded that she needs Earlene's appraisal before objecting. In EDNC, what must she do and when?","answer":"lbr-4003-1","options":["lbr-4003-1","frbp-4003b1","usc-522l","lbr-1007-1"],"explain":"LBR 4003-1(b) requires a motion stating reasons, filed before the time to object expires; Rule 4003(b)(1) supplies the 30-day period and the 'for cause' standard."}],"chains":[{"id":"as-c1","topic":"automatic-stay","level":2,"facts":"Leroy Batts's first Chapter 13 was dismissed seven months ago for failing to make payments under his confirmed plan; he refiles in Wilmington to stop a foreclosure on his Monkey Junction house.","steps":["usc-362c3","lbr-4001-1d","frbp-9014"],"explain":"Section 362(c)(3) starts a 30-day clock with a bad-faith presumption to rebut; LBR 4001-1(d) offers the 5-day no-hearing track; if anyone objects, the motion is heard as a Rule 9014 contested matter, still before day 30."},{"id":"as-c2","topic":"automatic-stay","level":2,"facts":"A furniture store keeps sending collection letters to Cheryl Ammons after receiving notice of her Chapter 13 and two letters from your office.","steps":["usc-362a6","usc-362k","case-houck","case-lyle"],"explain":"The letters violate § 362(a)(6); § 362(k) supplies damages; Houck states the elements; Lyle shows how EDNC measures willfulness and damages."},{"id":"as-c3","topic":"automatic-stay","level":3,"facts":"A buy-here-pay-here dealer on Market Street repossessed Kendra Stroud's car the day before she filed and simply keeps it after the petition.","steps":["usc-362a3","case-fulton","usc-362k"],"explain":"Section 362(a)(3) bars exercising control over estate property, but Fulton says passive retention alone is not a violation, so a § 362(k) damages claim needs more than retention (turnover being the route Fulton left open)."},{"id":"as-c4","topic":"automatic-stay","level":3,"facts":"A card issuer keeps auto-debiting Marcus Hinnant's account post-petition, then moves to compel arbitration of his stay-violation claim.","steps":["usc-362a6","usc-362k","case-goldman"],"explain":"Post-petition collection violates § 362(a)(6), § 362(k) provides the claim, and Goldman Sachs v. Brown keeps that core claim in bankruptcy court in the Fourth Circuit, pending Supreme Court review."},{"id":"sr-c1","topic":"stay-relief","level":2,"facts":"A servicer moves for relief over three missed post-petition payments on the Lumbee home, and Gus disputes two of them.","steps":["usc-362d1","lbr-4001-1c","usc-362e","frbp-4001a4"],"explain":"The default is cause under § 362(d)(1); LBR 4001-1(c) forces itemization, the payment history and a stated position on extending the (e)(1) period; § 362(e) runs the 30/60-day clocks; and any relief order waits 14 days under Rule 4001(a)(4)."},{"id":"sr-c2","topic":"stay-relief","level":3,"facts":"After Rex files Chapter 13, his ex-wife finishes the divorce decree without asking anyone, then moves for relief to divide the marital home, an estate asset.","steps":["usc-362b2","usc-362d1","case-robbins"],"explain":"The decree fits § 362(b)(2)(A)(iv), but dividing estate property does not, so she needs cause under § 362(d)(1), and Robbins supplies the Fourth Circuit factors for letting the state court finish."},{"id":"sr-c3","topic":"stay-relief","level":2,"facts":"Toby's landlord got a summary ejectment judgment before Toby filed Chapter 13, and Toby wants to cure and stay.","steps":["usc-362a3","usc-362b22","lbr-4001-1e"],"explain":"Possession would be stayed under § 362(a)(3), but § 362(b)(22) excepts prepetition possession judgments unless the debtor certifies and deposits under § 362(l), using EDNC's LBR 4001-1(e) forms and money order."},{"id":"ap-c1","topic":"adequate-protection-and-vehicles","level":2,"facts":"Shonda files Chapter 13 in Wilmington and keeps her financed Silverado.","steps":["usc-1326a1","lbr-3070-1c","usc-1326a4","usc-1325a5biii"],"explain":"Section 1326(a)(1) starts adequate protection by day 30, LBR 3070-1(c) routes it through the trustee at a presumptive 1%, § 1326(a)(4) requires insurance proof by day 60, and § 1325(a)(5)(B)(iii) carries equal, adequately protective payments into the confirmed plan."},{"id":"ap-c2","topic":"adequate-protection-and-vehicles","level":3,"facts":"An undersecured boat lender insists the debtor pay interest for the delay or it will move for relief.","steps":["usc-361","usc-363e","case-timbers"],"explain":"Section 361 lists the forms of protection, § 363(e) lets the lender seek conditions on use, and Timbers limits what is protected to the collateral's value, not compensation for delay."},{"id":"ap-c3","topic":"adequate-protection-and-vehicles","level":2,"facts":"Javier lets the insurance on his financed work van lapse in month three, and the lender files a motion.","steps":["usc-1326a4","usc-362d1","frbp-4001d"],"explain":"The lapse breaches the § 1326(a)(4) duty, the lender moves for cause under § 362(d)(1), and the usual resolution is a consent order approved under Rule 4001(d)."},{"id":"co-c1","topic":"claims-objections","level":2,"facts":"Zombie Receivables files a credit card claim with a 2016 charge-off date in Earl Beaufort's Chapter 13. Build the pattern from 'it gets paid' to 'it doesn't'.","steps":["usc-502a","usc-502b","frbp-3007","case-midland"],"explain":"The claim is deemed allowed until objection; § 502(b)(1) is the ground, Rule 3007 the procedure, and Midland explains why the objection - not an FDCPA suit - is the remedy."},{"id":"co-c2","topic":"claims-objections","level":2,"facts":"Perpetual Recovery files a bare-bones debt-buyer claim against Tammy Topsail with no account history.","steps":["usc-502a","frbp-3001c4","frbp-3001f","frbp-3007"],"explain":"The claim is deemed allowed, but the missing open-end statement undercuts the prima facie weight Rule 3001(f) would otherwise give it, so you object under Rule 3007."},{"id":"co-c3","topic":"claims-objections","level":3,"facts":"Pam Wrightsville's co-signed lender never files a claim in her EDNC case, then files one after you file for it.","steps":["frbp-3002c","frbp-3004","lbr-3004-1"],"explain":"The 70-day bar runs under Rule 3002(c), Rule 3004 gives you 30 more days to file for the creditor, and EDNC LBR 3004-1 lets the creditor amend your filing."},{"id":"mc-c1","topic":"mortgage-claims-3002-1","level":2,"facts":"Marisol Hatteras files Chapter 13 three payments behind and wants to keep the house in an EDNC conduit plan.","steps":["usc-1322b5","frbp-3001c2","frbp-3002c6","lbr-3070-2"],"explain":"The Code allows cure and maintain, Rule 3001(c)(2)(C) and 3002(c)(6) make the servicer show its numbers by day 70, and LBR 3070-2 routes the ongoing payments through the trustee."},{"id":"mc-c2","topic":"mortgage-claims-3002-1","level":2,"facts":"Lighthouse adds $650 of attorney and inspection fees mid-case and later tries to collect them without proper notice.","steps":["usc-506b","frbp-3002-1c","frbp-3002-1h"],"explain":"Section 506(b) is the fee entitlement, Rule 3002.1(c) requires notice within 180 days, and (h) sanctions a holder that fails to give it."},{"id":"mc-c3","topic":"mortgage-claims-3002-1","level":3,"facts":"Gus Masonboro finishes his plan; his mortgage was paid as Conduit Payments in EDNC.","steps":["frbp-3002-1g","lbr-3070-2","frbp-3002-1h"],"explain":"The trustee files the 45-day (g)(1) notice, EDNC adds the conduit (g)(4)(A) motion, and a holder that doesn't respond faces (h) sanctions."},{"id":"dx-c1","topic":"rule-2004-discovery","level":2,"facts":"The trustee suspects Bertie's brother-in-law is holding cash and wants his testimony and bank records before any dispute is filed.","steps":["usc-343","frbp-2004b","frbp-2004c","lbr-2004-1"],"explain":"The 341/§ 343 exam covers only the debtor, so you move under Rule 2004 (scope includes plan funding), compel with a 2004(c)/9016 subpoena, and EDNC allows the order ex parte."},{"id":"dx-c2","topic":"rule-2004-discovery","level":3,"facts":"Lighthouse's stay-relief motion is pending and you need its servicing records and a custodian deposition.","steps":["frbp-9014c","frbp-9016","case-washingtonmutual"],"explain":"The motion is a contested matter, so Rule 9014(c) brings in Part VII discovery, subpoenas run through 9016/Civil Rule 45, and the pending proceeding rule keeps either side from using Rule 2004 instead."},{"id":"dx-c3","topic":"rule-2004-discovery","level":2,"facts":"You need Carolina Beach Motors' sale records about a pre-petition transfer, with nothing pending in EDNC.","steps":["frbp-2004b","frbp-2004c","frbp-9016","ednc-adminguide"],"explain":"Rule 2004 scope reaches the debtor's property, 2004(c) compels the dealer via a 9016/Rule 45 subpoena, and EDNC's chart says file the motion at least 14 days before the exam."},{"id":"sn-c1","topic":"sales-and-new-debt","level":2,"facts":"Ronnie inherits a house two years into his EDNC plan and wants to sell it.","steps":["usc-1306","case-carroll","usc-1303","lbr-4002-1g"],"explain":"Section 1306 (as read in Carroll) pulls the inheritance into the estate, § 1303 gives Ronnie the sale power, and LBR 4002-1(g)(4) requires a court order if non-exempt equity tops $15,000."},{"id":"sn-c2","topic":"sales-and-new-debt","level":2,"facts":"Ronnie's buyer wants clean title despite a disputed judgment lien and a co-heir threatening an appeal.","steps":["usc-1303","usc-363f","frbp-6004","usc-363m"],"explain":"The debtor uses § 363(f) through § 1303, Rule 6004 supplies notice, a 9014 motion and the 14-day stay, and § 363(m) protects the good-faith buyer if no stay pending appeal issues."},{"id":"sn-c3","topic":"sales-and-new-debt","level":3,"facts":"Wanda needs a $24,000 car loan mid-plan and the lender wants to be paid through the case.","steps":["usc-1305","frbp-4001c3","lbr-4002-1g"],"explain":"Section 1305(c) makes trustee approval matter, Rule 4001(c) drops out in Chapter 13, and EDNC LBR 4002-1(g)(5) requires a court-approved application at $15,000 or more."},{"id":"sn-c4","topic":"sales-and-new-debt","level":3,"facts":"After confirmation, Ronnie sells vested property for a large unexpected profit and the trustee wants a modification.","steps":["usc-1327b","lbr-4002-1g","case-murphy"],"explain":"Confirmation vests the property by default, EDNC LBR 4002-1(g)(4) still requires a court order for a sale with over $15,000 of non-exempt equity 'whether vested or not', and Murphy's substantial-and-unanticipated-change test decides whether the trustee can reach the profit."},{"id":"cf-c1","topic":"confirmation","level":2,"facts":"Trustee Staley objects that the plan of Mr. Elmore Pike was not proposed in good faith, and the objection is filed 10 days before the Wilmington confirmation hearing.","steps":["usc-1325a3","frbp-3015","lbr-3015-3","case-deans"],"explain":"The Code sets the good-faith standard, Rule 3015(f) and LBR 3015-3 govern the objection and its 7-day deadline, and Deans supplies the Fourth Circuit's totality-of-the-circumstances test."},{"id":"cf-c2","topic":"confirmation","level":3,"facts":"A plan served on a student-loan creditor discharges accrued interest without an adversary proceeding; no objection is filed and the plan is confirmed.","steps":["frbp-3015","usc-1327","case-espinosa"],"explain":"The creditor had notice and an objection window under Rule 3015(f), § 1327(a) made the confirmed plan binding, and Espinosa holds the order is not void, though the court should not have confirmed it."},{"id":"cf-c3","topic":"confirmation","level":3,"facts":"A debtor with a recent Chapter 7 discharge files Chapter 13 to deal with an embezzlement judgment, proposing a 1% plan.","steps":["usc-1325a3","usc-1325a7","case-deans","case-neufeld"],"explain":"Both the plan (a)(3) and the filing (a)(7) must be in good faith, and the Fourth Circuit judges both by the Deans totality test as sharpened by Neufeld's focus on pre-petition misconduct and prior filings."},{"id":"di-c1","topic":"disposable-income","level":2,"facts":"A retiree on Social Security with heavy card debt wants to keep her paid-off Leland home and pay a modest plan funded by her benefits.","steps":["usc-101-10a","usc-1325b2","case-ranta","usc-1325a6"],"explain":"Social Security is excluded from CMI, so from disposable income, and Ranta keeps it out of projected disposable income while counting it for § 1325(a)(6) feasibility."},{"id":"di-c2","topic":"disposable-income","level":3,"facts":"An above-median couple has negative projected disposable income after the means test and proposes a 36-month plan; the trustee objects.","steps":["usc-1325b1","usc-1325b4","case-pliler"],"explain":"The objection triggers § 1325(b)(1), § 1325(b)(4) makes the commitment period 5 years, and Pliler holds that period applies as a time requirement even when disposable income is negative."},{"id":"di-c3","topic":"disposable-income","level":3,"facts":"An above-median debtor's means test shows negative income only because of payments on recently bought luxury vehicles; unsecured creditors get a few percent.","steps":["usc-707b2","usc-1325b1","usc-1325a3","case-goddard"],"explain":"The secured-debt deductions in § 707(b)(2) may satisfy § 1325(b)(1), but § 1325(a)(3) good faith is a separate test, and Goddard affirmed denial on these facts."},{"id":"cv-c1","topic":"cramdown-vehicles","level":2,"facts":"A client bought a personal-use SUV 600 days before filing and wants to keep it; the loan exceeds its value.","steps":["usc-1325a-hanging","usc-1325a5","case-till","lbr-form-113a"],"explain":"Inside 910 days § 506 is off, so § 1325(a)(5)(B) requires the full claim's present value at a Till prime-plus rate, paid as a § 3.4 '910 Claim' on EDNC's local form."},{"id":"cv-c2","topic":"cramdown-vehicles","level":2,"facts":"A client's 4-year-old personal-use sedan secures a loan larger than the car's retail value, and she wants to keep it.","steps":["usc-506a1","usc-506a2","usc-1325a5biii","case-till"],"explain":"Outside 910 days the claim bifurcates at retail replacement value and is paid in equal monthly amounts with Till interest."},{"id":"cv-c3","topic":"cramdown-vehicles","level":3,"facts":"A client surrenders a 910 vehicle through the plan; the lender sells it and claims a deficiency.","steps":["usc-1325a5","case-kenney","lbr-form-113a"],"explain":"Surrender satisfies § 1325(a)(5)(C), Kenney preserves the contract deficiency as unsecured, and Local Form 113A § 3.6 requires the amended claim within 180 days after confirmation or the deficiency is gone."},{"id":"hm-c1","topic":"home-mortgage-and-liens","level":2,"facts":"A client's only mortgage, on her home, is $50,000 more than the house is worth, and she is behind.","steps":["usc-1322b2","case-nobelman","usc-1322b5"],"explain":"§ 1322(b)(2) protects the home-only lender, Nobelman bars strip-down, so the plan can only cure and maintain under § 1322(b)(5)."},{"id":"hm-c2","topic":"home-mortgage-and-liens","level":3,"facts":"A Chapter 20 couple (Chapter 7 discharge two years ago) has a home worth less than the first mortgage and a HELOC behind it.","steps":["usc-506a1","usc-1322b2","case-davis"],"explain":"The HELOC has no value behind it under § 506(a), so it is not a protected secured claim under § 1322(b)(2), and Davis allows the strip-off even without a discharge, subject to good-faith scrutiny."},{"id":"hm-c3","topic":"home-mortgage-and-liens","level":2,"facts":"A Wilmington homeowner files Chapter 13 four days after the clerk's foreclosure auction, while the upset-bid period is still running.","steps":["usc-1322c1","ncgs-45-21-27","case-barham","usc-1322b5"],"explain":"§ 1322(c)(1) allows a cure until the sale, the NC statutes make the sale final only after the upset period, Barham applies that to § 1322(c)(1), and the plan then cures and maintains under (b)(5)."},{"id":"hm-c4","topic":"home-mortgage-and-liens","level":3,"facts":"A Chapter 7 debtor tries to void a wholly underwater second mortgage.","steps":["usc-506d","case-dewsnup","case-caulkett"],"explain":"§ 506(d) is the only Chapter 7 tool, Dewsnup read it narrowly for partially secured liens, and Caulkett applied the same reading to wholly underwater liens."},{"id":"pm-c1","topic":"plan-modification","level":2,"facts":"Trustee Staley learns Rip Tidewell's income doubled after confirmation and moves to raise his plan payment; Rip says confirmation settled it.","steps":["usc-1329a","frbp-3015h","case-arnold","case-murphy"],"explain":"§ 1329(a) authorizes the trustee's motion, Rule 3015(h) runs the notice and objection process, and Arnold, reaffirmed by Murphy, asks whether the change was substantial and unanticipated."},{"id":"pm-c2","topic":"plan-modification","level":3,"facts":"Clovis Merriweather wants to sell his vested Carolina Beach cottage mid-plan with $40,000 of non-exempt equity; the trustee will want the proceeds.","steps":["lbr-4002-1","usc-1329a","case-murphy","case-trantham"],"explain":"The EDNC rule requires a court order for the sale, § 1329(a) is the trustee's tool for the proceeds, Murphy supplies the test, and Trantham confirms vesting does not stop a modification motion."},{"id":"pm-c3","topic":"plan-modification","level":2,"facts":"Hollis Bramblett lost his job in month 30 and needs a lower payment and more time.","steps":["usc-1329a","usc-1329b","usc-1329c","frbp-3015h"],"explain":"§ 1329(a) lets him reduce or extend, § 1329(b) re-tests the modification under § 1325(a), § 1329(c) caps it at five years from the first original payment, and Rule 3015(h) gives creditors 21 days' notice."},{"id":"dc-c1","topic":"dismissal-conversion","level":2,"facts":"Earlene Sneed, in good faith, can no longer afford her plan and wants Chapter 7; the trustee holds undisbursed payments.","steps":["usc-1307a","frbp-1017f","usc-348f","case-harris"],"explain":"§ 1307(a) gives the right, Rule 1017(f)(3) converts on notice, § 348(f) fixes the Chapter 7 estate at the petition date, and Harris returns the undistributed wages to her."},{"id":"dc-c2","topic":"dismissal-conversion","level":3,"facts":"An EDNC debtor buys a $30,000 boat on credit mid-plan without court approval and lies about it at a hearing; the trustee moves to dismiss with a refiling bar.","steps":["lbr-4002-1","usc-1307c","c
