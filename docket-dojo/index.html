<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{height:100%;margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Docket Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* ===================================================================
   DOCKET DOJO — engine stylesheet
   Look: a federal docket sheet. Cool court-paper, navy ink, ruled
   docket lines, case-caption typography (the ")" column), slip-opinion
   headnote tiles color-keyed by authority type, mono for citations.
   Light tokens on :root; dark tokens under prefers-color-scheme and
   [data-theme="dark"]. Every color is a token.
   =================================================================== */
:root{
  --bg:#e6e9ed; --paper:#fbfbfa; --paper-2:#f0f2f5; --ink:#17202e; --ink-2:#465163; --ink-3:#6a7485;
  --rule:#d2d9e2; --rule-strong:#9badc2; --margin:#b3382f;
  --accent:#1d376f; --accent-ink:#ffffff; --stamp:#2747a3;
  --ok:#1d7442; --ok-bg:#e2f1e7; --bad:#ad3127; --bad-bg:#f8e5e2; --warn:#8f5d00; --warn-bg:#fbf0d9;
  --focus:#e8a900;
  --t-code:#1f4e9c; --t-rule:#2b7a4b; --t-local:#966000; --t-scotus:#8a1b38; --t-4th:#6a3d9a; --t-ednc:#0c727e; --t-nc:#6b5a3e; --t-other:#5b6573;
  --shadow:0 1px 0 rgba(20,30,50,.05), 0 10px 24px -16px rgba(20,30,50,.35);
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --paper:#151a22; --paper-2:#1b212b; --ink:#e4e8ee; --ink-2:#a9b2c0; --ink-3:#7f8998;
    --rule:#29313d; --rule-strong:#3d4858; --margin:#c75a50;
    --accent:#9ab6ff; --accent-ink:#0d1117; --stamp:#9fb6ff;
    --ok:#62c78e; --ok-bg:#132c1e; --bad:#f08b7f; --bad-bg:#371a17; --warn:#e3b052; --warn-bg:#2f2610;
    --focus:#ffc933;
    --t-code:#80a8ee; --t-rule:#6fc393; --t-local:#e2ac4b; --t-scotus:#e6809b; --t-4th:#ba96e8; --t-ednc:#58c3cd; --t-nc:#c6b089; --t-other:#a3acb9;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --paper:#151a22; --paper-2:#1b212b; --ink:#e4e8ee; --ink-2:#a9b2c0; --ink-3:#7f8998;
  --rule:#29313d; --rule-strong:#3d4858; --margin:#c75a50;
  --accent:#9ab6ff; --accent-ink:#0d1117; --stamp:#9fb6ff;
  --ok:#62c78e; --ok-bg:#132c1e; --bad:#f08b7f; --bad-bg:#371a17; --warn:#e3b052; --warn-bg:#2f2610;
  --focus:#ffc933;
  --t-code:#80a8ee; --t-rule:#6fc393; --t-local:#e2ac4b; --t-scotus:#e6809b; --t-4th:#ba96e8; --t-ednc:#58c3cd; --t-nc:#c6b089; --t-other:#a3acb9;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--stamp)}
:focus{outline:none}
:focus-visible,.kbd-nav :focus{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell & gutters ---------- */
.shell{min-height:100%;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px 28px}
.col{max-width:1000px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:3px double var(--rule-strong);margin-bottom:14px}
.brand{background:none;border:0;padding:6px 2px;cursor:pointer;display:flex;align-items:baseline;gap:8px;min-height:44px}
.brand b{font:700 22px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase}
.brand span{font:600 12px/1 var(--f-mono);color:var(--margin);letter-spacing:.04em}
.topbar nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sheet{background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);padding:18px clamp(14px,3.2vw,34px) 24px;min-width:0}
.foot{margin-top:14px;font:12px/1.5 var(--f-mono);color:var(--ink-3);display:flex;gap:6px 14px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{min-height:44px;padding:9px 16px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:2px;font:600 14px/1.1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--rule-strong);color:var(--ink-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.k{font:600 11px/1 var(--f-mono);border:1px solid currentColor;border-radius:2px;padding:3px 5px;opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- headings ---------- */
.sect{font:700 13px/1 var(--f-cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:26px 0 8px;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;border-bottom:1px solid var(--rule-strong)}
h1,h2,h3,h4{margin:0}

/* ---------- case caption (the memorable bit) ---------- */
.court{font:700 13px/1.35 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;text-align:center;margin:2px 0 12px;color:var(--ink-2)}
.caption{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0 14px;font:15px/1.6 var(--f-mono);border-bottom:1px solid var(--ink);padding-bottom:10px}
.cap-l,.cap-r{display:flex;flex-direction:column;min-width:0}
.cap-l strong{font:700 clamp(18px,4.2vw,26px)/1.2 var(--f-cond);letter-spacing:.06em;margin:2px 0}
.cap-l .ind{padding-left:2.5em;color:var(--ink-2)}
.cap-m{color:var(--ink-3);line-height:1.6;white-space:pre}
.cap-r{justify-content:center;gap:2px;overflow-wrap:anywhere}
.cap-r .rank{font:700 16px/1.25 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--stamp);margin-top:4px}
.xp{margin-top:12px}
.xp-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.bar{height:8px;background:var(--paper-2);border:1px solid var(--rule-strong);margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--stamp);transition:width .4s}
.minis{display:flex;gap:4px 18px;flex-wrap:wrap;margin-top:8px;font:12px/1.4 var(--f-mono);color:var(--ink-3)}

/* ---------- calendar call ---------- */
.call{width:100%;margin-top:18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;text-align:left;padding:16px 18px;min-height:88px;border:0;border-left:8px solid var(--margin);background:var(--accent);color:var(--accent-ink);cursor:pointer;border-radius:2px}
.call small{display:block;font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.call strong{display:block;font:700 clamp(26px,6vw,38px)/1.05 var(--f-cond);letter-spacing:.03em;margin-top:6px}
.call .cnt{font:600 13px/1.5 var(--f-mono);text-align:right;opacity:.92}
.call:hover{filter:brightness(1.08)}

/* ---------- docket entries ---------- */
.dk{border-top:2px solid var(--ink)}
.dk-h,.dk-row{display:grid;grid-template-columns:44px 104px minmax(0,1fr);gap:0 12px;align-items:baseline}
.dk-h{font:700 11px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:8px 6px;border-bottom:1px solid var(--ink)}
.dk-row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 6px;cursor:pointer;min-height:56px}
.dk-row:hover{background:var(--paper-2)}
.dk-row .no{font:600 15px/1 var(--f-mono);color:var(--margin)}
.dk-row .dt{font:13px/1 var(--f-mono);color:var(--ink-3)}
.dk-row .tx{font-size:15px;color:var(--ink-2)}
.dk-row .tx b{font:700 16px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-right:4px}
.dk-row .tx em{font-style:normal;color:var(--ink-3);font-size:13px}

/* ---------- topics ---------- */
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 44px auto;gap:6px 14px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--rule)}
.trow .ttl{font:700 16px/1.2 var(--f-cond);letter-spacing:.03em}
.trow .ttag{display:block;font-size:13px;color:var(--ink-3)}
.meter{height:10px;background:var(--paper-2);border:1px solid var(--rule-strong);display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--t-rule)}
.meter b{border-right:1px solid var(--paper);position:relative;z-index:1}
.meter b:last-child{border-right:0}
.tpct{font:13px/1 var(--f-mono);color:var(--ink-2);text-align:right}
.lvl{font:600 11px/1 var(--f-mono);border:1px solid var(--rule-strong);padding:3px 5px;color:var(--ink-2);white-space:nowrap}
.tact{display:flex;gap:6px;align-items:center}

/* ---------- play ---------- */
.playbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:13px/1.3 var(--f-mono);color:var(--ink-2);padding-bottom:10px;border-bottom:1px solid var(--rule)}
.playbar .sp{margin-left:auto}
.playbar .hot{color:var(--margin);font-weight:600}
.qhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:14px 0 6px}
.qhead .tt{font:700 13px/1.2 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.qhead .kind{font:600 11px/1 var(--f-mono);color:var(--margin);border:1px solid var(--margin);padding:3px 6px}
.prompt{font-size:clamp(17px,2.3vw,20px);line-height:1.5;margin:6px 0 14px;max-width:62ch}
.clock{height:6px;background:var(--paper-2);margin:-4px 0 14px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.clock i{position:absolute;inset:0 auto 0 0;background:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;gap:2px 10px;align-items:start;text-align:left;background:var(--paper);border:1px solid var(--rule-strong);border-left:6px solid var(--tc,var(--t-other));padding:10px 12px;min-height:72px;cursor:pointer;border-radius:2px}
.tile:hover{background:var(--paper-2)}
.tile .key{grid-row:1 / span 3;font:600 13px/1 var(--f-mono);border:1px solid var(--rule-strong);padding:5px 7px;color:var(--ink-2);align-self:start}
.tile .ty{font:600 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.tile .sh{font:600 16px/1.25 var(--f-cond);letter-spacing:.02em}
.tile .ci{font:12.5px/1.35 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.tile.right{background:var(--ok-bg);border-color:var(--ok)}
.tile.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tile.dim{opacity:.55}
.tile[disabled]{cursor:default}
.tile .mark{position:absolute;right:8px;top:8px;font:700 11px/1 var(--f-mono);letter-spacing:.08em}
.tile.right .mark{color:var(--ok)} .tile.wrong .mark{color:var(--bad)}
.assist{margin-top:12px}
.hint{margin-top:10px;border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 12px;font-size:15px}
.hint b{font:700 12px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--warn)}
.stmt{margin:8px 0 18px;padding:14px 16px;border-left:4px solid var(--ink);background:var(--paper-2);font-size:clamp(17px,2.4vw,21px);line-height:1.5}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfbtns .btn{min-height:76px;font-size:20px;flex-direction:column;gap:4px}
.tfbtns .btn small{font:12px/1 var(--f-mono);text-transform:none;letter-spacing:0;opacity:.75}
.tfbtns .btn.sus{border-color:var(--ok);color:var(--ok)}
.tfbtns .btn.ovr{border-color:var(--bad);color:var(--bad)}
.tfbtns .btn.chosen{outline:3px solid var(--ink-3);outline-offset:2px}

/* chain gang */
.howto{font:13px/1.4 var(--f-mono);color:var(--ink-3);margin:0 0 10px}
.slots{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.slots li{counter-increment:s;position:relative}
.slots li::before{content:counter(s);position:absolute;left:-1px;top:-9px;background:var(--paper);font:600 11px/1 var(--f-mono);color:var(--margin);padding:0 4px;z-index:1}
.slot-empty{min-height:72px;border:1.5px dashed var(--rule-strong);display:flex;align-items:center;justify-content:center;font:12px/1 var(--f-mono);color:var(--ink-3)}
.slots .tile{width:100%}
.tile.nokey{grid-template-columns:minmax(0,1fr)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tray .tile.used{opacity:.3}
.chain-act{margin-top:14px}

/* ---------- feedback / headnotes ---------- */
.fb{margin-top:20px;border:1px solid var(--rule-strong);border-top:4px solid var(--fbc);background:var(--paper);padding:16px clamp(12px,2.4vw,22px) 18px;scroll-margin-top:12px}
.fb.ok{--fbc:var(--ok)} .fb.bad{--fbc:var(--bad)} .fb.part{--fbc:var(--warn)}
.fb-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.stamp{display:inline-block;font:700 20px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--fbc);border:3px double var(--fbc);padding:7px 12px 6px;transform:rotate(-2deg)}
.coach{font-style:italic;font-size:17px;color:var(--ink-2);margin:0}
.xpg{margin-left:auto;font:600 13px/1 var(--f-mono);color:var(--ink-2)}
.fb h3{font:700 12px/1 var(--f-cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.fb .ex{margin:8px 0 0;max-width:70ch}
.quip{margin:10px 0 0;font-size:14px;color:var(--ink-3)}
.quip::before{content:"Clerk's aside: ";font:600 12px/1 var(--f-mono);color:var(--margin)}
.picked{font-size:14px;color:var(--ink-2);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--bad)}
.asof{font:11.5px/1 var(--f-mono);color:var(--ink-3);margin:16px 0 0;letter-spacing:.04em}
.fb-actions{margin-top:16px}
.headnote{border:1px solid var(--rule);border-left:6px solid var(--tc,var(--t-other));padding:12px 14px;background:var(--paper);margin:0 0 10px}
.hn-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbadge{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tc);border:1px solid var(--tc);padding:3px 6px}
.hn-label{font:600 11px/1 var(--f-mono);color:var(--ink-3)}
.hn-short{font:700 18px/1.25 var(--f-cond);margin:8px 0 2px}
.cite{font:13.5px/1.45 var(--f-mono);margin:0 0 8px;overflow-wrap:anywhere}
.hn-p{margin:6px 0;font-size:15px}
.hn-k{font:700 11px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.hn-status{display:inline-block;margin:6px 0 2px;font:12px/1.4 var(--f-mono);color:var(--warn);background:var(--warn-bg);padding:3px 7px}
.src{margin-top:6px;font-size:13px}
.src summary{cursor:pointer;font:600 12px/1 var(--f-mono);color:var(--ink-2);padding:10px 0;min-height:32px;list-style-position:inside}
.src ul{margin:2px 0 0;padding-left:18px}
.src li{margin:3px 0}
.src .url{display:block;font:11px/1.35 var(--f-mono);color:var(--ink-3);overflow-wrap:anywhere}
.t-code{--tc:var(--t-code)} .t-rule{--tc:var(--t-rule)} .t-local{--tc:var(--t-local)} .t-scotus{--tc:var(--t-scotus)}
.t-4th{--tc:var(--t-4th)} .t-ednc{--tc:var(--t-ednc)} .t-nc{--tc:var(--t-nc)} .t-other{--tc:var(--t-other)}
.pattern-d summary{cursor:pointer;font:700 12px/1 var(--f-cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:12px 0 6px;min-height:36px}
.pattern-d p{margin:4px 0 0;max-width:70ch}

/* chain map */
.cmap{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px 30px;overflow:hidden}
.cmap li{position:relative;flex:1 1 150px;max-width:250px;display:flex}
.cmap li+li::before{content:"";position:absolute;left:-25px;top:50%;width:18px;border-top:2px solid var(--rule-strong)}
.cmap li+li::after{content:"";position:absolute;left:-10px;top:calc(50% - 5px);border-left:7px solid var(--rule-strong);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-top:1px}
.node{flex:1;text-align:left;background:var(--paper);border:1px solid var(--rule-strong);border-top:5px solid var(--tc);padding:9px 11px;min-height:64px;border-radius:2px;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit}
button.node{cursor:pointer}
button.node:hover{background:var(--paper-2)}
.node .ty{font:600 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.node .sh{font:600 14.5px/1.25 var(--f-cond)}
.node .ci{font:11.5px/1.35 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.node.hit{background:var(--ok-bg);border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.node.miss{background:var(--bad-bg);border-color:var(--bad)}
.node.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cmap.sm .node{min-height:52px;padding:7px 9px}
.cmap-note{font:12px/1.4 var(--f-mono);color:var(--ink-3);margin:8px 0 0}

/* pattern map screen */
.mapnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.mapnav select{min-height:44px;width:100%;background:var(--paper);border:1.5px solid var(--rule-strong);padding:6px 10px;border-radius:2px}
.maptitle{margin:16px 0 4px;font:700 clamp(24px,4.6vw,34px)/1.1 var(--f-cond);letter-spacing:.02em}
.maptag{color:var(--ink-3);margin:0 0 12px;font:13px/1.4 var(--f-mono)}
.patternbox{border-left:4px solid var(--margin);padding:4px 0 4px 14px;margin:0 0 18px;font-size:clamp(16px,2.1vw,18.5px);max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 0 0;font:11px/1 var(--f-mono);color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;background:var(--tc);display:inline-block}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

/* authorities list */
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input{flex:1 1 240px;min-height:44px;border:1.5px solid var(--rule-strong);background:var(--paper);padding:8px 12px;border-radius:2px;font-family:var(--f-mono);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.alist details{border-bottom:1px solid var(--rule)}
.alist summary{cursor:pointer;padding:10px 4px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;min-height:44px;list-style:none}
.alist summary::-webkit-details-marker{display:none}
.alist summary .sh{font:600 15px/1.3 var(--f-cond)}
.alist summary .ci{grid-column:2;font:12px/1.35 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.alist details[open] summary{background:var(--paper-2)}
.alist .headnote{margin:8px 0 12px}

/* settings */
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule)}
.set p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.set b{font:700 15px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
table.legendt{border-collapse:collapse;width:100%;font-size:14px}
table.legendt td{border-bottom:1px solid var(--rule);padding:7px 6px;vertical-align:top}
table.legendt td:first-child{font:600 13px/1.3 var(--f-mono);white-space:nowrap;color:var(--ink-2);width:1%}
.unv li{margin:4px 0;font-size:14px}
.unv li span{color:var(--ink-3)}

/* order of the court */
.order{max-width:720px;margin:0 auto;padding:6px 0 0}
.order h2{font:700 clamp(18px,3.6vw,22px)/1.25 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;text-align:center;margin:20px 0 14px;text-decoration:underline;text-underline-offset:5px}
.order p{margin:10px 0;font-size:16.5px;line-height:1.7;text-indent:2.5em}
.order ol{margin:8px 0 8px 2.5em;padding:0 0 0 1em;line-height:1.75}
.order .so{text-indent:0;font:700 15px/1 var(--f-cond);letter-spacing:.2em;text-transform:uppercase;margin-top:22px}
.order .eod{text-indent:0;text-align:center;font:600 12px/1 var(--f-mono);letter-spacing:.3em;color:var(--ink-3);margin-top:22px}
.order .sig{text-indent:0;text-align:right;font:italic 15px/1.4 var(--f-body);color:var(--ink-2)}
.order-act{margin-top:22px;justify-content:center}

/* duel */
.duel-arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.pad{border:1.5px solid var(--rule-strong);border-top:5px solid var(--pc);padding:10px 12px 12px;background:var(--paper);min-width:0}
.pad.p1{--pc:var(--t-code)} .pad.p2{--pc:var(--t-scotus)}
.pad-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.pad-h b{font:700 15px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.pad-h .score{font:700 26px/1 var(--f-mono)}
.pad .tiles{grid-template-columns:1fr;gap:8px}
.pad .tile{min-height:60px}
.pad.locked{opacity:.4}
.pad.locked .pad-h b::after{content:" — locked out";color:var(--bad)}
.pad .padprompt{display:none;font-size:15px;margin:0 0 10px}
.duel:focus{outline:none}
.duel.split .duel-arena{grid-template-columns:1fr}
.duel.split .pad.p2{transform:rotate(180deg);order:-1}
.duel.split .padprompt{display:block}
.duel.split .mainprompt{display:none}

/* modal, toast */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.55)}
.dialog{position:relative;background:var(--paper);border:1px solid var(--rule-strong);border-top:5px solid var(--margin);max-width:440px;width:100%;padding:18px 20px;box-shadow:var(--shadow)}
.dialog h2{font:700 20px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.dialog p{color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:max(18px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font:600 13px/1.3 var(--f-mono);padding:10px 14px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}

.empty{padding:20px 0}
.empty p{max-width:60ch}

@media (max-width:720px){
  .tiles{grid-template-columns:1fr}
  .trow{grid-template-columns:minmax(0,1fr) auto}
  .trow .tinfo{grid-column:1 / -1}
  .trow .tact{grid-column:1 / -1;justify-content:flex-end}
  .dk-h,.dk-row{grid-template-columns:34px minmax(0,1fr)}
  .dk-h .dt,.dk-row .dt{display:none}
  .call{grid-template-columns:1fr}
  .call .cnt{text-align:left}
  .cmap{flex-direction:column;gap:16px}
  .cmap li{max-width:none}
  .cmap li+li::before{left:26px;top:-14px;width:0;height:12px;border-top:0;border-left:2px solid var(--rule-strong)}
  .cmap li+li::after{left:22px;top:-6px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--rule-strong);border-bottom:0;margin:0}
  .duel-arena{grid-template-columns:1fr}
  .caption{font-size:13px;gap:0 8px}
  .order p{text-indent:1.2em}
}
@media (max-width:420px){
  .brand b{font-size:19px}
  .tfbtns .btn{font-size:17px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (prefers-reduced-motion: no-preference){
  .stamp{animation:thunk .28s ease-out}
  @keyframes thunk{from{transform:rotate(-2deg) scale(1.35);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
}

const CONTENT = {"asOf":"2026-11-12","builtAt":"2026-11-12T20:21:09.845Z","topics":[{"id":"automatic-stay","title":"The Automatic Stay & Stay Violations","tag":"Count the prior dismissals","pattern":"The petition is the stay (§ 362(a)): (a)(6) stops collection, (a)(3) stops grabbing estate property. Count prior dismissals in the last year: zero = full stay, one = a 30-day fuse you must extend with notice AND hearing finished before day 30 (§ 362(c)(3)), two or more = no stay until a court imposes one on a request made within 30 days (§ 362(c)(4)); in EDNC, file within 5 days to use the no-hearing track (LBR 4001-1(d)). When the stay is violated: § 362(k) supplies the money, Houck supplies the elements (violation + willful + injury), Lyle shows EDNC calls 'willful' an intentional act with knowledge of the stay, and Fulton warns that merely holding a car is not an (a)(3) violation.","chain":["usc-362a6","usc-362c3","lbr-4001-1d","usc-362k","case-houck","case-lyle"],"authIds":["usc-362a3","usc-362a6","usc-362b2","usc-362c3","usc-362c4","usc-362k","usc-1301","lbr-4001-1d","case-fulton","case-houck","case-lyle","case-goldman"],"group":"g1"},{"id":"stay-relief","title":"Relief from Stay","tag":"Cause, equity, clocks, 14 days","pattern":"Three doors out of the stay: (d)(1) cause (post-petition default, lapsed insurance, 'let them finish in state court' under Robbins), (d)(2) no equity AND not necessary, (d)(4) real-property schemes with a 2-year recorded tail. Burden splits under (g): the movant proves lack of equity, the debtor proves everything else. Clocks: (e)(1) 30 days, (e)(2) 60 days in individual cases; EDNC LBR 4001-1(c) adds itemize-the-default and state-your-consent-to-extend. The order itself waits 14 days under FRBP 4001(a)(4), renumbered from (a)(3) in the 2024 restyling. The tell: if the movant forgot to itemize, check the payment history before you check your calendar.","chain":["usc-362d1","usc-362g","frbp-9014","lbr-4001-1c","frbp-4001a4","case-robbins"],"authIds":["usc-362d1","usc-362d2","usc-362d4","usc-362e","usc-362g","usc-362b22","lbr-4001-1e","frbp-4001a4","frbp-9014","lbr-4001-1c","case-robbins","case-strumpf"],"group":"g1"},{"id":"adequate-protection-and-vehicles","title":"Adequate Protection & Pre-Confirmation Payments","tag":"Day 30, day 60, one percent","pattern":"Money moves before confirmation: § 1326(a)(1) starts payments 30 days after the EARLIER of plan or petition, with post-petition lease payments straight to the lessor and purchase-money adequate protection to the car lender. In EDNC, LBR 3070-1(c) routes that adequate protection through Trustee Staley at a presumptive 1% or more of petition-date value (trustee values it, trustee fee applies, nothing under $2,000 secured value). Day 60: proof of insurance (§ 1326(a)(4)). After confirmation, § 1325(a)(5)(B)(iii) keeps equal monthly payments big enough to adequately protect. Section 361 is the menu, § 363(e) is the creditor's lever, and Timbers is the ceiling: protect the collateral's value, not the creditor's time.","chain":["usc-1326a1","lbr-3070-1c","usc-1326a4","usc-361","case-timbers"],"authIds":["usc-1326a1","usc-1326a2","usc-1326a3","usc-1326a4","usc-361","usc-363e","usc-1325a5biii","lbr-3070-1c","frbp-4001d","case-timbers"],"group":"g1"},{"id":"claims-objections","title":"Proofs of Claim and Objections","tag":"Deemed allowed until you object","pattern":"Silence is consent: § 502(a) deems every filed claim allowed until someone objects, and Rule 3001(f) gives a rule-compliant claim prima facie weight. Your counter-moves are the § 502(b) grounds - (b)(1) unenforceable (stale debt) and (b)(9) late (past Rule 3002(c)'s 70 days) - delivered through Rule 3007's 30-day notice, served right. The tell: a debt-buyer claim whose Rule 3001(c) open-end statement shows a charge-off date from the last decade - Midland and Dubois say it's not an FDCPA claim, so it has to be an objection. EDNC has no claim-objection local rule; the service chart's 30 days tracks Rule 3007.","chain":["usc-502a","frbp-3001f","usc-502b","frbp-3007","case-midland"],"authIds":["usc-502a","usc-502b","frbp-3001c4","frbp-3001f","frbp-3002c","frbp-3004","lbr-3004-1","frbp-3007","frbp-3008","case-midland","case-raleigh","case-dubois"],"group":"g2"},{"id":"mortgage-claims-3002-1","title":"Home Mortgage Claims During the Case","tag":"Cure, maintain, and keep receipts","pattern":"Cure-and-maintain under § 1322(b)(5) only works if everyone agrees on the numbers, so the rules force the servicer to show its math at three checkpoints: the start (Form 410A under Rule 3001(c)(2)(C), due day 70 per Rule 3002(c)(6)), the middle (Rule 3002.1(b) payment-change notices 21 days ahead, (c) fee notices within 180 days, and since Dec. 1, 2025 the (f) motion to determine status), and the end ((g) trustee notice within 45 days, 28-day response, final-cure motion). Mnemonic: 21 - 180 - 45 - 28. Miss a step and (h) sanctions apply; EDNC LBR 3070-2 adds conduit and gap payments and a trustee (g)(4)(A) motion in conduit plans.","chain":["usc-1322b5","frbp-3001c2","frbp-3002-1b","lbr-3070-2","frbp-3002-1g"],"authIds":["usc-1322b5","usc-1322e","usc-506b","frbp-3001c2","frbp-3002c6","frbp-3002-1b","frbp-3002-1c","frbp-3002-1f","frbp-3002-1g","frbp-3002-1h","lbr-3070-2","case-rake"],"group":"g2"},{"id":"rule-2004-discovery","title":"Rule 2004 Exams and Discovery","tag":"Fish early, then follow rules","pattern":"Two doors to discovery. Before anything is pending, Rule 2004 is the wide-open fishing license - any party in interest, any entity, anything about the debtor's property, finances or (in Ch. 13) the source of plan money - enforced by a Rule 9016/Civil Rule 45 subpoena, and in EDNC the order may be granted ex parte (LBR 2004-1). Once a contested matter (a stay motion, a claim objection) or adversary proceeding is pending, the judge-made 'pending proceeding' rule shuts that door for related issues and you walk through Rule 9014(c)'s Part VII discovery rules instead. The tell: if there's already a docket entry about the dispute, it's 7026-7037, not 2004.","chain":["usc-343","frbp-2004b","frbp-2004c","lbr-2004-1","case-washingtonmutual"],"authIds":["usc-341","usc-343","frbp-2004b","frbp-2004c","lbr-2004-1","ednc-adminguide","frbp-9014c","frbp-7001","frbp-9016","case-washingtonmutual"],"group":"g2"},{"id":"sales-and-new-debt","title":"Selling Property and Incurring Debt in Chapter 13","tag":"Ask first, then sell or borrow","pattern":"Section 1306 keeps feeding the Ch. 13 estate (Carroll: even a year-three inheritance), § 1303 hands the debtor the trustee's § 363(b) and (f) sale powers, and Rule 6004 supplies the 21-day notice, 7-day objection deadline and 14-day stay - with § 363(m) protecting the good-faith buyer. Borrowing runs on a different track: Rule 4001(c) is out in Chapter 13, so § 1305(c) and EDNC LBR 4002-1(g) govern. The EDNC tell is the number $15,000: selling non-exempt equity over $15,000 (vested or not), borrowing $15,000 or more, or buying a $15,000+ item with non-exempt assets needs a court order - and a windfall sale may trigger a Murphy modification.","chain":["usc-1306","usc-1303","usc-363b","frbp-6004","lbr-4002-1g","case-murphy"],"authIds":["usc-363b","usc-363f","usc-363m","usc-1303","usc-1306","usc-1327b","usc-1305","frbp-6004","frbp-4001c3","lbr-4002-1g","case-murphy","case-carroll"],"group":"g2"},{"id":"confirmation","title":"Plan Confirmation","tag":"Floor, faith, feasible, filed","pattern":"Run § 1325(a) like a pre-flight checklist: FLOOR (Chapter 7 liquidation value, (a)(4)), FAITH (the plan, (a)(3), and the petition, (a)(7)), FEASIBLE ((a)(6)) and FILED-and-PAID (post-petition support and tax returns, (a)(8)-(9)), on top of § 1322(a)'s must-haves. Procedure runs Rule 3015(f) -\u003e E.D.N.C. LBR 3015-3: objections are due 7 days before the hearing, and if nobody objects the court can find good faith without evidence. The Fourth Circuit tests good faith by the totality of the circumstances (Deans, then Neufeld). The tell: once the order is entered, § 1327 binds everyone, and Espinosa says even a term that should never have been confirmed binds a creditor who got notice and did nothing.","chain":["usc-1325a3","frbp-3015","lbr-3015-3","case-deans","usc-1327","case-espinosa"],"authIds":["usc-1322a","usc-1324b","usc-1325a3","usc-1325a4","usc-1325a7","usc-1325a8","usc-1327","frbp-3015","lbr-3015-3","case-espinosa","case-deans","case-neufeld"],"group":"g3"},{"id":"disposable-income","title":"Disposable Income, Means Test & Social Security","tag":"CMI in, Social Security out","pattern":"Follow the money from § 101(10A) current monthly income (Social Security and, since the 2019 HAVEN Act, disability-related military/VA pay are OUT) to § 1325(b)(2) disposable income to the means-test deductions in § 707(b)(2) (mandatory for above-median debtors through § 1325(b)(3)) to § 1325(b)(1)(B) 'projected' disposable income (forward-looking under Lanning) to the § 1325(b)(4) applicable commitment period (a clock, not a dollar figure, under Pliler). The Fourth Circuit tell: Social Security stays out of projected disposable income but counts toward feasibility when it funds the plan (Ranta). And passing the means test is not a free pass on good faith (Goddard, 2026).","chain":["usc-101-10a","usc-1325b2","usc-707b2","case-lanning","case-ranta","case-pliler"],"authIds":["usc-101-10a","usc-1325b1","usc-1325b2","usc-1325b4","usc-1322d","usc-707b2","usc-1325a6","case-lanning","case-ransom","case-ranta","case-pliler","case-goddard"],"group":"g3"},{"id":"cramdown-vehicles","title":"Cramdown, Car Loans & the Hanging Paragraph","tag":"910 days or cram away","pattern":"Every car loan question runs through one fork: count the days. A PMSI on a personal-use vehicle incurred within 910 days before filing (or any PMSI collateral within 1 year) gets the hanging paragraph: § 506 is switched off, so to keep the car you pay the whole claim. Outside the window, § 506(a)(1) splits the claim, and § 506(a)(2) values the collateral at retail replacement value (Rash's idea, now codified). Then § 1325(a)(5) gives three doors: the creditor accepts, the debtor pays present value with the lien retained and equal monthly payments (Till's prime-plus rate), or the debtor surrenders. Surrender of a 910 car still leaves a contract-based deficiency (Kenney), which E.D.N.C. Local Form 113A § 3.6 cuts off unless the creditor amends its claim within 180 days after confirmation.","chain":["usc-1325a-hanging","usc-506a1","usc-506a2","usc-1325a5","case-till","lbr-form-113a"],"authIds":["usc-506a1","usc-506a2","usc-1325a5","usc-1325a5biii","usc-1325a-hanging","frbp-30151","lbr-form-113a","lbr-3070-1","usc-522f","case-rash","case-till","case-kenney"],"group":"g3"},{"id":"home-mortgage-and-liens","title":"Home Mortgages, Cure & Lien Stripping","tag":"Can't touch first, strip the zero","pattern":"Start with § 1322(b)(2): a claim secured only by the principal residence can't be modified, and Nobelman protects the whole claim if any part is secured. Then the exceptions: (b)(5) cure and maintain, (c)(1) cure until the home is sold at foreclosure (in NC, not until the 10-day upset-bid period ends: Barham, G.S. 45-21.27/.29A), and (c)(2) for loans maturing before the plan ends, which the en banc Fourth Circuit says CAN be bifurcated (Hurlburt). The zero-value tell: a lien with $0 of collateral behind it is unsecured under § 506(a), so Chapter 13 can strip it off, even in Chapter 20 (Davis). Chapter 7 can't do that under § 506(d) (Dewsnup, Caulkett).","chain":["usc-1322b2","case-nobelman","usc-1322b5","usc-1322c1","case-barham","case-davis"],"authIds":["usc-1322b2","usc-1322b5","usc-1322c1","usc-1322c2","usc-506d","case-nobelman","case-dewsnup","case-caulkett","case-hurlburt","case-davis","ncgs-45-21-27","case-barham"],"group":"g3"},{"id":"plan-modification","title":"Plan Modification","tag":"Big + surprise = bump","pattern":"Before confirmation the debtor alone edits the plan under § 1323; after confirmation § 1329(a) opens the door to the debtor, the trustee or an allowed unsecured claimholder, and Rule 3015(h) supplies the 21-day notice and Rule 9014 objection machinery. In the Fourth Circuit, Arnold and Murphy add the gatekeeper for a trustee or creditor who wants more money: show a substantial AND unanticipated post-confirmation change, or res judicata from confirmation wins. The tell: a raise or debt-free sale cash is 'Big + Surprise'; a loan is not income.","chain":["usc-1329a","frbp-3015h","case-arnold","case-murphy"],"authIds":["usc-1329a","usc-1329b","usc-1329c","usc-1323","usc-1306a","frbp-3015h","frbp-2002a5","lbr-4002-1","case-arnold","case-murphy","case-trantham"],"group":"g4"},{"id":"dismissal-conversion","title":"Dismissal, Conversion and Eligibility","tag":"Two keys, one knock","pattern":"The debtor holds two keys: § 1307(a) converts to Chapter 7 by notice (Rule 1017(f)(3), no order needed) and § 1307(b) dismisses on motion (Rule 1017(f)(2)); everyone else knocks under § 1307(c) 'for cause' as a Rule 9014 contested matter, and bad faith counts as cause (Purdy, an EDNC case). On the way into Chapter 7, § 348(f) freezes the estate at the petition date for a good-faith converter and Harris hands back undistributed wages, while bad faith flips the date (and Marrama shows bad faith can cost you a chapter). Gatekeepers on the front door: § 109(e) debt limits, § 109(g)'s 180-day bar, and the day-46 auto-dismissal of § 521(i) and LBR 1007-1(c).","chain":["usc-1307a","frbp-1017f","usc-348f","case-harris"],"authIds":["usc-1307a","usc-1307b","usc-1307c","usc-348f","usc-109e","usc-109g","usc-521i","frbp-1017f","lbr-1007-1","case-marrama","case-harris","case-purdy"],"group":"g4"},{"id":"discharge","title":"The Chapter 13 Discharge","tag":"Finish line, then the shield","pattern":"The finish line is § 1328(a): every plan payment made, the domestic-support certification, the § 1328(g) course (Rule 1007(b)(7) certificate; Rule 4004(c)(4) blocks discharge without it), the § 1328(h)/§ 522(q) finding, and no recent prior discharge under § 1328(f) (4 years after a 7, 2 years after a 13, measured to the new filing). Tell: the full-compliance Chapter 13 discharge excepts a shorter list than Chapter 7, so § 523(a)(6) property-damage claims and (a)(15) divorce property-settlement debts can go, while support, most student loans, fraud, unscheduled debts and drunk-driving injuries survive. After discharge, § 524(a)(2) is the shield, § 524(i) catches servicers who won't credit plan payments, and Taggart sets the contempt bar at 'no fair ground of doubt.'","chain":["usc-1328a","usc-1328g1","frbp-1007b7","frbp-4004c4"],"authIds":["usc-1328a","usc-1328b","usc-1328f","usc-1328g1","usc-1328h","usc-523a","usc-524a2","usc-524i","frbp-1007b7","frbp-4004c4","lbr-1016-1","case-taggart"],"group":"g4"},{"id":"exemptions-estate","title":"Property of the Estate and Exemptions","tag":"In, out, back, on time","pattern":"Ask three questions in order. IN: § 541(a)(1) takes everything as of filing (plus § 1306 in a 13). OUT before you start: § 541(c)(2) honors anti-alienation restrictions, so ERISA-qualified plans never enter (Patterson). BACK: § 522(b) lets you exempt, and North Carolina's § 1C-1601(f) opts out of the federal list, so it is G.S. 1C-1601(a) plus § 522(b)(3)(C) retirement funds (but Clark says inherited IRAs aren't 'retirement funds'; NC's (a)(9) separately covers them). Then the clock: § 522(l) and Rule 4003(b)(1) give 30 days after the § 341 meeting concludes (EDNC LBR 4003-1(b): extension motion before it runs). Taylor: miss it and the exemption stands; Schwab: the clock only protects the dollar amount you claimed (write '100% of FMV' if you mean it); Law v. Siegel: no court-made exceptions.","chain":["usc-522b","ncgs-1c-1601","usc-522l","frbp-4003b1","case-taylor"],"authIds":["usc-541a1","usc-541c2","usc-522b","ncgs-1c-1601","usc-522l","frbp-4003b1","lbr-4003-1","case-patterson","case-schwab","case-law","case-clark","case-taylor"],"group":"g4"}],"authorities":{"usc-362a3":{"id":"usc-362a3","type":"code","cite":"11 U.S.C. § 362(a)(3)","short":"No grabbing estate property","holding":"The petition stays any act to obtain possession of property of the estate or of property from the estate, or to exercise control over property of the estate.","why":"It is the provision a debtor invokes when a lender or landlord goes after the house, the car or the bank account after filing.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12 (uscode.house.gov current through Pub. L. 119-138). Note: Pub. L. 119-27 (GENIUS Act, July 18, 2025) will add stablecoin-redemption provisions as § 362(a)(9) and (d)(5) effective on the earlier of Jan. 18, 2027 or 120 days after final implementing regulations; they do not affect consumer cases.","group":"g1"},"usc-362a6":{"id":"usc-362a6","type":"code","cite":"11 U.S.C. § 362(a)(6)","short":"No collecting prepetition claims","holding":"The petition stays any act to collect, assess, or recover a claim against the debtor that arose before the commencement of the case.","why":"Post-petition calls, letters and invoices on prepetition debts are (a)(6) violations and the usual starting point for a § 362(k) motion.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362b2":{"id":"usc-362b2","type":"code","cite":"11 U.S.C. § 362(b)(2)(A)(iv), (b)(2)(B)","short":"Divorce and support carve-outs","holding":"The stay does not bar a proceeding for dissolution of a marriage except to the extent it seeks to determine the division of property that is property of the estate ((b)(2)(A)(iv)), nor the collection of a domestic support obligation from property that is not property of the estate ((b)(2)(B)).","why":"The ex can finish the divorce and collect support from non-estate property without a motion, but dividing estate property (equitable distribution) still needs stay relief.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://govinfo.gov/link/uscode/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362c3":{"id":"usc-362c3","type":"code","cite":"11 U.S.C. § 362(c)(3)","short":"One prior dismissal: 30-day stay","holding":"If an individual debtor had a Chapter 7, 11 or 13 case pending within the preceding year that was dismissed, the stay as to actions on a debt, property securing it, or a lease terminates 'with respect to the debtor' on the 30th day after the new filing unless, on a party in interest's motion, the court extends it 'after notice and a hearing completed before the expiration of the 30-day period' on a showing that the case was filed in good faith as to the creditors to be stayed (bad faith is presumed in listed situations, such as a prior dismissal for failure to perform a confirmed plan, rebuttable by clear and convincing evidence).","why":"Every refiling within a year needs a motion to extend calendared and decided before day 30; § 362(j) lets a creditor get an order confirming that the stay terminated.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362","https://www.ca5.uscourts.gov/Opinions/pub/19/19-50598.0.pdf","https://www.rib.uscourts.gov/news/first-circuit-court-appeals-holds-bankruptcy-stay-protections-limited-repeat-filers?page=3","https://www.legal500.com/intelligence/united-states/insolvency-bankruptcy-re-structuring/section-362(c)(3)(a)-a-textual-dumpster-fire-for-serial-filers","https://www.nmb.uscourts.gov/sites/default/files/opinions/20.11513.40.pdf"],"status":"current text as of 2026-11-12. Note: courts are split on whether (c)(3)(A) ends the stay as to estate property. The minority view, led by the First Circuit, says the whole stay ends (Smith v. Me. Bureau of Revenue Servs. (In re Smith), 910 F.3d 576 (1st Cir. 2018)); the majority view, adopted by the Fifth Circuit, says it ends only 'with respect to the debtor' and estate property stays protected (Rose v. Select Portfolio Servicing, Inc., 945 F.3d 226 (5th Cir. 2019)). No Fourth Circuit decision on the question was located as of 2026-11-12.","group":"g1"},"usc-362c4":{"id":"usc-362c4","type":"code","cite":"11 U.S.C. § 362(c)(4)","short":"Two-plus dismissals: no stay","holding":"If two or more of an individual debtor's cases were pending within the preceding year and dismissed, the stay does not go into effect on the new filing (and on request the court must promptly enter an order confirming no stay is in effect); if a party in interest asks within 30 days after the filing, the court may impose the stay after notice and a hearing on a showing of good faith as to the creditors to be stayed, effective on the date the order is entered.","why":"For the third-filing client, nothing protects the house until the order imposing the stay is entered, so the motion goes in with the petition.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362k":{"id":"usc-362k","type":"code","cite":"11 U.S.C. § 362(k)","short":"Damages for willful violations","holding":"An individual injured by any willful violation of the stay shall recover actual damages, including costs and attorneys' fees, and in appropriate circumstances may recover punitive damages; if the violation rested on a good-faith belief that § 362(h) applied, recovery against that entity is limited to actual damages.","why":"It is the fee-shifting remedy behind every stay-violation motion and the leverage in a demand letter.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-1301":{"id":"usc-1301","type":"code","cite":"11 U.S.C. § 1301","short":"Chapter 13 co-debtor stay","holding":"After a Chapter 13 order for relief, a creditor may not act or sue to collect a consumer debt of the debtor from an individual liable on the debt with the debtor or who secured it (unless that individual became liable in the ordinary course of business, or the case is closed, dismissed or converted to Chapter 7 or 11); the court shall grant relief under § 1301(c) to the extent the co-debtor received the consideration, the plan proposes not to pay the claim, or the creditor would be irreparably harmed; and a § 1301(c)(2) request terminates the co-debtor stay 20 days after it is filed unless the debtor or co-debtor files and serves a written objection (§ 1301(d)).","why":"It protects Mom the cosigner on a consumer debt, but only while the plan pays the debt, so the plan treatment drives co-debtor relief.","sources":["https://www.law.cornell.edu/uscode/text/11/1301","https://govinfo.gov/link/uscode/11/1301"],"status":"current text as of 2026-11-12","group":"g1"},"lbr-4001-1d":{"id":"lbr-4001-1d","type":"local","cite":"E.D.N.C. LBR 4001-1(d)","short":"EDNC motion to extend/impose stay","holding":"The court may, in its discretion, rule without a hearing on a motion to continue (§ 362(c)(3)(B)) or impose (§ 362(c)(4)(B)) the stay if the debtor files it within 5 days of the petition date, no party in interest objects, it includes a notice of motion and the debtor's affidavit or 28 U.S.C. § 1746 declaration with sufficient facts, it and the supporting papers are served on all creditors and the trustee at the time of filing, and the movant emails the judge's designated courtroom-staff address so the motion can be referred immediately.","why":"It is the EDNC fast track that gets a repeat filer's stay extended without burning a hearing date before day 30.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/local%20rules%2012-1-23_0.pdf","https://www.courtrules.net/courts/federal/bankruptcy-eastern-district-north-carolina/local-rules/rule-4001-1"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026); same substance as the Dec. 1, 2023 version","group":"g1"},"case-fulton":{"id":"case-fulton","type":"scotus","cite":"City of Chicago v. Fulton, 592 U.S. 154 (2021)","short":"Mere retention isn't (a)(3) violation","holding":"Mere retention of estate property after the filing of a bankruptcy petition (the City holding vehicles impounded before filing) does not violate § 362(a)(3); the Court did not settle the meaning of other § 362(a) subsections or decide how the § 542 turnover obligation operates.","why":"When a lender won't give back a car it took before filing, the path is a turnover demand and motion, not a § 362(k) motion built on (a)(3) alone.","sources":["https://www.supremecourt.gov/opinions/preliminaryprint/592US1PP_web.pdf","https://supreme.justia.com/cases/federal/us/592/19-357/","https://www.supremecourt.gov/opinions/slipopinion/20"],"status":"good law as of 2026-11-12 (8-0, Alito, J.; Sotomayor, J., concurring; Barrett, J., not participating)","group":"g1"},"case-houck":{"id":"case-houck","type":"4th","cite":"Houck v. Substitute Trustee Services, Inc., 791 F.3d 473 (4th Cir. 2015)","short":"4th Cir.: § 362(k) elements","holding":"To recover under § 362(k) a plaintiff must show (1) that the defendant violated the § 362(a) stay, (2) that the violation was willful, and (3) that the plaintiff was injured; a foreclosure sale held four days after the petition, with notice of it given to the substitute trustee through its attorneys, was sufficiently alleged as a willful violation (no particular form of notice is required), and the district court had subject-matter jurisdiction over the § 362(k) claim.","why":"It is the Fourth Circuit's three-element checklist to plead and prove in any stay-violation motion or adversary.","sources":["https://www.ca4.uscourts.gov/opinions/132326.p.pdf","https://www.ncmb.uscourts.gov/sites/default/files/opinions/Swaim%20-%20order%20denying%20sanctions.pdf","https://hallapproved.com/us/cases/ca4/2015/2813708"],"status":"good law as of 2026-11-12 (cited for the § 362(k) elements in In re Swaim, No. 25-50593 (Bankr. M.D.N.C. May 27, 2026))","group":"g1"},"case-lyle":{"id":"case-lyle","type":"ednc","cite":"In re Lyle, 662 B.R. 229 (Bankr. E.D.N.C. 2024)","short":"EDNC: invoices after notice = willful","holding":"A creditor that kept mailing monthly invoices on a $278.40 prepetition debt after case notices and three letters from debtor's counsel willfully violated the stay (willfulness requires only an intentional act with knowledge of the stay, not specific intent), but the court awarded only $325 in damages to the estate plus $1,250 of the $4,315 in fees requested and denied punitive damages because the conduct was not egregious, vindictive or intentional misconduct.","why":"It calibrates expectations for EDNC sanctions motions: willfulness is easy to prove, but fee awards track the seriousness of the violation.","sources":["https://bkinformation.com/NewCases/CaseCopies/Lyle-6-23-24.pdf","https://leagle.com/decision/inbco20240624617","https://www.ncmb.uscourts.gov/sites/default/files/opinions/Swaim%20-%20order%20denying%20sanctions.pdf"],"status":"good law as of 2026-11-12 (Callaway, J., Greenville Div., order entered June 21, 2024). Note: its willfulness formula traces to the Fourth Circuit's In re Strumpf opinion, which the Supreme Court reversed on the setoff issue (516 U.S. 16 (1995)).","group":"g1"},"case-goldman":{"id":"case-goldman","type":"4th","cite":"Goldman Sachs Bank USA v. Brown, No. 25-1439 (4th Cir. Mar. 18, 2026), cert. granted, No. 25-1408 (U.S. Nov. 6, 2026)","short":"4th Cir.: § 362(k) claims stay in court","holding":"The Fourth Circuit affirmed denial of a card issuer's motion to compel arbitration of debtors' § 362(k) stay-violation claims (a putative class adversary proceeding from W.D. Va.), treating the claims as core and that arbitration 'would interfere and conflict with the strong and established policies and purposes of the Bankruptcy Code.'","why":"When a card issuer answers your § 362(k) claim with an arbitration clause, this is the controlling Fourth Circuit answer for now.","sources":["https://www.ca4.uscourts.gov/opinions/251439.p.pdf","https://nclawyersweekly.com/2026/03/26/automatic-stay-claims-remain-in-bankruptcy-court-despite-arbitration-clause/","https://www.supremecourt.gov/docket/docketfiles/html/public/25-1408.html","https://scotusblog.com/2026/11/supreme-court-agrees-to-weigh-in-on-goldman-sachs-arbitration-dispute/"],"status":"note: binding in the Fourth Circuit as of 2026-11-12, but the Supreme Court granted certiorari on Nov. 6, 2026 (No. 25-1408); the case will likely be argued and decided in 2027, so check its status before relying on it. Split panel (Niemeyer, J., with Harris, J.; King, J., dissenting).","group":"g1"},"usc-362d1":{"id":"usc-362d1","type":"code","cite":"11 U.S.C. § 362(d)(1)","short":"Stay relief for cause","holding":"On request of a party in interest and after notice and a hearing, the court shall grant relief from the stay for cause, including the lack of adequate protection of an interest in property of that party in interest.","why":"Post-petition mortgage or HOA defaults, lapsed insurance, and requests to finish litigation elsewhere are all argued as 'cause' under this paragraph.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://govinfo.gov/link/uscode/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362d2":{"id":"usc-362d2","type":"code","cite":"11 U.S.C. § 362(d)(2)","short":"No equity and not necessary","holding":"Relief from the stay of an act against property is granted if the debtor does not have an equity in the property and the property is not necessary to an effective reorganization.","why":"The underwater rental or second car the plan does not need is the classic (d)(2) target; both prongs must be met.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362d4":{"id":"usc-362d4","type":"code","cite":"11 U.S.C. § 362(d)(4)","short":"In rem relief: real-property schemes","holding":"A creditor secured by real property gets relief if the court finds the petition was part of a scheme to delay, hinder, or defraud creditors involving either a transfer of an interest in the property without the secured creditor's consent or court approval, or multiple bankruptcy filings affecting the property; if recorded under state law, the order binds any other case purporting to affect that property filed within 2 years, subject to a debtor's motion in the later case based on changed circumstances or good cause.","why":"An in rem order recorded in the New Hanover County registry follows the house into the next filing, even one by a different debtor.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362e":{"id":"usc-362e","type":"code","cite":"11 U.S.C. § 362(e)","short":"30-day and 60-day stay clocks","holding":"Under § 362(e)(1) the stay terminates as to the movant 30 days after a § 362(d) request unless the court, after notice and a hearing, orders it continued (on a reasonable likelihood the opposing party will prevail), with a final hearing concluded within 30 days after any preliminary hearing absent consent or compelling circumstances; under § 362(e)(2), in an individual's Chapter 7, 11 or 13 case the stay terminates 60 days after the request unless a final decision is rendered within that period or it is extended by agreement of all parties in interest or by the court for good cause.","why":"If no one gets a hearing or a consent on the record, the stay can lapse by operation of law while the motion sits.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362g":{"id":"usc-362g","type":"code","cite":"11 U.S.C. § 362(g)","short":"Burden of proof split","holding":"In a hearing under § 362(d) or (e), the party requesting relief has the burden of proof on the issue of the debtor's equity in property, and the party opposing relief has the burden of proof on all other issues.","why":"Once the servicer shows the default, it is your client who must prove adequate protection, cure, or that the property is needed.","sources":["https://www.law.cornell.edu/uscode/text/11/362","https://govinfo.gov/link/uscode/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"usc-362b22":{"id":"usc-362b22","type":"code","cite":"11 U.S.C. § 362(b)(22), (l)","short":"Pre-petition eviction judgment exception","holding":"Subject to § 362(l), the stay does not bar continuation of an eviction or similar proceeding by a lessor against a debtor tenant of residential property if the lessor obtained a judgment for possession before the petition; under § 362(l) the exception is held off for 30 days if the debtor files and serves a certification that nonbankruptcy law permits cure of the entire monetary default and that rent coming due during the 30 days has been deposited with the clerk, and is avoided if the debtor further certifies the cure within that period, with any lessor objection heard within 10 days.","why":"A summary ejectment judgment from the magistrate before filing means the tenant-client must certify and deposit at filing or the landlord proceeds without a motion.","sources":["https://uscode.house.gov/us/usc/119-138/t11/s362/","https://govinfo.gov/link/uscode/11/362","https://www.law.cornell.edu/uscode/text/11/362"],"status":"current text as of 2026-11-12","group":"g1"},"lbr-4001-1e":{"id":"lbr-4001-1e","type":"local","cite":"E.D.N.C. LBR 4001-1(e)","short":"EDNC eviction certifications and deposit","holding":"The § 362(l)(1)(A) certification is made on Form B 101A filed with the clerk together with a copy of the prepetition judgment for possession, the follow-up certification is made on Form B 101B, and any rent deposit must be a certified check or money order payable to the lessor delivered to the clerk when the petition is filed, which the clerk sends to the lessor by certified mail, return receipt requested, at the address on the petition.","why":"Bring the money order payable to the landlord, not the clerk, to the filing, or the § 362(l) protection is lost.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.courtrules.net/courts/federal/bankruptcy-eastern-district-north-carolina/local-rules/rule-4001-1"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026)","group":"g1"},"frbp-4001a4":{"id":"frbp-4001a4","type":"rule","cite":"Fed. R. Bankr. P. 4001(a)(4)","short":"14-day stay of relief order","holding":"Unless the court orders otherwise, an order granting a motion for relief from the automatic stay is stayed for 14 days after it is entered.","why":"Watch for a requested 'waiver of the 14-day stay' in every proposed order; it is the window to seek reconsideration or a stay pending appeal.","sources":["https://www.law.cornell.edu/rules/frbp/rule_4001","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-app-federalru-rule4001.htm","https://www.gamb.uscourts.gov/USCourts/news/citing-frbp-4001-stay-order-granting-relief-automatic-stay"],"status":"current text as of 2026-11-12. Note: before the Dec. 1, 2024 restyling this was Rule 4001(a)(3); the restyling was stylistic only. Not amended effective Dec. 1, 2025 or Dec. 1, 2026.","group":"g1"},"frbp-9014":{"id":"frbp-9014","type":"rule","cite":"Fed. R. Bankr. P. 9014 (with Rule 4001(a)(1))","short":"Stay motions are contested matters","holding":"Relief in a contested matter must be requested by motion with reasonable notice and an opportunity to be heard, served in the manner of a summons under Rule 7004, with listed Part VII rules (including discovery Rules 7026 and 7028-7037) applying and testimony on disputed material facts taken as in an adversary proceeding; Rule 4001(a)(1) requires a § 362(d) motion to comply with Rule 9014.","why":"It is why you can serve discovery or depose the servicer's witness in a contested stay fight, and why the motion must be served the way a summons is under Rule 7004.","sources":["https://www.law.cornell.edu/rules/frbp/rule_9014","https://www.law.cornell.edu/rules/frbp/rule_4001","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-app-federalru-rule4001.htm","https://www.supremecourt.gov/orders/courtorders/frbk26_o7jp.pdf","https://www.almb.uscourts.gov/news/upcoming-rule-form-and-fee-changes-december-1-2026?page=1"],"status":"note: current text (restyled eff. Dec. 1, 2024) as of 2026-11-12; an amendment approved by the Supreme Court on Apr. 8, 2026 takes effect Dec. 1, 2026, letting the court, 'for cause and with appropriate safeguards,' permit testimony in open court by contemporaneous transmission from a different location (Rule 9014(d)(1)); Rules 9017 and new 7043 change the same day.","group":"g1"},"lbr-4001-1c":{"id":"lbr-4001-1c","type":"local","cite":"E.D.N.C. LBR 4001-1(c)","short":"EDNC stay-relief motion rules","holding":"A secured creditor seeking relief for a post-petition default must say so in the motion and itemize each past-due amount with specificity; if no response is filed the court may grant the motion without a hearing; a responding debtor must comply with LBR 9014-1(f); on the debtor's request the creditor must promptly send the payment history to debtor's counsel by electronic, fax or other expedited means; and the movant and any respondent must state in the body of their filing whether they consent to extending the § 362(e)(1) 30-day period without a hearing ((c)(3)).","why":"Demand the payment history the day the motion lands, and remember that silence means the order can enter without a hearing.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/local%20rules%2012-1-23_0.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf","https://www.courtrules.net/courts/federal/bankruptcy-eastern-district-north-carolina/local-rules/rule-4001-1","https://www.nceb.uscourts.gov/node/12523"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026). Note: paragraph (c)(3), the § 362(e)(1) consent statement, came in the 2026 comprehensive review (proposed Aug. 27, 2026); the Dec. 1, 2023 rules had only (c)(1)-(2).","group":"g1"},"case-robbins":{"id":"case-robbins","type":"4th","cite":"Robbins v. Robbins (In re Robbins), 964 F.2d 342 (4th Cir. 1992)","short":"4th Cir.: let state court finish","holding":"Whether to lift the stay so litigation can proceed in another forum is within the bankruptcy court's discretion (reviewed for abuse of discretion) and turns on balancing prejudice to the estate against hardship to the movant, considering whether the issues involve only state law, whether relief promotes judicial economy, and whether the estate can be protected by requiring enforcement of any judgment through the bankruptcy court; in that Chapter 11 case the court affirmed § 362(d)(1) relief so a Florida court could finish an ex-wife's equitable-distribution case, with the bankruptcy court retaining claim allowance.","why":"It is the Fourth Circuit test when an ex-spouse, a personal-injury plaintiff, or an HOA wants to finish a state-court case against your client.","sources":["https://law.justia.com/cases/federal/appellate-courts/F2/964/342/341543/","https://www.ncmb.uscourts.gov/sites/default/files/opinions/20-50632%20Northwest%20-%20Deny%20RFS.pdf","https://www.ncmb.uscourts.gov/sites/default/files/opinions/Tedesco.PDF"],"status":"good law as of 2026-11-12 (applied in In re Northwest Child Development Centers (Bankr. M.D.N.C. Dec. 17, 2020))","group":"g1"},"case-strumpf":{"id":"case-strumpf","type":"scotus","cite":"Citizens Bank of Maryland v. Strumpf, 516 U.S. 16 (1995)","short":"Temporary account hold isn't setoff","holding":"A bank's temporary administrative hold on a debtor's deposit account, kept only while it sought § 362(d) relief to exercise its setoff right, was not a setoff violating § 362(a)(7) and did not violate § 362(a)(3) or (a)(6).","why":"When the client's credit union freezes the checking account to protect a car-loan setoff, the question is whether it promptly moved for relief, not whether the freeze is per se a violation.","sources":["https://www.law.cornell.edu/supremecourt/text/516/16","https://law.resource.org/pub/us/case/reporter/US/516/516.US.16.94-1340.html"],"status":"good law as of 2026-11-12 (unanimous, Scalia, J.); it reversed the Fourth Circuit's decision at 37 F.3d 155.","group":"g1"},"usc-1326a1":{"id":"usc-1326a1","type":"code","cite":"11 U.S.C. § 1326(a)(1)","short":"Pre-confirmation payments start day 30","holding":"Unless the court orders otherwise, a Chapter 13 debtor must commence payments not later than 30 days after the earlier of the plan filing or the order for relief: (A) the proposed plan payment to the trustee, (B) scheduled post-petition personal-property lease payments directly to the lessor, and (C) adequate-protection payments directly to a creditor holding a purchase-money claim secured by personal property, with the trustee payment reduced by the (B) and (C) amounts and proof of payment provided to the trustee.","why":"It sets the first-payment deadline and decides where car-lease and car-loan money goes before confirmation.","sources":["https://www.law.cornell.edu/uscode/text/11/1326","https://govinfo.gov/link/uscode/11/1326"],"status":"current text as of 2026-11-12","group":"g1"},"usc-1326a2":{"id":"usc-1326a2","type":"code","cite":"11 U.S.C. § 1326(a)(2)","short":"Trustee holds pre-confirmation funds","holding":"The trustee retains payments made under § 1326(a)(1)(A) until confirmation or denial of confirmation; if a plan is confirmed the trustee distributes them under the plan as soon as practicable, and if confirmation is denied the trustee returns them to the debtor after deducting any unpaid claim allowed under § 503(b).","why":"It answers the client who asks whether the money comes back when an unconfirmed case is dismissed, and why your allowed § 503(b) fee comes out first.","sources":["https://www.law.cornell.edu/uscode/text/11/1326","https://govinfo.gov/link/uscode/11/1326"],"status":"current text as of 2026-11-12","group":"g1"},"usc-1326a3":{"id":"usc-1326a3","type":"code","cite":"11 U.S.C. § 1326(a)(3)","short":"Court may change interim payments","holding":"Subject to § 363, the court may, upon notice and a hearing, modify, increase, or reduce the payments required under § 1326(a) pending confirmation of a plan.","why":"It is the vehicle for a car lender asking for bigger pre-confirmation payments, or for a debtor asking for smaller ones.","sources":["https://www.law.cornell.edu/uscode/text/11/1326","https://govinfo.gov/link/uscode/11/1326"],"status":"current text as of 2026-11-12","group":"g1"},"usc-1326a4":{"id":"usc-1326a4","type":"code","cite":"11 U.S.C. § 1326(a)(4)","short":"Proof of insurance within 60 days","holding":"Not later than 60 days after the filing of the case, a debtor retaining possession of personal property subject to a lease or securing a purchase-money claim must provide the lessor or secured creditor reasonable evidence of the maintenance of any required insurance coverage, and must continue to do so for as long as the debtor retains possession.","why":"A lapsed policy on a financed vehicle is the fastest route to a lack-of-adequate-protection motion, so calendar the 60-day proof.","sources":["https://www.law.cornell.edu/uscode/text/11/1326","https://govinfo.gov/link/uscode/11/1326"],"status":"current text as of 2026-11-12","group":"g1"},"usc-361":{"id":"usc-361","type":"code","cite":"11 U.S.C. § 361","short":"Three ways to protect","holding":"When adequate protection is required under § 362, 363 or 364, it may be provided by (1) a cash payment or periodic cash payments, (2) an additional or replacement lien, to the extent the stay, use, sale, lease or lien grant decreases the value of the entity's interest, or (3) other relief, other than an administrative expense, that will result in realization of the 'indubitable equivalent' of the entity's interest.","why":"It is the menu you choose from when negotiating a consent order with a car lender or a mortgage servicer.","sources":["https://www.law.cornell.edu/uscode/text/11/361","https://www.govinfo.gov/link/uscode/11/361"],"status":"current text as of 2026-11-12 (last amended 1984)","group":"g1"},"usc-363e":{"id":"usc-363e","type":"code","cite":"11 U.S.C. § 363(e), (p)(1)","short":"Condition use on adequate protection","holding":"At any time, on request of an entity with an interest in property used, sold, or leased (or proposed to be), the court, with or without a hearing, shall prohibit or condition such use, sale, or lease as is necessary to provide adequate protection of that interest, and under § 363(p)(1) the trustee has the burden of proof on the issue of adequate protection.","why":"It is the creditor's alternative to stay relief: keep the car in the driveway, but only with insurance and payments.","sources":["https://www.law.cornell.edu/uscode/text/11/363","https://govinfo.gov/link/uscode/11/363"],"status":"current text as of 2026-11-12","group":"g1"},"usc-1325a5biii":{"id":"usc-1325a5biii","type":"code","cite":"11 U.S.C. § 1325(a)(5)(B)(iii)","short":"Equal payments, adequately protective","holding":"If a plan distributes property to an allowed secured claim in periodic payments, the payments must be in equal monthly amounts, and if the claim is secured by personal property, the amount must be not less than an amount sufficient to provide the holder adequate protection during the period of the plan.","why":"It carries the adequate-protection floor from the pre-confirmation period into the confirmed plan's car-claim treatment.","sources":["https://www.law.cornell.edu/uscode/text/11/1325","https://govinfo.gov/link/uscode/11/1325"],"status":"current text as of 2026-11-12","group":"g1"},"lbr-3070-1c":{"id":"lbr-3070-1c","type":"local","cite":"E.D.N.C. LBR 3070-1(c)","short":"EDNC: 1% AP through trustee","holding":"Post-petition personal-property lease payments are paid directly to the lessor; unless the plan pays the entire secured claim directly, pre-confirmation adequate protection on purchase-money personal-property claims is paid through the trustee, presumptively at least 1% of the collateral's petition-date value (the rule states no payment period) (amount in the trustee's discretion, with the trustee alone valuing the collateral subject to further court consideration), subject to the trustee's statutory percentage fee, sent to the proof-of-claim address, disbursed on the trustee's regular monthly schedule, and not required on a claim whose secured value is less than $2,000.00.","why":"It is how Trustee Staley's office actually pays car lenders before confirmation, and why the trustee need not pay anything before confirmation on a $1,500 lawn tractor.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/local%20rules%2012-1-23_0.pdf"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026; same substance as the Dec. 1, 2023 version)","group":"g1"},"frbp-4001d":{"id":"frbp-4001d","type":"rule","cite":"Fed. R. Bankr. P. 4001(d)","short":"Approving AP / stay agreements","holding":"A motion to approve an agreement to provide adequate protection, to prohibit or condition the use, sale or lease of property, or to modify or terminate the § 362 stay must be accompanied by the agreement and a proposed order; unless the court sets another time, objections are due 14 days after the notice is mailed, the court may rule without a hearing if none is filed, and an objection requires a hearing on at least 7 days' notice.","why":"It is the procedure behind a negotiated consent order resolving a car lender's or servicer's motion.","sources":["https://www.law.cornell.edu/rules/frbp/rule_4001","https://www.govinfo.gov/content/pkg/USCODE-2024-title11/html/USCODE-2024-title11-app-federalru-rule4001.htm"],"status":"current text as of 2026-11-12 (restyled eff. Dec. 1, 2024; stylistic only)","group":"g1"},"case-timbers":{"id":"case-timbers","type":"scotus","cite":"United Savings Ass'n of Texas v. Timbers of Inwood Forest Associates, Ltd., 484 U.S. 365 (1988)","short":"No interest for delay","holding":"An undersecured creditor is not entitled under § 362(d)(1) to compensation (interest on its collateral) for the delay in foreclosing caused by the stay, because the protected 'interest in property' does not include a right to immediate foreclosure; and under § 362(d)(2), property is necessary to an effective reorganization only if there is 'a reasonable possibility of a successful reorganization within a reasonable time.'","why":"Adequate protection guards against decline in the collateral's value, not the lender's lost time, so 'pay us interest pre-confirmation' is not a § 361 demand.","sources":["https://supreme.justia.com/cases/federal/us/484/365/","https://www.law.cornell.edu/supremecourt/text/484/365"],"status":"good law as of 2026-11-12 (unanimous, Scalia, J.)","group":"g1"},"usc-502a":{"id":"usc-502a","type":"code","cite":"11 U.S.C. § 502(a)","short":"Filed claim is deemed allowed","holding":"A claim, proof of which is filed under § 501, is deemed allowed unless a party in interest objects.","why":"If nobody objects, the debt buyer's claim gets paid from your client's plan - silence is consent.","sources":["https://www.law.cornell.edu/uscode/text/11/502","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapI-sec502.htm"],"status":"current text as of 2026-11-12","group":"g2"},"usc-502b":{"id":"usc-502b","type":"code","cite":"11 U.S.C. § 502(b)(1), (b)(9)","short":"Grounds to disallow: unenforceable, late","holding":"On objection, the court determines the claim as of the petition date and disallows it to the extent it is unenforceable against the debtor under any agreement or applicable law (b)(1), or its proof was not timely filed except as the Code or Rules permit, with governmental units given 180 days after the order for relief (b)(9).","why":"These are the two workhorse grounds for objecting to stale debt-buyer claims and claims filed after the bar date.","sources":["https://www.law.cornell.edu/uscode/text/11/502","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapI-sec502.htm"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3001c4":{"id":"frbp-3001c4","type":"rule","cite":"Fed. R. Bankr. P. 3001(c)(4) (becomes 3001(c)(3) on Dec. 1, 2026)","short":"Open-end credit claim statement","holding":"A claim based on an open-end or revolving consumer credit agreement (other than one secured by the debtor's real property) must be accompanied by a statement of the entity from whom the creditor bought the account, the entity owed at the last transaction, the last transaction date, the last payment date, and the charge-off date; on written request the creditor must send a copy of the writing within 30 days after the request is sent.","why":"Debt-buyer credit card claims missing this statement are the classic objection target - and the charge-off and last-payment dates tell you whether the debt is stale.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3001","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3001","https://www.supremecourt.gov/orders/courtorders/frbk26_o7jp.pdf","https://cdn.considerchapter13.org/content/uploads/2026/07/17200441/Rule-amendment-article.pdf"],"status":"note: current text as of 2026-11-12 is (c)(4); the Supreme Court-approved amendment effective Dec. 1, 2026 (absent congressional action) swaps (c)(3) and (c)(4), so this becomes (c)(3) and the sanctions paragraph becomes (c)(4) reaching all of (c).","group":"g2"},"frbp-3001f":{"id":"frbp-3001f","type":"rule","cite":"Fed. R. Bankr. P. 3001(f)","short":"Proper claim is prima facie evidence","holding":"A proof of claim signed and filed in accordance with the rules is prima facie evidence of the claim's validity and amount.","why":"A rule-compliant claim wins unless your objection brings evidence; a claim that skipped the required attachments has a weaker footing.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3001","https://www.courtrules.net/federal/bankruptcy-procedure/rule-3001"],"status":"current text as of 2026-11-12","group":"g2"},"frbp-3002c":{"id":"frbp-3002c","type":"rule","cite":"Fed. R. Bankr. P. 3002(c)","short":"70-day claims bar date","holding":"In a voluntary Chapter 7, 12 or 13 case a proof of claim is timely if filed within 70 days after the order for relief (or the conversion order), subject to listed exceptions including 180 days for governmental units (c)(1), the principal-residence mortgage rule (c)(6), and a court extension of no more than 60 days when notice was ins
