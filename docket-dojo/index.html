law.vlex.com/vid/in-re-barham-bankruptcy-892749487"],"status":"note: EDNC bankruptcy court decision (Small, C.J., Mar. 1996), persuasive rather than binding on other judges. The opinion quotes the then-current 10% upset-bid increment; the current statute uses 5% with a $750 minimum, and the 10-day period is unchanged. No contrary authority found, but later treatment was not exhaustively checked.","group":"g3"},"usc-1329a":{"id":"usc-1329a","type":"code","cite":"11 U.S.C. § 1329(a)","short":"Post-confirmation modification: who and what","holding":"After confirmation and before payments are completed, the plan may be modified on request of the debtor, the trustee, or the holder of an allowed unsecured claim to increase or reduce payments on a class, extend or reduce the time for payments, adjust a creditor's distribution for payments made outside the plan, or reduce payments by the debtor's documented health-insurance cost.","why":"It is the only door for the classic trustee 'you got a raise' motion and for a client's job-loss motion to lower or stretch payments.","sources":["https://www.law.cornell.edu/uscode/text/11/1329","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1329.htm","https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title11-section1329&num=0&edition=prelim"],"status":"note: current text as of 2026-11-12; the temporary CARES Act § 1329(d) no longer appears in the text","group":"g4"},"usc-1329b":{"id":"usc-1329b","type":"code","cite":"11 U.S.C. § 1329(b)","short":"Modified plan must still confirm","holding":"Sections 1322(a), 1322(b), 1323(c) and the requirements of § 1325(a) apply to a modification, and the plan as modified becomes the plan unless, after notice and a hearing, the modification is disapproved.","why":"A modified plan gets re-tested against § 1325(a) (good faith, best interests, feasibility), so an objection can attack the modification on confirmation grounds.","sources":["https://www.law.cornell.edu/uscode/text/11/1329","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1329.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1329c":{"id":"usc-1329c","type":"code","cite":"11 U.S.C. § 1329(c)","short":"Five-year hard cap on modified plans","holding":"A modified plan may not provide for payments over a period that expires after the applicable commitment period measured from when the first payment under the original plan was due, unless the court for cause approves a longer period, and the court may not approve a period that expires after five years after that time.","why":"When a struggling client in month 50 wants 'just a few more months,' the clock started with the first payment under the original plan, not the modification.","sources":["https://www.law.cornell.edu/uscode/text/11/1329","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1329.htm","https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title11-section1329&num=0&edition=prelim"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1323":{"id":"usc-1323","type":"code","cite":"11 U.S.C. § 1323","short":"Pre-confirmation modification by debtor","holding":"The debtor may modify the plan at any time before confirmation (so long as it still meets § 1322), the plan as modified becomes the plan once filed, and a secured holder's prior acceptance or rejection carries over unless the modification changes its rights and it changes its vote.","why":"Before confirmation it is the debtor's pen only; trustee or creditor objections get resolved by the debtor amending, not by their own modification motion.","sources":["https://www.law.cornell.edu/uscode/text/11/1323","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1323.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1306a":{"id":"usc-1306a","type":"code","cite":"11 U.S.C. § 1306(a)","short":"Ch. 13 estate: after-acquired property and wages","holding":"In Chapter 13 the estate also includes property of the kind in § 541 that the debtor acquires, and earnings from services the debtor performs, after the case begins but before it is closed, dismissed, or converted, whichever occurs first.","why":"Post-petition raises, inheritances and windfalls are estate property in a 13, which is why trustees watch for them and move to modify.","sources":["https://www.law.cornell.edu/uscode/text/11/1306","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1306.htm"],"status":"current text as of 2026-11-12","group":"g4"},"frbp-3015h":{"id":"frbp-3015h","type":"rule","cite":"Fed. R. Bankr. P. 3015(h)","short":"Procedure to modify a confirmed plan","holding":"A request to modify a confirmed plan under § 1329 must identify the proponent and include the proposed modification; unless the court orders otherwise for unaffected creditors, the clerk or the court's designee gives the debtor, trustee and creditors at least 21 days' notice by mail of the objection deadline and any hearing (with a copy or summary of the modification and a copy to the U.S. trustee), and Rule 9014 governs objections.","why":"It is the procedural spine of every motion to modify: 21 days' notice, contested-matter rules for objections.","sources":["https://www.law.cornell.edu/rules/frbp/rule_3015","https://www.customsmobile.com/uscode/appendix11a_courtrules1_partIII_courtrule3015"],"status":"current text as of 2026-11-12 (restyled effective Dec. 1, 2024; not among the rules amended effective Dec. 1, 2026)","group":"g4"},"frbp-2002a5":{"id":"frbp-2002a5","type":"rule","cite":"Fed. R. Bankr. P. 2002(a)(5)","short":"21-day notice: accept/reject a modification","holding":"Rule 2002(a) requires at least 21 days' notice by mail of listed events, including 'the time to accept or reject a proposed modification to a plan.'","why":"It is the general notice rule; for a Chapter 13 post-confirmation modification the specific procedure lives in Rule 3015(h), so don't stop at 2002.","sources":["https://www.law.cornell.edu/rules/frbp/rule_2002","https://www.customsmobile.com/uscode/appendix11a_courtrules1_partII_courtrule2002"],"status":"current text as of 2026-11-12 (restyled effective Dec. 1, 2024)","group":"g4"},"lbr-4002-1":{"id":"lbr-4002-1","type":"local","cite":"E.D.N.C. LBR 4002-1(g)(4)-(6)","short":"EDNC: sell, borrow or buy over $15,000","holding":"Until the plan is completed, a Chapter 13 debtor may not dispose of property (vested or not) with non-exempt equity over $15,000 without a court order, and may not incur debt of $15,000 or more, or buy property of $15,000 or more with non-exempt assets, without prior court approval on application.","why":"Selling a house or refinancing mid-plan in EDNC triggers this rule first, and the sale or loan facts then feed the trustee's § 1329 analysis.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf","https://www.nceb.uscourts.gov/node/37","https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%20Amendments.pdf"],"status":"note: EDNC Local Rules effective Oct. 15, 2026 set each threshold at $15,000; an earlier version on the court's site used fair market value over $10,000 with non-exempt equity over $12,000 for dispositions and $10,000 for debt and purchases, so update any old checklists","group":"g4"},"case-arnold":{"id":"case-arnold","type":"4th","cite":"Arnold v. Weast (In re Arnold), 869 F.2d 240 (4th Cir. 1989)","short":"Raise can reopen the plan","holding":"A substantial change in the debtor's financial condition after confirmation may warrant increased payments, and res judicata bars an increase only where there have been no unanticipated, substantial changes, measured by whether the change could reasonably have been anticipated at confirmation (income jump from about $80,000 to nearly $200,000 justified raising payments from $800 to $1,500 on an unsecured creditor's motion).","why":"It is the Fourth Circuit's origin story for trustee and creditor 'you got a raise' motions under § 1329.","sources":["https://law.justia.com/cases/federal/appellate-courts/F2/869/240/339320/","https://www.ncwb.uscourts.gov/sites/ncwb/files/opinions/ncwb.3.4.bk_.32325.6119603.0.pdf"],"status":"good law as of 2026-11-12 (reaffirmed in Murphy, 474 F.3d 143)","group":"g4"},"case-trantham":{"id":"case-trantham","type":"4th","cite":"Trantham v. Tate, 112 F.4th 223 (4th Cir. 2024)","short":"Vesting choice can't be forced by form","holding":"Reversing, the court held a bankruptcy court erred by treating its local plan form's default vesting provision as mandatory and may reject a debtor's proposed vesting provision only for reasons the Code allows, while noting (citing Murphy) that the trustee can still seek modification if a sale of vested property brings a substantial and unanticipated change.","why":"When a trustee objects to a plan term just because it departs from the local form, Trantham requires a Code-based reason; and vesting still doesn't shield sale proceeds from a § 1329 motion.","sources":["https://www.ca4.uscourts.gov/opinions/222263.p.pdf","https://law.counselstack.com/opinion/sheila-trantham-v-steven-tate-ca4-2024","https://case-law.vlex.com/vid/trantham-v-tate-1061411639"],"status":"good law as of 2026-11-12 (published; arose from W.D.N.C.; the court also held default vesting provisions are not per se invalid)","group":"g4"},"usc-1307a":{"id":"usc-1307a","type":"code","cite":"11 U.S.C. § 1307(a)","short":"Debtor's right to convert to 7","holding":"The debtor may convert a Chapter 13 case to Chapter 7 at any time, and any waiver of that right is unenforceable.","why":"It is the client's escape hatch when the plan becomes unaffordable; the court cannot make him stay in 13.","sources":["https://www.law.cornell.edu/uscode/text/11/1307","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1307.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1307b":{"id":"usc-1307b","type":"code","cite":"11 U.S.C. § 1307(b)","short":"Debtor's request to dismiss","holding":"On the debtor's request at any time, if the case has not been converted under § 706, 1112, or 1208, the court 'shall dismiss' the Chapter 13 case, and any waiver of that right is unenforceable.","why":"It is the debtor's exit without a Chapter 7 trustee, but a voluntary dismissal after a stay-relief motion can trigger the § 109(g)(2) 180-day bar.","sources":["https://www.law.cornell.edu/uscode/text/11/1307","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1307.htm","https://cdn.ca9.uscourts.gov/datastore/opinions/2021/09/01/20-60043.pdf","https://case-law.vlex.com/vid/mitrano-v-united-states-894593040"],"status":"note: current text as of 2026-11-12; courts are divided on whether bad faith creates an implied exception to this right; the Fourth Circuit's position was not verified for this deck","group":"g4"},"usc-1307c":{"id":"usc-1307c","type":"code","cite":"11 U.S.C. § 1307(c)","short":"Dismissal or conversion for cause","holding":"On request of a party in interest or the U.S. trustee and after notice and a hearing, the court may convert to Chapter 7 or dismiss, whichever is in the best interests of creditors and the estate, for cause including unreasonable delay prejudicial to creditors, failure to commence timely payments, denial of confirmation plus denial of more time to file another or modified plan, material default under a confirmed plan, and failure to pay post-petition domestic support obligations.","why":"Trustee motions to dismiss for plan payment default live here, and the court picks dismissal or conversion based on creditors' best interests.","sources":["https://www.law.cornell.edu/uscode/text/11/1307","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapI-sec1307.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-348f":{"id":"usc-348f","type":"code","cite":"11 U.S.C. § 348(f)","short":"Estate on conversion from 13","holding":"When a Chapter 13 case converts, the converted estate is property of the estate as of the petition date that remains in the debtor's possession or control on the conversion date (and Chapter 13 valuations do not carry into Chapter 7), but if the debtor converts in bad faith the estate is property as of the conversion date.","why":"Advising a convert-to-7 client turns on this: good faith keeps post-petition acquisitions out of the Chapter 7 trustee's reach.","sources":["https://www.law.cornell.edu/uscode/text/11/348","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap3-subchapIII-sec348.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-109e":{"id":"usc-109e","type":"code","cite":"11 U.S.C. § 109(e)","short":"Chapter 13 debt limits","holding":"As amended by the Bankruptcy Threshold Adjustment Act (H.R. 7730), for cases commenced on or after its Nov. 10, 2026 enactment an individual with regular income (or with a spouse) may be a Chapter 13 debtor only if noncontingent, liquidated debts aggregate less than $2,750,000; cases filed April 1, 2025 through Nov. 9, 2026 used separate limits of less than $526,700 unsecured and less than $1,580,125 secured.","why":"Eligibility for your higher-debt clients (rental owners, small-business owners) depends on the filing date and which limit applies.","sources":["https://www.govinfo.gov/content/pkg/BILLS-119hr7730enr/html/BILLS-119hr7730enr.htm","https://www.gasb.uscourts.gov/news/bankruptcy-threshold-adjustment-act","https://www.lplegal.com/content/subchapter-vs-7-5-million-debt-limit-is-now-permanent/","https://www.govinfo.gov/content/pkg/FR-2025-02-04/html/2025-02207.htm","https://www.law.cornell.edu/uscode/text/11/109"],"status":"note: enrolled bill text (govinfo) sets the single $2,750,000 limit and applies it to cases commenced on or after enactment; the Nov. 10, 2026 signing is reported by the S.D. Ga. bankruptcy court notice (Nov. 12, 2026) and law-firm alerts. Public-law number and the updated U.S. Code text were not yet published as of 2026-11-12; recheck before quoting exact wording.","group":"g4"},"usc-109g":{"id":"usc-109g","type":"code","cite":"11 U.S.C. § 109(g)","short":"180-day refiling bar","holding":"No individual may be a debtor if, within the preceding 180 days, a prior case was dismissed for willful failure to obey court orders or appear, or the debtor requested and obtained voluntary dismissal after a request for relief from the automatic stay was filed.","why":"It is the trap in the 'just dismiss and refile' plan when the mortgage servicer has already filed a stay-relief motion.","sources":["https://www.law.cornell.edu/uscode/text/11/109","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap1-sec109.htm"],"status":"note: current text as of 2026-11-12; courts divide on whether § 109(g)(2) applies automatically or requires a causal connection (or allows discretion) between the stay-relief motion and the dismissal; no Fourth Circuit ruling was verified for this deck, so check current EDNC treatment","group":"g4"},"usc-521i":{"id":"usc-521i","type":"code","cite":"11 U.S.C. § 521(i)","short":"Day-46 automatic dismissal","holding":"If an individual Chapter 7 or 13 debtor fails to file all § 521(a)(1) information within 45 days after filing, the case is automatically dismissed effective day 46, subject to a debtor's extension request made within the 45 days (up to 45 more days) and the trustee's motion to keep a good-faith case.","why":"Skeleton filings to stop a foreclosure must be completed by day 45 or the case dies on its own.","sources":["https://www.law.cornell.edu/uscode/text/11/521","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec521.htm"],"status":"current text as of 2026-11-12","group":"g4"},"frbp-1017f":{"id":"frbp-1017f","type":"rule","cite":"Fed. R. Bankr. P. 1017(f)","short":"Paperwork for convert or dismiss","holding":"Rule 9014 governs dismissal or conversion proceedings except debtor-initiated ones; a debtor's dismissal under § 1307(b) requires a motion under Rule 9013, and a debtor's conversion notice under § 1307(a) converts the case without a court order, with the notice date treated as the conversion order date.","why":"Tells you whether you file a notice (convert) or a motion (dismiss), and that trustee 'for cause' motions are contested matters.","sources":["https://www.law.cornell.edu/rules/frbp/rule_1017","https://www.govinfo.gov/content/pkg/CPRT-119HPRT61920/pdf/CPRT-119HPRT61920.pdf"],"status":"current text as of 2026-11-12 (restyled effective Dec. 1, 2024)","group":"g4"},"lbr-1007-1":{"id":"lbr-1007-1","type":"local","cite":"E.D.N.C. LBR 1007-1(c)","short":"EDNC day-46 auto-dismissal","holding":"If the required schedules and statements are not filed by the 45th day after the petition, the case is automatically dismissed effective the 46th day under § 521(i)(1).","why":"It is the EDNC implementation of § 521(i), so the calendar for a bare-bones Wilmington filing has a hard day-45 entry.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026); LBR 1017-2 separately requires same-day delivery to the trustee and bankruptcy administrator of any § 521(i)(2) dismissal request","group":"g4"},"case-marrama":{"id":"case-marrama","type":"scotus","cite":"Marrama v. Citizens Bank of Massachusetts, 549 U.S. 365 (2007)","short":"Bad faith can forfeit conversion","holding":"A Chapter 7 debtor who acted in bad faith forfeited the right to convert to Chapter 13 under § 706(a), because § 706(d) allows conversion only if the debtor may be a debtor under that chapter and bad-faith conduct that would justify dismissal or conversion under § 1307(c) is tantamount to a ruling that he does not qualify.","why":"The 'absolute' right to switch chapters yields to bad faith, which is the reasoning trustees import into § 1307(c).","sources":["https://supreme.justia.com/cases/federal/us/549/365/","https://www.law.cornell.edu/supct/html/05-996.ZO.html","https://www.law.cornell.edu/supremecourt/text/12-5196"],"status":"good law as of 2026-11-12; Law v. Siegel (2014) read Marrama's holding as resting on § 706(d) (bad faith can mean the debtor does not qualify for Chapter 13) and treated its § 105(a) remarks as dictum that does not let courts override express Code provisions","group":"g4"},"case-harris":{"id":"case-harris","type":"scotus","cite":"Harris v. Viegelahn, 575 U.S. 510 (2015)","short":"Undistributed wages go back to debtor","holding":"When a debtor converts in good faith from Chapter 13 to Chapter 7, the debtor is entitled to the return of any post-petition wages the Chapter 13 trustee has not yet distributed.","why":"On a good-faith conversion the money sitting with the trustee goes back to your client, not to creditors.","sources":["https://supreme.justia.com/cases/federal/us/575/510/","https://www.law.cornell.edu/supremecourt/text/14-400"],"status":"good law as of 2026-11-12","group":"g4"},"case-purdy":{"id":"case-purdy","type":"4th","cite":"Purdy v. Burnett, No. 23-2283 (4th Cir. May 28, 2025) (unpublished)","short":"EDNC bad-faith dismissal affirmed","holding":"The Fourth Circuit affirmed dismissal of an E.D.N.C. Chapter 13 case for cause under § 1307(c), based on the debtors' fraud and knowing violations of court orders and local rules, with five- and ten-year refiling bars, noting cause may be based on bad faith, and rejected the debtors' attack on LBR 4002-1(g)(5)-(6) because their confirmed plan bound them to the local rule.","why":"It shows that knowing violations of EDNC orders and local rules (including the post-petition debt and purchase limits the debtors challenged) can support bad-faith dismissal with a refiling bar.","sources":["https://www.ca4.uscourts.gov/opinions/232283.U.pdf","https://law.counselstack.com/opinion/marcus-purdy-v-michael-burnett-ca4-2025"],"status":"note: unpublished per curiam; not binding precedent in the Fourth Circuit; arose from E.D.N.C.","group":"g4"},"usc-1328a":{"id":"usc-1328a","type":"code","cite":"11 U.S.C. § 1328(a)","short":"Full-compliance Ch. 13 discharge","holding":"As soon as practicable after the debtor completes all plan payments (and certifies that domestic support obligations due are paid), the court grants a discharge of all debts provided for by the plan or disallowed, except long-term § 1322(b)(5) debts, § 507(a)(8)(C) taxes, debts in § 523(a)(1)(B), (1)(C), (2), (3), (4), (5), (8) or (9), criminal restitution or fines, and civil restitution or damages for willful or malicious injury causing personal injury or death.","why":"It is the reward clients plan five years for, and its exception list is narrower than Chapter 7's, which is a selling point for certain debts.","sources":["https://www.law.cornell.edu/uscode/text/11/1328","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1328.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1328b":{"id":"usc-1328b","type":"code","cite":"11 U.S.C. § 1328(b)","short":"Hardship discharge","holding":"After notice and a hearing, the court may grant a discharge to a debtor who has not completed payments if the failure is due to circumstances for which the debtor should not justly be held accountable, unsecured creditors have received at least their Chapter 7 liquidation value, and modification under § 1329 is not practicable; under § 1328(c) it does not discharge § 1322(b)(5) debts or any debt of a kind in § 523(a) (for (a)(6) debts, Rule 4007(d) sets a complaint deadline).","why":"For the client who dies, is disabled or catastrophically loses income near the end of the plan, this saves the case, but it gives the narrower Chapter 7-style result.","sources":["https://www.law.cornell.edu/uscode/text/11/1328","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1328.htm","https://www.law.cornell.edu/rules/frbp/rule_4007"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1328f":{"id":"usc-1328f","type":"code","cite":"11 U.S.C. § 1328(f)","short":"Prior-discharge time bars","holding":"The court may not grant a Chapter 13 discharge if the debtor received a discharge in a Chapter 7, 11, or 12 case filed during the 4 years before the order for relief, or in a Chapter 13 case filed during the 2 years before it.","why":"Screening the client's filing history at intake tells you whether the 13 is a discharge case or a 'Chapter 20' payment-only case.","sources":["https://www.law.cornell.edu/uscode/text/11/1328","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1328.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1328g1":{"id":"usc-1328g1","type":"code","cite":"11 U.S.C. § 1328(g)(1)","short":"Personal financial management course","holding":"The court may not grant a discharge unless, after filing the petition, the debtor completed an instructional course concerning personal financial management described in § 111, subject to § 1328(g)(2) exceptions for § 109(h)(4) debtors (incapacity, disability, combat duty) and inadequate-course districts.","why":"The most common avoidable reason a finished Chapter 13 closes without a discharge.","sources":["https://www.law.cornell.edu/uscode/text/11/1328","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1328.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-1328h":{"id":"usc-1328h","type":"code","cite":"11 U.S.C. § 1328(h)","short":"§ 522(q) finding before discharge","holding":"The court may not grant a Chapter 13 discharge unless, after notice and a hearing held not more than 10 days before the discharge order, it finds no reasonable cause to believe that § 522(q)(1) may apply to the debtor or that a proceeding is pending in which the debtor may be found guilty of a felony or liable for a debt of the kind described in § 522(q)(1).","why":"It is why the end-of-case certification asks about § 522(q) and pending felony or securities-fraud proceedings.","sources":["https://www.law.cornell.edu/uscode/text/11/1328","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap13-subchapII-sec1328.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-523a":{"id":"usc-523a","type":"code","cite":"11 U.S.C. § 523(a)","short":"Nondischargeable debt categories","holding":"Section 523(a) lists debts excepted from discharge, including taxes, fraud, unscheduled debts, fiduciary fraud or embezzlement, domestic support obligations ((a)(5)), willful and malicious injury ((a)(6)), qualifying student loans absent undue hardship ((a)(8)), drunk-driving death or injury ((a)(9)), and non-support divorce debts to a spouse, former spouse or child ((a)(15)); § 523(c)(1) makes (a)(2), (a)(4) and (a)(6) debts dischargeable unless the creditor obtains a determination.","why":"Cross-check § 523(a) against § 1328(a)(2): only the listed subsections survive a full-compliance Chapter 13 discharge.","sources":["https://www.law.cornell.edu/uscode/text/11/523","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec523.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-524a2":{"id":"usc-524a2","type":"code","cite":"11 U.S.C. § 524(a)(2)","short":"Discharge injunction","holding":"A discharge operates as an injunction against commencing or continuing an action, employing process, or any act to collect, recover or offset a discharged debt as a personal liability of the debtor, whether or not discharge of the debt is waived.","why":"It is the client's shield after the case and the basis for contempt motions against collectors who keep calling.","sources":["https://www.law.cornell.edu/uscode/text/11/524","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec524.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-524i":{"id":"usc-524i","type":"code","cite":"11 U.S.C. § 524(i)","short":"Failure to credit plan payments","holding":"A creditor's willful failure to credit payments received under a confirmed plan, unless confirmation was revoked, the plan is in default, or the creditor did not receive the payments required under the plan, violates the § 524(a)(2) injunction if the collection act and failure to credit caused material injury to the debtor.","why":"It is the post-discharge remedy against a mortgage servicer that pretends the conduit payments never happened.","sources":["https://www.law.cornell.edu/uscode/text/11/524","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec524.htm"],"status":"current text as of 2026-11-12","group":"g4"},"frbp-1007b7":{"id":"frbp-1007b7","type":"rule","cite":"Fed. R. Bankr. P. 1007(b)(7)","short":"File the course certificate","holding":"An individual Chapter 7 or 13 debtor must file the provider's certificate of completion of a personal financial-management course unless an approved provider has already notified the court of completion or the debtor is not required to complete one; in Chapter 13, Rule 1007(c)(4)(B) currently sets the deadline as no later than the date the last plan payment is made.","why":"Docket the certificate before the last payment; the clerk will not route a discharge without it.","sources":["https://www.law.cornell.edu/rules/frbp/rule_1007","https://www.govinfo.gov/content/pkg/CPRT-119HPRT61920/pdf/CPRT-119HPRT61920.pdf","https://www.supremecourt.gov/orders/courtorders/frbk26_o7jp.pdf","https://www.courtrules.net/blog/federal-bankruptcy-rules-change-on-december-1-course-certificates-remote-testimony-and-plan-acceptance"],"status":"note: Supreme Court order of April 8, 2026 (effective Dec. 1, 2026) abrogates Rule 1007(c)(4), removing the filing deadline, and amends Rule 5009(b) so the clerk notifies a Chapter 13 debtor whose certificate is not on file when the trustee files the final report and account, giving 60 days to file; the certificate requirement and Rule 4004(c)(4) remain","group":"g4"},"frbp-4004c4":{"id":"frbp-4004c4","type":"rule","cite":"Fed. R. Bankr. P. 4004(c)(4)","short":"No certificate, no discharge","holding":"In a Chapter 13 case (or an individual Chapter 11 case), the court must not grant a discharge if the debtor has not filed a certificate required by Rule 1007(b)(7).","why":"It turns the course requirement into a hard procedural stop at the end of the case.","sources":["https://www.law.cornell.edu/rules/frbp/rule_4004","https://www.customsmobile.com/uscode/appendix11a_courtrules1_partIV_courtrule4004"],"status":"current text as of 2026-11-12 (restyled effective Dec. 1, 2024; not among the rules amended effective Dec. 1, 2026)","group":"g4"},"lbr-1016-1":{"id":"lbr-1016-1","type":"local","cite":"E.D.N.C. LBR 1016-1(b)","short":"EDNC certification when debtor dies","holding":"In a Chapter 13 case where the debtor has died, the 'Chapter 13 Debtor's Certification Regarding Domestic Support Obligations, Discharges in Prior Cases, and § 522(q)' must be accompanied by verification that the signer is the executor or administrator (or a motion for exemption from the certification may be filed), with a copy of the death certificate unless the court orders otherwise.","why":"The EDNC end-of-case certification bundles the § 1328(a) DSO, § 1328(f) prior-discharge and § 1328(h)/§ 522(q) items, and this rule tells you how to handle it for a deceased client.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026)","group":"g4"},"case-taggart":{"id":"case-taggart","type":"scotus","cite":"Taggart v. Lorenzen, 587 U.S. 554 (2019)","short":"Contempt: no fair ground of doubt","holding":"A court may hold a creditor in civil contempt for violating a discharge order if there is no fair ground of doubt as to whether the order barred the creditor's conduct, an objective standard under which subjective good faith is no defense though it may bear on the sanction.","why":"It sets the bar for discharge-violation contempt motions: show the creditor's reading of the discharge was objectively unreasonable.","sources":["https://supremecourt.gov/opinions/18pdf/587us2r47_h3ci.pdf","https://law.cornell.edu/supct/pdf/18-489.pdf","https://www.supremecourt.gov/opinions/preliminaryprint/587US2PP_web.pdf"],"status":"good law as of 2026-11-12","group":"g4"},"usc-541a1":{"id":"usc-541a1","type":"code","cite":"11 U.S.C. § 541(a)(1)","short":"Estate: everything at filing","holding":"The estate includes all legal or equitable interests of the debtor in property as of the commencement of the case, and under § 541(a)(6) proceeds and rents of estate property, except earnings from an individual debtor's post-petition services.","why":"Every asset on Schedule A/B starts here, including the claim the client forgot to mention.","sources":["https://www.law.cornell.edu/uscode/text/11/541","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapIII-sec541.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-541c2":{"id":"usc-541c2","type":"code","cite":"11 U.S.C. § 541(c)(2)","short":"Anti-alienation trusts stay out","holding":"A restriction on transfer of the debtor's beneficial interest in a trust that is enforceable under applicable nonbankruptcy law is enforceable in bankruptcy, so the interest stays out of the estate (and § 541(b)(7) separately excludes employee contributions withheld for qualified retirement and health plans).","why":"A client's 401(k) usually never enters the estate, so it never needs an exemption at all.","sources":["https://www.law.cornell.edu/uscode/text/11/541","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapIII-sec541.htm"],"status":"current text as of 2026-11-12","group":"g4"},"usc-522b":{"id":"usc-522b","type":"code","cite":"11 U.S.C. § 522(b)","short":"Exemption menu and state opt-out","holding":"An individual debtor exempts property under either the federal list in § 522(d) (unless applicable state law specifically does not authorize it) or the state and federal nonbankruptcy exemptions of the domicile state determined by the 730-day rule, and § 522(b)(3)(C) separately exempts retirement funds held in tax-exempt accounts under listed Internal Revenue Code sections.","why":"It is why your EDNC clients use the NC list, and why the 730-day domicile rule matters for clients who recently moved to Wilmington.","sources":["https://www.law.cornell.edu/uscode/text/11/522","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec522.htm"],"status":"current text as of 2026-11-12","group":"g4"},"ncgs-1c-1601":{"id":"ncgs-1c-1601","type":"nc","cite":"N.C. Gen. Stat. § 1C-1601","short":"North Carolina exemptions; opt-out","holding":"North Carolina exempts, among other things, a residence interest up to $35,000 ($60,000 for an unmarried debtor 65 or older whose deceased co-owner held with the debtor by entireties or survivorship), up to $5,000 of unused residence exemption in any property, one motor vehicle up to $3,500, and IRAs and Roth IRAs (including inherited IRAs received by direct transfer or rollover), and subsection (f) makes the federal § 522(d) exemptions inapplicable to North Carolina residents.","why":"This is the exemption schedule (EDNC Schedule C-1) for nearly every client; the homestead number drives best-interests math in every plan.","sources":["https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_1C/GS_1C-1601.html","https://www.nolo.com/legal-encyclopedia/north-carolina-bankruptcy-homestead-exemption.html","https://upsolve.org/nc/exemptions"],"status":"current text as of 2026-11-12 (ncleg.gov; most recent amendment S.L. 2025-46, which repealed (a)(10) effective Sept. 1, 2025); amounts are fixed in the statute text, not indexed by § 104","group":"g4"},"usc-522l":{"id":"usc-522l","type":"code","cite":"11 U.S.C. § 522(l)","short":"Unobjected exemptions stand","holding":"The debtor files a list of property claimed as exempt, and unless a party in interest objects, the property claimed as exempt on that list is exempt.","why":"Silence is golden: if no one objects in time, the claimed exemption becomes final.","sources":["https://www.law.cornell.edu/uscode/text/11/522","https://www.govinfo.gov/content/pkg/USCODE-2023-title11/html/USCODE-2023-title11-chap5-subchapII-sec522.htm","https://www.law.cornell.edu/supremecourt/text/503/638"],"status":"current text as of 2026-11-12","group":"g4"},"frbp-4003b1":{"id":"frbp-4003b1","type":"rule","cite":"Fed. R. Bankr. P. 4003(b)(1)","short":"30 days to object to exemptions","holding":"A party in interest may object to a claimed exemption within 30 days after the later of the conclusion of the § 341 meeting or the filing of an amendment to the exemption list or a supplemental schedule, and the court may for cause extend the time on a motion filed before it expires.","why":"Calendar 30 days from the date the § 341 meeting concludes (not merely the first setting), and from any amended Schedule C.","sources":["https://www.law.cornell.edu/rules/frbp/rule_4003","https://www.customsmobile.com/uscode/appendix11a_courtrules1_partIV_courtrule4003"],"status":"current text as of 2026-11-12 (restyled effective Dec. 1, 2024)","group":"g4"},"lbr-4003-1":{"id":"lbr-4003-1","type":"local","cite":"E.D.N.C. LBR 4003-1","short":"EDNC exemption form and extensions","holding":"An individual debtor claiming North Carolina exemptions must use local Schedule C-1 (Schedule C-2 for federal or other-state exemptions, with citations and 730-day domicile history), and a party seeking more time to object must file a motion stating reasons before the objection deadline expires.","why":"In EDNC the exemption claim is a local form, and an untimely extension motion is no extension at all.","sources":["https://www.nceb.uscourts.gov/sites/nceb/files/Local%20Rules%2010-15-26%20-%20Updated%20Guide%20Links.pdf","https://www.nceb.uscourts.gov/sites/nceb/files/2026%20Comprehensive%20Review%20Clean.pdf"],"status":"current text as of 2026-11-12 (EDNC Local Rules effective Oct. 15, 2026)","group":"g4"},"case-patterson":{"id":"case-patterson","type":"scotus","cite":"Patterson v. Shumate, 504 U.S. 753 (1992)","short":"ERISA plans excluded from estate","holding":"An ERISA-qualified pension plan's anti-alienation provision is a restriction enforceable under 'applicable nonbankruptcy law,' which includes federal law, so the debtor's plan interest is excluded from the estate under § 541(c)(2).","why":"It is why a client's ERISA-qualified pension or 401(k) is off the table before exemptions even come up (the case came up from the Fourth Circuit).","sources":["https://supreme.justia.com/cases/federal/us/504/753/","https://www.law.cornell.edu/supremecourt/text/504/753"],"status":"good law as of 2026-11-12","group":"g4"},"case-schwab":{"id":"case-schwab","type":"scotus","cite":"Schwab v. Reilly, 560 U.S. 770 (2010)","short":"Claim the dollar, keep only the dollar","holding":"A trustee need not object to protect the estate's interest in value above an exemption claimed as a dollar amount within the statutory limit, even if the debtor listed the asset's value as equal to that amount; a debtor who wants the whole asset should make that clear (for example, '100% of FMV') so the trustee must object in time.","why":"Drafting Schedule C-1: claiming a dollar amount protects only that amount, so an undervalued asset can still be reached for excess value.","sources":["https://supreme.justia.com/cases/federal/us/560/770/","https://www.law.cornell.edu/supct/html/08-538.ZO.html"],"status":"good law as of 2026-11-12","group":"g4"},"case-law":{"id":"case-law","type":"scotus","cite":"Law v. Siegel, 571 U.S. 415 (2014)","short":"No equitable surcharge of exemptions","holding":"A bankruptcy court may not use § 105(a) or inherent power to surcharge a debtor's exempt property (there, a homestead) to pay administrative expenses, because § 522 exhaustively specifies exemptions and their exceptions and § 522(k) shields exempt property from administrative expenses.","why":"Even a badly behaved debtor keeps a properly claimed, unobjected exemption unless the Code itself provides an exception.","sources":["https://supreme.justia.com/cases/federal/us/571/415/","https://www.law.cornell.edu/supremecourt/text/12-5196"],"status":"good law as of 2026-11-12","group":"g4"},"case-clark":{"id":"case-clark","type":"scotus","cite":"Clark v. Rameker, 573 U.S. 122 (2014)","short":"Inherited IRA isn't 'retirement funds'","holding":"Funds in an inherited IRA are not 'retirement funds' under § 522(b)(3)(C), because the holder cannot add money, must take distributions regardless of retirement age, and may withdraw everything at any time without penalty.","why":"The federal (b)(3)(C) route fails for inherited IRAs, so in NC you look to the state statute's own inherited-IRA language instead.","sources":["https://supreme.justia.com/cases/federal/us/573/122/","https://www.law.cornell.edu/supremecourt/text/13-299"],"status":"good law as of 2026-11-12","group":"g4"},"case-taylor":{"id":"case-taylor","type":"scotus","cite":"Taylor v. Freeland & Kronz, 503 U.S. 638 (1992)","short":"Late objection loses, even if baseless","holding":"A trustee who fails to object within the Rule 4003(b) 30-day period (absent an extension) cannot later contest the exemption, even if the debtor had no colorable basis for claiming it.","why":"The deadline cuts both ways: watch for trustee objections in the 30 days, and know an exemption that survives it is final under § 522(l).","sources":["https://supreme.justia.com/cases/federal/us/503/638/","https://www.law.cornell.edu/supremecourt/text/503/638"],"status":"good law as of 2026-11-12","group":"g4"}},"cards":[{"id":"as-1","topic":"automatic-stay","level":1,"prompt":"Two weeks after Tammy Fishburne's Chapter 13 petition, a payday lender on Oleander Drive is still calling her at work about the $600 she borrowed last spring. Which provision does each call run into?","answer":"usc-362a6","options":["usc-362a6","usc-362a3","usc-362k","usc-1301"],"explain":"Calling to collect a prepetition claim is an act to collect, assess, or recover under § 362(a)(6). Section 362(k) is the remedy, not the prohibition.","quip":"The lender's persistence is admirable. So, soon, will be the fee award."},{"id":"as-2","topic":"automatic-stay","level":1,"prompt":"Your client Rex Pettigrew files Chapter 13 mid-divorce. His wife's lawyer wants to finish the absolute divorce in New Hanover County District Court, and asks only for the decree, not property division. Does she need stay relief?","answer":"usc-362b2","options":["usc-362b2","usc-362d1","usc-1301","case-robbins"],"explain":"§ 362(b)(2)(A)(iv) excepts a dissolution proceeding except to the extent it seeks to divide property of the estate, so the decree alone needs no relief. Robbins matters only when she wants to divide estate property.","quip":"The marriage can end without permission. The marital assets cannot."},{"id":"as-3","topic":"automatic-stay","level":2,"prompt":"A title lender repossessed Bubba Gaskins's F-150 three days before he filed. After filing, it just parks the truck and ignores your letters. Bubba wants § 362(k) sanctions for 'exercising control' over estate property. What case stands in the way of that theory?","answer":"case-fulton","options":["case-fulton","case-houck","case-strumpf","usc-362a3"],"explain":"Fulton holds that mere retention of estate property after the petition does not violate § 362(a)(3); it left turnover under § 542 and other subsections open. Strumpf involved a temporary account hold, not a repossessed vehicle.","quip":"Possession is nine-tenths of the law; Fulton covers the last tenth."},{"id":"as-4","topic":"automatic-stay","level":1,"prompt":"Darlene Pruitt's first Chapter 13 was dismissed in March for missed plan payments. She refiles in October to save her Leland house. If you do nothing, what happens on day 30?","answer":"usc-362c3","options":["usc-362c3","usc-362c4","usc-362e","lbr-4001-1d"],"explain":"One prior case pending and dismissed within the year triggers § 362(c)(3): the stay terminates as to the debtor on day 30 unless extended. Section 362(c)(4) applies only with two or more prior dismissals.","quip":"Thirty days: the bankruptcy equivalent of a free trial."},{"id":"as-5","topic":"automatic-stay","level":1,"prompt":"Clyde Moseley has had two Chapter 13s dismissed in the last eleven months. He files a third on the morning of the foreclosure sale. Is there an automatic stay when the auctioneer reaches for the gavel?","answer":"usc-362c4","options":["usc-362c4","usc-362c3","usc-362d4","usc-362a3"],"explain":"With two or more prior cases pending and dismissed within the year, § 362(c)(4)(A) says no stay goes into effect; a stay exists only from entry of an order imposing it on a request made within 30 days.","quip":"Third time is not the charm. Third time is the auction."},{"id":"as-6","topic":"automatic-stay","level":2,"prompt":"You file Darlene's motion to extend the stay on day 3, attach her § 1746 declaration and a notice of motion, serve every creditor and the trustee that day, and email the courtroom staff. No one objects. What EDNC rule lets the court rule without a hearing?","answer":"lbr-4001-1d","options":["lbr-4001-1d","lbr-4001-1c","frbp-9014","frbp-4001a4"],"explain":"LBR 4001-1(d) allows a no-hearing ruling on a § 362(c)(3)(B) or (c)(4)(B) motion if it is filed within 5 days of the petition, unopposed, supported by a declaration, served on all creditors and the trustee, and flagged to courtroom staff. LBR 4001-1(c) governs creditors' stay-relief motions."},{"id":"as-7","topic":"automatic-stay","level":2,"prompt":"After a Greenville filing, an HVAC company keeps mailing your clients monthly invoices for a $280 repair, despite the BNC notice and three letters from your office. What EDNC decision tells you both that this is willful and roughly what it is worth?","answer":"case-lyle","options":["case-lyle","case-houck","case-goldman","case-fulton"],"explain":"In re Lyle found a willful violation on these facts (an intentional act with knowledge of the stay suffices) but awarded modest damages, cut the fee request, and denied punitive damages. Houck states the elements; Lyle shows how EDNC applies them.","quip":"Twenty invoices for $278.40: persistence is not a business model."},{"id":"as-8","topic":"automatic-stay","level":1,"prompt":"Your Chapter 13 client is injured by a creditor's willful post-petition wage garnishment on a credit-card judgment. Which provision lets her recover actual damages, costs and attorney's fees?","answer":"usc-362k","options":["usc-362k","usc-362a6","usc-363e","usc-362d1"],"explain":"§ 362(k)(1) mandates actual damages, including costs and attorneys' fees, for an individual injured by a willful violation, with punitive damages in appropriate circumstances. Section 362(a)(6) is what was violated."},{"id":"as-9","topic":"automatic-stay","level":3,"prompt":"Opposing counsel argues your client's stay-violation complaint fails because the substitute trustee 'never meant to violate anything.' Which Fourth Circuit case frames the elements you must plead?","answer":"case-houck","options":["case-houck","case-goldman","case-lyle","case-robbins"],"explain":"Houck lists the § 362(k) elements: a violation, that was willful, causing injury; it treated a foreclosure sale with actual notice of the petition as a sufficiently alleged willful violation. Lyle is an EDNC application, not circuit law.","quip":"'I didn't mean to' is a fine excuse for a toddler and a poor one for a substitute trustee."},{"id":"as-10","topic":"automatic-stay","level":3,"prompt":"A national card issuer keeps dunning Wanda Futrell post-petition. When you file a § 362(k) adversary proceeding, it moves to compel individual arbitration under the cardholder agreement. What is the current Fourth Circuit answer, and what is the catch?","answer":"case-goldman","options":["case-goldman","case-houck","case-strumpf","frbp-9014"],"explain":"Goldman Sachs Bank USA v. Brown (4th Cir. 2026) affirmed refusal to compel arbitration of § 362(k) claims as core and in conflict with the Code's purposes. The catch: the Supreme Court granted certiorari on Nov. 6, 2026.","quip":"Binding today; on the Supreme Court's docket tomorrow. Shepardize before every hearing."},{"id":"as-11","topic":"automatic-stay","level":1,"prompt":"Mavis Oakley cosigned her son Tucker's personal loan for a used bass boat. Tucker files Chapter 13 and the plan pays the loan in full; the lender sues Mavis in small claims anyway. What stops the suit?","answer":"usc-1301","options":["usc-1301","usc-362a6","usc-362b2","usc-362c3"],"explain":"§ 1301(a) bars acts or suits to collect a consumer debt of the Chapter 13 debtor from an individual liable on it with the debtor. Section 362(a)(6) protects only the debtor.","quip":"The boat is for fishing. The lawsuit was a fishing expedition."},{"id":"as-12","topic":"automatic-stay","level":3,"prompt":"Sonny Vick's prior Chapter 13 was dismissed in June; he refiled in September and never moved to extend. On day 45 his car lender wants an order confirming the stay is gone before it repossesses the truck. Where does the termination come from?","answer":"usc-362c3","options":["usc-362c3","usc-362d1","usc-362e","usc-362c4"],"explain":"The stay terminated under § 362(c)(3)(A), and § 362(j) requires the court on request to enter an order confirming it. The trap: courts split on whether (c)(3)(A) reaches estate property (Smith, 1st Cir., yes; Rose, 5th Cir., no) and the Fourth Circuit has not ruled, so a cautious lender also seeks § 362(d) relief."},{"id":"sr-1","topic":"stay-relief","level":1,"prompt":"Six months into Gus Lumbee's Chapter 13, his mortgage servicer files a motion for relief alleging four missed post-petition direct payments on the Ogden house. Under what Code paragraph is that motion brought?","answer":"usc-362d1","options":["usc-362d1","usc-362d2","usc-362d4","usc-362e"],"explain":"A post-petition payment default is argued as cause, including lack of adequate protection, under § 362(d)(1). Section 362(d)(2) needs both no equity and no necessity, which a residence in a cure plan rarely satisfies."},{"id":"sr-2","topic":"stay-relief","level":2,"prompt":"The servicer's motion says only 'Debtor is in post-petition default.' Gus swears he paid in July. What EDNC rule requires itemization, and lets you demand the payment history fast?","answer":"lbr-4001-1c","options":["lbr-4001-1c","lbr-4001-1d","frbp-9014","frbp-4001a4"],"explain":"LBR 4001-1(c)(1) requires a post-petition-default motion to say so and itemize each past-due amount, and (c)(2) obligates the creditor to promptly send the payment history on the debtor's request. LBR 4001-1(d) is the debtor's motion to extend or impose the stay.","quip":"'Trust us' is not an itemization."},{"id":"sr-3","topic":"stay-relief","level":2,"prompt":"Pelican Pointe HOA moves for relief over $1,900 in unpaid post-petition assessments on Loretta Spivey's Carolina Beach condo. At the hearing, who must prove Loretta has equity, and who must prove everything else?","answer":"usc-362g","options":["usc-362g","usc-362d2","usc-362e","usc-363e"],"explain":"§ 362(g) puts the burden on the movant on the debtor's equity and on the party opposing relief on all other issues. Section 363(p) allocates the burden in § 363(e) disputes, not § 362(d) motions.","quip":"The HOA proves the condo is underwater. Loretta proves she is not."},{"id":"sr-4","topic":"stay-relief","level":1,"prompt":"Judge signs an order lifting the stay on Thursday. The servicer's foreclosure lawyer emails that the sale will be noticed Friday morning. The order says nothing about waiving anything. What rule makes the order wait?","answer":"frbp-4001a4","options":["frbp-4001a4","usc-362e","frbp-9014","lbr-4001-1c"],"explain":"Rule 4001(a)(4) stays an order granting relief for 14 days after entry unless the court orders otherwise. Section 362(e) governs when the stay itself lapses while a motion is pending.","quip":"Fourteen days: long enough to file a motion, too short to finish a beach read."},{"id":"sr-5","topic":"stay-relief","level":3,"prompt":"Rex Pettigrew's ex-wife wants relief to finish equitable distribution of the marital home (now estate property) in New Hanover County District Court. What Fourth Circuit case supplies the factors?","answer":"case-robbins","options":["case-robbins","usc-362b2","case-houck","usc-362d2"],"explain":"Robbins affirmed lifting the stay so a state court could finish equitable distribution, weighing state-law issues, judicial economy and protection of the estate, with claim allowance kept in bankruptcy court. Section 362(b)(2)(A)(iv) does not help her because it excludes division of estate property.","quip":"The house goes to state court; the check still goes through bankruptcy court."},{"id":"sr-6","topic":"stay-relief","level":2,"prompt":"A car lender's motion for relief has been pending 31 days with no hearing, no continuance order and no consent. The lender says the stay ended on its own. What provision is it relying on?","answer":"usc-362e","options":["usc-362e","usc-362c3","frbp-4001a4","usc-362g"],"explain":"§ 362(e)(1) terminates the stay as to the movant 30 days after a § 362(d) request unless the court continues it after notice and a hearing. Section 362(c)(3) is the repeat-filer rule, unrelated to a pending motion."},{"id":"sr-7","topic":"stay-relief","level":2,"prompt":"Before filing, the landlord of Toby Ezzell's Princess Place rental got a summary ejectment judgment from the magistrate. Toby files Chapter 13 with nothing else. Can the landlord proceed with the writ without a motion for relief?","answer":"usc-362b22","options":["usc-362b22","usc-362a3","usc-362d1","usc-362d4"],"explain":"Under § 362(b)(22), a residential lessor that obtained a prepetition judgment for possession may continue the eviction, subject only to the debtor's § 362(l) certification and rent deposit. Section 362(a)(3) would otherwise stay the act.","quip":"No certification, no deposit, no couch."},{"id":"sr-8","topic":"stay-relief","level":2,"prompt":"Assume Toby can truthfully certify a right to cure under applicable law and wants to keep his home for now. At filing, what EDNC rule tells you which forms to file and how to tender the next 30 days' rent?","answer":"lbr-4001-1e","options":["lbr-4001-1e","lbr-4001-1c","lbr-4001-1d","lbr-3070-1c"],"explain":"LBR 4001-1(e) requires Form B 101A with a copy of the judgment, Form B 101B for the follow-up certification, and a certified check or money order payable to the lessor delivered to the clerk at filing. LBR 3070-1(c) is about personal-property lease and adequate-protection payments."},{"id":"sr-9","topic":"stay-relief","level":3,"prompt":"The day after Bobbie Jo Teachey files, her credit union freezes her checking account because she owes it on a car loan, and two days later files a motion for relief to set off. Is the freeze itself a stay violation?","answer":"case-strumpf","options":["case-strumpf","case-fulton","usc-362a6","usc-362k"],"explain":"Strumpf held a temporary administrative hold, kept only while the bank sought § 362(d) relief to set off, is not a setoff under § 362(a)(7) and does not violate (a)(3) or (a)(6). Fulton concerned retention of a repossessed vehicle."},{"id":"sr-10","topic":"stay-relief","level":3,"prompt":"Within a year, a Kure Beach cottage has been quitclaimed to three different relatives without the lender's consent, each of whom filed a bare-bones petition on the eve of foreclosure. What relief lets the lender bind the next filer too?","answer":"usc-362d4","options":["usc-362d4","usc-362c4","usc-362d2","usc-362c3"],"explain":"§ 362(d)(4) grants in rem relief for a scheme involving unauthorized transfers or multiple filings, and a recorded order binds other cases affecting the property for 2 years. Section 362(c)(4) looks only at the same debtor's prior dismissals.","quip":"The cottage has filed more petitions than most paralegals."},{"id":"sr-11","topic":"stay-relief","level":1,"prompt":"You want to serve discovery on a servicer whose motion for relief rests on a payment history you don't trust. What rule makes the motion a contested matter where discovery rules apply?","answer":"frbp-9014","options":["frbp-9014","frbp-4001d","frbp-4001a4","lbr-4001-1c"],"explain":"Rule 4001(a)(1) requires a § 362(d) motion to comply with Rule 9014, which applies Part VII discovery rules (7026, 7028-7037) to contested matters. Rule 4001(d) governs approval of agreements."},{"id":"sr-12","topic":"stay-relief","level":2,"prompt":"Ernest Bowden's plan surrenders nothing but doesn't need his underwater investment lot in Hampstead, and the lender shows the debt exceeds its value. Which paragraph lets the lender win without proving any default?","answer":"usc-362d2","options":["usc-362d2","usc-362d1","usc-362d4","usc-362g"],"explain":"§ 362(d)(2) grants relief when the debtor has no equity and the property is not necessary to an effective reorganization, no default required. Section 362(d)(1) needs cause."},{"id":"sr-13","topic":"stay-relief","level":2,"prompt":"Tucker's plan pays nothing on the bass-boat loan his mother cosigned. The lender files a § 1301(c)(2) request for co-debtor relief, and nobody responds. What happens on day 20?","answer":"usc-1301","options":["usc-1301","usc-362e","usc-362d1","frbp-4001a4"],"explain":"Under § 1301(d), a § 1301(c)(2) request terminates the co-debtor stay 20 days after filing unless the debtor or co-debtor files and serves a written objection. Section 362(e)'s 30/60-day clocks apply to the § 362(a) stay.","quip":"Twenty days of silence, and Mom is back on the hook."},{"id":"ap-1","topic":"adequate-protection-and-vehicles","level":1,"prompt":"Marla Honeycutt files her petition on June 1 and her plan on June 10. When is her first payment due at the latest?","answer":"usc-1326a1","options":["usc-1326a1","usc-1326a2","usc-1325a5biii","lbr-3070-1c"],"explain":"§ 1326(a)(1) requires payments to begin within 30 days after the earlier of the plan filing or the order for relief, here the June 1 petition, so by July 1. Section 1325(a)(5)(B)(iii) governs payments under a confirmed plan.","quip":"The clock starts when the petition hits ECF, not when the plan hits your inbox."},{"id":"ap-2","topic":"adequate-protection-and-vehicles","level":1,"prompt":"Dwayne Pope leases a Jeep Wrangler and wants to keep it. Before confirmation, to whom do his post-petition lease payments go under the Code?","answer":"usc-1326a1","options":["usc-1326a1","usc-1326a3","usc-363e","usc-361"],"explain":"§ 1326(a)(1)(B) sends the post-petition portion of a personal-property lease directly to the lessor, reducing the trustee payment, with proof to the trustee. Section 1326(a)(3) only lets the court modify the amounts.","quip":"The Jeep goes topless; the lessor does not go payless."},{"id":"ap-3","topic":"adequate-protection-and-vehicles","level":2,"prompt":"Shonda Bethea's 2021 Silverado is worth $24,000 on the petition date, and the purchase-money lender is owed $31,000. In a Wilmington case, how is pre-confirmation adequate protection presumptively paid, and how much?","answer":"lbr-3070-1c","options":["lbr-3070-1c","usc-1326a1","usc-1325a5biii","frbp-4001d"],"explain":"LBR 3070-1(c) routes purchase-money adequate protection through the trustee at a presumptive minimum of 1% of petition-date value, at least $240 here (the rule sets the floor but no payment period), with the trustee valuing the collateral and taking its fee. Section 1326(a)(1)(C) would send it directly to the lender 'unless the court orders otherwise', and the EDNC rule is that otherwise."},{"id":"ap-4","topic":"adequate-protection-and-vehicles","level":1,"prompt":"It's day 58. The finance company on Shonda's truck calls asking for her insurance declarations page. What provision says she owes it to them by day 60?","answer":"usc-1326a4","options":["usc-1326a4","usc-1326a1","usc-363e","usc-362d1"],"explain":"§ 1326(a)(4) requires a debtor keeping leased or purchase-money collateral to provide reasonable evidence of required insurance within 60 days after filing and for as long as she keeps it. A lapse would later support a § 362(d)(1) motion.","quip":"Day 60 is when the declarations page stops being optional."},{"id":"ap-5","topic":"adequate-protection-and-vehicles","level":2,"prompt":"Clarence Faircloth's Chapter 13 is dismissed before confirmation with $3,100 of plan payments on hand. You have an allowed § 503(b) fee claim. What does the trustee do with the money under the Code?","answer":"usc-1326a2","options":["usc-1326a2","usc-1326a3","usc-1326a1","lbr-3070-1c"],"explain":"§ 1326(a)(2) has the trustee return pre-confirmation payments to the debtor if confirmation is denied, after deducting unpaid allowed § 503(b) claims. Section 1326(a)(3) is about changing the payment amounts pending confirmation."},{"id":"ap-6","topic":"adequate-protection-and-vehicles","level":2,"prompt":"A credit union says the trustee's 1% pre-confirmation payment on the Faircloths' depreciating RV is inadequate and asks the court to raise it before confirmation. Under what Code paragraph?","answer":"usc-1326a3","options":["usc-1326a3","usc-362d1","usc-1325a5biii","usc-1326a2"],"explain":"§ 1326(a)(3) lets the court, subject to § 363 and after notice and a hearing, modify, increase or reduce pre-confirmation payments. Section 362(d)(1) is the heavier tool if the creditor wants the RV back."},{"id":"ap-7","topic":"adequate-protection-and-vehicles","level":1,"prompt":"Negotiating with a servicer, you propose a replacement lien on Gus's paid-off boat trailer instead of extra cash. Which section lists that as a recognized form of adequate protection?","answer":"usc-361","options":["usc-361","usc-363e","usc-1326a1","case-timbers"],"explain":"§ 361 lists periodic cash payments, an additional or replacement lien, and other relief giving the indubitable equivalent, excluding an administrative expense. Section 363(e) is the creditor's right to demand adequate protection."},{"id":"ap-8","topic":"adequate-protection-and-vehicles","level":2,"prompt":"A lender with a lien on the work van Javier Ocasio uses for his landscaping business doesn't want the van back, only to make sure he keeps it insured and paid while he drives it. What provision lets the court condition his use?","answer":"usc-363e","options":["usc-363e","usc-362d1","usc-1326a3","usc-1326a4"],"explain":"§ 363(e) requires the court, on request, to prohibit or condition use as necessary to provide adequate protection, and § 363(p)(1) puts the burden on the trustee. Section 362(d)(1) would lift the stay rather than condition use.","quip":"Keep the van, keep the mulch, keep the policy current."},{"id":"ap-9","topic":"adequate-protection-and-vehicles","level":3,"prompt":"The lender on Ernest Bowden's $40,000 bass boat, worth $28,000, demands 'interest on our collateral for the delay you're causing' as adequate protection. What case says no?","answer":"case-timbers","options":["case-timbers","case-robbins","case-strumpf","usc-361"],"explain":"Timbers held an undersecured creditor is not entitled under § 362(d)(1) to interest for the delay in foreclosing; adequate protection protects against decline in collateral value. Section 361 lists methods but does not answer what must be protected.","quip":"Adequate protection covers depreciation, not impatience."},{"id":"ap-10","topic":"adequate-protection-and-vehicles","level":2,"prompt":"Your confirmed-plan treatment of Shonda's Silverado proposes $150 a month for the first year and $600 a month thereafter. The car lender objects. What provision does the step-up offend?","answer":"usc-1325a5biii","options":["usc-1325a5biii","usc-1326a1","lbr-3070-1c","usc-361"],"explain":"§ 1325(a)(5)(B)(iii) requires periodic payments on a secured claim to be in equal monthly amounts and, for personal property, enough to provide adequate protection during the plan. Section 1326(a)(1) governs pre-confirmation payments."},{"id":"ap-11","topic":"adequate-protection-and-vehicles","level":2,"prompt":"After a lapse in insurance, you and the car lender agree to a consent order: proof of coverage, $300 a month in adequate protection, and stay relief on 14 days' default notice. What rule governs the motion to approve that agreement?","answer":"frbp-4001d","options":["frbp-4001d","frbp-4001a4","frbp-9014","lbr-4001-1c"],"explain":"Rule 4001(d) governs approval of agreements to provide adequate protection or modify the stay: attach the agreement and proposed order, 14 days to object, hearing on 7 days' notice if someone objects. Rule 4001(a)(4) is the 14-day stay of an order granting relief."},{"id":"ap-12","topic":"adequate-protection-and-vehicles","level":2,"prompt":"Javier also financed a $1,800 zero-turn mower from a dealer that holds a purchase-money lien. Will the trustee pay pre-confirmation adequate protection on it?","answer":"lbr-3070-1c","options":["lbr-3070-1c","usc-1326a1","usc-1326a3","usc-363e"],"explain":"LBR 3070-1(c) says the trustee need not make pre-confirmation adequate-protection payments on a claim whose secured value is under $2,000.00. Section 1326(a)(1)(C) states the general duty that the local rule implements.","quip":"Under two grand, the mower waits its turn like everybody else."},{"id":"co-1","topic":"claims-objections","level":1,"prompt":"Zombie Receivables Fund IV files a $2,180 claim in Earl Beaufort's Chapter 13. Nobody objects, and the trustee starts paying it pro rata. What made that claim payable without anyone lifting a finger?","answer":"usc-502a","options":["usc-502a","frbp-3001f","frbp-3007","usc-502b"],"explain":"Section 502(a) deems a filed claim allowed unless a party in interest objects; Rule 3001(f) only governs the claim's evidentiary weight once someone does object.","quip":"In bankruptcy, silence isn't golden - it's pro rata."},{"id":"co-2","topic":"claims-objections","level":1,"prompt":"The Zombie Receivables claim's attached statement shows Earl's last payment was in 2015 and the account was charged off in 2016, well past the limitations period. What Code provision is your ground for disallowance?","answer":"usc-502b","options":["usc-502b","case-midland","frbp-3001c4","usc-502a"],"explain":"Section 502(b)(1) disallows a claim unenforceable under applicable law; Midland says filing such a claim isn't an FDCPA violation, which is exactly why the objection is your remedy."},{"id":"co-3","topic":"claims-objections","level":2,"prompt":"Perpetual Recovery Partners files a credit card claim against Tammy Topsail with a balance and nothing else - no seller name, no last-payment or charge-off date. Which rule required that information?","answer":"frbp-3001c4","options":["frbp-3001c4","frbp-3001f","frbp-3007","frbp-3002c"],"explain":"Rule 3001(c)(4) (renumbered (c)(3) on Dec. 1, 2026) requires the five-item statement for open-end or revolving consumer credit claims; 3001(f) is the prima facie presumption, which a noncompliant claim may not fully earn."},{"id":"co-4","topic":"claims-objections","level":1,"prompt":"In Reggie Kure's voluntary Chapter 13, Cape Fear Credit Union (properly noticed, unsecured) files its claim on day 78 after the petition. Which rule set the deadline it missed?","answer":"frbp-3002c","options":["frbp-3002c","usc-502b","frbp-3004","frbp-3008"],"explain":"Rule 3002(c) makes a claim timely if filed within 70 days after the order for relief; § 502(b)(9) is the Code ground you cite to disallow it, but the 70 days come from the rule."},{"id":"co-5","topic":"claims-objections","level":2,"prompt":"You're drafting the objection to Cape Fear Credit Union's day-78 claim. Which Code subsection is the substantive ground for disallowing a late claim?","answer":"usc-502b","options":["usc-502b","frbp-3002c","usc-502a","frbp-3008"],"explain":"Section 502(b)(9) disallows a claim whose proof was not timely filed except as the Code or rules permit; Rule 3002(c) supplies the deadline, § 502(b)(9) supplies the consequence."},{"id":"co-6","topic":"claims-objections","level":2,"prompt":"Pam Wrightsville's plan pays her co-signed loan with her sister so Sis isn't chased - but the lender never filed a claim and the 70 days just ran. What lets you file the claim for it?","answer":"frbp-3004","options":["frbp-3004","lbr-3004-1","frbp-3002c","frbp-3008"],"explain":"Rule 3004 lets the debtor or trustee file for a creditor within 30 days after the creditor's time expires; LBR 3004-1 only addresses the creditor's later amendment.","quip":"The one time you'll file a claim against your own client - and mean it."},{"id":"co-7","topic":"claims-objections","level":2,"prompt":"After you file a $3,000 placeholder claim for the co-signed lender under Rule 3004, the lender wakes up and files its own $4,400 claim in the EDNC case. Which authority lets the lender do that?","answer":"lbr-3004-1","options":["lbr-3004-1","frbp-3004","frbp-3008","usc-502a"],"explain":"EDNC LBR 3004-1 lets a creditor whose claim was filed by the debtor or trustee file an amended claim under Rule 3002 or 3003(c); Rule 3004 itself only authorizes the debtor's or trustee's filing."},{"id":"co-8","topic":"claims-objections","level":2,"prompt":"Fourteen different creditors in Gus Masonboro's case filed after the bar date. Can you knock them all out with one objection?","answer":"frbp-3007","options":["frbp-3007","frbp-3002c","usc-502b","frbp-3008"],"explain":"Rule 3007(d) allows an omnibus objection on the ground the claims were not timely filed, and (e) caps each omnibus objection at 100 claims and sets its form requirements."},{"id":"co-9","topic":"claims-objections","level":2,"prompt":"You object to a claim filed by an FDIC-insured national bank. Besides mailing the objection to the notice address on its proof of claim, what does the objection rule require?","answer":"frbp-3007","options":["frbp-3007","ednc-adminguide","frbp-3008","frbp-3001f"],"explain":"Rule 3007(a) requires service under Rule 7004(h) on an FDIC-insured depository institution and filing/service at least 30 days before the hearing; the EDNC service chart just points back to Rule 3007(a)(2)."},{"id":"co-10","topic":"claims-objections","level":3,"prompt":"Earl wants to countersue Zombie Receivables under the FDCPA for filing a claim on a debt that was obviously time-barred. What's the controlling answer?","answer":"case-midland","options":["case-midland","case-dubois","case-raleigh","usc-502b"],"explain":"Midland Funding (2017) holds that filing an obviously time-barred claim in Chapter 13 doesn't violate the FDCPA; Dubois reached the same result in the Fourth Circuit a year earlier, but the Supreme Court's decision now controls nationally."},{"id":"co-11","topic":"claims-objections","level":3,"prompt":"In a Fourth Circuit case, which decision held that filing a proof of claim IS debt-collection activity covered by the FDCPA, even though filing a time-barred one wasn't a violation?","answer":"case-dubois","options":["case-dubois","case-midland","frbp-3001f","case-raleigh"],"explain":"Dubois v. Atlas Acquisitions held a proof of claim is debt-collection activity but a time-barred claim isn't a violation where the limitations period doesn't extinguish the debt; Midland addressed the violation question, not that threshold point."},{"id":"co-12","topic":"claims-objections","level":3,"prompt":"You object to a state tax claim in Delia Oak Island's case and argue the taxing authority must prove every element because it's the claimant. Which authority says otherwise if the tax law puts the burden on the taxpayer?","answer":"case-raleigh","options":["case-raleigh","frbp-3001f","usc-502a","case-midland"],"explain":"Raleigh holds the burden of proof on a tax claim in bankruptcy stays where the substantive law puts it; Rule 3001(f) only gives a proper claim prima facie effect.","quip":"Bankruptcy changes a lot of things. Not who carries the burden."},{"id":"co-13","topic":"claims-objections","level":2,"prompt":"Six months after the court entered an order allowing Bayside Collections' claim in Reggie Kure's case, Reggie finds his settlement letter showing that debt was released before he filed. What's the procedural vehicle?","answer":"frbp-3008","options":["frbp-3008","frbp-3007","usc-502a","frbp-3004"],"explain":"Once an order has allowed the claim, Rule 3008 (with § 502(j)'s 'for cause' standard) is the motion to reconsider it; a Rule 3007 objection is the tool for a claim that no order has yet allowed."},{"id":"co-14","topic":"claims-objections","level":2,"prompt":"Tammy's objection to a fully documented signed medical-debt claim says only 'Debtor does not recognize this debt.' Why is she likely to lose?","answer":"frbp-3001f","options":["frbp-3001f","usc-502a","frbp-3001c4","case-raleigh"],"explain":"A proof of claim signed and filed per the rules is prima facie evidence of validity and amount under Rule 3001(f), so a bare denial doesn't rebut it; § 502(a) is the deemed-allowed rule, which an objection displaces."},{"id":"mc-1","topic":"mortgage-claims-3002-1","level":1,"prompt":"Marisol Hatteras is three payments behind on her Wilmington house and wants to keep it through Chapter 13. What Code provision lets the plan cure the arrears while she keeps paying the regular installment?","answer":"usc-1322b5","options":["usc-1322b5","usc-506b","usc-1322e","frbp-3002-1b"],"explain":"Section 1322(b)(5) allows curing a default within a reasonable time and maintaining payments on a claim whose last payment falls after the plan ends; § 1322(e) only sets how the cure amount is measured."},{"id":"mc-2","topic":"mortgage-claims-3002-1","level":1,"prompt":"Lighthouse Loan Servicing's escrow analysis raises Marisol's payment by $142 starting April 1. When must the servicer file its notice?","answer":"frbp-3002-1b","options":["frbp-3002-1b","frbp-3002-1c","frbp-3002-1g","lbr-3070-2"],"explain":"Rule 3002.1(b)(1) requires the payment change notice at least 21 days before the new payment is due; 3002.1(c) is for postpetition fees and charges, not payment amounts.","quip":"Twenty-one days: long enough to object, short enough to ruin a budget."},{"id":"mc-3","topic":"mortgage-claims-3002-1","level":2,"prompt":"Lighthouse files a Form 410S-2 listing $650 in postpetition 'property inspection' and attorney fees incurred five months ago. Which provision governs both its deadline and yours to challenge it?","answer":"frbp-3002-1c","options":["frbp-3002-1c","frbp-3002-1b","frbp-3002-1h","usc-506b"],"explain":"Rule 3002.1(c) requires the itemized fee notice within 180 days after the fees are incurred, and (e) gives a party one year after service to move to determine whether they're owed; § 506(b) is the substantive fee entitlement, not the procedure."},{"id":"mc-4","topic":"mortgage-claims-3002-1","level":2,"prompt":"Lighthouse files a payment-increase notice only 10 days before the new payment date. When does the higher payment kick in?","answer":"frbp-3002-1b","options":["frbp-3002-1b","frbp-3002-1h","frbp-3002-1c","lbr-3070-2"],"explain":"Since Dec. 1, 2025, Rule 3002.1(b)(3)(A) makes a late increase effective only on the first due date at least 21 days after the late notice; sanctions under (h) are a separate tool for failures to give required information."},{"id":"mc-5","topic":"mortgage-claims-3002-1","level":2,"prompt":"In year three, Gus Masonboro wants to refinance and needs to know whether the court will treat his mortgage arrears as paid. What new tool lets him get a ruling now instead of at discharge?","answer":"frbp-3002-1f","options":["frbp-3002-1f","frbp-3002-1g","frbp-3002-1c","frbp-3001c2"],"explain":"Rule 3002.1(f), added Dec. 1, 2025, lets the debtor or trustee move to determine the claim's status any time before the trustee's end-of-case notice; (g) is the end-of-case procedure."},{"id":"mc-6","topic":"mortgage-claims-3002-1","level":1,"prompt":"Marisol makes her final plan payment to the trustee. Under the national rule, what happens next, and on what clock?","answer":"frbp-3002-1g","options":["frbp-3002-1g","frbp-3002-1f","lbr-3070-2","frbp-3002-1h"],"explain":"Rule 3002.1(g)(1) requires the trustee's notice of disbursements made within 45 days after the debtor completes all payments to the trustee, followed by the holder's 28-day response; LBR 3070-2 adds EDNC-specific steps on top."},{"id":"mc-7","topic":"mortgage-claims-3002-1","level":2,"prompt":"Marisol's EDNC plan paid her ongoing mortgage as Conduit Payments through the trustee. At completion, what does the local rule require the trustee to file beyond the (g)(1) notice?","answer":"lbr-3070-2","options":["lbr-3070-2","frbp-3002-1g","frbp-3002-1f","frbp-3002c6"],"explain":"EDNC LBR 3070-2(e)(3) requires the trustee in conduit plans to file a motion under Rule 3002.1(g)(4)(A); the national rule makes that motion optional for the debtor or trustee."},{"id":"mc-8","topic":"mortgage-claims-3002-1","level":3,"prompt":"Lighthouse ignored the trustee's end-of-case notice, then after discharge sends Marisol a $4,200 'escrow shortage' demand. What gives you the remedy in the bankruptcy court?","answer":"frbp-3002-1h","options":["frbp-3002-1h","frbp-3002-1g","frbp-3001c2","usc-506b"],"explain":"Rule 3002.1(h) lets the court preclude the holder from using omitted information and award fees and other relief when it fails to give required notice or respond; (g) sets the steps it skipped.","quip":"Servicer silence is admissible - against the servicer."},{"id":"mc-9","topic":"mortgage-claims-3002-1","level":1,"prompt":"Lighthouse's mortgage proof of claim in an individual Chapter 13 must attach which official form showing the arrearage and payment history?","answer":"frbp-3001c2","options":["frbp-3001c2","frbp-3002c6","frbp-3002-1b","frbp-3001c4"],"explain":"Rule 3001(c)(2)(C) requires the Mortgage Proof of Claim Attachment (Form 410A) and an escrow statement as of the petition date; 3001(c)(4)'s open-end statement does not apply to real-property-secured claims."},{"id":"mc-10","topic":"mortgage-claims-3002-1","level":2,"prompt":"Lighthouse files its claim with Form 410A on day 65, then files the note and recorded deed of trust as a supplement on day 110. Timely?","answer":"frbp-3002c6","options":["frbp-3002c6","frbp-3002c","frbp-3001c2","frbp-3002-1c"],"explain":"Rule 3002(c)(6) treats a principal-residence claim as timely if the claim and 3001(c)(2)(C) attachments come within 70 days and the 3001(c)(1) and (d) documents within 120 days - both deadlines met here."},{"id":"mc-11","topic":"mortgage-claims-3002-1","level":3,"prompt":"Lighthouse's 2019 note says nothing about interest on arrears, but its claim adds 6% interest on the cure amount. What controls?","answer":"usc-1322e","options":["usc-1322e","case-rake","usc-506b","usc-1322b5"],"explain":"Section 1322(e) fixes the cure amount by the underlying agreement and nonbankruptcy law for agreements after Oct. 22, 1994; Rake v. Wade's contrary rule was displaced for those loans."},{"id":"mc-12","topic":"mortgage-claims-3002-1","level":3,"prompt":"Which Supreme Court decision on interest on mortgage arrearages did Congress displace by enacting § 1322(e) in 1994?","answer":"case-rake","options":["case-rake","case-raleigh","case-midland","usc-1322b5"],"explain":"Rake v. Wade (1993) required interest on arrears for an oversecured mortgagee even if the mortgage was silent; § 1322(e) now defers to the agreement for post-Oct. 22, 1994 loans."},{"id":"mc-13","topic":"mortgage-claims-3002-1","level":2,"prompt":"Seagrass Landing HOA is oversecured and adds its lawyer's fees to its claim, citing its declaration and state statute. What Code provision is the source - and the limit - of that add-on?","answer":"usc-506b","options":["usc-506b","frbp-3002-1c","usc-1322e","usc-502b"],"explain":"Section 506(b) allows an oversecured creditor interest plus reasonable fees, costs or charges provided under the agreement or State statute; 'reasonable' and 'oversecured' are your objection hooks."},{"id":"dx-1","topic":"rule-2004-discovery","level":1,"prompt":"At Bertie Swansboro's 341 meeting, a creditor's lawyer wants to ask under oath where the bass boat went. What gives the creditor that right?","answer":"usc-343","options":["usc-343","usc-341","frbp-2004b","frbp-9016"],"explain":"Section 343 requires the debtor to submit to examination under oath at the § 341(a) meeting and lets creditors examine; § 341 creates the meeting itself."},{"id":"dx-2","topic":"rule-2004-discovery","level":1,"prompt":"Bertie asks whether the bankruptcy judge will be at the 341 meeting to keep the creditor's lawyer in line. What's the answer's source?","answer":"usc-341","options":["usc-341","usc-343","lbr-2004-1","frbp-2004b"],"explain":"Section 341(c) says the court may not preside at or attend
