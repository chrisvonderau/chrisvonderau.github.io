<script>

/* ---- art.js ---- */
/* HIVEBREAKER - art.js
 * Defines window.ART (sprites), window.FX (particles + pixel font), window.BG (space backdrop + post).
 * All art is original and generated in code: pixel sprites from character grids or per-pixel
 * functions, rendered once into small offscreen canvases and drawn scaled with smoothing off.
 * Modern polish (bloom halos, sparks, rings, scanlines) uses pre-rendered glow canvases drawn
 * additively; nothing uses shadowBlur or getImageData per frame.
 */
(function () {
  'use strict';

  var PX = 2;                 // playfield units per sprite pixel
  var TAU = Math.PI * 2;
  var EMPTY = {};

  // ------------------------------------------------------------------ helpers
  function mk(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  }
  function wrapH(h) { return ((h % 360) + 360) % 360; }
  function hsl(h, s, l, a) {
    h = Math.round(wrapH(h));
    return a == null ? 'hsl(' + h + ',' + s + '%,' + l + '%)' : 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
  }
  function hslRgb(h, s, l) {
    h = wrapH(h) / 360; s /= 100; l /= 100;
    function f(n) {
      var k = (n + h * 12) % 12;
      var a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
    }
    return [f(0), f(8), f(4)];
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hash(x, y, s) {
    var n = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
    n = (n ^ (n >>> 13)) * 1274126177 | 0;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bayer(x, y) { return (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }

  // Mirror a list of left-half rows (last char is the centre column).
  function sym(rows) {
    return rows.map(function (r) { return r + r.slice(0, -1).split('').reverse().join(''); });
  }
  // Paint one or more grids (same size) with a palette into a canvas. Later layers draw on top.
  function paint(layers, pal) {
    if (typeof layers[0] === 'string') layers = [layers];
    var h = 0, w = 0;
    layers.forEach(function (rows) {
      h = Math.max(h, rows.length);
      rows.forEach(function (r) { w = Math.max(w, r.length); });
    });
    var c = mk(w, h), g = c.getContext('2d');
    layers.forEach(function (rows) {
      for (var y = 0; y < rows.length; y++) {
        var r = rows[y];
        for (var x = 0; x < r.length; x++) {
          var ch = r[x];
          if (ch === '.' || ch === ' ') continue;
          var col = pal[ch];
          if (!col) continue;
          g.fillStyle = col;
          g.fillRect(x, y, 1, 1);
        }
      }
    });
    return c;
  }
  // Paint from a per-pixel function fn(x,y) -> css colour or null.
  function paintFn(w, h, fn) {
    var c = mk(w, h), g = c.getContext('2d');
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var col = fn(x, y);
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
    return c;
  }
  // Solid-colour copy (used for white hit-flash variants).
  function tintCopy(src, color) {
    var c = mk(src.width, src.height), g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  // Separable box blur on a float alpha buffer (init time only).
  function boxBlur(a, w, h, r) {
    if (r < 1) return;
    var tmp = new Float32Array(a.length), x, y, i, acc, span = r * 2 + 1;
    for (y = 0; y < h; y++) {
      acc = 0; var row = y * w;
      for (x = -r; x <= r; x++) acc += a[row + clamp(x, 0, w - 1)];
      for (x = 0; x < w; x++) {
        tmp[row + x] = acc / span;
        acc += a[row + Math.min(x + r + 1, w - 1)] - a[row + Math.max(x - r, 0)];
      }
    }
    for (x = 0; x < w; x++) {
      acc = 0;
      for (y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (y = 0; y < h; y++) {
        a[y * w + x] = acc / span;
        acc += tmp[Math.min(y + r + 1, h - 1) * w + x] - tmp[Math.max(y - r, 0) * w + x];
      }
    }
  }
  // Pre-render a soft bloom halo for a pixel sprite. rgb = [r,g,b]. Result is centred on the sprite
  // and carries ._pw/_ph = size in sprite pixels (incl. padding).
  var GR = 2; // glow canvas resolution per sprite pixel
  function glowOf(src, rgb, pad, radius, strength) {
    var W = (src.width + pad * 2) * GR, H = (src.height + pad * 2) * GR;
    var c = mk(W, H), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(src, pad * GR, pad * GR, src.width * GR, src.height * GR);
    var id = g.getImageData(0, 0, W, H), d = id.data, n = W * H, a = new Float32Array(n), i;
    for (i = 0; i < n; i++) a[i] = d[i * 4 + 3] / 255;
    var r = Math.max(1, Math.round(radius * GR));
    boxBlur(a, W, H, r); boxBlur(a, W, H, r); boxBlur(a, W, H, Math.max(1, r >> 1));
    for (i = 0; i < n; i++) {
      d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2];
      d[i * 4 + 3] = Math.min(255, a[i] * 255 * strength);
    }
    g.putImageData(id, 0, 0);
    c._pw = src.width + pad * 2; c._ph = src.height + pad * 2;
    return c;
  }
  // Radial glow dot (smooth) used for particles and lights.
  function glowDot(rgb, size, core) {
    var c = mk(size, size), g = c.getContext('2d'), r = size / 2;
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    var s = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',';
    if (core) gr.addColorStop(0, 'rgba(255,255,255,1)');

    gr.addColorStop(core ? 0.18 : 0.25, s + '0.85)');
    gr.addColorStop(0.5, s + '0.28)');
    gr.addColorStop(1, s + '0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function drawSpr(ctx, c, x, y, scale) {
    var s = (scale || 1) * PX, w = c.width * s, h = c.height * s;
    ctx.drawImage(c, x - w / 2, y - h / 2, w, h);

    if (alpha <= 0.003) return;
    var s = (scale || 1) * PX, w = gl._pw * s, h = gl._ph * s;
    ctx.globalAlpha = alpha;
    ctx.drawImage(gl, x - w / 2, y - h / 2, w, h);

  var SHIP_ENGINES = [[-3, 18], [-6, 16], [-1, 14]]; // engine pixel offsets (from centre col) and row of nozzle
  var WHO_HUE = [186, 312, 96];
  function shipPalette(who) {
    if (who === 0) return {
      k: '#071226', g: hsl(214, 22, 30), h: hsl(208, 18, 55), l: hsl(200, 26, 78), w: '#f2fbff',
      a: hsl(186, 100, 46), A: hsl(180, 100, 78), c: hsl(205, 80, 18), C: hsl(184, 100, 82),
      e: hsl(186, 100, 72), n: hsl(210, 30, 18)
    };
    if (who === 1) return {
      k: '#16061e', g: hsl(270, 18, 24), h: hsl(265, 12, 44), l: hsl(270, 18, 66), w: '#fff2fd',
      a: hsl(314, 100, 54), A: hsl(318, 100, 80), c: hsl(290, 70, 16), C: hsl(320, 100, 84),
      e: hsl(312, 100, 75), n: hsl(280, 30, 16)
    };
    return {
      k: '#0b1606', g: hsl(150, 14, 24), h: hsl(130, 10, 44), l: hsl(110, 16, 66), w: '#f6fff0',
      a: hsl(96, 90, 46), A: hsl(90, 100, 74), c: hsl(140, 60, 15), C: hsl(95, 100, 80),
      e: hsl(96, 100, 70), n: hsl(140, 30, 14)
    };
  }
  // Build a banked frame by foreshortening one wing in pixel space (dir=1 banks right).
  var DARKER = { l: 'h', h: 'g', w: 'l', A: 'a', a: 'g', C: 'c' };
  var LIGHTER = { g: 'h', h: 'l', a: 'A' };
  function bankRows(rows, dir, amt) {
    var w = rows[0].length, c = (w - 1) / 2, out = [];
    for (var y = 0; y < rows.length; y++) {
      var src = rows[y], line = [];
      for (var i = 0; i < w; i++) line.push('.');
      // near side untouched (lightened), far side compressed and darkened
      for (var x = 0; x < w; x++) {
        var ch = src[x]; if (ch === '.') continue;
        var off = x - c;
        var far = dir > 0 ? off > 0 : off < 0;
        var nx = x;
        if (far) nx = Math.round(c + off * amt);
        else if (Math.abs(off) > 0) nx = Math.round(c + off * (1 + (1 - amt) * 0.12));
        nx = clamp(nx, 0, w - 1);
        var outCh = ch;
        if (far && Math.abs(off) > 1) outCh = DARKER[ch] || ch;
        else if (!far && Math.abs(off) > 1) outCh = LIGHTER[ch] || ch;
        // outer pixels win (iterate centre outward handled by priority on outline)
        if (line[nx] === '.' || ch === 'k' || Math.abs(off) >= Math.abs(line[nx + '_o'] || 0)) {
          line[nx] = outCh; line[nx + '_o'] = off;
        }
      }
      var s = '';
      for (i = 0; i < w; i++) s += line[i];
      out.push(s);
    }
    return out;
  }
  function buildShips() {
    S.ship = [];
    for (var who = 0; who < 3; who++) {
      var pal = shipPalette(who), rows = SHIP_GRIDS[who];
      var frames = [bankRows(rows, -1, 0.45), bankRows(rows, -1, 0.72), rows, bankRows(rows, 1, 0.72), bankRows(rows, 1, 0.45)];
      var rgb = hslRgb(WHO_HUE[who], 100, 58);
      var set = { spr: [], white: [], glow: null, hue: WHO_HUE[who] };
      for (var f = 0; f < 5; f++) {
        var c = paint(frames[f], pal);
        set.spr.push(c); set.white.push(tintCopy(c, '#ffffff'));
      }
      set.glow = glowOf(set.spr[2], rgb, 6, 2.6, 0.9);
      // engine flames: 3 frames, 5x9 px, drawn additively
      set.flame = [];
      var fr = [
        ['.wAw.', '.wAw.', '.aAa.', '.aAa.', '..a..', '..a..', '..m..', '.....', '.....'],
        ['.wAw.', '.wAw.', '.aAa.', '.aAa.', '.aAa.', '..a..', '..a..', '..m..', '.....'],
        ['.wAw.', '.wAw.', '.aAa.', '.aaa.', '..a..', '..a..', '..m..', '..m..', '..m..']
      ];
      var fp = { w: '#ffffff', A: hsl(WHO_HUE[who] - 10, 100, 80), a: hsl(WHO_HUE[who], 100, 58), m: hsl(WHO_HUE[who] + 20, 100, 40) };
      for (f = 0; f < 3; f++) set.flame.push(paint(fr[f], fp));
      set.flameGlow = glowDot(rgb, 32, true);
      // shield bubble (2 frames) r=15px
      set.shield = [];
      for (f = 0; f < 2; f++) {
        var R = 15.2, sz = 33;
        set.shield.push(paintFn(sz, sz, (function (ff) {
          return function (x, y) {
            var dx = x - 16, dy = y - 16, d = Math.sqrt(dx * dx + dy * dy);
            var ang = Math.atan2(dy, dx), seg = Math.floor((ang / TAU + 1) * 12 + ff * 0.5);
            if (Math.abs(d - R) < 0.75) return (seg % 2) ? hsl(WHO_HUE[who], 100, 70, 0.95) : hsl(WHO_HUE[who] - 10, 100, 88, 1);
            if (Math.abs(d - (R - 1.6)) < 0.5 && seg % 3 === ff) return hsl(WHO_HUE[who], 100, 60, 0.5);
            if (d < R - 2 && ((x + y * 2 + ff) % 6 === 0) && (y % 3 === 0)) return hsl(WHO_HUE[who], 100, 70, 0.22);

          };

  }

  ART.ship = function (ctx, x, y, who, tilt, t, o) {
    o = o || EMPTY;

      drawShip(ctx, x + 21, y, who, tilt, t, o);

  function drawShip(ctx, x, y, who, tilt, t, o) {
    var set = S.ship[who];
    tilt = tilt || 0; t = t || 0;
    var f = tilt < -0.7 ? 0 : tilt < -0.25 ? 1 : tilt > 0.7 ? 4 : tilt > 0.25 ? 3 : 2;
    var spr = set.spr[f];
    var hh = spr.height * PX;
    var thrust = o.thrust == null ? 0.5 : o.thrust;
    var eng = SHIP_ENGINES[who];
    var ex = eng[0] * PX, ey = y - hh / 2 + eng[1] * PX + 2;
    var fl = set.flame[((t * 20) | 0) % 3];

    var bankShift = (f - 2) * 1.5;
    addMode(ctx);
    // bloom halo
    drawGlow(ctx, set.glow, x, y, 1, 0.55 + thrust * 0.15);

      ctx.imageSmoothingEnabled = false;

      addMode(ctx);
      drawGlow(ctx, set.shieldGlow, x, y + 2, 1, 0.55 * pulse);
      normMode(ctx);
      ctx.globalAlpha = 0.65 + 0.35 * pulse;
      drawSpr(ctx, set.shield[((t * 8) | 0) % 2], x, y + 2);
      ctx.globalAlpha = 1;
    }
  }
  ART.shipIcon = function (ctx, x, y, who) {

    ctx.imageSmoothingEnabled = false;
    drawSpr(ctx, set.spr[2], x, y, 0.5);
  };

  // ------------------------------------------------------------- enemies

  // ---------------------------------------------------------------- collisions

function damageEnemy(e, dmg, p, viaBomb) {

// ------------------------------------------------------------------ stage flow
function startGame(mode, opts) {

  if (G.players[1] && G.players[1].ctrl === 'human') p_name2();

function p_name2(p) { p = p || G.players[1]; if (p) p.name = LS.get('chromahive.callsign2', 'P2'); }

function nextStage(first) {

  G.enemies.length = 0; G.eb.length = 0; G.pb.length = 0; G.spawnQ = []; G.st = 0; G.entryEnd = 99;
  G.diveT = 2.5; G.bossLive = false; F.breath = 0; G.paradeHits = 0; G.paradeGroups = null; G.cleared = false; G.clearT = 0; G.tally = null;
  G.stats.bombsUsedStage = 0; G.bgSpeed = 1;

  if (first) placePlayers();

  const kindName = { normal: '', boss: 'HIVE QUEEN APPROACHING', parade: 'SWARM PARADE', asteroid: 'ASTEROID RUN' }[G.kind];
  const sub = { normal: G.stage === 1 ? 'GET READY' : 'GET READY', boss: 'DESTROY THE PODS, THEN THE CORE', parade: 'THEY WON\'T SHOOT. HIT ALL 40!', asteroid: 'TWIN SURGE! DODGE AND MINE THE FIELD' }[G.kind];
  G.banner('STAGE ' + G.stage, kindName ? kindName + ' - ' + sub : sub, 2.4, G.kind === 'normal' ? '#7ff' : G.kind === 'boss' ? '#ff6a6a' : '#ffd54a');

  else if (G.kind === 'parade') buildParade();

function buildNormalLite() {
  const s = G.stage, slots = [];

function stageCleared() {
  G.cleared = true; G.clearT = 0;
  const lines = []; let bonus = 0;
  const humans = G.players.filter((p) => !p.out);
  if (G.kind === 'parade') {
    const tot = G.paradeGroups ? G.paradeGroups.reduce((a, g) => a + g.n, 0) : 35;
    lines.push(['HITS', G.paradeHits + ' / ' + tot]);
    let b = G.paradeHits * 120;
    for (const g of G.paradeGroups || []) if (g.hit >= g.n) b += 1500;
    if (G.paradeHits >= tot) { b += 12000; lines.push(['PERFECT!', '+12,000']); ach('perfect'); sfx('perfect'); for (const p of humans) p.bombs = Math.min(5, p.bombs + 1); }
    lines.push(['BONUS', comma(b)]); bonus = b;
    // credit by share of hits
    const tot2 = humans.reduce((a, p) => a + (p.paradeHits || 0), 0) || 1;
    for (const p of humans) G.award(p, Math.round(b * (p.paradeHits || 0) / tot2));
  } else if (G.kind === 'asteroid') {

  } else {
    for (const p of humans) {
      if (p.stageDeaths === 0 && p.alive) { G.award(p, 2000); lines.push([p.ctrl === 'ai' ? 'BOT FLAWLESS' : (p.who === 1 ? 'P2' : 'P1') + ' FLAWLESS', '+2,000']); }
      const acc = p.stageShots ? p.stageHits / p.stageShots : 0;
      if (p.ctrl === 'human' && acc >= 0.9 && p.stageShots > 20) ach('sharp');
    }

    if (G.mode === 'coop' && humans.filter((p) => p.ctrl === 'human').length > 1) ach('coop');
    const anyDeath = G.players.some((p) => p.stageDeaths > 0);

  if (G.players.some((p) => p.score >= 100000)) ach('100k');
}

// ------------------------------------------------------------------ simulation step
function tickPlay(dt, ctl) {
  G.st += dt; G.t += dt;
  // banner
  if (G.bannerObj) { G.bannerObj.t += dt; if (G.bannerObj.t > G.bannerObj.dur) G.bannerObj = null; }
  // spawns
  if (G.spawnQ.length) { for (let i = G.spawnQ.length - 1; i >= 0; i--) if (G.spawnQ[i].t <= G.st) { const q = G.spawnQ[i]; G.spawnQ.splice(i, 1); q.fn(); } }
  // formation movement
  const allIn = !G.spawnQ.length && !G.enemies.some((e) => e.state === 'enter' || e.state === 'toSlot');
  F.sway = Math.sin(G.st * 0.55) * (allIn ? 22 : 36);
  F.breath = lerp(F.breath, allIn ? 1 : 0, dt * 0.8);

  // players
  for (const p of G.players) updatePlayer(p, dt, ctl[p.i]);
  // enemies
  updateEnemies(dt);
  // bullets
  for (const b of G.pb) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -30 || b.x < -30 || b.x > W + 30) b.dead = true; }
  for (const b of G.eb) { b.x += b.vx * dt; b.y += b.vy * dt; b.t += dt; }
  // boss / module
  if (BOSS_ON()) { const r = safe(() => BOSS.update(G, dt)); if (r === 'done') { G.bossLive = false; } }
  const m = stageMod(); let modDone = false;
  if (m && G.modLive) { const r = safe(() => m.update(G, dt)); if (r === true) { G.modLive = false; modDone = true; } }
  collide();
  G.pb = G.pb.filter((b) => !b.dead);
  G.eb = G.eb.filter((b) => !b.dead && b.y < H + 30 && b.y > -40 && b.x > -40 && b.x < W + 40);
  G.enemies = G.enemies.filter((e) => !e.dead);
  // pickups
  for (const k of G.pickups) {
    k.t += dt; k.y += k.vy * dt; k.x += (k.vx || 0) * dt; if (k.vx) k.vx *= 0.98;
    for (const p of G.players) {
      if (!p.alive) continue;
      const hit = d2(k.x, k.y, p.x, p.y) < 30 * 30 || (p.twin && (d2(k.x, k.y, p.x - G.TWIN_DX / 2, p.y) < 900 || d2(k.x, k.y, p.x + G.TWIN_DX / 2, p.y) < 900));
      if (hit) { collect(p, k); k.dead = true; break; }
      // gem magnet
      if (k.kind === 'gem' && d2(k.x, k.y, p.x, p.y) < 110 * 110) { k.x = lerp(k.x, p.x, dt * 4); k.y = lerp(k.y, p.y, dt * 4); }
    }
  }
  G.pickups = G.pickups.filter((k) => !k.dead && k.y < H + 30);

  // dives
  if (G.kind === 'normal' || (G.kind === 'boss')) runDives(dt, allIn);

  // clear detection
  if (!G.cleared) {
    const noEnemies = !G.spawnQ.length && G.enemies.length === 0;
    if (G.kind === 'normal' && noEnemies && G.st > 2) stageCleared();
    else if (G.kind === 'parade' && noEnemies && G.st > 3) stageCleared();
    else if (G.kind === 'boss' && G.st > 4 && !G.bossLive && (!window.BOSS || !BOSS.active || G.bossDoneSeen)) { killAllEnemies(); stageCleared(); }
    else if (G.kind === 'asteroid' && modDone) stageCleared();
    if (G.kind === 'boss' && window.BOSS && G.st > 4 && !G.bossLive) G.bossDoneSeen = true;
  } else {
    G.clearT += dt;
    if (G.clearT > 1.0) G.bgSpeed = lerp(G.bgSpeed, 6, dt * 2);
    if (G.clearT > 3.6) { G.bgSpeed = 1; G.bossDoneSeen = false; nextStage(false); }
  }

  // game over
  if (!G.players.some((p) => !p.out && (p.ctrl === 'human' || G.testAI)) && !G.demo) {
    if (!G.overT) { G.overT = 0.001; music('gameover'); sfx('gameOver'); }
  }
  if (G.demo && !G.players.some((p) => !p.out)) { G.overT = G.overT || 0.001; }
  if (G.overT) { G.overT += dt; if (G.overT > 3) { G.overT = 0; endGame(); } }

  // timers
  G.shakeA = Math.max(0, G.shakeA - dt * 2.2); G.flashA = Math.max(0, G.flashA - dt * 2.5); G.aberr = Math.max(0, G.aberr - dt * 2);
  if (G.autoShotT > 0) G.autoShotT -= dt;
  let inten = 0; for (const e of G.enemies) if (e.state === 'dive') inten += 0.12; inten += G.eb.length / 70; if (BOSS_ON()) inten += 0.4;
  safe(() => AUDIO.setIntensity(clamp(inten, 0, 1)));
}
function killAllEnemies() { for (const e of G.enemies) { FX.explode(e.x, e.y, 1, EDEF[e.type].hue); } G.enemies.length = 0; G.eb.length = 0; }

function updatePlayer(p, dt, c) {
  if (p.out) return;
  if (!p.alive) {
    p.respawn -= dt;
    if (p.respawn <= 0 && !G.overT) {
      p.alive = true; p.inv = 2.4; p.x = clamp(W / 2 + (G.players.length > 1 ? (p.i ? 70 : -70) : 0), 30, W - 30); p.y = 735;
      if (G.kind === 'asteroid') p.twin = true;
      FX.ring(p.x, p.y, 60, hueOf(p));
    }
    return;
  }
  if (p.ctrl === 'ai') c = aiControl(p, dt);
  c = c || { mx: 0, my: 0, fire: false, bomb: false, dx: 0, dy: 0 };
  const sp = 390;
  const tvx = c.mx * sp, tvy = c.my * sp * 0.85;
  p.vx = lerp(p.vx, tvx, Math.min(1, dt * 18)); p.vy = lerp(p.vy, tvy, Math.min(1, dt * 18));

  p.thrust = clamp(-p.vy / sp, 0, 1) * 0.6 + 0.4;

  if (p.chainT > 0) { p.chainT -= dt; if (p.chainT <= 0) { p.chain = 0; p.mult = 1; } }
  const busy = G.cleared && G.clearT > 1.2;
  if (c.fire && p.cd <= 0 && !busy && !G.overT) fire(p);
  if (c.bomb) bomb(p);
  if (p.who !== 2 && Math.random() < dt * 25) FX.trail(p.x, p.y + 18, hueOf(p));

function aiControl(p, dt) {
  if (window.PILOT) {
    const r = safe(() => PILOT.control(G, p, dt, G.mode === 'versus' ? 0.75 : G.demo ? 0.85 : 0.68));
    if (r) return { mx: r.mx || 0, my: r.my || 0, fire: !!r.fire, bomb: !!r.bomb, dx: 0, dy: 0 };
  }
  // fallback: follow lowest enemy, fire
  let tx = W / 2; let best = -1; for (const e of G.enemies) if (e.y > best) { best = e.y; tx = e.x; }
  return { mx: clamp((tx - p.x) / 60, -1, 1), my: clamp((720 - p.y) / 60, -1, 1), fire: true, bomb: false };
}

function updateEnemies(dt) {
  const lvl = G.diff().lvl;
  for (const e of G.enemies) {
    const ox0 = e.x, oy0 = e.y;

        const [sx, sy] = slotPos(e.slot[0], e.slot[1]);
        const dx = sx - e.x, dy = sy - e.y, dd = Math.hypot(dx, dy), v = 300 * dt;
        if (dd <= v + 0.5) { e.x = sx; e.y = sy; e.state = 'form'; }

        break;
      }

      case 'dive': {
        if (followPath(e, dt)) {
          if (e.y > H) { e.x = e.slot ? slotPos(e.slot[0], e.slot[1])[0] : e.x; e.y = -40; e.state = e.slot ? 'return' : 'drop'; if (!e.slot) e.dead = true; }
          else e.state = e.slot ? 'toSlot' : 'drop';
        }
        if (e.fireYs && e.fireYs.length && e.y >= e.fireYs[0] && e.vy > 0) {
          e.fireYs.shift(); const near = G.nearestPlayer(e.x, e.y);
          if (near && near.y - e.y > 120) {

            if (e.type === 'mantis') { for (const a of [-0.2, 0, 0.2]) { const v = G.aimAt(e.x, e.y, sp, 0.05); const c = Math.cos(a), s = Math.sin(a); G.enemyShot(e.x, e.y + 10, v[0] * c - v[1] * s, v[0] * s + v[1] * c); } }
            else { const v = G.aimAt(e.x, e.y, sp); G.enemyShot(e.x, e.y + 10, v[0], v[1]); }
            sfx('enemyShot', { pan: pan(e.x), vol: 0.4 });

      }

  else safe(() => FX.update(dt));
  render(dt);
}

// pointer taps for menus (field coordinates)
cv.addEventListener('pointerdown', (e) => {
  safe(() => AUDIO.unlock());
  if (G.state === 'play' && !G.demo) return;
  G.tap = { x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale };
});
window.addEventListener('keydown', (e) => {
  safe(() => AUDIO.unlock());
  // type a callsign directly on the high-score screen
  if (G.state === 'initials' && G.ini && e.key && e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
    const ch = e.key.toUpperCase();
    if (ch !== ' ' && LETTERS.indexOf(ch) >= 0) { const I = G.ini; I.letters[I.pos] = ch; if (I.pos < 2) I.pos++; G.iniTyped = true; sfx('menuMove'); e.preventDefault(); }
  }
});
window.addEventListener('touchend', () => safe(() => AUDIO.unlock()), { passive: true });
window.addEventListener('pointerdown', () => safe(() => AUDIO.unlock()));

// test hooks
G.debug = {
  start: (mode, o) => startGame(mode, o || {}),
  god: (on) => { G.godMode = on !== false; },
  skip: () => { G.enemies.length = 0; G.spawnQ.length = 0; if (window.BOSS && G.bossLive) { G.bossLive = false; safe(() => { BOSS.active = false; }); } if (G.modLive) { G.modLive = false; } stageCleared(); },
  toTitle,
};

function boot() {
  resize();
  safe(() => ART.init());
  safe(() => INPUT.init(cv));
  safe(() => META.ach.define(ACH.map(([id, name, desc]) => ({ id, name, desc }))));
  G.challenge = safe(() => META.readChallenge()) || null;
  if (G.challenge) safe(() => META.clearChallenge());
  if (window.META && has(window.INPUT, 'padNav')) META.padReader = (gp) => INPUT.padNav(gp);
  if (window.BOSS && BOSS.tune) BOSS.tune.hp = 0.8; // QA: queen fights ran long
  toTitle();
  setTimeout(() => safe(() => window.STAGES && STAGES.asteroid && STAGES.asteroid.init && STAGES.asteroid.init()), 400);
  requestAnimationFrame((t) => { last = t; frame(t); });
}
boot(); // the script sits at the end of , so the canvas already exists
})();

;

</script>
