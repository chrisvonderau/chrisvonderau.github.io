<script>
(function(root){var TF=(root.TF=root.TF||{});TF.BANK=[{"id":"tf-hi-001","category":"History","difficulty":"easy","prompt":"In which year did the Second Continental Congress officially adopt the Declaration of Independence?","answers":[{"id":"tf-hi-001-a","text":"1776"},{"id":"tf-hi-001-b","text":"1787"},{"id":"tf-hi-001-c","text":"1781"}],"correctId":"tf-hi-001-a","explanation":"The Declaration of Independence was officially adopted on July 4, 1776, after revisions that ran through July 3 and into the late morning of July 4. That night John Dunlap printed the first broadside copies.","hint":"Twenty-six copies of the first printed version, the Dunlap broadside, are known to survive.","source":{"title":"The Declaration of Independence: A History (U.S. National Archives)","url":"https://www.archives.gov/founding-docs/declaration-history"},"verified":{"status":"verified","date":"2026-10-25","note":"National Archives history page states revisions ran into the late morning of July 4 [1776] when the Declaration was officially adopted; notes 26 surviving Dunlap broadsides."},"claims":{"tf-hi-001-a":"I'm going with 1776 — that year just feels like the founding moment.","tf-hi-001-b":"I'm going with 1787 — that year just feels like the founding moment too.","tf-hi-001-c":"I'm going with 1781 — that year lines up with the war's turning point."},"corrections":{"tf-hi-001-b":"1787 is when the U.S. Constitution was drafted; the Declaration was adopted in 1776.","tf-hi-001-c":"1781 is the year of the Yorktown surrender and the Articles of Confederation taking effect, not the Declaration's adoption."}},{"id":"tf-hi-002","category":"History","difficulty":"easy","prompt":"In which year did NASA's Apollo 11 mission land the first astronauts on the Moon?","answers":[{"id":"tf-hi-002-a","text":"1969"},{"id":"tf-hi-002-b","text":"1967"},{"id":"tf-hi-002-c","text":"1972"}],"correctId":"tf-hi-002-a","explanation":"Apollo 11 launched on July 16, 1969, and splashed down on July 24, 1969. Neil Armstrong became the first human to set foot on the Moon, joined on the surface by Buzz Aldrin while Michael Collins piloted the command module.","hint":"Michael Collins stayed in lunar orbit as command module pilot while his two crewmates walked on the surface.","source":{"title":"Apollo 11 (NASA)","url":"https://www.nasa.gov/mission/apollo-11/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA mission page lists launch July 16, 1969 and splashdown July 24, 1969; Armstrong first human on the Moon; Collins command module pilot."},"claims":{"tf-hi-002-a":"My instinct says 1969 — the late sixties feel right for the landing.","tf-hi-002-b":"My instinct says 1967 — the space race peaked in the mid-sixties.","tf-hi-002-c":"My instinct says 1972 — the Apollo era seems to center on the seventies."},"corrections":{"tf-hi-002-b":"1967 was the year of the Apollo 1 fire; the first landing came in 1969.","tf-hi-002-c":"1972 was the year of Apollo 17, the last crewed landing, not the first."}},{"id":"tf-hi-003","category":"History","difficulty":"easy","prompt":"On November 9 of which year did East Germany open its borders, leading to the fall of the Berlin Wall?","answers":[{"id":"tf-hi-003-a","text":"1991"},{"id":"tf-hi-003-b","text":"1989"},{"id":"tf-hi-003-c","text":"1985"}],"correctId":"tf-hi-003-b","explanation":"On November 9, 1989, the East German government announced the opening of its borders and crowds began bringing down the Berlin Wall. The U.S. State Department's Office of the Historian describes it as the most visible symbol of division at the heart of Europe.","hint":"It came two years after President Reagan's Berlin speech calling for the wall to come down.","source":{"title":"Fall of Communism in Eastern Europe, 1989 (U.S. Department of State, Office of the Historian)","url":"https://history.state.gov/milestones/1989-1992/fall-of-communism"},"verified":{"status":"verified","date":"2026-10-25","note":"Office of the Historian: on November 9, 1989 Germans brought down the Berlin Wall; references Reagan's 1987 Berlin speech."},"claims":{"tf-hi-003-a":"I'm confident it's 1991 — that's when the whole Soviet bloc came apart.","tf-hi-003-b":"I'm confident it's 1989 — the Cold War was cracking open by then.","tf-hi-003-c":"I'm confident it's 1985 — reform was sweeping the East by the mid-eighties."},"corrections":{"tf-hi-003-a":"1991 is when the Soviet Union dissolved; the Wall opened in 1989.","tf-hi-003-c":"1985 is when Gorbachev came to power; the Wall fell in 1989."}},{"id":"tf-hi-004","category":"History","difficulty":"medium","prompt":"On what date did President Abraham Lincoln issue the Emancipation Proclamation?","answers":[{"id":"tf-hi-004-a","text":"November 19, 1863"},{"id":"tf-hi-004-b","text":"January 1, 1863"},{"id":"tf-hi-004-c","text":"April 9, 1865"}],"correctId":"tf-hi-004-b","explanation":"Lincoln issued the Emancipation Proclamation on January 1, 1863, as the Civil War approached its third year. It declared enslaved people in the rebellious states free and announced the acceptance of Black men into the Union Army and Navy.","hint":"The proclamation also announced that Black men would be accepted into the Union Army and Navy.","source":{"title":"The Emancipation Proclamation (U.S. National Archives)","url":"https://www.archives.gov/exhibits/featured-documents/emancipation-proclamation"},"verified":{"status":"verified","date":"2026-10-25","note":"National Archives: Lincoln issued the Proclamation on January 1, 1863; it announced acceptance of Black men into the Union Army and Navy."},"claims":{"tf-hi-004-a":"I think it was November 19, 1863 — a date I tie to his big wartime words.","tf-hi-004-b":"I think it was January 1, 1863 — a fresh start for a new year of the war.","tf-hi-004-c":"I think it was April 9, 1865 — a date tied to the war's closing days."},"corrections":{"tf-hi-004-a":"November 19, 1863 is a later date in the war; the Proclamation was issued on January 1, 1863.","tf-hi-004-c":"April 9, 1865 is when Lee surrendered at Appomattox, not the date of the Proclamation."}},{"id":"tf-hi-005","category":"History","difficulty":"medium","prompt":"In which year was the 19th Amendment to the U.S. Constitution, guaranteeing women the right to vote, ratified?","answers":[{"id":"tf-hi-005-a","text":"1912"},{"id":"tf-hi-005-b","text":"1928"},{"id":"tf-hi-005-c","text":"1920"}],"correctId":"tf-hi-005-c","explanation":"Congress passed the 19th Amendment on June 4, 1919, and it was ratified on August 18, 1920. The amendment had first been introduced in Congress in 1878.","hint":"Congress passed it in June of the previous year, more than four decades after it was first introduced.","source":{"title":"19th Amendment to the U.S. Constitution: Women's Right to Vote (U.S. National Archives)","url":"https://www.archives.gov/milestone-documents/19th-amendment"},"verified":{"status":"verified","date":"2026-10-25","note":"National Archives: passed by Congress June 4, 1919, ratified August 18, 1920; first introduced 1878."},"claims":{"tf-hi-005-a":"I'm backing 1912 — the suffrage marches of that era were huge.","tf-hi-005-b":"I'm backing 1928 — women's voting rights feel like a late-twenties win.","tf-hi-005-c":"I'm backing 1920 — the suffrage push peaked around then."},"corrections":{"tf-hi-005-a":"1912 predates ratification; the 19th Amendment was ratified in 1920.","tf-hi-005-b":"1928 is when the UK equalized voting age for women; the U.S. amendment was ratified in 1920."}},{"id":"tf-hi-006","category":"History","difficulty":"medium","prompt":"Machu Picchu, the mountain citadel in Peru, was built by which civilization?","answers":[{"id":"tf-hi-006-a","text":"The Inca"},{"id":"tf-hi-006-b","text":"The Maya"},{"id":"tf-hi-006-c","text":"The Aztecs"}],"correctId":"tf-hi-006-a","explanation":"UNESCO describes Machu Picchu as one of the most outstanding achievements of the Inca Empire. It stands high in the Andes of Peru above the Urubamba River valley.","hint":"UNESCO notes that it stands 2,430 metres above sea level, in the middle of a tropical mountain forest.","source":{"title":"Historic Sanctuary of Machu Picchu (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/274/"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: 'probably the most amazing urban creation of the Inca Empire at its height'; stands 2,430 m above sea level."},"claims":{"tf-hi-006-a":"My instinct says the Inca — a mountain empire fits the Andes.","tf-hi-006-b":"My instinct says the Maya — master builders of grand stone cities.","tf-hi-006-c":"My instinct says the Aztecs — the great empire of the Americas."},"corrections":{"tf-hi-006-b":"The Maya lived in Mesoamerica (Mexico and Central America), not the Peruvian Andes.","tf-hi-006-c":"The Aztec Empire was centered in central Mexico; Machu Picchu is Inca."}},{"id":"tf-hi-007","category":"History","difficulty":"medium","prompt":"Marie Curie won her second Nobel Prize, in 1911, in which field?","answers":[{"id":"tf-hi-007-a","text":"Physiology or Medicine"},{"id":"tf-hi-007-b","text":"Chemistry"},{"id":"tf-hi-007-c","text":"Physics"}],"correctId":"tf-hi-007-b","explanation":"Marie Curie received the 1911 Nobel Prize in Chemistry for the discovery of the elements radium and polonium. Her first Nobel, in 1903, was in Physics, shared with Pierre Curie and Henri Becquerel.","hint":"The 1911 prize recognized her discovery of two elements, radium and polonium.","source":{"title":"Marie Curie – Facts – 1911 (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/chemistry/1911/marie-curie/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: The Nobel Prize in Chemistry 1911 awarded to Marie Curie for the discovery of radium and polonium."},"claims":{"tf-hi-007-a":"I'd say Physiology or Medicine — her radiation work changed medicine.","tf-hi-007-b":"I'd say Chemistry — her lab work on elements points that way.","tf-hi-007-c":"I'd say Physics — radioactivity sounds like pure physics."},"corrections":{"tf-hi-007-a":"Curie never won the Medicine prize; her 1911 award was in Chemistry.","tf-hi-007-c":"Her Physics prize was the first one, in 1903; the 1911 prize was in Chemistry."}},{"id":"tf-hi-008","category":"History","difficulty":"hard","prompt":"The Terracotta Army near Xi'an was created for the mausoleum of which Chinese emperor?","answers":[{"id":"tf-hi-008-a","text":"Kublai Khan"},{"id":"tf-hi-008-b","text":"Emperor Wu of Han"},{"id":"tf-hi-008-c","text":"Qin Shi Huang"}],"correctId":"tf-hi-008-c","explanation":"The Terracotta Army guards the mausoleum of the first Qin emperor, Qin Shi Huang, who died in 210 BC. UNESCO notes that he unified China and that thousands of clay soldiers surround the tomb.","hint":"The ruler it honors died in 210 BC after unifying China.","source":{"title":"Mausoleum of the First Qin Emperor (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/441/"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO listing: mausoleum of the First Qin Emperor (Qin Shi Huang), d. 210 BC, with terracotta warriors."},"claims":{"tf-hi-008-a":"I'm sure it's Kublai Khan — an emperor who ruled on a huge scale.","tf-hi-008-b":"I'm sure it's Emperor Wu of Han — an emperor famed for grand projects.","tf-hi-008-c":"I'm sure it's Qin Shi Huang — an emperor obsessed with power and legacy."},"corrections":{"tf-hi-008-a":"Kublai Khan founded the Yuan dynasty in the 13th century, over 1,400 years after the Terracotta Army was made.","tf-hi-008-b":"Emperor Wu of Han reigned about a century later; the army belongs to the First Qin Emperor's mausoleum."}},{"id":"tf-hi-009","category":"History","difficulty":"medium","prompt":"Which Egyptian pharaoh's tomb did Howard Carter's team open in the Valley of the Kings in 1922?","answers":[{"id":"tf-hi-009-a","text":"Ramesses the Great"},{"id":"tf-hi-009-b","text":"Khufu"},{"id":"tf-hi-009-c","text":"Tutankhamun"}],"correctId":"tf-hi-009-c","explanation":"On 4 November 1922 Howard Carter uncovered the top step of a staircase in the Valley of the Kings, and on 26 November he peered in by candlelight at the treasures of Tutankhamun. His patron, Lord Carnarvon, died in Cairo the following April.","hint":"The staircase was found beneath ancient workmen's huts near the entrance to the tomb of Ramses VI, and seal impressions bore the king's cartouche.","source":{"title":"1st Season (1922–1923), Tutankhamun Spatial Archive (Griffith Institute, University of Oxford)","url":"https://tutankhamun.griffith.ox.ac.uk/seasons/1st-season-1922-1923"},"verified":{"status":"verified","date":"2026-10-25","note":"Griffith Institute season record: 4 Nov 1922 Carter uncovered the staircase near Ramses VI's tomb; 26 Nov he saw 'the treasures of Tutankhamun'."},"claims":{"tf-hi-009-a":"I believe it's Ramesses the Great — the Valley of the Kings was his kind of place.","tf-hi-009-b":"I believe it's Khufu — the most famous pharaoh's tomb would draw that crowd.","tf-hi-009-c":"I believe it's Tutankhamun — the 1920s excavations ring a bell."},"corrections":{"tf-hi-009-a":"Ramesses the Great (Ramesses II) is not the king whose tomb Carter opened in 1922; that was Tutankhamun.","tf-hi-009-b":"Khufu was buried at Giza in the Great Pyramid, not in the Valley of the Kings."}},{"id":"tf-hi-010","category":"History","difficulty":"hard","prompt":"In 1789, George Washington took the presidential oath at Federal Hall in which city, then the U.S. capital?","answers":[{"id":"tf-hi-010-a","text":"New York"},{"id":"tf-hi-010-b","text":"Boston"},{"id":"tf-hi-010-c","text":"Philadelphia"}],"correctId":"tf-hi-010-a","explanation":"Washington was inaugurated on Federal Hall's second-floor balcony on April 30, 1789, and the building served as the nation's capitol, housing Congress and the Office of the President. After the second session of the First Congress ended in August 1790, Congress moved to Philadelphia.","hint":"The building had been remodeled by Pierre L'Enfant in 1788 from a former British colonial city hall.","source":{"title":"The Congress at Federal Hall (National Park Service)","url":"https://www.nps.gov/feha/learn/historyculture/the-congress-at-federal-hall.htm"},"verified":{"status":"verified","date":"2026-10-25","note":"NPS: Washington inaugurated on Federal Hall balcony April 30, 1789; Federal Hall became the nation's capitol; Congress later moved to Philadelphia (1790); L'Enfant remodeled it in 1788."},"claims":{"tf-hi-010-a":"I'm backing New York City — the big port city makes sense as a capital.","tf-hi-010-b":"I'm backing Boston — the cradle of the Revolution makes sense.","tf-hi-010-c":"I'm backing Philadelphia — the city of the Founders makes sense."},"corrections":{"tf-hi-010-b":"Boston was never the federal capital; the 1789 inauguration was in New York City.","tf-hi-010-c":"Philadelphia became the capital in 1790, after the inauguration in New York."}},{"id":"tf-hi-011","category":"History","difficulty":"easy","prompt":"Which English king affixed his seal to Magna Carta at Runnymede in June 1215?","answers":[{"id":"tf-hi-011-a","text":"King Henry VIII"},{"id":"tf-hi-011-b","text":"King John"},{"id":"tf-hi-011-c","text":"King Richard III"}],"correctId":"tf-hi-011-b","explanation":"On June 15, 1215, at Runnymede, King John affixed his seal to Magna Carta after being confronted by rebellious barons. Just ten weeks later Pope Innocent III nullified the agreement.","hint":"He was confronted by about 40 rebellious barons, and the pope annulled the deal only about ten weeks later.","source":{"title":"Magna Carta (U.S. National Archives featured document)","url":"https://www.archives.gov/exhibits/featured-documents/magna-carta"},"verified":{"status":"verified","date":"2026-10-25","note":"National Archives: on June 15, 1215 at Runnymede King John affixed his seal to Magna Carta; Pope Innocent III nullified it 10 weeks later."},"claims":{"tf-hi-011-a":"My instinct says King Henry VIII — a king forever clashing with power.","tf-hi-011-b":"My instinct says King John — a king pushed around by his barons.","tf-hi-011-c":"My instinct says King Richard III — a king with a turbulent reign."},"corrections":{"tf-hi-011-a":"Henry VIII reigned from 1509 to 1547, three centuries after Magna Carta.","tf-hi-011-c":"Richard III reigned from 1483 to 1485; Magna Carta was sealed by King John in 1215."}},{"id":"tf-hi-012","category":"History","difficulty":"easy","prompt":"The Battle of Hastings, in which William of Normandy defeated King Harold of England, was fought in which year?","answers":[{"id":"tf-hi-012-a","text":"1215"},{"id":"tf-hi-012-b","text":"1066"},{"id":"tf-hi-012-c","text":"966"}],"correctId":"tf-hi-012-b","explanation":"The Battle of Hastings was fought on 14 October 1066, when William of Normandy defeated the army of King Harold of England. William the Conqueror later founded Battle Abbey on the site as penance for the bloodshed.","hint":"It happened the same year that Edward the Confessor died on 5 January, leaving no direct heir.","source":{"title":"History of Battle Abbey and Battlefield (English Heritage)","url":"https://www.english-heritage.org.uk/visit/places/1066-battle-of-hastings-abbey-and-battlefield/history-and-stories/history/"},"verified":{"status":"verified","date":"2026-10-25","note":"English Heritage: Battle of Hastings fought 14 October 1066; William of Normandy defeated King Harold; Edward the Confessor died 5 January that year."},"claims":{"tf-hi-012-a":"I'm certain it's 1215 — the Norman era feels like the early 1200s.","tf-hi-012-b":"I'm certain it's 1066 — the Norman era starts right around there.","tf-hi-012-c":"I'm certain it's 966 — the Norman era feels like the tenth century."},"corrections":{"tf-hi-012-a":"1215 is the year of Magna Carta, not the Battle of Hastings.","tf-hi-012-c":"966 is a full century too early; Hastings was fought in 1066."}},{"id":"tf-hi-013","category":"History","difficulty":"medium","prompt":"In which year was Martin Luther King Jr. awarded the Nobel Peace Prize?","answers":[{"id":"tf-hi-013-a","text":"1968"},{"id":"tf-hi-013-b","text":"1957"},{"id":"tf-hi-013-c","text":"1964"}],"correctId":"tf-hi-013-c","explanation":"Martin Luther King Jr. received the Nobel Peace Prize in 1964 \"for his non-violent struggle for civil rights for the Afro-American population.\" He was the sole laureate that year.","hint":"He did not share the prize — the Nobel record lists his prize share as 1/1.","source":{"title":"Martin Luther King Jr. – Facts – 1964 (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/peace/1964/king/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org facts page: Nobel Peace Prize 1964, prize share 1/1, motivation 'non-violent struggle for civil rights'."},"claims":{"tf-hi-013-a":"I think it was 1968 — the end of that decade feels right.","tf-hi-013-b":"I think it was 1957 — the bus boycott years feel right to me.","tf-hi-013-c":"I think it was 1964 — the civil rights era was at full strength then."},"corrections":{"tf-hi-013-a":"1968 is the year King was assassinated; his Nobel Peace Prize came in 1964.","tf-hi-013-b":"1957 is when the SCLC was founded; the Nobel Prize was awarded in 1964."}},{"id":"tf-hi-014","category":"History","difficulty":"hard","prompt":"With whom did Nelson Mandela share the 1993 Nobel Peace Prize?","answers":[{"id":"tf-hi-014-a","text":"F. W. de Klerk"},{"id":"tf-hi-014-b","text":"Kofi Annan"},{"id":"tf-hi-014-c","text":"Archbishop Desmond Tutu"}],"correctId":"tf-hi-014-a","explanation":"The 1993 Nobel Peace Prize was shared by Nelson Mandela and South African President F. W. de Klerk for their work toward the peaceful end of apartheid. Desmond Tutu had received his own Peace Prize earlier, in 1984.","hint":"The prize was split into two equal halves, and his co-laureate was a fellow South African.","source":{"title":"Nelson Mandela – Facts – 1993 (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/peace/1993/mandela/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: Nelson Mandela, Nobel Peace Prize 1993, prize share 1/2, page links co-laureate F.W. de Klerk."},"claims":{"tf-hi-014-a":"I'm going with F. W. de Klerk — a key figure in South Africa's transition.","tf-hi-014-b":"I'm going with Kofi Annan — a key African figure in world peace.","tf-hi-014-c":"I'm going with Desmond Tutu — a key voice against apartheid."},"corrections":{"tf-hi-014-b":"Kofi Annan shared the 2001 Nobel Peace Prize with the United Nations, not the 1993 prize.","tf-hi-014-c":"Archbishop Desmond Tutu won the Nobel Peace Prize alone in 1984, not in 1993."}},{"id":"tf-hi-015","category":"History","difficulty":"hard","prompt":"Angkor, home to the temple of Angkor Wat, preserves the capitals of which empire from the 9th to the 15th century?","answers":[{"id":"tf-hi-015-a","text":"The Mughal Empire"},{"id":"tf-hi-015-b","text":"The Khmer Empire"},{"id":"tf-hi-015-c","text":"The Majapahit Empire"}],"correctId":"tf-hi-015-b","explanation":"UNESCO's Angkor Archaeological Park in Cambodia contains the remains of the capitals of the Khmer Empire from the 9th to the 15th century. It includes Angkor Wat and, at Angkor Thom, the Bayon Temple.","hint":"The same site includes Angkor Thom, with the Bayon Temple and its countless sculptures.","source":{"title":"Angkor (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/668/"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: Angkor contains remains of capitals of the Khmer Empire, 9th to 15th century, incl. Angkor Wat and Bayon."},"claims":{"tf-hi-015-a":"I'm sure it's the Mughal Empire — a grand Asian empire fits those temples.","tf-hi-015-b":"I'm sure it's the Khmer Empire — a Southeast Asian power fits those dates.","tf-hi-015-c":"I'm sure it's the Majapahit Empire — a Southeast Asian empire fits that era."},"corrections":{"tf-hi-015-a":"The Mughal Empire ruled in South Asia from the 16th century; Angkor is Khmer.","tf-hi-015-c":"The Majapahit Empire was based on Java in present-day Indonesia, not Cambodia's Angkor."}},{"id":"tf-sc-001","category":"Science & Nature","difficulty":"easy","prompt":"Which planet is often called the \"Red Planet\"?","answers":[{"id":"tf-sc-001-a","text":"Venus"},{"id":"tf-sc-001-b","text":"Jupiter"},{"id":"tf-sc-001-c","text":"Mars"}],"correctId":"tf-sc-001-c","explanation":"Mars is frequently called the Red Planet because iron minerals in its dirt oxidize, or rust, making the surface look red. NASA notes the ancient Egyptians called it \"Her Desher,\" meaning \"the red one.\"","hint":"Its color comes from iron minerals in its soil that have rusted.","source":{"title":"Mars: Facts (NASA Science)","url":"https://science.nasa.gov/mars/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Mars facts: frequently called the 'Red Planet' because iron minerals oxidize; Egyptians called it 'Her Desher'."},"claims":{"tf-sc-001-a":"It's Venus — the one I picture glowing orange.","tf-sc-001-b":"It's Jupiter — the one with the famous red spot.","tf-sc-001-c":"It's Mars — the one I picture as a reddish dot."},"corrections":{"tf-sc-001-a":"Venus appears bright white-yellow and is wrapped in clouds; the Red Planet is Mars.","tf-sc-001-b":"Jupiter has a Great Red Spot storm, but it is not called the Red Planet; that is Mars."}},{"id":"tf-sc-002","category":"Science & Nature","difficulty":"easy","prompt":"What is the largest planet in our solar system?","answers":[{"id":"tf-sc-002-a","text":"Neptune"},{"id":"tf-sc-002-b","text":"Saturn"},{"id":"tf-sc-002-c","text":"Jupiter"}],"correctId":"tf-sc-002-c","explanation":"NASA calls Jupiter a world of extremes and the largest planet in the solar system. Its many moons make it look like a miniature solar system of its own.","hint":"With its large family of moons, NASA says it forms a kind of miniature solar system.","source":{"title":"Jupiter: Facts (NASA Science)","url":"https://science.nasa.gov/jupiter/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Jupiter facts: 'Jupiter is a world of extremes. It's the largest planet in our solar system'; forms a miniature solar system."},"claims":{"tf-sc-002-a":"My instinct says Neptune — the far-out giant seems the biggest.","tf-sc-002-b":"My instinct says Saturn — those huge rings suggest the biggest.","tf-sc-002-c":"My instinct says Jupiter — a gas giant has to be the biggest."},"corrections":{"tf-sc-002-a":"Neptune is the fourth-largest planet by diameter; Jupiter is the largest.","tf-sc-002-b":"Saturn is the second-largest planet; Jupiter is larger."}},{"id":"tf-sc-003","category":"Science & Nature","difficulty":"easy","prompt":"During photosynthesis, which gas do plants take in from the air?","answers":[{"id":"tf-sc-003-a","text":"Nitrogen dioxide"},{"id":"tf-sc-003-b","text":"Carbon dioxide"},{"id":"tf-sc-003-c","text":"Oxygen"}],"correctId":"tf-sc-003-b","explanation":"In photosynthesis, plants use sunlight, water and carbon dioxide to make sugar and release oxygen. They take in carbon dioxide from the air and water from the soil.","hint":"National Geographic notes that plants combine sunlight, water and this gas to create oxygen and sugar.","source":{"title":"Photosynthesis (National Geographic Education)","url":"https://education.nationalgeographic.org/resource/photosynthesis/"},"verified":{"status":"verified","date":"2026-10-25","note":"National Geographic Education: plants use sunlight, water and carbon dioxide to create oxygen and sugar; take in CO2 from the air."},"claims":{"tf-sc-003-a":"I'm sure it's nitrogen dioxide — plants soak up gases from the air.","tf-sc-003-b":"I'm sure it's carbon dioxide — plants swap gases with the air.","tf-sc-003-c":"I'm sure it's oxygen — plants breathe like everything else."},"corrections":{"tf-sc-003-a":"Photosynthesis takes in carbon dioxide, not nitrogen dioxide.","tf-sc-003-c":"Oxygen is what photosynthesis releases; the gas taken in is carbon dioxide."}},{"id":"tf-sc-004","category":"Science & Nature","difficulty":"easy","prompt":"According to NOAA, what is the largest animal ever known to have lived on Earth?","answers":[{"id":"tf-sc-004-a","text":"The sperm whale"},{"id":"tf-sc-004-b","text":"The African elephant"},{"id":"tf-sc-004-c","text":"The blue whale"}],"correctId":"tf-sc-004-c","explanation":"NOAA Fisheries states that blue whales are the largest animals ever to live on our planet. These baleen whales feed almost exclusively on tiny krill.","hint":"It is a baleen whale that feeds almost entirely on krill.","source":{"title":"Blue Whale (NOAA Fisheries)","url":"https://www.fisheries.noaa.gov/species/blue-whale"},"verified":{"status":"verified","date":"2026-10-25","note":"NOAA Fisheries: blue whales are 'the largest animals ever to live on our planet'; feed almost exclusively on krill."},"claims":{"tf-sc-004-a":"I believe it's the sperm whale — deep-sea giants grow enormous.","tf-sc-004-b":"I believe it's the African elephant — land giants were the biggest ever.","tf-sc-004-c":"I believe it's the blue whale — the sea lets animals grow enormous."},"corrections":{"tf-sc-004-a":"The sperm whale is the largest toothed whale, but the blue whale is larger.","tf-sc-004-b":"The African elephant is the largest land animal living today, far smaller than a blue whale."}},{"id":"tf-sc-005","category":"Science & Nature","difficulty":"medium","prompt":"Which planet zips around the Sun once every 88 Earth days?","answers":[{"id":"tf-sc-005-a","text":"Mercury"},{"id":"tf-sc-005-b","text":"Mars"},{"id":"tf-sc-005-c","text":"Venus"}],"correctId":"tf-sc-005-a","explanation":"Mercury is the fastest planet, orbiting the Sun every 88 Earth days at nearly 47 kilometers per second. It is the smallest planet but not the hottest; that title belongs to Venus.","hint":"NASA notes that it is the smallest planet in our solar system.","source":{"title":"Mercury: Facts (NASA Science)","url":"https://science.nasa.gov/mercury/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Mercury facts: fastest planet, around the Sun every 88 Earth days; smallest planet in our solar system."},"claims":{"tf-sc-005-a":"I'm going with Mercury — a quick orbit means a tight path.","tf-sc-005-b":"I'm going with Mars — a quick orbit fits a small planet.","tf-sc-005-c":"I'm going with Venus — a quick orbit fits a planet this close."},"corrections":{"tf-sc-005-b":"Mars takes about 687 Earth days to orbit the Sun; Mercury takes 88.","tf-sc-005-c":"Venus takes about 225 Earth days to orbit the Sun."}},{"id":"tf-sc-006","category":"Science & Nature","difficulty":"medium","prompt":"Near the surface, which gas makes up about 78% of Earth's atmosphere?","answers":[{"id":"tf-sc-006-a","text":"Argon"},{"id":"tf-sc-006-b","text":"Nitrogen"},{"id":"tf-sc-006-c","text":"Oxygen"}],"correctId":"tf-sc-006-b","explanation":"NASA says Earth's atmosphere near the surface is about 78% nitrogen, 21% oxygen and 1% other gases such as argon, carbon dioxide and neon.","hint":"The gas we actually breathe for life makes up only about 21%.","source":{"title":"Earth: Facts (NASA Science)","url":"https://science.nasa.gov/earth/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Earth facts: atmosphere 78% nitrogen, 21% oxygen, 1% other gases (argon, CO2, neon)."},"claims":{"tf-sc-006-a":"I'm certain it's argon — the bulk of the air is an inert gas.","tf-sc-006-b":"I'm certain it's nitrogen — the bulk of the air is that gas.","tf-sc-006-c":"I'm certain it's oxygen — the gas we breathe has to dominate."},"corrections":{"tf-sc-006-a":"Argon is part of the roughly 1% of 'other gases'; nitrogen is 78%.","tf-sc-006-c":"Oxygen makes up about 21% of the atmosphere, not 78%."}},{"id":"tf-sc-007","category":"Science & Nature","difficulty":"medium","prompt":"A lichen is a symbiotic partnership between a fungus and what?","answers":[{"id":"tf-sc-007-a","text":"An alga or cyanobacterium"},{"id":"tf-sc-007-b","text":"A moss or liverwort"},{"id":"tf-sc-007-c","text":"A fern or horsetail"}],"correctId":"tf-sc-007-a","explanation":"The U.S. Forest Service explains that a lichen is a partnership of a fungus and an alga. The alga can be a green alga or a blue-green alga, also called cyanobacteria, and the fungus is the dominant partner.","hint":"The photosynthesizing partner may be green or 'blue-green,' while the fungus gives the lichen most of its characteristics.","source":{"title":"What are Lichens? (U.S. Forest Service)","url":"https://www.fs.usda.gov/wildflowers/beauty/lichens/about.shtml"},"verified":{"status":"verified","date":"2026-10-25","note":"USFS: lichens are a symbiotic partnership of a fungus and an alga (green alga or cyanobacteria)."},"claims":{"tf-sc-007-a":"I think it's an alga or cyanobacterium — something that can photosynthesize.","tf-sc-007-b":"I think it's a moss or liverwort — those always grow on the same rocks.","tf-sc-007-c":"I think it's a fern or horsetail — another ancient, simple plant."},"corrections":{"tf-sc-007-b":"Mosses and liverworts are separate plants; the lichen partner is an alga or cyanobacterium.","tf-sc-007-c":"Ferns are vascular plants, not lichen partners; lichens pair a fungus with an alga or cyanobacterium."}},{"id":"tf-sc-008","category":"Science & Nature","difficulty":"medium","prompt":"Halley's Comet returns to Earth's skies roughly every how many years?","answers":[{"id":"tf-sc-008-a","text":"About 150 years"},{"id":"tf-sc-008-b","text":"About 76 years"},{"id":"tf-sc-008-c","text":"About 26 years"}],"correctId":"tf-sc-008-b","explanation":"Halley's Comet was last seen from Earth in 1986 and returns on a regular cycle of about 76 years, with its next appearance expected in 2061. It even appears in the Bayeux Tapestry's record of 1066.","hint":"It was last seen in Earth's skies in 1986, when an international fleet of spacecraft met it.","source":{"title":"1P/Halley (NASA Science)","url":"https://science.nasa.gov/solar-system/comets/1p-halley/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA: Halley last seen 1986, will return in 2061 on its regular 76-year cycle; featured in Bayeux tapestry."},"claims":{"tf-sc-008-a":"My instinct says about 150 years — rarer than once in a lifetime.","tf-sc-008-b":"My instinct says about 76 years — about once in a human lifetime.","tf-sc-008-c":"My instinct says about 26 years — a few times in a human lifetime."},"corrections":{"tf-sc-008-a":"150 years is about twice Halley's actual period of roughly 76 years.","tf-sc-008-c":"26 years is far too short; Halley's period is about 76 years."}},{"id":"tf-sc-009","category":"Science & Nature","difficulty":"medium","prompt":"About 90% of the ozone in Earth's atmosphere sits in which layer?","answers":[{"id":"tf-sc-009-a","text":"The stratosphere"},{"id":"tf-sc-009-b","text":"The mesosphere"},{"id":"tf-sc-009-c","text":"The troposphere"}],"correctId":"tf-sc-009-a","explanation":"NASA's Ozone Watch explains that ninety percent of atmospheric ozone sits in the stratosphere, between about 10 and 50 kilometers altitude. This ozone absorbs most of the Sun's ultraviolet radiation.","hint":"The layer lies roughly 10 to 50 kilometers above the ground, above where almost all weather happens.","source":{"title":"Ozone Facts: What is Ozone? (NASA Ozone Watch)","url":"https://ozonewatch.gsfc.nasa.gov/facts/ozone_SH.html"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Ozone Watch: ninety percent of ozone sits in the stratosphere, ~10-50 km altitude."},"claims":{"tf-sc-009-a":"I'm backing the stratosphere — the protective layer sits fairly high.","tf-sc-009-b":"I'm backing the mesosphere — the protective layer sits very high.","tf-sc-009-c":"I'm backing the troposphere — the protective layer sits right near us."},"corrections":{"tf-sc-009-b":"The mesosphere lies above the stratosphere; ozone is concentrated in the stratosphere.","tf-sc-009-c":"Ground-level ozone forms in the troposphere, but most ozone is in the stratosphere."}},{"id":"tf-sc-010","category":"Science & Nature","difficulty":"medium","prompt":"Which protein in red blood cells carries oxygen around the body?","answers":[{"id":"tf-sc-010-a","text":"Keratin"},{"id":"tf-sc-010-b","text":"Collagen"},{"id":"tf-sc-010-c","text":"Hemoglobin"}],"correctId":"tf-sc-010-c","explanation":"MedlinePlus explains that red blood cells contain hemoglobin, a protein that carries oxygen. How much oxygen body tissues receive depends on how many red blood cells you have and how well they work.","hint":"Per MedlinePlus, how much oxygen your tissues get depends on how many red cells carrying this protein you have.","source":{"title":"RBC count (MedlinePlus, U.S. National Library of Medicine)","url":"https://medlineplus.gov/ency/article/003644.htm"},"verified":{"status":"verified","date":"2026-10-25","note":"MedlinePlus: RBCs contain hemoglobin, a protein which carries oxygen."},"claims":{"tf-sc-010-a":"It's keratin — tough proteins do the carrying.","tf-sc-010-b":"It's collagen — the body's main protein does it.","tf-sc-010-c":"It's hemoglobin — blood proteins do the carrying."},"corrections":{"tf-sc-010-a":"Keratin is a structural protein in hair, nails and skin; hemoglobin carries oxygen.","tf-sc-010-b":"Collagen gives structure to skin, tendons and bone; it does not carry oxygen."}},{"id":"tf-sc-011","category":"Science & Nature","difficulty":"medium","prompt":"Light travels through a vacuum at approximately what speed?","answers":[{"id":"tf-sc-011-a","text":"About 300,000 km per second"},{"id":"tf-sc-011-b","text":"About 3 million km per second"},{"id":"tf-sc-011-c","text":"About 30,000 km per second"}],"correctId":"tf-sc-011-a","explanation":"NIST lists the speed of light in vacuum as exactly 299,792,458 meters per second, which is about 300,000 kilometers per second. The value is exact because the meter is defined from it.","hint":"NIST lists it as an exact nine-digit figure in metres per second — convert to kilometres carefully.","source":{"title":"CODATA Value: speed of light in vacuum (NIST)","url":"https://physics.nist.gov/cgi-bin/cuu/Value?c"},"verified":{"status":"verified","date":"2026-10-25","note":"NIST CODATA: speed of light in vacuum 299 792 458 m/s (exact)."},"claims":{"tf-sc-011-a":"I believe it's about 300,000 km per second — the figure from school.","tf-sc-011-b":"I believe it's about 3 million km per second — the figure from school.","tf-sc-011-c":"I believe it's about 30,000 km per second — the figure from school."},"corrections":{"tf-sc-011-b":"3 million km/s is ten times too fast; light moves at about 300,000 km/s.","tf-sc-011-c":"30,000 km/s is ten times too slow; light moves at about 300,000 km/s."}},{"id":"tf-sc-012","category":"Science & Nature","difficulty":"hard","prompt":"Which planet takes longer to spin once on its axis (its rotation period) than to orbit the Sun once?","answers":[{"id":"tf-sc-012-a","text":"Uranus"},{"id":"tf-sc-012-b","text":"Venus"},{"id":"tf-sc-012-c","text":"Mercury"}],"correctId":"tf-sc-012-b","explanation":"NASA says Venus takes 243 Earth days to turn once on its axis, longer than its 225-Earth-day orbit around the Sun. Venus also spins backward, so the Sun would rise in the west and set in the east.","hint":"On this planet the Sun would rise in the west and set in the east.","source":{"title":"Venus: Facts (NASA Science)","url":"https://science.nasa.gov/venus/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Venus facts: day 243 Earth days, longer than its 225-day year; Sun rises in the west."},"claims":{"tf-sc-012-a":"I'm sure it's Uranus — the odd, tilted spinner.","tf-sc-012-b":"I'm sure it's Venus — a slow spinner closer in.","tf-sc-012-c":"I'm sure it's Mercury — the slow spinner nearest the Sun."},"corrections":{"tf-sc-012-a":"Uranus rotates in about 17 hours but takes 84 Earth years to orbit; its rotation is far shorter than its year.","tf-sc-012-c":"Mercury rotates once every 59 Earth days, shorter than its 88-day orbit; only its sunrise-to-sunrise solar day (176 Earth days) outlasts its year."}},{"id":"tf-sc-013","category":"Science & Nature","difficulty":"hard","prompt":"Which is the only planet in our solar system whose average density is less than that of water?","answers":[{"id":"tf-sc-013-a","text":"Neptune"},{"id":"tf-sc-013-b","text":"Jupiter"},{"id":"tf-sc-013-c","text":"Saturn"}],"correctId":"tf-sc-013-c","explanation":"NASA notes that Saturn is the only planet in our solar system with an average density less than water. In principle, the giant could float in a bathtub if one were large enough.","hint":"NASA jokes that this planet could float in a bathtub if such a colossal thing existed.","source":{"title":"Saturn: Facts (NASA Science)","url":"https://science.nasa.gov/saturn/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NASA Saturn facts: only planet with average density less than water; could float in a bathtub."},"claims":{"tf-sc-013-a":"I think it's Neptune — a gassy ice giant that light would float.","tf-sc-013-b":"I think it's Jupiter — the biggest gas ball would float.","tf-sc-013-c":"I think it's Saturn — a gas giant that light would float."},"corrections":{"tf-sc-013-a":"Neptune is the densest of the giant planets, well above water's density.","tf-sc-013-b":"Jupiter is denser than water; Saturn is the only planet less dense than water."}},{"id":"tf-sc-014","category":"Science & Nature","difficulty":"hard","prompt":"Alexander Fleming shared the 1945 Nobel Prize in Physiology or Medicine, for penicillin, with Ernst Chain and whom?","answers":[{"id":"tf-sc-014-a","text":"Paul Ehrlich"},{"id":"tf-sc-014-b","text":"Howard Florey"},{"id":"tf-sc-014-c","text":"Selman Waksman"}],"correctId":"tf-sc-014-b","explanation":"The 1945 Nobel Prize in Physiology or Medicine was awarded jointly to Alexander Fleming, Ernst Boris Chain and Howard Walter Florey for the discovery of penicillin and its curative effect in various infectious diseases.","hint":"Like Fleming, the third laureate appears on the Nobel listing with the title \"Sir.\"","source":{"title":"The Nobel Prize in Physiology or Medicine 1945 (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/medicine/1945/summary/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: 1945 Medicine prize jointly to Fleming, Chain and Florey for the discovery of penicillin."},"claims":{"tf-sc-014-a":"I'm going with Paul Ehrlich — a pioneer of drug-based cures.","tf-sc-014-b":"I'm going with Howard Florey — a pioneer of the antibiotic era.","tf-sc-014-c":"I'm going with Selman Waksman — a pioneer of antibiotic discovery."},"corrections":{"tf-sc-014-a":"Paul Ehrlich shared the 1908 Medicine prize for work on immunity and died in 1915.","tf-sc-014-c":"Selman Waksman won the 1952 Medicine prize for streptomycin, not the 1945 penicillin prize."}},{"id":"tf-sc-015","category":"Science & Nature","difficulty":"hard","prompt":"Who shared the 1962 Nobel Prize in Physiology or Medicine with James Watson and Francis Crick?","answers":[{"id":"tf-sc-015-a","text":"Linus Pauling"},{"id":"tf-sc-015-b","text":"Rosalind Franklin"},{"id":"tf-sc-015-c","text":"Maurice Wilkins"}],"correctId":"tf-sc-015-c","explanation":"The 1962 Nobel Prize in Physiology or Medicine went jointly to Francis Crick, James Watson and Maurice Wilkins for discoveries concerning the molecular structure of nucleic acids. Nobel Prizes are not awarded posthumously, and Rosalind Franklin had died in 1958.","hint":"Nobel Prizes are not awarded posthumously, and the three 1962 laureates each took a one-third share for work on the structure of nucleic acids.","source":{"title":"The Nobel Prize in Physiology or Medicine 1962 (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/medicine/1962/summary/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: 1962 Medicine prize jointly to Crick, Watson and Maurice Wilkins for the molecular structure of nucleic acids."},"claims":{"tf-sc-015-a":"My instinct says Linus Pauling — the DNA race points to him.","tf-sc-015-b":"My instinct says Rosalind Franklin — the famous DNA photo points to her.","tf-sc-015-c":"My instinct says Maurice Wilkins — the DNA X-ray work points there."},"corrections":{"tf-sc-015-a":"Linus Pauling won Nobels in Chemistry (1954) and Peace (1962), not the 1962 Medicine prize.","tf-sc-015-b":"Rosalind Franklin died in 1958, and the Nobel is not awarded posthumously; the third laureate was Wilkins."}},{"id":"tf-ge-001","category":"Geography","difficulty":"easy","prompt":"What is the largest of the world's ocean basins?","answers":[{"id":"tf-ge-001-a","text":"The Atlantic Ocean"},{"id":"tf-ge-001-b","text":"The Indian Ocean"},{"id":"tf-ge-001-c","text":"The Pacific Ocean"}],"correctId":"tf-ge-001-c","explanation":"NOAA describes the Pacific as by far the largest of the world's ocean basins, covering about 155 million square kilometers. It holds more than half of the free water on Earth.","hint":"It holds more than half of the free water on Earth.","source":{"title":"How did the Pacific Ocean get its name? (NOAA National Ocean Service)","url":"https://oceanservice.noaa.gov/facts/pacific.html"},"verified":{"status":"verified","date":"2026-10-25","note":"NOAA: the Pacific is by far the largest of the world's ocean basins, ~155 million sq km, more than half of Earth's free water."},"claims":{"tf-ge-001-a":"It's the Atlantic — the ocean that dominates the maps.","tf-ge-001-b":"It's the Indian Ocean — the ocean that spans the tropics.","tf-ge-001-c":"It's the Pacific — the ocean that dominates the globe."},"corrections":{"tf-ge-001-a":"The Atlantic is the second-largest ocean basin; the Pacific is far bigger.","tf-ge-001-b":"The Indian Ocean is smaller than both the Pacific and the Atlantic."}},{"id":"tf-ge-002","category":"Geography","difficulty":"easy","prompt":"At 5,895 meters, Mount Kilimanjaro is the highest point on which continent?","answers":[{"id":"tf-ge-002-a","text":"Africa"},{"id":"tf-ge-002-b","text":"South America"},{"id":"tf-ge-002-c","text":"Asia"}],"correctId":"tf-ge-002-a","explanation":"UNESCO notes that at 5,895 m, Kilimanjaro is the highest point in Africa. The volcanic massif in Tanzania stands in isolation above the surrounding plains, with a snowy peak over the savannah.","hint":"UNESCO calls it the largest free-standing volcanic mass in the world, rising 4,877 m above the surrounding plains.","source":{"title":"Kilimanjaro National Park (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/403"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: 'At 5,895 m, Kilimanjaro is the highest point in Africa'; snowy peak looming over the savannah; Tanzania."},"claims":{"tf-ge-002-a":"I'm sure it's Africa — a great peak rising from the plains.","tf-ge-002-b":"I'm sure it's South America — a great peak among high ranges.","tf-ge-002-c":"I'm sure it's Asia — the continent of great peaks."},"corrections":{"tf-ge-002-b":"South America's highest point is Aconcagua; Kilimanjaro is in Africa.","tf-ge-002-c":"Asia's highest point is Mount Everest; Kilimanjaro is in Tanzania, Africa."}},{"id":"tf-ge-003","category":"Geography","difficulty":"easy","prompt":"Which river carved Arizona's Grand Canyon?","answers":[{"id":"tf-ge-003-a","text":"The Sacramento River"},{"id":"tf-ge-003-b","text":"The Colorado River"},{"id":"tf-ge-003-c","text":"The Missouri River"}],"correctId":"tf-ge-003-b","explanation":"The National Park Service explains that, beginning just 5-6 million years ago, the Colorado River began to carve its way downward through the uplifted Colorado Plateau. Erosion by tributary streams then widened the canyon.","hint":"It began cutting down through the uplifted plateau only about 5-6 million years ago.","source":{"title":"Geology - Grand Canyon National Park (U.S. National Park Service)","url":"https://www.nps. h but does not own the Galápagos."}},{"id":"tf-ge-005","category":"Geography","difficulty":"easy","prompt":"Sagarmatha National Park, which is dominated by Mount Everest, lies in which country?","answers":[{"id":"tf-ge-005-a","text":"India"},{"id":"tf-ge-005-b","text":"Bhutan"},{"id":"tf-ge-005-c","text":"Nepal"}],"correctId":"tf-ge-005-c","explanation":"UNESCO's Sagarmatha National Park covers 124,400 hectares in the Solu-Khumbu district of Nepal. It is dominated by Mount Everest and is home to the Sherpa people.","hint":"The park is in the Solu-Khumbu district and is home to the Sherpas.","source":{"title":"Sagarmatha National Park (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/120"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: Sagarmatha National Park in the Solu-Khumbu district of Nepal, dominated by Mount Everest; Sherpas."},"claims":{"tf-ge-005-a":"My instinct says India — the giant country on the Himalaya.","tf-ge-005-b":"My instinct says Bhutan — the small kingdom in the high Himalaya.","tf-ge-005-c":"My instinct says Nepal — the mountain kingdom on the high Himalaya."},"corrections":{"tf-ge-005-a":"India has Himalayan peaks, but Sagarmatha National Park is in Nepal.","tf-ge-005-b":"Bhutan is east of Nepal; Everest and Sagarmatha National Park are in Nepal."}},{"id":"tf-ge-006","category":"Geography","difficulty":"medium","prompt":"Lake Baikal, the world's oldest and deepest lake, is in which region?","answers":[{"id":"tf-ge-006-a","text":"Siberia"},{"id":"tf-ge-006-b","text":"Patagonia"},{"id":"tf-ge-006-c","text":"Scandinavia"}],"correctId":"tf-ge-006-a","explanation":"UNESCO describes Lake Baikal in south-east Siberia as the oldest (25 million years) and deepest (1,700 m) lake in the world. It holds about 20% of the world's unfrozen fresh water.","hint":"UNESCO says it holds 20% of the world's unfrozen fresh water.","source":{"title":"Lake Baikal (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/754"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: Lake Baikal in south-east Siberia is the oldest (25 million years) and deepest (1,700 m) lake; holds 20% of the world's unfrozen freshwater."},"claims":{"tf-ge-006-a":"I'm certain it's Siberia — a vast, cold, remote region.","tf-ge-006-b":"I'm certain it's Patagonia — a vast, wild, remote region.","tf-ge-006-c":"I'm certain it's Scandinavia — a cold northern land of lakes."},"corrections":{"tf-ge-006-b":"Patagonia is in Argentina and Chile; Baikal is in Siberia.","tf-ge-006-c":"Scandinavia has deep lakes, but Baikal is in south-east Siberia, Russia."}},{"id":"tf-ge-007","category":"Geography","difficulty":"medium","prompt":"Into which sea does the Danube River empty?","answers":[{"id":"tf-ge-007-a","text":"The Adriatic Sea"},{"id":"tf-ge-007-b","text":"The Baltic Sea"},{"id":"tf-ge-007-c","text":"The Black Sea"}],"correctId":"tf-ge-007-c","explanation":"UNESCO notes that the waters of the Danube flow into the Black Sea, forming the largest and best-preserved of Europe's deltas. The Danube Delta hosts over 300 species of birds.","hint":"Its delta, the largest and best preserved in Europe, hosts over 300 bird species.","source":{"title":"Danube Delta (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/588"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: the waters of the Danube flow into the Black Sea, forming Europe's largest and best-preserved delta; 300+ bird species."},"claims":{"tf-ge-007-a":"I think it's the Adriatic Sea — the river flows through the Balkans.","tf-ge-007-b":"I think it's the Baltic Sea — the river flows north out of Germany.","tf-ge-007-c":"I think it's the Black Sea — the river flows east across Europe."},"corrections":{"tf-ge-007-a":"The Adriatic receives rivers like the Po; the Danube flows east to the Black Sea.","tf-ge-007-b":"The Baltic receives rivers such as the Vistula and Oder; the Danube ends in the Black Sea."}},{"id":"tf-ge-008","category":"Geography","difficulty":"medium","prompt":"The world's highest waterfall, about 1,000 meters tall, is in Canaima National Park in which country?","answers":[{"id":"tf-ge-008-a","text":"Brazil"},{"id":"tf-ge-008-b","text":"Colombia"},{"id":"tf-ge-008-c","text":"Venezuela"}],"correctId":"tf-ge-008-c","explanation":"UNESCO describes Canaima National Park in south-eastern Venezuela, where sheer cliffs and waterfalls include the world's highest, at about 1,000 m. Roughly 65% of the park is covered by flat-topped tepui mountains.","hint":"Roughly two-thirds of the park is covered by flat-topped 'tepui' table mountains.","source":{"title":"Canaima National Park (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/701"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO: Canaima National Park in south-eastern Venezuela; waterfalls including the world's highest (1,000 m); 65% tepui."},"claims":{"tf-ge-008-a":"I'm backing Brazil — the country with the most rainforest.","tf-ge-008-b":"I'm backing Colombia — a land of high Andean waterfalls.","tf-ge-008-c":"I'm backing Venezuela — a land of high tabletop mountains."},"corrections":{"tf-ge-008-a":"The park borders Brazil, but Canaima and its record waterfall are in Venezuela.","tf-ge-008-b":"Colombia borders Venezuela to the west; Canaima National Park is in Venezuela."}},{"id":"tf-ge-009","category":"Geography","difficulty":"medium","prompt":"Victoria Falls, known locally as Mosi-oa-Tunya, is formed by which river?","answers":[{"id":"tf-ge-009-a","text":"The Zambezi"},{"id":"tf-ge-009-b","text":"The Congo"},{"id":"tf-ge-009-c","text":"The Limpopo"}],"correctId":"tf-ge-009-a","explanation":"UNESCO describes Victoria Falls as among the most spectacular waterfalls in the world. The Zambezi, more than 2 km wide there, plunges into basalt gorges, raising mist visible more than 20 km away.","hint":"At the falls the river is more than 2 km wide, and its mist can be seen over 2 elago property (65,650 ha), not Ha Long Bay alone. UNESCO places it in the Northeast of Viet Nam, within Quang Ninh Province and Hai Phong City.","hint":"UNESCO calls the site the most extensive and best known example of marine-invaded tower karst.","source":{"title":"Ha Long Bay - Cat Ba Archipelago (UNESCO World Heritage Centre)","url":"https://whc.unesco.org/en/list/672"},"verified":{"status":"verified","date":"2026-10-25","note":"UNESCO 672: Ha Long Bay - Cat Ba Archipelago (combined site) includes 1,133 islands and islets; Northeast of Viet Nam, Quang Ninh Province and Hai Phong City."},"claims":{"tf-ge-012-a":"My instinct says Viet Nam — a coastline full of limestone islands.","tf-ge-012-b":"My instinct says the Philippines — a nation built from thousands of islands.","tf-ge-012-c":"My instinct says Thailand — a coastline famous for limestone islands."},"corrections":{"tf-ge-012-b":"The Philippines' El Nido looks similar, but the Ha Long Bay - Cat Ba Archipelago site is in Viet Nam.","tf-ge-012-c":"Thailand has similar karst islands, but the Ha Long Bay - Cat Ba Archipelago site is in Viet Nam."}},{"id":"tf-ge-013","category":"Geography","difficulty":"hard","prompt":"Who gave the Pacific Ocean its name, meaning \"peaceful,\" in 1520?","answers":[{"id":"tf-ge-013-a","text":"Vasco Núñez de Balboa"},{"id":"tf-ge-013-b","text":"Ferdinand Magellan"},{"id":"tf-ge-013-c","text":"Francis Drake"}],"correctId":"tf-ge-013-b","explanation":"NOAA explains that Ferdinand Magellan, a Portuguese navigator sailing for Spain, entered the ocean in November 1520 after passing the straits now named for him. He called it pacific because the water was calm.","hint":"He was a Portuguese navigator sailing in the employ of Spain.","source":{"title":"How did the Pacific Ocean get its name? (NOAA National Ocean Service)","url":"https://oceanservice.noaa.gov/facts/pacific.html"},"verified":{"status":"verified","date":"2026-10-25","note":"NOAA: Ferdinand Magellan named the Pacific; entered e Dictionary defines a staff (UK: stave) as the five lines and four spaces between them on which musical notes are written.","hint":"Notes are written both on the lines and in the spaces between them.","source":{"title":"staff (Cambridge Dictionary)","url":"https://dictionary.cambridge.org/dictionary/english/staff"},"verified":{"status":"verified","date":"2026-10-25","note":"Cambridge Dictionary: staff (UK stave) — the five lines and four spaces between them on which musical notes are written."},"claims":{"tf-mu-003-a":"I believe it's four — that's what I picture on sheet music.","tf-mu-003-b":"I believe it's five — that's what I picture on sheet music.","tf-mu-003-c":"I believe it's six — that's what I picture on sheet music."},"corrections":{"tf-mu-003-a":"The staff has four spaces but five lines.","tf-mu-003-c":"Six lines is guitar tablature, not a standard staff, which has five."}},{"id":"tf-mu-004","category":"Music","difficulty":"easy","prompt":"A piece marked \"allegro\" should be played how?","answers":[{"id":"tf-mu-004-a","text":"Very quietly"},{"id":"tf-mu-004-b","text":"In a fast, lively way"},{"id":"tf-mu-004-c","text":"In a slow, stately way"}],"correctId":"tf-mu-004-b","explanation":"The Cambridge Dictionary defines allegro as 'in a fast and energetic way', used in written music to show how a piece should be performed. It contrasts with slow markings such as adagio.","hint":"Cambridge's example sentence notes a final movement 'marked allegro energico' that 'certainly does contain energy.'","source":{"title":"allegro (Cambridge Dictionary)","url":"https://dictionary.cambridge.org/dictionary/english/allegro"},"verified":{"status":"verified","date":"2026-10-25","note":"Cambridge Dictionary: allegro — in a fast (and energetic) way; example 'final movement is marked allegro energico'."},"claims":{"tf-mu-004-a":"My instinct says very quietly — it sounds like a gentle Italian word.","tf-mu-004-b":"My instinct says fast and lively — it sounds like an energetic cted. Keith Richards of the Rolling Stones inducted her.","hint":"She was inducted by Keith Richards of the Rolling Stones.","source":{"title":"Aretha Franklin (Rock & Roll Hall of Fame)","url":"https://rockhall.com/inductees/aretha-franklin"},"verified":{"status":"verified","date":"2026-10-25","note":"Rock Hall: Aretha Franklin, inducted 1987 by Keith Richards; 'the first woman inducted into the Rock & Roll Hall of Fame'."},"claims":{"tf-mu-006-a":"I think it was Tina Turner — a towering performer of rock.","tf-mu-006-b":"I think it was Aretha Franklin — a towering voice of the sixties.","tf-mu-006-c":"I think it was Dusty Springfield — a towering voice of sixties pop."},"corrections":{"tf-mu-006-a":"Tina Turner was inducted later; Aretha Franklin, in 1987, was the first woman.","tf-mu-006-c":"Aretha Franklin, inducted in 1987, was the first woman; Dusty Springfield was not."}},{"id":"tf-mu-007","category":"Music","difficulty":"medium","prompt":"Queen's \"Bohemian Rhapsody\" first appeared on which 1975 album?","answers":[{"id":"tf-mu-007-a","text":"A Night at the Opera"},{"id":"tf-mu-007-b","text":"Sheer Heart Attack"},{"id":"tf-mu-007-c","text":"News of the World"}],"correctId":"tf-mu-007-a","explanation":"The Rock & Roll Hall of Fame lists 'Bohemian Rhapsody' from A Night at the Opera (1975). Queen were inducted into the Hall in 2001.","hint":"The Hall's song list places it between 'Killer Queen' (1974) and 'We Will Rock You' (1977).","source":{"title":"Queen (Rock & Roll Hall of Fame)","url":"https://rockhall.com/inductees/queen"},"verified":{"status":"verified","date":"2026-10-25","note":"Rock Hall: Bohemian Rhapsody — A Night at the Opera (1975); We Will Rock You — News of the World (1977); Killer Queen — Sheer Heart Attack (1974)."},"claims":{"tf-mu-007-a":"I'm certain it's A Night at the Opera — one of their mid-seventies albums.","tf-mu-007-b":"I'm certain it's Sheer Heart Attack — one of their mid-seventies albums.","tf-mu-007-c":"I'm certain it's News of the World — one of their classic seventies albums."},"corrections":{"tf-mu-007-b":"Sheer Heart Attack (1974) contained 'Killer Queen'; 'Bohemian Rhapsody' came later.","tf-mu-007-c":"News of the World (1977) gave us 'We Will Rock You,' not 'Bohemian Rhapsody.'"}},{"id":"tf-mu-008","category":"Music","difficulty":"medium","prompt":"Counting both end notes, an octave (for example, from one C up to the next C) spans how many notes of a major scale?","answers":[{"id":"tf-mu-008-a","text":"Five"},{"id":"tf-mu-008-b","text":"Twelve"},{"id":"tf-mu-008-c","text":"Eight"}],"correctId":"tf-mu-008-c","explanation":"The Cambridge Dictionary defines an octave as the distance between two musical notes that are eight notes apart. Walking up a major scale from C to the next C, counting both ends, gives eight notes: C, D, E, F, G, A, B, C.","hint":"Walk up the white keys of a piano from one C to the next C, counting both of them.","source":{"title":"octave (Cambridge Dictionary)","url":"https://dictionary.cambridge.org/dictionary/english/octave"},"verified":{"status":"verified","date":"2026-10-25","note":"Cambridge Dictionary: octave — the distance between two musical notes that are eight notes apart."},"claims":{"tf-mu-008-a":"I'm backing five — the count I learned in music class.","tf-mu-008-b":"I'm backing twelve — the count I learned at the piano.","tf-mu-008-c":"I'm backing eight — the count I learned singing scales."},"corrections":{"tf-mu-008-a":"Five notes of the scale, counting both ends, span a fifth (C up to G), not an octave.","tf-mu-008-b":"An octave is twelve semitones (half steps), but it spans eight notes of a major scale, counting both ends."}},{"id":"tf-mu-009","category":"Music","difficulty":"medium","prompt":"Who composed the \"Maple Leaf Rag,\" published by John Stark & Son around 1899?","answers":[{"id":"tf-mu-009-a","text":"W. C. Handy"},{"id":"tf-mu-009-b","text":"Jelly Roll Morton"},{"id":"tf-mu-009-c","text":"Scott Joplin"}],"correctId":"tf-mu-009-c","explanation":"The Library of Congress identifies the Maple Leaf Rag as by Scott Joplin, published by John Stark & Son around 1899. It is a model of the 'classic' rag form of repeated 16-bar themes.","hint":"The Library of Congress uses it as the textbook example of the 'classic' rag, built on 16-bar themes.","source":{"title":"Classic Rag (Library of Congress, Performing Arts Encyclopedia)","url":"https://www.loc.gov/item/ihas.200035813/"},"verified":{"status":"verified","date":"2026-10-25","note":"Library of Congress: Maple Leaf Rag by Scott Joplin (John Stark & Son, c1899); example of 'classic' form with 16-bar sections."},"claims":{"tf-mu-009-a":"My instinct says W. C. Handy — a giant of early American songwriting.","tf-mu-009-b":"My instinct says Jelly Roll Morton — a giant of early American piano jazz.","tf-mu-009-c":"My instinct says Scott Joplin — a giant of early American piano music."},"corrections":{"tf-mu-009-a":"W. C. Handy is known as the 'Father of the Blues'; Joplin wrote the Maple Leaf Rag.","tf-mu-009-b":"Jelly Roll Morton was a jazz pioneer, but the Maple Leaf Rag is Scott Joplin's."}},{"id":"tf-mu-010","category":"Music","difficulty":"medium","prompt":"Gershwin's Rhapsody in Blue premiered in 1924 at New York's Aeolian Hall with whose orchestra?","answers":[{"id":"tf-mu-010-a","text":"Glenn Miller's"},{"id":"tf-mu-010-b","text":"Paul Whiteman's"},{"id":"tf-mu-010-c","text":"Duke Ellington's"}],"correctId":"tf-mu-010-b","explanation":"The Library of Congress notes the first public performance of Rhapsody in Blue was at Aeolian Hall, New York, on February 12, 1924. Gershwin played the solo piano part with Paul Whiteman's orchestra, in Ferde Grofé's scoring.","hint":"The concert's printed program bore the legend 'An experiment in modern music.'","source":{"title":"Rhapsody in Blue by George Gershwin (Library of Congress, Songs of America)","url":"https://www.loc.gov/collections/songs-of-america/articles-and-essays/articles-about-songs/rhapsody-in-blue/"},"verified":{"status":"verified","date":"2026-10-25","note":"Library of Congress: first performance at Aeolian Hall, New York, February 12, 1924; Gershwin with Paul Whiteman's orchestra; program titled 'An experiment in modern music'."},"claims":{"tf-mu-010-a":"I believe it was Glenn Miller's — a famous big band of its day.","tf-mu-010-b":"I believe it was Paul Whiteman's — a famous bandleader of the twenties.","tf-mu-010-c":"I believe it was Duke Ellington's — a famous New York orchestra."},"corrections":{"tf-mu-010-a":"Glenn Miller's orchestra did not give the premiere; Paul Whiteman's did.","tf-mu-010-c":"Duke Ellington's orchestra did not give the premiere; Paul Whiteman's did."}},{"id":"tf-mu-011","category":"Music","difficulty":"medium","prompt":"Stephen Foster's posthumously published ballad \"Beautiful Dreamer\" dates from which year?","answers":[{"id":"tf-mu-011-a","text":"1812"},{"id":"tf-mu-011-b","text":"1912"},{"id":"tf-mu-011-c","text":"1864"}],"correctId":"tf-mu-011-c","explanation":"The Library of Congress describes 'Beautiful Dreamer' (1864) as composed late in Stephen Foster's life and published posthumously. His earlier hit 'Oh! Susanna' had launched his career.","hint":"It appeared after Foster's death, while his earlier hit 'Oh! Susanna' had launched his career.","source":{"title":"Beautiful Dreamer by Stephen Foster (Library of Congress, Songs of America)","url":"https://www.loc.gov/collections/songs-of-america/articles-and-essays/articles-about-songs/beautiful-dreamer/"},"verified":{"status":"verified","date":"2026-10-25","note":"Library of Congress: Stephen Foster's 'Beautiful Dreamer' (1864), composed late in life and published posthumously; 'Oh! Susanna' launched his career."},"claims":{"tf-mu-011-a":"I'm going with 1812 — his songs feel early nineteenth century.","tf-mu-011-b":"I'm going with 1912 — his songs feel early twentieth century.","tf-mu-011-c":"I'm going with 1864 — his songs feel mid-nineteenth century."},"corrections":{"tf-mu-011-a":"1812 is decades too early; the song dates from 1864, near the Civil War's end.","tf-mu-011-b":"1912 is nearly fifty years too late; the song was published in 1864."}},{"id":"tf-mu-012","category":"Music","difficulty":"medium","prompt":"Bob Dylan, winner of the 2016 Nobel Prize in Literature, was born in which U.S. state?","answers":[{"id":"tf-mu-012-a","text":"Minnesota"},{"id":"tf-mu-012-b","text":"Mississippi"},{"id":"tf-mu-012-c","text":"New York"}],"correctId":"tf-mu-012-a","explanation":"NobelPrize.org records that Bob Dylan was born in Duluth, Minnesota, on 24 May 1941, with the original name Robert Zimmerman. He won the 2016 prize 'for having created new poetic expressions within the great American song tradition.'","hint":"His birthplace was the port city of Duluth.","source":{"title":"Bob Dylan – Facts (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/literature/2016/dylan/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: Bob Dylan born 24 May 1941, Duluth, Minnesota; original name Robert Zimmerman; 2016 prize motivation."},"claims":{"tf-mu-012-a":"I'm sure it's Minnesota — his roots feel Midwestern.","tf-mu-012-b":"I'm sure it's Mississippi — his roots feel Delta blues.","tf-mu-012-c":"I'm sure it's New York — his roots feel East Coast."},"corrections":{"tf-mu-012-b":"Dylan was born in Duluth, Minnesota, not in Mississippi.","tf-mu-012-c":"Dylan rose to fame in New York's folk scene, but he was born in Minnesota."}},{"id":"tf-mu-013","category":"Music","difficulty":"hard","prompt":"Which album won Album of the Year at the 1st Annual Grammy Awards?","answers":[{"id":"tf-mu-013-a","text":"The Music from Peter Gunn"},{"id":"tf-mu-013-b","text":"Only the Lonely"},{"id":"tf-mu-013-c","text":"Come Fly with Me"}],"correctId":"tf-mu-013-a","explanation":"At the 1st Annual Grammy Awards, Album of the Year went to Henry Mancini's The Music from Peter Gunn. Nominees included Frank Sinatra's Come Fly with Me and Only n Italian city.","tf-ll-001-b":"It's Florence — a romantic Renaissance city.","tf-ll-001-c":"It's Venice — a romantic city Shakespeare used."},"corrections":{"tf-ll-001-b":"Florence is not the setting; the prologue names fair Verona.","tf-ll-001-c":"Venice is the setting of The Merchant of Venice and Othello, not Romeo and Juliet."}},{"id":"tf-ll-002","category":"Language & Literature","difficulty":"easy","prompt":"Who wrote the novel Pride and Prejudice?","answers":[{"id":"tf-ll-002-a","text":"George Eliot"},{"id":"tf-ll-002-b","text":"Jane Austen"},{"id":"tf-ll-002-c","text":"Charlotte Brontë"}],"correctId":"tf-ll-002-b","explanation":"Pride and Prejudice is by Jane Austen, as Project Gutenberg's catalog records. It follows Elizabeth Bennet and Mr. Darcy.","hint":"The same author wrote Sense and Sensibility and Emma.","source":{"title":"Pride and Prejudice by Jane Austen (Project Gutenberg)","url":"https://www.gutenberg.org/ebooks/1342"},"verified":{"status":"verified","date":"2026-10-25","note":"Project Gutenberg catalog: 'Pride and Prejudice by Jane Austen'."},"claims":{"tf-ll-002-a":"I'm sure it was George Eliot — a great English novelist of society.","tf-ll-002-b":"I'm sure it was Jane Austen — a sharp observer of English manners.","tf-ll-002-c":"I'm sure it was Charlotte Brontë — a great English writer of romance."},"corrections":{"tf-ll-002-a":"George Eliot wrote Middlemarch; Pride and Prejudice is Jane Austen's.","tf-ll-002-c":"Charlotte Brontë wrote Jane Eyre, not Pride and Prejudice."}},{"id":"tf-ll-003","category":"Language & Literature","difficulty":"easy","prompt":"Shakespeare's Hamlet is a prince of which country?","answers":[{"id":"tf-ll-003-a","text":"Norway"},{"id":"tf-ll-003-b","text":"Scotland"},{"id":"tf-ll-003-c","text":"Denmark"}],"correctId":"tf-ll-003-c","explanation":"The Folger Shakespeare Library describes Hamlet seeking vengeance against his uncle Claudius, now the king of Denmark. The play includes the line 'Something is rotten in the state of Denmark.'","hint":"It is a 'revenge tragedy' in which Hamlet's uncle Claudius has taken the throne.","source":{"title":"Hamlet (Folger Shakespeare Library)","url":"https://www.folger.edu/explore/shakespeares-works/hamlet/"},"verified":{"status":"verified","date":"2026-10-25","note":"Folger: Hamlet seeks vengeance against his uncle Claudius, now the king of Denmark; quote 'Something is rotten in the state of Denmark.'"},"claims":{"tf-ll-003-a":"My instinct says Norway — a cold Scandinavian royal court.","tf-ll-003-b":"My instinct says Scotland — a royal court Shakespeare loved.","tf-ll-003-c":"My instinct says Denmark — a cold northern royal court."},"corrections":{"tf-ll-003-a":"Norway's prince Fortinbras appears in the play, but Hamlet is Danish.","tf-ll-003-b":"Scotland is the setting of Macbeth; Hamlet is a prince of Denmark."}},{"id":"tf-ll-004","category":"Language & Literature","difficulty":"easy","prompt":"In A Study in Scarlet, Holmes and Watson take rooms at 221B on which London street?","answers":[{"id":"tf-ll-004-a","text":"Baker Street"},{"id":"tf-ll-004-b","text":"Fleet Street"},{"id":"tf-ll-004-c","text":"Downing Street"}],"correctId":"tf-ll-004-a","explanation":"In Arthur Conan Doyle's A Study in Scarlet, Watson writes that they 'inspected the rooms at No. 221B, Baker Street.' The scene appears in the chapter 'The Science of Deduction.'","hint":"The address is revealed in the chapter titled 'The Science of Deduction.'","source":{"title":"A Study in Scarlet by Arthur Conan Doyle (Project Gutenberg eBook #244)","url":"https://www.gutenberg.org/cache/epub/244/pg244.txt"},"verified":{"status":"verified","date":"2026-10-25","note":"Project Gutenberg text: 'inspected the rooms at No. 221B, Baker Street' in Chapter II, The Science of Deduction."},"claims":{"tf-ll-004-a":"I'm going with Baker Street — a classic central London address.","tf-ll-004-b":"I'm going with Fleet Street — a classic central London street.","tf-ll-004-c":"I'm going with Downing "Chinese poetry has many classic forms, but the haiku is Japanese."}},{"id":"tf-ll-008","category":"Language & Literature","difficulty":"easy","prompt":"What is a word like \"level\" or \"refer,\" which reads the same forwards and backwards, called?","answers":[{"id":"tf-ll-008-a","text":"A palindrome"},{"id":"tf-ll-008-b","text":"A homophone"},{"id":"tf-ll-008-c","text":"An anagram"}],"correctId":"tf-ll-008-a","explanation":"The Cambridge Dictionary defines a palindrome as a word or group of words that is the same read forwards or backwards. It gives 'refer' and 'level' as examples.","hint":"Cambridge's usage examples say a movement of music can be one, with its material recapitulated in reverse.","source":{"title":"palindrome (Cambridge Dictionary)","url":"https://dictionary.cambridge.org/dictionary/english/palindrome"},"verified":{"status":"verified","date":"2026-10-25","note":"Cambridge Dictionary: palindrome — same read forwards or backwards; 'Refer' and 'level' are palindromes."},"claims":{"tf-ll-008-a":"I'm backing a palindrome — it's a classic bit of wordplay.","tf-ll-008-b":"I'm backing a homophone — it's a classic bit of wordplay.","tf-ll-008-c":"I'm backing an anagram — it's a classic bit of wordplay."},"corrections":{"tf-ll-008-b":"A homophone sounds like another word with a different meaning, like 'pair' and 'pear.'","tf-ll-008-c":"An anagram rearranges letters into a different word, like 'listen' and 'silent.'"}},{"id":"tf-ll-009","category":"Language & Literature","difficulty":"medium","prompt":"Who wrote Wuthering Heights?","answers":[{"id":"tf-ll-009-a","text":"Anne Brontë"},{"id":"tf-ll-009-b","text":"Charlotte Brontë"},{"id":"tf-ll-009-c","text":"Emily Brontë"}],"correctId":"tf-ll-009-c","explanation":"Project Gutenberg's catalog lists Wuthering Heights by Emily Brontë. Her sisters Charlotte and Anne were also novelists.","hint":"She was one of three novelist sisters, and this was her only novel.","source":{"title":"Wuthering Heights by Emily Bron ,"prompt":"What is the name of Don Quixote's horse?","answers":[{"id":"tf-ll-011-a","text":"Bucephalus"},{"id":"tf-ll-011-b","text":"Rocinante"},{"id":"tf-ll-011-c","text":"Dapple"}],"correctId":"tf-ll-011-b","explanation":"In Cervantes's novel, Don Quixote considers many names before deciding on Rocinante, a name he finds lofty and sonorous. The novel's prefatory verses include a poem 'On Rocinante.'","hint":"The knight tries out and rejects 'a multitude of names' before settling on this one.","source":{"title":"Don Quixote by Miguel de Cervantes, trans. John Ormsby (Project Gutenberg eBook #996)","url":"https://www.gutenberg.org/cache/epub/996/pg996.txt"},"verified":{"status":"verified","date":"2026-10-25","note":"Project Gutenberg text: 'he decided upon calling him Rocinante, a name, to his thinking, lofty, sonorous...'."},"claims":{"tf-ll-011-a":"I think it's Bucephalus — a grand name for a heroic steed.","tf-ll-011-b":"I think it's Rocinante — a grand name for a scrawny beast.","tf-ll-011-c":"I think it's Dapple — a humble name for a humble beast."},"corrections":{"tf-ll-011-a":"Bucephalus was Alexander the Great's horse, not Don Quixote's.","tf-ll-011-c":"Dapple is the name commonly given to Sancho Panza's donkey in English translations."}},{"id":"tf-ll-012","category":"Language & Literature","difficulty":"medium","prompt":"What is the subtitle of Mary Shelley's novel Frankenstein?","answers":[{"id":"tf-ll-012-a","text":"The Modern Icarus"},{"id":"tf-ll-012-b","text":"The Modern Prometheus"},{"id":"tf-ll-012-c","text":"A Gothic Tale"}],"correctId":"tf-ll-012-b","explanation":"The novel's full title is Frankenstein; or, The Modern Prometheus, by Mary Wollstonecraft Shelley. Victor Frankenstein is the scientist who brings his creature to life.","hint":"The subtitle likens Victor to a figure from Greek myth.","source":{"title":"Frankenstein; or, The Modern Prometheus by Mary Wollstonecraft Shelley (Project Gutenberg)","url":"https://www.gutenberg.org/ebooks/84"}, ink it was Leo Tolstoy — a celebrated Russian novelist."},"corrections":{"tf-ll-016-b":"Émile Zola never won the Nobel Prize; it went to Sully Prudhomme in 1901.","tf-ll-016-c":"Leo Tolstoy never won the Nobel Prize; the 1901 laureate was Sully Prudhomme."}},{"id":"tf-ll-017","category":"Language & Literature","difficulty":"hard","prompt":"Rudyard Kipling, the 1907 Literature laureate, was born in which city?","answers":[{"id":"tf-ll-017-a","text":"Calcutta (Kolkata)"},{"id":"tf-ll-017-b","text":"Delhi"},{"id":"tf-ll-017-c","text":"Bombay (Mumbai)"}],"correctId":"tf-ll-017-c","explanation":"NobelPrize.org records Kipling's birthplace as Bombay, British India (now Mumbai). He lived with relatives in England from age 6 to 17 before returning to India.","hint":"As a child he spoke English, Hindi and Portuguese.","source":{"title":"Rudyard Kipling – Facts (NobelPrize.org)","url":"https://www.nobelprize.org/prizes/literature/1907/kipling/facts/"},"verified":{"status":"verified","date":"2026-10-25","note":"NobelPrize.org: Kipling born 30 December 1865, Bombay, British India (now Mumbai); spoke English, Hindi and Portuguese as a child."},"claims":{"tf-ll-017-a":"I'm going with Calcutta — a big city of British India.","tf-ll-017-b":"I'm going with Delhi — a big city of British India.","tf-ll-017-c":"I'm going with Bombay — a big city of British India."},"corrections":{"tf-ll-017-a":"Calcutta was Tagore's birthplace; Kipling was born in Bombay.","tf-ll-017-b":"Kipling was born in Bombay, not Delhi."}},{"id":"tf-ll-018","category":"Language & Literature","difficulty":"hard","prompt":"Rabindranath Tagore, the 1913 Literature laureate, originally wrote in which language?","answers":[{"id":"tf-ll-018-a","text":"Bengali"},{"id":"tf-ll-018-b","text":"Urdu"},{"id":"tf-ll-018-c","text":"Hindi"}],"correctId":"tf-ll-018-a","explanation":"NobelPrize.org notes that Tagore originally wrote in Bengali, later reaching a broad Western audience by recasting his poetry in English. He was born
