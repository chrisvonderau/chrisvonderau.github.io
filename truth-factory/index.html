      notes.forEach((m, i) => tone(R, { t: t + i * 0.06, f: mtof(m), g: 0.2, a: 0.003, r: 0.12, pan: (i - 1) * 0.3 }));
      bell(R, t + 0.18, mtof(91), 0.24, 0.7, 0);
      [0.36, 0.54].forEach((d, i) => bell(R, t + 0.18 + d, mtof(91), 0.09 / (i + 1), 0.35, i ? 0.5 : -0.5));
    },
    sellIt(R, t) {              // amber/magenta confident accent: filter-swept major chord + bell wink
      [62, 66, 69].forEach((m, i) => tone(R, { t, f: mtof(m), type: 'sawtooth', g: 0.16, a: 0.03, h: 0.08, r: 0.45, lp: 400, lp2: 3600, lpT: 0.18, q: 2, pan: (i - 1) * 0.4 }));
      tone(R, { t, f: mtof(38), g: 0.35, a: 0.01, r: 0.4 });
      bell(R, t + 0.12, mtof(81), 0.22, 0.55, 0.2);
      bell(R, t + 0.22, mtof(86), 0.14, 0.45, -0.2);
    },
    riser(R, t, o) {            // amber suspense
      const d = clamp(num(o && o.duration, 2.4), 0.8, 8);
      noise(R, { t, f: 300, f2: 4200, glide: d, q: 3, g: 0.22, a: d * 0.95, r: 0.08, type: 'bandpass' });
      tone(R, { t, f: mtof(50), f2: mtof(62), glide: d, type: 'sawtooth', detune: -8, g: 0.09, a: d * 0.9, r: 0.1, lp: 300, lp2: 2400, lpT: d });
      tone(R, { t, f: mtof(57), f2: mtof(69), glide: d, type: 'sawtooth', detune: 8, g: 0.09, a: d * 0.9, r: 0.1, lp: 300, lp2: 2400, lpT: d });
      tone(R, { t, f: mtof(38), g: 0.18, a: d * 0.8, r: 0.15 });
      // accelerating pulse ticks
      let x = 0, gap = 0.3;
      while (x < d - 0.08) { metalClick(R, t + x, 0.12 + 0.25 * (x / d), 0, 2600 + 1600 * (x / d)); x += gap; gap = Math.max(0.07, gap * 0.85); }
    },
    truthReveal(R, t) {         // the satisfying correct-capsule tone
      boom(R, t, 0.35, 98);
      [74, 78, 81, 86].forEach((m, i) => bell(R, t + i * 0.035, mtof(m), 0.17, 1.4, (i - 1.5) * 0.3));
      pad(R, t, [50, 57, 62], 0.22, 0.05, 0.3, 1.0, 1400);
      [98, 102, 105].forEach((m, i) => tone(R, { t: t + 0.18 + i * 0.07, f: mtof(m), g: 0.05, a: 0.002, r: 0.25, pan: (i - 1) * 0.6 }));
    },
    wrongReject(R, t, o) {      // restrained falsehood stamp + dissolve
      const k = num(o && o.index, 0) % 3, p = (k - 1) * 0.35, s = Math.pow(2, -k / 12);
      tone(R, { t, f: 120 * s, f2: 60 * s, glide: 0.18, g: 0.55, a: 0.002, r: 0.22, pan: p });
      noise(R, { t, f: 900, q: 1.2, g: 0.3, a: 0.001, r: 0.06, pan: p });
      noise(R, { t: t + 0.04, f: 3200, f2: 350, glide: 0.5, type: 'lowpass', q: 0.8, g: 0.14, a: 0.02, h: 0.08, r: 0.4, pan: p });
      tone(R, { t: t + 0.03, f: mtof(64) * s, f2: mtof(59) * s, glide: 0.3, type: 'triangle', g: 0.13, a: 0.01, r: 0.38, lp: 1400, pan: p });
    },
    scoreTick(R, t, o) {        // slightly rising pitch per step
      const step = clamp(Math.floor(num(o && o.step, 0)), 0, 36);
      const f = 1046.5 * Math.pow(2, step / 36);
      tone(R, { t, f, type: 'triangle', g: 0.22, a: 0.002, r: 0.06 });
      tone(R, { t, f: f * 2, g: 0.06, a: 0.002, r: 0.03 });
    },
    roundTransition(R, t) {
      noise(R, { t, f: 400, f2: 3000, glide: 0.55, q: 2, g: 0.16, a: 0.5, r: 0.5, pan: 0 });
      boom(R, t + 0.55, 0.4, 82);
      [74, 81, 79].forEach((m, i) => bell(R, t + 0.55 + i * 0.16, mtof(m), 0.2, 0.9, (i - 1) * 0.3));
      pad(R, t + 0.55, [50, 57, 65], 0.16, 0.03, 0.2, 0.8, 1200);
    },
    victory(R, t) {
      const b = 0.2;
      [[74, 0], [81, 1], [79, 1.5], [81, 2], [86, 3]].forEach(([m, x]) => bell(R, t + x * b, mtof(m), 0.2, 0.9, 0));
      boom(R, t + 3 * b, 0.4, 73);
      pad(R, t + 3 * b, [50, 57, 62, 66, 69], 0.26, 0.05, 1.1, 1.2, 2200, 0.4);
      [86, 90, 93, 98].forEach((m, i) => bell(R, t + 3 * b + 0.15 + i * 0.09, mtof(m), 0.09, 0.8, (i % 2 ? 0.5 : -0.5)));
      [0, 1, 2, 3].forEach((i) => pluck(R, t + 3 * b + i * 0.3, mtof(38 + (i % 2 ? 7 : 0)), 0.25, 0.5));
    },
    defeat(R, t) {              // gentle, wry consolation: falling "oh well", then a kind major wink
      [[77, 0], [76, 0.3], [72, 0.6]].forEach(([m, x]) => tone(R, { t: t + x, f: mtof(m), type: 'triangle', g: 0.2, a: 0.02, h: 0.12, r: 0.3, lp: 1800 }));
      tone(R, { t: t + 0.9, f: mtof(70), type: 'triangle', g: 0.17, a: 0.03, h: 0.25, r: 0.45, lp: 1600, vib: 5.5, vibDepth: 18 });
      pad(R, t, [46, 53, 57, 62], 0.12, 0.2, 0.9, 0.7, 900);
      [62, 66, 69].forEach((m, i) => pluck(R, t + 1.55 + i * 0.07, mtof(m + 12), 0.13, 0.7, (i - 1) * 0.4, 5));
    },
    audienceReact(R, t, o) {
      const large = o && o.size === 'large', c = R.ctx;
      const src = c.createBufferSource(); src.buffer = applauseBuffer(c, large ? 'large' : 'small');
      const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 350;
      const g = c.createGain(); g.gain.value = large ? 0.75 : 0.6;

      src.start(t); R.end = Math.max(R.end, t + src.buffer.duration + 0.02); R.n++;
    },
    tickWarning(R, t) {         // soft wooden tick for the last 5 s
      tone(R, { t, f: 880, type: 'triangle', g: 0.2, a: 0.002, r: 0.07, lp: 2500 });
      tone(R, { t, f: 440, g: 0.14, a: 0.002, r: 0.09 });
    },
    pauseCue(R, t) {
      tone(R, { t, f: mtof(79), g: 0.18, a: 0.004, r: 0.12 });
      tone(R, { t: t + 0.1, f: mtof(74), g: 0.16, a: 0.004, r: 0.18 });
    },
    resumeCue(R, t) {
      tone(R, { t, f: mtof(74), g: 0.16, a: 0.004, r: 0.12 });
      tone(R, { t: t + 0.1, f: mtof(79), g: 0.18, a: 0.004, r: 0.18 });
    },
    titleTheme(R, t) { renderTitle(R, t); }
  };
  const CUE_NAMES = Object.keys(CUES);

  // ------------------------------------------------------------ title theme
  // ~8.5 s, 120 bpm. Motif "the TRUTH fac-to-ry": D5 A5 G5 F5 A5, answered, then a bright D-major resolve.
  function renderTitle(R, t0) {
    const b = 0.5;
    const motif = [
      [74, 0, 1], [81, 1, 0.5], [79, 1.5, 0.5], [77, 2, 1], [81, 3, 1],
      [76, 4, 1], [74, 5, 0.5], [76, 5.5, 0.5], [77, 6, 1], [72, 7, 1],
      [74, 8, 1], [81, 9, 0.5], [79, 9.5, 0.5], [82, 10, 1], [81, 11, 1],
      [86, 12, 3]
    ];
    motif.forEach(([m, x, d]) => {
      bell(R, t0 + x * b, mtof(m), 0.2, Math.max(0.8, d * b * 2.2), 0);
      tone(R, { t: t0 + x * b, f: mtof(m - 12), type: 'triangle', g: 0.06, a: 0.01, h: d * b * 0.6, r: 0.3, lp: 1500 });
    });
    const chords = [
      [0, [50, 57, 65], 38], [4, [48, 55, 64], 36], [6, [46, 53, 62], 34], [8, [46, 53, 62], 34],
      [10, [48, 55, 64], 36], [12, [50, 57, 62, 66, 69], 38]
    ];
    chords.forEach(([x, notes, bass], i) => {
      const next = i + 1 < chords.length ? chords[i + 1][0] : 16;
      const len = (next - x) * b;
      pad(R, t0 + x * b, notes, 0.14, 0.25, Math.max(0, len - 0.25), i === chords.length - 1 ? 1.6 : 0.6, 1100, 0.3);
      for (let k = 0; k < next - x; k += 2) pluck(R, t0 + (x + k) * b, mtof(bass), 0.22, 0.7);
    });
    for (let k = 0; k < 24; k++) {       // soft brushed pulse on eighths
      noise(R, { t: t0 + k * b * 0.5, f: 7000, type: 'highpass', q: 0.7, g: k % 2 ? 0.03 : 0.05, a: 0.002, r: 0.04 });
    }
    [3.5, 7.5, 11.5].forEach((x, i) => tone(R, { t: t0 + x * b, f: mtof(93 + i * 2), g: 0.06, a: 0.002, r: 0.15, pan: i % 2 ? 0.5 : -0.5 }));
    boom(R, t0 + 12 * b, 0.4, 73);
    [90, 93, 98].forEach((m, i) => bell(R, t0 + 12 * b + 0.2 + i * 0.12, mtof(m), 0.07, 1.0, (i - 1) * 0.5));
  }

  // --------------------------------------------------------------- studio bed
  // 4 bars @ 90 bpm. Layer 'base' (calm) always plays; layer 'lift' adds pulse + data arpeggio for intensity 1.
  const BED_CHORDS = [
    { root: 38, notes: [50, 57, 60, 64, 65] },  // Dm9
    { root: 34, notes: [46, 53, 57, 62] },      // Bbmaj7
    { root: 31, notes: [43, 50, 53, 57, 58] },  // Gm9
    { root: 33, notes: [45, 52, 55, 62] }       // A7sus4
  ];
  function renderBedLayer(R, t0, layer) {
    const bar = 4 * BED_BEAT;
    BED_CHORDS.forEach((ch, i) => {
      const t = t0 + i * bar;
      if (layer === 'base') {
        pad(R, t, ch.notes, 0.2, 0.9, bar - 0.9, 1.6, 750, 0.35);
        [0, 2].forEach((bt) => tone(R, { t: t + bt * BED_BEAT, f: mtof(ch.root), g: 0.22, a: 0.01, r: 1.1, lp: 400 }));
        for (let bt = 0; bt < 4; bt++) tone(R, { t: t + bt * BED_BEAT, f: 58, f2: 44, glide: 0.2, g: bt === 0 ? 0.16 : 0.08, a: 0.01, r: 0.3 });
        for (let bt = 0; bt < 4; bt++) noise(R, { t: t + (bt + 0.5) * BED_BEAT, f: 6500, type: 'highpass', g: 0.018, a: 0.003, r: 0.05 });
        if (i % 2 === 0) bell(R, t + 2.5 * BED_BEAT, mtof(ch.notes[ch.notes.length - 1] + 12), 0.05, 1.6, i ? 0.4 : -0.4);
      } else {
        const arp = ch.notes.slice(1).map((m) => m + 24);
        for (let k = 0; k < 8; k++) {
          tone(R, { t: t + k * BED_BEAT * 0.5, f: mtof(arp[k % arp.length]), g: 0.11, a: 0.003, r: 0.2, lp: 3000, pan: k % 2 ? 0.45 : -0.45 });
          tone(R, { t: t + k * BED_BEAT * 0.5, f: mtof(ch.root + 12), type: 'sawtooth', g: k % 2 ? 0.12 : 0.2, a: 0.004, r: 0.18, lp: 380, q: 2 });
        }
        noise(R, { t: t + bar - 1.2, f: 600, f2: 3000, glide: 1.2, q: 2, g: 0.06, a: 1.15, r: 0.05 });
      }
    });
  }

  function makeReverb(ctx, input, out, wet, seconds) {
    const conv = ctx.createConvolver(); conv.buffer = impulseBuffer(ctx, seconds || 1.6);
    const send = ctx.createGain(); send.gain.value = wet;
    input.connect(send); send.connect(conv); conv.connect(out);
    return { conv, send };
  }

  // Renders one bed layer offline and folds the tail onto the head so the loop seam is continuous.
  function renderBedBuffer(OAC, sampleRate, layer, targetCtx) {
    const N = Math.round(BED_LEN * sampleRate), T = Math.round(BED_TAIL * sampleRate);
    let oc;
    try { oc = new OAC(2, N + T, sampleRate); } catch (e) { return Promise.resolve(null); }
    const out = oc.createGain(); out.gain.value = BED_LAYER_GAIN[layer] || 0.3; out.connect(oc.destination);
    const dry = oc.createGain(); dry.connect(out);
    makeReverb(oc, dry, out, 0.35, 2.2);
    const R = { ctx: oc, out: dry, end: 0, n: 0 };
    renderBedLayer(R, 0, layer);
    return new Promise((resolve) => {
      let done = false;
      const finish = (buf) => {
        if (done) return; done = true;
        if (!buf) return resolve(null);
        try {
          const dst = (targetCtx || oc).createBuffer(2, N, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const s = buf.getChannelData(ch), d = dst.getChannelData(ch);
            for (let i = 0; i < N; i++) d[i] = s[i] + (i < T ? s[i + N] : 0);
          }
          resolve(dst);
        } catch (e) { resolve(null); }
      };
      try {
        oc.oncomplete = (ev) => finish(ev && ev.renderedBuffer);
        const p = oc.startRendering();
        if (p && typeof p.then === 'function') p.then(finish, () => finish(null));
      } catch (e) { finish(null); }
    });
  }

  // ------------------------------------------------------------- mixer graph
  let SAFETY = null;
  function safetyCurve() {   // curve over input u in [-1,1] represents x = 2u (the 0.5 pre-gain is undone here)
    if (SAFETY) return SAFETY;
    const n = 4097, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = 2 * (i / (n - 1) * 2 - 1), ax = Math.abs(x);
      c[i] = Math.sign(x) * (ax < 0.7 ? ax : 0.7 + 0.28 * Math.tanh((ax - 0.7) / 0.28));
    }
    return (SAFETY = c);
  }
  function createGraph(ctx) {
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -6; comp.knee.value = 4; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.15;
    const master = ctx.createGain(); master.gain.value = HEADROOM;
    // brick-wall safety after the compressor: transparent below 0.7, soft knee to a hard ceiling of 0.98
    const pre = ctx.createGain(); pre.gain.value = 0.5;
    const clip = ctx.createWaveShaper(); clip.curve = safetyCurve(); clip.oversample = 'none';
    master.connect(comp); comp.connect(pre); pre.connect(clip); clip.connect(ctx.destination);
    const fx = ctx.createGain(); fx.connect(master);
    const music = ctx.createGain(); const duckG = ctx.createGain(); music.connect(duckG); duckG.connect(master);
    const rev = makeReverb(ctx, fx, master, 0.2, 1.6);
    return { ctx, comp, clip, master, fx, music, duck: duckG, rev };
  }

  // ------------------------------------------------------------ live state
  const S = {
    ctx: null, g: null, unavailable: false, prefs: loadPrefs(),
    active: [],            // [{gain, end}]
    last: {},              // throttle
    music: null,           // {kind, intensity, nodes...}
    bedBuffers: null, bedPromise: null,
    manualDuck: false, speaking: 0, pendingSpeech: [],
    voices: [], paused: false
  };

  function AC() { return root.AudioContext || root.webkitAudioContext || null; }
  function OAC() { return root.OfflineAudioContext || root.webkitOfflineAudioContext || null; }

  function loadPrefs() {
    const p = Object.assign({}, DEFAULT_PREFS);
    try {
      const raw = root.localStorage && root.localStorage.getItem(PREFS_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && typeof o === 'object') sanitizeInto(p, o);
      }
    } catch (e) { /* storage unavailable or corrupt: defaults */ }
    return p;
  }
  function sanitizeInto(p, o) {
    ['musicOn', 'effectsOn', 'voiceOn'].forEach((k) => { if (typeof o[k] === 'boolean') p[k] = o[k]; });
    ['musicVol', 'effectsVol', 'voiceVol'].forEach((k) => { if (typeof o[k] === 'number' && isFinite(o[k])) p[k] = clamp(o[k], 0, 1); });
    return p;
  }
  function savePrefs() { try { root.localStorage && root.localStorage.setItem(PREFS_KEY, JSON.stringify(S.prefs)); } catch (e) { /* ignore */ } }

  const curve = (v) => v * v;  // perceptual volume curve
  function applyLevels(ramp) {
    if (!S.g) return;
    const t = S.ctx.currentTime, tc = ramp ? 0.05 : 0.005;
    try {
      S.g.fx.gain.setTargetAtTime(S.prefs.effectsOn ? FX_BASE * curve(S.prefs.effectsVol) / curve(DEFAULT_PREFS.effectsVol) * 0.9 : 0, t, tc);
      S.g.music.gain.setTargetAtTime(S.prefs.musicOn ? MUSIC_BASE * curve(S.prefs.musicVol) / curve(DEFAULT_PREFS.musicVol) : 0, t, tc);
      applyDuck();
    } catch (e) { /* ignore */ }
  }
  function applyDuck() {
    if (!S.g) return;
    const on = S.manualDuck || S.speaking > 0;
    try { S.g.duck.gain.setTargetAtTime(on ? DUCK_LEVEL : 1, S.ctx.currentTime, on ? 0.08 : 0.35); } catch (e) { /* ignore */ }
  }

  function running() { return !!(S.ctx && S.ctx.state === 'running' && !S.paused); }

  function ensureContext() {
    if (S.ctx || S.unavailable) return S.ctx;
    const C = AC();
    if (!C) { S.unavailable = true; return null; }
    try {
      S.ctx = new C({ latencyHint: 'interactive' });
    } catch (e) {
      try { S.ctx = new C(); } catch (e2) { S.unavailable = true; return null; }
    }
    try {
      S.g = createGraph(S.ctx);
      applyLevels(false);
      try { S.ctx.onstatechange = () => { if (S.ctx.state === 'running' && S.music && !S.music.started) startBedNodes(); }; } catch (e) { /* ignore */ }
    } catch (e) { S.g = null; S.ctx = null; S.unavailable = true; }
    return S.ctx;
  }

  function unlock() {
    try {
      const ctx = ensureContext();
      primeSpeech();
      if (!ctx) return Promise.resolve(false);
      try { // iOS: play a 1-sample silent buffer inside the gesture
        const b = ctx.createBuffer(1, 1, ctx.sampleRate), s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); s.start(0);
      } catch (e) { /* ignore */ }
      let p = null;   // while the game is PAUSED only resume() may wake the context
      try { p = !S.paused && ctx.state !== 'running' && ctx.resume ? ctx.resume() : null; } catch (e) { p = null; }
      const timeout = new Promise((res) => setTimeout(res, 1500));
      return Promise.race([Promise.resolve(p).catch(() => {}), timeout]).then(() => {
        prepareBed();
        return isUnlocked();
      }).catch(() => false);
    } catch (e) { return Promise.resolve(false); }
  }
  function isUnlocked() { return !!(S.ctx && S.ctx.state === 'running'); }
  function isAvailable() { return !!AC(); }

  // ------------------------------------------------------------------ effects
  function play(name, opts) {
    try {
      const fn = CUES[name];
      if (!fn || !S.prefs.effectsOn || !running() || !S.g) return 0;
      const ctx = S.ctx, now = ctx.currentTime;
      const th = THROTTLE[name];
      if (th && S.last[name] !== undefined && now - S.last[name] < th) return 0;
      S.last[name] = now;
      pruneActive(now);
      while (S.active.length >= MAX_CUES) killCue(S.active.shift());
      const gain = ctx.createGain();
      gain.gain.value = CUE_GAIN[name] * clamp(num(opts && opts.gain, 1), 0, 1.5);
      gain.connect(name === 'titleTheme' ? S.g.music : S.g.fx);
      const t = now + 0.02 + clamp(num(opts && opts.delay, 0), 0, 10);
      const R = { ctx, out: gain, end: t, n: 0 };
      fn(R, t, opts || {});
      const rec = { gain, end: R.end, name };
      S.active.push(rec);
      rec.timer = setTimeout(() => { try { gain.disconnect(); } catch (e) { /* ignore */ } const i = S.active.indexOf(rec); if (i >= 0) S.active.splice(i, 1); }, (R.end - now + 0.3) * 1000);
      return R.end - t;
    } catch (e) { return 0; }
  }
  function pruneActive(now) { S.active = S.active.filter((r) => r.end > now); }
  function killCue(rec) {
    if (!rec) return;
    try { const t = S.ctx.currentTime; rec.gain.gain.cancelScheduledValues(t); rec.gain.gain.setTargetAtTime(0, t, 0.01); } catch (e) { /* ignore */ }
    setTimeout(() => { try { rec.gain.disconnect(); } catch (e) { /* ignore */ } }, 80);
  }

  // -------------------------------------------------------------------- music
  function prepareBed() {
    if (S.bedBuffers || S.bedPromise || !S.ctx) return S.bedPromise;
    const O = OAC();
    if (!O) return null;
    const sr = S.ctx.sampleRate;
    S.bedPromise = Promise.all([renderBedBuffer(O, sr, 'base', S.ctx), renderBedBuffer(O, sr, 'lift', S.ctx)])
      .then(([base, lift]) => { if (base) S.bedBuffers = { base, lift }; S.bedPromise = null; if (S.music && S.music.kind && !S.music.started) startBedNodes(); })
      .catch(() => { S.bedPromise = null; });
    return S.bedPromise;
  }

  function startMusic(kind, intensity) {
    try {
      kind = kind === 'title' ? 'title' : 'bed';
      const lvl = intensity ? 1 : 0;
      if (S.music && S.music.kind === kind) { setIntensity(lvl); return; }
      stopMusic(0.6);
      S.music = { kind, intensity: lvl, started: false, nodes: [] };
      if (!S.ctx) return;
      if (kind === 'title') {
        if (running()) {
          const g = S.ctx.createGain(); g.connect(S.g.music);
          const t = S.ctx.currentTime + 0.05, R = { ctx: S.ctx, out: g, end: t, n: 0 };
          renderTitle(R, t);
          S.music.titleGain = g;
          S.music.titleEnd = R.end;
        }
        // after the theme, settle into the calm bed
        const m = S.music;
        m.timer = setTimeout(() => { if (S.music === m) startBedNodes(); }, 7500);
        m.started = false; m.titleStarted = true;
        return;
      }
      startBedNodes();
    } catch (e) { /* ignore */ }
  }

  function startBedNodes() {
    const m = S.music;
    if (!m || m.started || !S.ctx || !S.g) return;
    if (!S.bedBuffers) { prepareBed(); return; }

      h += `<p class="tb-note">${tb.remaining && tb.remaining.length === 1 ? esc(cName(v, tb.remaining[0])) + ' wins the tiebreak.' : 'Still in contention: ' + esc((tb.remaining || []).map((id) => cName(v, id)).join(', ')) + '.'}</p>`;
      if (v.reveal && v.reveal.explanation) h += `<p class="explain">${esc(v.reveal.explanation)}</p>` + factPanel(v.reveal, v);
    } else if (ph === 'REVEAL' && v.reveal && !(ctx.anim && ctx.anim.active)) {
      h = metaRow(v, 'Verdict') + `<h2 class="prompt" style="font-size:clamp(1rem,1.2vw + .4rem,1.35rem)">${esc(v.question.prompt)}</h2>` + noticeBlock(v) + recapHTML(v);
    } else {
      const labels = { QUESTION: 'Private choice', INITIAL_LOCKED: 'All answers locked', CLAIMS: 'Claims', FINAL_DECISION: 'Final decision', REVEAL: 'Processing\u2026', FINAL_VERDICT: 'The Final Verdict \u00b7 private answer', TIEBREAK: 'Tiebreak \u00b7 private answer' };
      h = metaRow(v, labels[ph] || '', ph === 'CLAIMS' || ph === 'FINAL_DECISION' ? 'claims' : '');
      h += tutorialCoach(v);
      if (ph === 'TIEBREAK' && v.tiebreak) h += `<div class="tb-note">Tiebreak ${v.tiebreak.number}: ${esc(v.tiebreak.contenders.map((id) => cName(v, id)).join(' vs '))}${v.tiebreak.humanContending ? '' : ' \u00b7 you are watching'}</div>`;
      if (ph === 'FINAL_VERDICT') h += `<div class="notice-line">One private answer. No claims, no switching, no tokens. Correct = 400.</div>`;
      h += `<h2 class="prompt" id="prompt">${esc(v.question.prompt)}</h2>`;
      if (ph === 'CLAIMS' || ph === 'FINAL_DECISION') h += claimsHeader(v);
      if (ph !== 'FINAL_VERDICT') h += noticeBlock(v);
      if (ph === 'FINAL_DECISION') {
        const sw = v.human.startedWith;
        h += `<div class="notice-line"><span class="started-with">You started with: ${sw ? esc(sw.letter) + ' \u2014 ' + esc(sw.text) : 'no answer'}</span>${v.human.startedUnanswered ? '<span>No original-answer bonus is possible this time.</span>' : ''}</div>`;
      }
      // Everything above the answers scrolls inside .screen-top if space is short; the cards never leave the screen.
      h = `<div class="screen-top" data-k="${esc(v.question.id + '|' + ph)}">${h}</div>` + answerCards(v, ctx);
      withAnswers = true;
    }
    S.screen.classList.toggle('with-answers', withAnswers);
    setHTML(S.screen, h);
  }
  function idleScreen() {
    return `<div style="margin:auto;text-align:center">${TF.Art.logo}<p class="tagline" style="margin-top:.6rem">Choose your answer. Hear their arguments. Decide whom to trust. Watch the factory expose the truth.</p></div>`;
  }

  /* ------------------------------------------------------------------ controls */
  function renderControls(v, ctx) {
    const S = TF.Stage.el;
    let L = '', M = '', R = '';
    const seq = v ? v.seq : 0;
    const h = (v && v.human) || {};
    const ph = v && v.phase;
    const sc = ctx.prefs.showShortcuts !== false;
    const keys = [];
    if (!v || MATCH_PHASES.indexOf(ph) < 0 || ph === 'RESULTS') { setHTML(S.ctrlLeft, ''); setHTML(S.ctrlMid, ''); setHTML(S.ctrlRight, ''); return; }
    const tut = v.tutorial && v.tutorial.active;
    if (tut && legal(v, 'SKIP_TUTORIAL')) L += btn('skipTut', 'Skip practice', { cls: 'ghost', seq });
    const tokenBtns = () => {
      const me = v.contestants.find((c) => c.isHuman) || { tokens: { sell: 0, prove: 0 } };
      const sellN = tut ? 'practice' : me.tokens.sell + ' left';
      const proveN = tut ? 'practice' : me.tokens.prove + ' left';
      let x = '';
      if (ph === 'CLAIMS') {
        const armed = !!h.sellArmed;
        x += btn(armed ? 'disarmSell' : 'armSell', `${armed ? '\u2605 SELL IT ARMED' : 'SELL IT'} <span class="count">${sellN}</span>`, { cls: 'magenta' + (armed ? ' armed' : ''), seq, fk: 'sell', key: 'S', pressed: armed,
          disabled: !(armed ? legal(v, 'DISARM_SELL') : legal(v, 'ARM_SELL')), aria: armed ? 'SELL IT is armed. Press to disarm.' : 'Arm SELL IT: makes your claim more persuasive. ' + sellN });
        keys.push('<kbd>S</kbd> sell');
      }
      const proveLbl = h.proveUsedThisQuestion ? 'PROVE IT USED' : 'PROVE IT';
      x += btn('prove', `${proveLbl} <span class="count">${proveN}</span>`, { cls: 'teal', seq, key: 'P', disabled: !legal(v, 'USE_PROVE'), aria: 'PROVE IT: reveal a private verified hint. ' + proveN });
      keys.push('<kbd>P</kbd> prove');
      return x;
    };
    const hint = h.hint ? `<div class="hint-panel" role="status"><b>PROVE IT \u00b7 VERIFIED HINT (PRIVATE)</b>${esc(h.hint)}</div>` : '';
    if (INITIAL_PHASES.indexOf(ph) >= 0) {
      const spectating = ph === 'TIEBREAK' && v.tiebreak && !v.tiebreak.humanContending;
      if (spectating) M += btn('next', 'WATCH THE TIEBREAK', { cls: 'primary big', seq, fk: 'main' });
      else {
        M += btn('lockInitial', ph === 'FINAL_VERDICT' ? 'LOCK VERDICT' : 'LOCK INITIAL ANSWER', { cls: 'primary big', seq, fk: 'main', disabled: !h.canLockInitial, key: 'Enter' });
        if (!h.selection) M += `<span class="fallback">Choose A, B or C first.</span>`;
        keys.push('<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> choose', '<kbd>Enter</kbd> lock');
      }
    } else if (ph === 'INITIAL_LOCKED') {
      M += `<span class="fallback">All answers locked. Revealing claims\u2026</span>` + btn('next', 'SHOW CLAIMS', { cls: 'ghost', seq, fk: 'main', key: 'Enter' });
    } else if (ph === 'CLAIMS') {
      L += tokenBtns() + hint;
      M += btn('next', 'READY TO DECIDE', { cls: 'primary big', seq, fk: 'main', key: 'Enter' });
      keys.push('<kbd>Enter</kbd> continue');
    } else if (ph === 'FINAL_DECISION') {
      L += tokenBtns() + hint;
      if (h.needsFollow || (h.followOptions && h.followOptions.length && h.finalSelection && h.finalSelection !== h.initial)) {
        M += `<div class="follow-row" role="group" aria-label="Whose claim did you follow?"><span class="lbl">Whose claim are you following?</span>` +
          (h.followOptions || []).map((o) => btn('follow', 'Follow ' + esc(firstName(o.name)), { cls: 'follow big ' + o.contestantId, arg: o.contestantId, seq, fk: 'follow-' + o.contestantId,
            pressed: h.follow === o.contestantId, key: o.contestantId === 'vera' ? 'V' : 'F' })).join('') + `</div>`;
        keys.push('<kbd>V</kbd>/<kbd>F</kbd> follow');
      }
      const switching = h.finalSelection && h.finalSelection !== h.initial;
      if (h.initial) M += btn('stay', 'STAY', { cls: switching ? 'ghost big' : 'teal big', seq, fk: 'stay', disabled: !legal(v, 'STAY') });
      M += btn('lockFinal', 'LOCK FINAL ANSWER', { cls: 'primary big', seq, fk: 'main', disabled: !h.canLockFinal, key: 'Enter' });
      keys.push('<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> choose', '<kbd>Enter</kbd> lock');
    } else if (ph === 'REVEAL') {
      if (ctx.anim && ctx.anim.active) { M += btn('skipAnim', 'SKIP ANIMATION', { cls: 'ghost big', fk: 'main', key: 'Enter' }); keys.push('<kbd>Enter</kbd> skip'); }
      else {
        const lastOfRound = v.match && [4, 8, 11].indexOf(v.match.questionNumber) >= 0 && v.match.kind === 'main';
        M += btn('next', v.match && v.match.kind === 'tutorial' ? 'START THE MATCH' : lastOfRound ? 'CONTINUE' : 'NEXT QUESTION', { cls: 'primary big', seq, fk: 'main', key: 'Enter' });
        keys.push('<kbd>Enter</kbd> next');
      }
    } else if (ph === 'ROUND_SUMMARY') {
      const nr = v.roundSummary && v.roundSummary.nextRound;
      M += btn('next', nr && nr.number === 4 ? 'TO THE FINAL VERDICT' : 'START ROUND ' + (nr ? nr.number : ''), { cls: 'primary big', seq, fk: 'main', key: 'Enter' });
      keys.push('<kbd>Enter</kbd> continue');
    } else if (ph === 'FINAL_REVEAL') {
      const fr = v.finalReveal || { revealed: [], order: [] };
      const nextId = fr.order[fr.revealed.length];
      M += btn('next', !fr.complete && nextId ? 'REVEAL ' + esc(firstName(cName(v, nextId))).toUpperCase() : fr.tie ? 'TO THE TIEBREAK' : 'SEE THE RESULTS', { cls: 'primary big', seq, fk: 'main', key: 'Enter' });
      keys.push('<kbd>Enter</kbd> continue');
    } else if (ph === 'TIEBREAK_REVEAL') {
      M += btn('next', 'CONTINUE', { cls: 'primary big', seq, fk: 'main', key: 'Enter' });
    }
    keys.push('<kbd>Esc</kbd> pause');
    if (sc) R += `<div class="shortcuts" aria-hidden="true">${keys.join(' \u00b7 ')}</div>`;
    setHTML(S.ctrlLeft, L); setHTML(S.ctrlMid, M); setHTML(S.ctrlRight, R);
  }
  function noticeBlock(v) {
    const fb = v.phase === 'CLAIMS' || v.phase === 'FINAL_DECISION';
    return (v.notices || []).map((n, i) => `<div class="notice-line fallback-note" role="note">${fb && i === 0 ? '<b>If time runs out:</b>' : ''}${esc(n)}</div>`).join('');
  }

  /* ------------------------------------------------------------------ overlays */
  function renderOverlays(v, ctx) {
    const S = TF.Stage.el;
    let h = '';
    const o = ctx.overlay;
    if (o === 'title') h = titleHTML(ctx);
    else if (o === 'setup') h = setupHTML(ctx);
    else if (o === 'howto') h = howtoHTML(ctx);
    else if (o === 'settings') h = settingsHTML(v, ctx);
    else if (v && v.paused && MATCH_PHASES.indexOf(v.phase) >= 0) h = pauseHTML(v, ctx);
    else if (v && v.phase === 'RESULTS' && v.results) h = resultsHTML(v, ctx);
    if (ctx.errorMsg && (o === 'title')) h += '';
    setHTML(S.overlays, h);
    S.studio.classList.toggle('menu-open', !!h);
    S.studio.classList.toggle('title-open', o === 'title');
    // Everything behind a modal overlay is inert (no focus, no taps) until it closes.
    Array.prototype.forEach.call(S.studio.children, (c) => {
      if (c === S.overlays || c === S.live || c === S.liveAssert || c === S.landNotice) return;
      if (h) c.setAttribute('inert', ''); else c.removeAttribute('inert');
    });
  }

  function titleHTML(ctx) {
    const A = TF.Art;
    let menu = '';
    if (ctx.hasSave) {
      menu += btn('resumeSave', 'RESUME MATCH', { cls: 'primary big', fk: 't-resume' });
      menu += btn('newGame', 'NEW GAME', { cls: 'big', fk: 't-new' });
    } else menu += btn('play', 'PLAY', { cls: 'primary big', fk: 't-play' });
    menu += btn('howto', 'HOW TO PLAY', { cls: 'big', fk: 't-how' });
    menu += btn('settings', 'SETTINGS', { cls: 'big', fk: 't-set' });
    return `<div class="overlay clear" role="dialog" aria-modal="true" aria-labelledby="ttl"><div class="title-wrap">
      <h1 id="ttl" style="margin:0">${A.logo}</h1>
      <p class="tagline">Choose your answer. Hear their arguments. Decide whom to trust. Watch the factory expose the truth.</p>
      <div class="title-cast" aria-hidden="true">
        <div class="mini">${A.vera()}VERA FLINT</div><div class="mini" style="transform:translateY(-10px)">${A.host()}AMBROSE QUILL<br><span style="opacity:.7">HOST</span></div><div class="mini">${A.felix()}FELIX VALE</div>
      </div>
      ${ctx.saveMsg ? `<p class="save-note" role="status">${esc(ctx.saveMsg)}</p>` : ''}
      ${ctx.hasSave && ctx.saveInfo ? `<p class="save-note">Saved match: ${esc(ctx.saveInfo)}</p>` : ''}
      <div class="menu">${menu}</div>
    </div></div>`;
  }

  function setupHTML(ctx) {
    const s = ctx.setup;
    const seg = (key, opts) => `<div class="seg" role="group">${opts.map((o) => `<button type="button" data-act="setupSet" data-key="${key}" data-arg="${o.v}" data-fk="${key}-${o.v}" aria-pressed="${String(s[key]) === String(o.v)}">${esc(o.l)}</button>`).join('')}</div>`;
    return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="setupH"><div class="panel">
      <h2 id="setupH">New match</h2>
      <div class="field"><label for="pname">Your name</label><input id="pname" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(s.playerName)}"></div>
      <div class="field"><span class="lbl" id="diffL">Difficulty</span>${seg('difficulty', [{ v: 'casual', l: 'Casual' }, { v: 'normal', l: 'Normal' }, { v: 'expert', l: 'Expert' }])}
        <span class="desc" style="color:var(--ink-faint);font-size:.85rem">Changes how much Vera and Felix know and how shrewdly they decide. Rules and scoring are identical.</span></div>
      <div class="toggle"><span>Relaxed mode<span class="desc">No decision timers. Take as long as you like.</span></span>${sw('setupToggle', 'relaxed', s.relaxed)}</div>
      <div class="toggle"><span>Practice question first<span class="desc">One unscored tutorial question: pick, listen, stay or switch, reveal.</span></span>${sw('setupToggle', 'tutorial', s.tutorial)}</div>
      <div class="row">${btn('start', 'START THE SHOW', { cls: 'primary big', fk: 'start' })}${btn('backTitle', 'Back', { cls: 'ghost', fk: 'back' })}</div>
    </div></div>`;
  }
  function sw(act, key, on, label) {
    return `<button type="button" class="switch" role="switch" data-act="${act}" data-key="${key}" data-fk="${act}-${key}" aria-checked="${on ? 'true' : 'false'}"${label ? ` aria-label="${esc(label)}"` : ''}><span class="st">${on ? 'On' : 'Off'}</span></button>`;
  }

  function howtoHTML() {
    return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="howH"><div class="panel">
      <h2 id="howH">How to play</h2>
      <p>Twelve questions, three contestants, one truth machine. Each question has four decisions:</p>
      <div class="howto-steps">
        <div class="st"><b>1 \u00b7 PICK</b><span>Choose A, B or C privately and lock it in (20 s; no clock in Relaxed mode).</span></div>
        <div class="st"><b>2 \u00b7 LISTEN</b><span>Everyone\u2019s first answer becomes a public claim. Claims are not facts. Arm SELL IT to make yours more persuasive, or spend PROVE IT for a private verified hint.</span></div>
        <div class="st"><b>3 \u00b7 STAY OR SWITCH</b><span>Keep your answer or switch (15 s). Switching to an opponent\u2019s answer? Tap whose claim you followed.</span></div>

      </div>
      <h3>Scoring</h3>

      <p>You have two SELL IT and two PROVE IT tokens for the whole match (at most one PROVE IT per question).</p>

      <p>Xbox controller: D-pad or left stick moves, A selects, X locks in or continues, Y PROVE IT, RB SELL IT, B goes back, Start pauses.</p>
      <div class="row">${btn('closePanel', 'Got it', { cls: 'primary big', fk: 'close' })}</div>
    </div></div>`;

  function settingsHTML(v, ctx) {
    const p = ctx.prefs, a = ctx.audioPrefs || {};
    const vol = (key, val, label) => `<input type="range" min="0" max="100" step="5" value="${Math.round((val == null ? 0.8 : val) * 100)}" data-act="vol" data-key="${key}" aria-label="${label}">`;
    const ts = `<div class="seg" role="group" aria-label="Text size">${TEXT_SIZES.map((t) => `<button type="button" data-act="textSize" data-arg="${t.v}" data-fk="ts-${t.v}" aria-pressed="${Number(p.textScale) === t.v}">${t.l}</button>`).join('')}</div>`;

      <div class="toggle"><span>Effects</span><span style="display:flex;gap:.8rem;align-items:center">${vol('effectsVol', a.effectsVol, 'Effects volume')}${sw('audioToggle', 'effectsOn', a.effectsOn, 'Effects')}</span></div>

      <p style="font-size:.85rem;margin:.4rem 0 0"><b>No sound on iPad? Check the silent switch.</b> Also check the volume and Control Center silent mode. Speech may still be heard while music and effects are silenced.</p>

      <div class="toggle"><span>Reduced motion<span class="desc">Quick fades instead of movement.</span></span>${sw('prefToggle', 'reducedMotion', !!ctx.reducedMotion, 'Reduced motion')}</div>
      <div class="toggle"><span>Reduced effects<span class="desc">Turns off particles, light beams and reflections (faster on older devices).</span></span>${sw('prefToggle', 'reducedEffects', !!p.reducedEffects, 'Reduced effects')}</div>

      <div class="row">${btn('closePanel', 'Done', { cls: 'primary big', fk: 'close' })}</div>

  function pauseHTML(v, ctx) {
    return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pauseH"><div class="panel" style="text-align:center;width:min(100%,460px)">
      <h2 id="pauseH">Paused</h2>
      <p>${ctx.resumeNote ? esc(ctx.resumeNote) : 'Clocks, animation and speech are stopped. Your match is saved.'}</p>
      <div class="menu" style="margin:1rem auto 0">${btn('resume', 'RESUME', { cls: 'primary big', fk: 'resume', key: 'Esc' })}${btn('settings', 'SETTINGS', { cls: 'big', fk: 'p-set' })}${btn('quit', 'QUIT TO TITLE', { cls: 'ghost', fk: 'quit' })}</div>
      ${ctx.confirmQuit ? `<p class="save-note" role="alert">Quit this match? It will be lost.</p><div class="row" style="justify-content:center">${btn('quitYes', 'Yes, quit', { cls: 'magenta', fk: 'quitYes' })}${btn('quitNo', 'Keep playing', { cls: 'ghost', fk: 'quitNo' })}</div>` : ''}
    </div></div>`;
  }

  function resultsHTML(v, ctx) {
    const r = v.results;
    const A = TF.Art;
    const art = { vera: A.vera, felix: A.felix, human: A.human };
    const st = r.standings.slice().sort((a, b) => a.rank - b.rank || b.score - a.score);
    const order = st.length === 3 ? [st[1], st[0], st[2]] : st;
    const winNames = r.winners.map((id) => cName(v, id));
    const headline = r.joint ? `Joint champions: ${winNames.join(' and ')}` : `Champion: ${winNames[0]}`;
    let h = `<div class="overlay results" role="dialog" aria-modal="true" aria-labelledby="resH"><div class="panel">
      <h2 id="resH" style="text-align:center">${esc(headline)}</h2>
      <div class="res-podium">${order.map((s) => `<div class="rp p${s.rank}"><div aria-hidden="true">${art[s.id] ? art[s.id]() : ''}</div><div class="nm">${esc(s.name)}</div><div class="blk">${s.score}<div style="font-size:.7rem;letter-spacing:.1em">${ordinal(s.rank)}</div></div></div>`).join('')}</div>
      <table class="stats"><thead><tr><th scope="col">Statistic</th>${st.map((s) => `<th scope="col">${esc(firstName(s.name))}</th>`).join('')}</tr></thead><tbody>`;
    const rows = [
      ['Final score', (x, s) => s.score],
      ['Accuracy (final answers)', (x) => x ? `${x.correct}/${x.answered} \u00b7 ${Math.round((x.accuracy || 0) * 100)}%` : '-'],
      ['Wrong \u2192 correct switches', (x) => x ? x.wrongToCorrect : '-'],
      ['Correct \u2192 wrong switches', (x) => x ? x.correctToWrong : '-'],
      ['Successful deceptions', (x) => x ? x.deceptions : '-'],
      ['Points from deception', (x) => x ? x.deceptionPoints : '-'],
      ['PROVE IT used', (x) => x ? x.proveUsed : '-'],
      ['SELL IT used (wasted)', (x) => x ? `${x.sellUsed} (${x.sellWasted})` : '-'],
    ];
    rows.forEach(([label, f]) => { h += `<tr><td>${label}</td>${st.map((s) => `<td>${esc(f(r.stats[s.id], s))}</td>`).join('')}</tr>`; });
    h += `</tbody></table>`;
    if (r.tiebreaksPlayed) h += `<p>Tiebreak questions played: ${r.tiebreaksPlayed}.</p>`;
    const b = r.biggestBluff;
    h += `<div class="bluff"><b>BIGGEST BLUFF</b><div>${b ? esc(b.text || `${b.persuaderName} talked ${b.followers.join(' and ')} into ${b.answerText} on question ${b.questionNumber} (+${b.points}).`) : 'Nobody was talked into a wrong answer this episode. An honest room.'}</div></div>`;

<script>
/* Xbox controller: D-pad/left stick move the highlight, A presses it, X = lock in / continue (the big button),
