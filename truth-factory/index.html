<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060b1f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>The Truth Factory</title>
<style>
/* THE TRUTH FACTORY - studio stylesheet. System fonts only, no remote assets. */
:root {
  --ts: 1;
  --navy-0: #03061a; --navy-1: #070d2a; --navy-2: #0d1640; --navy-3: #17225a;
  --teal: #20e3d6; --teal-soft: #5ff3ea; --teal-deep: #0b7f86;
  --amber: #ffb347; --amber-deep: #e48a1c; --magenta: #e0459a;
  --metal-1: #d9e2ec; --metal-2: #8794a6; --metal-3: #3b4558;
  --ink: #eef3ff; --ink-dim: #a9b6d6; --ink-faint: #7584ab;
  --ok: #3fe08a; --bad: #ff6b6b;
  --vera: #20e3d6; --felix: #e0459a; --human: #ffb347;
  --radius: 16px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-num: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; background: var(--navy-0); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--font); background: var(--navy-0); overflow: hidden; height: 100%; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
button { font-family: inherit; color: inherit; }
.app { position: fixed; inset: 0; overflow: hidden; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 10px; }
[hidden] { display: none !important; }

/* ---------- Studio backdrop ---------- */
.studio { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; isolation: isolate;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(32,227,214,.13), transparent 60%),
    radial-gradient(60% 45% at 50% 30%, rgba(40,70,170,.35), transparent 70%),
    linear-gradient(180deg, #050a24 0%, #0a1238 46%, #070c28 66%, #03061a 100%); }
.backdrop { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.led-arcs { position: absolute; left: -5%; width: 110%; top: -4%; height: 70%; opacity: .75; }
.led-arcs .arc { animation: arcGlow 7s ease-in-out infinite; }
.led-arcs .a2 { animation-delay: -2.5s; } .led-arcs .a4 { animation-delay: -4s; }
@keyframes arcGlow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.floor { position: absolute; left: -10%; right: -10%; bottom: 0; height: 40%;
  background:
    repeating-linear-gradient(90deg, rgba(95,243,234,.06) 0 1px, transparent 1px 90px),
    linear-gradient(180deg, rgba(13,22,64,.0), rgba(6,12,40,.85) 30%, #03061a);
  transform: perspective(600px) rotateX(58deg); transform-origin: 50% 100%; }
.floor-glow { position: absolute; left: 20%; right: 20%; bottom: 4%; height: 26%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(32,227,214,.22), transparent); filter: blur(6px); }
.spot { position: absolute; top: -10%; width: 34%; height: 120%; transform-origin: 50% 0;
  background: linear-gradient(180deg, rgba(255,190,110,.20), rgba(255,190,110,.04) 70%, transparent);
  clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); mix-blend-mode: screen; transition: opacity .6s; }
.spot.s1 { left: 2%; transform: rotate(-16deg); animation: sway 11s ease-in-out infinite; }
.spot.s2 { left: 33%; background: linear-gradient(180deg, rgba(95,243,234,.16), rgba(95,243,234,.02) 70%, transparent); animation: sway 13s ease-in-out infinite reverse; }
.spot.s3 { right: 2%; transform: rotate(16deg); animation: sway2 12s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(-8deg); } }
@keyframes sway2 { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(8deg); } }
.fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dimmer { position: absolute; inset: 0; background: rgba(2,4,14,.0); transition: background .4s; pointer-events: none; z-index: 5; }
.studio.lights-down .dimmer { background: rgba(2,4,14,.45); }
.studio.lights-down .spot { opacity: .25; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; min-height: 56px; z-index: 6;
  background: linear-gradient(180deg, rgba(3,6,26,.9), rgba(3,6,26,.35)); border-bottom: 1px solid rgba(95,243,234,.15); }
.logo { display: inline-flex; align-items: baseline; gap: .3em; font-weight: 800; letter-spacing: .12em; white-space: nowrap; }
.logo-the { font-size: .62em; color: var(--ink-dim); }
.logo-truth { color: var(--teal-soft); text-shadow: 0 0 14px rgba(32,227,214,.6); }
.logo-factory { color: var(--amber); text-shadow: 0 0 14px rgba(255,179,71,.45); }
.topbar .logo { font-size: 1.05rem; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .25rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 650; letter-spacing: .04em;
  background: rgba(23,34,90,.75); border: 1px solid rgba(169,182,214,.25); color: var(--ink); white-space: nowrap; }
.chip.round { border-color: rgba(255,179,71,.55); color: var(--amber); }
.chip.tut { border-color: rgba(224,69,154,.6); color: #ff9fd0; }
.timer { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--font-num); font-weight: 700; font-size: 1.05rem; min-width: 5.5rem; justify-content: flex-end; }
.timer .ring { width: 34px; height: 34px; }
.timer .ring circle.bg { stroke: rgba(169,182,214,.25); }
.timer .ring circle.fg { stroke: var(--teal); transition: stroke .3s; }
.timer.low .ring circle.fg { stroke: var(--amber); } .timer.low { color: var(--amber); }
.timer.off { visibility: hidden; }
.iconbtn { min-width: 44px; min-height: 44px; padding: 0 .8rem; border-radius: 12px; border: 1px solid rgba(169,182,214,.35);
  background: rgba(13,22,64,.8); font-size: .9rem; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
.iconbtn:hover { border-color: var(--teal); }
.iconbtn svg { width: 18px; height: 18px; }

/* ---------- Stage ---------- */
.stage { position: relative; display: grid; grid-template-rows: minmax(min(13rem, 60%), 1fr) auto; min-height: 0; z-index: 2; }
.upper { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(120px, 15%) minmax(0, 1fr) minmax(110px, 12%); grid-template-rows: minmax(0, 1fr); gap: 1rem; padding: .6rem 1rem 0; min-height: 0; }
.host { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 0; }
.host-frame { position: relative; width: 100%; max-width: 190px; aspect-ratio: 200/230; border-radius: 50% 50% 18px 18px / 40% 40% 18px 18px; overflow: hidden;
  background: radial-gradient(80% 70% at 50% 35%, #26357a, #0b1236 75%); border: 2px solid rgba(255,179,71,.45);
  box-shadow: 0 0 0 4px rgba(13,22,64,.8), 0 0 28px rgba(255,179,71,.25), inset 0 -20px 40px rgba(0,0,0,.4); }
.host-frame .char { width: 100%; height: 100%; display: block; }
.nameplate { margin-top: .35rem; text-align: center; font-size: .7rem; letter-spacing: .14em; color: var(--ink-dim); font-weight: 700; }
.nameplate b { display: block; color: var(--amber); font-size: .82rem; }
.host.talking .host-frame { box-shadow: 0 0 0 4px rgba(13,22,64,.8), 0 0 36px rgba(255,179,71,.5); }

.screen { position: relative; min-height: 0; display: flex; flex-direction: column; border-radius: 22px; padding: 10px;
  background: linear-gradient(160deg, #b7c3d2, #5c687c 30%, #2c3446 55%, #8a97aa 85%, #3a4356);
  box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08), 0 0 60px rgba(32,227,214,.18); }
.screen-glass { position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
  background: radial-gradient(120% 90% at 50% 0%, #12306a 0%, #0a1740 45%, #060d2a 100%);
  box-shadow: inset 0 0 0 1px rgba(95,243,234,.35), inset 0 0 40px rgba(32,227,214,.12); }
.screen-glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.07), transparent 22%), repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px); }
.screen-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem 1.3rem 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
/* Question screens: the part above the answers (.screen-top) scrolls if space is short;
   the A/B/C cards are pinned to the bottom of the screen, so they are always fully visible and tappable. */
.screen-scroll.with-answers { overflow: hidden; }
.screen-scroll.with-answers > .screen-top { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: .8rem; }
.screen-scroll.with-answers > .answers { flex: none; margin-top: 0; }
.claims-box { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .7rem; }
.claims-box .claims-label { align-self: center; }
.q-meta { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-soft); font-weight: 700; }
.q-meta .dot { opacity: .5; }
.q-meta .val { color: var(--amber); }
.phase-label { margin-left: auto; color: var(--ink-dim); letter-spacing: .08em; }
.phase-label.claims { color: #ffd38a; }
.prompt { margin: 0; font-size: clamp(1.15rem, 2.1vw + .35rem, 2.05rem); line-height: 1.25; font-weight: 700; letter-spacing: .005em; text-wrap: balance; user-select: text; -webkit-user-select: text; }
.answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin-top: auto; }
.answer { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: .45rem; min-height: 88px; padding: .8rem .9rem .7rem; text-align: left; cursor: pointer;
  border-radius: 14px; border: 2px solid rgba(95,243,234,.35); background: linear-gradient(180deg, rgba(23,34,90,.92), rgba(9,16,52,.92));
  box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: border-color .15s, transform .15s, background .2s, opacity .3s; font-size: 1.05rem; }
.answer:hover:not(:disabled) { border-color: var(--teal-soft); }
.answer:disabled { cursor: default; }
.answer .a-row { display: flex; gap: .7rem; align-items: flex-start; }
.answer .letter { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem;
  background: linear-gradient(180deg, #2d3f86, #17225a); border: 1px solid rgba(95,243,234,.5); color: var(--teal-soft); }
.answer .text { font-weight: 650; line-height: 1.25; padding-top: .2rem; overflow-wrap: anywhere; }
.answer .tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: auto; min-height: 0; }
.tag { display: inline-flex; align-items: center; gap: .25rem; font-size: .72rem; font-weight: 750; letter-spacing: .03em; padding: .18rem .5rem; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tag.human { color: var(--human); } .tag.vera { color: var(--vera); } .tag.felix { color: var(--felix); }
.tag.boost::after { content: "\2605 SELL IT"; margin-left: .2rem; font-size: .66rem; color: var(--amber); }
.tag.mine { background: rgba(255,179,71,.14); }
.tag.res-ok { color: var(--ok); } .tag.res-bad { color: var(--bad); }
.answer.selected { border-color: var(--amber); background: linear-gradient(180deg, rgba(90,60,20,.85), rgba(40,26,10,.9)); box-shadow: 0 0 0 3px rgba(255,179,71,.25), 0 0 24px rgba(255,179,71,.35); }
.answer.selected .letter { background: var(--amber); color: #2a1600; border-color: #fff1d6; }
.answer .sel-mark { position: absolute; top: .45rem; right: .55rem; font-size: .68rem; font-weight: 800; letter-spacing: .08em; color: var(--amber); }
.answer.is-correct { border-color: var(--ok); background: linear-gradient(180deg, rgba(18,90,60,.92), rgba(8,40,28,.92)); box-shadow: 0 0 0 3px rgba(63,224,138,.25), 0 0 30px rgba(63,224,138,.35); opacity: 1; }
.answer.is-wrong { opacity: .62; border-color: rgba(255,107,107,.55); }
.answer .verdict { font-weight: 850; font-size: .8rem; letter-spacing: .08em; display: none; }
.answer.is-correct .verdict, .answer.is-wrong .verdict { display: inline-flex; gap: .3rem; align-items: center; }
.answer.is-correct .verdict { color: var(--ok); } .answer.is-wrong .verdict { color: var(--bad); }
.notice-line { font-size: .88rem; color: var(--ink-dim); display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.notice-line .warn { color: var(--amber); font-weight: 700; }
.claims-label { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem; border-radius: 8px; font-size: .78rem; font-weight: 800; letter-spacing: .06em;
  color: #2a1600; background: linear-gradient(90deg, #ffcf7a, #ffb347); align-self: flex-start; }
.started-with { display: inline-flex; gap: .4rem; align-items: center; padding: .3rem .7rem; border-radius: 8px; border: 1px dashed var(--amber); color: var(--amber); font-weight: 750; font-size: .85rem; }

/* ---------- Ladder (episode progress) ---------- */
.ladder { display: flex; flex-direction: column; gap: 4px; justify-content: center; font-size: .72rem; font-family: var(--font-num); min-height: 0; overflow: hidden; }
.ladder .rung { display: flex; justify-content: space-between; padding: 2px 8px; border-radius: 6px; color: var(--ink-faint); border: 1px solid transparent; }
.ladder .rung.done { color: var(--ink-dim); }
.ladder .rung.now { color: #1b1200; background: linear-gradient(90deg, var(--amber), #ffd38a); font-weight: 800; box-shadow: 0 0 16px rgba(255,179,71,.5); }
.ladder .rung.final { border-color: rgba(224,69,154,.5); }
.ladder .rung.final.now { background: linear-gradient(90deg, var(--magenta), #ff9fd0); color: #22000f; }
.ladder .lh { color: var(--teal-soft); letter-spacing: .12em; font-family: var(--font); font-weight: 800; font-size: .66rem; text-align: center; margin-bottom: 2px; }

/* ---------- Lower stage: machine + podiums ---------- */
.lower { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr);
  grid-template-areas: "vb mach fb" "vp hp fp"; align-items: end; justify-items: center; column-gap: .6rem; padding: 0 1rem; }
.slot { position: relative; min-width: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.slot.vb { grid-area: vb; } .slot.fb { grid-area: fb; } .slot.mach { grid-area: mach; } .slot.vp { grid-area: vp; } .slot.hp { grid-area: hp; } .slot.fp { grid-area: fp; }
.machine { position: relative; width: min(100%, 420px); height: 112px; margin-bottom: -6px; z-index: 1; }
.machine-frame { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
.chamber { position: absolute; left: 15%; right: 15%; top: 16%; bottom: 14%; display: flex; align-items: center; justify-content: space-around; border-radius: 16px; overflow: hidden; }
.chamber::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 50% 50%, rgba(32,227,214,.32), transparent 70%); opacity: .5; transition: opacity .4s; }
.machine.active .chamber::before { opacity: 1; animation: chamberPulse 1s ease-in-out infinite; }
@keyframes chamberPulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
.capsule { position: relative; width: 22%; height: 62%; border-radius: 999px; display: grid; place-items: center; font-weight: 850; font-size: 1.05rem; color: #052126;
  background: linear-gradient(90deg, #8ef9f2, #e8fffd 45%, #5ff3ea 60%, #1aa7a0); box-shadow: 0 0 14px rgba(95,243,234,.6), inset 0 -4px 8px rgba(0,0,0,.25);
  transform: translateY(150%); opacity: 0; transition: transform .55s cubic-bezier(.2,.9,.3,1.2), opacity .4s, filter .4s, box-shadow .4s; }
.machine.loaded .capsule { transform: translateY(0); opacity: 1; }
.machine.loaded .capsule:nth-child(2) { transition-delay: .12s; } .machine.loaded .capsule:nth-child(3) { transition-delay: .24s; }
.capsule .cap-mark { position: absolute; right: -6px; top: -8px; width: 1.4rem; height: 1.4rem; border-radius: 50%; display: none; place-items: center; font-size: .85rem; font-weight: 900; color: #fff; }
.capsule.true { background: linear-gradient(90deg, #8af7b8, #f2fff7 45%, #3fe08a 60%, #148a4c); box-shadow: 0 0 26px rgba(63,224,138,.95), 0 0 60px rgba(63,224,138,.5); animation: truthGlow 1.2s ease-in-out infinite; }
.capsule.true .cap-mark { display: grid; background: var(--ok); }
@keyframes truthGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
.capsule.false { animation: fracture .6s ease-out forwards; }
.capsule.false .cap-mark { display: grid; background: var(--bad); }
@keyframes fracture { 0% { filter: none; } 30% { transform: translateX(-3px) rotate(-3deg); } 60% { transform: translateX(3px) rotate(3deg); filter: grayscale(1) brightness(.7); }
  100% { transform: translateY(8%) scale(.92); opacity: .38; filter: grayscale(1) brightness(.6); clip-path: polygon(0 0, 46% 0, 56% 18%, 44% 40%, 58% 62%, 46% 100%, 0 100%, 0 0, 100% 0, 100% 100%, 54% 100%, 66% 62%, 52% 40%, 64% 18%, 54% 0); } }
.stamp { position: absolute; left: 50%; top: 50%; z-index: 3; padding: .2rem .7rem; border: 3px solid var(--bad); color: var(--bad); font-weight: 900; letter-spacing: .2em; font-size: .9rem;
  border-radius: 6px; background: rgba(30,4,10,.65); transform: translate(-50%, -50%) rotate(-9deg) scale(1.6); opacity: 0; pointer-events: none; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; white-space: nowrap; }
.machine.stamped .stamp { opacity: .95; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
.machine.stamp-off .stamp { opacity: 0; transition: opacity .6s; }
.channels { position: absolute; left: 0; right: 0; bottom: 30px; height: 6px; pointer-events: none; }
.machine .flow { position: absolute; left: -40%; right: -40%; top: 50%; height: 3px; transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(32,227,214,.55) 20%, rgba(32,227,214,.55) 80%, transparent); z-index: -1; }
.machine.active .flow { background-size: 40px 3px; background-image: linear-gradient(90deg, transparent, rgba(95,243,234,.95), transparent), linear-gradient(90deg, transparent, rgba(32,227,214,.55) 20%, rgba(32,227,214,.55) 80%, transparent); animation: flowMove .6s linear infinite; }
@keyframes flowMove { to { background-position: 40px 0, 0 0; } }

/* Podiums */
.podium { position: relative; width: min(100%, 270px); display: flex; flex-direction: column; align-items: center; --c: var(--teal); }
.podium.vera { --c: var(--vera); } .podium.felix { --c: var(--felix); } .podium.human { --c: var(--human); }
.podium .figure { position: relative; width: 112px; height: 112px; margin-bottom: -18px; z-index: 0; }
.podium .figure .char { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 35%, transparent)); }
.desk { position: relative; z-index: 1; width: 100%; padding: .45rem .7rem .55rem; border-radius: 14px 14px 6px 6px; text-align: center;
  background: linear-gradient(180deg, #c7d1dd 0%, #6f7c90 14%, #2d3548 40%, #1c2233 100%);
  clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4); -webkit-box-reflect: below 2px linear-gradient(transparent 55%, rgba(255,255,255,.16)); }
.desk::before { content: ""; position: absolute; left: 7%; right: 7%; top: 3px; height: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 12px var(--c); opacity: .9; }
.desk .pname { font-weight: 800; letter-spacing: .06em; font-size: .95rem; color: #fff; margin-top: .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desk .ptitle { font-size: .62rem; letter-spacing: .14em; color: color-mix(in srgb, var(--c) 80%, white); font-weight: 700; text-transform: uppercase; }
.desk .score { font-family: var(--font-num); font-weight: 800; font-size: 1.5rem; color: var(--c); text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
  background: rgba(3,6,26,.85); border-radius: 8px; margin: .3rem auto .25rem; padding: .05rem .6rem; display: inline-block; min-width: 5.2rem; border: 1px solid rgba(255,255,255,.08); }
.desk .tokens { display: flex; justify-content: center; gap: .5rem; font-size: .66rem; font-weight: 750; letter-spacing: .05em; color: var(--ink-dim); }
.tok { display: inline-flex; align-items: center; gap: .2rem; }
.pip { width: .6rem; height: .6rem; border-radius: 50%; border: 1.5px solid var(--ink-dim); display: inline-block; }
.pip.on.sell { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 6px var(--amber); }
.pip.on.prove { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 6px var(--teal); }
.status { position: absolute; top: -.1rem; right: .2rem; z-index: 2; font-size: .66rem; font-weight: 800; letter-spacing: .08em; padding: .15rem .45rem; border-radius: 999px; background: rgba(3,6,26,.85); border: 1px solid var(--c); color: var(--c); }
.status:empty { display: none; }
.badge { position: absolute; left: 50%; top: 10px; z-index: 4; transform: translate(-50%, 0); font-weight: 850; font-size: .82rem; padding: .3rem .6rem; border-radius: 10px; white-space: nowrap;
  background: linear-gradient(180deg, #ffe3a8, #ffb347); color: #2a1600; box-shadow: 0 6px 16px rgba(0,0,0,.4); animation: badgeUp .5s cubic-bezier(.2,1.4,.4,1) both; }
.badge.gone { opacity: 0; transition: opacity .6s; }
.badge.zero { background: linear-gradient(180deg, #c8d2e6, #8794a6); }
.badge + .badge { top: 42px; } .badge + .badge + .badge { top: 74px; }
@keyframes badgeUp { from { transform: translate(-50%, 14px) scale(.8); opacity: 0; } }
.podium.eliminated { opacity: .5; }
.podium.winner .desk::before { background: linear-gradient(90deg, var(--amber), #fff3d6, var(--amber)); }

/* Claim bubbles */
.bubble { position: relative; width: min(100%, 300px); margin-bottom: .6rem; padding: .6rem .75rem; border-radius: 14px; font-size: .9rem; line-height: 1.3;
  background: rgba(240,245,255,.96); color: #0b1236; box-shadow: 0 8px 22px rgba(0,0,0,.45); border: 2px solid var(--c, #20e3d6); animation: bubbleIn .35s ease-out both; }
.bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border: 9px solid transparent; border-top-color: rgba(240,245,255,.96); border-bottom: 0; }
.bubble .who { font-weight: 850; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #3a466e; display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.bubble .backs { font-weight: 800; }
.bubble .boost { color: #9a5200; background: #ffe0a8; border-radius: 6px; padding: 0 .35rem; }
.bubble.vera { --c: var(--vera); } .bubble.felix { --c: var(--felix); } .bubble.human { --c: var(--human); }
.bubble.host { --c: var(--amber); }
.bubble.compact { font-size: .82rem; }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.96); } }

/* Character moods (rig defined in art.js) */
.char .mouth { display: none; }
.char .mouth-neutral { display: inline; }
.mood-smile .char .mouth-neutral, .mood-grin .char .mouth-neutral, .mood-concern .char .mouth-neutral, .mood-embarrassed .char .mouth-neutral { display: none; }
.mood-smile .char .mouth-smile, .mood-confident .char .mouth-smile { display: inline; }
.mood-confident .char .mouth-neutral { display: none; }
.mood-grin .char .mouth-grin { display: inline; }
.mood-concern .char .mouth-o { display: inline; }
.mood-embarrassed .char .mouth-flat { display: inline; }
.mood-embarrassed .char .ch-blush { opacity: .55; transition: opacity .4s; }
.char .ch-body { transform-origin: 100px 230px; animation: breathe 4.2s ease-in-out infinite; }
.char .ch-head { transform-origin: 100px 150px; transition: transform .5s ease; animation: headIdle 9s ease-in-out infinite; }
.char .ch-lids { transform-origin: 100px 99px; transform: scaleY(0); animation: blink 5.5s infinite; }
.char .ch-pupils { transition: transform .4s ease; }
.char-felix .ch-lids { animation-duration: 4.4s; animation-delay: -1.3s; }
.char-vera .ch-lids { animation-duration: 6.1s; animation-delay: -2.2s; }
.char-host .ch-lids { animation-duration: 6.8s; }
@keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.018) translateY(-1px); } }
@keyframes headIdle { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(1.2deg); } 65% { transform: rotate(-1deg) translateY(1px); } }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
.glance-l .char .ch-pupils { transform: translateX(-3px); } .glance-r .char .ch-pupils { transform: translateX(3px); }
.glance-u .char .ch-pupils { transform: translateY(-2.5px); }
.mood-concern .char .ch-brows .brow-l { transform: rotate(8deg) translateY(-2px); transform-origin: 84px 92px; }
.mood-concern .char .ch-brows .brow-r { transform: rotate(-8deg) translateY(-2px); transform-origin: 116px 92px; }
.mood-confident .char .ch-brows .brow-r { transform: translateY(-3px); }
.mood-confident .char .ch-head { animation: none; transform: rotate(-3deg); }
.mood-grin .figure, .mood-grin.host-frame { animation: celebrate .7s ease-out 2; }
.mood-embarrassed .char .ch-head { animation: none; transform: rotate(4deg) translateY(3px); }
.mood-concern .char .ch-head { animation: none; transform: translateY(2px); }
@keyframes celebrate { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
.char .ch-brows path { transition: transform .4s; }

/* ---------- Controls ---------- */
.controls { position: relative; z-index: 6; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .8rem; padding: .55rem 1rem .65rem;
  background: linear-gradient(0deg, rgba(3,6,26,.97), rgba(3,6,26,.72)); border-top: 1px solid rgba(95,243,234,.18); min-height: 84px; }
.ctrl-left, .ctrl-right { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; min-width: 0; }
.ctrl-right { justify-content: flex-end; }
.ctrl-mid { display: flex; gap: .6rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.btn { min-height: 52px; min-width: 52px; padding: .6rem 1.25rem; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); cursor: pointer; font-weight: 800; font-size: 1rem; letter-spacing: .05em;
  background: linear-gradient(180deg, #22306e, #121b4a); color: var(--ink); box-shadow: 0 4px 0 #060b26, 0 8px 18px rgba(0,0,0,.35); transition: transform .08s, filter .15s, opacity .2s; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; text-align: center; }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #060b26, 0 4px 10px rgba(0,0,0,.35); }
.btn:disabled { opacity: .42; cursor: not-allowed; filter: grayscale(.4); }
.btn.primary { background: linear-gradient(180deg, #ffd27f, #ff9f2e); color: #2a1600; border-color: #fff1d6; box-shadow: 0 4px 0 #8a4f07, 0 8px 22px rgba(255,159,46,.35); }
.btn.teal { background: linear-gradient(180deg, #4ff0e4, #12a9a0); color: #032024; border-color: #d6fffb; box-shadow: 0 4px 0 #075a55, 0 8px 22px rgba(32,227,214,.3); }
.btn.magenta { background: linear-gradient(180deg, #f27ab9, #c2287a); color: #fff; border-color: #ffd6ec; box-shadow: 0 4px 0 #6d0f40, 0 8px 22px rgba(224,69,154,.3); }
.btn.ghost { background: rgba(13,22,64,.7); box-shadow: none; }
.btn.big { min-height: 60px; font-size: 1.1rem; padding: .7rem 1.6rem; }
.btn.armed { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn .count { font-family: var(--font-num); font-size: .8rem; padding: .05rem .4rem; border-radius: 6px; background: rgba(0,0,0,.25); }
.btn .key { font-size: .68rem; opacity: .7; border: 1px solid currentColor; border-radius: 5px; padding: 0 .3rem; font-family: var(--font-num); font-weight: 700; }
.follow-row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.follow-row .lbl { font-size: .85rem; font-weight: 750; color: var(--amber); }
.btn.follow { min-height: 56px; }
.btn.follow[aria-pressed="true"] { outline: 3px solid var(--amber); outline-offset: 2px; filter: brightness(1.12); }
.btn.follow.vera { background: linear-gradient(180deg, #4ff0e4, #12a9a0); color: #032024; }
.btn.follow.felix { background: linear-gradient(180deg, #f27ab9, #c2287a); color: #fff; }
.shortcuts { font-size: .7rem; color: var(--ink-faint); letter-spacing: .03em; }
.shortcuts kbd { font-family: var(--font-num); border: 1px solid rgba(169,182,214,.35); border-radius: 4px; padding: 0 .25rem; color: var(--ink-dim); }
.hint-panel { padding: .55rem .8rem; border-radius: 12px; border: 1px solid var(--teal); background: rgba(6,40,48,.9); font-size: .9rem; line-height: 1.3; max-width: 36rem; }
.hint-panel b { color: var(--teal-soft); letter-spacing: .06em; font-size: .72rem; display: block; }
.fallback { font-size: .82rem; color: var(--ink-dim); }
.fallback b { color: var(--amber); }

/* Caption strip */
.caption { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(40%, 560px); z-index: 8; pointer-events: none;
  padding: .4rem .8rem; border-radius: 12px; background: rgba(3,6,26,.92); border: 1px solid rgba(255,179,71,.4); font-size: .88rem; line-height: 1.3; text-align: center; transition: opacity .3s; }
.caption .spk { font-weight: 850; letter-spacing: .06em; margin-right: .4rem; text-transform: uppercase; font-size: .75rem; }
.caption .spk.host { color: var(--amber); } .caption .spk.vera { color: var(--vera); } .caption .spk.felix { color: var(--felix); }
.caption.hide { opacity: 0; }

/* ---------- Recap (on the big screen) ---------- */
.recap-head { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.recap-head .truth { font-size: clamp(1.05rem, 1.4vw + .4rem, 1.55rem); font-weight: 800; color: var(--ok); }
.recap-table { width: 100%; border-collapse: separate; border-spacing: 0 .3rem; font-size: .88rem; }
.recap-table th { text-align: left; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 750; padding: 0 .5rem; }
.recap-table td { padding: .4rem .5rem; background: rgba(23,34,90,.6); vertical-align: top; }
.recap-table td:first-child { border-radius: 10px 0 0 10px; font-weight: 800; white-space: nowrap; }
.recap-table td:last-child { border-radius: 0 10px 10px 0; }
.recap-table .pts { font-family: var(--font-num); font-weight: 800; color: var(--amber); white-space: nowrap; }
.recap-table .reason { color: var(--ink-dim); font-size: .82rem; }
.mk-ok { color: var(--ok); font-weight: 800; } .mk-bad { color: var(--bad); font-weight: 800; } .mk-none { color: var(--ink-faint); }
.explain { font-size: .98rem; line-height: 1.45; margin: 0; user-select: text; -webkit-user-select: text; }
details.fact { border: 1px solid rgba(95,243,234,.4); border-radius: 12px; background: rgba(6,30,48,.6); }
details.fact summary { cursor: pointer; padding: .7rem .9rem; min-height: 44px; font-weight: 800; color: var(--teal-soft); list-style: none; display: flex; align-items: center; gap: .5rem; }
details.fact summary::-webkit-details-marker { display: none; }
details.fact summary::before { content: "\25B8"; transition: transform .2s; }
details.fact[open] summary::before { transform: rotate(90deg); }
details.fact .fact-body { padding: 0 .9rem .8rem; font-size: .9rem; line-height: 1.4; color: var(--ink-dim); }
details.fact a { color: var(--teal-soft); font-weight: 700; word-break: break-word; display: inline-block; min-height: 44px; padding: .6rem 0; }
.corrections { margin: .3rem 0 0; padding-left: 1.1rem; }

/* ---------- Overlays / menus ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: calc(1rem + var(--safe-t)) calc(1rem + var(--safe-r)) calc(1rem + var(--safe-b)) calc(1rem + var(--safe-l));
  background: radial-gradient(80% 80% at 50% 40%, rgba(7,13,42,.72), rgba(3,6,26,.94)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.overlay.clear { background: radial-gradient(75% 70% at 50% 45%, rgba(7,13,42,.72), rgba(3,6,26,.94)); }
.panel { position: relative; width: min(100%, 720px); padding: 1.6rem 1.8rem; border-radius: 22px; background: linear-gradient(180deg, rgba(23,34,90,.96), rgba(9,16,52,.97));
  border: 1px solid rgba(95,243,234,.35); box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 50px rgba(32,227,214,.15); margin: auto; }
.panel h2 { margin: 0 0 .8rem; font-size: 1.6rem; letter-spacing: .04em; }
.panel h3 { margin: 1rem 0 .4rem; font-size: 1rem; color: var(--teal-soft); letter-spacing: .08em; text-transform: uppercase; }
.panel p { line-height: 1.45; color: var(--ink-dim); }
.panel .row { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
.title-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: auto; }
.title-wrap .logo { flex-direction: column; align-items: center; gap: 0; line-height: .95; }
.title-wrap .logo-the { font-size: clamp(1rem, 1.6vw, 1.4rem); letter-spacing: .6em; }
.title-wrap .logo-truth { font-size: clamp(3.2rem, 9vw, 7.5rem); letter-spacing: .08em; }
.title-wrap .logo-factory { font-size: clamp(2rem, 5.2vw, 4.2rem); letter-spacing: .32em; }
.tagline { max-width: 40rem; font-size: clamp(1rem, 1.3vw + .3rem, 1.3rem); color: var(--ink-dim); line-height: 1.4; margin: 0; }
.title-cast { display: flex; gap: 1.2rem; justify-content: center; align-items: flex-end; }
.title-cast .mini { width: 92px; text-align: center; font-size: .72rem; letter-spacing: .1em; font-weight: 750; color: var(--ink-dim); }
.title-cast .mini .char { width: 92px; height: 100px; }
.menu { display: flex; flex-direction: column; gap: .7rem; width: min(100%, 340px); }
.menu .btn { width: 100%; }
.save-note { font-size: .85rem; color: var(--amber); }
.field { display: flex; flex-direction: column; gap: .35rem; margin-top: .9rem; }
.field label, .field .lbl { font-weight: 750; font-size: .9rem; }
.field input[type=text] { min-height: 48px; font-size: 1.1rem; padding: .5rem .8rem; border-radius: 12px; border: 2px solid rgba(95,243,234,.4); background: #0a1238; color: var(--ink); font-family: inherit; }
.seg { display: flex; gap: .5rem; flex-wrap: wrap; }
.seg button { min-height: 48px; padding: .4rem 1rem; border-radius: 12px; border: 2px solid rgba(169,182,214,.3); background: rgba(10,18,56,.8); font-weight: 750; font-size: .95rem; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--amber); background: rgba(90,60,20,.7); color: #ffe3a8; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 48px; padding: .3rem 0; border-bottom: 1px solid rgba(169,182,214,.12); }
.toggle .desc { font-size: .8rem; color: var(--ink-faint); display: block; }
.switch { position: relative; flex: none; width: 76px; height: 44px; border-radius: 999px; border: 2px solid rgba(169,182,214,.4); background: #0a1238; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink-dim); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: var(--teal-deep); border-color: var(--teal); }
.switch[aria-checked="true"]::after { transform: translateX(32px); background: #fff; }
.switch .st { position: absolute; left: -9999px; }
input[type=range] { width: 160px; min-height: 44px; accent-color: var(--teal); }
.howto-steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.howto-steps .st { padding: .8rem 1rem; border-radius: 14px; background: rgba(10,18,56,.7); border: 1px solid rgba(169,182,214,.2); }
.howto-steps .st b { display: block; color: var(--amber); letter-spacing: .08em; margin-bottom: .2rem; }
.howto-steps .st span { color: var(--ink-dim); font-size: .92rem; line-height: 1.35; }
.banner { position: absolute; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none; }
.banner .inner { text-align: center; padding: 1.2rem 3rem; border-radius: 20px; background: linear-gradient(90deg, rgba(3,6,26,0), rgba(3,6,26,.92) 15%, rgba(3,6,26,.92) 85%, rgba(3,6,26,0));
  animation: bannerIn 2.4s ease both; }
.banner .k { font-size: .9rem; letter-spacing: .4em; color: var(--teal-soft); font-weight: 800; }
.banner .t { font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 900; letter-spacing: .08em; color: var(--amber); text-shadow: 0 0 30px rgba(255,179,71,.5); }
.banner .s { color: var(--ink-dim); font-size: 1rem; }
.banner.final .t { color: #ff9fd0; text-shadow: 0 0 30px rgba(224,69,154,.6); }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(.92); } 12%, 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.results .panel { width: min(100%, 980px); }
.res-podium { display: flex; gap: 1rem; justify-content: center; align-items: flex-end; margin: .6rem 0 1rem; }
.res-podium .rp { text-align: center; flex: 1; max-width: 220px; }
.res-podium .rp .blk { border-radius: 12px 12px 0 0; background: linear-gradient(180deg, #8794a6, #2d3548); padding: .5rem; font-family: var(--font-num); font-weight: 800; font-size: 1.3rem; }
.res-podium .rp.p1 .blk { min-height: 120px; background: linear-gradient(180deg, #ffd27f, #b06d10); color: #2a1600; }
.res-podium .rp.p2 .blk { min-height: 86px; } .res-podium .rp.p3 .blk { min-height: 60px; }
.res-podium .rp .char { width: 90px; height: 96px; }
.res-podium .rp .nm { font-weight: 800; letter-spacing: .05em; }
.stats { width: 100%; border-collapse: collapse; font-size: .9rem; }
.stats th, .stats td { padding: .45rem .5rem; border-bottom: 1px solid rgba(169,182,214,.15); text-align: right; }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats thead th { color: var(--ink-faint); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
.bluff { margin-top: 1rem; padding: .8rem 1rem; border-radius: 14px; border: 1px solid var(--magenta); background: rgba(80,10,50,.35); }
.bluff b { color: #ff9fd0; letter-spacing: .08em; }
.missed { margin-top: .6rem; }
.missed details { border-bottom: 1px solid rgba(169,182,214,.15); padding: .2rem 0; }
.missed summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
.missed .body { color: var(--ink-dim); font-size: .9rem; line-height: 1.4; padding-bottom: .5rem; }
.missed a { color: var(--teal-soft); }
.toast { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); z-index: 30; padding: .6rem 1rem; border-radius: 12px; background: rgba(3,6,26,.95);
  border: 1px solid var(--amber); display: flex; gap: .8rem; align-items: center; font-size: .9rem; max-width: 92vw; }
.verdict-row { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
.fv-card { min-width: 9rem; padding: .6rem .9rem; border-radius: 12px; background: rgba(23,34,90,.75); border: 2px solid rgba(169,182,214,.3); text-align: center; }
.fv-card .n { font-weight: 800; } .fv-card .a { font-size: .9rem; color: var(--ink-dim); }
.fv-card.hidden-ans .a { letter-spacing: .3em; }
.fv-card.ok { border-color: var(--ok); } .fv-card.bad { border-color: var(--bad); }
.tb-note { font-size: .9rem; color: #ff9fd0; font-weight: 700; }

/* ---------- Reduced motion / effects ---------- */
.reduced-motion *, .reduced-motion *::before, .reduced-motion *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .2s !important; transition-delay: 0s !important; }
.reduced-motion .capsule { transform: none !important; }
.reduced-motion .capsule.false { opacity: .38; filter: grayscale(1); }
.reduced-motion .char .ch-lids { transform: scaleY(0); }
.reduced-effects .fx-canvas, .reduced-effects .spot, .reduced-effects .floor-glow { display: none; }
.reduced-effects .desk { -webkit-box-reflect: none; }
.reduced-effects .led-arcs .arc { animation: none; }
.reduced-effects .podium .figure .char { filter: none; }
@media (prefers-reduced-motion: reduce) { .spot { animation: none; } }

/* ---------- Responsive ---------- */
@media (max-height: 760px) and (orientation: landscape) {
  .podium .figure { width: 88px; height: 88px; }
  .machine { height: 92px; }
  .desk .score { font-size: 1.25rem; }
  .answer { min-height: 72px; }
  .controls { min-height: 72px; padding-top: .4rem; padding-bottom: .45rem; }
  .btn { min-height: 48px; }
}
/* Short landscape screens (iPad landscape 1180x820 and 1180x740, small laptops): tighter studio so the
   question screen keeps room for the prompt, the claims notice and the three cards. */
@media (max-height: 860px) and (orientation: landscape) {
  .upper { padding-top: .4rem; }
  .host-frame { max-width: 150px; }
  .screen { padding: 8px; }
  .screen-scroll { padding: .65rem 1.05rem .75rem; gap: .5rem; }
  .screen-scroll.with-answers > .screen-top { gap: .45rem; }
  .prompt { font-size: clamp(1.05rem, 1.3vw + .45rem, 1.7rem); line-height: 1.2; }
  .notice-line { font-size: .8rem; gap: .45rem; }
  .fallback-note { font-size: .74rem; line-height: 1.25; }
  .claims-label { padding: .2rem .55rem; font-size: .72rem; }
  .started-with { padding: .18rem .6rem; font-size: .8rem; }
  .answers { gap: .6rem; }
  .answer { min-height: 64px; padding: .5rem .75rem .45rem; gap: .3rem; font-size: 1rem; }
  .answer .letter { width: 1.85rem; height: 1.85rem; font-size: 1rem; }
  .answer .text { padding-top: .1rem; }
  .podium .figure { width: 80px; height: 80px; margin-bottom: -14px; }
  .desk { padding: .35rem .65rem .45rem; }
  .desk .score { font-size: 1.2rem; }
  .machine { height: 88px; }
  .bubble { font-size: .82rem; padding: .45rem .65rem; margin-bottom: .5rem; }

.land-notice { position: absolute; left: 50%; bottom: calc(12px + var(--safe-b)); transform: translateX(-50%); z-index: 40; display: none; gap: .8rem; align-items: center;
  padding: .55rem .6rem .55rem 1rem; border-radius: 14px; background: rgba(3,6,26,.95); border: 1px solid var(--teal); font-size: .9rem; }
