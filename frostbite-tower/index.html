<script>
window.PB = window.PB || {};
/*
 * Frostbite Tower — stage data (PB.Stages, PB.Worlds).
 *
 * Every stage is built by a tiny builder at load time so ladders, items, keystones, levers
 * and icicles snap exactly onto girder surfaces. The engine only sees the plain data objects
 * described in docs/contract.md. Coordinates: 512 x 576 field, feet positions, y grows downward.
 *
 * Schema notes (additions are optional and safe to ignore):
 *  - stage.blurb    one-line hint for the stage intro card (the only addition).
 *  - Everything else follows the contract exactly. Snowballs always end in the ice hole on
 *    girder 0 (bottom-left, default x 30); girder 0 slopes gently down toward it.
 *
 * Validated by test/validate-levels.js (geometry, stacking gaps, ladders, elevators,
 * reachability graph search and snowball flow). Preview images: node test/render-levels.js
 */
(function (PB) {
  'use strict';

  function r1(v) { return Math.round(v * 10) / 10; }
  function surfY(g, x) { return g.y1 + (g.y2 - g.y1) * (x - g.x1) / (g.x2 - g.x1); }

  // ---------- stage builder ----------
  function build(meta, fn) {
    var g = [], ladders = [], elevators = [], items = [], keystones = [], levers = [], icicles = [];
    function mk(x1, y1, x2, y2, kind, o) {
      var gd = { x1: x1, y1: r1(y1), x2: x2, y2: r1(y2), kind: kind || 'ice' };
      if (o) for (var k in o) gd[k] = o[k];
      g.push(gd);
      return g.length - 1;
    }
    // girder index whose surface at x is nearest to y (must be within 40 px)
    function snap(x, y, what) {
      var best = -1, bd = 1e9;
      for (var i = 0; i < g.length; i++) {
        var q = g[i];
        if (x < q.x1 || x > q.x2) continue;
        var d = Math.abs(surfY(q, x) - y);
        if (d < bd) { bd = d; best = i; }
      }
      if (best < 0 || bd > 40) throw new Error(meta.id + ': nothing to snap ' + (what || '') + ' at ' + x + ',' + y);
      return best;
    }
    var api = {
      floor: function () { return mk(8, 560, 504, 552, 'ice'); },
      seg: mk,
      flat: function (x1, x2, y, kind, o) { return mk(x1, y, x2, y, kind, o); },
      // pieces [x1, x2, kind, opts] along the straight line through (xa,ya)-(xb,yb)
      cut: function (xa, ya, xb, yb, pieces) {
        return pieces.map(function (p) {
          var f = function (x) { return ya + (yb - ya) * (x - xa) / (xb - xa); };
          return mk(p[0], f(p[0]), p[1], f(p[1]), p[2], p[3]);
        });
      },
      // pieces along the line y = yc + s * (x - 256)
      tier: function (yc, s, pieces) {
        return pieces.map(function (p) {
          return mk(p[0], yc + s * (p[0] - 256), p[1], yc + s * (p[1] - 256), p[2], p[3]);
        });
      },
      ladder: function (x, yTop, yBottom, broken) {
        var l = { x: x, top: snap(x, yTop, 'ladder top'), bottom: snap(x, yBottom, 'ladder bottom') };
        if (broken) l.broken = true;
        ladders.push(l);
      },
      lift: function (x, yTop, yBottom, dir, speed, n) {
        elevators.push({ x: x, w: 40, yTop: yTop, yBottom: yBottom, speed: speed || 44, n: n || 3, dir: dir });
      },
      item: function (type, x, y) { var i = snap(x, y, type); items.push({ type: type, x: x, y: r1(surfY(g[i], x)) }); },
      key: function (x, y) { keystones.push({ g: snap(x, y, 'keystone'), x: x }); },
      lever: function (x, y) { levers.push({ g: snap(x, y, 'lever'), x: x }); },
      icicle: function (x, yGirder) { var i = snap(x, yGirder, 'icicle'); icicles.push({ x: x, y: r1(surfY(g[i], x) + 12) }); },
      pos: function (x, y) { return { x: x, y: r1(surfY(g[snap(x, y, 'actor')], x)) }; }
    };
    var extra = fn(api) || {};
    var S = {
      id: meta.id, world: meta.world, name: meta.name, subtitle: meta.subtitle,
      kind: meta.kind || 'stage', theme: meta.theme, music: meta.music,
      timer: meta.timer, goal: meta.goal,
      start: { x: extra.startX || 72, y: r1(surfY(g[0], extra.startX || 72)) },
      girders: g, ladders: ladders, elevators: elevators, keystones: keystones, levers: levers,
      items: items, icicles: icicles, hazards: meta.hazards, iceHole: { x: 30, g: 0 }
    };
    if (extra.cub) S.cub = extra.cub;
    if (extra.rival) S.rival = extra.rival;
    if (meta.blurb) S.blurb = meta.blurb;
    return S;
  }
  function rival(api, x, y, facing) { var p = api.pos(x, y); p.facing = facing; return p; }

  var S = [];

  // =====================================================================================
  // WORLD 1 — THE GLACIER
  // =====================================================================================

  // 1-1 Glacier Girders: six tiers, gentle zig-zag. Learn ladders, jumping snowballs, the pick.
  S.push(build({
    id: '1-1', world: 1, name: 'Glacier Girders', subtitle: 'Climb to the cubs!', theme: 'glacier', music: 'glacier',

    blurb: 'Jump the snowballs and leap the gap beside the King!',
    hazards: { snowballs: { interval: [2.4, 3.8], speed: 92, ladderChance: 0.22, blueChance: 0, giantChance: 0, aimed: 0 } }
  }, function (a) {
    a.floor();                                   // 0
    a.seg(8, 463, 470, 477);                     // 1  down-right
    a.seg(42, 390, 504, 376);                    // 2  down-left
    a.seg(8, 291, 470, 305);                     // 3
    a.seg(42, 218, 504, 204);                    // 4
    a.seg(8, 124, 300, 128);                     // 5  King's ledge
    a.flat(330, 430, 128);                       // 6  cubs' ledge
    a.ladder(420, 475, 553); a.ladder(200, 469, 557, true);
    a.ladder(90, 389, 465); a.ladder(280, 382, 471);
    a.ladder(440, 304, 378); a.ladder(250, 297, 383, true);
    a.ladder(70, 217, 293); a.ladder(320, 210, 300);
    a.ladder(200, 128, 213); a.ladder(400, 128, 207, true);
    a.item('pick', 150, 387); a.item('fish', 200, 469); a.item('fish', 380, 302);

  // 1-2 Cracking Floes: seven tiers of floes, crumbling bridges, icicles, first blue snowballs.

  }, function (a) {
    a.floor();
    var s = 0.018;
    a.tier(482, s, [[8, 150], [150, 190, 'crumble'], [190, 330], [360, 472]]);
    a.tier(409, -s, [[40, 170], [200, 300], [300, 340, 'crumble'], [340, 504]]);
    a.tier(336, s, [[8, 200], [200, 240, 'crumble'], [240, 472]]);
    a.tier(263, -s, [[40, 140], [176, 360], [360, 400, 'crumble'], [400, 504]]);
    a.tier(190, s, [[8, 250], [282, 472]]);

    a.ladder(260, 410, 482); a.ladder(450, 405, 486, true);

    a.ladder(120, 266, 334); a.ladder(300, 262, 337, true);
    a.ladder(430, 193, 260); a.ladder(100, 187, 268, true);
    a.ladder(330, 120, 191); a.ladder(200, 120, 189, true);
    a.icicle(230, 409); a.icicle(462, 340); a.icicle(110, 186); a.icicle(250, 263); a.icicle(48, 267);
    a.item('pick', 380, 338); a.item('fish', 220, 480); a.item('fish', 300, 263);

  // 1-3 Igloo Fort: stepped fort of flat tiers. Pop all 8 keystones while frostlings patrol.
  S.push(build({

      frostlings: { max: 3, start: 1 } }
  }, function (a) {
    a.floor();
    a.flat(24, 488, 488);
    a.flat(40, 236, 418); a.flat(276, 472, 418);
    a.flat(60, 452, 348);
    a.flat(80, 236, 278); a.flat(276, 432, 278);
    a.flat(100, 412, 208);
    a.flat(120, 392, 138);
    a.ladder(60, 488, 559); a.ladder(256, 488, 556); a.ladder(452, 488, 553);
    a.ladder(70, 418, 488); a.ladder(190, 418, 488); a.ladder(322, 418, 488); a.ladder(442, 418, 488);
    a.ladder(160, 348, 418); a.ladder(352, 348, 418);
    a.ladder(120, 278, 348); a.ladder(210, 278, 348); a.ladder(302, 278, 348); a.ladder(392, 278, 348);
    a.ladder(110, 208, 278); a.ladder(402, 208, 278);
    a.ladder(180, 138, 208); a.ladder(332, 138, 208);
    a.key(130, 488); a.key(382, 488);
    a.key(120, 418); a.key(392, 418);
    a.key(90, 348); a.key(422, 348);
    a.key(150, 278); a.key(362, 278);
    a.item('pick', 256, 348); a.item('fish', 60, 418); a.item('fish', 420, 278);
    a.item('gem', 376, 138);                     // on the King's own rampart, in the snowball lane
    return { startX: 72, cub: a.pos(160, 138), rival: rival(a, 296, 138, 1) };
  }));

  // T1 Fish Frenzy: bounce-bank staircases up both walls, a ladder spine in the middle.
  S.push(build({
    id: 'T1', world: 1, name: 'Fish Frenzy', subtitle: 'Grab 12 fish in 45 seconds!', kind: 'test', theme: 'aurora', music: 'test',
    timer: 4500, goal: { type: 'fish', count: 12, time: 45 },
    blurb: 'Springy snowbanks launch you up the walls. Fish everywhere!',
    hazards: { snowballs: { interval: [3.2, 4.8], speed: 92, ladderChance: 0.12, blueChance: 0, giantChance: 0, aimed: 0 } }
  }, function (a) {
    a.floor();
    // left wall staircase (bounce banks), mirrored on the right
    a.seg(8, 484, 70, 488, 'bounce'); a.flat(82, 140, 434, 'bounce'); a.seg(8, 376, 70, 380, 'bounce');
    a.flat(82, 140, 326, 'bounce'); a.seg(8, 268, 70, 272);
    a.seg(442, 488, 504, 484, 'bounce'); a.flat(372, 430, 434, 'bounce'); a.seg(442, 380, 504, 376, 'bounce');
    a.flat(372, 430, 326, 'bounce'); a.seg(442, 272, 504, 268);
    // central spine
    a.flat(176, 336, 486); a.flat(150, 362, 410); a.flat(196, 316, 334); a.flat(150, 362, 258);
    a.flat(140, 372, 182);
    a.seg(8, 186, 110, 192); a.seg(402, 192, 504, 186);
    a.ladder(40, 486, 559); a.ladder(472, 486, 553);
    a.ladder(40, 186, 270); a.ladder(472, 186, 270);
    a.ladder(256, 486, 556); a.ladder(200, 410, 486); a.ladder(312, 410, 486);
    a.ladder(256, 334, 410); a.ladder(220, 258, 334); a.ladder(292, 258, 334);
    a.ladder(170, 182, 258); a.ladder(342, 182, 258);
    [[150, 556], [200, 556], [312, 556], [362, 556], [110, 434], [110, 326], [402, 434], [402, 326], [30, 270], [482, 270],
     [210, 486], [300, 486], [170, 410], [342, 410], [256, 334], [180, 258], [332, 258], [60, 189], [452, 189]].forEach(function (p) { a.item('fish', p[0], p[1]); });
    a.item('goldfish', 160, 182);
    return { startX: 256, rival: rival(a, 256, 182, 1) };
  }));

  // =====================================================================================
  // WORLD 2 — FROZEN CANNERY
  // =====================================================================================

  // 2-1 Conveyor Cannery: eight flat tiers of belts; three "chute" tiers feed a central drop.
  S.push(build({
    id: '2-1', world: 2, name: 'Conveyor Cannery', subtitle: 'Mind the belts!', theme: 'cannery', music: 'cannery',
    timer: 4400, goal: { type: 'reach' },
    blurb: 'Belts carry you toward the edges. Standing still is dangerous!',
    hazards: { snowballs: { interval: [1.7, 2.9], speed: 110, ladderChance: 0.3, blueChance: 0.22, giantChance: 0, aimed: 0 },
      frostlings: { max: 3, start: 0 } }
  }, function (a) {
    a.floor();
    a.flat(40, 504, 489, 'conveyor', { dir: -1, speed: 30 });
    a.flat(8, 236, 425, 'conveyor', { dir: 1, speed: 32 }); a.flat(276, 504, 425, 'conveyor', { dir: -1, speed: 32 });
    a.flat(72, 504, 361, 'conveyor', { dir: -1, speed: 34 });
    a.flat(8, 236, 297, 'conveyor', { dir: 1, speed: 36 }); a.flat(276, 504, 297, 'conveyor', { dir: -1, speed: 36 });
    a.flat(8, 440, 233, 'conveyor', { dir: 1, speed: 38 });
    a.flat(8, 236, 169, 'conveyor', { dir: 1, speed: 40 }); a.flat(276, 504, 169, 'conveyor', { dir: -1, speed: 40 });
    a.seg(8, 101, 180, 106);                     // King's ledge
    a.seg(320, 105, 504, 99);                    // cubs' ledge
    a.ladder(120, 489, 558); a.ladder(400, 489, 554);
    a.ladder(60, 425, 489); a.ladder(470, 425, 489); a.ladder(200, 425, 489, true);
    a.ladder(200, 361, 425); a.ladder(330, 361, 425);
    a.ladder(110, 297, 361); a.ladder(440, 297, 361);
    a.ladder(300, 233, 297); a.ladder(40, 233, 297);
    a.ladder(150, 169, 233); a.ladder(400, 169, 233);
    a.ladder(470, 101, 169); a.ladder(100, 104, 169, true);
    a.item('pick', 290, 361); a.item('fish', 250, 489); a.item('fish', 260, 233); a.item('freeze', 480, 297);
    a.item('gem', 226, 169);                     // lip of the top chute, belt pushes you toward the drop
    return { startX: 72, cub: a.pos(468, 101), rival: rival(a, 140, 106, 1) };
  }));

  // 2-2 Freezer Lifts: two towers and a central column joined by an up-lift and a down-lift.
  S.push(build({
    id: '2-2', world: 2, name: 'Freezer Lifts', subtitle: 'Ride the freezer lifts!', theme: 'cannery', music: 'cannery',
    timer: 4600, goal: { type: 'reach' },
    blurb: 'Ride up on the left lift, hop across, and drop down the right one. Snowballs pour down the shafts!',
    hazards: { snowballs: { interval: [2.6, 4.0], speed: 108, ladderChance: 0.25, blueChance: 0.2, giantChance: 0, aimed: 0 },
      frostlings: { max: 2, start: 0 }, crabs: { interval: [3.4, 5.4], y: 120, speed: 110 } }
  }, function (a) {
    a.floor();
    // left tower: floors tilt down toward lift A
    a.seg(8, 482, 174, 488); a.seg(8, 404, 174, 410); a.seg(8, 326, 174, 332); a.seg(8, 248, 174, 254);
    // central column between the shafts
    a.flat(218, 294, 448); a.flat(218, 294, 372); a.flat(218, 294, 296); a.flat(218, 294, 220); a.flat(218, 294, 144);
    // right tower: floors tilt down toward lift B
    a.seg(338, 470, 504, 464); a.seg(338, 394, 504, 388); a.seg(338, 318, 504, 312); a.seg(338, 242, 504, 236);
    a.seg(338, 166, 504, 160);
    a.lift(196, 220, 488, 'up', 40, 3);
    a.lift(316, 220, 470, 'down', 44, 3);
    a.ladder(60, 484, 559); a.ladder(120, 408, 486); a.ladder(50, 328, 406, true); a.ladder(130, 252, 330);
    a.ladder(256, 296, 372);
    a.ladder(450, 466, 553); a.ladder(380, 392, 468); a.ladder(470, 314, 390, true); a.ladder(420, 239, 315);
    a.ladder(460, 162, 238);
    a.item('pick', 270, 296); a.item('fish', 90, 406); a.item('fish', 420, 391); a.item('freeze', 480, 465);
    a.item('gem', 232, 448);                     // a lift-only ledge right under the snowball chute
    return { startX: 72, cub: a.pos(476, 161), rival: rival(a, 256, 144, -1) };
  }));

  // 2-3 Cannery Keystones: full-width belt tiers. Chute tiers push inward, split tiers push outward.
  S.push(build({
    id: '2-3', world: 2, name: 'Cannery Keystones', subtitle: 'Pop every keystone!', theme: 'cannery', music: 'cannery',
    timer: 5000, goal: { type: 'keystones' },
    blurb: 'The keystones ride on the belts. Four frostlings guard the factory!',
    hazards: { snowballs: { interval: [2.3, 3.6], speed: 112, ladderChance: 0.3, blueChance: 0.28, giantChance: 0, aimed: 0 },

  }, function (a) {
    a.floor();
    function split(y, sp) {

      a.flat(8, 236, y, 'conveyor', { dir: 1, speed: sp }); a.flat(276, 504, y, 'conveyor', { dir: -1, speed: sp });
    }
    split(488, 32); chute(420, 34); split(352, 36); chute(284, 38); split(216, 40);
    a.flat(140, 372, 148);                       // King's gantry
    a.ladder(80, 488, 559); a.ladder(256, 488, 556); a.ladder(432, 488, 553);
    a.ladder(60, 420, 488); a.ladder(210, 420, 488); a.ladder(302, 420, 488); a.ladder(452, 420, 488);
    a.ladder(160, 352, 420); a.ladder(352, 352, 420);
    a.ladder(60, 284, 352); a.ladder(210, 284, 352); a.ladder(302, 284, 352); a.ladder(452, 284, 352);
    a.ladder(160, 216, 284); a.ladder(352, 216, 284);
    a.ladder(200, 148, 216); a.ladder(312, 148, 216);
    a.key(110, 488); a.key(402, 488);
    a.key(120, 420); a.key(392, 420);
    a.key(110, 352); a.key(402, 352);
    a.key(110, 284); a.key(402, 284);
    a.item('pick', 256, 352); a.item('fish', 30, 420); a.item('fish', 482, 284); a.item('shield', 256, 216);
    a.item('gem', 462, 216);                     // end of an outward belt: stand still and you ride off the edge
    return { startX: 72, cub: a.pos(170, 148), rival: rival(a, 300, 148, 1) };
  }));

  // T2 Snowball Storm: survive 40 s of snow raining from the sky plus the King's rollers.
  S.push(build({
    id: 'T2', world: 2, name: 'Snowball Storm', subtitle: 'Survive 40 seconds!', kind: 'test', theme: 'aurora', music: 'test',
    timer: 4000, goal: { type: 'survive', time: 40 },
    blurb: 'Snow falls from the sky! Grab shields and hearts to weather the storm.',
    hazards: { snowballs: { interval: [1.5, 2.5], speed: 116, ladderChance: 0.3, blueChance: 0, giantChance: 0.06, aimed: 0.1 },
      rain: { interval: [0.45, 0.9] } }
  }, function (a) {
    a.floor();
    a.seg(8, 476, 200, 482); a.seg(312, 482, 504, 476);
    a.flat(100, 412, 404);
    a.seg(8, 322, 170, 330); a.seg(342, 330, 504, 322);
    a.flat(120, 392, 250);
    a.flat(200, 312, 176);                       // King's perch
    a.ladder(60, 478, 559); a.ladder(452, 478, 553);
    a.ladder(150, 404, 480); a.ladder(362, 404, 480);
    a.ladder(130, 328, 404); a.ladder(382, 328, 404);
    a.ladder(150, 250, 329); a.ladder(362, 250, 329);
    a.item('shield', 256, 404); a.item('shield', 180, 250); a.item('heart', 40, 324); a.item('heart', 472, 324);
    a.item('freeze', 480, 477); a.item('fish', 100, 479); a.item('fish', 330, 250); a.item('turbo', 400, 554);
    return { startX: 256, rival: rival(a, 256, 176, 1) };
  }));

  // =====================================================================================
  // WORLD 3 — CRYSTAL CAVERNS
  // =====================================================================================

  // 3-1 Icicle Caverns: crooked ledges, bounce banks instead of ladders, icicles everywhere.
  S.push(build({

  // Characters are pre-rendered per animation frame into small offscreen canvases (LRU, memory capped)
  // so a frame costs one drawImage instead of dozens of gradient path fills.
  var SPR = { scale: 3, maxBytes: 80 * 1024 * 1024, bytes: 0, map: new Map(), hits: 0, misses: 0 };
  Art.spriteCache = true;
  // Aurora curtain ribbons drawn on summit/aurora (0..3). Lower on slow devices: it is the heaviest animated layer.
  Art.auroraRibbons = 3;
  function sprite(key, x0, y0, w, h, paint, extraScale) {
    var e = SPR.map.get(key);
    if (e) { SPR.hits++; SPR.map.delete(key); SPR.map.set(key, e); return e; }
    SPR.misses++;
    var s = SPR.scale * (extraScale || 1);
    var c = mkCanvas(w * s, h * s), g = c.getContext('2d');
    g.scale(s, s); g.translate(-x0, -y0);
    try { paint(g); } catch (err) { /* keep an empty frame rather than throwing in the game loop */ }
    e = { c: c, x: x0, y: y0, w: w, h: h, b: c.width * c.height * 4 };
    SPR.map.set(key, e); SPR.bytes += e.b;
    if (SPR.bytes > SPR.maxBytes) {
      var it = SPR.map.keys();
      while (SPR.bytes > SPR.maxBytes * 0.75) {
        var k = it.next(); if (k.done) break;
        var old = SPR.map.get(k.value); SPR.bytes -= old.b; SPR.map.delete(k.value);

  function fract(v) { return v - Math.floor(v); }

  // ---------------------------------------------------------------- shared painters (backgrounds)
  function ridge(rand, x0, x1, base, amp, step, rough) {
    var pts = [], y = base - amp * 0.5;
    for (var x = x0; x <= x1 + step; x += step * (0.6 + rand() * 0.8)) {
      y += (rand() - 0.5) * amp * rough;
      y = clamp(y, base - amp, base);
      pts.push([x, y]);
    }
    return pts;
  }
  function peaks(rand, x0, x1, base, hmin, hmax, wmin, wmax) {
    // explicit triangular-ish peaks with sub-jaggies
    var pts = [[x0 - 20, base]], x = x0 - 20;
    while (x < x1 + 20) {
      var w = lerp(wmin, wmax, rand()), h = lerp(hmin, hmax, rand());
      var px = x + w * (0.35 + rand() * 0.3);
      // left slope jaggies
      var n = 3;
      for (var i = 1; i <= n; i++) {
        var f = i / (n + 1);
        pts.push([lerp(x, px, f) + (rand() - 0.5) * 6, lerp(base - h * 0.15, base - h, f) + (rand() - 0.5) * h * 0.12]);
      }
      pts.push([px, base - h]);
      for (var j = 1; j <= n; j++) {
        var f2 = j / (n + 1);
        pts.push([lerp(px, x + w, f2) + (rand() - 0.5) * 6, lerp(base - h, base - h * 0.2, f2) + (rand() - 0.5) * h * 0.12]);
      }

  function fillRidge(g, pts, bottom, fill) {
    g.beginPath();

    g.lineTo(pts[pts.length - 1][0], bottom);
    g.closePath();

  }
  function shadeRidge(g, pts, bottom, shadow, snow, snowTop, snowSpan, lightDir) {
    // facet shadows on sides facing away from light; snow caps via gradient band
    g.save();

    g.moveTo(pts[0][0], bottom);
    for (var i = 0; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.lineTo(pts[pts.length - 1][0], bottom);
    g.closePath();

      sg.addColorStop(0, rgba(snow, 0.95)); sg.addColorStop(0.55, rgba(snow, 0.55)); sg.addColorStop(1, rgba(snow, 0));
      g.beginPath();
      for (var k = 0; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
      for (var k2 = pts.length - 1; k2 >= 0; k2--) g.lineTo(pts[k2][0], pts[k2][1] + 10 + ((k2 * 7919) % 13));
      g.closePath();
      g.fillStyle = sg; g.fill();
    }
    g.fillStyle = shadow;
    for (var p = 1; p < pts.length - 1; p++) {
      var a = pts[p - 1], b = pts[p], c = pts[p + 1];
      if (b[1] < a[1] && b[1] < c[1]) { // local peak
        var side = lightDir > 0 ? c : a;
        g.beginPath();
        g.moveTo(b[0], b[1]);

        var q = p, d = lightDir > 0 ? 1 : -1, steps = 0;

        g.lineTo(b[0] + d * (Math.abs(pts[q][0] - b[0]) * 0.25), bottom);
        g.lineTo(b[0] - d * 2, bottom);

  }

  function starField(g, rand, n, yMax, maxR, col) {

    const dir = downhill(g) || w.facing;
    S.balls.push({ x: x, y: surfY(g, x) - r, r: r, rot: 0, kind: kind, st: 'roll', g: g, dir: dir, vx: 0, vy: 0, speed: speed, skip: new Set(), id: Math.random() });
  }

  // ---------- players ----------
  function livePlayers() { return S.players.filter(p => !p.dead); }
  function ladderAt(x, s, which) {
    for (const l of S.ladders) {
      if (Math.abs(l.x - x) > 8) continue;
      if (which === 'bottom' && S.girders[l.bottom] === s) return l;

    return null;
  }
  function toAir(p, vy) { p.st = 'air'; p.vy = vy || 0; p.s = null; p.takeoffY = p.y; p.jumped = p.jumped || new Set(); }
  function setState(p, s) { if (p.state !== s) { p.state = s; p.anim = 0; } }

  function stepPlayer(p, dt) {
    const k = inp(p.i);

    p.anim += dt;
    p.inv = Math.max(0, p.inv - dt); p.turbo = Math.max(0, p.turbo - dt);
    if (p.pick > 0) { p.pick -= dt; if (p.pick <= 0) { p.pick = 0; } }
    const dirX = (k.right ? 1 : 0) - (k.left ? 1 : 0);
    const spd = WALK * (p.turbo > 0 ? 1.45 : 1);
    const wind = S.wind.force;
    if (p.st === 'ground') {
      let s = p.s;
      if (!s || s.gone || s.falling || (s.plat && s.wrapped)) { toAir(p, 0); return; }
      if (p.pick <= 0 && !s.plat) {
        if (k.up) { const l = ladderAt(p.x, s, 'bottom'); if (l) { p.st = 'climb'; p.lad = l; p.x = l.x; p.vx = 0; setState(p, 'climb'); return; } }
        if (k.down) { const l = ladderAt(p.x, s, 'top'); if (l) { p.st = 'climb'; p.lad = l; p.x = l.x; p.y = l.yTop + 3; p.vx = 0; setState(p, 'climb'); return; } }
      }
      const slick = s.kind === 'slick';
      p.vx += (dirX * spd - p.vx) * Math.min(1, (slick ? 2.4 : 20) * dt);
      if (dirX) p.facing = dirX;
      const conv = s.kind === 'conveyor' ? s.dir * s.speed * S.sp : 0;
      p.x += (p.vx + conv + wind) * dt;
      p.walk += Math.abs(p.vx * dt);
      if (p.x < 10) { p.x = 10; p.vx = 0; } if (p.x > W - 10) { p.x = W - 10; p.vx = 0; }
      if (p.x < s.x1 - 1 || p.x > s.x2 + 1) {
        const s2 = surfaceNear(p.x, p.y, 8, true, s);
        if (s2) { p.s = s2; s = s2; }
        else { toAir(p, 0); p.vx = (p.vx + conv) * 0.9; p.jumped = new Set(); p.combo = 0; setState(p, 'fall'); return; }
      }
      p.y = surfY(s, clamp(p.x, s.x1, s.x2));
      if (s.kind === 'crumble' && !s.ct) { s.ct = 0.0001; sfx('crack'); }
      if (Math.abs(p.vx) > 12) {

        setState(p, slick && Math.abs(p.vx - dirX * spd) > 30 ? 'slide' : 'walk');
      } else setState(p, slick && Math.abs(p.vx) > 4 ? 'slide' : 'idle');
      if (k.jumpP) {

        setState(p, 'jump'); sfx(bounce ? 'bounce' : 'jump'); if (bounce) FX('burst', p.x, p.y, 'snow', 10);
      }

      p.vy += GRAV * dt;

      const py = p.y;
      p.x += (p.vx + wind * 0.6) * dt; p.y += p.vy * dt;
      if (p.x < 10) { p.x = 10; p.vx = 0; } if (p.x > W - 10) { p.x = W - 10; p.vx = 0; }

      if (p.vy > 0) {
        const s = landSurface(p.x, py, p.y, true);

          const drop = surfY(s, clamp(p.x, s.x1, s.x2)) - p.takeoffY;
          p.s = s; p.st = 'ground'; p.y = surfY(s, clamp(p.x, s.x1, s.x2)); p.vy = 0;
          if (drop > MAXDROP && s.kind !== 'bounce') { kill(p, 'bonk'); return; }

          if (s.kind === 'bounce') { sfx('bounce'); }
        }

            addScore(pts, p.x, p.y - 40, p.combo > 1 ? '#ffd86b' : '#fff7d6');
            sfx('combo', { n: p.combo }); FX('burst', p.x, p.y - 10, 'sparkle', 6);
          }
        }
      }
      if (p.y > H + 40) kill(p, 'fall');
    } else if (p.st === 'climb') {

      p.y += v * CLIMB * dt; p.climb += Math.abs(v * CLIMB * dt);
      setState(p, 'climb');
      if (v) { p.climbAcc += Math.abs(v * CLIMB * dt); if (p.climbAcc > 16) { p.climbAcc = 0; sfx('climb'); } }

      if (!l.broken && p.y <= l.yTop) { p.y = l.yTop; p.st = 'ground'; p.s = S.girders[l.top]; p.vx = 0; p.lad = null; setState(p, 'idle'); }

  }

  function tryAct(p) {
    for (const l of S.levers) {

      FX('shake', 4); rumble(p.i, 0.5, 0.6, 180);
      if (S.walrus) S.shots.push({ x: l.x + 16, y: l.y - 22, sx: l.x + 16, sy: l.y - 22, t: 0, dur: 0.75, from: p.i });
      FX('burst', l.x + 16, l.y - 22, 'snow', 18);
      return;
    }
  }

  function kill(p, why) {
    if (p.dead || S.phase !== 'play') return;
    if (S.kind === 'test') {
      // tests use hearts, never lives
      if (p.inv > 0 && why !== 'bonk' && why !== 'fall') return;
      S.hearts--; sfx('hurt'); rumble(p.i, 0.7, 0.4, 250); FX('shake', 5); FX('burst', p.x, p.y - 16, 'ice', 14);
      if (S.hearts <= 0) { endTest(false); return; }

      else p.inv = 1.8;
      return;
    }
    p.dead = true; p.deadT = 0; p.st = 'dead'; p.vx = 0; setState(p, 'dead'); p.shield = false; p.pick = 0;
    sfx(why === 'bonk' ? 'bonk' : 'death'); rumble(p.i, 0.9, 0.6, 400);
    FX('shake', 7); FX('burst', p.x, p.y - 16, 'ice', 22);
    if (S.walrus && S.walrus.state !== 'hurt') { S.walrus.state = 'taunt'; S.walrus.anim = 0; sfx('laugh'); }

  }

  function hurtPlayer(p, obj) { // obj hazard touched player; returns true if hazard destroyed
    if (p.dead) return false;
    if (obj.frozen) { shatter(obj, 200); return true; }
    if (p.pick > 0) { shatter(obj, smashPts(obj), p); return true; }
    if (p.inv > 0) return false;
    if (p.shield) { p.shield = false; p.inv = 1.4; sfx('shieldbreak'); FX('burst', p.x, p.y - 16, 'ice', 16); rumble(p.i, 0.5, 0.3, 150); shatter(obj, 0); return true; }
    kill(p, 'hit'); return false;
  }
  function smashPts(o) { return o.kind ? SMASH_PTS[o.kind] || 300 : o.isCrab ? SMASH_PTS.crab : o.isPuffin ? SMASH_PTS.puffin : SMASH_PTS.frost; }
  function shatter(o, pts, p) {
    o.dead = true;

    sfx(pts && p ? 'smash' : 'crack'); FX('burst', o.x, o.y, 'smash', 18); FX('burst', o.x, o.y, 'ice', 10);

  }
  function overlapPlayer(p, x, y, r) {

  }
  function pickReach(p, x, y, r) {

  }
  function checkHazard(o, x, y, r) {
    for (const p of S.players) {

      if (overlapPlayer(p, x, y, r)) { if (hurtPlayer(p, o)) return; }
    }
  }

  // ---------- hazards step ----------
  function stepBalls(dt) {
    const hz = S.hz.snowballs || {};
    for (const b of S.balls) {
      if (b.dead) continue;
      if (b.st === 'roll') {
        const g = b.g;
        if (!g || g.gone || g.falling) { b.st = 'fall'; b.vy = 0; b.vx = b.dir * b.speed * 0.4; continue; }
        const conv = g.kind === 'conveyor' ? g.dir * g.speed * S.sp : 0;
        let vx = b.dir * b.speed + conv + S.wind.force * 0.5;
        if (g.kind === 'slick') vx *= 1.15;
        const nx = b.x + vx * dt;
        let took = false;
        if (b.kind !== 'giant') for (const l of S.ladders) {
          if (l.broken || S.girders[l.top] !== g || b.skip.has(l)) continue;

  }
  function intoHole(b) {

  }

  function stepFrost(dt) {
    for (const f of S.frost) {
      if (f.dead) continue;
      f.anim += dt;
      if (f.born < 1) f.born += dt;
      const chaser = S.players.find(p => !p.dead && p.s === f.g && Math.abs(p.x - f.x) < 150);
      f.scared = !!(chaser && chaser.pick > 0);
      if (f.st === 'walk') {
        const g = f.g;
        if (g.gone || g.falling) { f.st = 'fall'; f.vy = 0; continue; }
        let sp = f.speed;
        if (chaser) { const d = Math.sign(chaser.x - f.x) || 1; f.dir = f.scared ? -d : d; sp *= f.scared ? 1.2 : 1.35; }
        const conv = g.kind === 'conveyor' ? g.dir * g.speed * S.sp * 0.6 : 0;
        const nx = f.x + (f.dir * sp + conv) * dt;
        f.cd -= dt;
        if (f.cd <= 0) {
          for (const l of S.ladders) {
            if (l.broken || Math.abs(l.x - f.x) > 3) continue;
            const atBottom = S.girders[l.bottom] === g, atTop = S.girders[l.top] === g;
            if (!atBottom && !atTop) continue;
            if (Math.random() < 0.45) {
              const tgt = livePlayers()[0];
              let up = atBottom;
              if (atBottom && atTop) up = tgt ? tgt.y < f.y : Math.random() < 0.5;
              if (tgt && atBottom && !atTop && tgt.y > f.y && Math.random() < 0.6) break;
              f.st = 'climb'; f.lad = l; f.up = up; f.x = l.x; f.cd = rnd(2, 4); break;
            }

  function stepCrabs(dt) {
    const hz = S.hz.crabs; if (!hz) return;

      const side = Math.random() < 0.5 ? -1 : 1;
      S.crabs.push({ isCrab: true, x: side < 0 ? 4 : W - 4, y0: hz.y || 110, y: hz.y || 110, dir: -side, t: 0, st: 'hop', dropX: rnd(70, W - 70), vy: 0, anim: 0, speed: (hz.speed || 120) * S.sp });
      sfx('crab');

    for (const c of S.crabs) {

        if (c.y > H + 30) c.dead = true;
      }

    }
    S.crabs = S.crabs.filter(c => !c.dead);
  }

  function stepPuffins(dt) {
    const hz = S.hz.puffins; if (!hz) return;
    S.nextPuffin -= dt;
    if (S.nextPuffin <= 0 && S.phase === 'play') {
      S.nextPuffin = rint(hz.interval || [3, 6]) * S.iv;
      const side = Math.random() < 0.5 ? -1 : 1;
      const lp = livePlayers(); const tgt = lp[Math.floor(Math.random() * lp.length)];
      const base = tgt ? clamp(tgt.y - rnd(40, 70), 50, H - 60) : rnd(80, 400);
      S.puffins.push({ isPuffin: true, x: side < 0 ? -16 : W + 16, y: base, base: base, facing: -side, vx: -side * (hz.speed || 150) * S.sp, anim: 0, dive: 0, diving: false, done: false });
      sfx('puffin');
    }
    for (const u of S.puffins) {
      u.anim += dt; u.x += u.vx * dt;
      const tgt = livePlayers().find(p => Math.abs(p.x - u.x) < 80 && p.y > u.base && p.y - u.base < 110);
      if (!u.done && tgt && Math.sign(tgt.x - u.x) === Math.sign(u.vx)) { u.diving = true; u.depth = clamp(tgt.y - 14 - u.base, 0, 100); }
      if (u.diving) { u.dive = Math.min(1, u.dive + dt * 1.6); if (u.dive >= 1) { u.diving = false; u.done = true; } }
      else if (u.done) u.dive = Math.max(0, u.dive - dt * 1.2);
      u.y = u.base + Math.sin(u.dive * Math.PI / 2) * (u.depth || 0);

    }
    S.puffins = S.puffins.filter(u => !u.dead);
  }

  function stepIcicles(dt) {
    for (const ic of S.icicles) {
      ic.t += dt;
      if (ic.state === 'hang') {
        if (S.players.some(p => !p.dead && Math.abs(p.x - ic.x) < 34 && p.y > ic.y + 10 && p.y - ic.y < 260)) { ic.state = 'shake'; ic.t = 0; sfx('crack'); }
      } else if (ic.state === 'shake') {
        if (ic.t > 0.55) { ic.state = 'fall'; ic.vy = 0; ic.land = firstSurfaceBelow(ic.x, ic.y + 24); sfx('icicle'); }
      } else if (ic.state === 'fall') {
        ic.vy += GRAV * dt; ic.tip += ic.vy * dt;
        const o = { x: ic.x, y: ic.tip - 6 };
        for (const p of S.players) {
          if (pickReach(p, ic.x, ic.tip - 6, 6)) { shatter(o, 200, p); resetIcicle(ic); break; }
          if (overlapPlayer(p, ic.x, ic.tip - 6, 7)) { hurtPlayer(p, o); resetIcicle(ic); FX('burst', ic.x, ic.tip, 'ice', 10); break; }
        }
        if (ic.state === 'fall' && ic.tip >= ic.land) { FX('burst', ic.x, ic.land, 'ice', 12); sfx('crack'); resetIcicle(ic); }

  function stepShots(dt) {

  function stepKeystones(dt) {
    if (!S.keystones.length) return;

  function stepGirders(dt) {

  function stepGoal(dt) {

  // ---------- main play step ----------

      return;
    }
    if (S.phase === 'play' || S.phase === 'dying') {

    }

      return;
    }
    if (S.phase === 'clear' || S.phase === 'victory') {

    }

  }

  function nextStage() {
    save.best[S.def.id] = Math.max(save.best[S.def.id] || 0, run.score);
    run.idx++;

    save.reached = Math.max(save.reached || 0, run.round > 1 ? stageList().length - 1 : run.idx);

  }
  function gameOver() {

    writeSave();
  }

  // ---------- rendering ----------
  function drawStage() {
    art('drawBackground', ctx, S.theme || 'glacier', T);
    if (S.elevators) S.elevators.forEach(e => art('drawShaft', ctx, e.x, e.yTop, e.yBottom, e.w || 40));
    for (const l of S.ladders) art('drawLadder', ctx, l.x, l.yTop, l.yBot, !!l.broken, S.theme);
    for (const g of S.girders) {

    for (const p of S.plats) art('drawElevator', ctx, { x: (p.x1 + p.x2) / 2, y: p.y, w: p.x2 - p.x1 });
    for (const k of S.keystones) { if (!k.popped || k.anim < 0.6) art('drawKeystone', ctx, k); }
    for (const l of S.levers) { art('drawCannon', ctx, { x: l.x + 16, y: l.y, anim: l.pulled ? l.anim : 9 }); art('drawLever', ctx, l); }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

      art('drawBear', ctx, { x: 120, y: 520, facing: 1, state: 'idle', anim: T, walk: 0, climb: 0, skin: save.skin, player: 0, scale: 1.4 });
      txt(modeT > 3 ? 'Press A, Enter or tap to begin' : '', W / 2, 395, 12, '#9fd0ff', 'center', 'body');
      if ((m.confirmP && modeT > 0.5) || modeT > 7) startStage();
      return;
    }
    if (mode === 'pause') {
      const items = [
        { label: 'Resume', go: () => { mode = 'play'; sfx('pause'); } },
        { label: 'Restart Stage', go: () => { const lives = run.lives; startStage(); run.lives = Math.max(1, lives - (S.kind === 'test' ? 0 : 1)); } },
        { label: 'Sound: ' + (isMuted() ? 'Off' : 'On'), go: () => toggleMute() },
        { label: 'Quit to Title', go: () => { mode = 'title'; menuSel = 0; music('title'); writeSave(); } }
      ];
      setMenu(items);
      ctx.fillStyle = 'rgba(4,10,28,0.6)'; ctx.fillRect(0, 0, W, H);
      panel(126, 170, 260, 240);
      txt('PAUSED', W / 2, 200, 26, '#fff', 'center', null, 4);
      drawMenuList(142, 250, 228, 40, items);
      if (m.pauseP || m.backP) { mode = 'play'; sfx('pause'); return; }
      menuNav(m, items);
      return;
    }
    if (mode === 'gameover') {
      ctx.fillStyle = 'rgba(4,10,28,0.7)'; ctx.fillRect(0, 0, W, H);
      panel(76, 150, 360, 290);
      txt('GAME OVER', W / 2, 190, 34, '#ffb0b0', 'center', null, 5);
      txt('Score ' + pad(run.score, 6), W / 2, 236, 20, '#fff', 'center', null, 3);
      if (run.score > 0 && run.score >= save.hi) txt('New high score!', W / 2, 264, 14, '#ffe39a', 'center', 'body');
      txt('Reached ' + S.def.id + ' ' + S.def.name, W / 2, 288, 12, '#cfe6ff', 'center', 'body');
      txt('Continuing starts your score from zero', W / 2, 310, 11, 'rgba(210,230,255,0.7)', 'center', 'body');
      const items = [
        { label: 'Continue Here', go: () => { run.score = 0; run.lives = 3; run.nextLife = 20000; startStage(); } },
        { label: 'Title Screen', go: () => { mode = 'title'; menuSel = 0; music('title'); } }
      ];
      setMenu(items);
      drawMenuList(106, 340, 300, 42, items);
      if (modeT > 0.8) menuNav(m, items);
      return;
    }
    if (mode === 'victory') {
      art('drawBackground', ctx, 'summit', T);
      panel(46, 110, 420, 360);
      txt('YOU DID IT!', W / 2, 150, 38, '#ffe39a', 'center', null, 5);
      txt('Pip and Tuck are safe at home.', W / 2, 192, 15, '#e8f4ff', 'center', 'body');
      txt('King Blubberwick is sulking on his throne.', W / 2, 214, 13, '#cfe6ff', 'center', 'body');
      art('drawBear', ctx, { x: W / 2, y: 300, facing: 1, state: 'win', anim: T, walk: 0, climb: 0, skin: save.skin, player: 0, scale: 1.8 });
      art('drawCubs', ctx, { x: W / 2 + 70, y: 300, state: 'cheer', anim: T });
      txt('Score ' + pad(run.score, 6), W / 2, 336, 20, '#fff', 'center', null, 3);
      txt('Tests passed ' + run.testsPassed + ' / 3   ·   Gems ' + gemCount() + ' / 12', W / 2, 362, 12, '#e5c8ff', 'center', 'body');
      const items = [
        { label: 'Round ' + (run.round + 1) + ': Faster!', go: () => { run.round++; run.idx = 0; startStage(); banner = { text: 'Round ' + run.round + '! Everything is faster.', t: 0, dur: 2.6 }; } },
        { label: 'Title Screen', go: () => { mode = 'title'; menuSel = 0; music('title'); } }
      ];
      setMenu(items);
      drawMenuList(106, 404, 300, 40, items);
      if (Math.random() < 0.08) FX('burst', rnd(60, 450), rnd(80, 200), 'confetti', 8);
      if (modeT > 1) menuNav(m, items);
      return;
    }
  }

  // ---------- loop ----------
  let last = 0, acc = 0, booted = false, perfAcc = 0, perfN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dtR = Math.min(0.1, Math.max(0, (now - (last || now)) / 1000)); last = now;
    T += dtR; modeT += dtR;
    perfAcc += dtR; perfN++;
    if (perfAcc > 2) { const avg = perfAcc / perfN; perfAcc = 0; perfN = 0; try { if (PB.Art && typeof PB.Art.auroraRibbons === 'number') { if (avg > 0.024 && PB.Art.auroraRibbons > 1) PB.Art.auroraRibbons--; } } catch (e) { } }
    try { PB.Input && PB.Input.update && PB.Input.update(); } catch (e) { if (!errs.input) { errs.input = 1; console.error(e); } }
    if (mode === 'boot') {
      const m = menuIn(), k = inp(0);
      if (m.confirmP || m.pauseP || k.jumpP || k.actP || m.backP) leaveBoot();
    }
    if (mode === 'play') {
      const m0 = inp(0), m1 = run && run.nPlayers > 1 ? inp(1) : NOIN;
      if ((m0.pauseP || m1.pauseP) && (S.phase === 'play' || S.phase === 'intro')) { mode = 'pause'; menuSel = 0; sfx('pause'); }
      else {
        acc += dtR; let n = 0;
        while (acc >= STEP && n < 14) { stepPlay(STEP); acc -= STEP; n++; if (mode !== 'play') break; }
        if (n >= 14) acc = 0;
      }
    } else acc = 0;
    FX('update', dtR);
    // draw
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#071226'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = scale * dpr;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    if ((mode === 'play' || mode === 'pause' || mode === 'gameover') && S) {
      const sh = FX('shakeOffset') || { x: 0, y: 0 };
      ctx.save(); ctx.translate(sh.x || 0, sh.y || 0);
      drawStage();
      ctx.restore();
      drawHUD(); drawOverlays();
    } else if (mode === 'victory' || mode === 'select' || mode === 'skins' || mode === 'howto' || mode === 'story') {
      // menus draw their own backgrounds
    }
    if (mode === 'play') prevMode = 'play';
    if (mode !== 'play') { drawMenus(); if (mode !== 'pause' && mode !== 'gameover') FX('draw', ctx); }
    ctx.restore();
  }
  function leaveBoot() {
    if (mode !== 'boot') return;
    try { PB.Audio && PB.Audio.unlock && PB.Audio.unlock(); } catch (e) { }
    try { if (save.muted && PB.Audio && PB.Audio.setMuted) PB.Audio.setMuted(true); } catch (e) { }
    mode = 'title'; menuSel = 0; modeT = 0; music('title');
  }

  function onPointer(e) {
    try { PB.Audio && PB.Audio.unlock && PB.Audio.unlock(); } catch (er) { }
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (mode === 'boot') { leaveBoot(); lastPointerAct = performance.now(); return; }
    if (mode === 'play') return;
    if (mode === 'story') { if (modeT > 0.5) { startStage(); lastPointerAct = performance.now(); } return; }
    for (const rc of menuRects) {
      if (x >= rc.x && x <= rc.x + rc.w && y >= rc.y && y <= rc.y + rc.h) {
        menuSel = rc.i; lastPointerAct = performance.now();
        activate(menuItems[rc.i]); return;
      }
    }
  }

  function init() {
    loadSave();
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    try { PB.Art && PB.Art.init && PB.Art.init(); } catch (e) { console.error('art init', e); }
    try { PB.Input && PB.Input.init && PB.Input.init(canvas, document.getElementById('touch')); } catch (e) { console.error('input init', e); }
    canvas.addEventListener('pointerdown', onPointer);
    const unlock = () => { try { PB.Audio && PB.Audio.unlock && PB.Audio.unlock(); } catch (e) { } };
    window.addEventListener('keydown', e => { unlock(); if (mode === 'boot') leaveBoot(); }, true);
    window.addEventListener('touchstart', unlock, { passive: true, capture: true });
    window.addEventListener('pointerdown', unlock, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && S && (S.phase === 'play' || S.phase === 'intro')) { mode = 'pause'; menuSel = 0; } });
    window.addEventListener('blur', () => { if (mode === 'play' && S && S.phase === 'play') { mode = 'pause'; menuSel = 0; } });
    try { if (document.fonts && document.fonts.load) { document.fonts.load('20px "Lilita One"'); document.fonts.load('700 12px Nunito'); } } catch (e) { }
    requestAnimationFrame(frame);
  }

  // test hooks
  PB.Game = {
    get mode() { return mode; }, get S() { return S; }, get run() { return run; }, save: () => save,
    start(idx, n) { leaveBoot(); newRun(n || 1, idx || 0); startStage(); },
    skipIntro() { if (S) { S.phase = 'play'; S.phaseT = 0; } },
    step(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) stepPlay(STEP); },
    errors: errs, surfY: surfY
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
