  up: null, upChoices: [], upSel: 0, saucerT: 12, waveT: 0, msg: '', msgT: 0, twoP: false, hue: 190,
  stats: { rocks: 0, saucers: 0 },
};
function baseUp() {
  return { guns: 1, rate: 1, range: 1, pierce: 0, thrust: 1, blinkCd: 1, nova: false, magnet: 1, comboWin: 0, startShield: false, drones: 0, seeker: false, rear: false, levels: {} };
}

const UPGRADES = [
  { id: 'twin', name: 'Twin Cannons', d: '+1 parallel barrel', max: 3, apply: u => u.guns++ },
  { id: 'rate', name: 'Rapid Capacitor', d: 'Fire 25% faster', max: 4, apply: u => u.rate *= 1.25 },
  { id: 'range', name: 'Long Barrel', d: 'Shots fly farther & faster', max: 3, apply: u => u.range *= 1.22 },
  { id: 'pierce', name: 'Piercing Rounds', d: 'Shots punch through +1 rock', max: 3, apply: u => u.pierce++ },
  { id: 'thrust', name: 'Afterburner', d: 'Stronger thrust & top speed', max: 3, apply: u => u.thrust *= 1.2 },
  { id: 'blink', name: 'Quick Blink', d: 'Blink recharges 30% faster', max: 3, apply: u => u.blinkCd *= 0.7 },
  { id: 'nova', name: 'Nova Blink', d: 'Blink leaves a shockwave', max: 1, apply: u => u.nova = true },
  { id: 'magnet', name: 'Tractor Field', d: 'Pull power-ups from afar', max: 2, apply: u => u.magnet *= 2 },
  { id: 'combo', name: 'Combo Keeper', d: 'Combo window +0.6s', max: 3, apply: u => u.comboWin += 0.6 },
  { id: 'shield', name: 'Wave Shield', d: 'Start each wave shielded', max: 1, apply: u => u.startShield = true },
  { id: 'drone', name: 'Wing Drone', d: 'An orbiting drone fires with you', max: 2, apply: u => u.drones++ },
  { id: 'seeker', name: 'Seeker Rounds', d: 'Shots curve toward targets', max: 1, apply: u => u.seeker = true },
  { id: 'rear', name: 'Tail Gun', d: 'Also fires backward', max: 1, apply: u => u.rear = true },
  { id: 'life', name: 'Spare Hull', d: '+1 life for each pilot', max: 9, apply: () => { G.players.forEach(p => { p.lives++; }); } },
];

function newPlayer(i) {
  return { i, x: W / 2 + (G.twoP ? (i ? 60 : -60) : 0), y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, lives: 3,
    respawn: 0, inv: 2.5, cool: 0, blink: 0, shield: 0, spread: 0, rapid: 0, thrustL: 0, droneA: 0, dead: false };
}

function startGame(twoP) {
  sfx().unlock();
  G.twoP = twoP; G.wave = 0; G.score = 0; G.nextLife = 10000; G.combo = 0; G.comboT = 0; G.comboBest = 0;
  G.up = baseUp();
  G.players = [newPlayer(0)]; if (twoP) G.players.push(newPlayer(1));
  G.rocks = []; G.bullets = []; G.ebullets = []; G.parts = []; G.pickups = []; G.saucers = []; G.texts = []; G.rings = [];
  G.stats = { rocks: 0, saucers: 0 };
  nextWave();
}

function nextWave() {
  G.wave++;
  G.scene = 'play';
  G.rocks = []; G.pickups = []; G.saucers = [];
  G.hue = (190 + G.wave * 47) % 360;
  const n = Math.min(3 + G.wave, 13);
  for (let i = 0; i < n; i++) spawnRock(3, null, null, true);
  // special rocks
  if (G.wave >= 3) for (let i = 0; i < Math.min(G.wave - 2, 4); i++) spawnRock(2, null, null, true, 'armor');
  if (G.wave >= 5) for (let i = 0; i < Math.min(Math.floor((G.wave - 3) / 2), 3); i++) spawnRock(3, null, null, true, 'volatile');
  G.saucerT = Math.max(6, 16 - G.wave);
  G.players.forEach(p => { if (p.alive) { p.inv = Math.max(p.inv, 1.5); if (G.up.startShield) p.shield = Math.max(p.shield, 1); } });
  G.msg = 'WAVE ' + G.wave; G.msgT = 2.2;
  sfx().play('waveStart');
}

function spawnRock(size, x, y, edge, kind) {
  if (edge) {
    // spawn away from players
    for (let k = 0; k < 20; k++) {
      x = Math.random() * W; y = Math.random() * H;
      if (G.players.every(p => Math.hypot(p.x - x, p.y - y) > 200)) break;
    }
  }
  const sp = (rnd(30, 70) + G.wave * 6) * (4 - size) ** 0.55 * (kind === 'armor' ? 0.7 : 1);
  const dir = Math.random() * TAU;
  const r = ROCK_R[size];
  const verts = [], nv = 9 + size * 2;
  for (let i = 0; i < nv; i++) verts.push(rnd(0.72, 1.08));
  G.rocks.push({ x, y, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, a: Math.random() * TAU, va: rnd(-1.2, 1.2),
    size, r, verts, hp: kind === 'armor' ? 3 : 1, kind: kind || 'plain', hit: 0 });
}

function wrap(o, m) { m = m || 0; if (o.x < -m) o.x += W + 2 * m; else if (o.x > W + m) o.x -= W + 2 * m; if (o.y < -m) o.y += H + 2 * m; else if (o.y > H + m) o.y -= H + 2 * m; }
function wdist(a, b) { let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y); if (dx > W / 2) dx = W - dx; if (dy > H / 2) dy = H - dy; return Math.hypot(dx, dy); }

function burst(x, y, col, n, spd, life, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(0.2, 1) * spd;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.5, 1) * life, max: life, col, sz: size || 2, line: Math.random() < 0.4 });
  }
}
function addShake(v) { G.shake = Math.min(G.shake + v, 22); }
function floatText(x, y, s, col, big) { G.texts.push({ x, y, s, col, t: 1.1, big }); }

function addScore(base, x, y, p) {
  G.combo++; G.comboT = 1.6 + G.up.comboWin;
  if (G.combo > G.comboBest) G.comboBest = G.combo;
  const mult = Math.min(1 + Math.floor((G.combo - 1) / 3), 10);
  const pts = base * mult;
  G.score += pts;
  if (mult > 1) floatText(x, y, pts + ' x' + mult, mult >= 5 ? '#ff3df0' : '#ffe66d', mult >= 5);
  if (G.combo > 1 && G.combo % 3 === 1) sfx().play('combo', { intensity: Math.min(mult / 10, 1) });
  while (G.score >= G.nextLife) {
    G.nextLife += 10000;
    G.players.forEach(pl => pl.lives++);
    G.msg = 'EXTRA SHIP'; G.msgT = 1.6; sfx().play('extraLife');
  }
  if (G.score > best) best = G.score;
}

function breakRock(r, idx, by) {
  G.rocks.splice(idx, 1);
  G.stats.rocks++;
  const col = rockColor(r);
  const pan = (r.x / W) * 2 - 1;
  burst(r.x, r.y, col, 10 + r.size * 8, 60 + r.size * 40, 0.9, 2);
  addShake(r.size * 2.5);
  sfx().play(['', 'rockSmall', 'rockMed', 'rockBig'][r.size], { pan });
  addScore([0, 100, 50, 20][r.size] * (r.kind === 'armor' ? 3 : 1), r.x, r.y, by);
  if (r.size > 1) {
    const n = r.kind === 'volatile' ? 3 : 2;
    for (let i = 0; i < n; i++) {
      spawnRock(r.size - 1, r.x + rnd(-6, 6), r.y + rnd(-6, 6), false, r.kind === 'armor' ? 'armor' : 'plain');
      const c = G.rocks[G.rocks.length - 1];
      c.vx += r.vx * 0.5; c.vy += r.vy * 0.5;
    }
  }
  if (r.kind === 'volatile') { shockwave(r.x, r.y, 130, false); }
  if (Math.random() < 0.06 + (r.size === 1 ? 0.03 : 0)) dropPickup(r.x, r.y);
}

function shockwave(x, y, R, friendly) {
  G.rings.push({ x, y, r: 4, R, t: 0, col: friendly ? '#9d7bff' : '#ff6b3d' });
  addShake(8); sfx().play('bomb', { pan: (x / W) * 2 - 1 });
  for (let i = G.rocks.length - 1; i >= 0; i--) {
    const r = G.rocks[i]; const d = Math.hypot(r.x - x, r.y - y);
    if (d < R + r.r) {
      if (r.size === 1 || (friendly && r.size === 2)) breakRock(r, i);
      else { const a = Math.atan2(r.y - y, r.x - x); r.vx += Math.cos(a) * 140; r.vy += Math.sin(a) * 140; }
    }
  }
  if (friendly) for (let i = G.saucers.length - 1; i >= 0; i--) if (Math.hypot(G.saucers[i].x - x, G.saucers[i].y - y) < R) killSaucer(i);
}

const PICK = { S: { col: '#7dff6a', name: 'SPREAD' }, R: { col: '#ffe66d', name: 'RAPID' }, O: { col: '#38f6ff', name: 'SHIELD' }, B: { col: '#9d7bff', name: 'NOVA' }, '+': { col: '#ff3df0', name: '1UP' } };
function dropPickup(x, y, forced) {
  const roll = Math.random();
  const k = forced || (roll < 0.3 ? 'S' : roll < 0.6 ? 'R' : roll < 0.85 ? 'O' : roll < 0.97 ? 'B' : '+');
  const a = Math.random() * TAU;
  G.pickups.push({ x, y, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, k, t: 12 });
}

function spawnSaucer() {
  const small = G.wave >= 3 && Math.random() < Math.min(0.25 + G.wave * 0.05, 0.75);
  const fromLeft = Math.random() < 0.5;
  G.saucers.push({ x: fromLeft ? -30 : W + 30, y: rnd(H * 0.15, H * 0.85), vx: (fromLeft ? 1 : -1) * (small ? 130 : 90) * (1 + G.wave * 0.03),
    vy: 0, small, r: small ? 13 : 22, fire: 1.2, zig: 1.5, hp: small ? 1 : 2, t: 0, hit: 0 });
}
function killSaucer(i) {
  const s = G.saucers[i]; G.saucers.splice(i, 1);
  G.stats.saucers++;
  burst(s.x, s.y, '#ff3df0', 40, 220, 1.1, 2.5); addShake(10);
  sfx().play('saucerBoom', { pan: (s.x / W) * 2 - 1 });
  addScore(s.small ? 1000 : 300, s.x, s.y);
  dropPickup(s.x, s.y, Math.random() < 0.12 ? '+' : null);
}

// ---------- player actions ----------
function fire(p) {
  const u = G.up;
  const rapid = p.rapid > 0;
  p.cool = (rapid ? 0.085 : 0.2) / u.rate;
  const spd = 520 * u.range, life = 0.95 * u.range;
  const shots = [];
  const g = u.guns;
  for (let k = 0; k < g; k++) shots.push({ off: (k - (g - 1) / 2) * 7, da: 0 });
  if (p.spread > 0) { shots.push({ off: 0, da: -0.22 }, { off: 0, da: 0.22 }); }
  if (u.rear) shots.push({ off: 0, da: Math.PI });
  for (const s of shots) {
    const a = p.a + s.da;
    const nx = Math.cos(p.a + Math.PI / 2) * s.off, ny = Math.sin(p.a + Math.PI / 2) * s.off;
    G.bullets.push({ x: p.x + Math.cos(a) * 16 + nx, y: p.y + Math.sin(a) * 16 + ny, vx: Math.cos(a) * spd + p.vx * 0.5, vy: Math.sin(a) * spd + p.vy * 0.5,
      life, pierce: u.pierce, owner: p.i, col: PCOL[p.i], hitSet: null });
  }
  for (let d = 0; d < u.drones; d++) {
    const da = p.droneA + d * Math.PI;
    const dx = p.x + Math.cos(da) * 30, dy = p.y + Math.sin(da) * 30;
    G.bullets.push({ x: dx, y: dy, vx: Math.cos(p.a) * spd, vy: Math.sin(p.a) * spd, life: life * 0.8, pierce: 0, owner: p.i, col: '#c9a7ff', hitSet: null });
  }
  sfx().play(p.spread > 0 ? 'fireSpread' : rapid ? 'fireRapid' : 'fire', { pan: (p.x / W) * 2 - 1 });
}

function blink(p) {
  if (p.blink > 0) return;
  p.blink = 3 * G.up.blinkCd;
  burst(p.x, p.y, PCOL[p.i], 24, 160, 0.6, 2);
  // blink forward 170px, wrapping
  const ox = p.x, oy = p.y;
  p.x += Math.cos(p.a) * 170; p.y += Math.sin(p.a) * 170; wrap(p);
  G.parts.push({ x: ox, y: oy, x2: p.x, y2: p.y, trail: true, life: 0.35, max: 0.35, col: PCOL[p.i] });
  p.inv = Math.max(p.inv, 0.6);
  burst(p.x, p.y, '#ffffff', 16, 120, 0.4, 1.5);
  sfx().play('hyperspace', { pan: (p.x / W) * 2 - 1 });
  if (G.up.nova) shockwave(p.x, p.y, 120, true);
}

function killPlayer(p) {
  if (p.inv > 0 || !p.alive) return;
  if (p.shield > 0) {
    p.shield = 0; p.inv = 1.2; sfx().play('shieldHit'); addShake(6);
    G.rings.push({ x: p.x, y: p.y, r: 10, R: 90, t: 0, col: '#38f6ff' });
    input().rumble(p.i, 0.5, 200);
    return;
  }
  p.alive = false; p.lives--; p.respawn = 2.2;
  burst(p.x, p.y, PCOL[p.i], 60, 260, 1.5, 2.5); burst(p.x, p.y, '#ffffff', 20, 120, 0.8, 2);
  addShake(18); G.flash = 0.25; sfx().play('shipBoom'); sfx().duck(900);
  input().rumble(p.i, 1, 450);
  G.combo = 0;
  p.spread = 0; p.rapid = 0;
}

// ---------- update ----------
let lastIn = null;
function update(dt) {
  const I = input().poll(dt);
  lastIn = I;
  G.t += dt;
  if (I.confirm || I.p2Join) sfx().unlock();
  if (I.mute) { sfx().unlock(); sfx().toggleMute(); }
  if (G.scene === 'title') {
    if (I.p2Join) startGame(true);
    else if (I.confirm) startGame(false);
    sfx().music(false, 0);
    ambient(dt);
    return;
  }
  if (G.scene === 'over') {
    G.overT += dt; ambient(dt); sfx().music(false, 0); sfx().saucer(false);
    if (G.overT > 1.2 && (I.confirm || I.pause)) { G.scene = 'title'; }
    stepFx(dt);
    return;
  }
  if (G.scene === 'paused') {
    if (I.pause || I.confirm) { G.scene = 'play'; }
    if (I.back && !I.pause) G.scene = 'title';
    G.players.forEach(p => sfx().thrust(p.i, false, 0)); sfx().saucer(false);
    return;
  }
  if (G.scene === 'upgrade') {
    if (I.nav.left || I.nav.up) { G.upSel = (G.upSel + G.upChoices.length - 1) % G.upChoices.length; sfx().play('menuMove'); }
    if (I.nav.right || I.nav.down) { G.upSel = (G.upSel + 1) % G.upChoices.length; sfx().play('menuMove'); }
    if (G.upT > 0.5 && (I.confirm || I.players[0].fire && G.upT > 0.9)) chooseUpgrade(G.upSel);
    G.upT += dt; stepFx(dt);
    return;
  }
  // ---- play ----
  if (I.pause) { G.scene = 'paused'; return; }
  if (G.twoP === false && I.p2Join) { // drop-in second player
    G.twoP = true; const p = newPlayer(1); p.lives = 3; G.players.push(p); G.msg = 'PLAYER 2 JOINS'; G.msgT = 1.5; sfx().play('menuSelect');
  }
  const u = G.up;
  for (const p of G.players) {
    const P = I.players[p.i] || { rot: 0, thrust: 0, fire: false, ability: false };
    if (!p.alive) {
      sfx().thrust(p.i, false, 0);
      if (p.lives > 0) { p.respawn -= dt; if (p.respawn <= 0 && safeSpot(W / 2, H / 2)) { Object.assign(p, newPlayer(p.i), { lives: p.lives, x: W / 2, y: H / 2, inv: 2.5, shield: u.startShield ? 1 : 0 }); } }
      continue;
    }
    // aim (touch stick / right stick / mouse)
    let aim = P.aim != null ? P.aim : null;
    if (aim == null && p.i === 0 && input().pointer && input().pointer.active) aim = Math.atan2(input().pointer.y - p.y, input().pointer.x - p.x);
    if (aim != null) { const d = angDiff(p.a, aim); p.a += clamp(d, -7 * dt, 7 * dt); }
    else p.a += P.rot * 4.6 * dt;
    const th = clamp(P.thrust, 0, 1);
    const acc = 330 * u.thrust;
    p.vx += Math.cos(p.a) * acc * th * dt; p.vy += Math.sin(p.a) * acc * th * dt;
    const max = 420 * Math.sqrt(u.thrust);
    const sp = Math.hypot(p.vx, p.vy); if (sp > max) { p.vx *= max / sp; p.vy *= max / sp; }
    const drag = Math.pow(0.55, dt); p.vx *= drag; p.vy *= drag;
    p.x += p.vx * dt; p.y += p.vy * dt; wrap(p);
    p.thrustL = th;
    sfx().thrust(p.i, th > 0.05, th);
    if (th > 0.05 && Math.random() < 0.9) {
      const ba = p.a + Math.PI + rnd(-0.3, 0.3);
      G.parts.push({ x: p.x - Math.cos(p.a) * 12, y: p.y - Math.sin(p.a) * 12, vx: Math.cos(ba) * rnd(80, 200) + p.vx, vy: Math.sin(ba) * rnd(80, 200) + p.vy, life: 0.35, max: 0.35, col: th > 0.6 ? '#ffb347' : '#ff7a3d', sz: 2 });
    }
    p.cool -= dt; p.blink -= dt; p.inv -= dt; p.spread -= dt; p.rapid -= dt; p.droneA += dt * 3;
    if (P.fire && p.cool <= 0) fire(p);
    if (P.ability) blink(p);
  }
  // bullets
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    if (u.seeker) {
      let tgt = null, bd = 220;
      for (const r of G.rocks) { const d = Math.hypot(r.x - b.x, r.y - b.y); if (d < bd) { bd = d; tgt = r; } }
      for (const s of G.saucers) { const d = Math.hypot(s.x - b.x, s.y - b.y); if (d < bd + 80) { bd = d; tgt = s; } }
      if (tgt) { const sp = Math.hypot(b.vx, b.vy); const a = Math.atan2(b.vy, b.vx); const na = a + clamp(angDiff(a, Math.atan2(tgt.y - b.y, tgt.x - b.x)), -3 * dt, 3 * dt); b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp; }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt;
    if (b.life <= 0) { G.bullets.splice(i, 1); continue; }
    let dead = false;
    for (let j = G.rocks.length - 1; j >= 0; j--) {
      const r = G.rocks[j];
      if (b.hitSet && b.hitSet.has(r)) continue;
      if (Math.hypot(r.x - b.x, r.y - b.y) < r.r) {
        burst(b.x, b.y, '#ffffff', 4, 80, 0.25, 1.5);
        r.hp--; r.hit = 0.12;
        if (r.hp <= 0) breakRock(r, j, b.owner);
        else sfx().play('shieldHit', { pan: (r.x / W) * 2 - 1, pitch: 0.6 });
        if (b.pierce > 0) { b.pierce--; (b.hitSet || (b.hitSet = new Set())).add(r); }
        else { dead = true; }
        break;
      }
    }
    if (!dead) for (let j = G.saucers.length - 1; j >= 0; j--) {
      const s = G.saucers[j];
      if (Math.hypot(s.x - b.x, s.y - b.y) < s.r + 3) { s.hp--; s.hit = 0.1; if (s.hp <= 0) killSaucer(j); dead = true; break; }
    }
    if (dead) G.bullets.splice(i, 1);
  }
  // rocks
  for (const r of G.rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.va * dt; r.hit -= dt; wrap(r, r.r); }
  // saucers
  G.saucerT -= dt;
  if (G.saucerT <= 0 && G.saucers.length < (G.wave >= 6 ? 2 : 1)) { spawnSaucer(); G.saucerT = rnd(14, 22) - Math.min(G.wave, 8); }
  for (let i = G.saucers.length - 1; i >= 0; i--) {
    const s = G.saucers[i];
    s.t += dt; s.hit -= dt;
    s.zig -= dt; if (s.zig <= 0) { s.zig = rnd(0.8, 1.8); s.vy = [-1, 0, 1][Math.floor(Math.random() * 3)] * Math.abs(s.vx) * 0.6; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < 0) s.y += H; if (s.y > H) s.y -= H;
    if (s.x < -60 || s.x > W + 60) { G.saucers.splice(i, 1); continue; }
    s.fire -= dt;
    if (s.fire <= 0) {
      s.fire = (s.small ? 1.0 : 1.5) * Math.max(0.45, 1 - G.wave * 0.04);
      const tgts = G.players.filter(p => p.alive);
      let a = Math.random() * TAU;
      if (tgts.length && (s.small || Math.random() < 0.35)) {
        const t = tgts[Math.floor(Math.random() * tgts.length)];
        const err = s.small ? Math.max(0.03, 0.35 - G.wave * 0.03) : 0.4;
        a = Math.atan2(t.y - s.y, t.x - s.x) + rnd(-err, err);
      }
      G.ebullets.push({ x: s.x, y: s.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 1.6 });
      sfx().play('saucerFire', { pan: (s.x / W) * 2 - 1 });
    }
    for (let j = G.rocks.length - 1; j >= 0; j--) { const r = G.rocks[j]; if (Math.hypot(r.x - s.x, r.y - s.y) < r.r + s.r * 0.7) { breakRockSilent(r, j); s.hp--; if (s.hp <= 0) { killSaucerNoScore(i); break; } } }
  }
  sfx().saucer(G.saucers.length > 0, G.saucers.some(s => s.small));
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt;
    if (b.life <= 0) { G.ebullets.splice(i, 1); continue; }

  }
  // collisions player-rock / player-saucer
  for (const p of G.players) {
    if (!p.alive) continue;
    for (let j = G.rocks.length - 1; j >= 0; j--) {
      const r = G.rocks[j];
      if (Math.hypot(r.x - p.x, r.y - p.y) < r.r * 0.85 + 9) {

        break;

    for (let j = G.saucers.length - 1; j >= 0; j--) {
      const s = G.saucers[j];
      if (p.alive && Math.hypot(s.x - p.x, s.y - p.y) < s.r + 9) { killPlayer(p); killSaucer(j); }

    for (let j = G.pickups.length - 1; j >= 0; j--) {

}
function breakRockSilent(r, j) { G.rocks.splice(j, 1); burst(r.x, r.y, rockColor(r), 12, 100, 0.7, 2); if (r.size > 1) for (let i = 0; i < 2; i++) spawnRock(r.size - 1, r.x, r.y, false); }
function killSaucerNoScore(i) { const s = G.saucers[i]; G.saucers.splice(i, 1); burst(s.x, s.y, '#ff3df0', 30, 200, 1, 2); sfx().play('saucerBoom'); }
function safeSpot(x, y) { return G.rocks.every(r => Math.hypot(r.x - x, r.y - y) > r.r + 90); }

function collect(p, k) {
  const info = PICK[k.k];
  floatText(p.x, p.y - 20, info.name, info.col);
  burst(p.x, p.y, info.col, 18, 140, 0.6, 2);
  sfx().play('powerup'); input().rumble(p.i, 0.3, 120);
  if (k.k === 'S') p.spread = 12;
  else if (k.k === 'R') p.rapid = 10;
  else if (k.k === 'O') { p.shield = 1; sfx().play('shieldUp'); }

}

function openUpgrades() {
  sfx().play('waveClear');

  const bonus = 500 * G.wave;
  G.score += bonus; if (G.score > best) best = G.score;
  floatText(W / 2, H / 2 - 120, 'WAVE CLEAR +' + bonus, '#7dff6a', true);
  const avail = UPGRADES.filter(x => (G.up.levels[x.id] || 0) < x.max);
  const pick = [];
  while (pick.length < 3 && avail.length) pick.push(avail.splice(Math.floor(Math.random() * avail.length), 1)[0]);
  G.upChoices = pick; G.upSel = 0; G.upT = 0; G.scene = 'upgrade';
  G.ebullets = []; G.bullets = [];

}
function chooseUpgrade(i) {
  const up = G.upChoices[i]; if (!up) return;
  up.apply(G.up); G.up.levels[up.id] = (G.up.levels[up.id] || 0) + 1;
  sfx().play('upgrade');

}

function ambient(dt) {
  if (G.rocks.length < 6) spawnRock(3, null, null, true);
  for (const r of G.rocks) { r.x += r.vx * dt * 0.5; r.y += r.vy * dt * 0.5; r.a += r.va * dt * 0.5; wrap(r, r.r); }
}
function stepFx(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) { const q = G.parts[i]; q.life -= dt; if (q.life <= 0) { G.parts.splice(i, 1); continue; } if (!q.trail) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.97; q.vy *= 0.97; } }
  if (G.parts.length > 1400) G.parts.splice(0, G.parts.length - 1400);
  for (let i = G.texts.length - 1; i >= 0; i--) { const t = G.texts[i]; t.t -= dt; t.y -= 30 * dt; if (t.t <= 0) G.texts.splice(i, 1); }

// ---------- render ----------
function rockColor(r) {

}
function glowStroke(col, w) {
  ctx.strokeStyle = col; ctx.globalAlpha = 0.18; ctx.lineWidth = w * 5; ctx.stroke();
  ctx.globalAlpha = 0.35; ctx.lineWidth = w * 2.4; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = w; ctx.stroke();

function drawShip(p, x, y, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(p.a);
  ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(-11, 10); ctx.lineTo(-6, 0); ctx.lineTo(-11, -10); ctx.closePath();
  glowStroke(col, 1.8);

    ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(-8 - f, 0); ctx.lineTo(-8, -5);

}
function drawWrapped(o, r, fn) {
  fn(o.x, o.y);
  const nx = o.x < r ? W : o.x > W - r ? -W : 0, ny = o.y < r ? H : o.y > H - r ? -H : 0;
  if (nx) fn(o.x + nx, o.y); if (ny) fn(o.x, o.y + ny); if (nx && ny) fn(o.x + nx, o.y + ny);

function render() {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sx = G.shake ? rnd(-G.shake, G.shake) : 0, sy = G.shake ? rnd(-G.shake, G.shake) : 0;
  ctx.translate(sx, sy);
  // stars
  const lead = G.players[0] || { vx: 0, vy: 0 };
  for (const s of stars) {
    s.x -= lead.vx * 0.004 * s.z; s.y -= lead.vy * 0.004 * s.z; if (s.x < 0) s.x += W; if (s.x > W) s.x -= W; if (s.y < 0) s.y += H; if (s.y > H) s.y -= H;

  ctx.globalAlpha = 1;

      ctx.save(); ctx.translate(x, y); ctx.rotate(r.a);

    ctx.restore();

}
function wrapText(s, x, y, w, size, col) {

  sfx().unlock();
  if (G.scene === 'upgrade' && G.upCards && G.upT > 0.4) {
    G.upCards.forEach((c, i) => { if (e.clientX >= c.x && e.clientX <= c.x + c.w && e.clientY >= c.y && e.clientY <= c.y + c.h) { G.upSel = i; chooseUpgrade(i); } });
  } else if (G.scene === 'title' && e.pointerType === 'touch') startGame(false);
  else if (G.scene === 'over' && G.overT > 1.2) G.scene = 'title';
  else if (G.scene === 'paused' && e.pointerType === 'touch') G.scene = 'play';
});
addEventListener('keydown', () => sfx().unlock(), { once: true });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016; if (dt > 0.05) dt = 0.05;
  try {
    update(dt);
    if (window.Input && window.Input.setTouchVisible) window.Input.setTouchVisible(input().lastDevice === 'touch' && (G.scene === 'play'));
    render();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize();
if (window.Input) window.Input.init(cv);
window.__G = G; window.__startGame = startGame; window.__update = update; window.__render = render;
requestAnimationFrame(frame);
})();
</script>
