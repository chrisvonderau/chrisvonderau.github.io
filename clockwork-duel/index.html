#cd-ui .howto .vsr img{width:52px;height:52px}
#cd-ui .howto .bigb{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#2a1606;font-variant:small-caps;border:3px solid #f2c27a}
#cd-ui .howto .bigb.s{background:radial-gradient(circle at 35% 30%,#fff3c8,#ffa34a 45%,#5a2c12)}
#cd-ui .howto .bigb.b{background:radial-gradient(circle at 35% 30%,#f3e3c4,#9a7a52 50%,#2a1606)}
#cd-ui .howto .bigb.k{background:radial-gradient(circle at 35% 30%,#fff3c8,#d9c196 50%,#6b4423)}
#cd-ui .howto .lbl{width:100%;text-align:center;font-size:22px;color:#e8cf9f}
/* ---- v2: Large text (default on phones): workshop / re-program text >= 26 logical px (~14 px on iPhone) ---- */
#cd-ui.big .hint{font-size:26px}
#cd-ui.big .wp-h .ch{font-size:26px}
#cd-ui.big .prog .lb{font-size:24px;line-height:28px;top:-16px}
#cd-ui.big .slot .n{font-size:22px;top:8px}
#cd-ui.big .slot img{width:42px;height:42px;margin-top:8px}
#cd-ui.big .slot .s{font-size:24px;line-height:26px}
#cd-ui.big .slot .s.long{letter-spacing:-.07em;font-size:22px}
#cd-ui.big .mv .t{font-size:26px;line-height:28px}
#cd-ui.big .mv img{width:36px;height:36px}
#cd-ui.big .wp.rp .mv img{width:30px;height:30px}
#cd-ui.big .detail{font-size:26px;line-height:28px}
#cd-ui.big .coach{font-size:26px;line-height:1.28}
#cd-ui.big .cheat{font-size:24px}
#cd-ui.big .lt{font-size:26px}
#cd-ui.big .score{font-size:26px}
#cd-ui.big .score .sr .nt{font-size:24px}
#cd-ui.big .score .sr .dt{width:180px}
#cd-ui.big .prow .pn{font-size:27px}
#cd-ui.big .chc .ck,#cd-ui.big .chc .cs,#cd-ui.big .chc .cd{font-size:26px}
#cd-ui.big .chc .eq{font-size:24px;height:28px}
#cd-ui.big .hcrow .val span{font-size:24px}
#cd-ui.big .coachp{font-size:28px}
#cd-ui.big .setgrid .setrow .lab{font-size:28px}
#cd-ui.big .setgrid .setrow .val{width:156px;font-size:27px}
#cd-ui.big .dots{font-size:28px}
#cd-ui .rival .rh{font-size:21px;line-height:1.2}
#cd-ui .rival .rcb{display:flex;align-items:center;justify-content:center;gap:5px;margin:4px 0 2px}
#cd-ui .rival .rcb .cb{width:24px;height:32px;border-radius:4px;border-width:1px}
#cd-ui .rival .rcb .lamp{width:20px;height:20px;margin-left:6px}
#cd-ui .rival .mini img{width:34px;height:34px}
#cd-ui.big .rival .rh{font-size:24px}
#cd-ui .coachbox h2{color:#ffd38a}
#cd-ui .coachbox p{font-size:28px}
