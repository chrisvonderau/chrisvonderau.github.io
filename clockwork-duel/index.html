#cd-ui .slot .n{position:absolute;left:5px;top:12px;font-size:17px;opacity:.6}

#cd-ui .cheat img{width:34px;height:34px;flex:none}
#cd-ui .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#cd-ui .mv{position:relative;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 4px;cursor:pointer;border-radius:10px;
