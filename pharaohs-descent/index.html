<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pharaoh's Descent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Marcellus+SC&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
/* Layout: arcade cabinet. Lapis marquee, 4:3 screen between hieroglyph pillars, stone HUD strip, control deck. Single committed dark look. */
:root{
  --night:#0c0912; --stone:#1b1520; --stone-2:#272031; --lapis:#1d3567; --lapis-2:#11214a;
  --gold:#e8b44a; --gold-hi:#ffd77a; --gold-dim:#8f6d31; --ink:#f2e6c9; --ink-dim:#b4a688;
  --carnelian:#c4452d; --carnelian-hi:#e8673f; --turq:#3fb6a8;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-hud:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  --f-glyph:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  --pill:136px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--night);
  background-image:radial-gradient(120% 70% at 50% -10%,#2b1a33 0%,var(--night) 62%);
  color:var(--ink);font-family:var(--f-hud);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
.cabinet{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.marquee{
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(180deg,var(--lapis) 0%,var(--lapis-2) 100%);
  border:1px solid var(--gold-dim);border-radius:10px;padding-block:8px;padding-inline:14px;
  box-shadow:inset 0 0 0 3px rgba(232,180,74,.12),0 0 40px rgba(232,180,74,.08);
}
.marquee h1{
  margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-hi);
  font-size:clamp(20px,3.6vw,34px);letter-spacing:.14em;text-wrap:balance;text-align:center;
  text-shadow:0 0 18px rgba(255,200,90,.35),0 2px 0 #5a3b12;
}
.marquee .g{font-family:var(--f-glyph);color:var(--gold);font-size:clamp(16px,2.6vw,26px);opacity:.85}
.bay{display:flex;justify-content:center;align-items:stretch;gap:12px}
.pillar{
  width:56px;flex:0 0 56px;border-radius:8px;overflow:hidden;
  background:linear-gradient(90deg,var(--lapis-2),var(--lapis) 50%,var(--lapis-2));
  border:1px solid var(--gold-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding-block:12px;
  font-family:var(--f-glyph);color:var(--gold);font-size:26px;line-height:1;
  box-shadow:inset 0 0 0 3px rgba(232,180,74,.10);
}
.pillar span{opacity:.9;text-shadow:0 0 8px rgba(232,180,74,.35)}
.screen{
  position:relative;aspect-ratio:4/3;max-width:100%;touch-action:none;overscroll-behavior:contain;
  width:min(calc(100% - var(--pill)),max(260px,calc((100vh - 260px) * 4 / 3)));
  border-radius:12px;overflow:hidden;background:#000;
  border:3px solid #050308;outline:2px solid var(--gold-dim);outline-offset:3px;
  box-shadow:0 0 0 8px var(--stone),0 0 60px rgba(232,140,60,.18);
  container-type:inline-size;
}
@supports (height:100dvh){.screen{width:min(calc(100% - var(--pill)),max(260px,calc((100dvh - 260px) * 4 / 3)))}}
.screen canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
.overlay{
  position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(12,8,20,.72) 0%,rgba(8,5,12,.9) 100%);
  padding:4cqw;
}
.ov-card{max-width:78cqw;display:flex;flex-direction:column;align-items:center;gap:1.6cqw;text-align:center}
.eyebrow{margin:0;font-size:max(10px,1.9cqw);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.ov-card h2{
  margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-hi);
  font-size:max(22px,7cqw);letter-spacing:.08em;line-height:1.05;text-wrap:balance;
  text-shadow:0 0 24px rgba(255,190,80,.4);
}
.ov-card h3{margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-hi);font-size:max(18px,4.6cqw);letter-spacing:.06em;text-wrap:balance}
.lede{margin:0;color:var(--ink);font-size:max(12px,2.3cqw);line-height:1.45;max-width:60ch}
.dim{color:var(--ink-dim)}
.keys{display:grid;grid-template-columns:auto auto;gap:.6cqw 2.4cqw;margin:.6cqw 0 0;font-size:max(10.5px,1.95cqw);text-align:left}
.keys dt{color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.keys dd{margin:0;color:var(--ink)}
.big{font-size:max(26px,8cqw);font-weight:700;color:var(--gold-hi);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.go{
  margin-top:1cqw;font:600 max(12px,2.3cqw)/1 var(--f-hud);letter-spacing:.22em;text-transform:uppercase;
  color:#2a1606;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b98426);
  border:0;border-radius:999px;padding:1.6cqw 4cqw;cursor:pointer;
  box-shadow:0 0 0 2px #5a3b12,0 0 26px rgba(255,190,80,.35);
}
.go:hover{filter:brightness(1.08)}
.go:focus-visible,.arc:focus-visible,.chip:focus-visible{outline:2px solid var(--turq);outline-offset:3px}
.hud{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;
  background:var(--stone);border:1px solid #3a2f42;border-radius:10px;overflow:hidden;
}
.hud div{display:flex;flex-direction:column;gap:2px;padding:7px 10px;background:var(--stone-2);min-width:0}
.hud .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim)}
.hud .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .val.glyph{font-family:var(--f-glyph);color:var(--gold);font-size:18px;letter-spacing:.1em}
.hud .wide{grid-column:span 2}
.deck{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arc{
  width:84px;height:84px;flex:0 0 auto;border-radius:50%;border:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
  font:700 11px/1.15 var(--f-hud);letter-spacing:.12em;text-transform:uppercase;color:#fff4dc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.arc b{font-family:var(--f-glyph);font-weight:400;font-size:22px;letter-spacing:0}
.arc.staff{background:radial-gradient(circle at 35% 30%,var(--carnelian-hi),var(--carnelian) 55%,#7c2414);box-shadow:0 6px 0 #4d150b,0 0 24px rgba(232,103,63,.35)}
.arc.relic{background:radial-gradient(circle at 35% 30%,#3f66b5,var(--lapis) 55%,#0d1a3a);box-shadow:0 6px 0 #081128,0 0 24px rgba(63,102,181,.35)}
.arc:active{transform:translateY(4px);box-shadow:0 2px 0 #222}
.legend{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:12px;color:var(--ink-dim);min-width:0}
.legend kbd{font:600 11px var(--f-hud);color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:1px 5px;margin-right:4px}
.chip{
  font:600 11px var(--f-hud);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  background:transparent;border:1px solid var(--gold-dim);border-radius:999px;padding:7px 12px;cursor:pointer;
}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (max-width:760px){
  :root{--pill:0px}
  .pillar{display:none}
  .legend{display:none}
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hud .wide{grid-column:span 3}
  .hud .val{font-size:15px}
  .arc{width:76px;height:76px}
}
@media (prefers-reduced-motion:reduce){.arc:active{transform:none}}

/* ---- touch devices: iPhone / iPad ---- */
body{touch-action:manipulation}
.cabinet{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.go,.chip{touch-action:manipulation}
.overlay{overflow-y:auto}
.ov-card{margin:auto}
.pad,.touch{display:none}
@media (pointer:coarse){
  .legend,.kb{display:none}
  .touch{display:grid}
  .pad{
    display:flex;flex:1;align-self:stretch;min-height:96px;min-width:0;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:1px dashed var(--gold-dim);border-radius:16px;color:var(--ink-dim);
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-align:center;
    background:radial-gradient(circle at 50% 50%,rgba(232,180,74,.10),transparent 70%),var(--stone);
    touch-action:none;
  }
  .pad b{font-family:var(--f-glyph);font-weight:400;font-size:26px;color:var(--gold);letter-spacing:0}
  .pad.active{border-color:var(--gold);color:var(--ink);background:radial-gradient(circle at 50% 50%,rgba(232,180,74,.22),transparent 70%),var(--stone)}
}
@container (max-width:520px){
  .opt{display:none}
  .ov-card{gap:8px}
  .ov-card h2{font-size:26px}
  .keys{font-size:11px}
}
@media (max-width:760px){ .deck{flex-wrap:wrap} .chips{order:5;width:100%} }
@media (max-width:760px) and (pointer:coarse){ .pad{min-height:clamp(150px,calc(100dvh - 560px),280px)} .marquee{padding-block:6px} }
@media (max-width:760px){ .hud{grid-template-columns:repeat(4,minmax(0,1fr))} .hud .wide{grid-column:span 4} .hud div{padding:6px 8px} }
/* phone held sideways: thumb pad left, Staff right, screen as big as the height allows */
@media (orientation:landscape) and (max-height:540px){
  body{padding-block:6px}
  .cabinet{
    display:grid;height:100%;max-width:none;gap:8px;
    grid-template-columns:minmax(88px,1fr) auto minmax(88px,1fr);
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"hud hud hud" "pad screen staff" "relic screen chips";
  }
  .marquee,.pillar,.legend{display:none}
  .bay,.deck{display:contents}
  .hud{grid-area:hud;grid-template-columns:repeat(4,minmax(0,.8fr)) minmax(0,2.6fr)}
  .hud .wide{grid-column:span 1}
  .hud .wide .lbl{display:none}
  .hud div{padding:3px 8px;flex-direction:row;align-items:baseline;gap:6px}
  .hud .lbl{font-size:9px}
  .hud .val{font-size:13px}
  .screen{grid-area:screen;align-self:center;justify-self:center;width:min(calc(100vw - 260px),calc((100dvh - 64px) * 4 / 3))}
  .pad{grid-area:pad;min-height:0}
  #bRelic{grid-area:relic;justify-self:center;align-self:center}
  #bStaff{grid-area:staff;justify-self:center;align-self:center;width:96px;height:96px}
  .chips{grid-area:chips;align-self:center;order:0;width:auto}
}
</style>

  </div>
</div>

function bfs(){

function update(dt){
  if (G.state === 'play'){
    distT -= dt; if (distT <= 0){ bfs(); distT = .18; }
    if (P.dead){
      P.deathT -= dt;
      if (P.deathT <= 0){ G.lives--; if (G.lives <= 0) gameOver(); else respawn(); }
    } else {
      if (staffHeld){ staffRep -= dt; if (staffRep <= 0){ fireStaff(); staffRep = .26; } }
      playerUpdate(dt);
      for (const e of enemies) if (e.state !== 'dead' && e.state !== 'crushed') enemyUpdate(e, dt);
      for (const e of enemies){
        if (['walk','ghost','settle','wind','fire'].includes(e.state) && P.inv <= 0 && Math.hypot(e.x-P.x, e.y-P.y) < (e.type === 'g' ? .7 : .6)){ die(); break; }
      }
      if (L().timer){
        G.timer -= dt;

      }

    beamUpdate(dt);
    obelUpdate(dt);
    dartsUpdate(dt);
    shotsUpdate(dt);
    bossUpdate(dt);
    for (const t of traps){ t.t -= dt; if (t.t <= 0) t.dead = true; }
    traps = traps.filter(t => !t.dead);
    let minD = 99; for (const e of enemies) if (e.state!=='dead' && e.state!=='crushed') minD = Math.min(minD, Math.hypot(e.x-P.x, e.y-P.y));
    if (boss && !boss.dead) minD = Math.min(minD, Math.hypot(boss.x-P.x, boss.y-P.y) - 1);
    M.int = clamp(1-(minD-1.5)/7, 0, 1)*.7 + (G.keys/COL().n)*.3;
    if (L().timer && G.timer < 30) M.int = Math.max(M.int, .85);
    M.tempo += ((100 + 50*M.int) - M.tempo)*Math.min(1, dt*1.5);
  } else if (G.state === 'clear'){
    G.clearT -= dt;
    if (G.clearT <= 0 && G.clearT > -1){ G.clearT = -2; showClear(); }
  }
  if (G.shake > 0) G.shake -= dt;
  for (const p of parts){ p.life -= dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .985; }

  for (const t of torches){ const tx = t.x*CS+16, ty = t.y*CS+12; const tg = ctx.createRadialGradient(tx,ty,0,tx,ty,56); tg.addColorStop(0,'rgba(255,140,60,.14)'); tg.addColorStop(1,'rgba(255,140,60,0)'); ctx.fillStyle = tg; ctx.fillRect(tx-56,ty-56,112,112); }
  ctx.restore();
}
function render(){
  ctx.setTransform(viewScale,0,0,viewScale,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if (G.shake > 0 && !RM){ const m = G.shake/.4*4; ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m); }
  ctx.drawImage(sky.c, 0, 0, W, TOP);
  if (terrDirty) drawTerr();
  ctx.drawImage(terr.c, 0, TOP, W, H-TOP);
  for (const t of torches) drawTorch(t);
  drawDoor();
  for (const k of keys) drawKey(k);
  for (const o of oils) drawOil(o);
  for (const d of darts) drawDart(d);
  for (const t of traps) drawTrap(t);
  for (const o of obel) drawObel(o);
  for (const e of enemies) drawEnemy(e);
  for (const e of enemies) if (e.type === 's') drawFire(e);
  drawBoss();
  for (const s of shots) drawShot(s);
  drawBeam();
  drawPlayer();
  for (const p of parts){ ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s); }
  ctx.globalAlpha = 1;
  drawLight();
  drawWater();
  drawBreath();
  ctx.font = '600 12px "Chakra Petch", ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of pops){
    ctx.globalAlpha = Math.min(1, p.t*1.5);
    ctx.strokeStyle = 'rgba(20,10,4,.9)'; ctx.lineWidth = 3; ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (boss && !boss.dead){
    const bw = 260, bx = (W-bw)/2, by = 8;
    ctx.fillStyle = 'rgba(8,5,14,.75)'; ctx.fillRect(bx-2, by-2, bw+4, 10);
    ctx.fillStyle = '#9fe8ff'; ctx.fillRect(bx, by, bw*boss.hp/boss.max, 6);
    ctx.font = '600 10px "Chakra Petch", ui-monospace, monospace'; ctx.fillStyle = '#f2e6c9'; ctx.fillText('PHANTASMIC PHARAOH', W/2, by+20);
  }
  ctx.restore();
}

/* ---------- HUD & overlays ---------- */
const hud = {score:$('hScore'), hi:$('hHi'), lives:$('hLives'), depth:$('hDepth'), lvl:$('hLvl'), goal:$('hGoal'), relics:$('hRelics')};
const hc = {};
function setH(k,v){ if (hc[k] !== v){ hc[k] = v; hud[k].textContent = v; } }
function updHUD(){
  setH('score', G.score.toLocaleString()); setH('hi', G.hi.toLocaleString());
  setH('lives', G.lives > 0 ? '𓋹'.repeat(Math.min(G.lives, 6)) : '—');
  setH('depth', Math.max(0, (Math.round(P.y)-1)*2) + ' m');
  setH('lvl', `Level ${G.lvl+1}${G.loop ? ' · Cycle ' + (G.loop+1) : ''} · ${L().name}`);
  const lv = L(), c = COL();
  let goal = `${c.icon === 'jar' ? 'Jars' : 'Keys'} ${G.keys}/${c.n}`;
  if (lv.needCrush) goal += ` · Crushes ${Math.min(G.crushes, lv.needCrush)}/${lv.needCrush}`;
  if (doorOpen()) goal = lv.sarc ? 'Sarcophagus unsealed · claim it' : 'Chamber unsealed · get to the door';
  if (lv.timer){ const s = Math.ceil(G.timer); goal = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · ` + goal; }
  if (lv.night) goal = `Lamp ${Math.round(G.oil*100)}% · ` + goal;
  if (lv.flood) goal = ({dry:'River low', rise:'Nile rising', hold:'Nile in flood', fall:'Nile falling'})[G.floodPhase] + ' · ' + goal;
  setH('goal', goal);
  setH('relics', `Relic ×${G.relics}`);
}
const ov = $('ov'); let ovAction = null;
function showOv(html, label, fn){
  ov.innerHTML = `<div class="ov-card">${html}${label ? `<button class="go" id="ovBtn" type="button">${label}</button>` : ''}</div>`;
  ov.hidden = false; ovAction = fn;
  const b = $('ovBtn');
  if (b){
    /* start the game first; sound is best-effort and must never block the button */
    let fired = false;
    const go = ev => { if (ev) ev.stopPropagation(); if (fired || ovAction !== fn) return; fired = true; runSafe(fn); safeAudio(); };
    b.addEventListener('click', go);
    b.addEventListener('pointerup', ev => { if (ev.pointerType !== 'mouse') go(ev); });
    try { b.focus({preventScroll:true}); } catch(e){}
  }
}
function hideOv(){ ov.hidden = true; ovAction = null; }
function safeAudio(){ try { ensureAudio(); } catch(e){ AU.failed = true; } }
function showError(msg){
  try {
    ov.hidden = false; ovAction = null;
    ov.innerHTML = `<div class="ov-card"><p class="eyebrow">Something went wrong</p><h3>The game hit an error</h3>
      <p class="lede">Send Claude this line and it can fix it:</p><p class="lede dim" style="user-select:text;-webkit-user-select:text;word-break:break-word">${String(msg).replace(/</g,'&lt;').slice(0,300)}</p></div>`;
  } catch(e){}
}
function runSafe(f){ try { f(); } catch(e){ showError((e && e.message) + ' @ ' + ((e && e.stack || '').split('\n')[1] || '').trim()); } }
window.addEventListener('error', e => { if (G.state !== 'title') showError(e.message + ' (line ' + e.lineno + ')'); });
function showTitle(){
  G.state = 'title';
  showOv(`<p class="eyebrow">Giza Plateau · 1 Player</p>
    <h2>Pharaoh's Descent</h2>
    <p class="lede opt">Dig beneath the Sphinx toward Tutankhamun's hidden chamber. Pop the dead with the Staff of Ra, or knock the ground out from under an obelisk and let it do the work.</p>
    <dl class="keys kb">
      <dt>Dig</dt><dd>Arrows / WASD · two-finger touchpad swipe</dd>
      <dt>Staff of Ra</dt><dd>Space · hold to keep pumping</dd>
      <dt>Scarab trap</dt><dd>Shift</dd>
      <dt>Obelisks</dt><dd>Dig beneath one, step aside. Crush several at once for a combo.</dd>
    </dl>
    <dl class="keys touch">
      <dt>Dig</dt><dd>Swipe the gold pad or the screen · tap pad to stop</dd>
      <dt>Staff of Ra</dt><dd>Hold the red button</dd>
      <dt>Scarab trap</dt><dd>Blue button</dd>
      <dt>Tip</dt><dd>On a phone, turn it sideways for the big screen</dd>
    </dl>`, 'Begin excavation', newGame);
}
function newGame(){
  ensureAudio();
  Object.assign(G, {score:0, lives:3, lvl:0, loop:0, extra:false});
  startLevel();
}
function startLevel(){
  buildLevel(); G.state = 'card';
  const lv = L();
  showOv(`<p class="eyebrow">Level ${G.lvl+1}${G.loop ? ' · Cycle ' + (G.loop+1) + ' · faster' : ''}</p>
    <h3>${lv.name}</h3>
    <p class="lede dim">${lv.sub}</p>
    <p class="lede">${lv.goal}</p>`, 'Start digging', () => { hideOv(); G.state = 'play'; distT = 0; });
}
function showClear(){
  const last = G.lvl === LEVELS.length-1;
  showOv(`<p class="eyebrow">${L().sarc ? 'Sarcophagus secured' : 'Chamber unsealed'}</p>
    <h3>${L().name} cleared</h3>
    <p class="big">+${G.lastBonus.toLocaleString()}</p>
    <p class="lede dim">Includes 250 per unused relic${G.timeBonus ? ` and ${G.timeBonus.toLocaleString()} for time left on the curse clock` : ''}.</p>`,
    last ? 'Continue' : 'Descend to level ' + (G.lvl+2),
    () => { if (last) showVictory(); else { G.lvl++; startLevel(); } });
}
function showVictory(){
  G.state = 'victory';
  showOv(`<p class="eyebrow">Excavation complete${G.loop ? ' · Cycle ' + (G.loop+1) : ''}</p>
    <h3>The boy king's gold is yours</h3>
    <p class="lede">You reached the sarcophagus beneath Giza and lived. The sands are already shifting back over your tunnels, and the dead remember you. The next descent is faster.</p>
    <p class="big">${G.score.toLocaleString()}</p>`, 'Descend again, faster', () => { G.lvl = 0; G.loop++; startLevel(); });
}
function gameOver(){
  G.state = 'over'; saveHi();
  showOv(`<p class="eyebrow">The curse holds</p>
    <h3>Excavation lost</h3>
    <p class="big">${G.score.toLocaleString()}</p>
    <p class="lede dim">High score ${G.hi.toLocaleString()} · reached ${L().name}</p>`, 'Dig again', newGame);
}
function pause(){
  if (G.state !== 'play') return;
  G.state = 'pause'; staffHeld = false;
  showOv(`<p class="eyebrow">Paused</p><h3>${L().name}</h3><p class="lede dim">P or Esc to resume.</p>`, 'Resume', resume);
}
function resume(){ hideOv(); G.state = 'play'; last = performance.now(); }

/* ---------- input ---------- */
const KD = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], KeyW:[0,-1], KeyS:[0,1], KeyA:[-1,0], KeyD:[1,0]};
let kstack = [];
window.addEventListener('keydown', e => {
  const c = e.code;
  if (KD[c] || c === 'Space') e.preventDefault();
  safeAudio();
  if (!ov.hidden && (c === 'Enter' || c === 'Space') && ovAction && !e.repeat){ if (G.state === 'pause' && c === 'Space') return; e.preventDefault(); runSafe(ovAction); return; }
  if (c === 'KeyP' || c === 'Escape'){ if (G.state === 'play') pause(); else if (G.state === 'pause') resume(); return; }
  if (c === 'KeyM'){ toggleMute(); return; }
  if (KD[c]){ inputMode = 'key'; kstack = kstack.filter(k => k !== c); kstack.push(c); return; }
  if (c === 'Space' && !e.repeat){ staffHeld = true; staffRep = .3; fireStaff(); return; }
  if ((c === 'ShiftLeft' || c === 'ShiftRight') && !e.repeat){ useRelic(); }
});
window.addEventListener('keyup', e => {
  if (KD[e.code]) kstack = kstack.filter(k => k !== e.code);
  if (e.code === 'Space') staffHeld = false;
});
window.addEventListener('blur', () => { kstack = []; staffHeld = false; if (G.state === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pause(); });

function setWant(d){ inputMode = 'touch'; P.want = d; staffHeld = false; }
/* Swipe surfaces: the game screen (taps fire staff / drop relic) and the thumb pad (taps stop digging) */
function bindSwipe(el, onScreen){
  const ptr = {id:null, sx:0, sy:0, t:0, sw:false, hold:0, side:'R'};
  const thresh = onScreen ? 16 : 12;
  el.addEventListener('pointerdown', e => {
    ensureAudio();
    if (G.state !== 'play') return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    const r = el.getBoundingClientRect();
    Object.assign(ptr, {id:e.pointerId, sx:e.clientX, sy:e.clientY, t:performance.now(), sw:false, side:(e.clientX-r.left) > r.width/2 ? 'R' : 'L'});
    el.classList.add('active');
    clearTimeout(ptr.hold);
    if (onScreen && ptr.side === 'R') ptr.hold = setTimeout(() => { if (!ptr.sw && ptr.id !== null){ staffHeld = true; staffRep = .3; fireStaff(); } }, 230);
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== ptr.id || G.state !== 'play') return;
    const dx = e.clientX-ptr.sx, dy = e.clientY-ptr.sy;
    if (Math.hypot(dx,dy) > thresh){
      ptr.sw = true; clearTimeout(ptr.hold); staffHeld = false;
      setWant(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)]);
      ptr.sx = e.clientX; ptr.sy = e.clientY;
    }
  });
  const end = e => {
    if (e.pointerId !== ptr.id) return;
    clearTimeout(ptr.hold); el.classList.remove('active');
    const quick = performance.now()-ptr.t < 400;
    if (!ptr.sw && quick && G.state === 'play'){
      if (onScreen){ if (!staffHeld){ if (ptr.side === 'R') fireStaff(); else useRelic(); } }
      else { inputMode = 'touch'; P.want = null; P.dir = null; }
    }
    if (onScreen) staffHeld = false;
    ptr.id = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
bindSwipe(cv, true);
bindSwipe($('pad'), false);
/* iOS: keep the page from scrolling or bouncing under a thumb mid-game, and unlock sound on the first tap anywhere */
document.addEventListener('touchmove', e => {
  if (G.state === 'play' && e.target.closest && e.target.closest('.screen,.pad,.arc')) e.preventDefault();
}, {passive:false});
['touchend','click'].forEach(t => document.addEventListener(t, () => ensureAudio(), {passive:true}));
let wAcc = {x:0, y:0}, wCool = 0;
screenEl.addEventListener('wheel', e => {
  if (G.state !== 'play') return;
  e.preventDefault();
  wAcc.x += e.deltaX; wAcc.y += e.deltaY;
  const t = performance.now(); if (t < wCool) return;
  if (Math.max(Math.abs(wAcc.x), Math.abs(wAcc.y)) > 36){
    const s = G.invert ? 1 : -1;
    setWant(Math.abs(wAcc.x) > Math.abs(wAcc.y) ? [s*Math.sign(wAcc.x),0] : [0,s*Math.sign(wAcc.y)]);
    wAcc = {x:0, y:0}; wCool = t + 140;
  }
}, {passive:false});
const bStaff = $('bStaff'), bRelic = $('bRelic'), bMute = $('bMute');
bStaff.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); staffHeld = true; staffRep = .3; fireStaff(); });
['pointerup','pointercancel','pointerleave'].forEach(t => bStaff.addEventListener(t, () => { staffHeld = false; }));
bStaff.addEventListener('keydown', e => { if (e.code === 'Enter') fireStaff(); });
bRelic.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); useRelic(); });
function toggleMute(){
  G.muted = !G.muted; try { localStorage.setItem('pd-mute', G.muted ? '1' : '0'); } catch(e){}
  if (AU.ac) AU.master.gain.setTargetAtTime(G.muted ? 0 : .85, AU.ac.currentTime, .02);
  bMute.textContent = G.muted ? 'Sound off' : 'Sound on';
}
bMute.addEventListener('click', () => { ensureAudio(); toggleMute(); });
bMute.textContent = G.muted ? 'Sound off' : 'Sound on';

/* ---------- loop ---------- */
let last = performance.now();
function frame(t){
  const dt = Math.min(.05, (t-last)/1000); last = t; T += dt;
  if (G.state !== 'pause') update(dt);
  render(); updHUD(); musicTick();
  requestAnimationFrame(frame);
}
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load('18px "Noto Sans Egyptian Hieroglyphs"','𓂀𓋹𓇳'), document.fonts.load('600 12px "Chakra Petch"')]),
  new Promise(r => setTimeout(r, 1500))
]).catch(() => {}) : Promise.resolve();
buildSky(); buildLevel(); showTitle(); requestAnimationFrame(frame);
fontsReady.then(() => { buildTerrainBase(); terrDirty = true; });
})();
</script>
