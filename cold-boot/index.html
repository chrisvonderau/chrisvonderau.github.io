<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cold Boot">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>Cold Boot</title>
<style>
:root{
  --bg:#020803;--g:#33ff66;--dim:#1a9e44;--faint:#0d4a22;--bright:#b8ffcc;--amber:#ffb000;--red:#ff4d4d;
  --ink:#021a08;
  --font:"VT323","IBM Plex Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace;
  --glow:0 0 2px rgba(51,255,102,.85),0 0 9px rgba(51,255,102,.35);
  --glowA:0 0 2px rgba(255,176,0,.85),0 0 9px rgba(255,176,0,.35);
  --glowR:0 0 2px rgba(255,77,77,.9),0 0 10px rgba(255,77,77,.4);
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --pad:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
html{font-size:clamp(13px,calc(5.5px + 1.25vmin),19px)}
body{font-family:var(--font);color:var(--g);text-shadow:var(--glow);line-height:1.25;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;letter-spacing:.02em}
#map{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;background:var(--bg);transition:opacity .6s}
body.mapdim #map{opacity:.32}
body.mapoff #map{opacity:0}
#ui{position:fixed;inset:0;z-index:2}
#crt{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.2) 3px,rgba(0,0,0,.2) 3px),
  radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)}
#crt:after{content:"";position:absolute;inset:0;background:rgba(51,255,102,.018);animation:flk 7s infinite steps(1)}
@keyframes flk{0%,100%{opacity:1}47%{opacity:.4}48%{opacity:1}83%{opacity:.7}84%{opacity:1}}
button{font:inherit;color:inherit;letter-spacing:inherit}
b{font-weight:normal;color:var(--bright)}
.hidden{display:none!important}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--sat) + var(--pad)) calc(var(--sar) + var(--pad) + 4px) calc(var(--sab) + var(--pad)) calc(var(--sal) + var(--pad) + 4px);
  background:transparent;overflow:hidden}
.scr.solid{background:var(--bg)}
.hdr{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:1em;color:var(--dim);
  border-bottom:1px solid var(--faint);padding:0 0 .35em;margin-bottom:.6em;font-size:.86rem;white-space:nowrap;overflow:hidden}
.hdr .l{overflow:hidden;text-overflow:ellipsis}
.foot{flex:none;display:flex;justify-content:space-between;gap:1em;color:var(--dim);font-size:.8rem;
  border-top:1px solid var(--faint);padding-top:.35em;margin-top:.5em;white-space:nowrap;overflow:hidden}
.touch .foot .keys{display:none}
.touch .foot{justify-content:flex-end}
.side .exit.inhead{position:static;min-height:32px;margin-left:auto}
.vc{justify-content:flex-start}
.vc>:first-child{margin-top:auto}.vc>:last-child{margin-bottom:auto}
.short .mlist{gap:.3em}.short .mlist .row,.short .mlist .mi{min-height:38px;padding-top:.15em;padding-bottom:.15em}
.short .infoline{font-size:.8rem;margin:.3em 0 0}
.vc>.mlist,.vc>.ngrid{flex:0 1 auto}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col{width:100%;max-width:50rem;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--faint) transparent;touch-action:pan-y}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--faint)}
h1,h2,h3{margin:0;font-weight:normal}
.title{font-size:1.6rem;color:var(--bright);letter-spacing:.12em;margin:.1em 0 .3em}
.sub{color:var(--dim);font-size:.9rem}
.amber{color:var(--amber);text-shadow:var(--glowA)}
.red{color:var(--red);text-shadow:var(--glowR)}
.dim{color:var(--dim)}
.bright{color:var(--bright)}
.cur{display:inline-block;width:.6em;height:1em;background:var(--g);vertical-align:-.12em;margin-left:.1em;box-shadow:0 0 8px var(--g);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}

/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:40px;padding:.25em .9em;
  border:1px solid var(--dim);background:rgba(8,40,16,.45);color:var(--g);cursor:pointer;text-transform:uppercase;
  text-shadow:var(--glow);border-radius:0;outline:none;touch-action:manipulation;position:relative;text-align:center;
  transition:background .08s,color .08s}
.touch .b{min-height:44px}
.b:hover{background:rgba(51,255,102,.16);border-color:var(--g)}
.navmode .b.nf,.b.nf.always{background:var(--g);color:var(--ink);text-shadow:none;border-color:var(--g);box-shadow:0 0 14px rgba(51,255,102,.6)}
.navmode .b.nf .dim,.navmode .b.nf .amber,.navmode .b.nf .bright,.navmode .b.nf b{color:var(--ink);text-shadow:none}
.b:active{background:var(--g);color:var(--ink);text-shadow:none}
.b.off{color:var(--faint);border-color:var(--faint);background:rgba(0,0,0,.35);text-shadow:none;cursor:not-allowed}
.b.off .dim,.b.off b{color:var(--faint)}
.navmode .b.off.nf{background:var(--faint);color:var(--dim)}
.b.warn{border-color:var(--amber);color:var(--amber);text-shadow:var(--glowA)}
.b.danger{border-color:var(--red);color:var(--red);text-shadow:var(--glowR);background:rgba(60,0,0,.4)}
.b.danger:hover,.navmode .b.danger.nf{background:var(--red);color:#200;border-color:var(--red);box-shadow:0 0 16px rgba(255,77,77,.6)}
.b.wide{width:100%}
.b.left{justify-content:flex-start;text-align:left}
.gl{display:inline-block;min-width:1.7em;padding:0 .25em;border:1px solid currentColor;font-size:.75em;line-height:1.35;text-align:center;opacity:.85}
.notouch-hide{}
.touch .padonly{display:none}
.btnrow{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;flex:none;padding-top:.5em}
.btnrow .b{min-width:9em}

/* menu list */
.mlist{display:flex;flex-direction:column;gap:.5em;padding:.2em}
.mi,.row,.nc{background:rgba(3,14,6,.86)}
.mi{display:grid;grid-template-columns:2.4em 1fr auto;align-items:center;text-align:left;width:100%;padding:.45em .8em;column-gap:.6em}
.mi .n{color:var(--dim)}
.mi .lb{color:var(--bright);font-size:1.08rem;letter-spacing:.08em}
.mi .sb{display:block;color:var(--dim);font-size:.82rem;margin-top:.1em}
.mi .rt{color:var(--dim);font-size:.85rem;text-align:right}
.navmode .mi.nf .lb,.navmode .mi.nf .sb,.navmode .mi.nf .n,.navmode .mi.nf .rt{color:var(--ink);text-shadow:none}
.mi.lock .lb{color:var(--faint)}

/* cycler rows */
.row{display:grid;grid-template-columns:minmax(7em,38%) 1fr;align-items:center;width:100%;text-align:left;padding:.35em .8em}
.row .k{color:var(--dim)}
.row .v{display:flex;justify-content:space-between;align-items:center;gap:.5em;color:var(--bright)}
.row .v i{font-style:normal;color:var(--dim)}
.navmode .row.nf .k,.navmode .row.nf .v,.navmode .row.nf .v i{color:var(--ink);text-shadow:none}

/* teletype */
.tty{flex:1;min-height:0;overflow-y:auto;padding:.2em .2em .6em;scrollbar-width:none}
.tty::-webkit-scrollbar{display:none}
.tl{margin:0 0 .55em;white-space:pre-wrap;word-wrap:break-word;max-width:44em}
.tl.w-narr{color:#9fdcb0;text-shadow:0 0 6px rgba(51,255,102,.18);font-style:normal;letter-spacing:0}
.tl.w-screen{color:var(--bright)}
.tl.w-argus{color:var(--g)}
.tl.w-argus:before{content:"ARGUS> ";color:var(--dim)}
.tl.w-you{color:var(--amber);text-shadow:var(--glowA)}
.tl.w-you:before{content:"YOU> ";opacity:.7}
.tl.w-mom{color:#d8c8a0}
.tl.w-mom:before{content:"MOM (FROM DOWNSTAIRS): ";opacity:.7}
.tl .tc{display:inline-block;width:.55em;height:.95em;background:var(--g);vertical-align:-.1em;animation:blink .7s steps(1) infinite}

/* boot */
.boot .bios{color:var(--dim);font-size:.9rem;white-space:pre;min-height:8em}
.boot .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;text-align:center}
.logo{font-size:clamp(2.6rem,11vmin,6.5rem);letter-spacing:.14em;color:var(--bright);line-height:1;
  text-shadow:0 0 4px rgba(184,255,204,.9),0 0 18px rgba(51,255,102,.6),0 0 46px rgba(51,255,102,.25);margin-left:.14em}
.logo-sub{color:var(--dim);letter-spacing:.3em;font-size:.9rem}
.press{font-size:1.15rem;color:var(--g);margin-top:1.2em}
.boot .ver{position:absolute;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 8px);font-size:.72rem;color:var(--faint);text-shadow:none}

/* intro */
.intro .stage{flex:1;min-height:0;display:flex;gap:1.4em;align-items:stretch}
.intro .room{flex:0 0 42%;display:flex;align-items:center;justify-content:center;min-width:0}
.intro .room svg{width:100%;height:100%;max-height:72vh}
.intro .tty{flex:1}
.port .intro .stage{flex-direction:column;gap:.4em}
.port .intro .room{flex:0 0 30%;min-height:0}
.short .intro .room{flex-basis:36%}

/* handle */
.hand .disp{display:flex;align-items:center;justify-content:center;gap:.4em;margin:.3em 0 .6em;flex:none}
.hand input{font:inherit;font-size:2rem;letter-spacing:.3em;text-transform:uppercase;background:rgba(0,30,10,.6);color:var(--bright);
  text-shadow:var(--glow);border:1px solid var(--dim);padding:.15em .4em;width:min(100%,12.5em);text-align:center;outline:none;
  caret-color:var(--g);border-radius:0;-webkit-appearance:none;-webkit-user-select:text;user-select:text}
.hand input:focus{border-color:var(--g);box-shadow:0 0 12px rgba(51,255,102,.35)}
.hand input::placeholder{color:var(--faint);text-shadow:none}
.keys10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%;max-width:40rem;margin:0 auto;flex:none}
.port .keys10{grid-template-columns:repeat(8,minmax(0,1fr))}
.kp{display:none}.src-pad .kp{display:inline}.src-pad .kk{display:none}
.keys10 .b{min-height:38px;padding:0;font-size:1.05rem}
.touch .keys10 .b{min-height:42px}
.short .keys10 .b{min-height:36px}
.keys10 .b.wide2{grid-column:span 2}
.keys10 .b.wide3{grid-column:span 3}

/* chapter list */
.chap .mi{grid-template-columns:2.4em 1fr auto}
.chap .grade{font-size:1.3rem;color:var(--bright);min-width:1.6em;text-align:center}
.kind{font-size:.75rem;border:1px solid currentColor;padding:0 .3em;margin-left:.5em;vertical-align:.1em}
.kind.LIVE{color:var(--red);text-shadow:var(--glowR)}
.kind.PROJECTION{color:var(--amber);text-shadow:var(--glowA)}

/* nation pick */
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55em;padding:.2em}
.port .ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.nc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:.5em .7em;min-height:5.2em;justify-content:flex-start;gap:.15em}
.nc .code{font-size:1.25rem;color:var(--bright);letter-spacing:.1em}
.nc .bloc{font-size:.7rem;color:var(--dim);margin-left:.5em}
.nc .nm{font-size:.78rem;color:var(--dim)}
.nc .pk{font-size:.75rem;color:var(--g);line-height:1.2}
.navmode .nc.nf .code,.navmode .nc.nf .nm,.navmode .nc.nf .pk,.navmode .nc.nf .bloc{color:var(--ink);text-shadow:none}
.short .nc{min-height:4.4em;padding:.3em .55em}
.infoline{color:var(--dim);text-align:center;margin:.5em 0 .2em;font-size:.9rem;flex:none}

/* briefing */
.brief .meta{display:flex;flex-wrap:wrap;gap:.3em 1.2em;color:var(--dim);font-size:.85rem;flex:none}
.goalbox{flex:none;border:1px solid var(--amber);color:var(--amber);text-shadow:var(--glowA);padding:.35em .7em;margin:.3em 0;font-size:.95rem}
.orders{flex:none;color:var(--dim);font-size:.85rem}

/* result */
.res .top{display:flex;gap:1.2em;align-items:stretch;flex:none}
.gradebox{flex:none;border:2px solid var(--g);width:6.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3em}
.gradebox .gl2{font-size:3.6rem;line-height:1;color:var(--bright)}
.gradebox .gt{font-size:.75rem;color:var(--dim)}
.gradebox.F{border-color:var(--red)}.gradebox.F .gl2{color:var(--red);text-shadow:var(--glowR)}
.verdict{font-size:1.45rem;letter-spacing:.08em;color:var(--bright)}
.rlines{color:var(--g);font-size:.9rem;margin-top:.3em}
.rlines div{margin:.1em 0}
.stats{border-collapse:collapse;font-size:.85rem;margin:.6em 0;flex:none}
.stats td,.stats th{padding:.12em .8em .12em 0;text-align:left;font-weight:normal}
.stats th{color:var(--dim)}
.res .tty{min-height:3em}
.short .res .gradebox .gl2{font-size:2.6rem}
.short .res .stats{display:none}

/* side */
.sidebox{position:absolute;left:calc(var(--sal));right:calc(var(--sar));top:calc(var(--sat));bottom:calc(var(--sab));overflow:hidden}
.side .exit{position:absolute;right:calc(var(--sar) + 8px);top:calc(var(--sat) + 8px);z-index:5;min-height:36px;font-size:.8rem;padding:0 .7em}

/* finale */
.fin .stage{flex:1;min-height:0;display:flex;gap:1em}
.fin .talk{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.fin .lessons{flex:0 0 15em;border:1px solid var(--faint);padding:.5em .7em;font-size:.85rem;align-self:flex-start}
.fin .lessons .le{margin:.4em 0}
.fin .lessons .le.no{color:var(--faint);text-shadow:none}
.port .fin .stage{flex-direction:column}
.port .fin .lessons,.short .fin .lessons{flex:none;align-self:stretch;display:flex;gap:.8em;flex-wrap:wrap;padding:.3em .6em;font-size:.75rem}
.port .fin .lessons .le,.short .fin .lessons .le{margin:0}
.short .fin .stage{flex-direction:column}
.opts{display:flex;flex-direction:column;gap:.45em;flex:none;padding-top:.4em}
.opts .b{justify-content:flex-start;text-align:left;text-transform:none;font-size:.95rem;padding:.4em .8em;letter-spacing:0}
.opts .tag{font-size:.7rem;margin-left:auto;padding-left:.8em;white-space:nowrap;color:var(--dim)}
.opts .tag.ok{color:var(--g)}

/* credits */
.cred .roll{flex:1;min-height:0;overflow:hidden;position:relative;text-align:center}
.cred .rollin{position:absolute;left:0;right:0;top:100%;animation:roll 26s linear forwards}
.cred .rollin div{margin:1.4em 0;font-size:1.1rem}
.cred .rollin .big{font-size:2.6rem;color:var(--bright);letter-spacing:.14em}
@keyframes roll{to{transform:translateY(-100%) translateY(-60vh)}}

/* controls help */
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1em;font-size:.86rem}
.port .ctl{grid-template-columns:1fr}
.ctl h3{color:var(--bright);font-size:.95rem;margin:0 0 .3em;letter-spacing:.1em}
.ctl .kv{display:flex;gap:.6em;margin:.12em 0}
.ctl .kv .kk{flex:0 0 9.5em;color:var(--amber);text-shadow:var(--glowA)}
.ctl .kv .vv{color:var(--g)}

/* overlays */
.ovl{position:absolute;inset:0;z-index:20;background:rgba(1,6,2,.86);display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px)}
.ovl .box{border:1px solid var(--g);background:var(--bg);padding:1em 1.2em;width:min(100%,32em);max-height:100%;display:flex;flex-direction:column;gap:.6em;box-shadow:0 0 30px rgba(51,255,102,.15)}
.ovl .box.wide{width:min(100%,52em)}
.ovl .box.red{border-color:var(--red)}
.ovl .box .b{width:100%}
.ovl h2{color:var(--bright);letter-spacing:.14em;font-size:1.3rem}
.holdbar{height:10px;border:1px solid var(--red);position:relative}
.holdbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);box-shadow:0 0 10px var(--red)}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 30%);transform:translateX(-50%);z-index:30;border:1px solid var(--amber);background:var(--bg);color:var(--amber);
  text-shadow:var(--glowA);padding:.4em 1em;pointer-events:none;animation:tfade 1.6s forwards;white-space:nowrap}
@keyframes tfade{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- game HUD ---------- */
.hud{display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;pointer-events:none;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px);
  --pw:clamp(280px,30vw,410px)}
.hud>*{pointer-events:auto}
.hud .tb,.hud .log{background:rgba(2,8,3,.9)}
.mapcol{grid-area:map;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;pointer-events:none}
.mapcol>*{pointer-events:auto}
.sb .ln2{display:flex;gap:.65em}
.hud.two{--pw:clamp(236px,25vw,350px)}
.tb{display:flex;align-items:stretch;gap:0;border:1px solid var(--faint);font-size:.85rem;min-height:0}
.tbc{padding:.25em .65em;border-left:1px solid var(--faint);display:flex;flex-direction:column;justify-content:center;min-width:0;white-space:nowrap}
.tbc:first-child{border-left:0}
.tbc .lbl{color:var(--dim);font-size:.78rem}
.clock .big{font-size:1.35rem;color:var(--bright);line-height:1.05}
.clock .big.low{color:var(--amber);text-shadow:var(--glowA)}
.ten{flex:1;min-width:11em}
.ten .lbl{display:flex;justify-content:space-between;gap:1em}
.ten .lbl b{font-size:1.05rem}
.gauge{position:relative;height:16px;border:1px solid var(--dim);margin-top:3px;
  background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),rgba(26,158,68,.5) calc(10% - 1px),rgba(26,158,68,.5) 10%)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--g);box-shadow:0 0 10px var(--g);transition:width .35s,background .3s}
.gauge .fill.amb{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.gauge .fill.red{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1s steps(1) infinite}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.gauge .peak{position:absolute;top:0;bottom:0;width:1px;background:var(--bright);opacity:.6}
.ten.hot .lbl b{color:var(--red);text-shadow:var(--glowR)}
.goalt{color:var(--amber);text-shadow:var(--glowA)}
.sb .nm{color:var(--bright)}
.sb .tag{font-size:.7rem;color:var(--dim);margin-left:.35em}
.sb .ln{display:flex;gap:.7em}
.sb .dcn{display:inline-block;min-width:1.2em;text-align:center;border:1px solid currentColor;line-height:1.1}
.sb .dcn.d2,.sb .dcn.d3{color:var(--amber);text-shadow:var(--glowA)}
.sb .dcn.d1{color:var(--red);text-shadow:var(--glowR);animation:blink 1s steps(1) infinite}
.sb.p1 .nm{color:var(--amber);text-shadow:var(--glowA)}
.argusb .mood{color:var(--bright)}
.argusb .mood.WARY{color:var(--amber);text-shadow:var(--glowA)}
.argusb .mood.HOSTILE{color:var(--red);text-shadow:var(--glowR)}
.mini{height:5px;border:1px solid var(--faint);margin-top:2px;position:relative;width:5.5em}
.mini i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--dim)}
.tbtn{flex-direction:row;align-items:center;gap:4px;padding:3px 5px}
.tbtn .b{min-height:34px;min-width:2.8em;padding:0 .4em;font-size:.78rem}
.touch .tbtn .b{min-height:40px}
.tbtn .b.muted{color:var(--faint);border-color:var(--faint);text-decoration:line-through}

.hud .mid{display:grid;grid-template-columns:minmax(0,1fr) var(--pw);grid-template-areas:"map p0";gap:6px;min-height:0;pointer-events:none}

window.CB = window.CB || {};
(function () {

    var bursts = [], blips = [], ex = null, memo = {}, measureCache = {};
    var lastCrises = [], lastRegions = [], capBoxes = [], regLabels = [], crisisBoxes = [];

    var W = CB.World || { coast: [], borders: [], cities: [] };
    var cityIdx = {};
    (W.cities || []).forEach(function (c) { cityIdx[c.name] = c; });

    // ---------- geometry ----------
    function computeFit() {

    // font sizes derived from rect width

    function colorOf(i, view) {

      var side = view && view.sideOf != null ? view.sideOf : 0;

    }

    function capitalsFor(state, view) {

      var NAT = CFG.NATIONS || {};
      state.players.forEach(function (p, i) {
        var n = NAT[p && p.nation];
        if (!n || !n.capital) return;

      });
      return out;
    }

    // ---------- cached layers ----------
    function buildOverlay() {
      overlayCv = makeCanvas(rect.w * dpr, rect.h * dpr);
      var g = overlayCv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = 'rgba(0,0,0,0.22)';

      g.lineJoin = 'round'; g.lineCap = 'round';
      g.save();

      g.fillStyle = rgba(C.green, 0.018); g.fillRect(fit.x, fit.y, fit.w, fit.h);

      g.setLineDash([4, 4]); g.strokeStyle = rgba(C.green, 0.22);

    // ---------- dynamic pieces ----------
    function sweepAngle() { return (time * TWO_PI / (attractOn ? 10 : 7)) % TWO_PI; }

    }

    function drawSway(state, view) {

      lastRegions = [];

    }

    function drawCapitalMarkers(caps) {

        ctx.fillStyle = rgba(C.bright, 0.9); ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
        ctx.strokeStyle = rgba(c.rgb, 0.25 + 0.2 * pulse); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 7 + pulse * 2, 0, TWO_PI); ctx.stroke();
      }
    }

    function glyphPath(sev, x, y, s) {
      ctx.beginPath();
      if (sev <= 1) {
        ctx.moveTo(x, y - s * 1.15); ctx.lineTo(x + s * 0.9, y); ctx.lineTo(x, y + s * 1.15); ctx.lineTo(x - s * 0.9, y); ctx.closePath();

        ctx.moveTo(x, y - s * 1.15); ctx.lineTo(x + s, y + s * 0.72); ctx.lineTo(x - s, y + s * 0.72); ctx.closePath();

      }
    }
    function heatColor(h) {
      h = clamp(h || 0, 0, 100) / 100;
      if (h < 0.4) return mix(C.green, C.bright, h / 0.4 * 0.3);
      if (h < 0.72) return mix(C.green, C.amber, (h - 0.4) / 0.32);
      return mix(C.amber, C.red, (h - 0.72) / 0.28);
    }
    var TAG = { real: 'REAL', bluff: 'BLUFF', 'false': 'FALSE' };
    function tagColor(truth) { return truth === 'real' ? C.red : truth === 'bluff' ? C.amber : C.bright; }

    function drawTag(truth, x, y, edgeRgb, f, fs) {
      var txt = TAG[truth] || '?', tw = measure(ctx, txt, f), h = fs + 3;
      ctx.fillStyle = 'rgba(2,8,3,0.85)'; ctx.fillRect(x, y, tw + 6, h);
      ctx.strokeStyle = rgba(edgeRgb, 0.9); ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, tw + 5, h - 1);

    }

    function drawBrackets(x, y, b, rgb, L) {
      bracketPath(x, y, b, L);

      ctx.strokeStyle = 'rgba(2,8,3,0.9)'; ctx.lineWidth = 5; ctx.stroke();   // dark keyline so it reads over coastlines

    }
    function bracketPath(x, y, b, L) {

    try { if (CB.Input) CB.Input.init(); } catch (e) { report('input.init', e); }
    try { CB.UI.init(document.getElementById('ui'), document.getElementById('map')); } catch (e) { report('ui.init', e); }
    var last = (window.performance && performance.now()) || Date.now();
    function loop(now) {
      now = now || Date.now();
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      try { if (CB.Input) CB.Input.update(dt); } catch (e) { report('input', e); }
      try { CB.UI.frame(dt); } catch (e) { report('frame', e); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.CB_TEST = {
      ui: CB.UI, input: CB.Input, voice: CB.Voice, audio: CB.Audio, engine: CB.Engine, map: CB.Map, side: CB.Side,
      getSim: function () { return CB.UI.debug.getSim(); },
      screen: function () { return CB.UI.state.screen; },
      press: function (evt, player) { if (CB.Input && CB.Input.emit) CB.Input.emit(evt, { player: player | 0, source: 'key' }); }
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
