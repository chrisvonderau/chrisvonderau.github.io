<style>
:root{--bg1:#f6f7f9;--bg2:#d9dde3;--ink:#16181d;--ink2:#555b66;--ink3:#8a909a;--card:rgba(255,255,255,.72);--card2:rgba(255,255,255,.9);--line:rgba(20,24,32,.09);--acc:#2b6cff;--acc2:#e8efff;--good:#13a05a;--warn:#e0862b;--shadow:0 10px 40px rgba(30,40,60,.14),0 2px 8px rgba(30,40,60,.06);--r:18px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 32%,#ffffff 0%,var(--bg1) 38%,#e3e6eb 70%,var(--bg2) 100%)}
#stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(40,50,70,.06));pointer-events:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
.glass{background:var(--card);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:var(--r)}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));display:flex;align-items:flex-start;justify-content:space-between;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px}
.iconbtn:active{transform:scale(.94)}
#modeTitle{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:center;margin-bottom:2px}
#timerWrap{text-align:center;pointer-events:none!important}
#timer{font-size:54px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#timer.inspect{color:var(--warn)}
#timer.run{color:var(--ink)}
#timer.done{color:var(--good)}
#subline{margin-top:6px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;min-height:17px}
/* action bar */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));display:flex;gap:6px;padding:6px;z-index:5}
.act{min-width:64px;height:54px;padding:0 10px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink2);gap:3px}
.act b{font-size:19px;font-weight:500;color:var(--ink);line-height:1}
.act:hover{background:rgba(255,255,255,.7)}
.act:active{transform:scale(.95)}
.act.primary{background:var(--acc);color:#fff}
.act.primary b{color:#fff}
.act.on{background:var(--acc2);color:var(--acc)}
.act.on b{color:var(--acc)}
.act[disabled]{opacity:.35;pointer-events:none}
/* move pad */
#pad{position:fixed;right:calc(14px + var(--safe-r));bottom:calc(86px + var(--safe-b));z-index:5;padding:8px;display:grid;grid-template-columns:repeat(6,44px);gap:5px}
#pad button{height:40px;border-radius:10px;background:rgba(255,255,255,.75);font-weight:600;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#pad button:active{background:var(--acc2);transform:scale(.94)}
#pad button.rot{color:var(--ink2);font-weight:500}
/* coach */
#coach{position:fixed;z-index:5;right:calc(14px + var(--safe-r));top:calc(96px + var(--safe-t));width:330px;padding:18px 18px 14px}
#coach h3{margin:0 0 2px;font-size:17px}
#coach .stg{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
#coach p{margin:8px 0 10px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.prog{height:5px;border-radius:3px;background:rgba(0,0,0,.07);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2b6cff,#36c2ff);border-radius:3px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}
.chip{padding:5px 9px;border-radius:8px;background:rgba(0,0,0,.05);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip.now{background:var(--acc);color:#fff;box-shadow:0 2px 10px rgba(43,108,255,.35)}
.row{display:flex;gap:8px}
.btn{flex:1;height:42px;border-radius:12px;background:rgba(255,255,255,.85);font-weight:600;font-size:14px;white-space:nowrap;padding:0 14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.btn.primary{background:var(--acc);color:#fff}
.btn:active{transform:scale(.97)}
.muted{color:var(--ink3);font-size:12.5px}
/* screens */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) calc(16px + var(--safe-r)) calc(20px + var(--safe-b)) calc(16px + var(--safe-l));background:rgba(235,238,242,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;padding:26px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}
.panel .lead{margin:0 0 18px;color:var(--ink2)}
.close{float:right}
#home{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;justify-content:flex-start}
#home .hp{display:flex;flex-direction:column;justify-content:center;width:min(440px,100%);margin-left:max(3vw,0px)}
.brand{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.brand span{font-weight:300}
.tag{color:var(--ink2);margin:8px 0 22px;font-size:15px}
.menu{display:grid;gap:8px}
.mi{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;text-align:left;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);box-shadow:0 4px 18px rgba(30,40,60,.08)}
.mi:hover,.mi.focus,.card.focus,.btn.focus,.act.focus,.iconbtn.focus,.opt.focus{outline:3px solid var(--acc);outline-offset:2px}
.mi:active{transform:scale(.985)}
.mi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);flex:none}
.mi .tx b{display:block;font-size:16px}
.mi .tx small{color:var(--ink2);font-size:13px}
.mi .badge{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:20px;white-space:nowrap}
.minirow{display:flex;gap:8px;margin-top:10px}
.minirow .mi{flex:1;padding:10px 12px}
.minirow .mi .ic{width:32px;height:32px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{border-radius:16px;background:rgba(255,255,255,.8);padding:14px;text-align:left;border:1px solid var(--line);position:relative}
.card b{display:block;font-size:15px;margin-top:8px}
.card small{color:var(--ink2);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
.card.locked{opacity:.55}
.card.sel{border:2px solid var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.card .lvl{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;color:var(--ink3)}
.card .done{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;color:var(--good)}
.swatch{display:grid;grid-template-columns:repeat(3,14px);gap:3px;padding:6px;border-radius:8px;width:max-content}
.swatch i{width:14px;height:14px;border-radius:3px}
.net{display:grid;grid-template-columns:repeat(12,var(--s,11px));grid-template-rows:repeat(9,var(--s,11px));gap:1.5px}
.net i{border-radius:2px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:14px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid var(--line)}
.stat small{display:block;color:var(--ink2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--ink3);font-size:12px;font-weight:600;text-transform:uppercase}
.set{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.set label{font-weight:600}
input[type=range]{width:min(240px,45vw);accent-color:var(--acc)}
.opt{padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.05);font-weight:600}
.opt.sel{background:var(--acc);color:#fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.keys kbd{display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;background:#fff;border:1px solid var(--line);font:600 13px -apple-system,sans-serif;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
/* toasts & banners */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + var(--safe-t));z-index:30;display:grid;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;font-weight:600;display:flex;gap:10px;align-items:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
#banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;text-align:center;pointer-events:none}
#banner .big{font-size:72px;font-weight:200;letter-spacing:-.03em;text-shadow:0 2px 30px rgba(255,255,255,.9)}
#banner .sm{font-size:16px;font-weight:600;color:var(--ink2);margin-top:4px}
.result{padding:24px 26px;text-align:center;min-width:280px;pointer-events:auto}
.result h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);margin:0}
.result .time{font-size:60px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0}
.result .pb{display:inline-block;background:linear-gradient(90deg,#ffcf4a,#ffb02e);color:#3b2a00;padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px;margin-bottom:8px}
/* split labels */
.seatlab{position:fixed;z-index:5;padding:8px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.seatlab .t{font-weight:300;font-size:30px;font-variant-numeric:tabular-nums}
.seatlab.win{outline:3px solid var(--good)}
#target{position:fixed;z-index:5;left:calc(14px + var(--safe-l));top:calc(96px + var(--safe-t));padding:14px}
#target b{display:block;margin-bottom:8px;font-size:14px}
#hint2{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:4;font-size:13px;color:var(--ink3);pointer-events:none;text-align:center;white-space:nowrap}
@media (max-width:820px){
  .minirow{gap:6px}
  .minirow .mi{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:8px 2px;justify-content:center}
  .minirow .mi .tx b{font-size:12px}
  #hint2{white-space:normal;width:calc(100vw - 40px)}
  #coach{left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:auto;bottom:calc(82px + var(--safe-b));width:auto;padding:12px 14px 10px}
  #coach p{font-size:13.5px;margin:4px 0 6px}
  #coach h3{font-size:15px}
  .chips{margin:4px 0 8px}
  #pad{right:50%;transform:translateX(50%);bottom:calc(80px + var(--safe-b));grid-template-columns:repeat(6,1fr);width:min(420px,calc(100vw - 20px))}
  #timer{font-size:42px}
  .act{min-width:52px;height:50px;font-size:10px;padding:0 6px}
  .brand{font-size:36px}
  #home .hp{margin:0 auto;justify-content:flex-end;padding-bottom:4px}
  #target{padding:10px;top:calc(88px + var(--safe-t))}
}
@media (min-width:821px) and (max-aspect-ratio:4/5){
  #coach{left:calc(16px + var(--safe-l));right:calc(16px + var(--safe-r));top:auto;bottom:calc(92px + var(--safe-b));width:auto;max-width:720px;margin:0 auto}
  #pad{right:50%;transform:translateX(50%);bottom:calc(90px + var(--safe-b))}
  #home .hp{margin:0 auto;justify-content:flex-end;padding-bottom:24px}
  .minirow .mi{flex:1 1 0;min-width:0;padding:10px 8px}
}
@media (max-height:500px){
  #timer{font-size:34px} #subline{margin-top:2px}
  .act{height:44px}
  #coach{top:calc(64px + var(--safe-t));bottom:auto;left:auto;width:300px;right:calc(10px + var(--safe-r));max-height:calc(100vh - 78px - var(--safe-t) - var(--safe-b));overflow-y:auto;padding:12px 14px 10px}
  #coach p{font-size:13px;margin:4px 0 6px}
  body.coachon #bar{left:calc(50% - 160px)}
  #pad{grid-template-columns:repeat(6,40px);width:auto;left:auto;right:calc(10px + var(--safe-r));transform:none;bottom:calc(66px + var(--safe-b))}
  #pad button{height:34px}
  #home .hp{justify-content:center;width:min(560px,58vw);margin-left:calc(10px + var(--safe-l));overflow-y:auto;max-height:100%}
  .brand{font-size:28px}
  .menu{grid-template-columns:1fr 1fr;gap:6px}
  #home .mi{padding:7px 10px;gap:10px;border-radius:12px}
  #home .mi .ic{width:30px;height:30px;font-size:16px;border-radius:9px}
  #home .mi .tx b{font-size:14px}
  #home .mi .tx small{font-size:11.5px;display:block;line-height:1.25}
  .minirow{margin-top:6px}
  .mi{padding:8px 12px}
  .tag{margin:4px 0 10px}
}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="gl"></canvas>
