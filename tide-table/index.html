<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Tide Table</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#2a1f3d;font-family:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;color:#3b2a22;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:default}
button{font:inherit;cursor:pointer;border:0}
#top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 18px;gap:18px;color:#fff6e6;pointer-events:none}
#top>*{pointer-events:auto}.logo{font-weight:800;letter-spacing:.22em;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.25)}.logo span{color:#ffcf7a;margin:0 4px}
#roundInfo{flex:1;font-size:14px;opacity:.92}
.tbtn button{width:38px;height:38px;border-radius:12px;background:rgba(255,246,230,.16);color:#fff6e6;font-size:18px;margin-left:8px;transition:background .15s}.tbtn button:hover{background:rgba(255,246,230,.32)}
#panel{position:fixed;top:60px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#panel>div{background:rgba(255,248,236,.93);border-radius:16px;padding:10px 12px;box-shadow:0 6px 22px rgba(30,10,30,.25)}
#players{display:flex;gap:8px;padding:8px!important}
.pl{flex:1;border-radius:12px;padding:6px 8px;border:2px solid transparent;transition:all .2s}.pl.on{border-color:currentColor;background:rgba(255,255,255,.7)}
.pl .nm{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .sc{font-size:28px;font-weight:800;line-height:1.05;color:#3b2a22}.pl .sub{font-size:11px;opacity:.75;color:#3b2a22}
#turnLbl{font-size:13px;font-weight:700;margin-bottom:6px}
#hand{display:flex;gap:7px}
.card{flex:1;min-width:0;background:#fff;border-radius:12px;padding:6px 4px 7px;text-align:center;border:2px solid #ead9c2;transition:transform .12s,border-color .12s,box-shadow .12s;color:#3b2a22}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(80,40,20,.18)}.card.sel{border-color:#e0703f;box-shadow:0 0 0 3px rgba(224,112,63,.25)}
.card canvas{width:54px;height:44px;display:block;margin:0 auto}.card .cn{font-size:12px;font-weight:700}.card .cd{font-size:10px;opacity:.7;line-height:1.2;height:24px;overflow:hidden}
.card.dis{opacity:.45}
#acts{display:flex;gap:8px;margin-top:9px}#acts button{flex:1;height:40px;border-radius:12px;font-weight:700;font-size:14px;transition:all .15s}
.pri{background:#e0703f;color:#fff}.pri:hover{background:#c95c2e}.pri:disabled{background:#d8c8b6;color:#fff;cursor:default}
.sec{background:#efe2cf;color:#5a3e2b}.sec:hover{background:#e4d2b8}.sec:disabled{opacity:.45;cursor:default}
#tideBox .h{font-weight:800;font-size:13px}#tideBox small{font-weight:400;opacity:.6}
#tideTbl{display:flex;align-items:flex-end;gap:3px;height:64px;margin:6px 0 4px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:9px;color:#6b5040}
.tbar{width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(#7cc4c9,#3c8ea0);position:relative}.tcol.st .tbar{background:linear-gradient(#8d7fb8,#4a3f78)}
.tcol.now .tbar{box-shadow:0 0 0 2px #e0703f}.tcol.past{opacity:.35}
#nextTide{font-size:12px;line-height:1.35}
#ordin{font-size:11.5px;font-style:italic;line-height:1.35;color:#6b5040;flex-shrink:1;overflow:hidden}
#tip{position:fixed;pointer-events:none;background:rgba(40,25,45,.88);color:#fff6e6;font-size:12px;padding:5px 8px;border-radius:8px;display:none;white-space:nowrap;z-index:5}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6}
#banner div{display:inline-block;background:rgba(35,22,48,.86);color:#fff6e6;padding:14px 26px;border-radius:18px;font-size:22px;font-weight:800;max-width:80vw}#banner small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:4px;font-style:italic}
#coach{position:fixed;z-index:8;pointer-events:none;display:none;max-width:280px;background:#fff6e6;color:#3b2a22;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#coach b{color:#c95c2e}#coach .cx{margin-top:7px;display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.85}#coach button{pointer-events:auto;background:#efe2cf;border-radius:8px;padding:4px 9px;font-size:11.5px}
#ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(30,16,40,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.box{background:#fff8ec;border-radius:22px;padding:26px 30px;max-width:min(620px,92vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.box h1{font-size:46px;letter-spacing:.2em;margin:4px 0 2px;color:#3b2a22}.box h1 span{color:#e0703f}.box h2{margin:0 0 10px}.box .tag{font-style:italic;opacity:.75;margin-bottom:18px;font-size:14px}
.mbtn{display:block;width:100%;margin:9px 0;padding:13px;border-radius:14px;background:#efe2cf;color:#3b2a22;font-weight:700;font-size:16px;transition:all .15s}.mbtn:hover{background:#e0703f;color:#fff;transform:translateY(-1px)}
.mbtn small{display:block;font-weight:400;font-size:12px;opacity:.75}.row3{display:flex;gap:8px}.row3 .mbtn{margin:4px 0}
.rules{text-align:left;font-size:13.5px;line-height:1.5}.rules li{margin:3px 0}
table.sc{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}table.sc td,table.sc th{padding:5px 8px;border-bottom:1px solid #ead9c2}table.sc td:first-child{text-align:left}table.sc tr.tot td{font-weight:800;font-size:18px;border:0}
.foot{font-size:11px;opacity:.55;margin-top:12px}
