<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unicorn Joust</title>
    <link rel="stylesheet" type="text/css" href="./styles.css?v=20260523c">
  </head>
  <body>
    <main class="arcade-shell">
      <canvas
        id="gameCanvas"
        width="960"
        height="540"
        aria-label="Unicorn Joust local two-player arcade game"
      ></canvas>

      <div id="screenActions" class="screen-actions">
        <button id="startButton" type="button">Start Match</button>
      </div>

      <button id="soundButton" class="sound-button" type="button" aria-pressed="false">
        Sound On
      </button>

      <p class="sr-only">
        Player one uses W, A, and D. Player two uses the arrow keys. Press P to pause.
        Xbox controllers: pad 1 rides P1, pad 2 rides P2; stick moves, A flaps, Start starts or pauses.
      </p>
    </main>

function scr(){ try { return window.unicornJoustGame.getState().screen; } catch(x){ return ''; } }
VPad.init({
  players: 2,
  map: function(slot, ctx){
    var s = scr(), menu = s === 'title' || s === 'gameover';
    var c = slot === 0 ? { l: 'KeyA', r: 'KeyD', f: 'KeyW' } : { l: 'ArrowLeft', r: 'ArrowRight', f: 'ArrowUp' };
    var m = { Left: c.l, LLeft: c.l, Right: c.r, LRight: c.r, Up: c.f, RT: c.f, X: c.f, Y: 'KeyM',
      Start: { fn: function(){ var t = scr(); if (t === 'title' || t === 'gameover') tap('Enter', 'Enter', 13); else tap('KeyP', 'p', 80); } } };
    if (menu) m.A = 'Enter'; else if (!aBlocked(slot, ctx.state, false)) m.A = c.f;
    if (menu) aBlocked(slot, ctx.state, true);
    return m;
  }
});
})();
