<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Protocol Nova</title>
<style>
:root{color-scheme:dark;--g:#00ff41;--gd:rgba(0,255,65,.18);--bg:#020a05;--r:#ff3b3b;--a:#ffb000;--c:#4fd8ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#020a05}}
:root[data-theme="light"]{--bg:#020a05}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#d8ffe2;font-family:ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.pl{position:absolute;top:max(12px,env(safe-area-inset-top));width:min(260px,38vw);font-size:12px;letter-spacing:.08em}
#p1{left:max(16px,env(safe-area-inset-left))}
#p2{left:calc(max(16px,env(safe-area-inset-left)) + min(280px,40vw));display:none}
.bar{height:9px;border:1px solid var(--gd);margin:3px 0 6px;background:rgba(0,0,0,.45);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0;width:100%;background:var(--g);box-shadow:0 0 10px var(--g);transform-origin:left;transition:transform .08s}
.bar.hp>i{background:linear-gradient(90deg,#00ff41,#7dffa0)}
.bar.oc>i{background:linear-gradient(90deg,#00b7ff,#a0f0ff);box-shadow:0 0 10px #4fd8ff}
.pips span{display:inline-block;width:14px;height:6px;margin-right:4px;border:1px solid var(--g);background:var(--g);box-shadow:0 0 6px var(--g)}
.pips span.off{background:transparent;box-shadow:none;opacity:.4}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;width:min(560px,60vw)}
#lvl{font-size:13px;letter-spacing:.35em;color:var(--g);text-shadow:0 0 8px var(--g)}
#obj{font-size:12px;opacity:.85;margin-top:4px}
#prog{font-size:15px;margin-top:4px;color:#fff;letter-spacing:.12em}
#score{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));text-align:right}
#score b{display:block;font-size:22px;color:#fff;letter-spacing:.06em}
#combo{font-size:16px;color:var(--g);text-shadow:0 0 10px var(--g);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(22px,5vw,46px);letter-spacing:.25em;color:#fff;text-shadow:0 0 18px var(--g),0 0 2px var(--g);opacity:0;transition:opacity .25s;white-space:nowrap}
#msg small{display:block;font-size:clamp(11px,1.6vw,15px);letter-spacing:.2em;color:var(--g);margin-top:10px}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:#ff4fe8;text-shadow:0 0 8px #ff4fe8;opacity:0}
#fps{position:absolute;right:16px;bottom:8px;font-size:10px;opacity:.35}
#ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,30,10,.72),rgba(0,0,0,.92));padding:20px}
#ov.show{display:flex}
.panel{max-width:760px;width:100%;text-align:center}
.panel h1{font-size:clamp(34px,8vw,78px);letter-spacing:.18em;margin:0;color:#fff;text-shadow:0 0 22px var(--g),0 0 4px var(--g);font-weight:800}
.panel h2{font-size:clamp(18px,3.6vw,30px);letter-spacing:.25em;margin:0 0 6px;color:var(--g);text-shadow:0 0 10px var(--g)}
.panel p{opacity:.85;line-height:1.5;margin:8px auto 18px;max-width:600px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px}
.menu.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.it{pointer-events:auto;cursor:pointer;min-width:260px;padding:12px 18px;border:1px solid var(--gd);background:rgba(0,0,0,.5);color:#cfe;letter-spacing:.14em;font-size:15px;transition:all .12s}
.menu.row .it{width:220px;min-width:0;text-align:left;padding:14px}
.it .d{display:block;font-size:11.5px;letter-spacing:.04em;opacity:.75;margin-top:6px;line-height:1.35}
.it.sel{border-color:var(--g);color:#fff;box-shadow:0 0 16px rgba(0,255,65,.45),inset 0 0 12px rgba(0,255,65,.18);transform:scale(1.03)}
.keys{display:grid;grid-template-columns:auto auto auto;gap:6px 18px;text-align:left;font-size:12.5px;margin:12px auto;max-width:640px}
.keys b{color:var(--g)}
.note{font-size:12px;opacity:.6;margin-top:16px}
#pauseBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:50%;transform:translateX(330px);z-index:55;display:none;pointer-events:auto;width:40px;height:40px;border:1px solid var(--g);background:rgba(0,0,0,.4);color:var(--g);font:16px monospace;border-radius:8px}
@media (max-width:760px){#pauseBtn{right:12px;transform:none;top:auto;bottom:calc(env(safe-area-inset-bottom) + 50%)}#top{top:56px;width:80vw}.pl{font-size:10px}}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:20;font-size:13px;letter-spacing:.15em;color:#fff;background:rgba(0,0,0,.6);border:1px solid var(--g);padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pl" id="p1"><div>NOVA-1 INTEGRITY</div><div class="bar hp"><i></i></div><div>OVERCLOCK</div><div class="bar oc"><i></i></div><div class="pips"></div></div>
  <div class="pl" id="p2"><div style="color:#ffb000">NOVA-2 INTEGRITY</div><div class="bar hp"><i></i></div><div>OVERCLOCK</div><div class="bar oc"><i></i></div><div class="pips"></div></div>
  <div id="top"><div id="lvl"></div><div id="obj"></div><div id="prog"></div></div>
  <div id="score"><span style="font-size:11px;letter-spacing:.2em;opacity:.7">SCORE</span><b id="sc">0</b><div id="combo"></div></div>
  <div id="msg"></div>
  <div id="hint">◇ ANOMALY DETECTED · STRIKE IT</div>
  <div id="fps"></div>
</div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div id="toast"></div>
<div id="ov"></div>
