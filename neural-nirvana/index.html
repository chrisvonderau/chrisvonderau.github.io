.ui-head h2{margin:0;font-size:clamp(20px,2.6vw,30px);font-weight:900;letter-spacing:.14em;flex:1;
  background:linear-gradient(90deg,#fff,#9fe4ff 40%,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(63,199,255,.35))}
.ui-wallet{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,211,107,.35);font-variant-numeric:tabular-nums}
.ui-rankchip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);letter-spacing:.06em}
.ui-rankchip b{color:var(--g1)}
.ui-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px 6px 14px;margin:0 -6px;scrollbar-width:thin;scrollbar-color:rgba(63,199,255,.35) transparent}
.ui-body::-webkit-scrollbar{width:6px}.ui-body::-webkit-scrollbar-thumb{background:rgba(63,199,255,.35);border-radius:3px}
.ui-foot{display:flex;align-items:center;gap:12px;flex:none;padding-top:10px;border-top:1px solid rgba(120,200,255,.12)}
.ui-foot .ui-spacer{flex:1}
.ui-foot>.ui-btn:last-child{margin-right:8px}
.ui-ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:12px}
.ui-ladder div{font-size:12px;font-weight:700;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);opacity:.55;display:flex;gap:7px}
.ui-ladder div b{color:var(--g1);font-variant-numeric:tabular-nums;min-width:18px}
.ui-ladder div.on{opacity:1;border-color:rgba(63,199,255,.4);background:rgba(63,199,255,.1)}
.ui-ladder div.cur{opacity:1;border-color:var(--g1);background:rgba(255,211,107,.14);box-shadow:0 0 12px rgba(255,211,107,.3)}
.ui-hints{display:flex;gap:14px;font-size:12px;opacity:.75;letter-spacing:.05em;align-items:center}
.ui-pad{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:900;font-size:12px;color:#02040d;margin-right:5px;vertical-align:middle}
.ui-pad.a{background:#5bd75b}.ui-pad.b{background:#ff5a5a}.ui-pad.x{background:#4fa3ff}.ui-pad.y{background:#ffd34f}.ui-pad.m{background:#cfd8e6;border-radius:6px;width:auto;padding:0 5px}

/* ---------- buttons ---------- */
.ui-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;min-width:48px;padding:10px 20px;border-radius:14px;
  font-weight:800;letter-spacing:.12em;font-size:15px;color:#e8f6ff;background:rgba(9,14,36,.78);border:1px solid var(--line);
  transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
.ui-btn:active{transform:scale(.96)}
.ui-btn-primary{color:#02040d;border:0;background:linear-gradient(110deg,#3fc7ff,#8fe3ff 35%,#ffd36b 70%,#3fc7ff);background-size:250% 100%;animation:ui-shimmer 4s linear infinite,ui-pulse 1.6s ease-in-out infinite;text-shadow:0 1px 0 rgba(255,255,255,.4)}
@keyframes ui-shimmer{to{background-position:-250% 0}}
@keyframes ui-pulse{0%,100%{box-shadow:0 0 14px rgba(63,199,255,.45),0 0 0 0 rgba(63,199,255,.4)}50%{box-shadow:0 0 30px rgba(255,211,107,.55),0 0 0 6px rgba(63,199,255,0)}}
.ui-btn-big{min-height:60px;font-size:19px;padding:12px 34px;border-radius:16px}
.ui-btn-danger{border-color:rgba(255,79,109,.5);color:#ffb3c0}
.ui-btn-danger.ui-armed{background:rgba(255,79,109,.25);color:#fff;animation:ui-shake .3s}
.ui-btn[disabled],.ui-btn.ui-dis{opacity:.4;pointer-events:none}
.ui-focus{z-index:2}
.ui-btn.ui-focus,.ui-seg.ui-focus,.ui-row.ui-focus,.ui-panelnav.ui-focus,.ui-mbtn.ui-focus,.ui-tab.ui-focus{
  box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(63,199,255,.85),0 0 28px rgba(63,199,255,.6);border-color:transparent}
.ui-btn.ui-focus{transform:translateY(-2px) scale(1.04)}
.ui-btn-primary.ui-focus{box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(255,211,107,.95),0 0 40px rgba(255,211,107,.65)}
@keyframes ui-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ui-nope{animation:ui-shake .28s}

/* ---------- title ---------- */
.ui-title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;min-height:0}
.ui-title-logo{will-change:transform;position:relative;width:min(36vh,300px);height:min(36vh,300px);animation:ui-float 6s ease-in-out infinite}
.ui-title-logo::before{content:"";position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(63,199,255,.25);border-top-color:rgba(255,211,107,.8);border-right-color:transparent;animation:ui-spin 9s linear infinite;filter:drop-shadow(0 0 8px rgba(63,199,255,.6))}
.ui-title-logo::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:1px dashed rgba(255,211,107,.25);animation:ui-spin 24s linear infinite reverse}
@keyframes ui-spin{to{transform:rotate(360deg)}}
@keyframes ui-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.nn-logo{width:100%;height:100%;display:block;overflow:visible}
.ui-logo-stack{position:relative;width:100%;height:100%}
.ui-logo-stack>svg{position:absolute;inset:0}
.ui-logo-halo{z-index:0}.ui-logo-base{z-index:1;will-change:transform}.ui-logo-over{z-index:2}
.ui-logo-anim .nn-halo{animation:ui-halo 3.2s ease-in-out infinite;transform-origin:256px 300px}
@keyframes ui-halo{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
.ui-logo-anim .nn-pglow path{stroke-opacity:.28!important}
.ui-logo-anim .nn-pulses path{stroke-opacity:1;stroke-dasharray:7 93;stroke-dashoffset:100;animation:ui-trace 2.6s linear infinite}
.ui-logo-anim .nn-pulses path:nth-child(3n+2){animation-delay:-.9s;animation-duration:3.1s}
.ui-logo-anim .nn-pulses path:nth-child(3n){animation-delay:-1.7s;animation-duration:2.2s}
.ui-logo-anim .nn-pulses path:nth-child(4n){animation-direction:reverse}
@keyframes ui-trace{to{stroke-dashoffset:0}}
.ui-logo-anim .nn-sparks circle{animation:ui-twinkle 2.4s ease-in-out infinite}
.ui-logo-anim .nn-sparks circle:nth-child(2){animation-delay:-.8s}.ui-logo-anim .nn-sparks circle:nth-child(3){animation-delay:-1.6s}
@keyframes ui-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.ui-wordmark{margin:2vh 0 0;font-weight:900;font-size:clamp(34px,7.4vw,96px);line-height:.95;letter-spacing:.08em;white-space:nowrap;
  background:linear-gradient(100deg,#3fc7ff 0%,#bff0ff 28%,#ffffff 40%,#ffd36b 60%,#3fc7ff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:ui-shimmer 6s linear infinite;filter:drop-shadow(0 0 18px rgba(63,199,255,.55)) drop-shadow(0 0 2px rgba(255,255,255,.6))}
.ui-year{margin-top:.6vh;font-family:var(--mono);font-weight:800;letter-spacing:.9em;padding-left:.9em;font-size:clamp(14px,2vw,22px);color:var(--g1);text-shadow:0 0 14px rgba(255,211,107,.8)}
.ui-press{margin-top:4.5vh;font-weight:800;letter-spacing:.32em;font-size:clamp(13px,1.6vw,18px);padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(2,4,13,.4);animation:ui-blink 1.6s ease-in-out infinite;min-height:48px}
.ui-press.ui-focus{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 30px rgba(63,199,255,.5)}
@keyframes ui-blink{0%,100%{opacity:1;text-shadow:0 0 16px rgba(63,199,255,.9)}50%{opacity:.45;text-shadow:none}}
.ui-title-foot{position:absolute;left:0;right:0;bottom:calc(14px + var(--sab));display:flex;justify-content:center;gap:18px;font-size:12px;letter-spacing:.14em;opacity:.7}

/* ---------- main menu ---------- */
.ui-menu{flex:1;display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr) minmax(280px,380px);gap:24px;min-height:0;align-items:stretch}
.ui-menu-left{display:flex;flex-direction:column;min-height:0}
.ui-brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex:none}
.ui-brand .ui-mini-logo{width:54px;height:54px;flex:none}
.ui-brand b{display:block;font-size:22px;font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,#3fc7ff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.ui-brand span{font-family:var(--mono);font-size:11px;letter-spacing:.5em;color:var(--g1)}
.ui-mlist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;min-height:0;padding:6px 16px 6px 6px;margin-left:-6px}
.ui-mbtn{position:relative;display:flex;align-items:center;gap:14px;min-height:52px;padding:8px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(16,26,62,.75),rgba(9,14,36,.35));
  border:1px solid rgba(120,200,255,.14);transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s;overflow:hidden}
.ui-mbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#3fc7ff,#ffd36b);opacity:.35;transition:opacity .2s,width .2s}
.ui-mbtn b{font-size:19px;font-weight:900;letter-spacing:.14em}
.ui-mbtn small{display:block;font-size:12px;opacity:.65;letter-spacing:.04em;margin-top:2px;font-weight:600}
.ui-mbtn .ui-mtag{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:rgba(255,211,107,.16);color:var(--g1);border:1px solid rgba(255,211,107,.35);white-space:nowrap}
.ui-mbtn .ui-mtag.ok{background:rgba(93,255,194,.12);color:var(--ok);border-color:rgba(93,255,194,.35)}
.ui-mbtn.ui-focus{transform:translateX(8px);background:linear-gradient(90deg,rgba(63,199,255,.32),rgba(182,123,255,.14) 70%,rgba(9,14,36,.2))}
.ui-mbtn.ui-focus::before{opacity:1;width:6px}
.ui-mbtn.ui-hero{min-height:74px;background:linear-gradient(100deg,rgba(63,199,255,.28),rgba(255,211,107,.14));border-color:rgba(255,211,107,.35)}
.ui-mbtn.ui-hero b{font-size:28px}
.ui-dot{margin-left:auto;margin-right:6px;width:10px;height:10px;border-radius:50%;background:var(--m1);box-shadow:0 0 10px var(--m1);animation:ui-blink 1.2s infinite;flex:none}
.ui-profile{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding:4px}
.ui-panel{position:relative;background:rgba(9,14,36,.74);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.ui-panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.24em;font-weight:800;opacity:.75;display:flex;align-items:center;gap:8px}
.ui-rank{display:flex;align-items:center;gap:14px}
.ui-emblem{position:relative;width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#02040d}
.ui-emblem::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(135deg,#3fc7ff,#b67bff 55%,#ffd36b);animation:ui-shimmer 5s linear infinite;background-size:200% 200%}
.ui-emblem span{position:relative}
.ui-rank-title{font-size:20px;font-weight:900;letter-spacing:.04em}
.ui-rank-sub{font-size:12px;opacity:.7;letter-spacing:.12em;font-weight:700}
.ui-bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.ui-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#3fc7ff,#b67bff,#ffd36b);box-shadow:0 0 14px rgba(63,199,255,.7)}
.ui-bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:ui-sweep 1.8s linear infinite}
@keyframes ui-sweep{from{background-position:-60% 0}to{background-position:160% 0}}
.ui-barlbl{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums;font-weight:700}
.ui-dir{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)}
.ui-dir:first-of-type{border-top:0}
.ui-dir .ui-i{color:var(--b1);margin-top:2px;font-size:16px}
.ui-dir-t{flex:1;font-size:13.5px;font-weight:650;line-height:1.25}
.ui-dir-t small{display:block;opacity:.6;font-weight:600;margin-top:3px;font-size:11.5px}
.ui-dir-r{font-size:12px;font-weight:800;color:var(--g1);white-space:nowrap;display:flex;align-items:center;gap:4px}
.ui-minibar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.ui-minibar i{display:block;height:100%;background:linear-gradient(90deg,#3fc7ff,#5dffc2)}
.ui-teaser{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.3}
.ui-teaser .ui-lockbox{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,211,107,.12);border:1px dashed rgba(255,211,107,.5);color:var(--g1);flex:none;font-size:18px}
.ui-teaser b{color:var(--g1)}

/* ---------- setup ---------- */
.ui-setup{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.ui-setup .ui-body{padding-right:10px}
.ui-rows{display:flex;flex-direction:column;gap:8px;max-width:900px}
.ui-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:14px;padding:8px 12px;border-radius:14px;background:rgba(9,14,36,.5);border:1px solid rgba(120,200,255,.1);min-height:58px;transition:background .2s,box-shadow .2s}
.ui-row.ui-focus{background:rgba(25,40,90,.62)}
.ui-row>label{font-size:12px;font-weight:800;letter-spacing:.2em;opacity:.8;display:flex;flex-direction:column;gap:3px}
.ui-row>label small{font-size:11px;letter-spacing:.02em;opacity:.65;font-weight:600}
.ui-rowctl{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.ui-arrow{display:none;color:var(--b1);font-size:18px;opacity:.8}
.ui-row.ui-focus .ui-arrow{display:inline-flex}
.ui-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:8px 16px;border-radius:12px;font-weight:800;font-size:14px;letter-spacing:.08em;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);transition:all .18s;cursor:pointer;white-space:nowrap}
.ui-chip small{font-weight:600;opacity:.6;letter-spacing:.02em;font-size:11px}
.ui-chip.ui-on{background:linear-gradient(135deg,rgba(63,199,255,.38),rgba(182,123,255,.28));border-color:rgba(63,199,255,.8);box-shadow:0 0 16px rgba(63,199,255,.35);color:#fff}
.ui-chip.ui-off{opacity:.3;pointer-events:none}
.ui-arenas{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;touch-action:pan-x}
.ui-arenas::-webkit-scrollbar{display:none}
.ui-arena{position:relative;flex:none;width:150px;height:84px;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:2px solid rgba(255,255,255,.1);
  background:var(--bg);transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s,filter .2s;cursor:pointer}
.ui-arena::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.06) 18px 19px),linear-gradient(transparent 40%,rgba(2,4,13,.85));pointer-events:none}
.ui-arena b{position:relative;font-size:13px;font-weight:900;letter-spacing:.04em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-arena small{position:relative;font-size:10.5px;opacity:.75;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-arena.ui-on{border-color:#fff;box-shadow:0 0 0 2px var(--p),0 0 24px var(--p);transform:translateY(-2px)}
.ui-arena.ui-locked{filter:grayscale(.85) brightness(.55);cursor:default}
.ui-arena .ui-lk{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;background:rgba(2,4,13,.75);padding:3px 7px;border-radius:999px}
.ui-ava{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 6px var(--c))}
.ui-lineup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ui-pilot{display:flex;align-items:center;gap:10px;min-width:0}
.ui-pilot canvas{width:52px;height:52px;flex:none}
.ui-pilot b{font-size:16px;font-weight:900;letter-spacing:.06em}
.ui-pilot small{display:block;font-size:11.5px;opacity:.65}
.ui-sw{width:44px;height:44px;border-radius:50%;flex:none;padding:5px;background:linear-gradient(135deg,var(--a),var(--b)) content-box;border:2px solid transparent;transition:transform .15s,border-color .15s;cursor:pointer}
.ui-sw.ui-on{border-color:#fff;transform:scale(1.08);box-shadow:0 0 14px var(--a)}
.ui-preview{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.ui-pv-arena{position:relative;border-radius:18px;height:170px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:var(--bg);flex:none}
.ui-pv-arena::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-30%;height:90%;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.12) 30px 31px),repeating-linear-gradient(0deg,transparent 0 20px,rgba(255,255,255,.12) 20px 21px);transform:perspective(200px) rotateX(55deg);animation:ui-gridmove 3s linear infinite}
.ui-pv-arena .ui-pv-road{position:absolute;left:50%;bottom:-10px;width:60%;height:120%;transform:translateX(-50%) perspective(160px) rotateX(58deg);border-left:3px solid var(--p);border-right:3px solid var(--p);box-shadow:0 0 20px var(--p),inset 0 0 30px rgba(0,0,0,.5);background:linear-gradient(rgba(2,4,13,.2),rgba(2,4,13,.6))}
.ui-pv-arena .ui-pv-txt{position:absolute;left:14px;bottom:12px;right:14px}
.ui-pv-arena b{display:block;font-size:20px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px #000}
.ui-pv-arena small{font-size:12px;opacity:.8}
.ui-pv-drone{display:flex;align-items:center;justify-content:center;gap:8px}
.ui-pv-drone canvas{width:120px;height:120px;animation:ui-float 4s ease-in-out infinite}
.ui-pv-vs{font-size:12px;font-weight:800;letter-spacing:.24em;opacity:.7;text-align:center}
.ui-pv-rivals{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.ui-pv-rivals .ui-ava{width:46px;height:46px}

/* ---------- cards (roster, garage, lab) ---------- */
.ui-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:4px}
.ui-card{position:relative;border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(22,32,72,.78),rgba(9,14,36,.72));border:1px solid rgba(120,200,255,.16);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .22s cubic-bezier(.3,1.5,.5,1),box-shadow .22s,border-color .22s;overflow:hidden;min-height:44px}
.ui-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);background-size:250% 100%;background-position:150% 0;pointer-events:none;transition:none}
.ui-card.ui-focus{--rx:3deg;--ry:-4deg;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px) scale(1.035);border-color:transparent;
  box-shadow:0 0 0 2px #fff,0 0 0 5px var(--cc,rgba(63,199,255,.85)),0 12px 40px rgba(0,0,0,.5),0 0 36px var(--cc,rgba(63,199,255,.55))}
.ui-card.ui-focus::after{animation:ui-shine 1.4s ease-out}
@keyframes ui-shine{from{background-position:150% 0}to{background-position:-60% 0}}
.ui-card.ui-locked{opacity:.62}
.ui-card.ui-sel{border-color:var(--cc,#3fc7ff);background:linear-gradient(160deg,rgba(40,60,120,.85),rgba(9,14,36,.75))}
.ui-card h4{margin:0;font-size:17px;font-weight:900;letter-spacing:.06em}
.ui-card p{margin:4px 0 0;font-size:12.5px;opacity:.75;line-height:1.3}
.ui-card .ui-state{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.08em}
.ui-state.own{color:var(--ok)}.ui-state.eq{color:#02040d;background:var(--ok);padding:3px 9px;border-radius:999px;display:inline-flex}
.ui-state.buy{color:var(--g1)}.ui-state.lock{color:#9aa6bd}
.ui-card.ui-armed{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--g1),0 0 40px rgba(255,211,107,.6)}

.ui-drone canvas{width:96px;height:96px;display:block;margin:-4px auto 2px}
.ui-stats{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:8px;font-size:10.5px;font-weight:800;letter-spacing:.1em;opacity:.9}
.ui-stat{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}

.ui-skin .ui-swbig{height:58px;border-radius:12px;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 18px var(--a);margin-bottom:10px;position:relative;overflow:hidden}

.ui-skin .ui-swbig::after{content:attr(data-trail);position:absolute;right:8px;bottom:6px;font-size:10px;font-weight:900;letter-spacing:.16em;color:rgba(2,4,13,.75)}
.ui-cards.ui-skins{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ui-section{margin:18px 4px 10px;font-size:13px;font-weight:900;letter-spacing:.28em;opacity:.8;display:flex;align-items:center;gap:10px}

.ui-garage-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

.ui-tabs{display:flex;gap:8px}
.ui-tab{min-height:44px;padding:8px 16px;border-radius:12px;font-weight:800;letter-spacing:.1em;font-size:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center}
.ui-tab.ui-on{background:rgba(63,199,255,.25);border-color:var(--b1)}
.ui-perk{display:flex;flex-direction:column;gap:6px}
.ui-perk .ui-picon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--b1);background:rgba(63,199,255,.1);border:1px solid rgba(63,199,255,.35);box-shadow:0 0 18px rgba(63,199,255,.2)}

.ui-pnow{font-size:12px;font-weight:800;color:var(--ok);letter-spacing:.04em}

/* ---------- records / settings / howto ---------- */
.ui-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ui-statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ui-stat-c{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px}
.ui-stat-c b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}
.ui-stat-c span{font-size:11px;letter-spacing:.12em;opacity:.65;font-weight:700}
.ui-table{width:100%;border-collapse:collapse;font-size:14px}
.ui-table th{text-align:left;font-size:11px;letter-spacing:.18em;opacity:.6;padding:6px 8px;font-weight:800}

.ui-table td.t{font-family:var(--mono);color:var(--g1)}
.ui-table td .ui-tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--p);box-shadow:0 0 8px var(--p)}
.ui-panelnav{transition:box-shadow .2s}
.ui-slider{position:relative;flex:1;min-width:140px;max-width:420px;height:44px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.ui-slider .ui-track{position:relative;width:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.08)}
.ui-slider .ui-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#3fc7ff,#ffd36b);box-shadow:0 0 12px rgba(63,199,255,.6)}
.ui-slider .ui-knob{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(63,199,255,.9)}
.ui-sval{width:52px;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.ui-ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ui-ctrl dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:13px;align-items:center}
.ui-ctrl dt{font-weight:800;white-space:nowrap}
.ui-ctrl dd{margin:0;opacity:.8}
.ui-key{display:inline-block;min-width:22px;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);font-family:var(--mono);font-size:11.5px;text-align:center;margin-right:3px}
.ui-rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ui-rule{display:flex;flex-direction:column;gap:8px}
.ui-rule .ui-rn{font-size:32px;font-weight:900;line-height:1;background:linear-gradient(135deg,#3fc7ff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.ui-rule b{font-size:15px;letter-spacing:.06em}
.ui-rule p{margin:0;font-size:13px;opacity:.8;line-height:1.4}
.ui-stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ui-stages span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.06em}

/* ---------- daily ---------- */
.ui-daily{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.ui-daily .ui-pv-arena{height:100%;min-height:180px}
.ui-mods{display:flex;flex-direction:column;gap:8px}
.ui-mod{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,79,216,.08);border:1px solid rgba(255,79,216,.3)}
.ui-mod b{font-size:14px;letter-spacing:.06em}.ui-mod small{display:block;opacity:.75;font-size:12px}
.ui-bigdate{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--g1)}

/* ---------- pause ---------- */
.ui-pause{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ui-pause h2{margin:0 0 10px;font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:.3em;padding-left:.3em;background:linear-gradient(90deg,#3fc7ff,#fff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(63,199,255,.6))}
.ui-pause .ui-btn{width:min(340px,80vw)}

/* ---------- results ---------- */
.ui-layer{position:absolute;inset:0}
.ui-fx{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
.ui-res{flex:1;min-height:0;display:flex;flex-direction:column}
.ui-res-hero{text-align:center;flex:none;margin:0 0 8px;position:relative}
.ui-res-hero .ui-kicker{font-size:13px;letter-spacing:.5em;font-weight:800;opacity:.8;padding-left:.5em}
.ui-res-hero h1{margin:2px 0 0;font-size:clamp(30px,4.6vw,56px);font-weight:900;letter-spacing:.08em;line-height:1;
  background:linear-gradient(100deg,#ffd36b,#fff6d8 35%,#ffd36b 55%,#ff9a3d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:ui-shimmer 3s linear infinite,ui-slam .7s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px rgba(255,211,107,.7))}
.ui-res-hero h1.ui-lost{background:none;color:var(--wc,#fff);-webkit-text-fill-color:currentColor;filter:drop-shadow(0 0 18px var(--wc,#fff))}
.ui-res-hero .ui-sub{margin-top:6px;font-size:15px;opacity:.85;font-weight:600}
@keyframes ui-slam{0%{opacity:0;transform:scale(2.4);letter-spacing:.5em}60%{opacity:1;transform:scale(.94)}100%{transform:scale(1)}}
.ui-res-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
.ui-res-col{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px;touch-action:pan-y}
.ui-stand{display:flex;flex-direction:column;gap:6px}
.ui-srow{display:grid;grid-template-columns:38px 32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  opacity:0;transform:translateX(-24px);transition:opacity .35s,transform .45s cubic-bezier(.2,1.5,.4,1)}
.ui-srow.ui-in{opacity:1;transform:none}
.ui-srow.ui-me{background:linear-gradient(90deg,rgba(63,199,255,.22),rgba(63,199,255,.04));border-color:rgba(63,199,255,.5)}
.ui-srow.ui-win{background:linear-gradient(90deg,rgba(255,211,107,.28),rgba(255,211,107,.04));border-color:rgba(255,211,107,.6)}
.ui-pl{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center}
.ui-pl sup{font-size:10px}
.ui-srow .ui-ava{width:30px;height:30px}
.ui-hdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#02040d;background:var(--c);box-shadow:0 0 12px var(--c)}
.ui-sname{font-weight:900;letter-spacing:.06em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-sname small{display:block;font-weight:600;letter-spacing:.02em;font-size:11px;opacity:.65}
.ui-stg{font-size:11.5px;font-weight:900;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;background:rgba(2,4,13,.5)}
.ui-lines{display:grid;grid-template-columns:minmax(0,1fr);column-gap:26px;font-size:14px}
@media (min-width:1000px){.ui-lines{grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-size:13.5px}}
.ui-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .3s cubic-bezier(.2,1.6,.4,1);font-weight:650}
.ui-line.ui-in{opacity:1;transform:none}
.ui-line b{color:var(--g1);font-variant-numeric:tabular-nums;white-space:nowrap}
.ui-line.directive b,.ui-line.daily b{color:var(--ok)}
.ui-line.level b{color:#c9a7ff}
.ui-total{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,211,107,.25)}
.ui-total>span{font-size:12px;letter-spacing:.24em;font-weight:800;opacity:.8}
.ui-total b{font-size:30px;font-weight:900;color:var(--g1);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;text-shadow:0 0 16px rgba(255,211,107,.6)}
.ui-total b.ui-bump{animation:ui-bump .18s}
@keyframes ui-bump{50%{transform:scale(1.12)}}
.ui-xpwrap{position:relative}
.ui-xpwrap .ui-bar{height:16px}
.ui-xpnext{margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;opacity:.9}
.ui-xpnext b{color:var(--g1)}
.ui-xpnext .ui-i{color:var(--g1)}
.ui-xplvl{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:800}
.ui-xplvl .ui-lv{font-size:20px;font-weight:900}
.ui-xplvl .ui-lv b{color:var(--g1)}
.ui-xplvl .ui-xpgain{font-size:13px;color:#c9a7ff;letter-spacing:.06em}
.ui-lvflash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:28px;font-weight:900;letter-spacing:.14em;color:#fff;pointer-events:none;opacity:0;
  text-shadow:0 0 12px #ffd36b,0 0 34px #ff9a3d}
.ui-lvflash.ui-go{animation:ui-lvpop 1.6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ui-lvpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.96)}}
.ui-xpwrap.ui-flash .ui-bar{animation:ui-barflash .6s}
@keyframes ui-barflash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px #fff,0 0 40px #ffd36b}}
.ui-unlocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;perspective:900px}
.ui-ucard{position:relative;height:96px;transform-style:preserve-3d;transform:rotateY(180deg);opacity:0;transition:transform .8s cubic-bezier(.2,1.3,.3,1),opacity .2s}
.ui-ucard.ui-in{transform:rotateY(0);opacity:1}
.ui-ucard>div{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;gap:12px;padding:10px 12px;overflow:hidden}
.ui-ufront{background:linear-gradient(135deg,rgba(2,4,13,.85),rgba(2,4,13,.6)),var(--cc);border:2px solid var(--cc);box-shadow:0 0 26px var(--cc),inset 0 0 30px rgba(0,0,0,.4)}
.ui-ufront::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:ui-shine 1.6s .6s ease-out both}
.ui-uback{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#0b1430 0 10px,#101c44 10px 20px);border:2px solid rgba(63,199,255,.4);justify-content:center;font-size:34px;font-weight:900;color:var(--b1)}
.ui-ufront .ui-ava{width:56px;height:56px}
.ui-ufront canvas{width:60px;height:60px;flex:none}
.ui-uicon{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--cc);color:#02040d}
.ui-utxt{min-width:0}
.ui-utxt small{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cc);text-shadow:0 0 8px var(--cc)}
.ui-utxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:900;letter-spacing:.04em;line-height:1.15;color:#fff}
.ui-utxt span{display:block;font-size:11.5px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-rdirs .ui-dir{opacity:.55}
.ui-rdirs .ui-dir.ui-done{opacity:1}
.ui-rdirs .ui-dir.ui-done .ui-dir-t{text-decoration:line-through;text-decoration-color:rgba(93,255,194,.7)}
.ui-dir .ui-cbox .ui-i{color:inherit;margin:0;font-size:14px}
.ui-cbox{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:transparent;transition:all .3s}
.ui-dir.ui-done .ui-cbox{background:var(--ok);border-color:var(--ok);color:#02040d;transform:scale(1.15);box-shadow:0 0 14px var(--ok)}
.ui-rdirs .ui-dir.ui-newdir{opacity:1;transform:none;transition:opacity .4s,transform .4s cubic-bezier(.2,1.6,.4,1)}
.ui-rdirs .ui-dir.ui-newdir.ui-hide0:not(.ui-in){opacity:0;transform:translateX(-16px)}
.ui-dir.ui-newdir .ui-dir-t::before{content:"NEW ";color:var(--m1);font-weight:900;font-size:11px;letter-spacing:.14em}
.ui-best{display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,79,216,.3),rgba(255,211,107,.2));border:1px solid rgba(255,211,107,.6);font-weight:900;letter-spacing:.1em}
.ui-best.ui-in{display:flex;animation:ui-stamp .5s cubic-bezier(.2,1.8,.4,1) both}
.ui-best .ui-i{color:var(--g1);font-size:22px}
.ui-best span{font-family:var(--mono);color:var(--g1);margin-left:auto}
@keyframes ui-stamp{0%{opacity:0;transform:scale(1.8) rotate(-6deg)}100%{opacity:1;transform:none}}
.ui-hide0{opacity:0;transition:opacity .4s}.ui-hide0.ui-in{opacity:1}
.ui-res-foot{justify-content:center}
.ui-res-foot .ui-skiphint{position:absolute;left:0;right:0;text-align:center;bottom:calc(70px + var(--sab));font-size:12px;letter-spacing:.2em;opacity:.55;pointer-events:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){.ui-menu{grid-template-columns:minmax(260px,380px) minmax(0,1fr)} .ui-menu-mid{display:none} .ui-setup{grid-template-columns:minmax(0,1fr)} .ui-preview{display:none}}

  .ui-mbtn{min-height:44px;padding:4px 14px}.ui-mbtn b{font-size:15px}.ui-mbtn small{display:none}.ui-mbtn.ui-hero{min-height:52px}.ui-mbtn.ui-hero b{font-size:20px}
  .ui-mbtn.ui-hero small{display:block}

  .ui-btn{min-height:44px;padding:8px 16px;font-size:14px}

  .ui-res-hero{margin:0 0 6px}.ui-res-hero h1{font-size:30px}.ui-res-hero .ui-sub{font-size:13px;margin-top:4px}.ui-res-hero .ui-kicker{font-size:11px}
  .ui-res-grid{gap:10px}
  .ui-srow{padding:3px 8px}.ui-srow .ui-ava,.ui-hdot{width:26px;height:26px}.ui-pl{font-size:17px}

  .ui-pause h2{font-size:34px;margin:0}

  .ui-daily{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:10px}

  .ui-mods{gap:5px}.ui-mod{padding:5px 10px}.ui-mod small{display:inline;margin-left:6px}.ui-mod b{font-size:13px}

}
@media (max-width:700px){.ui-menu{grid-template-columns:minmax(0,1fr)} .ui-profile{display:none} .ui-res-grid{grid-template-columns:minmax(0,1fr)} .ui-daily{grid-template-columns:minmax(0,1fr)} .ui-row{grid-template-columns:minmax(0,1fr)}}
/* results panels a touch tighter */
.ui-res .ui-panel{padding:11px 14px}
