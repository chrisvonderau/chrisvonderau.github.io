.nci-a{width:var(--ba);height:var(--ba);right:calc(var(--sx) + 6px);bottom:calc(var(--sy) + 10px);border-color:rgba(201,164,92,.75);font-size:22px;letter-spacing:0;
  font-family:Didot,"Bodoni 72",Georgia,serif;color:#c9a45c}
.nci-a .l{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;color:#e9e4d8}
.nci-g{width:var(--bs);height:var(--bs);right:calc(var(--sx) + var(--ba) + 18px);bottom:calc(var(--sy) + 4px)}
.nci-c{width:var(--bs);height:var(--bs);right:calc(var(--sx) + var(--ba) * .32);bottom:calc(var(--sy) + var(--ba) + 22px)}
.nci-s{width:var(--bs);height:var(--bs);right:calc(var(--sx) + var(--ba) + 18px);bottom:calc(var(--sy) + var(--bs) + 20px)}
.nci-s.lock{border-color:#c9a45c;color:#c9a45c;box-shadow:0 0 16px rgba(201,164,92,.35)}
.nci-cy{width:auto;height:30px;border-radius:15px;padding:0 12px;right:calc(var(--sx) + var(--ba) + var(--bs) + 30px);bottom:calc(var(--sy) + 14px);font-size:9px;letter-spacing:.2em}
.nci-p{width:44px;height:44px;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);border-radius:50%}
.nci-p svg{width:40%;height:40%}
.nci-ov{width:44px;height:44px;right:calc(env(safe-area-inset-right,0px) + 64px);top:calc(env(safe-area-inset-top,0px) + 10px);border-radius:50%}
.nci-ov svg{width:46%;height:46%}
.nci-cdw{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(4,5,8,.72) var(--a,0deg),transparent 0);display:none}
.nci-g.cool .nci-cdw{display:block}.nci-g.cool svg{opacity:.5}
.nci-ov.on{border-color:rgba(201,164,92,.9);color:#c9a45c;background:rgba(201,164,92,.16)}
.nci-touch.blk .nci-base{opacity:.2}
.nci-c.off{display:none}

.nc{position:absolute;inset:0;font-family:${Ne.ui};color:${yt.ink};font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none;
  --gold:${yt.gold};--ink:${yt.ink};--dim:${yt.dim};--alarm:${yt.alarm};--bg:${yt.bg};
  --pad:clamp(14px,3.2vmin,40px);--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);pointer-events:none;overflow:hidden}

.nc-layer{position:absolute;inset:0;pointer-events:none}

.nc-dim.on{opacity:1}.nc-dim.deep{background:radial-gradient(120% 90% at 50% 40%,rgba(7,9,13,.62),rgba(5,6,9,.94) 75%)}
.nc-vig{background:radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.nc-grain{inset:-60%;opacity:.055;background-size:180px 180px;animation:ncGrain 1s steps(6) infinite;will-change:transform}
@keyframes ncGrain{0%{transform:translate(0,0)}17%{transform:translate(-4%,3%)}33%{transform:translate(3%,-5%)}50%{transform:translate(-6%,-2%)}67%{transform:translate(5%,4%)}83%{transform:translate(-2%,6%)}100%{transform:translate(0,0)}}

/* screens */
.nc-s{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto;opacity:0;transform:translateY(10px);
  transition:opacity .34s ease,transform .5s cubic-bezier(.2,.7,.2,1);
  padding:calc(var(--st) + var(--pad)) calc(var(--sr) + var(--pad)) calc(var(--sb) + var(--pad)) calc(var(--sl) + var(--pad))}
.nc-s.in{opacity:1;transform:none}.nc-s.out{opacity:0;transform:translateY(-6px);pointer-events:none}
.nc-kick{font-size:.7em;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap}
.nc-h1{font-family:${Ne.title};font-weight:400;font-size:2.5em;letter-spacing:.05em;line-height:1.05;margin:.18em 0 0;color:#f1ece0}
.nc-h2{font-family:${Ne.title};font-weight:400;font-size:1.5em;letter-spacing:.04em;line-height:1.1;margin:0;color:#f1ece0}
.nc-rule{height:1px;background:linear-gradient(90deg,rgba(201,164,92,.75),rgba(201,164,92,.18) 60%,transparent);margin:.85em 0;flex:none}
.nc-rule.c{background:linear-gradient(90deg,transparent,rgba(201,164,92,.7),transparent)}
.nc-p{color:rgba(233,228,216,.78);line-height:1.55;margin:0}
.nc-dimt{color:var(--dim)}.nc-gold{color:var(--gold)}.nc-red{color:#e2675d}
.nc-mono{font-family:${Ne.mono};letter-spacing:.02em}
.nc-cap{font-size:.68em;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);font-weight:600}
.nc-panel{background:linear-gradient(180deg,rgba(17,19,25,.80),rgba(8,9,12,.88));border:1px solid rgba(201,164,92,.2);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(233,228,216,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:2px}
.nc-head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1em}
.nc-head .l{min-width:0}
.nc-body{flex:1;min-height:0;display:flex;gap:calc(var(--pad) * .9)}
.nc-foot{flex:none;display:flex;gap:.7em;align-items:center;justify-content:flex-end;margin-top:calc(var(--pad) * .6);flex-wrap:wrap}
.nc-foot .sp{flex:1}
.nc-scroll{overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:rgba(201,164,92,.35) transparent;touch-action:pan-y}
.nc-scroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent);padding-bottom:20px}
.nc-scroll::-webkit-scrollbar{width:4px}.nc-scroll::-webkit-scrollbar-thumb{background:rgba(201,164,92,.35)}

/* focusables */
[data-f]{cursor:pointer;outline:none;position:relative;-webkit-tap-highlight-color:transparent}
[data-f].dis{opacity:.38;cursor:default}
.nc-btn{display:inline-flex;align-items:center;justify-content:center;gap:.65em;min-height:2.9em;padding:0 1.45em;border:1px solid rgba(233,228,216,.17);
  background:rgba(233,228,216,.025);color:var(--ink);font-size:.76em;letter-spacing:.26em;text-transform:uppercase;font-weight:600;white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s;border-radius:1px}
.nc-btn svg{font-size:1.35em}
.nc-btn.primary{border-color:rgba(201,164,92,.65);color:var(--gold)}
.nc-btn.f{border-color:var(--gold);background:rgba(201,164,92,.15);color:#f6efdf;box-shadow:0 0 0 1px rgba(201,164,92,.3),0 0 26px rgba(201,164,92,.14)}
.nc-btn.primary.f{background:var(--gold);color:#0b0c10}
.nc.touch .nc-btn{min-height:3.3em}
@media (hover:hover){.nc-btn:hover:not(.dis){border-color:rgba(201,164,92,.7)}}

.nc-item{display:flex;align-items:center;gap:1.1em;padding:.72em 1em .72em 1.1em;border-left:1px solid rgba(233,228,216,.08);color:rgba(233,228,216,.72);
  transition:color .2s,background .25s,border-color .2s,padding .25s}
.nc-item .n{font-family:${Ne.mono};font-size:.7em;color:var(--dim);width:1.8em;flex:none}
.nc-item .t{font-size:1.02em;letter-spacing:.26em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.nc-item .sub{display:block;font-size:.7em;letter-spacing:.08em;text-transform:none;color:var(--dim);margin-top:.3em;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-item .grow{flex:1;min-width:0}
.nc-item.f{color:#f6efdf;border-left-color:var(--gold);background:linear-gradient(90deg,rgba(201,164,92,.16),rgba(201,164,92,.03) 65%,transparent);padding-left:1.45em}
.nc-item.f .n{color:var(--gold)}
.nc.touch .nc-item{padding-top:.9em;padding-bottom:.9em}
.nc-tog{display:flex;align-items:center;gap:.55em;font-size:.72em;letter-spacing:.2em;text-transform:uppercase;flex:none}
.nc-tog span{padding:.35em .7em;border:1px solid transparent;color:var(--dim)}
.nc-tog span.on{border-color:rgba(201,164,92,.55);color:var(--gold)}
.nc-tog .ar{color:var(--dim);padding:0 .2em;border:0}

/* glyphs */
.nc-g{display:inline-flex;align-items:center;justify-content:center;min-width:1.75em;height:1.75em;border-radius:50%;border:1.5px solid currentColor;
  font:700 .7em/1 ${Ne.ui};letter-spacing:0;vertical-align:middle;margin:0 .12em;padding:0 .2em;text-transform:none}
.nc-g-a{color:#7cc47f}.nc-g-b{color:#de6a60}.nc-g-x{color:#6b9be0}.nc-g-y{color:#dcbc52}
.nc-g-w{color:#d8d2c4;border-radius:.6em;padding:0 .45em;font-size:.62em}
.nc-g-t{color:var(--gold);border-radius:1em;padding:0 .6em;font-size:.6em;letter-spacing:.14em;text-transform:uppercase}
.nc-k{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border:1px solid rgba(233,228,216,.45);
  border-radius:4px;font:600 .68em/1 ${Ne.mono};color:#efe9dc;box-shadow:inset 0 -2px 0 rgba(233,228,216,.14);vertical-align:middle;margin:0 .12em;letter-spacing:0;text-transform:none}

.nc-stars{display:inline-flex;gap:.18em;font-size:.95em;vertical-align:middle}
.nc-stars svg{color:rgba(233,228,216,.25)}.nc-stars svg.on{color:var(--gold);fill:var(--gold)}

/* title */
.nc-title{align-items:center;justify-content:center;text-align:center}
.nc-logo{font-family:${Ne.title};font-weight:400;font-size:min(10.8vw,19vh);letter-spacing:.3em;margin-right:-.3em;line-height:1;color:#f2ede1;
  text-shadow:0 0 50px rgba(201,164,92,.16);animation:ncLogo 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes ncLogo{from{letter-spacing:.55em;opacity:0;filter:blur(6px)}to{letter-spacing:.3em;opacity:1;filter:none}}
.nc-subt{display:flex;align-items:center;gap:1.4em;margin-top:1.3em;width:min(36em,82vw)}
.nc-subt i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,92,.75))}.nc-subt i:last-child{transform:scaleX(-1)}
.nc-subt b{font-weight:500;font-size:.8em;letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nc-press{margin-top:min(9vh,4.5em);font-size:.74em;letter-spacing:.42em;text-transform:uppercase;color:rgba(233,228,216,.82);animation:ncPulse 2.6s ease-in-out infinite}
@keyframes ncPulse{0%,100%{opacity:.35}50%{opacity:1}}
.nc-devs{display:flex;gap:1.6em;margin-top:1.4em;color:var(--dim);font-size:.66em;letter-spacing:.24em;text-transform:uppercase;align-items:center;flex-wrap:wrap;justify-content:center}
.nc-devs span{display:inline-flex;align-items:center;gap:.6em}.nc-devs svg{font-size:1.6em}
.nc-tag{position:absolute;bottom:calc(var(--sb) + var(--pad));left:0;right:0;text-align:center;font-family:${Ne.title};font-style:italic;color:var(--dim);font-size:.82em;letter-spacing:.06em}

/* menu */
.nc-menu{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:6vw;height:100%;min-height:0;max-width:72em;margin:0 auto;width:100%}

.nc-confirm{margin-top:.6em;padding:1em 1.1em;border:1px solid rgba(216,68,58,.45);background:rgba(216,68,58,.08)}
.nc-confirm .nc-foot{justify-content:flex-start;margin-top:.8em}

/* map */

  background:rgba(10,12,16,.55);transition:background .2s,border-color .2s}

.nc-sec>.nc-cap{margin:.2em 0 .5em;color:var(--gold)}
.nc-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:.9em;align-items:center;padding:.75em .9em;border:1px solid rgba(233,228,216,.07);
  background:rgba(10,12,16,.6);transition:background .2s,border-color .2s}
.nc-row .ic{width:2.4em;height:2.4em;border:1px solid rgba(201,164,92,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1em}
.nc-row .ic svg{font-size:1.25em}
.nc-row .ic.cr{font-family:${Ne.title};font-size:1.05em}
.nc-row .nm{font-size:.92em;letter-spacing:.05em;color:#efe9dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-row .nm small{font-size:.72em;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-left:.6em}
.nc-row .ds{font-size:.76em;color:rgba(233,228,216,.6);margin-top:.3em;line-height:1.4}
.nc-row .rt{text-align:right;white-space:nowrap}
.nc-row .pr{font-family:${Ne.mono};font-size:.85em;color:var(--gold)}
.nc-row .st{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:.35em}
.nc-row .st.on{color:var(--gold)}
.nc-row.f{border-color:rgba(201,164,92,.7);background:linear-gradient(90deg,rgba(201,164,92,.14),rgba(10,12,16,.65))}
.nc-row.locked{opacity:.5}
.nc-row.picked{border-color:rgba(201,164,92,.45)}
.nc-row.picked .ic{background:rgba(201,164,92,.18)}
.nc-flashbad{animation:ncBad .45s}
@keyframes ncBad{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* briefing */
.nc-brief{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:calc(var(--pad) * .9);flex:1;min-height:0;margin-top:calc(var(--pad) * .5)}
.nc-bp{position:relative;min-height:0;overflow:hidden;background:rgba(9,14,22,.82)}
.nc-bp canvas{position:absolute;inset:0;width:100%;height:100%}
.nc-bp .tag{position:absolute;left:.9em;top:.8em;pointer-events:none}
.nc-dos{padding:1.2em 1.3em;display:flex;flex-direction:column;gap:0}
.nc-dos .who{display:flex;align-items:center;gap:.7em}
.nc-dos .who i{width:.5em;height:.5em;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:ncPulse 1.8s infinite}
.nc-intel{list-style:none;margin:.2em 0 0;padding:0;display:flex;flex-direction:column;gap:.62em}
.nc-intel li{position:relative;padding-left:1.25em;font-size:.88em;line-height:1.5;color:rgba(233,228,216,.82)}
.nc-intel li::before{content:'';position:absolute;left:0;top:.68em;width:.6em;height:1px;background:var(--gold)}
.nc-markbox{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.8em 1em;border:1px solid rgba(201,164,92,.35);background:rgba(201,164,92,.06);margin-top:1em}
.nc-markbox .nm{font-family:${Ne.title};font-size:1.12em;color:#f1ece0}
.nc-markbox .v{font-family:${Ne.mono};color:var(--gold);font-size:1.05em;white-space:nowrap}
.nc-chips{display:flex;flex-wrap:wrap;gap:.45em;margin-top:.55em}
.nc-chip{display:inline-flex;align-items:center;gap:.55em;padding:.55em .85em;border:1px solid rgba(233,228,216,.14);font-size:.72em;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(233,228,216,.75);background:rgba(10,12,16,.5);min-height:2.9em}
.nc-chip i{width:.6em;height:.6em;border-radius:50%;flex:none}
.nc-chip svg{font-size:1.4em;color:var(--gold)}
.nc-chip.on{border-color:rgba(201,164,92,.7);color:#f6efdf;background:rgba(201,164,92,.12)}
.nc-chip.f{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,164,92,.35)}
.nc-chip .c{font-family:${Ne.mono};letter-spacing:0;color:var(--gold)}

/* pause / result / settings panels */
.nc-center{align-items:center;justify-content:center}
.nc-box{width:min(30em,100%);max-height:100%;display:flex;flex-direction:column;padding:1.6em 1.8em;min-height:0}
.nc-box .nc-mlist{margin-top:.6em}
.nc-res{width:min(46em,100%)}
.nc-big{font-family:${Ne.title};font-weight:400;font-size:3.3em;letter-spacing:.24em;margin-right:-.24em;line-height:1;text-align:center;color:#f2ede1}
.nc-big.bad{color:#e06a5f}
.nc-quote{text-align:center;font-family:${Ne.title};font-style:italic;color:rgba(233,228,216,.72);margin-top:.7em;font-size:1em}
.nc-resgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.6em;margin-top:.4em}
.nc-ledger{display:flex;flex-direction:column}
.nc-ledger .r{display:flex;justify-content:space-between;align-items:baseline;padding:.55em 0;border-bottom:1px solid rgba(233,228,216,.07);font-size:.9em;gap:1em}
.nc-ledger .r span:first-child{font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.nc-ledger .r .nc-mono{color:#efe9dc}
.nc-ledger .r.tot{border-bottom:0;border-top:1px solid rgba(201,164,92,.5);margin-top:.2em}
.nc-ledger .r.tot .nc-mono{color:var(--gold);font-size:1.25em}
.nc-starrow{display:flex;align-items:center;gap:.8em;padding:.5em 0;font-size:.86em;color:rgba(233,228,216,.45)}
.nc-starrow svg{font-size:1.35em;color:rgba(233,228,216,.22)}
.nc-starrow.on{color:#efe9dc}.nc-starrow.on svg{color:var(--gold);fill:var(--gold)}
.nc-starrow.new svg{animation:ncStar .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes ncStar{0%{transform:scale(2.4) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.nc-newbest{display:inline-block;margin-left:.6em;padding:.15em .55em;border:1px solid var(--gold);color:var(--gold);font-size:.62em;letter-spacing:.2em;text-transform:uppercase;vertical-align:middle}
.nc-sl{display:grid;grid-template-columns:minmax(6em,1fr) auto 2.6em;gap:1em;align-items:center;padding:.85em .9em;border:1px solid rgba(233,228,216,.07);background:rgba(10,12,16,.5);margin-top:.4em}
.nc-sl .lb{font-size:.76em;letter-spacing:.24em;text-transform:uppercase}
.nc-sl .tr{display:flex;gap:3px;align-items:center;height:1.6em}
.nc-sl .tr b{width:.8em;height:.9em;background:rgba(233,228,216,.12);transition:background .15s,height .15s}
.nc-sl .tr b.on{background:var(--gold);height:1.2em}
.nc-sl .vl{font-family:${Ne.mono};font-size:.85em;color:var(--gold);text-align:right}
.nc-sl.f{border-color:rgba(201,164,92,.7);background:rgba(201,164,92,.1)}
.nc-sl .nc-tog{justify-self:end}

/* how to play */
.nc-tabs{display:flex;gap:.4em;flex:none}
.nc-tab{padding:.7em 1.2em;font-size:.72em;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid rgba(233,228,216,.1);min-height:3em;display:flex;align-items:center}
.nc-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.nc-tab.f{color:#f6efdf;background:rgba(201,164,92,.12)}
.nc-how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;padding:.2em .3em 1em 0}
.nc-card{padding:1em 1.1em;border:1px solid rgba(233,228,216,.08);background:rgba(10,12,16,.6)}
.nc-card h3{margin:0 0 .7em;display:flex;align-items:center;gap:.6em;font-weight:600;font-size:.72em;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.nc-card h3 svg{font-size:1.7em}
.nc-kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5em 1em;align-items:center;font-size:.82em}
.nc-kv .k{color:rgba(233,228,216,.7)}.nc-kv .v{text-align:right;white-space:nowrap;color:#efe9dc;font-size:.95em}
.nc-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9em;padding:.2em .3em 1em 0}
.nc-rules .nc-card p{margin:0;font-size:.84em;line-height:1.55;color:rgba(233,228,216,.78)}
.nc-rules .nc-card.wide{grid-column:1/-1}

/* HUD */
.nc-hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
  padding:calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + 14px) calc(var(--sl) + 16px);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.nc-hud.on{opacity:1}
.nc-hud.paused .h-bc,.nc-hud.paused .h-hint{display:none}
.nc-hud>div{position:absolute}
.h-tl{left:calc(var(--sl) + 16px);top:calc(var(--st) + 14px)}
.h-tl .nm{font-size:.66em;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
.h-tl .ck{font-family:${Ne.mono};font-size:.86em;color:rgba(233,228,216,.85);margin-top:.35em}
.h-tl .ck span{color:var(--dim);margin-left:.6em}
.h-tc{left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);text-align:center;width:min(16em,40vw)}
.h-al .lb{display:flex;justify-content:space-between;font-size:.6em;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:600}
.h-al .bar{height:3px;background:rgba(233,228,216,.12);margin-top:.45em;position:relative;overflow:hidden}
.h-al .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#c9a45c,#e08a3c 55%,#d8443a);transition:width .25s}
.h-al.hot .lb span:last-child{color:#e2675d}
.h-ld{display:none;color:#e86257}
.h-ld .w{font-family:${Ne.title};font-size:1.05em;letter-spacing:.5em;margin-right:-.5em}
.h-ld .n{font-family:${Ne.mono};font-size:2.1em;line-height:1.05;letter-spacing:.04em;color:#f0e6da}
.h-ld.tick .n{animation:ncTick .5s}
@keyframes ncTick{0%{transform:scale(1.18);color:#ff7a6c}100%{transform:none}}
.nc-hud.lock .h-al{display:none}.nc-hud.lock .h-ld{display:block}
.h-tr{right:calc(var(--sr) + 16px);top:calc(var(--st) + 14px);text-align:right}
.h-tr .lb{font-size:.6em;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:600}
.h-tr .tk{font-family:${Ne.mono};font-size:1.45em;color:#f0e8d8;line-height:1.1}
.h-tr .mk{font-size:.7em;letter-spacing:.06em;color:rgba(233,228,216,.7);margin-top:.3em;display:flex;gap:.45em;align-items:center;justify-content:flex-end}
.h-tr .mk svg{color:var(--gold);font-size:1.15em}
.h-tr .mk.got{color:var(--gold)}.h-tr .mk.lost{color:#e2675d}
.h-bl{left:calc(var(--sl) + 16px);bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;gap:.55em}
.h-tray{display:flex;align-items:center;gap:.4em}
.h-tray .who{font-size:.58em;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);width:4.8em;font-weight:600}
.h-gd{display:flex;align-items:center;gap:.35em;padding:.38em .6em;border:1px solid rgba(233,228,216,.12);background:rgba(8,10,13,.55);font-size:.8em;color:rgba(233,228,216,.55)}
.h-gd svg{font-size:1.25em}.h-gd b{font-family:${Ne.mono};font-weight:400;font-size:.9em}
.h-gd.sel{border-color:var(--gold);color:#f3ead7;background:rgba(201,164,92,.14)}
.h-gd.sel svg{color:var(--gold)}
.h-gd.zero{opacity:.35}
.h-gd.pas{border-style:dashed;padding:.38em .45em}
.h-tray .gl{font-size:.75em;margin-left:.3em;display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
.h-tray .gl em{font-style:normal;font-size:.9em;letter-spacing:.2em;text-transform:uppercase;color:rgba(233,228,216,.75)}
.h-bc{left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.55em;width:min(36em,62vw)}
.h-pr{display:flex;align-items:center;gap:.7em;padding:.5em 1.1em .5em .6em;background:rgba(8,10,13,.68);border:1px solid rgba(201,164,92,.3);
  font-size:.84em;letter-spacing:.08em;color:#f0e9da;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;white-space:nowrap}
.h-pr.on{opacity:1;transform:none}
.h-pr .who{font-size:.68em;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-right:.2em}
.h-pr.bad{border-color:rgba(216,68,58,.6);color:#f0b2aa}
.h-ring{width:2.3em;height:2.3em;flex:none;margin:-.2em 0}
.h-ring circle{stroke-width:3.4;fill:none}
.h-ring .bg{stroke:rgba(233,228,216,.15)}.h-ring .fg{stroke:var(--gold);stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:50% 50%}
.h-sub{max-width:100%;text-align:center;padding:.5em 1.1em;background:linear-gradient(90deg,transparent,rgba(5,6,9,.72) 15%,rgba(5,6,9,.72) 85%,transparent);
  font-size:.9em;line-height:1.45;color:#ece6d9;opacity:0;transition:opacity .3s}
.h-sub.on{opacity:1}
.h-sub b{font-weight:600;font-size:.72em;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-right:.8em}
.h-br{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:.5em}
.h-mm{position:relative;border:1px solid rgba(201,164,92,.3);background:rgba(6,8,11,.65);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.h-mm canvas{display:block;width:100%;height:100%}
.h-crew{display:flex;flex-direction:column;gap:.3em;align-items:flex-end}
.h-cm{display:flex;align-items:center;gap:.5em;font-size:.66em;letter-spacing:.16em;text-transform:uppercase;padding:.3em .6em;background:rgba(8,10,13,.6);border:1px solid rgba(233,228,216,.08)}
.h-cm i{width:.55em;height:.55em;border-radius:50%}
.h-cm .s{color:var(--dim);letter-spacing:.12em}
.h-cm.caught{opacity:.45;text-decoration:line-through}
.h-crewhint{font-size:.62em;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.h-hint{left:50%;top:calc(var(--st) + 4.4em);transform:translateX(-50%);max-width:min(30em,86vw);padding:.65em 1.1em;border-left:2px solid var(--gold);
  background:linear-gradient(90deg,rgba(8,10,13,.8),rgba(8,10,13,.55));font-size:.86em;line-height:1.45;opacity:0;transition:opacity .4s}
.h-hint.on{opacity:1}
.h-hint .k{display:block;font-size:.66em;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.25em;font-weight:600}
.nc-hud.touch .h-bl{display:none}
.nc-hud.touch .h-tr{right:calc(var(--sr) + 68px)}
.nc-hud.touch .h-br{top:calc(var(--st) + 66px);bottom:auto;right:calc(var(--sr) + 14px)}
.nc-hud.touch .h-bc{bottom:calc(var(--sb) + 14px);width:min(30em,46vw)}
.nc-hud.touch .h-crewhint{display:none}
.nc-hud.compact .h-tc{width:min(12em,34vw)}
.nc-hud.compact .h-hint{top:calc(var(--st) + 3.6em)}

/* big moments, flashes, toasts */
.nc-cine{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
.nc-cine.on{animation:ncCine 2.6s ease both}
@keyframes ncCine{0%{opacity:0;letter-spacing:.7em}14%{opacity:1}80%{opacity:1}100%{opacity:0}}
.nc-cine .t{font-family:${Ne.title};font-size:min(3.4em,9vw);letter-spacing:.34em;margin-right:-.34em;color:#f2ede1;text-shadow:0 0 40px rgba(0,0,0,.9)}
.nc-cine.gold .t{color:#e3c27e}.nc-cine.red .t{color:#ec6a5e}
.nc-cine .s{margin-top:.8em;font-size:.72em;letter-spacing:.36em;text-transform:uppercase;color:rgba(233,228,216,.8);text-shadow:0 1px 6px #000}
.nc-cine .r{width:min(22em,60vw);height:1px;margin:.9em auto 0;background:linear-gradient(90deg,transparent,rgba(201,164,92,.8),transparent)}
.nc-flash{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px rgba(216,68,58,.55)}
.nc-flash.gold{box-shadow:inset 0 0 140px 30px rgba(201,164,92,.38)}
.nc-flash.on{animation:ncFlash .9s ease-out}
@keyframes ncFlash{0%{opacity:1}100%{opacity:0}}
.nc-toasts{position:absolute;left:50%;top:calc(var(--st) + 5.2em);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4em;pointer-events:none}
.nc-toast{padding:.5em 1.1em;background:rgba(8,10,13,.82);border:1px solid rgba(201,164,92,.35);font-size:.7em;letter-spacing:.24em;text-transform:uppercase;
  color:#efe7d6;white-space:nowrap;animation:ncToast 2.8s ease both}
.nc-toast.bad{border-color:rgba(216,68,58,.55);color:#f0b2aa}
@keyframes ncToast{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
.nc-rot{position:absolute;left:50%;top:calc(var(--st) + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:.7em;padding:.55em 1em;
  background:rgba(8,10,13,.85);border:1px solid rgba(201,164,92,.35);font-size:.66em;letter-spacing:.2em;text-transform:uppercase;color:rgba(233,228,216,.85);
  pointer-events:none;opacity:0;transition:opacity .6s;white-space:nowrap;z-index:5}
.nc-rot svg{font-size:1.8em;color:var(--gold);animation:ncRot 2.4s ease-in-out infinite}
@keyframes ncRot{0%,30%{transform:none}60%,100%{transform:rotate(-90deg)}}
.nc-rot.on{opacity:1}

/* responsive */
.nc.short .nc-h1{font-size:1.85em}
.nc.short .nc-rule{margin:.5em 0}
.nc.short .nc-box{padding:1em 1.3em}
.nc.short .nc-big{font-size:2.3em}
.nc.short .nc-item{padding-top:.5em;padding-bottom:.5em}
.nc.short.touch .nc-item{padding-top:.62em;padding-bottom:.62em}
.nc.short .nc-brand .nc-p{margin-top:1em}
.nc.short .nc-mus{padding:.55em .8em}
.nc.short .nc-row{padding:.55em .8em}
.nc.short .nc-dos{padding:.9em 1em}
.nc.short .nc-foot{margin-top:.6em}
.nc.short .nc-starrow{padding:.25em 0}
.nc.short .nc-ledger .r{padding:.35em 0}
.nc.short .nc-quote{margin-top:.35em}
.nc.narrow .nc-menu{grid-template-columns:1fr;gap:2.2em;align-content:center}
.nc.narrow .nc-brand{text-align:center}
.nc.narrow .nc-brand .nc-logo{font-size:min(11vw,9vh);text-align:center;letter-spacing:.24em;margin-right:-.24em}
.nc.narrow .nc-brand .nc-subt{justify-content:center}.nc.narrow .nc-brand .nc-subt i:first-child{display:block}
.nc.narrow .nc-brand .nc-p{margin:1em auto 0;font-size:.95em}
.nc.narrow .nc-mapbody{grid-template-columns:1fr;grid-template-rows:minmax(9em,30%) minmax(0,1fr)}
.nc.narrow .nc-city{order:-1}
.nc.narrow .nc-shop{grid-template-columns:1fr}
.nc.narrow .nc-brief{grid-template-columns:1fr;grid-template-rows:minmax(10em,34%) minmax(0,1fr)}
.nc.narrow .nc-how{grid-template-columns:1fr}
.nc.narrow .nc-rules{grid-template-columns:1fr}
.nc.narrow .nc-resgrid{grid-template-columns:1fr;gap:.6em}
.nc.narrow .nc-big{font-size:2.4em;letter-spacing:.16em;margin-right:-.16em}
.nc.narrow .nc-h1{font-size:1.9em}
.nc.narrow .nc-foot{justify-content:stretch}.nc.narrow .nc-foot .nc-btn{flex:1}
.nc.narrow .nc-foot .sp{display:none}
.nc.narrow .nc-head{flex-wrap:wrap}
.nc.mid .nc-how{grid-template-columns:repeat(2,minmax(0,1fr))}
.nc.mid .nc-how .nc-card:last-child{grid-column:1/-1}

.nc.narrow .nc-title .nc-logo{font-size:min(10.5vw,15vh);letter-spacing:.2em;margin-right:-.2em}
.nc-hud.narrow .h-tc{top:calc(var(--st) + 4.2em);width:min(12em,40vw)}
.nc-hud.narrow .h-tr .mk{display:none}
.nc-hud.narrow .h-hint{top:34%}
.nc-hud.narrow.touch .h-bc{bottom:calc(var(--sb) + 230px);width:92vw}
.nc-hud.narrow:not(.touch) .h-bc{width:92vw}
.nc-rot.mid{top:44%}

/* ---------- v2: radial quick actions ---------- */
.nc-rad{position:absolute;inset:0;z-index:40;pointer-events:auto;touch-action:none;opacity:0;transition:opacity .14s ease;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(5,6,9,.18),rgba(5,6,9,.38) 70%)}
.nc-rad.on{opacity:1}.nc-rad.out{opacity:0;transition:opacity .16s}
.nc-rad .rr{position:absolute;transform:scale(.86);transition:transform .2s cubic-bezier(.2,.8,.2,1.15)}
.nc-rad.on .rr{transform:none}
.nc .nc-rad svg.rg{position:absolute;left:0;top:0;width:100%;height:100%;stroke:none;overflow:visible;filter:drop-shadow(0 10px 28px rgba(0,0,0,.6))}
.nc-rad .rg .halo{fill:none;stroke:rgba(201,164,92,.22);stroke-width:1}
.nc-rad .rg .w{fill:rgba(9,11,15,.86);stroke:rgba(201,164,92,.42);stroke-width:1;transition:fill .12s,stroke .12s}
.nc-rad .rg .w.hl{fill:rgba(42,34,20,.92);stroke:#d9b56e;stroke-width:1.4}
.nc-rad .rg .w.dis{fill:rgba(9,11,15,.7);stroke:rgba(233,228,216,.12)}
.nc-rad .rg .w.dis.hl{stroke:rgba(233,228,216,.35);fill:rgba(20,20,22,.85)}
.nc-rad .rg .hubc{fill:rgba(6,7,10,.9);stroke:rgba(201,164,92,.55);stroke-width:1}
.nc-rad .lb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;
  pointer-events:none;color:#ece5d6;width:calc(var(--ro) * .62);gap:.18em}
.nc-rad .lb svg{width:1.6em;height:1.6em;color:var(--gold)}
.nc-rad .lb b{font-weight:600;font-size:.7em;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
.nc-rad .lb em{font-style:normal;font-size:.62em;letter-spacing:.06em;color:rgba(233,228,216,.5);line-height:1.15}
.nc-rad .lb em.h{color:rgba(201,164,92,.75)}
.nc-rad .lb .n{position:absolute;top:-1.15em;font-family:${Ne.mono};font-size:.58em;color:rgba(233,228,216,.38)}
.nc-rad.touch .lb .n{display:none}
.nc-rad .lb.hl b{color:#fff6e2}.nc-rad .lb.hl svg{color:#efcd86}
.nc-rad .lb.dis{color:rgba(233,228,216,.42)}.nc-rad .lb.dis svg{color:rgba(233,228,216,.3)}
.nc-rad .lb.dis em{color:rgba(226,140,120,.75)}
.nc-rad .lb.no{animation:ncNo .32s}
@keyframes ncNo{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
.nc-rad .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:.4em}
.nc-rad .hub .t{font-family:${Ne.title};font-size:.9em;line-height:1.1;color:#f0e6d2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nc-rad .hub .s{font-size:.56em;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:.35em;white-space:nowrap}
.nc-rad .hub .x{margin-top:.3em;color:rgba(233,228,216,.35)}.nc-rad .hub .x svg{width:.85em;height:.85em}
.nc-rad .pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1.5px solid #e3c27e;box-shadow:0 0 12px rgba(227,194,126,.6);pointer-events:none}
.nc-rad .pt::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#e3c27e}

/* ---------- v2: HUD additions ---------- */
.h-gd{position:relative;overflow:hidden}
.h-gd .cd{position:absolute;inset:0;background:conic-gradient(rgba(4,5,8,.78) var(--a,0deg),transparent 0);pointer-events:none}
.h-gd .cdn{position:absolute;right:.25em;bottom:.1em;font-family:${Ne.mono};font-size:.62em;color:#efcd86}
.h-gd.cool svg{opacity:.55}
.h-gd.deny{animation:ncDeny .35s}
@keyframes ncDeny{0%,100%{transform:none}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.h-seal{margin-top:.5em;display:none;font-size:.62em;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#e9b07a;white-space:nowrap;
  padding:.35em .9em;border:1px solid rgba(233,150,90,.45);background:rgba(30,14,8,.6)}
.h-seal.on{display:inline-block}
.nc-hud.narrow .h-seal{white-space:normal;letter-spacing:.18em;line-height:1.35}
.h-seal b{font-family:${Ne.mono};font-weight:400;letter-spacing:.06em;color:#f6d3b0;margin-left:.6em}
.h-ord{display:none;align-items:center;gap:.6em;font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:rgba(233,228,216,.82);
  padding:.35em .9em;border:1px dashed rgba(201,164,92,.45);background:rgba(8,10,13,.55)}
.h-ord.on{display:flex}
.h-ord i{width:.5em;height:.5em;border-radius:50%;background:var(--gold);animation:ncPulse 1.2s infinite}
.h-ord .who{color:var(--gold)}
.h-view{display:none;margin-top:.6em;gap:.4em}
.h-view.on{display:flex}
.h-chip{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:.45em;font-size:.62em;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
  padding:.5em .9em;border:1px solid rgba(201,164,92,.55);background:rgba(8,10,13,.72);color:#f0e6d2;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.h-chip svg{color:var(--gold);font-size:1.3em}
.h-chip:hover{background:rgba(201,164,92,.18)}
.h-chip.ovw{border-style:dashed;color:var(--gold);cursor:default}
.nc-hud.touch .h-chip{font-size:.7em;padding:.75em 1.1em;min-height:40px}
.nc-hud.on:not(.paused){z-index:21}
.nc-hud.touch .h-tr{right:calc(var(--sr) + 124px)}

/* ---------- v2: ratings, badges, perks ---------- */
.nc-plate{margin:.9em auto .2em;display:flex;align-items:center;gap:1em;justify-content:center;padding:.7em 1.6em;max-width:30em;
  border-top:1px solid rgba(201,164,92,.5);border-bottom:1px solid rgba(201,164,92,.5);

@keyframes ncPlate{from{opacity:0;transform:scale(1.12);letter-spacing:.6em}to{opacity:1;transform:none}}
.nc-plate svg{font-size:2.1em;color:var(--gold)}
.nc-plate .w{font-family:${Ne.title};font-size:1.7em;letter-spacing:.42em;margin-right:-.42em;color:#f3e7cc;line-height:1}
.nc-plate .y{font-size:.72em;letter-spacing:.06em;color:rgba(233,228,216,.7);margin-top:.35em}
.nc-plate.ghost .w{color:#d6e4ea}.nc-plate.ghost svg{color:#a9c8d4}
.nc-plate.brawler .w{color:#efc19a}.nc-plate.brawler svg{color:#e09a6a}
.nc-plate .bn{font-family:${Ne.mono};color:var(--gold);font-size:.62em;letter-spacing:.04em;margin-left:.9em;white-space:nowrap;vertical-align:middle}
.nc-badges{display:inline-flex;gap:.3em;margin-right:.5em}
.nc-badge{display:inline-flex;align-items:center;gap:.25em;font-size:.62em;letter-spacing:.18em;text-transform:uppercase;padding:.15em .45em;
  border:1px solid rgba(233,228,216,.14);color:rgba(233,228,216,.28)}
.nc-badge svg{font-size:1.2em}
.nc-badge.on{border-color:rgba(201,164,92,.65);color:var(--gold)}
.nc-badge.on.g{border-color:rgba(169,200,212,.6);color:#bcd6e0}
.nc-perk{display:block;margin-top:.35em;font-size:.92em;color:rgba(201,164,92,.9)}
.nc-perk b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.85em;margin-right:.5em}
.nc-perks{margin-top:.6em;display:flex;flex-direction:column;gap:.3em;font-size:.78em;color:rgba(233,228,216,.7)}
.nc-perks b{color:var(--gold);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.88em;margin-right:.45em}
.nc-chip .free{font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-left:.3em}
