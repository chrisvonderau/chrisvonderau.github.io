<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism Hop">
<meta name="theme-color" content="#0b0c26">
<meta name="format-detection" content="telephone=no">
<title>PRISM HOP</title>

<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--f:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",system-ui,sans-serif;--ink:#e9ecff;--aqua:#8ff7ec;--deep:#0b0c26;--panel:rgba(16,16,52,.86);--line:rgba(160,170,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;color:var(--ink);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--st)) calc(14px + var(--sr)) 0 calc(14px + var(--sl));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3;text-shadow:0 2px 6px rgba(0,0,20,.7)}
#hl,#hr{display:flex;flex-direction:column;gap:4px}#hr{align-items:flex-end;margin-right:122px}
#lvName{font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
#left{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
#left b{font-size:30px;font-variant-numeric:tabular-nums;min-width:0;color:#fff}
#left .glyph{width:22px;height:22px;transform:rotate(45deg);border-radius:4px;background:#2a2f86;border:2px solid #9aa4ff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
#left.low b{color:var(--aqua);text-shadow:0 0 14px rgba(120,255,235,.8)}
#score{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#subhud{display:flex;gap:12px;align-items:center;font-size:16px;font-variant-numeric:tabular-nums;opacity:.9}
#charge{display:flex;align-items:center;gap:6px}
#charge i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd46a 50%,#c07a1a);box-shadow:0 0 12px #ffd46a}
#charge.used i{background:rgba(255,255,255,.12);box-shadow:none;border:2px solid rgba(255,255,255,.3)}
#pauseBtn{position:fixed;top:calc(10px + var(--st));right:calc(12px + var(--sr));width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:rgba(20,20,60,.55);font-size:18px;font-weight:800;letter-spacing:-2px;z-index:6;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#banner{position:fixed;left:50%;top:calc(74px + var(--st));transform:translateX(-50%);max-width:min(640px,92vw);z-index:4;pointer-events:none;background:rgba(14,14,48,.82);border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-size:17px;line-height:1.4;text-align:center;opacity:0;transition:opacity .3s;box-shadow:0 10px 40px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#banner.show{opacity:1}#banner b{color:var(--aqua)}#banner .k{display:inline-block;min-width:26px;padding:1px 7px;margin:0 2px;border-radius:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:14px;font-weight:700}
#banner.warn{border-color:rgba(255,120,140,.6)}#banner.gold{border-color:rgba(255,210,120,.7)}
#pop{position:fixed;z-index:4;pointer-events:none;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);transition:transform .8s ease-out,opacity .8s;opacity:0}
/* touch / clickable controls */
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}
.tb{position:fixed;pointer-events:auto;border-radius:50%;border:2.5px solid rgba(200,210,255,.55);background:radial-gradient(circle at 40% 35%,rgba(140,150,255,.30),rgba(20,20,70,.45));display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:transform .05s,background .05s,opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff}
.tb.on{transform:scale(.92);background:radial-gradient(circle at 40% 35%,rgba(180,255,245,.65),rgba(40,120,140,.55));border-color:#bffff4}
.tb svg{width:52%;height:52%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.tb .kh{position:absolute;bottom:6%;font-size:13px;font-weight:800;opacity:.85;letter-spacing:.04em;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tb.rescue{border-color:rgba(255,215,130,.7);background:radial-gradient(circle at 40% 35%,rgba(255,230,160,.35),rgba(80,50,20,.45))}
.tb.rescue.used{opacity:.35}
.tb.desk{opacity:.72}.tb.desk:hover{opacity:1}
/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--st)) calc(14px + var(--sr)) calc(14px + var(--sb)) calc(14px + var(--sl));background:radial-gradient(ellipse at center,rgba(10,10,40,.35),rgba(5,5,20,.78))}
.screen.clear{background:none;pointer-events:none}.screen.clear .panel,.screen.clear .menu,.screen.clear .btn{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 26px;width:min(560px,94vw);max-height:100%;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{margin:0 0 6px;font-size:28px;letter-spacing:.04em}.panel h3{margin:18px 0 6px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#a9b2ff}
.panel p{margin:6px 0;line-height:1.45;font-size:16px;opacity:.92}
.btn{display:block;width:100%;padding:14px 18px;margin:8px 0;border-radius:14px;border:1.5px solid rgba(160,240,230,.55);background:linear-gradient(180deg,rgba(80,230,215,.30),rgba(30,120,140,.30));font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn:hover,.btn:focus-visible{background:linear-gradient(180deg,rgba(110,250,235,.45),rgba(40,150,160,.45));outline:none}
.btn.alt{border-color:var(--line);background:rgba(255,255,255,.06)}.btn.small{padding:9px 12px;font-size:15px;margin:4px 0}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(160,170,255,.12);font-size:16px}
.set input[type=range]{width:44%;accent-color:#5fe6d6}
.set.vol{display:grid;grid-template-columns:1fr minmax(140px,44%) 92px;align-items:center}.set.vol input[type=range]{width:100%;margin:0}
.mute{position:relative;display:inline-flex;justify-content:center;align-items:center;cursor:pointer}.mute input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.mute span{display:inline-block;min-width:80px;text-align:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px;font-weight:700;opacity:.75}
.mute input:checked+span{background:rgba(255,120,150,.22);border-color:rgba(255,140,170,.8);opacity:1;color:#ffd4de}.mute input:focus-visible+span{outline:2px solid var(--aqua)}.set input[type=checkbox]{width:24px;height:24px;accent-color:#5fe6d6}
.set select{font:inherit;font-size:15px;background:#1c1d55;color:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.set .kb{min-width:110px;text-align:center;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer;font-size:14px}
.set .kb.cap{border-color:var(--aqua);color:var(--aqua)}
.note{font-size:13.5px!important;opacity:.7!important}
textarea{width:100%;height:90px;font:12px ui-monospace,monospace;background:#0d0e33;color:#cfe;border:1px solid var(--line);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text}
/* title */
#title{flex-direction:column;background:radial-gradient(ellipse at 50% 40%,rgba(10,10,40,0) 30%,rgba(5,5,20,.55));justify-content:space-between}
#title .logo{margin-top:3.2vh;text-align:center;animation:rise .9s cubic-bezier(.2,.8,.2,1) both,float 7s 1s ease-in-out infinite}
#title .mark{display:block;margin:0 auto 4px;width:min(7vw,44px);height:auto;filter:drop-shadow(0 0 14px rgba(120,255,235,.55))}
#title .mark .shine{animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%,100%{opacity:.15}75%{opacity:.9}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.screen{animation:scrIn .32s ease-out both}@keyframes scrIn{from{opacity:0}}
.screen .panel{animation:panelIn .34s cubic-bezier(.2,.8,.2,1) both}@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.985)}}
body.rm *,body.rm *::before{animation-duration:.01ms!important;animation-iteration-count:1!important}
#title h1{margin:0;font-size:min(13vw,104px);font-weight:900;letter-spacing:.08em;line-height:1;padding-left:.08em;background:linear-gradient(100deg,#9ffff2 0%,#e8f4ff 22%,#c9b3ff 42%,#7ff3e6 62%,#ffffff 80%,#9ffff2 100%);background-size:220% 100%;animation:shimmer 9s ease-in-out infinite;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(20,20,80,.9)) drop-shadow(0 0 30px rgba(120,255,235,.35))}
#title .tag{margin-top:12px;font-size:min(3.4vw,17px);font-weight:600;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:#cfe9ff;opacity:.85;animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
#title .tag i{display:inline-block;width:6px;height:6px;margin:0 .7em .18em;transform:rotate(45deg);background:#8ff7ec;box-shadow:0 0 8px #8ff7ec;font-style:normal}
#title .menu{width:min(380px,86vw);margin-bottom:4vh;animation:rise .9s .4s cubic-bezier(.2,.8,.2,1) both}
#title .btn.play{font-size:24px;padding:18px;letter-spacing:.08em;border-color:#bffff6;background:linear-gradient(180deg,#5fe6d6,#1f9aa8);color:#06122a;text-shadow:0 1px 0 rgba(255,255,255,.35);animation:glow 2.6s ease-in-out infinite}
#title .btn.play:hover,#title .btn.play:focus-visible{background:linear-gradient(180deg,#8ff7ec,#2bb3c0)}
@keyframes glow{50%{box-shadow:0 0 34px rgba(120,255,235,.45)}}
#title .foot{font-size:13px;opacity:.6;text-align:center;margin-top:6px}
/* level select */
.worlds{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px}
.wtab{flex:1;min-width:120px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px;text-align:left;cursor:pointer}
.wtab b{display:block;font-size:15px}.wtab.on{border-color:var(--aqua);background:rgba(95,230,214,.14)}.wtab.lock{opacity:.5}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{position:relative;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);text-align:left;cursor:pointer;min-height:118px}
.lv:hover:not(.lock),.lv:focus-visible{border-color:var(--aqua);outline:none}
.lv .n{font-size:13px;opacity:.65;letter-spacing:.14em}.lv .nm{font-size:17px;font-weight:700;margin:2px 0 6px}
.lv .md{display:flex;gap:5px;margin-top:6px}.md i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:inline-block}
.md i.on.c{background:radial-gradient(circle at 35% 30%,#e8fffb,#5fe6d2 55%,#1d8a8a);border-color:#fff}
.md i.on.p{background:radial-gradient(circle at 35% 30%,#fff,#b9a0ff 55%,#5a3fc0);border-color:#fff}
.md i.on.k{background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd46a 55%,#c07a1a);border-color:#fff}
.lv .bs{font-size:13px;opacity:.75;margin-top:4px;font-variant-numeric:tabular-nums}
.lv.lock{opacity:.45;cursor:default}.lv .lk{font-size:13px;opacity:.8}
/* results */
.medal{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);margin:6px 0}
.medal i{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.medal.on i.c{background:radial-gradient(circle at 35% 30%,#e8fffb,#5fe6d2 55%,#1d8a8a);border-color:#fff;box-shadow:0 0 16px #5fe6d2}
.medal.on i.p{background:radial-gradient(circle at 35% 30%,#fff,#b9a0ff 55%,#5a3fc0);border-color:#fff;box-shadow:0 0 16px #b9a0ff}
.medal.on i.k{background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd46a 55%,#c07a1a);border-color:#fff;box-shadow:0 0 16px #ffd46a}
.medal b{display:block;font-size:16px}.medal small{font-size:13px;opacity:.75}.medal:not(.on){opacity:.6}
.medal .new{margin-left:auto;font-size:12px;font-weight:800;color:#0b0c26;background:var(--aqua);border-radius:999px;padding:2px 8px}
.sline{display:flex;justify-content:space-between;font-size:16px;padding:3px 0;font-variant-numeric:tabular-nums}.sline.tot{font-size:22px;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.hint{font-size:14px;opacity:.75;text-align:center;margin-top:6px}
/* onboarding controls card */
#ctrlcard{position:fixed;z-index:4;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);background:rgba(14,14,48,.88);border:1px solid var(--line);border-radius:20px;padding:14px 18px;display:flex;gap:18px;align-items:center;pointer-events:none;transition:opacity .4s;max-width:94vw}
#ctrlcard .dia{position:relative;width:132px;height:100px;flex:none}
#ctrlcard .dia span{position:absolute;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 6px;white-space:nowrap}
#ctrlcard .txt{font-size:15px;line-height:1.45;max-width:300px}
#spot{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .35s;background:radial-gradient(circle at var(--x) var(--y),transparent 0,transparent 70px,color-mix(in srgb,var(--c) 22%,transparent) 84px,rgba(4,4,20,.55) 150px)}
#spot.show{opacity:1}#spot span{position:absolute;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:20px;padding:6px 14px;border-radius:999px;background:rgba(10,10,40,.85);border:1.5px solid var(--c);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.keytag{position:fixed;z-index:3;pointer-events:none;transform:translate(-50%,-50%);font:800 14px var(--f);padding:2px 8px;border-radius:7px;background:rgba(10,30,40,.72);border:1.5px solid rgba(190,255,245,.8);color:#e8fffb;white-space:nowrap}
#half,#chain{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}#half i{width:16px;height:16px;border-radius:50%;background:linear-gradient(90deg,#8ff7ec 50%,rgba(255,255,255,.15) 50%);border:2px solid #cffff8}
#chain{color:#ffe7a0;text-shadow:0 0 10px rgba(255,200,90,.6)}
.star{color:#ffe08a;text-shadow:0 0 8px rgba(255,210,110,.8)}.perfect{margin:6px 0;padding:8px 12px;border-radius:12px;background:rgba(255,220,130,.14);border:1px solid rgba(255,220,130,.6);font-weight:700;color:#ffe9b0}
.perfect .new{font-size:12px;font-weight:800;color:#0b0c26;background:#ffe08a;border-radius:999px;padding:2px 8px;margin-left:6px}
details.adv{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:6px 12px}details.adv summary{cursor:pointer;font-weight:700;padding:4px 0}
.lv.soon{display:flex;flex-direction:column;justify-content:center;opacity:.55;border-style:dashed}
#fps{position:fixed;left:calc(8px + var(--sl));bottom:calc(6px + var(--sb));font:600 12px ui-monospace,monospace;opacity:.7;z-index:20;pointer-events:none}
#fade{position:fixed;inset:0;background:#05061a;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30}
#rotateHint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;pointer-events:none}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(95,230,214,.18);border:1px solid rgba(95,230,214,.5);font-size:13px;margin-left:6px}
kbd{font:700 13px var(--f);padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.tiles div{flex:1;min-width:120px;font-size:13px;text-align:center}.tiles canvas{width:64px;height:64px;display:block;margin:0 auto 4px}

#restartBtn{position:fixed;top:calc(10px + var(--st));right:calc(72px + var(--sr));width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:rgba(20,20,60,.55);z-index:6;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
#restartBtn:active{transform:scale(.92)}#restartBtn.hidden{display:none}
#pace{font-size:14px;font-weight:800;color:#ffe7a0;opacity:0;transition:opacity .25s}#pace.show{opacity:1;animation:paceIn 1.8s ease-out}
@keyframes paceIn{0%{transform:translateY(6px) scale(.9);text-shadow:0 0 0 #ffd46a}15%{transform:none;text-shadow:0 0 14px #ffd46a}100%{text-shadow:0 0 0 transparent}}
#hud.trial #timer{color:#ffe7a0;font-weight:800}
.ahead{color:#8fffd8;font-weight:800}.behind{color:#ffb0b8;font-weight:700}
.md i.s{position:relative;border-radius:4px;transform:rotate(45deg) scale(.82)}.md i.on.s{background:radial-gradient(circle at 35% 30%,#fffbe8,#ffe08a 55%,#d49a20);border-color:#fff}
.lv .mc{float:right;font-size:12px;opacity:.8;letter-spacing:.04em}.lv .goal{font-size:12.5px;color:#bff5ee;opacity:.85;margin-top:5px;line-height:1.3}
.mtot{float:right;font-size:15px;font-weight:700;color:#ffe7a0;margin-top:6px}
.lv.trial:not(.lock){border-color:rgba(255,214,120,.55);background:linear-gradient(160deg,rgba(255,214,120,.12),rgba(255,255,255,.03))}
.ttotal{font-size:44px;font-weight:800;text-align:center;margin:4px 0 10px;font-variant-numeric:tabular-nums;color:#e8fffb;text-shadow:0 0 18px rgba(95,230,214,.5)}
.celebrate{position:relative;overflow:hidden;margin:8px 0;padding:8px 12px;border-radius:14px;border:1.5px solid rgba(255,214,120,.7);background:linear-gradient(120deg,rgba(255,214,120,.16),rgba(95,230,214,.12));display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;animation:celIn .6s cubic-bezier(.2,1.4,.4,1) both .15s}
.celebrate>b{font-size:18px;color:#ffe7a0;letter-spacing:.04em}.celebrate span{font-size:14.5px}.celebrate small{opacity:.7}
.celebrate .rays{position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,240,190,.18) 10%,transparent 12% 33%,rgba(255,240,190,.16) 35%,transparent 37% 58%,rgba(255,240,190,.18) 60%,transparent 62% 83%,rgba(255,240,190,.16) 85%,transparent 87%);animation:raySpin 6s linear infinite,rayFade 2.4s ease-out both;pointer-events:none}
@keyframes celIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}@keyframes raySpin{to{transform:rotate(360deg)}}@keyframes rayFade{0%{opacity:0}20%{opacity:1}100%{opacity:.35}}
body.rf .celebrate .rays{display:none}body.rf #pace.show{animation:none}

/* Controller prompts. Only the block for the last-used device is shown. */
.ph-pad,.ph-touch,.ph-key{display:none}
body.in-pad .ph-pad{display:revert}
body.in-touch .ph-touch{display:revert}
body.in-key .ph-key{display:revert}
p.padstart{text-align:center;font-weight:800;letter-spacing:.03em;margin:10px 0 0}
.padrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;font-weight:800;margin:6px 0 8px}
.xb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 .15em;border-radius:50%;font:900 13px/1 var(--f);color:#fff;vertical-align:-.28em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.45)}
.padrow .xb{width:30px;height:30px;font-size:16px;vertical-align:middle}
.xb.A{background:#107C10}
.xb.B{background:#E81123}
.xb.X{background:#0078D4}
.xb.Y{background:#FFB900;color:#2a2100;text-shadow:none}
.xb.M{background:#1a1a1a;border-radius:7px;width:auto;padding:0 .42em;font-size:12px}
